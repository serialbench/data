    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.727406}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006200, iterations_per_second: 161290.322618}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000661333, iterations_per_second: 1512.096774}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001641333, iterations_per_second: 609.260764}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001231333, iterations_per_second: 812.127775}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004164000, iterations_per_second: 240.153698}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.012790000, iterations_per_second: 78.186083}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010266000, iterations_per_second: 97.408923}
  generation:
