platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001056, iterations_per_second: 946700.748847}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002698, iterations_per_second: 370603.713478}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004229, iterations_per_second: 236440.156857}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000344722, iterations_per_second: 2900.891057}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001534926, iterations_per_second: 651.497206}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000967263, iterations_per_second: 1033.844983}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003490163, iterations_per_second: 286.519569}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015249193, iterations_per_second: 65.577241}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010403148, iterations_per_second: 96.124750}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002020, iterations_per_second: 495049.505086}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007216, iterations_per_second: 138579.010840}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000683140, iterations_per_second: 1463.828076}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001295180, iterations_per_second: 772.093454}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007385217, iterations_per_second: 135.405635}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013697472, iterations_per_second: 73.006172}
  xpath:
  validation:
  xslt:
