    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001135, iterations_per_second: 880979.648444}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000564755, iterations_per_second: 1770.678276}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001769539, iterations_per_second: 565.119044}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015607925, iterations_per_second: 64.070016}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033655670, iterations_per_second: 29.712675}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000386, iterations_per_second: 2587991.713691}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000369698, iterations_per_second: 2704.912933}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004859268, iterations_per_second: 205.792313}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001503, iterations_per_second: 665291.731515}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001434, iterations_per_second: 697593.302957}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001858320, iterations_per_second: 538.120453}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002029598, iterations_per_second: 492.708489}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022924956, iterations_per_second: 43.620585}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.038919449, iterations_per_second: 25.694094}
