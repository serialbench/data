    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000963, iterations_per_second: 1038961.036982}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001206458, iterations_per_second: 828.872388}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.019640000, iterations_per_second: 50.916497}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005700, iterations_per_second: 175438.596584}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000016000, iterations_per_second: 62500.000002}
