platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000729, iterations_per_second: 1372495.196477}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003983, iterations_per_second: 251079.642562}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000076551, iterations_per_second: 13063.129753}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000360871, iterations_per_second: 2771.070760}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001174596, iterations_per_second: 851.356552}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004248050, iterations_per_second: 235.402126}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000977, iterations_per_second: 1023331.969046}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000097840, iterations_per_second: 10220.768601}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001614528, iterations_per_second: 619.376065}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000003208, iterations_per_second: 311691.550243}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000292368, iterations_per_second: 3420.343060}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.003840447, iterations_per_second: 260.386356}
