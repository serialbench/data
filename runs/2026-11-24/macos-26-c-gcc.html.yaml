    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002002667, iterations_per_second: 499.334221}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004469000, iterations_per_second: 223.763706}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.023871000, iterations_per_second: 41.891835}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017225000, iterations_per_second: 58.055152}
