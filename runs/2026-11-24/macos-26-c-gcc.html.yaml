    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007500, iterations_per_second: 133333.333367}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001084000, iterations_per_second: 922.509225}
