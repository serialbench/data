platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003045, iterations_per_second: 328450.371338}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004139, iterations_per_second: 241610.089701}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001850757, iterations_per_second: 540.319350}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003951689, iterations_per_second: 253.056373}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024765412, iterations_per_second: 40.378896}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048245917, iterations_per_second: 20.727143}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001211, iterations_per_second: 825627.476379}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001169249, iterations_per_second: 855.249579}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031041231, iterations_per_second: 32.215217}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004610, iterations_per_second: 216915.034470}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007688, iterations_per_second: 130066.073598}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002995298, iterations_per_second: 333.856561}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005567836, iterations_per_second: 179.603002}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045586390, iterations_per_second: 21.936372}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.069063768, iterations_per_second: 14.479372}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001438, iterations_per_second: 695265.244726}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001442457, iterations_per_second: 693.261727}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.034424776, iterations_per_second: 29.048846}
  xpath:
  validation:
  xslt:
