platform:
  platform_string: ubuntu-24.04-rust-1.100.0
  kind: native
  os: linux
  arch: x86_64
  runtime: rust
  runtime_version: 1.100.0
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.9.0', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: yeptris-json, format: json, version: '0.6.80', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004727, iterations_per_second: 211564.093342}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000005782, iterations_per_second: 172953.527387}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001425229, iterations_per_second: 701.641795}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.005184382, iterations_per_second: 192.887009}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019521648, iterations_per_second: 51.225183}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.074635993, iterations_per_second: 13.398361}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006379, iterations_per_second: 156759.468272}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000007766, iterations_per_second: 128764.759661}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002684807, iterations_per_second: 372.466298}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.006192481, iterations_per_second: 161.486155}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.037286139, iterations_per_second: 26.819618}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.086779612, iterations_per_second: 11.523444}
  xpath:
