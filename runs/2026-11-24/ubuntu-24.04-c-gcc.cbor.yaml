    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000784, iterations_per_second: 1275510.204898}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000442597, iterations_per_second: 2259.390025}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001405487, iterations_per_second: 711.497154}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011534743, iterations_per_second: 86.694606}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.026703519, iterations_per_second: 37.448248}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000247, iterations_per_second: 4053506.280280}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000226269, iterations_per_second: 4419.524872}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.002750081, iterations_per_second: 363.625653}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001202, iterations_per_second: 832085.205060}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001179, iterations_per_second: 847960.654715}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001516099, iterations_per_second: 659.587679}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001804211, iterations_per_second: 554.258795}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.018109504, iterations_per_second: 55.219624}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031797217, iterations_per_second: 31.449293}
