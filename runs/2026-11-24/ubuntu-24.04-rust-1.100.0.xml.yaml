    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.018316846, iterations_per_second: 54.594552}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001735, iterations_per_second: 576368.876081}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001021558, iterations_per_second: 978.897259}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.014948646, iterations_per_second: 66.895691}
