platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001011, iterations_per_second: 989217.530175}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001305, iterations_per_second: 766283.526171}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000629526, iterations_per_second: 1588.497583}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001812372, iterations_per_second: 551.763104}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.016806519, iterations_per_second: 59.500721}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.039774576, iterations_per_second: 25.141688}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000295, iterations_per_second: 3388681.803893}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000283700, iterations_per_second: 3524.854335}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003505221, iterations_per_second: 285.288716}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001987, iterations_per_second: 503271.263502}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001848, iterations_per_second: 541125.541293}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001956648, iterations_per_second: 511.078042}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002357503, iterations_per_second: 424.177615}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.024297922, iterations_per_second: 41.155783}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040601749, iterations_per_second: 24.629481}
  xpath:
  validation:
  xslt:
