    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000598, iterations_per_second: 1672520.486143}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000411818, iterations_per_second: 2428.257143}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001062711, iterations_per_second: 940.989896}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.009018562, iterations_per_second: 110.882422}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.016598383, iterations_per_second: 60.246832}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000241, iterations_per_second: 4142502.082100}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000259892, iterations_per_second: 3847.747208}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003163375, iterations_per_second: 316.118070}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000886, iterations_per_second: 1128158.845472}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000906, iterations_per_second: 1103265.665034}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001315052, iterations_per_second: 760.426396}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001415253, iterations_per_second: 706.587611}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012679357, iterations_per_second: 78.868353}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.021012085, iterations_per_second: 47.591660}
