platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008100, iterations_per_second: 123456.789915}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008600, iterations_per_second: 116279.069754}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002383667, iterations_per_second: 419.521745}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007878333, iterations_per_second: 126.930400}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.032975000, iterations_per_second: 30.326005}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.095279000, iterations_per_second: 10.495492}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001382, iterations_per_second: 723693.729126}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001817385, iterations_per_second: 550.241143}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031991288, iterations_per_second: 31.258510}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011700, iterations_per_second: 85470.085437}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000013000, iterations_per_second: 76923.076848}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.004099000, iterations_per_second: 243.961942}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.011132333, iterations_per_second: 89.828428}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.059044000, iterations_per_second: 16.936522}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.138925000, iterations_per_second: 7.198128}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002005, iterations_per_second: 498653.633679}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002278683, iterations_per_second: 438.849985}
