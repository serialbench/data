platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001402, iterations_per_second: 713114.169292}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003153, iterations_per_second: 317198.502672}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004997, iterations_per_second: 200108.058283}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000476476, iterations_per_second: 2098.743063}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001639494, iterations_per_second: 609.944164}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001340286, iterations_per_second: 746.109598}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004777636, iterations_per_second: 209.308537}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016019176, iterations_per_second: 62.425183}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013568586, iterations_per_second: 73.699647}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002424, iterations_per_second: 412558.273886}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006231, iterations_per_second: 160493.034610}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000860909, iterations_per_second: 1161.563402}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001767404, iterations_per_second: 565.801487}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008695227, iterations_per_second: 115.005623}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017735874, iterations_per_second: 56.382899}
  xpath:
  validation:
  xslt:
