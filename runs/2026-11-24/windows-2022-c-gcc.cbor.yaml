    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002520, iterations_per_second: 396825.395321}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001470600, iterations_per_second: 679.994560}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003638767, iterations_per_second: 274.818391}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011743700, iterations_per_second: 85.152039}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.056153200, iterations_per_second: 17.808424}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000380, iterations_per_second: 2631578.985505}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000354067, iterations_per_second: 2824.326869}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004560400, iterations_per_second: 219.279011}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002030, iterations_per_second: 492610.838406}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003060, iterations_per_second: 326797.384989}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002231200, iterations_per_second: 448.189315}
