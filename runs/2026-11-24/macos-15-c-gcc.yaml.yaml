platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004100, iterations_per_second: 243902.438964}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010600, iterations_per_second: 94339.622627}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001604667, iterations_per_second: 623.182385}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005794333, iterations_per_second: 172.582408}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019418000, iterations_per_second: 51.498610}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.063408000, iterations_per_second: 15.770881}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002667, iterations_per_second: 374995.312756}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001286514, iterations_per_second: 777.294502}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027914667, iterations_per_second: 35.823462}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000010700, iterations_per_second: 93457.943963}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666772}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002638333, iterations_per_second: 379.027164}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008566000, iterations_per_second: 116.740602}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.052403000, iterations_per_second: 19.082877}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.083573000, iterations_per_second: 11.965587}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000003733, iterations_per_second: 267852.359690}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001637000, iterations_per_second: 610.873549}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032339333, iterations_per_second: 30.922097}
  xpath:
  validation:
  xslt:
