platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000000716, iterations_per_second: 1396648.045558}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002161, iterations_per_second: 462705.903874}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003019, iterations_per_second: 331279.401007}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000237943, iterations_per_second: 4202.693086}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001113738, iterations_per_second: 897.877507}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000711113, iterations_per_second: 1406.245605}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.002405521, iterations_per_second: 415.710360}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.012167914, iterations_per_second: 82.183355}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.007427189, iterations_per_second: 134.640441}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001390, iterations_per_second: 719372.706127}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003722, iterations_per_second: 268701.633841}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000516102, iterations_per_second: 1937.600230}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001110793, iterations_per_second: 900.257474}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004760595, iterations_per_second: 210.057776}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.008872070, iterations_per_second: 112.713268}
  xpath:
  validation:
  xslt:
