platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006435, iterations_per_second: 155390.496345}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005783, iterations_per_second: 172920.629422}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002079018, iterations_per_second: 480.996239}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004292491, iterations_per_second: 232.964961}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.028420117, iterations_per_second: 35.186344}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.053170221, iterations_per_second: 18.807520}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001483, iterations_per_second: 674536.255311}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001429873, iterations_per_second: 699.362974}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.041313249, iterations_per_second: 24.205310}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009387, iterations_per_second: 106526.903373}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007204, iterations_per_second: 138802.137561}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003945117, iterations_per_second: 253.477907}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006421114, iterations_per_second: 155.736208}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.051889676, iterations_per_second: 19.271656}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.081487809, iterations_per_second: 12.271774}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001853, iterations_per_second: 539752.792964}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001739128, iterations_per_second: 575.000695}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.045242035, iterations_per_second: 22.103338}
  xpath:
  validation:
  xslt:
