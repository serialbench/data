    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.058100000, iterations_per_second: 17.211704}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.138330000, iterations_per_second: 7.229090}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001442, iterations_per_second: 693673.695938}
