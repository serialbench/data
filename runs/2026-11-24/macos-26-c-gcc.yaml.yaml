platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005500, iterations_per_second: 181818.181713}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007800, iterations_per_second: 128205.128155}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.004315000, iterations_per_second: 231.749710}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005196667, iterations_per_second: 192.431046}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.037195000, iterations_per_second: 26.885334}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.075834000, iterations_per_second: 13.186697}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000975, iterations_per_second: 1025641.025241}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001594833, iterations_per_second: 627.024767}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020454042, iterations_per_second: 48.890092}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005300, iterations_per_second: 188679.245152}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000022500, iterations_per_second: 44444.444444}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003551000, iterations_per_second: 281.610814}
