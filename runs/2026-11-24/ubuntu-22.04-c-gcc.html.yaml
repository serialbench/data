platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001671, iterations_per_second: 598587.334010}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004427, iterations_per_second: 225891.707515}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006471, iterations_per_second: 154542.785153}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000547611, iterations_per_second: 1826.113792}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001941447, iterations_per_second: 515.079732}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001347106, iterations_per_second: 742.331897}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004548306, iterations_per_second: 219.862076}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.019296088, iterations_per_second: 51.823976}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014020998, iterations_per_second: 71.321599}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003095, iterations_per_second: 323080.899426}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008432, iterations_per_second: 118590.199707}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000852329, iterations_per_second: 1173.256326}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001715896, iterations_per_second: 582.785790}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008626713, iterations_per_second: 115.919006}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017798358, iterations_per_second: 56.184958}
  xpath:
  validation:
  xslt:
