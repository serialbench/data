platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.331649}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007600, iterations_per_second: 131578.947701}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008500, iterations_per_second: 117647.058649}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000998667, iterations_per_second: 1001.335114}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003817000, iterations_per_second: 261.985853}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002394000, iterations_per_second: 417.710944}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009545000, iterations_per_second: 104.766894}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.038092000, iterations_per_second: 26.252231}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.023858000, iterations_per_second: 41.914662}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005900, iterations_per_second: 169491.524872}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000028800, iterations_per_second: 34722.222228}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001941000, iterations_per_second: 515.198351}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003312333, iterations_per_second: 301.901982}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020452000, iterations_per_second: 48.894974}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.034571000, iterations_per_second: 28.925978}
  xpath:
  validation:
  xslt:
