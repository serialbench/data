platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000420, iterations_per_second: 2382086.708423}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002885, iterations_per_second: 346620.450526}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000058258, iterations_per_second: 17165.024544}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000308847, iterations_per_second: 3237.849162}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000897090, iterations_per_second: 1114.715357}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003733814, iterations_per_second: 267.822661}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000575, iterations_per_second: 1739735.566789}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000073744, iterations_per_second: 13560.363959}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001187204, iterations_per_second: 842.315221}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000001750, iterations_per_second: 571363.272118}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000211309, iterations_per_second: 4732.406097}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.002746442, iterations_per_second: 364.107452}
  xslt:
