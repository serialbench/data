    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002277000, iterations_per_second: 439.174352}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009297000, iterations_per_second: 107.561579}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037172000, iterations_per_second: 26.901969}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.023861000, iterations_per_second: 41.909392}
