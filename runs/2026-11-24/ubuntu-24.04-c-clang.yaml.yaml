platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004711, iterations_per_second: 212264.651757}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003475, iterations_per_second: 287744.942695}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001413890, iterations_per_second: 707.268766}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003257828, iterations_per_second: 306.952945}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019882607, iterations_per_second: 50.295215}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.039658421, iterations_per_second: 25.215326}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000846, iterations_per_second: 1181893.394183}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000914470, iterations_per_second: 1093.529585}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026115322, iterations_per_second: 38.291697}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006387, iterations_per_second: 156565.577470}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005154, iterations_per_second: 194035.353278}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002419744, iterations_per_second: 413.266801}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004597481, iterations_per_second: 217.510431}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.037442197, iterations_per_second: 26.707834}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057572580, iterations_per_second: 17.369380}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001048, iterations_per_second: 954016.409690}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001238195, iterations_per_second: 807.627232}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.030678569, iterations_per_second: 32.596044}
  xpath:
  validation:
  xslt:
