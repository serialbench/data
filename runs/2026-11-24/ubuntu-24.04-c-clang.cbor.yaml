    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000832, iterations_per_second: 1202645.820471}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000453529, iterations_per_second: 2204.932286}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001479776, iterations_per_second: 675.778108}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012022586, iterations_per_second: 83.176781}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.028783501, iterations_per_second: 34.742125}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000303, iterations_per_second: 3299241.168381}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000281917, iterations_per_second: 3547.139114}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003546637, iterations_per_second: 281.957246}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001175, iterations_per_second: 851063.829877}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001194, iterations_per_second: 837450.801984}
