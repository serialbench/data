platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.10.0', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001720, iterations_per_second: 581395.348768}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004660, iterations_per_second: 214592.274592}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006910, iterations_per_second: 144717.800250}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000460600, iterations_per_second: 2171.081198}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002151000, iterations_per_second: 464.900046}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001953300, iterations_per_second: 511.954129}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004684000, iterations_per_second: 213.492741}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.021780700, iterations_per_second: 45.912207}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019279000, iterations_per_second: 51.869910}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003530, iterations_per_second: 283286.118692}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008530, iterations_per_second: 117233.294223}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001069967, iterations_per_second: 934.608555}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002726567, iterations_per_second: 366.761617}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009317800, iterations_per_second: 107.321471}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.026463700, iterations_per_second: 37.787611}
  xpath:
  validation:
  xslt:
