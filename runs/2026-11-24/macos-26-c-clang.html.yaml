    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004660000, iterations_per_second: 214.592275}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014327000, iterations_per_second: 69.798283}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010463000, iterations_per_second: 95.574883}
