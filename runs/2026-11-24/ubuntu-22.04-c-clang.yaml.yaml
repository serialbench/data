platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002279, iterations_per_second: 438692.696185}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000002194, iterations_per_second: 455726.199549}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001099600, iterations_per_second: 909.421332}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002224883, iterations_per_second: 449.461837}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.012459955, iterations_per_second: 80.257112}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.024792588, iterations_per_second: 40.334635}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000674, iterations_per_second: 1483459.428953}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000609053, iterations_per_second: 1641.893234}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.017582971, iterations_per_second: 56.873210}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003460, iterations_per_second: 288992.283999}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003503, iterations_per_second: 285445.151804}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001563247, iterations_per_second: 639.694039}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002896444, iterations_per_second: 345.250975}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023993861, iterations_per_second: 41.677327}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.037116627, iterations_per_second: 26.942103}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000807, iterations_per_second: 1238696.890318}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000781103, iterations_per_second: 1280.240890}
