platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001360, iterations_per_second: 735294.118274}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003020, iterations_per_second: 331147.758235}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004992, iterations_per_second: 200332.552100}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000472993, iterations_per_second: 2114.194703}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001609478, iterations_per_second: 621.319588}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001343043, iterations_per_second: 744.577798}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004717848, iterations_per_second: 211.961047}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016017058, iterations_per_second: 62.433438}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013453754, iterations_per_second: 74.328697}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002332, iterations_per_second: 428834.856084}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006233, iterations_per_second: 160431.239174}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000848646, iterations_per_second: 1178.348090}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001772220, iterations_per_second: 564.263924}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008647903, iterations_per_second: 115.634970}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017667600, iterations_per_second: 56.600783}
  xpath:
  validation:
  xslt:
