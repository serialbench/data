platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005200, iterations_per_second: 192307.692373}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008700, iterations_per_second: 114942.528725}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002519000, iterations_per_second: 396.982930}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005409667, iterations_per_second: 184.854273}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.022684000, iterations_per_second: 44.083936}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.084403000, iterations_per_second: 11.847920}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002504, iterations_per_second: 399345.074748}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001098139, iterations_per_second: 910.631532}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018332375, iterations_per_second: 54.548306}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006900, iterations_per_second: 144927.536240}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010400, iterations_per_second: 96153.846134}
