    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 400000.000100}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000446667, iterations_per_second: 2238.805970}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002304667, iterations_per_second: 433.902227}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001065667, iterations_per_second: 938.379731}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004255000, iterations_per_second: 235.017626}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.021264000, iterations_per_second: 47.027840}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013106000, iterations_per_second: 76.300931}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.666732}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004600, iterations_per_second: 217391.304359}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000834000, iterations_per_second: 1199.040767}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001479333, iterations_per_second: 675.980171}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008570000, iterations_per_second: 116.686114}
