platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003031, iterations_per_second: 329924.117457}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004017, iterations_per_second: 248917.210188}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001866862, iterations_per_second: 535.658329}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003917056, iterations_per_second: 255.293750}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024971441, iterations_per_second: 40.045747}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048090505, iterations_per_second: 20.794126}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001157, iterations_per_second: 864528.399655}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001215591, iterations_per_second: 822.644891}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032034490, iterations_per_second: 31.216355}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004653, iterations_per_second: 214901.252928}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006044, iterations_per_second: 165442.393001}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003017801, iterations_per_second: 331.367148}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005554782, iterations_per_second: 180.025067}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045962864, iterations_per_second: 21.756695}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068832631, iterations_per_second: 14.527993}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001411, iterations_per_second: 708666.998157}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001501804, iterations_per_second: 665.866000}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.035371147, iterations_per_second: 28.271631}
  xpath:
  validation:
  xslt:
