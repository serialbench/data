platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004735, iterations_per_second: 211179.861828}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003499, iterations_per_second: 285812.278645}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001411536, iterations_per_second: 708.448269}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003203724, iterations_per_second: 312.136718}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019911683, iterations_per_second: 50.221772}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.039745796, iterations_per_second: 25.159894}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000997, iterations_per_second: 1002506.267338}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000970101, iterations_per_second: 1030.820502}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026126219, iterations_per_second: 38.275726}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006408, iterations_per_second: 156067.108829}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005171, iterations_per_second: 193371.234117}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002401433, iterations_per_second: 416.417973}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004522571, iterations_per_second: 221.113168}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.037007369, iterations_per_second: 27.021645}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057356523, iterations_per_second: 17.434809}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001253, iterations_per_second: 798148.295774}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001231397, iterations_per_second: 812.085785}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029469575, iterations_per_second: 33.933302}
  xpath:
  validation:
  xslt:
