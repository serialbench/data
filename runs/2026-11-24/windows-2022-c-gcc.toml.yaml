    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005600, iterations_per_second: 178571.428660}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000120567, iterations_per_second: 8294.166437}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000655700, iterations_per_second: 1525.087693}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001313400, iterations_per_second: 761.382671}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.008122200, iterations_per_second: 123.119352}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000005920, iterations_per_second: 168918.918891}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000182967, iterations_per_second: 5465.476407}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001977200, iterations_per_second: 505.765729}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000013360, iterations_per_second: 74850.299386}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000426333, iterations_per_second: 2345.582486}
