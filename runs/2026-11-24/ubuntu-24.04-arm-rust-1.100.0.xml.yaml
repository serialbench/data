    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.011749301, iterations_per_second: 85.111446}
    - {adapter: quick-xml, format: xml, data_size: large, time_per_iteration: 0.011380275, iterations_per_second: 87.871339}
