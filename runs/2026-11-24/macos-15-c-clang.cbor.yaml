platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000800, iterations_per_second: 1250000.003156}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.331490}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000537667, iterations_per_second: 1859.888407}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001275000, iterations_per_second: 784.313725}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006993000, iterations_per_second: 143.000143}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.017789000, iterations_per_second: 56.214515}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000332000, iterations_per_second: 3012.048193}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004223000, iterations_per_second: 236.798484}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.335437}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.668350}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001014333, iterations_per_second: 985.869208}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001615000, iterations_per_second: 619.195046}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012340000, iterations_per_second: 81.037277}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.024533000, iterations_per_second: 40.761423}
  xpath:
  validation:
  xslt:
