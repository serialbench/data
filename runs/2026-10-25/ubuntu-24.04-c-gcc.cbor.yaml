platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001006, iterations_per_second: 993541.977356}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000650, iterations_per_second: 1538461.535619}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000449333, iterations_per_second: 2225.522590}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001134185, iterations_per_second: 881.690636}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.008861768, iterations_per_second: 112.844299}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.024938103, iterations_per_second: 40.099281}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000240, iterations_per_second: 4161464.841994}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000217706, iterations_per_second: 4593.357698}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.002704949, iterations_per_second: 369.692737}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001217, iterations_per_second: 821760.210273}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001024, iterations_per_second: 976085.895694}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001740097, iterations_per_second: 574.680497}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001467579, iterations_per_second: 681.394478}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015062332, iterations_per_second: 66.390782}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030236974, iterations_per_second: 33.072092}
  xpath:
  xslt:
