platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001380, iterations_per_second: 724847.780977}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001190, iterations_per_second: 840194.924423}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000905086, iterations_per_second: 1104.866976}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002071908, iterations_per_second: 482.646913}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.016163404, iterations_per_second: 61.868156}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.041630617, iterations_per_second: 24.020783}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000393, iterations_per_second: 2546473.138263}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000383960, iterations_per_second: 2604.437962}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004725572, iterations_per_second: 211.614594}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434725.904865}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001688, iterations_per_second: 592346.878934}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002843074, iterations_per_second: 351.731922}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002607982, iterations_per_second: 383.438229}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.027786443, iterations_per_second: 35.988773}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.048656443, iterations_per_second: 20.552263}
  xpath:
  xslt:
