    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.005217496, iterations_per_second: 191.662808}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.040993902, iterations_per_second: 24.393872}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000026955, iterations_per_second: 37098.317962}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003875105, iterations_per_second: 258.057524}
