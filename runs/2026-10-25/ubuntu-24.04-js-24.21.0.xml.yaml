    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.035855866, iterations_per_second: 27.889440}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.022477856, iterations_per_second: 44.488229}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.435741275, iterations_per_second: 2.294940}
  generation:
