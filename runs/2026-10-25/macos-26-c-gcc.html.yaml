    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.586402}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000041400, iterations_per_second: 24154.589373}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000737333, iterations_per_second: 1356.238698}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001635000, iterations_per_second: 611.620795}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001232667, iterations_per_second: 811.249324}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008947000, iterations_per_second: 111.769308}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016471000, iterations_per_second: 60.712768}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013319000, iterations_per_second: 75.080712}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270122}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006900, iterations_per_second: 144927.536240}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000951333, iterations_per_second: 1051.156272}
