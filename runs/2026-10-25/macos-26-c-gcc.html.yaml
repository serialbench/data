platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384325}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010000, iterations_per_second: 100000.000025}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000700667, iterations_per_second: 1427.212179}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003724667, iterations_per_second: 268.480401}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001105333, iterations_per_second: 904.704463}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008327000, iterations_per_second: 120.091269}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.039091000, iterations_per_second: 25.581336}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.016258000, iterations_per_second: 61.508181}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003300, iterations_per_second: 303030.303273}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008500, iterations_per_second: 117647.058806}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000908333, iterations_per_second: 1100.917431}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002060667, iterations_per_second: 485.279845}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.016940000, iterations_per_second: 59.031877}
