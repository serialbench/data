    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000845281, iterations_per_second: 1183.039006}
    - {adapter: quick-xml, format: xml, data_size: medium, time_per_iteration: 0.000821495, iterations_per_second: 1217.292368}
    - {adapter: roxmltree, format: xml, data_size: medium, time_per_iteration: 0.002094815, iterations_per_second: 477.369199}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.011319355, iterations_per_second: 88.344256}
    - {adapter: quick-xml, format: xml, data_size: large, time_per_iteration: 0.011319283, iterations_per_second: 88.344818}
    - {adapter: roxmltree, format: xml, data_size: large, time_per_iteration: 0.029970213, iterations_per_second: 33.366463}
