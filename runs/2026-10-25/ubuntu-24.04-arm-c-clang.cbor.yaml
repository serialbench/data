platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001051, iterations_per_second: 951384.266743}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001159, iterations_per_second: 862738.333329}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000707867, iterations_per_second: 1412.694758}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001778466, iterations_per_second: 562.282221}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014666822, iterations_per_second: 68.181096}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030830063, iterations_per_second: 32.435873}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000396, iterations_per_second: 2525890.360032}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000383902, iterations_per_second: 2604.831441}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004946457, iterations_per_second: 202.164903}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001771, iterations_per_second: 564620.857154}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001429, iterations_per_second: 699545.296962}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001921763, iterations_per_second: 520.355528}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002050205, iterations_per_second: 487.756102}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.024338375, iterations_per_second: 41.087377}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033535232, iterations_per_second: 29.819385}
