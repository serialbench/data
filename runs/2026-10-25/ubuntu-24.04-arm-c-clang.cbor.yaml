platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001051, iterations_per_second: 951384.261598}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001136, iterations_per_second: 880359.183370}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000707643, iterations_per_second: 1413.142603}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001787959, iterations_per_second: 559.297046}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014318062, iterations_per_second: 69.841854}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.029163996, iterations_per_second: 34.288854}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000415, iterations_per_second: 2408477.857053}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000390233, iterations_per_second: 2562.571592}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005183389, iterations_per_second: 192.923973}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001791, iterations_per_second: 558316.119014}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001470, iterations_per_second: 680133.304579}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001877278, iterations_per_second: 532.686250}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002044467, iterations_per_second: 489.124959}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022705090, iterations_per_second: 44.042988}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032424601, iterations_per_second: 30.840780}
  xpath:
