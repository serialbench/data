    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000015900, iterations_per_second: 62893.081695}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003380333, iterations_per_second: 295.828814}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.011191000, iterations_per_second: 89.357519}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.038928000, iterations_per_second: 25.688450}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.116746000, iterations_per_second: 8.565604}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001792, iterations_per_second: 558066.859472}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.003073264, iterations_per_second: 325.386985}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.048237255, iterations_per_second: 20.730865}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000019500, iterations_per_second: 51282.051262}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000024300, iterations_per_second: 41152.263382}
