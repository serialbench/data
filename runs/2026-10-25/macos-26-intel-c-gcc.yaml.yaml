platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000027400, iterations_per_second: 36496.350366}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000017400, iterations_per_second: 57471.264363}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.004117000, iterations_per_second: 242.895312}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.017525333, iterations_per_second: 57.060256}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.035840000, iterations_per_second: 27.901786}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.151195000, iterations_per_second: 6.613975}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000004050, iterations_per_second: 246889.196663}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.006853625, iterations_per_second: 145.908194}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.072417375, iterations_per_second: 13.808841}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000027900, iterations_per_second: 35842.293910}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000023900, iterations_per_second: 41841.004190}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.007065667, iterations_per_second: 141.529462}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.018575667, iterations_per_second: 53.833869}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.073478000, iterations_per_second: 13.609516}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.185480000, iterations_per_second: 5.391417}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002197, iterations_per_second: 455228.295622}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.004238621, iterations_per_second: 235.925807}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.072456761, iterations_per_second: 13.801335}
  xpath:
  xslt:
