platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004816, iterations_per_second: 207641.195989}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004835, iterations_per_second: 206825.232617}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001870247, iterations_per_second: 534.688638}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004545658, iterations_per_second: 219.990169}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025194163, iterations_per_second: 39.691733}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055575689, iterations_per_second: 17.993479}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001287, iterations_per_second: 776759.360416}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001297034, iterations_per_second: 770.989812}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021488968, iterations_per_second: 46.535506}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006789, iterations_per_second: 147305.777309}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007024, iterations_per_second: 142366.993630}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002895588, iterations_per_second: 345.352999}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006372818, iterations_per_second: 156.916462}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040587945, iterations_per_second: 24.637857}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.079317402, iterations_per_second: 12.607574}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001625, iterations_per_second: 615384.614786}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001617509, iterations_per_second: 618.234582}
