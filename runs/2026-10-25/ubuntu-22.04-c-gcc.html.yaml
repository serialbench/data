platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001063, iterations_per_second: 941087.897146}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002455, iterations_per_second: 407381.757287}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003142, iterations_per_second: 318299.010066}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000273324, iterations_per_second: 3658.661515}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001058941, iterations_per_second: 944.339675}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000674221, iterations_per_second: 1483.192463}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.002743568, iterations_per_second: 364.488870}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.010424531, iterations_per_second: 95.927577}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.007110464, iterations_per_second: 140.637798}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001595, iterations_per_second: 626841.346381}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003893, iterations_per_second: 256884.504478}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000506932, iterations_per_second: 1972.651164}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000883206, iterations_per_second: 1132.239112}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005361768, iterations_per_second: 186.505645}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.008976614, iterations_per_second: 111.400579}
  xpath:
  xslt:
