platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001862, iterations_per_second: 537114.619891}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003877, iterations_per_second: 257938.042812}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005256, iterations_per_second: 190262.371463}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000465244, iterations_per_second: 2149.409772}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001931205, iterations_per_second: 517.811329}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001294707, iterations_per_second: 772.375725}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004410843, iterations_per_second: 226.714032}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.019387751, iterations_per_second: 51.578958}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012974161, iterations_per_second: 77.076275}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002683, iterations_per_second: 372703.216237}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006625, iterations_per_second: 150943.396413}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000928762, iterations_per_second: 1076.701718}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001689044, iterations_per_second: 592.050888}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009649363, iterations_per_second: 103.633784}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017095228, iterations_per_second: 58.495856}
  xpath:
  xslt:
