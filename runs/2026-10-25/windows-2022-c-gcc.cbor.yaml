platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.8.5', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001270, iterations_per_second: 787401.573972}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002040, iterations_per_second: 490196.078849}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001345367, iterations_per_second: 743.291792}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002817100, iterations_per_second: 354.974974}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011016200, iterations_per_second: 90.775403}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.042091600, iterations_per_second: 23.757709}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000280, iterations_per_second: 3571428.565945}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000263867, iterations_per_second: 3789.792825}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003327400, iterations_per_second: 300.534952}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001910, iterations_per_second: 523560.208565}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002480, iterations_per_second: 403225.806361}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001846000, iterations_per_second: 541.711809}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003404167, iterations_per_second: 293.757650}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.018616200, iterations_per_second: 53.716655}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.049082700, iterations_per_second: 20.373777}
  xpath:
  xslt:
