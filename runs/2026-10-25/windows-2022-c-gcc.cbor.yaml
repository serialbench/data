    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002310, iterations_per_second: 432900.433567}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001786467, iterations_per_second: 559.764153}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003512167, iterations_per_second: 284.724529}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013522200, iterations_per_second: 73.952463}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.047832300, iterations_per_second: 20.906375}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.278590}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000301033, iterations_per_second: 3321.891263}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003720600, iterations_per_second: 268.773854}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002220, iterations_per_second: 450450.450665}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002820, iterations_per_second: 354609.929401}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002396667, iterations_per_second: 417.246175}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004049000, iterations_per_second: 246.974562}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023343200, iterations_per_second: 42.839028}
