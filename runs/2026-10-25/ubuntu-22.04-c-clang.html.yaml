platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001189, iterations_per_second: 841184.386395}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003256, iterations_per_second: 307153.608081}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004088, iterations_per_second: 244618.395812}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000403452, iterations_per_second: 2478.611647}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001606036, iterations_per_second: 622.651049}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000994469, iterations_per_second: 1005.562099}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004051494, iterations_per_second: 246.822530}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016128008, iterations_per_second: 62.003937}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010270866, iterations_per_second: 97.362774}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002214, iterations_per_second: 451630.387310}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005188, iterations_per_second: 192763.652364}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000786537, iterations_per_second: 1271.395467}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001377194, iterations_per_second: 726.114289}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008298713, iterations_per_second: 120.500613}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013514014, iterations_per_second: 73.997259}
  xpath:
  xslt:
