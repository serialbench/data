platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001608, iterations_per_second: 621890.546372}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004459, iterations_per_second: 224250.442974}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005613, iterations_per_second: 178173.719330}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000532850, iterations_per_second: 1876.699586}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002306821, iterations_per_second: 433.497070}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001416608, iterations_per_second: 705.911752}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005270133, iterations_per_second: 189.748532}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.022950842, iterations_per_second: 43.571386}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014564768, iterations_per_second: 68.658835}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002979, iterations_per_second: 335728.194146}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010653, iterations_per_second: 93871.152513}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001001070, iterations_per_second: 998.931144}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001834730, iterations_per_second: 545.039226}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010399913, iterations_per_second: 96.154651}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018604418, iterations_per_second: 53.750674}
  xpath:
  xslt:
