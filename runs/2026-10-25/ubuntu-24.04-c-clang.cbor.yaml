platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000952, iterations_per_second: 1049979.002845}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000889, iterations_per_second: 1124479.927983}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000597725, iterations_per_second: 1673.011097}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001587599, iterations_per_second: 629.881979}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011364658, iterations_per_second: 87.992089}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032162623, iterations_per_second: 31.091991}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000357, iterations_per_second: 2797202.802041}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000326442, iterations_per_second: 3063.334440}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004130288, iterations_per_second: 242.113867}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001617, iterations_per_second: 618276.246006}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001315, iterations_per_second: 760456.275356}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002227777, iterations_per_second: 448.877962}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002032260, iterations_per_second: 492.063104}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.019996854, iterations_per_second: 50.007866}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.037503679, iterations_per_second: 26.664051}
  xpath:
  xslt:
