    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.327542}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000678667, iterations_per_second: 1473.477407}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001400333, iterations_per_second: 714.115687}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.008531000, iterations_per_second: 117.219552}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031950000, iterations_per_second: 31.298905}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000344000, iterations_per_second: 2906.976744}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005450000, iterations_per_second: 183.486239}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.295603}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.663297}
