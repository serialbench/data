    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000802667, iterations_per_second: 1245.847176}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005341000, iterations_per_second: 187.230856}
