    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312499.999679}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000498333, iterations_per_second: 2006.688963}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001682000, iterations_per_second: 594.530321}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005157000, iterations_per_second: 193.911189}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.015954000, iterations_per_second: 62.680206}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000325000, iterations_per_second: 3076.923077}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003890000, iterations_per_second: 257.069409}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454545.454519}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370526}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000923000, iterations_per_second: 1083.423619}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001599333, iterations_per_second: 625.260525}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011079000, iterations_per_second: 90.260854}
