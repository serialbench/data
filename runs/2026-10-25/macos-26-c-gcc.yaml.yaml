platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007700, iterations_per_second: 129870.129862}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000017800, iterations_per_second: 56179.775279}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001892667, iterations_per_second: 528.355055}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004364333, iterations_per_second: 229.130070}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.013720000, iterations_per_second: 72.886297}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.043416000, iterations_per_second: 23.032983}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000846, iterations_per_second: 1182312.603958}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000803528, iterations_per_second: 1244.512220}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.012083333, iterations_per_second: 82.758623}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000012400, iterations_per_second: 80645.161291}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000021500, iterations_per_second: 46511.627908}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001737667, iterations_per_second: 575.484366}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005854667, iterations_per_second: 170.803917}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023201000, iterations_per_second: 43.101590}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.067321000, iterations_per_second: 14.854206}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001108, iterations_per_second: 902201.369571}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001074472, iterations_per_second: 930.689390}
