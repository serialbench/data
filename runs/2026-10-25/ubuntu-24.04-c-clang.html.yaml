platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001140, iterations_per_second: 877423.885002}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003470, iterations_per_second: 288176.133218}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004116, iterations_per_second: 242948.421974}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000360930, iterations_per_second: 2770.620342}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001685041, iterations_per_second: 593.457252}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000959636, iterations_per_second: 1042.061420}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003647672, iterations_per_second: 274.147456}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015744391, iterations_per_second: 63.514683}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009594511, iterations_per_second: 104.226260}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002490, iterations_per_second: 401654.818260}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005218, iterations_per_second: 191655.327110}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000767160, iterations_per_second: 1303.508480}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001290391, iterations_per_second: 774.958708}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007893853, iterations_per_second: 126.680849}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012878232, iterations_per_second: 77.650410}
  xpath:
  xslt:
