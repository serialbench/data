platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001367, iterations_per_second: 731475.384069}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003129, iterations_per_second: 319539.862749}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005058, iterations_per_second: 197698.786018}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000478455, iterations_per_second: 2090.059260}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001657578, iterations_per_second: 603.289860}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001351403, iterations_per_second: 739.971901}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004790486, iterations_per_second: 208.747087}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015986352, iterations_per_second: 62.553358}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013377327, iterations_per_second: 74.753349}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002419, iterations_per_second: 413376.875309}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006212, iterations_per_second: 160986.525505}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000869816, iterations_per_second: 1149.667995}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001763354, iterations_per_second: 567.100997}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008559090, iterations_per_second: 116.834850}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017668523, iterations_per_second: 56.597827}
  xpath:
  xslt:
