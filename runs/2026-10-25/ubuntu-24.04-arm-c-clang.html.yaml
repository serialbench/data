platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001391, iterations_per_second: 718855.582101}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003161, iterations_per_second: 316395.621153}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004877, iterations_per_second: 205031.472318}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000482543, iterations_per_second: 2072.354174}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001635446, iterations_per_second: 611.453876}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001329606, iterations_per_second: 752.102503}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004615223, iterations_per_second: 216.674254}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015956773, iterations_per_second: 62.669313}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013459535, iterations_per_second: 74.296772}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002477, iterations_per_second: 403632.694480}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008113, iterations_per_second: 123258.967071}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000867301, iterations_per_second: 1153.002245}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001761355, iterations_per_second: 567.744612}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008493175, iterations_per_second: 117.741598}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017666944, iterations_per_second: 56.602885}
  xpath:
  xslt:
