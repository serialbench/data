platform:
  platform_string: ubuntu-24.04-arm-rust-1.99.1
  kind: native
  os: linux
  arch: arm64
  runtime: rust
  runtime_version: 1.99.1
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002743, iterations_per_second: 364551.055375}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000007616, iterations_per_second: 131309.417511}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001648535, iterations_per_second: 606.599315}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.007851686, iterations_per_second: 127.361186}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021630290, iterations_per_second: 46.231465}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.101409961, iterations_per_second: 9.860964}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004310, iterations_per_second: 232013.178349}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000008785, iterations_per_second: 113829.096994}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002645326, iterations_per_second: 378.025194}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.008989765, iterations_per_second: 111.237613}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.038633014, iterations_per_second: 25.884597}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.117191035, iterations_per_second: 8.533076}
