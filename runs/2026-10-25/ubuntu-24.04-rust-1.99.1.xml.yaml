    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001896446, iterations_per_second: 527.302029}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.025802424, iterations_per_second: 38.756049}
