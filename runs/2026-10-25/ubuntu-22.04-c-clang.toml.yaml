platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000458, iterations_per_second: 2184837.216746}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001494, iterations_per_second: 669254.450226}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000061210, iterations_per_second: 16337.288768}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000157454, iterations_per_second: 6351.047817}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001414144, iterations_per_second: 707.141564}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.001927247, iterations_per_second: 518.874851}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000587, iterations_per_second: 1704158.141066}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000098030, iterations_per_second: 10200.924204}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001753292, iterations_per_second: 570.355651}
  xpath:
  xslt:
