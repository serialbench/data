platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005686, iterations_per_second: 175882.932275}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003877, iterations_per_second: 257938.043568}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001625088, iterations_per_second: 615.351418}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003822855, iterations_per_second: 261.584624}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021621596, iterations_per_second: 46.250055}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.046757124, iterations_per_second: 21.387115}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001669, iterations_per_second: 598981.731081}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001352320, iterations_per_second: 739.469766}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.043297854, iterations_per_second: 23.095833}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006051, iterations_per_second: 165259.209028}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006288, iterations_per_second: 159045.725580}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002721579, iterations_per_second: 367.433758}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005816504, iterations_per_second: 171.924579}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.044196317, iterations_per_second: 22.626320}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.071379139, iterations_per_second: 14.009695}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001916, iterations_per_second: 521947.910257}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001705121, iterations_per_second: 586.468529}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.047682818, iterations_per_second: 20.971915}
  xpath:
  xslt:
