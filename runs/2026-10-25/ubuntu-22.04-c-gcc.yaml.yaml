platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002318, iterations_per_second: 431499.460180}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000002281, iterations_per_second: 438327.342223}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000861464, iterations_per_second: 1160.815062}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002078897, iterations_per_second: 481.024235}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.011827221, iterations_per_second: 84.550716}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.025992997, iterations_per_second: 38.471901}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000981, iterations_per_second: 1018848.701121}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000698988, iterations_per_second: 1430.639725}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.019785759, iterations_per_second: 50.541402}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003423, iterations_per_second: 292132.862262}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003707, iterations_per_second: 269723.533625}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001428281, iterations_per_second: 700.142176}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003060009, iterations_per_second: 326.796424}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021998235, iterations_per_second: 45.458192}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.039206614, iterations_per_second: 25.505901}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001149, iterations_per_second: 870473.538803}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000878672, iterations_per_second: 1138.080672}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.022565851, iterations_per_second: 44.314748}
  xpath:
