platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 399999.999191}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006800, iterations_per_second: 147058.823409}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007600, iterations_per_second: 131578.947307}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000905000, iterations_per_second: 1104.972376}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003726667, iterations_per_second: 268.336315}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002292667, iterations_per_second: 436.173306}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009172000, iterations_per_second: 109.027475}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.038525000, iterations_per_second: 25.957171}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.025521000, iterations_per_second: 39.183418}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005500, iterations_per_second: 181818.181901}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009800, iterations_per_second: 102040.816347}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001877000, iterations_per_second: 532.765051}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003266333, iterations_per_second: 306.153689}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022257000, iterations_per_second: 44.929685}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.037777000, iterations_per_second: 26.471133}
  xpath:
  xslt:
