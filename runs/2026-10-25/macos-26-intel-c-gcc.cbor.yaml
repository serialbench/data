platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 399999.999191}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270122}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001030000, iterations_per_second: 970.873786}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004633000, iterations_per_second: 215.842866}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014027000, iterations_per_second: 71.291081}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.060433000, iterations_per_second: 16.547251}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000600, iterations_per_second: 1666666.670875}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000621000, iterations_per_second: 1610.305958}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.008624000, iterations_per_second: 115.955473}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000004700, iterations_per_second: 212765.957469}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000004900, iterations_per_second: 204081.632695}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001907000, iterations_per_second: 524.383849}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.005281333, iterations_per_second: 189.346125}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.032223000, iterations_per_second: 31.033734}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.071624000, iterations_per_second: 13.961801}
  xpath:
  xslt:
