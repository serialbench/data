platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000595, iterations_per_second: 1680954.762693}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003887, iterations_per_second: 257274.435151}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000080207, iterations_per_second: 12467.687904}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000447581, iterations_per_second: 2234.234127}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001817598, iterations_per_second: 550.176662}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005327995, iterations_per_second: 187.687864}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000744, iterations_per_second: 1343905.392721}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000123663, iterations_per_second: 8086.493131}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002250389, iterations_per_second: 444.367618}
  xpath:
  xslt:
