platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001281, iterations_per_second: 780396.441299}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001172, iterations_per_second: 853096.736258}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000964288, iterations_per_second: 1037.034937}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001952697, iterations_per_second: 512.112222}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.030379868, iterations_per_second: 32.916535}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.042151957, iterations_per_second: 23.723691}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000457, iterations_per_second: 2189141.852330}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000443480, iterations_per_second: 2254.894813}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005548693, iterations_per_second: 180.222622}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002160, iterations_per_second: 462962.963644}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001671, iterations_per_second: 598408.236109}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003378495, iterations_per_second: 295.989753}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002500953, iterations_per_second: 399.847525}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.040857485, iterations_per_second: 24.475320}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.051548099, iterations_per_second: 19.399357}
  xpath:
  xslt:
