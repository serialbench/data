    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000008800, iterations_per_second: 113636.363630}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000022800, iterations_per_second: 43859.649124}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001267667, iterations_per_second: 788.850907}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004865667, iterations_per_second: 205.521683}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003128333, iterations_per_second: 319.659030}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.012360000, iterations_per_second: 80.906149}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.052880000, iterations_per_second: 18.910741}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.030936000, iterations_per_second: 32.324800}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000012500, iterations_per_second: 79999.999984}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010100, iterations_per_second: 99009.900906}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002381000, iterations_per_second: 419.991600}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.004476667, iterations_per_second: 223.380491}
