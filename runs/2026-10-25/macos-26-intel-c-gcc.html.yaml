    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000008400, iterations_per_second: 119047.619026}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009400, iterations_per_second: 106382.978735}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001085000, iterations_per_second: 921.658986}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.006439333, iterations_per_second: 155.295579}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002758000, iterations_per_second: 362.581581}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.011534000, iterations_per_second: 86.700191}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.046889000, iterations_per_second: 21.326964}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.028142000, iterations_per_second: 35.534077}
  generation:
