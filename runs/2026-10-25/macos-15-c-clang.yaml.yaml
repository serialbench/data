platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.587078}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001032333, iterations_per_second: 968.679367}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003839667, iterations_per_second: 260.439274}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.014853000, iterations_per_second: 67.326466}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.046587000, iterations_per_second: 21.465216}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000950, iterations_per_second: 1052631.575307}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001172069, iterations_per_second: 853.191848}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018391542, iterations_per_second: 54.372820}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004300, iterations_per_second: 232558.139507}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005900, iterations_per_second: 169491.525525}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002013333, iterations_per_second: 496.688742}
