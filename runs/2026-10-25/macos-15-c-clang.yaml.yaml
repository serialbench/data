platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006900, iterations_per_second: 144927.536240}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010300, iterations_per_second: 97087.378618}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001486667, iterations_per_second: 672.645740}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003867333, iterations_per_second: 258.576108}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015464000, iterations_per_second: 64.666322}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055426000, iterations_per_second: 18.042074}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002588, iterations_per_second: 386473.429866}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001249208, iterations_per_second: 800.506988}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020589917, iterations_per_second: 48.567461}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009200, iterations_per_second: 108695.652180}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000015800, iterations_per_second: 63291.139241}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001969000, iterations_per_second: 507.872016}
