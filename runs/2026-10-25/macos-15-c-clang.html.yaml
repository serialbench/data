    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001069667, iterations_per_second: 934.870676}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004398000, iterations_per_second: 227.376080}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014160000, iterations_per_second: 70.621469}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011048000, iterations_per_second: 90.514120}
  generation:
