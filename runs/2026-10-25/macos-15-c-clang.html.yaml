    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.778479}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000455000, iterations_per_second: 2197.802198}
