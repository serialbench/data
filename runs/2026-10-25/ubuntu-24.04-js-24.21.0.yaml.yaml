platform:
  platform_string: ubuntu-24.04-js-24.21.0
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.11', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000924677, iterations_per_second: 1081.458364}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.124337833, iterations_per_second: 8.042604}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.448450894, iterations_per_second: 0.690393}
  generation:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.001140175, iterations_per_second: 877.058269}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.164784208, iterations_per_second: 6.068543}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 2.110710332, iterations_per_second: 0.473774}
  xpath:
