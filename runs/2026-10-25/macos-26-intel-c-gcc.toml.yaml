platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.607644}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666456}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000164667, iterations_per_second: 6072.874494}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000516000, iterations_per_second: 1937.984496}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001586000, iterations_per_second: 630.517024}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.039064000, iterations_per_second: 25.599017}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270122}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000172333, iterations_per_second: 5802.707931}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.011017000, iterations_per_second: 90.768812}
  xpath:
  xslt:
