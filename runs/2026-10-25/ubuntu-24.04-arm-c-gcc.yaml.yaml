platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002737, iterations_per_second: 365416.940192}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004032, iterations_per_second: 247985.121676}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001612622, iterations_per_second: 620.108122}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003972616, iterations_per_second: 251.723298}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021441598, iterations_per_second: 46.638315}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048114930, iterations_per_second: 20.783570}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001169, iterations_per_second: 855651.571607}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001184868, iterations_per_second: 843.976107}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027835676, iterations_per_second: 35.925120}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004310, iterations_per_second: 232013.177951}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006040, iterations_per_second: 165551.950487}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002576208, iterations_per_second: 388.167365}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005519538, iterations_per_second: 181.174573}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.038785463, iterations_per_second: 25.782856}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068671677, iterations_per_second: 14.562044}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001441, iterations_per_second: 694107.032241}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001459673, iterations_per_second: 685.085104}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031341921, iterations_per_second: 31.906149}
  xpath:
  xslt:
