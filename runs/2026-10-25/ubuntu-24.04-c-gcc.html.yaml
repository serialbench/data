platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000000741, iterations_per_second: 1349345.565073}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002130, iterations_per_second: 469439.489398}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003172, iterations_per_second: 315278.390795}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000230455, iterations_per_second: 4339.241934}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001019204, iterations_per_second: 981.157524}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000689068, iterations_per_second: 1451.234880}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.002341770, iterations_per_second: 427.027419}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.009856671, iterations_per_second: 101.454132}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.006690495, iterations_per_second: 149.465772}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001492, iterations_per_second: 670151.454624}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003844, iterations_per_second: 260152.449282}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000499041, iterations_per_second: 2003.842033}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000920832, iterations_per_second: 1085.974423}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005041582, iterations_per_second: 198.350438}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.008925875, iterations_per_second: 112.033834}
  xpath:
  xslt:
