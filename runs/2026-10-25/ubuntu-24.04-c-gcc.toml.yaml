platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000360, iterations_per_second: 2773925.112338}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002633, iterations_per_second: 379794.910789}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000043439, iterations_per_second: 23020.787774}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000270068, iterations_per_second: 3702.766584}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001006993, iterations_per_second: 993.055562}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003285026, iterations_per_second: 304.411594}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000434, iterations_per_second: 2306273.068432}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000067519, iterations_per_second: 14810.719011}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001271643, iterations_per_second: 786.384229}
  xpath:
  xslt:
