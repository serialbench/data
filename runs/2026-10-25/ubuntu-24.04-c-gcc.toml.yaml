platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000591, iterations_per_second: 1691474.964456}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004271, iterations_per_second: 234137.204388}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000074676, iterations_per_second: 13391.183245}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000463726, iterations_per_second: 2156.447382}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001474292, iterations_per_second: 678.291682}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005630832, iterations_per_second: 177.593649}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000834, iterations_per_second: 1199616.121747}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000121143, iterations_per_second: 8254.729960}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001906599, iterations_per_second: 524.494139}
  xpath:
  xslt:
