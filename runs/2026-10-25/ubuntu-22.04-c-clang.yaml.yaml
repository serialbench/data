platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004201, iterations_per_second: 238049.895694}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008292, iterations_per_second: 120605.439295}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001784506, iterations_per_second: 560.379175}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004598069, iterations_per_second: 217.482600}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025286842, iterations_per_second: 39.546259}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055921581, iterations_per_second: 17.882184}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001376, iterations_per_second: 726955.508001}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001789602, iterations_per_second: 558.783357}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.045264018, iterations_per_second: 22.092603}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006385, iterations_per_second: 156619.524294}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007160, iterations_per_second: 139657.002349}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002987906, iterations_per_second: 334.682588}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006783622, iterations_per_second: 147.413881}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.048619681, iterations_per_second: 20.567803}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085401372, iterations_per_second: 11.709414}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001770, iterations_per_second: 564876.008889}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002295314, iterations_per_second: 435.670176}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.050626983, iterations_per_second: 19.752313}
  xpath:
  xslt:
