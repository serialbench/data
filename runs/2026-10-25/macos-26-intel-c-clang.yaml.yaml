platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009100, iterations_per_second: 109890.110030}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010200, iterations_per_second: 98039.215715}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002282000, iterations_per_second: 438.212095}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.009269667, iterations_per_second: 107.878744}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.032466000, iterations_per_second: 30.801454}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.123949000, iterations_per_second: 8.067834}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001729, iterations_per_second: 578402.453419}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002143468, iterations_per_second: 466.533673}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.045985211, iterations_per_second: 21.746122}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000012500, iterations_per_second: 79999.999984}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000016600, iterations_per_second: 60240.963760}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.004246667, iterations_per_second: 235.478807}
