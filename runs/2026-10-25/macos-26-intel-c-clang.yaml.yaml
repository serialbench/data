    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.183744000, iterations_per_second: 5.442355}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002385, iterations_per_second: 419269.629648}
