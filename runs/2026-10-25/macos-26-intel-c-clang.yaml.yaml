platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007800, iterations_per_second: 128205.128155}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008500, iterations_per_second: 117647.058649}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002037667, iterations_per_second: 490.757402}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008183000, iterations_per_second: 122.204570}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.033247000, iterations_per_second: 30.077902}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.108577000, iterations_per_second: 9.210054}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001630, iterations_per_second: 613459.289938}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001854109, iterations_per_second: 539.342617}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031083293, iterations_per_second: 32.171624}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011000, iterations_per_second: 90909.090951}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000017200, iterations_per_second: 58139.534877}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.004238333, iterations_per_second: 235.941801}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.013183000, iterations_per_second: 75.855268}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.059484000, iterations_per_second: 16.811243}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.161314000, iterations_per_second: 6.199090}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002393, iterations_per_second: 417937.893917}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002671887, iterations_per_second: 374.267325}
