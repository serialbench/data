    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007800, iterations_per_second: 128205.128249}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001144333, iterations_per_second: 873.871250}
