    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000942, iterations_per_second: 1061909.312818}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001112750, iterations_per_second: 898.674455}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.019394250, iterations_per_second: 51.561674}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666693}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008500, iterations_per_second: 117647.058806}
