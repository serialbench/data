    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000852722, iterations_per_second: 1172.714682}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013218000, iterations_per_second: 75.654411}
  generation:
