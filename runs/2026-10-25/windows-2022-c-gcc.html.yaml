    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004110, iterations_per_second: 243309.002240}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007300, iterations_per_second: 136986.301289}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000472833, iterations_per_second: 2114.910116}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002250700, iterations_per_second: 444.306216}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001796167, iterations_per_second: 556.741208}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005147300, iterations_per_second: 194.276611}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.022975300, iterations_per_second: 43.525003}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.020797000, iterations_per_second: 48.083858}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003390, iterations_per_second: 294985.250691}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009270, iterations_per_second: 107874.865177}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001047033, iterations_per_second: 955.079431}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002430733, iterations_per_second: 411.398481}
