platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.8.5', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001220, iterations_per_second: 819672.130162}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003180, iterations_per_second: 314465.408924}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005010, iterations_per_second: 199600.798364}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000343533, iterations_per_second: 2910.925674}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001518367, iterations_per_second: 658.602446}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001465367, iterations_per_second: 682.423057}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003427800, iterations_per_second: 291.732306}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015095900, iterations_per_second: 66.243152}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015136000, iterations_per_second: 66.067653}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384746}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006050, iterations_per_second: 165289.256150}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000698433, iterations_per_second: 1431.775879}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001965900, iterations_per_second: 508.672872}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007096900, iterations_per_second: 140.906593}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.020250500, iterations_per_second: 49.381497}
  xpath:
  xslt:
