platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001335, iterations_per_second: 749007.564591}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003034, iterations_per_second: 329576.165644}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005065, iterations_per_second: 197425.570454}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000459116, iterations_per_second: 2178.100362}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001612064, iterations_per_second: 620.322895}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001334777, iterations_per_second: 749.188629}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004595544, iterations_per_second: 217.602095}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015995609, iterations_per_second: 62.517157}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013517982, iterations_per_second: 73.975539}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002296, iterations_per_second: 435578.011167}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006158, iterations_per_second: 162393.023660}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000827390, iterations_per_second: 1208.619390}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001757125, iterations_per_second: 569.111475}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008406467, iterations_per_second: 118.956037}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017635674, iterations_per_second: 56.703248}
  xpath:
  xslt:
