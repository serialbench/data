    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.369746}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000430333, iterations_per_second: 2323.780016}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001425333, iterations_per_second: 701.590271}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005414000, iterations_per_second: 184.706317}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.017208000, iterations_per_second: 58.112506}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.468068}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000330000, iterations_per_second: 3030.303030}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004273000, iterations_per_second: 234.027615}
  generation:
