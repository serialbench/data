platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001315, iterations_per_second: 760745.529152}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001246, iterations_per_second: 802310.650505}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000712126, iterations_per_second: 1404.246535}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001902976, iterations_per_second: 525.492702}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014569984, iterations_per_second: 68.634255}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031266154, iterations_per_second: 31.983467}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000370, iterations_per_second: 2705627.689822}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000331370, iterations_per_second: 3017.771657}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004253626, iterations_per_second: 235.093541}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001761, iterations_per_second: 567923.670820}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001536, iterations_per_second: 650999.283487}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001859799, iterations_per_second: 537.692610}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002164418, iterations_per_second: 462.017894}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023319309, iterations_per_second: 42.882917}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035099303, iterations_per_second: 28.490594}
  xpath:
  xslt:
