platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001373, iterations_per_second: 728438.222459}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001252, iterations_per_second: 798785.834961}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000698354, iterations_per_second: 1431.937846}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001898646, iterations_per_second: 526.691034}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014387267, iterations_per_second: 69.505904}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030923618, iterations_per_second: 32.337743}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000386, iterations_per_second: 2593360.895965}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000332158, iterations_per_second: 3010.615430}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004258017, iterations_per_second: 234.851106}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001790, iterations_per_second: 558565.601319}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001523, iterations_per_second: 656555.712777}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001868339, iterations_per_second: 535.234868}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002160280, iterations_per_second: 462.902957}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023326726, iterations_per_second: 42.869282}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034557181, iterations_per_second: 28.937546}
  xpath:
