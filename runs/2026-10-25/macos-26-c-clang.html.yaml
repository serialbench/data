    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000017700, iterations_per_second: 56497.175175}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001148667, iterations_per_second: 870.574579}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002767000, iterations_per_second: 361.402241}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001441333, iterations_per_second: 693.802035}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003990000, iterations_per_second: 250.626566}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.013007000, iterations_per_second: 76.881679}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009254000, iterations_per_second: 108.061379}
  generation:
