    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384746}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666693}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000443333, iterations_per_second: 2255.639098}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001497333, iterations_per_second: 667.853963}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001101333, iterations_per_second: 907.990315}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004456000, iterations_per_second: 224.416517}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015194000, iterations_per_second: 65.815453}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010691000, iterations_per_second: 93.536620}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.856957}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666693}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000870333, iterations_per_second: 1148.985063}
