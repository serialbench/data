    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.716089}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000554333, iterations_per_second: 1803.968731}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001277667, iterations_per_second: 782.676755}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006728000, iterations_per_second: 148.632580}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.017695000, iterations_per_second: 56.513139}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000336333, iterations_per_second: 2973.240833}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003949000, iterations_per_second: 253.228665}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.553449}
