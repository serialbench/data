platform:
  platform_string: macos-26-js-24.21.0
  kind: wasm
  os: macos
  arch: arm64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
