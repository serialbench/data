platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000639, iterations_per_second: 1564455.572187}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454524.794519}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000084461, iterations_per_second: 11839.784042}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000211371, iterations_per_second: 4731.010512}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001512222, iterations_per_second: 661.278569}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002403195, iterations_per_second: 416.112717}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000897, iterations_per_second: 1115200.176737}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000120061, iterations_per_second: 8329.122499}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001933909, iterations_per_second: 517.087412}
  xpath:
  xslt:
