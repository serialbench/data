platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000446, iterations_per_second: 2244165.170955}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001604, iterations_per_second: 623324.815026}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000062229, iterations_per_second: 16069.592045}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000161180, iterations_per_second: 6204.256533}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001207164, iterations_per_second: 828.387858}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.001800796, iterations_per_second: 555.309985}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000664, iterations_per_second: 1506024.094257}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000112741, iterations_per_second: 8869.913843}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001542142, iterations_per_second: 648.448716}
  xpath:
  xslt:
