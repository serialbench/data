    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007539000, iterations_per_second: 132.643587}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.018013000, iterations_per_second: 55.515461}
