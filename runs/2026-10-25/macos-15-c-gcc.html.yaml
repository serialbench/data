    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000018300, iterations_per_second: 54644.808745}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000562667, iterations_per_second: 1777.251185}
