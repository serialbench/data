    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.369746}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.777602}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000440667, iterations_per_second: 2269.288956}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001537667, iterations_per_second: 650.336007}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001752333, iterations_per_second: 570.667681}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004772000, iterations_per_second: 209.555742}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.019989000, iterations_per_second: 50.027515}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014177000, iterations_per_second: 70.536785}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.607644}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.727259}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000858667, iterations_per_second: 1164.596273}
