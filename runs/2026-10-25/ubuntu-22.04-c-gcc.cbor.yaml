platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000003696, iterations_per_second: 270592.055191}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001244, iterations_per_second: 803923.145706}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000746558, iterations_per_second: 1339.481255}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002092681, iterations_per_second: 477.855842}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.025993470, iterations_per_second: 38.471201}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.043154000, iterations_per_second: 23.172823}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000001524, iterations_per_second: 656038.837193}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000365187, iterations_per_second: 2738.325605}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004569851, iterations_per_second: 218.825515}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002075, iterations_per_second: 481904.484693}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001771, iterations_per_second: 564748.405109}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003090614, iterations_per_second: 323.560302}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002636146, iterations_per_second: 379.341660}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.036788225, iterations_per_second: 27.182611}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.052694957, iterations_per_second: 18.977148}
  xpath:
  xslt:
