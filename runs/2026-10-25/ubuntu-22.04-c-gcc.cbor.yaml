platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000725, iterations_per_second: 1379310.353717}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000638, iterations_per_second: 1567398.118611}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000392605, iterations_per_second: 2547.089314}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001047504, iterations_per_second: 954.650293}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010014121, iterations_per_second: 99.858989}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.020038265, iterations_per_second: 49.904520}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000238, iterations_per_second: 4196391.138069}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000210387, iterations_per_second: 4753.145394}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.002574356, iterations_per_second: 388.446664}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001137, iterations_per_second: 879739.596054}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000955, iterations_per_second: 1046682.020920}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001173679, iterations_per_second: 852.021962}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001361088, iterations_per_second: 734.706353}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.016243001, iterations_per_second: 61.564978}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.026016603, iterations_per_second: 38.436993}
  xpath:
  xslt:
