platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002315, iterations_per_second: 431872.166219}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000002272, iterations_per_second: 440063.369316}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000957337, iterations_per_second: 1044.563881}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002062521, iterations_per_second: 484.843470}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.012459726, iterations_per_second: 80.258587}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.025764780, iterations_per_second: 38.812674}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000876, iterations_per_second: 1141031.492419}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000640628, iterations_per_second: 1560.967488}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.011348446, iterations_per_second: 88.117792}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003343, iterations_per_second: 299123.568023}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003525, iterations_per_second: 283663.801719}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001454923, iterations_per_second: 687.321597}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002892873, iterations_per_second: 345.677078}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021017443, iterations_per_second: 47.579527}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.037060186, iterations_per_second: 26.983135}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001075, iterations_per_second: 930578.818713}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000802063, iterations_per_second: 1246.785372}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013788886, iterations_per_second: 72.522175}
  xpath:
  xslt:
