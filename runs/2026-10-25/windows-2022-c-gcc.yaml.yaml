    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002913433, iterations_per_second: 343.237646}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.039797800, iterations_per_second: 25.127017}
