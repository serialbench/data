    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001865433, iterations_per_second: 536.068474}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.023270600, iterations_per_second: 42.972678}
  generation:
