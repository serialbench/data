platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000538, iterations_per_second: 1860119.051057}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002006, iterations_per_second: 498429.945119}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000059880, iterations_per_second: 16700.066800}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000194818, iterations_per_second: 5132.995924}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001065464, iterations_per_second: 938.558224}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002334558, iterations_per_second: 428.346608}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000725, iterations_per_second: 1379881.333062}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000093430, iterations_per_second: 10703.162070}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001407104, iterations_per_second: 710.679523}
  xpath:
  xslt:
