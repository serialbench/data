platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.43', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.43', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.43', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000541, iterations_per_second: 1846722.076675}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001986, iterations_per_second: 503448.622204}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000065302, iterations_per_second: 15313.388497}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000189635, iterations_per_second: 5273.278890}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001054209, iterations_per_second: 948.578508}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002299468, iterations_per_second: 434.883199}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000726, iterations_per_second: 1378359.749220}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000088554, iterations_per_second: 11292.544662}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001422415, iterations_per_second: 703.029707}
  xpath:
  xslt:
