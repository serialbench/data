platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.368', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.4', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000000687, iterations_per_second: 1455392.228942}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000001927, iterations_per_second: 518968.290869}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003245, iterations_per_second: 308175.906783}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000226642, iterations_per_second: 4412.238373}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.000866802, iterations_per_second: 1153.665561}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000717206, iterations_per_second: 1394.298898}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.002291090, iterations_per_second: 436.473469}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.008317682, iterations_per_second: 120.225803}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.007382119, iterations_per_second: 135.462460}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001441, iterations_per_second: 693866.222653}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003978, iterations_per_second: 251382.604359}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000596404, iterations_per_second: 1676.715783}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001015818, iterations_per_second: 984.428636}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005143468, iterations_per_second: 194.421352}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009412095, iterations_per_second: 106.246271}
  xpath:
  xslt:
