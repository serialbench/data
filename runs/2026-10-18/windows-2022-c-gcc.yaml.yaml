    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001929500, iterations_per_second: 518.268982}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007256067, iterations_per_second: 137.815713}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025538300, iterations_per_second: 39.156874}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.087957200, iterations_per_second: 11.369166}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001510, iterations_per_second: 662251.653811}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002167367, iterations_per_second: 461.389397}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027101600, iterations_per_second: 36.898191}
