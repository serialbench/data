    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000020180, iterations_per_second: 49554.013872}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003514767, iterations_per_second: 284.513908}
