platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.368', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.4', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 400000.010105}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006300, iterations_per_second: 158730.157699}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007600, iterations_per_second: 131578.948488}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000872667, iterations_per_second: 1145.912910}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002927000, iterations_per_second: 341.646737}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002292667, iterations_per_second: 436.173306}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008942000, iterations_per_second: 111.831805}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.029147000, iterations_per_second: 34.308848}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.023041000, iterations_per_second: 43.400894}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005500, iterations_per_second: 181818.183405}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009800, iterations_per_second: 102040.816821}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001948667, iterations_per_second: 513.171399}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003441333, iterations_per_second: 290.585045}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019794000, iterations_per_second: 50.520360}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.033767000, iterations_per_second: 29.614713}
  xpath:
  xslt:
