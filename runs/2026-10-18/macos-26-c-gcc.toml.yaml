platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.368', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.4', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.113916}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.647064}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000040333, iterations_per_second: 24793.388428}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.001678000, iterations_per_second: 595.947557}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000552000, iterations_per_second: 1811.594203}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002209000, iterations_per_second: 452.693526}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001000, iterations_per_second: 999999.999683}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000070000, iterations_per_second: 14285.714287}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000935000, iterations_per_second: 1069.518717}
  xpath:
  xslt:
