platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.368', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.4', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.667087}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 769230.769491}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000581333, iterations_per_second: 1720.183486}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001520667, iterations_per_second: 657.606313}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007248000, iterations_per_second: 137.969095}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.021024000, iterations_per_second: 47.564688}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000397000, iterations_per_second: 2518.891688}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004762000, iterations_per_second: 209.995800}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 624999.999358}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270330}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001037333, iterations_per_second: 964.010283}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001699333, iterations_per_second: 588.466065}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.016067000, iterations_per_second: 62.239373}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.027223000, iterations_per_second: 36.733644}
  xpath:
  xslt:
