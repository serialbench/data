    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001608867, iterations_per_second: 621.555546}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003518367, iterations_per_second: 284.222793}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012884800, iterations_per_second: 77.610828}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.051656300, iterations_per_second: 19.358723}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000370, iterations_per_second: 2702702.717831}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000367400, iterations_per_second: 2721.829069}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004625200, iterations_per_second: 216.206867}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002480, iterations_per_second: 403225.806361}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003040, iterations_per_second: 328947.368267}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002418967, iterations_per_second: 413.399661}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004153900, iterations_per_second: 240.737620}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022806700, iterations_per_second: 43.846764}
