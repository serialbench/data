    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000792333, iterations_per_second: 1262.095078}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003672667, iterations_per_second: 272.281721}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011997000, iterations_per_second: 83.354172}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.048894000, iterations_per_second: 20.452407}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000500, iterations_per_second: 2000000.050524}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000472667, iterations_per_second: 2115.655852}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.006204000, iterations_per_second: 161.186331}
  generation:
