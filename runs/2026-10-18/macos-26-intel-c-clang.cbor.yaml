    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000004100, iterations_per_second: 243902.443022}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001652000, iterations_per_second: 605.326876}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004474667, iterations_per_second: 223.480334}
