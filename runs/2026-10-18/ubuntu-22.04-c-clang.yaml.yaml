platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.368', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.4', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004301, iterations_per_second: 232498.663427}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004731, iterations_per_second: 211380.738832}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001781869, iterations_per_second: 561.208379}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004571279, iterations_per_second: 218.757173}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024709814, iterations_per_second: 40.469750}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055980675, iterations_per_second: 17.863307}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001344, iterations_per_second: 744324.523940}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001791594, iterations_per_second: 558.162173}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.046951547, iterations_per_second: 21.298553}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006216, iterations_per_second: 160882.925490}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007198, iterations_per_second: 138917.830148}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002937981, iterations_per_second: 340.369760}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006759019, iterations_per_second: 147.950457}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.048552882, iterations_per_second: 20.596100}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085561497, iterations_per_second: 11.687500}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001712, iterations_per_second: 584043.920980}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002230885, iterations_per_second: 448.252599}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.051205157, iterations_per_second: 19.529283}
  xpath:
  xslt:
