platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.368', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.4', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.333228}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 249999.999921}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000419000, iterations_per_second: 2386.634845}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001234333, iterations_per_second: 810.153929}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001117333, iterations_per_second: 894.988067}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004146000, iterations_per_second: 241.196334}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.012459000, iterations_per_second: 80.263264}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011943000, iterations_per_second: 83.731056}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608719}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005000, iterations_per_second: 200000.000050}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000896667, iterations_per_second: 1115.241636}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001535000, iterations_per_second: 651.465798}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008551000, iterations_per_second: 116.945387}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017514000, iterations_per_second: 57.097179}
  xpath:
  xslt:
