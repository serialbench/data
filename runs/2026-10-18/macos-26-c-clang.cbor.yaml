platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.368', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.4', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.000468}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.857320}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001382333, iterations_per_second: 723.414517}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002065000, iterations_per_second: 484.261501}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005843000, iterations_per_second: 171.144960}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031208000, iterations_per_second: 32.043066}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000332333, iterations_per_second: 3009.027081}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004697000, iterations_per_second: 212.901852}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.556081}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608719}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001068000, iterations_per_second: 936.329588}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002043000, iterations_per_second: 489.476260}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.016636000, iterations_per_second: 60.110604}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032619000, iterations_per_second: 30.656979}
  xpath:
  xslt:
