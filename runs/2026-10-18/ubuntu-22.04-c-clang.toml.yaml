platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.368', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.4', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000561, iterations_per_second: 1782531.207105}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002152, iterations_per_second: 464662.422580}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000081400, iterations_per_second: 12285.062592}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000209657, iterations_per_second: 4769.702847}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001709377, iterations_per_second: 585.008456}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002335782, iterations_per_second: 428.122145}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000866, iterations_per_second: 1155268.017633}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000132986, iterations_per_second: 7519.588528}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002221277, iterations_per_second: 450.191489}
  xpath:
  xslt:
