platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.368', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.4', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007800, iterations_per_second: 128205.128155}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008800, iterations_per_second: 113636.363923}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001989667, iterations_per_second: 502.596750}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007743667, iterations_per_second: 129.137790}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026355000, iterations_per_second: 37.943464}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.094505000, iterations_per_second: 10.581451}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001412, iterations_per_second: 708165.175849}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001590543, iterations_per_second: 628.716105}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029131275, iterations_per_second: 34.327368}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011000, iterations_per_second: 90909.090951}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000013000, iterations_per_second: 76923.077252}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003338000, iterations_per_second: 299.580587}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.010983333, iterations_per_second: 91.047041}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.050852000, iterations_per_second: 19.664910}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.136879000, iterations_per_second: 7.305723}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001959, iterations_per_second: 510386.346437}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001983731, iterations_per_second: 504.100522}
