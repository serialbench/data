platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.368', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.4', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.667087}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000782333, iterations_per_second: 1278.227525}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001570333, iterations_per_second: 636.807472}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.008141000, iterations_per_second: 122.835033}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.026565000, iterations_per_second: 37.643516}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2499999.988548}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000354667, iterations_per_second: 2819.548872}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004323000, iterations_per_second: 231.320842}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.000468}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.667087}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001240333, iterations_per_second: 806.234883}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001730333, iterations_per_second: 577.923329}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015797000, iterations_per_second: 63.303159}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.024558000, iterations_per_second: 40.719928}
  xpath:
  xslt:
