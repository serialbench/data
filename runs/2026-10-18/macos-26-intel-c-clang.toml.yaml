platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.368', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.4', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.315272}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.239985}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000074000, iterations_per_second: 13513.513478}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000404667, iterations_per_second: 2471.169687}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001697000, iterations_per_second: 589.275191}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005048000, iterations_per_second: 198.098257}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002100, iterations_per_second: 476190.459347}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000138333, iterations_per_second: 7228.915671}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002363000, iterations_per_second: 423.190859}
  xpath:
  xslt:
