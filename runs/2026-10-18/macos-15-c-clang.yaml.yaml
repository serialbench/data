    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006600, iterations_per_second: 151515.151506}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002245333, iterations_per_second: 445.368171}
