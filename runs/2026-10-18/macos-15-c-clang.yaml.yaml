    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001434000, iterations_per_second: 697.350070}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004286667, iterations_per_second: 233.281493}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016713000, iterations_per_second: 59.833662}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.052265000, iterations_per_second: 19.133263}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000979, iterations_per_second: 1021241.831529}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001312778, iterations_per_second: 761.743417}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020616167, iterations_per_second: 48.505622}
  generation:
