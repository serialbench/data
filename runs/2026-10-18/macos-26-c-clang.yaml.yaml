    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001355000, iterations_per_second: 738.007380}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005732333, iterations_per_second: 174.449032}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016371000, iterations_per_second: 61.083623}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.072523000, iterations_per_second: 13.788729}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000942, iterations_per_second: 1062022.088740}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001523681, iterations_per_second: 656.305499}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.014411125, iterations_per_second: 69.390835}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000013000, iterations_per_second: 76923.076932}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009200, iterations_per_second: 108695.652180}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002061000, iterations_per_second: 485.201359}
