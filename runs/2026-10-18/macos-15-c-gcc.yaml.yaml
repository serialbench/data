platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.368', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.4', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005600, iterations_per_second: 178571.428569}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004600, iterations_per_second: 217391.304359}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001174000, iterations_per_second: 851.788756}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004384000, iterations_per_second: 228.102190}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016753000, iterations_per_second: 59.690802}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.053602000, iterations_per_second: 18.656020}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.909037}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001513028, iterations_per_second: 660.926447}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021646417, iterations_per_second: 46.197022}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005200, iterations_per_second: 192307.692268}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007100, iterations_per_second: 140845.070440}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002121333, iterations_per_second: 471.401634}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006622333, iterations_per_second: 151.004178}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.032233000, iterations_per_second: 31.024106}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.088610000, iterations_per_second: 11.285408}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001254, iterations_per_second: 797384.579244}
