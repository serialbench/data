    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006920, iterations_per_second: 144508.670553}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000465267, iterations_per_second: 2149.305058}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001723267, iterations_per_second: 580.293242}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001910300, iterations_per_second: 523.477988}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004827000, iterations_per_second: 207.168013}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.017231100, iterations_per_second: 58.034600}
