    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008870, iterations_per_second: 112739.571600}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000926867, iterations_per_second: 1078.903834}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002636200, iterations_per_second: 379.333890}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009335800, iterations_per_second: 107.114548}
