platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.368', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.4', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000500, iterations_per_second: 2000000.005050}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001900, iterations_per_second: 526315.789228}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000049333, iterations_per_second: 20270.270271}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000179333, iterations_per_second: 5576.208178}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000691000, iterations_per_second: 1447.178003}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002751000, iterations_per_second: 363.504180}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.110408}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000078000, iterations_per_second: 12820.512820}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001020000, iterations_per_second: 980.392157}
  xpath:
  xslt:
