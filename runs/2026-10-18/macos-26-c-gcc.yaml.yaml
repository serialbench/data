    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007200, iterations_per_second: 138888.888856}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001064667, iterations_per_second: 939.261115}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003899000, iterations_per_second: 256.476019}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021189000, iterations_per_second: 47.194299}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057116000, iterations_per_second: 17.508229}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001154, iterations_per_second: 866400.969621}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000915083, iterations_per_second: 1092.796649}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020360916, iterations_per_second: 49.113704}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006500, iterations_per_second: 153846.153831}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008300, iterations_per_second: 120481.927726}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001912333, iterations_per_second: 522.921387}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006329667, iterations_per_second: 157.986203}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.027367000, iterations_per_second: 36.540359}
