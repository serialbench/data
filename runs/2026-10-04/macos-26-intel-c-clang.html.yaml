    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003432667, iterations_per_second: 291.318703}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002773667, iterations_per_second: 360.533590}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010882000, iterations_per_second: 91.894872}
