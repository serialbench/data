    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001292933, iterations_per_second: 773.435083}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002826933, iterations_per_second: 353.740213}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011395800, iterations_per_second: 87.751628}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.050077200, iterations_per_second: 19.969168}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000260, iterations_per_second: 3846153.822229}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000264733, iterations_per_second: 3777.386049}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003372600, iterations_per_second: 296.507146}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001860, iterations_per_second: 537634.402730}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002350, iterations_per_second: 425531.914939}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002063000, iterations_per_second: 484.730974}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003329500, iterations_per_second: 300.345397}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.018769400, iterations_per_second: 53.278208}
