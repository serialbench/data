    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001773000, iterations_per_second: 564.015792}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007907000, iterations_per_second: 126.470216}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026716000, iterations_per_second: 37.430753}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.093698000, iterations_per_second: 10.672586}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002879, iterations_per_second: 347294.575919}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002204712, iterations_per_second: 453.574050}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.035901178, iterations_per_second: 27.854239}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011000, iterations_per_second: 90909.090857}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000013100, iterations_per_second: 76335.877857}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003445333, iterations_per_second: 290.247678}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.011343000, iterations_per_second: 88.160099}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.056658000, iterations_per_second: 17.649758}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.172272000, iterations_per_second: 5.804774}
