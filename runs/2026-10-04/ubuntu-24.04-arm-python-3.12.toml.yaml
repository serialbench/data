  tags:
  - local
  - linux
  - arm64
  - python-3.12
benchmark_config:
  name: py-full-toml
  formats:
  - toml
  operations:
  - parsing
  - generation
  - xpath
  - xquery
  - xslt
  - xslt30
  - validation
  - streaming
  - memory
