    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002300000, iterations_per_second: 434.782609}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.009787333, iterations_per_second: 102.172877}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.034433000, iterations_per_second: 29.041907}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.273146000, iterations_per_second: 3.661046}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001741, iterations_per_second: 574481.531310}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002178320, iterations_per_second: 459.069375}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.040827620, iterations_per_second: 24.493223}
  generation:
