    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000017200, iterations_per_second: 58139.534877}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.004495667, iterations_per_second: 222.436420}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.014081667, iterations_per_second: 71.014321}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.067713000, iterations_per_second: 14.768213}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.165747000, iterations_per_second: 6.033292}
