platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.299', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.28', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.28', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.28', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.668350}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285508}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000077000, iterations_per_second: 12987.012988}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000390667, iterations_per_second: 2559.726962}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001127000, iterations_per_second: 887.311446}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005230000, iterations_per_second: 191.204589}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.667719}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000142333, iterations_per_second: 7025.761125}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002311000, iterations_per_second: 432.713111}
  xpath:
  xslt:
