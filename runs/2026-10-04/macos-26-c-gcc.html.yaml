platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.299', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.28', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.28', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.28', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000010200, iterations_per_second: 98039.215715}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006900, iterations_per_second: 144927.536359}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000014500, iterations_per_second: 68965.517253}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000426000, iterations_per_second: 2347.417840}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001254000, iterations_per_second: 797.448166}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001130667, iterations_per_second: 884.433962}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004158000, iterations_per_second: 240.500241}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.011907000, iterations_per_second: 83.984211}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010310000, iterations_per_second: 96.993210}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006300, iterations_per_second: 158730.158558}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000015900, iterations_per_second: 62893.081740}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000845000, iterations_per_second: 1183.431953}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001536333, iterations_per_second: 650.900412}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.006963000, iterations_per_second: 143.616257}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013486000, iterations_per_second: 74.150971}
  xpath:
  xslt:
