platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.299', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.28', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.28', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.28', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.911386}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003100, iterations_per_second: 322580.644793}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006600, iterations_per_second: 151515.151637}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000446667, iterations_per_second: 2238.805970}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001200333, iterations_per_second: 833.101916}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001150000, iterations_per_second: 869.565217}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003829000, iterations_per_second: 261.164795}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.010989000, iterations_per_second: 91.000091}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011520000, iterations_per_second: 86.805556}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.383905}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006900, iterations_per_second: 144927.536359}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000767333, iterations_per_second: 1303.214596}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001463667, iterations_per_second: 683.215668}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008263000, iterations_per_second: 121.021421}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015368000, iterations_per_second: 65.070276}
