platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.299', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.28', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.28', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.28', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000004370, iterations_per_second: 228832.952582}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004410, iterations_per_second: 226757.369778}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000099100, iterations_per_second: 10090.817354}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000548367, iterations_per_second: 1823.597350}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001210100, iterations_per_second: 826.377985}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.006485400, iterations_per_second: 154.192494}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000004740, iterations_per_second: 210970.463757}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000123900, iterations_per_second: 8071.025016}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001865000, iterations_per_second: 536.193030}
  xpath:
  xslt:
