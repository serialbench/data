platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.299', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.28', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.28', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.28', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000587, iterations_per_second: 1703287.344852}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002247, iterations_per_second: 444998.220052}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000079866, iterations_per_second: 12520.972630}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000207274, iterations_per_second: 4824.531779}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001713192, iterations_per_second: 583.705738}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002348489, iterations_per_second: 425.805699}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000852, iterations_per_second: 1174260.214921}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000125301, iterations_per_second: 7980.782276}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002183881, iterations_per_second: 457.900408}
  xpath:
  xslt:
