    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001688649, iterations_per_second: 592.189261}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004523538, iterations_per_second: 221.065916}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023509508, iterations_per_second: 42.535982}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056079069, iterations_per_second: 17.831965}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001355, iterations_per_second: 738279.807959}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001529903, iterations_per_second: 653.636353}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.045513272, iterations_per_second: 21.971613}
