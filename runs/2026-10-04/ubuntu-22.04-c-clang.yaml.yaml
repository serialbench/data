    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007208, iterations_per_second: 138744.363499}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002985069, iterations_per_second: 335.000631}
