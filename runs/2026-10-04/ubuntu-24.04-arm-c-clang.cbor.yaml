    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001165, iterations_per_second: 858516.479517}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000729178, iterations_per_second: 1371.407883}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001761607, iterations_per_second: 567.663610}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014714664, iterations_per_second: 67.959418}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.028921221, iterations_per_second: 34.576687}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000381, iterations_per_second: 2626740.226025}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000370061, iterations_per_second: 2702.259629}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004833406, iterations_per_second: 206.893441}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001813, iterations_per_second: 551419.909569}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001470, iterations_per_second: 680133.304579}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001900009, iterations_per_second: 526.313296}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002032748, iterations_per_second: 491.944975}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023061628, iterations_per_second: 43.362073}
