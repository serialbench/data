    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001104000, iterations_per_second: 905.797101}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001739000, iterations_per_second: 575.043128}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012260000, iterations_per_second: 81.566069}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.024527000, iterations_per_second: 40.771395}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000483667, iterations_per_second: 2067.539628}
