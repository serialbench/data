    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001003333, iterations_per_second: 996.677741}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002629000, iterations_per_second: 380.372765}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.004980000, iterations_per_second: 200.803213}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.016119000, iterations_per_second: 62.038588}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000308333, iterations_per_second: 3243.243243}
