platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.299', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.28', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.28', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.28', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001080, iterations_per_second: 925925.932162}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.858045}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004890, iterations_per_second: 204498.977879}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000326800, iterations_per_second: 3059.975521}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001179833, iterations_per_second: 847.577341}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001443533, iterations_per_second: 692.744654}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003379200, iterations_per_second: 295.928030}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.011242500, iterations_per_second: 88.948188}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.016982600, iterations_per_second: 58.883799}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002590, iterations_per_second: 386100.388262}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006490, iterations_per_second: 154083.204699}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000698400, iterations_per_second: 1431.844215}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002021367, iterations_per_second: 494.714797}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007107000, iterations_per_second: 140.706346}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.026220300, iterations_per_second: 38.138389}
  xpath:
