platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.299', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.28', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.28', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.28', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007700, iterations_per_second: 129870.129815}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010600, iterations_per_second: 94339.622677}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001019667, iterations_per_second: 980.712651}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003832667, iterations_per_second: 260.914942}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024220000, iterations_per_second: 41.288192}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.053777000, iterations_per_second: 18.595310}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002704, iterations_per_second: 369795.134284}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001288431, iterations_per_second: 776.137999}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.025300042, iterations_per_second: 39.525626}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011000, iterations_per_second: 90909.090857}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000015800, iterations_per_second: 63291.139264}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002025000, iterations_per_second: 493.827160}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005940667, iterations_per_second: 168.331276}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.041295000, iterations_per_second: 24.216007}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.098873000, iterations_per_second: 10.113985}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000003542, iterations_per_second: 282350.283370}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001900750, iterations_per_second: 526.108115}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.030958834, iterations_per_second: 32.300958}
  xpath:
  xslt:
