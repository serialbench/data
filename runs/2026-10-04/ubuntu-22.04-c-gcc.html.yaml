platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.299', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.28', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.28', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.28', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001466, iterations_per_second: 682267.857972}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003978, iterations_per_second: 251357.329612}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005627, iterations_per_second: 177727.224252}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000505470, iterations_per_second: 1978.356777}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001693860, iterations_per_second: 590.367679}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001477681, iterations_per_second: 676.735895}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004790383, iterations_per_second: 208.751576}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016708268, iterations_per_second: 59.850608}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014959011, iterations_per_second: 66.849339}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002789, iterations_per_second: 358512.888602}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007369, iterations_per_second: 135707.306480}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000950734, iterations_per_second: 1051.818910}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001904060, iterations_per_second: 525.193442}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009835924, iterations_per_second: 101.668130}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019393869, iterations_per_second: 51.562687}
  xpath:
  xslt:
