platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.299', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.28', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.28', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.28', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.667719}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000008300, iterations_per_second: 120481.927685}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000121000, iterations_per_second: 8264.462810}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000434667, iterations_per_second: 2300.613497}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001068000, iterations_per_second: 936.329588}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003972000, iterations_per_second: 251.762336}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.371305}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000162000, iterations_per_second: 6172.839506}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001763000, iterations_per_second: 567.214974}
  xpath:
  xslt:
