    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000005800, iterations_per_second: 172413.793201}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000979667, iterations_per_second: 1020.755359}
