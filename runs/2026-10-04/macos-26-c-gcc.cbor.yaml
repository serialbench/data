    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000481333, iterations_per_second: 2077.562327}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001577667, iterations_per_second: 633.847454}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006101000, iterations_per_second: 163.907556}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018718000, iterations_per_second: 53.424511}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000381667, iterations_per_second: 2620.087336}
