    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001091000, iterations_per_second: 916.590284}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004236333, iterations_per_second: 236.053191}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015509000, iterations_per_second: 64.478690}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.050309000, iterations_per_second: 19.877159}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000888, iterations_per_second: 1126760.557204}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000938417, iterations_per_second: 1065.624722}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.014121625, iterations_per_second: 70.813380}
  generation:
