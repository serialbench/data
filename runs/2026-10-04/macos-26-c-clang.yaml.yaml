    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000011100, iterations_per_second: 90090.090041}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002030333, iterations_per_second: 492.529962}
