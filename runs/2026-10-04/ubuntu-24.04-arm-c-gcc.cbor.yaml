platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.299', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.28', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.28', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.28', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001054, iterations_per_second: 949036.729513}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001246, iterations_per_second: 802246.289771}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000700314, iterations_per_second: 1427.930900}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001899452, iterations_per_second: 526.467726}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015432358, iterations_per_second: 64.798911}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032220764, iterations_per_second: 31.035887}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000386, iterations_per_second: 2593361.010656}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000322737, iterations_per_second: 3098.494958}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004181403, iterations_per_second: 239.154179}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001803, iterations_per_second: 554785.019843}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001578, iterations_per_second: 633874.239435}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001900246, iterations_per_second: 526.247562}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002169563, iterations_per_second: 460.922315}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.024164816, iterations_per_second: 41.382479}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035587176, iterations_per_second: 28.100010}
  xpath:
  xslt:
