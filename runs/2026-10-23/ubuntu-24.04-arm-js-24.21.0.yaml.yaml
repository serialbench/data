    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.001058623, iterations_per_second: 944.623524}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000022449, iterations_per_second: 44546.075491}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.151803128, iterations_per_second: 6.587480}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.000021504, iterations_per_second: 46502.976190}
