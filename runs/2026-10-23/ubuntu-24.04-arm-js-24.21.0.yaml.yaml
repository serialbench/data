platform:
  platform_string: ubuntu-24.04-arm-js-24.21.0
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: yeptris, format: yaml, version: '0.1.0', features: {wasm: true}}
    - {name: teptris, format: toml, version: '0.3.11', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000070821, iterations_per_second: 14120.125556}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.001579838, iterations_per_second: 632.976172}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000011638, iterations_per_second: 85927.877868}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.111153060, iterations_per_second: 8.996603}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.000011272, iterations_per_second: 88715.400994}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.476621027, iterations_per_second: 0.677222}
  generation:
