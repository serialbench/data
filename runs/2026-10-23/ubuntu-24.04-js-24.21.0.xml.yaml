platform:
  platform_string: ubuntu-24.04-js-24.21.0
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: yeptris, format: yaml, version: '0.1.0', features: {wasm: true}}
    - {name: teptris, format: toml, version: '0.3.11', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000022289, iterations_per_second: 44865.985302}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000206244, iterations_per_second: 4848.635303}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003271234, iterations_per_second: 305.695006}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.029538627, iterations_per_second: 33.853977}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.022252193, iterations_per_second: 44.939391}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.440580549, iterations_per_second: 2.269733}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000030311, iterations_per_second: 32990.779077}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.004053464, iterations_per_second: 246.702594}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.040653203, iterations_per_second: 24.598308}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000036909, iterations_per_second: 27093.809606}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003826173, iterations_per_second: 261.357759}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.040798214, iterations_per_second: 24.510877}
