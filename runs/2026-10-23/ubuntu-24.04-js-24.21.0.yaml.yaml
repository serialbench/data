platform:
  platform_string: ubuntu-24.04-js-24.21.0
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: yeptris, format: yaml, version: '0.1.0', features: {wasm: true}}
    - {name: teptris, format: toml, version: '0.3.11', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000112804, iterations_per_second: 8864.965303}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.002193353, iterations_per_second: 455.922922}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000037056, iterations_per_second: 26986.183074}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.118137599, iterations_per_second: 8.464706}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.000021851, iterations_per_second: 45764.495904}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.453379584, iterations_per_second: 0.688051}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000675056, iterations_per_second: 1481.358364}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.001133261, iterations_per_second: 882.408948}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000115212, iterations_per_second: 8679.676537}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.154156889, iterations_per_second: 6.486898}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.000054030, iterations_per_second: 18508.236165}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 2.037568352, iterations_per_second: 0.490781}
