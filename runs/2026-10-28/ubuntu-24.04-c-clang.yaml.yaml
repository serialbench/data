platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004253, iterations_per_second: 235106.032809}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003256, iterations_per_second: 307078.151409}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001287591, iterations_per_second: 776.644337}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003007308, iterations_per_second: 332.523343}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016994672, iterations_per_second: 58.841971}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.036823587, iterations_per_second: 27.156507}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000786, iterations_per_second: 1271779.220205}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000861539, iterations_per_second: 1160.713111}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.017758998, iterations_per_second: 56.309483}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005766, iterations_per_second: 173445.494735}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004825, iterations_per_second: 207262.477206}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002183024, iterations_per_second: 458.080098}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004234629, iterations_per_second: 236.148196}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.027995828, iterations_per_second: 35.719608}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.053208154, iterations_per_second: 18.794112}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000965, iterations_per_second: 1036376.825958}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001114004, iterations_per_second: 897.662845}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020292056, iterations_per_second: 49.280369}
  xpath:
  xslt:
