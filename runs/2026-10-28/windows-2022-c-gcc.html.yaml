platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.8.5', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001670, iterations_per_second: 598802.395091}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004420, iterations_per_second: 226244.343939}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007810, iterations_per_second: 128040.973118}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000461067, iterations_per_second: 2168.883748}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002172467, iterations_per_second: 460.306257}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001882533, iterations_per_second: 531.199093}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004702100, iterations_per_second: 212.670934}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.021494300, iterations_per_second: 46.523962}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019975900, iterations_per_second: 50.060323}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003530, iterations_per_second: 283286.118692}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009740, iterations_per_second: 102669.404501}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000922767, iterations_per_second: 1083.697576}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002609733, iterations_per_second: 383.180912}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009685500, iterations_per_second: 103.247122}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.025925200, iterations_per_second: 38.572509}
  xpath:
  xslt:
