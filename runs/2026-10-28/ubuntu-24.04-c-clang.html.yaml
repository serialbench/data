platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000000970, iterations_per_second: 1030396.703099}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002442, iterations_per_second: 409433.344203}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003803, iterations_per_second: 262964.131652}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000326189, iterations_per_second: 3065.707305}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001369617, iterations_per_second: 730.130947}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000907108, iterations_per_second: 1102.404565}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003314988, iterations_per_second: 301.660217}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.013518896, iterations_per_second: 73.970537}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009813024, iterations_per_second: 101.905386}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001828, iterations_per_second: 547105.810297}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004734, iterations_per_second: 211255.703929}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000632532, iterations_per_second: 1580.946850}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001231006, iterations_per_second: 812.343945}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.006632414, iterations_per_second: 150.774665}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012814224, iterations_per_second: 78.038280}
  xpath:
  xslt:
