    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008400, iterations_per_second: 119047.619026}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001291667, iterations_per_second: 774.193548}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004233000, iterations_per_second: 236.239074}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019476000, iterations_per_second: 51.345245}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.046085000, iterations_per_second: 21.699034}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001083, iterations_per_second: 923105.323504}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000975861, iterations_per_second: 1024.735755}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018567791, iterations_per_second: 53.856703}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008500, iterations_per_second: 117647.058885}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008800, iterations_per_second: 113636.363630}
