platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.000468}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370136}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000509333, iterations_per_second: 1963.350785}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001422000, iterations_per_second: 703.234880}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006110000, iterations_per_second: 163.666121}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.021736000, iterations_per_second: 46.006625}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000320333, iterations_per_second: 3121.748179}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004735000, iterations_per_second: 211.193242}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.555204}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285740}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000951333, iterations_per_second: 1051.156272}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001729333, iterations_per_second: 578.257517}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014395000, iterations_per_second: 69.468565}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.022336000, iterations_per_second: 44.770774}
  xpath:
  xslt:
