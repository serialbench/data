platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000842, iterations_per_second: 1188212.925749}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003074, iterations_per_second: 325340.794751}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000062170, iterations_per_second: 16084.928423}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000311727, iterations_per_second: 3207.938579}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001075913, iterations_per_second: 929.443180}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003757604, iterations_per_second: 266.127032}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000734, iterations_per_second: 1363140.674236}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000092264, iterations_per_second: 10838.463540}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001449565, iterations_per_second: 689.862131}
  xpath:
  xslt:
