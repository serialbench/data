    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000013600, iterations_per_second: 73529.411704}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003354000, iterations_per_second: 298.151461}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.013708000, iterations_per_second: 72.950102}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.053870000, iterations_per_second: 18.563208}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.166677000, iterations_per_second: 5.999628}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001949, iterations_per_second: 513004.660210}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002679068, iterations_per_second: 373.264089}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.052880372, iterations_per_second: 18.910608}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000021100, iterations_per_second: 47393.364921}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000022300, iterations_per_second: 44843.049326}
