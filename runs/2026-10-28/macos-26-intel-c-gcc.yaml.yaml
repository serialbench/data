    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.004437356, iterations_per_second: 225.359443}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.087435524, iterations_per_second: 11.436999}
  generation:
