platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000585, iterations_per_second: 1709109.562986}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003449, iterations_per_second: 289981.151102}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000078881, iterations_per_second: 12677.324071}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000400529, iterations_per_second: 2496.700194}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001708685, iterations_per_second: 585.245379}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004728090, iterations_per_second: 211.501896}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000814, iterations_per_second: 1229256.295398}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000123511, iterations_per_second: 8096.466701}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002128990, iterations_per_second: 469.706293}
  xpath:
  xslt:
