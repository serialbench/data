    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004374000, iterations_per_second: 228.623685}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015323000, iterations_per_second: 65.261372}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010916000, iterations_per_second: 91.608648}
