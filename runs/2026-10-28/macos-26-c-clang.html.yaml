    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006500, iterations_per_second: 153846.153898}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000423000, iterations_per_second: 2364.066194}
