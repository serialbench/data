platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002864, iterations_per_second: 349149.820187}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004014, iterations_per_second: 249097.023380}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001767368, iterations_per_second: 565.813119}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003966576, iterations_per_second: 252.106582}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023412030, iterations_per_second: 42.713084}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048486576, iterations_per_second: 20.624265}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001198, iterations_per_second: 835003.338301}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001194987, iterations_per_second: 836.828954}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028332114, iterations_per_second: 35.295637}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004484, iterations_per_second: 223010.191542}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006062, iterations_per_second: 164967.501424}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002762538, iterations_per_second: 361.985927}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005487707, iterations_per_second: 182.225461}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040977787, iterations_per_second: 24.403465}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.069011419, iterations_per_second: 14.490356}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001477, iterations_per_second: 677139.761657}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001453230, iterations_per_second: 688.122163}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.033027783, iterations_per_second: 30.277539}
  xpath:
  xslt:
