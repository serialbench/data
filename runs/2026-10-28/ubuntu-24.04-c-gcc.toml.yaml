platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000437, iterations_per_second: 2290426.012379}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003753, iterations_per_second: 266481.905880}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000056899, iterations_per_second: 17575.001319}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000401898, iterations_per_second: 2488.193522}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001252284, iterations_per_second: 798.540906}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004854443, iterations_per_second: 205.996857}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000583, iterations_per_second: 1715854.500005}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000092573, iterations_per_second: 10802.324660}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001523873, iterations_per_second: 656.222664}
  xpath:
  xslt:
