platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285508}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003100, iterations_per_second: 322580.645384}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000043000, iterations_per_second: 23255.813951}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000227667, iterations_per_second: 4392.386530}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000556000, iterations_per_second: 1798.561151}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002421000, iterations_per_second: 413.052458}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.335437}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000182667, iterations_per_second: 5474.452554}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001003000, iterations_per_second: 997.008973}
  xpath:
  xslt:
