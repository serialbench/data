platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004481, iterations_per_second: 223149.532561}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004696, iterations_per_second: 212960.793940}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001966456, iterations_per_second: 508.528963}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004527746, iterations_per_second: 220.860446}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026336672, iterations_per_second: 37.969870}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055949130, iterations_per_second: 17.873379}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001424, iterations_per_second: 702444.506963}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001798133, iterations_per_second: 556.132388}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.046337783, iterations_per_second: 21.580661}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007166, iterations_per_second: 139542.023080}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000011370, iterations_per_second: 87949.200525}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003216920, iterations_per_second: 310.856347}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006739462, iterations_per_second: 148.379796}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.050707014, iterations_per_second: 19.721138}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.087555970, iterations_per_second: 11.421266}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001736, iterations_per_second: 575937.337620}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002249830, iterations_per_second: 444.478027}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.050302572, iterations_per_second: 19.879699}
  xpath:
  xslt:
