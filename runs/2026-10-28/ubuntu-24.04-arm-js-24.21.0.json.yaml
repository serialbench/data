platform:
  platform_string: ubuntu-24.04-arm-js-24.21.0
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000002130, iterations_per_second: 469373.386529}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001183762, iterations_per_second: 844.764642}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.011674927, iterations_per_second: 85.653640}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000006197, iterations_per_second: 161368.404067}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001777356, iterations_per_second: 562.633485}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.016309278, iterations_per_second: 61.314793}
