platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.646818}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001191000, iterations_per_second: 839.630563}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003774667, iterations_per_second: 264.924055}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.017005000, iterations_per_second: 58.806233}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.061226000, iterations_per_second: 16.332930}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002588, iterations_per_second: 386473.429866}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001224653, iterations_per_second: 816.558055}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.023467792, iterations_per_second: 42.611593}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005400, iterations_per_second: 185185.184873}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.426338}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002335667, iterations_per_second: 428.143285}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007930333, iterations_per_second: 126.098104}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.041843000, iterations_per_second: 23.898860}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.105551000, iterations_per_second: 9.474093}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000003458, iterations_per_second: 289159.413572}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001551972, iterations_per_second: 644.341522}
