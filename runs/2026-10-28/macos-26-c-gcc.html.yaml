    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007100, iterations_per_second: 140845.070327}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000016100, iterations_per_second: 62111.801246}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000448333, iterations_per_second: 2230.483271}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001602000, iterations_per_second: 624.219725}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001117000, iterations_per_second: 895.255148}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004407000, iterations_per_second: 226.911731}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014913000, iterations_per_second: 67.055589}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012914000, iterations_per_second: 77.435341}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006700, iterations_per_second: 149253.731340}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000022000, iterations_per_second: 45454.545452}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000862667, iterations_per_second: 1159.196291}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001576667, iterations_per_second: 634.249471}
