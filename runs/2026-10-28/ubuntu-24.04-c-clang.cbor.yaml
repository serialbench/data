platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000772, iterations_per_second: 1296176.278376}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000728, iterations_per_second: 1372872.049906}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000587479, iterations_per_second: 1702.189470}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001354230, iterations_per_second: 738.427185}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.009685033, iterations_per_second: 103.252100}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.026556596, iterations_per_second: 37.655428}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000277, iterations_per_second: 3611412.055221}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000287693, iterations_per_second: 3475.927464}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003493243, iterations_per_second: 286.266944}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001398, iterations_per_second: 715563.506176}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001065, iterations_per_second: 938614.604178}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001726076, iterations_per_second: 579.348766}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001713137, iterations_per_second: 583.724364}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.019782552, iterations_per_second: 50.549595}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.029532762, iterations_per_second: 33.860700}
