platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000549, iterations_per_second: 1822157.434624}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002028, iterations_per_second: 493120.962288}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000069106, iterations_per_second: 14470.523543}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000193817, iterations_per_second: 5159.506132}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001073194, iterations_per_second: 931.797979}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002348946, iterations_per_second: 425.722856}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000728, iterations_per_second: 1373626.372590}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000090203, iterations_per_second: 11086.064818}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001433744, iterations_per_second: 697.474584}
  xpath:
  xslt:
