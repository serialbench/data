platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001105, iterations_per_second: 905223.136258}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004907, iterations_per_second: 203773.892476}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004186, iterations_per_second: 238874.423838}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000346922, iterations_per_second: 2882.495088}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001584324, iterations_per_second: 631.184158}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000977788, iterations_per_second: 1022.716929}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003476811, iterations_per_second: 287.619891}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015844367, iterations_per_second: 63.113913}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009718341, iterations_per_second: 102.898221}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002172, iterations_per_second: 460341.573379}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005308, iterations_per_second: 188394.875707}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000743305, iterations_per_second: 1345.342760}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001280002, iterations_per_second: 781.248576}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007659694, iterations_per_second: 130.553518}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013155753, iterations_per_second: 76.012373}
  xpath:
  xslt:
