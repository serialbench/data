platform:
  platform_string: ubuntu-24.04-js-24.22.1
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.1
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.1', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000597903, iterations_per_second: 1672.511817}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.129262490, iterations_per_second: 7.736196}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.540929006, iterations_per_second: 0.648959}
  generation:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000958133, iterations_per_second: 1043.696330}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.162604495, iterations_per_second: 6.149892}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 2.223324094, iterations_per_second: 0.449777}
  xpath:
