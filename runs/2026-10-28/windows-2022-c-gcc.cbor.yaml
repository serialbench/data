platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.8.5', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001650, iterations_per_second: 606060.605503}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002490, iterations_per_second: 401606.425250}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001550900, iterations_per_second: 644.786898}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003429233, iterations_per_second: 291.610370}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013144900, iterations_per_second: 76.075132}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.048302000, iterations_per_second: 20.703076}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000370, iterations_per_second: 2702702.717831}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000355800, iterations_per_second: 2810.567735}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004517200, iterations_per_second: 221.376074}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002470, iterations_per_second: 404858.298940}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003060, iterations_per_second: 326797.385596}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002268800, iterations_per_second: 440.761636}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004298567, iterations_per_second: 232.635685}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022927600, iterations_per_second: 43.615555}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.057147500, iterations_per_second: 17.498578}
  xpath:
  xslt:
