    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001058000, iterations_per_second: 945.179584}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004493000, iterations_per_second: 222.568440}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.019269000, iterations_per_second: 51.896829}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.022716000, iterations_per_second: 44.021835}
  generation:
