platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001514, iterations_per_second: 660589.246451}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001350, iterations_per_second: 740466.495542}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001030767, iterations_per_second: 970.151353}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002059868, iterations_per_second: 485.468079}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.032000747, iterations_per_second: 31.249271}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.045912587, iterations_per_second: 21.780520}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000408, iterations_per_second: 2452783.858546}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000387548, iterations_per_second: 2580.327753}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004717900, iterations_per_second: 211.958710}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002446, iterations_per_second: 408897.611945}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001830, iterations_per_second: 546328.673631}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003476773, iterations_per_second: 287.623007}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002579312, iterations_per_second: 387.700286}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.042666577, iterations_per_second: 23.437549}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.052881776, iterations_per_second: 18.910106}
  xpath:
  xslt:
