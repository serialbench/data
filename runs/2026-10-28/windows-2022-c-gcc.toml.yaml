platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.8.5', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000740, iterations_per_second: 1351351.358915}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005650, iterations_per_second: 176991.150355}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000053067, iterations_per_second: 18844.221101}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000691400, iterations_per_second: 1446.340758}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001211300, iterations_per_second: 825.559316}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.008254800, iterations_per_second: 121.141639}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000005470, iterations_per_second: 182815.356610}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000120300, iterations_per_second: 8312.551954}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001749700, iterations_per_second: 571.526547}
  xpath:
  xslt:
