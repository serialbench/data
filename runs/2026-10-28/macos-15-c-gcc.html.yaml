    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000009500, iterations_per_second: 105263.157909}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.777602}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000840333, iterations_per_second: 1190.003967}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001542333, iterations_per_second: 648.368273}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001383333, iterations_per_second: 722.891566}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005627000, iterations_per_second: 177.714590}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.017220000, iterations_per_second: 58.072009}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012893000, iterations_per_second: 77.561467}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005800, iterations_per_second: 172413.793201}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.727259}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000873000, iterations_per_second: 1145.475372}
