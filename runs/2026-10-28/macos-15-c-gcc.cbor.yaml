    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.335437}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000653000, iterations_per_second: 1531.393568}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001385667, iterations_per_second: 721.674284}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007850000, iterations_per_second: 127.388535}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.029534000, iterations_per_second: 33.859281}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000328333, iterations_per_second: 3045.685279}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004259000, iterations_per_second: 234.796901}
  generation:
