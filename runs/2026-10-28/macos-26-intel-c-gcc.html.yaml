platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000004800, iterations_per_second: 208333.333366}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000013300, iterations_per_second: 75187.969922}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000014800, iterations_per_second: 67567.567582}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001986333, iterations_per_second: 503.440175}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.007105000, iterations_per_second: 140.745954}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.004141667, iterations_per_second: 241.448692}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020964000, iterations_per_second: 47.700820}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.075501000, iterations_per_second: 13.244858}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.048759000, iterations_per_second: 20.509034}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000010900, iterations_per_second: 91743.119306}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000018500, iterations_per_second: 54054.054058}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003282667, iterations_per_second: 304.630382}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.010562333, iterations_per_second: 94.676050}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.039522000, iterations_per_second: 25.302363}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.084171000, iterations_per_second: 11.880576}
  xpath:
