platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001533, iterations_per_second: 652358.274862}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004191, iterations_per_second: 238612.231566}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005666, iterations_per_second: 176503.812577}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000563858, iterations_per_second: 1773.497212}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002133159, iterations_per_second: 468.788382}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001451567, iterations_per_second: 688.910516}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005267790, iterations_per_second: 189.832928}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.021391590, iterations_per_second: 46.747343}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015054379, iterations_per_second: 66.425855}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002852, iterations_per_second: 350594.257647}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007388, iterations_per_second: 135358.293464}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000985309, iterations_per_second: 1014.910043}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001860061, iterations_per_second: 537.616681}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010336017, iterations_per_second: 96.749067}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018907424, iterations_per_second: 52.889278}
  xpath:
  xslt:
