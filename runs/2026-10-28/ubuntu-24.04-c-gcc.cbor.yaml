platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000974, iterations_per_second: 1026272.576900}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1110740.863861}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000567554, iterations_per_second: 1761.946881}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001638278, iterations_per_second: 610.396890}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010799411, iterations_per_second: 92.597643}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034311731, iterations_per_second: 29.144551}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000324, iterations_per_second: 3081664.110172}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000282508, iterations_per_second: 3539.718592}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003511835, iterations_per_second: 284.751419}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001573, iterations_per_second: 635606.686667}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001314, iterations_per_second: 761035.006371}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002189875, iterations_per_second: 456.646999}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002087051, iterations_per_second: 479.145052}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.018652258, iterations_per_second: 53.612812}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.039989856, iterations_per_second: 25.006342}
  xpath:
  xslt:
