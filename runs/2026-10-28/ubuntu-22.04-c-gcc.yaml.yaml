platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005072, iterations_per_second: 197180.321237}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004864, iterations_per_second: 205587.878872}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002087924, iterations_per_second: 478.944712}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004572906, iterations_per_second: 218.679326}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.028817726, iterations_per_second: 34.700864}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056397088, iterations_per_second: 17.731412}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001660, iterations_per_second: 602373.352082}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001935776, iterations_per_second: 516.588785}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.047999468, iterations_per_second: 20.833564}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007288, iterations_per_second: 137219.386373}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007339, iterations_per_second: 136263.915872}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003421143, iterations_per_second: 292.300000}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006756852, iterations_per_second: 147.997907}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.053784182, iterations_per_second: 18.592827}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085908952, iterations_per_second: 11.640230}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002020, iterations_per_second: 495098.524223}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002426687, iterations_per_second: 412.084516}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.052017810, iterations_per_second: 19.224185}
  xpath:
  xslt:
