    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.018467000, iterations_per_second: 54.150647}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.076796000, iterations_per_second: 13.021512}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000700, iterations_per_second: 1428571.408977}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000651000, iterations_per_second: 1536.098310}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.008026000, iterations_per_second: 124.595066}
  generation:
