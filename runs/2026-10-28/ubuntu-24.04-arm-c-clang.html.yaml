    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003089, iterations_per_second: 323687.447494}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005021, iterations_per_second: 199147.648074}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000469923, iterations_per_second: 2128.009715}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001622410, iterations_per_second: 616.366883}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001350072, iterations_per_second: 740.701054}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004631819, iterations_per_second: 215.897901}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016034126, iterations_per_second: 62.366979}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013631857, iterations_per_second: 73.357577}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002437, iterations_per_second: 410391.103050}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006276, iterations_per_second: 159344.774301}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000841107, iterations_per_second: 1188.909849}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001774467, iterations_per_second: 563.549611}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008579795, iterations_per_second: 116.552901}
