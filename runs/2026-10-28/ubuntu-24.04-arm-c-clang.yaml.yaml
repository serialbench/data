platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002860, iterations_per_second: 349662.575743}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008805, iterations_per_second: 113569.254537}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001767927, iterations_per_second: 565.634108}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003957028, iterations_per_second: 252.714916}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023408272, iterations_per_second: 42.719941}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047953784, iterations_per_second: 20.853412}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001163, iterations_per_second: 859771.300341}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001207321, iterations_per_second: 828.280134}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027869177, iterations_per_second: 35.881935}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004382, iterations_per_second: 228195.883298}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005972, iterations_per_second: 167434.072834}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002754824, iterations_per_second: 362.999552}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005524995, iterations_per_second: 180.995650}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.041185516, iterations_per_second: 24.280381}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068933443, iterations_per_second: 14.506747}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001420, iterations_per_second: 704274.947938}
