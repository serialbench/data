platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003391, iterations_per_second: 294889.563835}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005364, iterations_per_second: 186428.038860}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001408562, iterations_per_second: 709.943732}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002857005, iterations_per_second: 350.016929}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.017412116, iterations_per_second: 57.431274}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.034998404, iterations_per_second: 28.572731}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001192, iterations_per_second: 839066.956652}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000944331, iterations_per_second: 1058.951102}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.015575723, iterations_per_second: 64.202477}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004865, iterations_per_second: 205537.171426}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004662, iterations_per_second: 214500.214472}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002197099, iterations_per_second: 455.145695}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004128688, iterations_per_second: 242.207675}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.029313040, iterations_per_second: 34.114510}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.051628002, iterations_per_second: 19.369334}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001442, iterations_per_second: 693385.106450}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001204792, iterations_per_second: 830.018562}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018952594, iterations_per_second: 52.763226}
  xpath:
  xslt:
