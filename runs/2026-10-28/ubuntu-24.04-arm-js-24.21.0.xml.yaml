platform:
  platform_string: ubuntu-24.04-arm-js-24.21.0
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000016866, iterations_per_second: 59290.529524}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000115192, iterations_per_second: 8681.128269}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003206352, iterations_per_second: 311.880916}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.026757184, iterations_per_second: 37.373141}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.025480824, iterations_per_second: 39.245199}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.389874367, iterations_per_second: 2.564929}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000018283, iterations_per_second: 54695.618881}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003991659, iterations_per_second: 250.522402}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.046055594, iterations_per_second: 21.712889}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000027618, iterations_per_second: 36207.614461}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003376696, iterations_per_second: 296.147477}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.043181304, iterations_per_second: 23.158170}
