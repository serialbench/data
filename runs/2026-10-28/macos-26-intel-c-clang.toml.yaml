platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 500000.001262}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000007000, iterations_per_second: 142857.142754}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000155000, iterations_per_second: 6451.612902}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000581333, iterations_per_second: 1720.183486}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001580000, iterations_per_second: 632.911392}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.008166000, iterations_per_second: 122.458976}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312500.000789}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000226333, iterations_per_second: 4418.262152}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.003911000, iterations_per_second: 255.689082}
  xpath:
  xslt:
