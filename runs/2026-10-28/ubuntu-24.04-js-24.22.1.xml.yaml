platform:
  platform_string: ubuntu-24.04-js-24.22.1
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.1
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.1', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000021296, iterations_per_second: 46958.057063}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000262784, iterations_per_second: 3805.409618}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.004083973, iterations_per_second: 244.859621}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.037037164, iterations_per_second: 26.999907}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.021142915, iterations_per_second: 47.297168}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.449118481, iterations_per_second: 2.226584}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000032076, iterations_per_second: 31176.248687}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.006057814, iterations_per_second: 165.076049}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.043876759, iterations_per_second: 22.791109}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000033025, iterations_per_second: 30279.724091}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003051389, iterations_per_second: 327.719642}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.042370056, iterations_per_second: 23.601574}
