platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001267, iterations_per_second: 789016.884703}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001176, iterations_per_second: 850195.546021}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000972687, iterations_per_second: 1028.079948}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001958284, iterations_per_second: 510.651075}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.030447372, iterations_per_second: 32.843557}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.042773842, iterations_per_second: 23.378774}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000454, iterations_per_second: 2203128.454959}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000469804, iterations_per_second: 2128.547224}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005576057, iterations_per_second: 179.338195}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002164, iterations_per_second: 462085.855779}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001685, iterations_per_second: 593436.591369}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003387040, iterations_per_second: 295.243073}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002476903, iterations_per_second: 403.729981}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.041785152, iterations_per_second: 23.931946}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.050118550, iterations_per_second: 19.952692}
  xpath:
  xslt:
