platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.385', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.48', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.48', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.9', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.48', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001563, iterations_per_second: 639836.202370}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004444, iterations_per_second: 225007.312701}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005518, iterations_per_second: 181215.229326}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000541839, iterations_per_second: 1845.567807}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002229570, iterations_per_second: 448.516979}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001413010, iterations_per_second: 707.709075}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004992813, iterations_per_second: 200.287894}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.022174242, iterations_per_second: 45.097370}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014351843, iterations_per_second: 69.677462}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002914, iterations_per_second: 343112.026254}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007104, iterations_per_second: 140759.821534}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000960418, iterations_per_second: 1041.213666}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001814768, iterations_per_second: 551.034724}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009998991, iterations_per_second: 100.010091}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018920717, iterations_per_second: 52.852120}
  xpath:
  xslt:
