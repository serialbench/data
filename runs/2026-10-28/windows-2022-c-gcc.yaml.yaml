    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002777567, iterations_per_second: 360.027362}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027006800, iterations_per_second: 37.027712}
