platform:
  platform_string: ubuntu-24.04-arm-js-24.22.1
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.22.1
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.1', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000015476, iterations_per_second: 64617.432491}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000174044, iterations_per_second: 5745.666905}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002441260, iterations_per_second: 409.624482}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.027895692, iterations_per_second: 35.847829}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.026051743, iterations_per_second: 38.385148}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.384484829, iterations_per_second: 2.600883}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000019415, iterations_per_second: 51506.567087}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.004029616, iterations_per_second: 248.162604}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.046248402, iterations_per_second: 21.622369}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000030010, iterations_per_second: 33322.670079}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003468666, iterations_per_second: 288.295242}
