platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608719}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000008100, iterations_per_second: 123456.790089}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000104667, iterations_per_second: 9554.140127}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000546000, iterations_per_second: 1831.501831}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000667000, iterations_per_second: 1499.250375}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003176000, iterations_per_second: 314.861461}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 400000.000100}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000188333, iterations_per_second: 5309.734513}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001516000, iterations_per_second: 659.630607}
  xpath:
  xslt:
