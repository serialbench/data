platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 769230.764446}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 250000.000631}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000075667, iterations_per_second: 13215.859031}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000430333, iterations_per_second: 2323.780015}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001107000, iterations_per_second: 903.342367}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005399000, iterations_per_second: 185.219485}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.663771}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000172000, iterations_per_second: 5813.953488}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002191000, iterations_per_second: 456.412597}
  xpath:
  xslt:
