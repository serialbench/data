    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007500, iterations_per_second: 133333.333367}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008900, iterations_per_second: 112359.550558}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000689667, iterations_per_second: 1449.975834}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001520667, iterations_per_second: 657.606313}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001066000, iterations_per_second: 938.086304}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004962000, iterations_per_second: 201.531640}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.013828000, iterations_per_second: 72.317038}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012039000, iterations_per_second: 83.063377}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005800, iterations_per_second: 172413.793116}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000011200, iterations_per_second: 89285.714285}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000971000, iterations_per_second: 1029.866117}
