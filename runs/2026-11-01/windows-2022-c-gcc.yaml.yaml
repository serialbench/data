platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.8.5', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005190, iterations_per_second: 192678.227298}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000011520, iterations_per_second: 86805.555569}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002058233, iterations_per_second: 485.853564}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007238833, iterations_per_second: 138.143808}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.027422400, iterations_per_second: 36.466538}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.087414300, iterations_per_second: 11.439776}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001510, iterations_per_second: 662251.658797}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002185433, iterations_per_second: 457.575157}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027626100, iterations_per_second: 36.197654}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000085380, iterations_per_second: 11712.344812}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000019560, iterations_per_second: 51124.744410}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003727867, iterations_per_second: 268.249937}
