platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001339, iterations_per_second: 746714.461168}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001268, iterations_per_second: 788581.346511}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000678050, iterations_per_second: 1474.816766}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001889244, iterations_per_second: 529.312254}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.017196438, iterations_per_second: 58.151578}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034936039, iterations_per_second: 28.623737}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000362, iterations_per_second: 2765486.757687}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000323142, iterations_per_second: 3094.614751}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004177815, iterations_per_second: 239.359570}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001715, iterations_per_second: 583022.386193}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001541, iterations_per_second: 648971.382178}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002080687, iterations_per_second: 480.610414}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002172956, iterations_per_second: 460.202600}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.026034573, iterations_per_second: 38.410463}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040256323, iterations_per_second: 24.840818}
