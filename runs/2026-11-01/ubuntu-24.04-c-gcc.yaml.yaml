platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002459, iterations_per_second: 406718.997632}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000002333, iterations_per_second: 428724.544466}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001010037, iterations_per_second: 990.062740}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002119123, iterations_per_second: 471.893251}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.013548608, iterations_per_second: 73.808320}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.026465996, iterations_per_second: 37.784333}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000895, iterations_per_second: 1116819.297515}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000681465, iterations_per_second: 1467.427512}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.025667381, iterations_per_second: 38.959955}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003605, iterations_per_second: 277361.735239}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003658, iterations_per_second: 273403.324483}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001563342, iterations_per_second: 639.655439}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002957361, iterations_per_second: 338.139269}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.027077858, iterations_per_second: 36.930543}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.037039966, iterations_per_second: 26.997865}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001152, iterations_per_second: 868281.669175}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000844103, iterations_per_second: 1184.689078}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027950775, iterations_per_second: 35.777183}
  xpath:
  xslt:
