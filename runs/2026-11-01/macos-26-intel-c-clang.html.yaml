    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000018700, iterations_per_second: 53475.935931}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001542333, iterations_per_second: 648.368273}
