    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003353333, iterations_per_second: 298.210736}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018854000, iterations_per_second: 53.039143}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.066547000, iterations_per_second: 15.026973}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.039868000, iterations_per_second: 25.082773}
