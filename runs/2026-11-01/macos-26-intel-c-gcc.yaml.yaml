platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008500, iterations_per_second: 117647.058649}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010700, iterations_per_second: 93457.943863}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002477333, iterations_per_second: 403.659849}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008209333, iterations_per_second: 121.812571}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.034943000, iterations_per_second: 28.618035}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.098754000, iterations_per_second: 10.126172}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001448, iterations_per_second: 690369.355331}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001805043, iterations_per_second: 554.003320}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032216410, iterations_per_second: 31.040082}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011700, iterations_per_second: 85470.085437}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000013500, iterations_per_second: 74074.074074}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.004054667, iterations_per_second: 246.629398}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.011898000, iterations_per_second: 84.047739}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.060918000, iterations_per_second: 16.415509}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.142653000, iterations_per_second: 7.010017}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002116, iterations_per_second: 472679.145340}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002404846, iterations_per_second: 415.827100}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.039186259, iterations_per_second: 25.519149}
  xpath:
  xslt:
