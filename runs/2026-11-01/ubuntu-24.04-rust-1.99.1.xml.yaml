    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001879790, iterations_per_second: 531.974411}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.025002652, iterations_per_second: 39.995757}
