platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000578, iterations_per_second: 1730403.169486}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001810, iterations_per_second: 552577.773319}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000067539, iterations_per_second: 14806.187012}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000192362, iterations_per_second: 5198.540943}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001200457, iterations_per_second: 833.016093}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002189704, iterations_per_second: 456.682730}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000793, iterations_per_second: 1261193.099025}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000098771, iterations_per_second: 10124.429238}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001564573, iterations_per_second: 639.152024}
  xpath:
  xslt:
