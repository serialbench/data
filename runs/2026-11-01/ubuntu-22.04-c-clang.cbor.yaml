    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001351, iterations_per_second: 740411.664886}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000707583, iterations_per_second: 1413.261100}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001788007, iterations_per_second: 559.281927}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.019017773, iterations_per_second: 52.582392}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.046408519, iterations_per_second: 21.547768}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000402, iterations_per_second: 2487562.185486}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000376963, iterations_per_second: 2652.782592}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004773924, iterations_per_second: 209.471286}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002660, iterations_per_second: 376010.528175}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001878, iterations_per_second: 532509.717864}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002177837, iterations_per_second: 459.171187}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002285318, iterations_per_second: 437.575929}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.029549471, iterations_per_second: 33.841553}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.054323684, iterations_per_second: 18.408177}
