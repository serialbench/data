platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000558, iterations_per_second: 1793400.284817}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002037, iterations_per_second: 490821.635375}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000068148, iterations_per_second: 14674.016719}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000191260, iterations_per_second: 5228.484785}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001234779, iterations_per_second: 809.861522}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002337486, iterations_per_second: 427.810049}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000738, iterations_per_second: 1354462.956126}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000097290, iterations_per_second: 10278.548669}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001580829, iterations_per_second: 632.579488}
  xpath:
  xslt:
