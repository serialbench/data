platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001381, iterations_per_second: 724270.298317}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003133, iterations_per_second: 319223.648104}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005044, iterations_per_second: 198267.145156}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000472991, iterations_per_second: 2114.205133}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001638896, iterations_per_second: 610.166968}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001341877, iterations_per_second: 745.224786}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004663086, iterations_per_second: 214.450259}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015958871, iterations_per_second: 62.661074}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014109805, iterations_per_second: 70.872702}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002390, iterations_per_second: 418375.031710}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006328, iterations_per_second: 158037.802663}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000873198, iterations_per_second: 1145.216070}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001767439, iterations_per_second: 565.790283}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008667360, iterations_per_second: 115.375385}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018205808, iterations_per_second: 54.927526}
  xpath:
  xslt:
