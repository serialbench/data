platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000553, iterations_per_second: 1808972.502754}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002034, iterations_per_second: 491617.915009}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000080671, iterations_per_second: 12395.977093}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000197861, iterations_per_second: 5054.053098}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001659935, iterations_per_second: 602.433228}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002286898, iterations_per_second: 437.273547}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000768, iterations_per_second: 1301913.813375}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000120177, iterations_per_second: 8321.036690}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002077043, iterations_per_second: 481.453682}
  xpath:
  xslt:
