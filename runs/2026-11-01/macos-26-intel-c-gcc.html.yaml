    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000013500, iterations_per_second: 74074.074074}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008000, iterations_per_second: 125000.000316}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000998000, iterations_per_second: 1002.004008}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004027000, iterations_per_second: 248.323814}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002675000, iterations_per_second: 373.831776}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009883000, iterations_per_second: 101.183851}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.041148000, iterations_per_second: 24.302518}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.031418000, iterations_per_second: 31.828888}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005800, iterations_per_second: 172413.792863}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010300, iterations_per_second: 97087.378564}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002160667, iterations_per_second: 462.820117}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003788667, iterations_per_second: 263.945099}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021224000, iterations_per_second: 47.116472}
