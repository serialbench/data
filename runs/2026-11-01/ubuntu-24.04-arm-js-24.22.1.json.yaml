platform:
  platform_string: ubuntu-24.04-arm-js-24.22.1
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.22.1
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.1', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000001846, iterations_per_second: 541799.859132}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.000831686, iterations_per_second: 1202.377340}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.011402428, iterations_per_second: 87.700620}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000002191, iterations_per_second: 456350.111806}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001324807, iterations_per_second: 754.827119}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.017731292, iterations_per_second: 56.397470}
