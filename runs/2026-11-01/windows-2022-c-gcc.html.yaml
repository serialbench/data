    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004420, iterations_per_second: 226244.344812}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007910, iterations_per_second: 126422.250326}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000470567, iterations_per_second: 2125.097400}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002124900, iterations_per_second: 470.610382}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001851700, iterations_per_second: 540.044284}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.006678600, iterations_per_second: 149.731980}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.021397600, iterations_per_second: 46.734213}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.020189700, iterations_per_second: 49.530206}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285508}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009450, iterations_per_second: 105820.105896}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000942733, iterations_per_second: 1060.745350}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002598233, iterations_per_second: 384.876904}
