platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000000847, iterations_per_second: 1180219.519678}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002159, iterations_per_second: 463134.494344}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003431, iterations_per_second: 291443.226886}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000271583, iterations_per_second: 3682.115596}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001115907, iterations_per_second: 896.132293}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000710913, iterations_per_second: 1406.642541}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.002731640, iterations_per_second: 366.080450}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.011034626, iterations_per_second: 90.623824}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.007351760, iterations_per_second: 136.021851}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001683, iterations_per_second: 594353.639808}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004089, iterations_per_second: 244552.591049}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000543914, iterations_per_second: 1838.527070}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000928694, iterations_per_second: 1076.780555}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005438945, iterations_per_second: 183.859186}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009489125, iterations_per_second: 105.383795}
  xpath:
  xslt:
