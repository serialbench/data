platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001462, iterations_per_second: 683900.970718}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004195, iterations_per_second: 238361.976537}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005211, iterations_per_second: 191909.111824}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000488171, iterations_per_second: 2048.462526}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002120031, iterations_per_second: 471.691142}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001258970, iterations_per_second: 794.300313}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004676172, iterations_per_second: 213.850132}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.020964305, iterations_per_second: 47.700126}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012558916, iterations_per_second: 79.624706}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002902, iterations_per_second: 344554.319034}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006712, iterations_per_second: 148986.889129}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001041616, iterations_per_second: 960.046389}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001679569, iterations_per_second: 595.390841}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010489844, iterations_per_second: 95.330302}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017058812, iterations_per_second: 58.620729}
  xpath:
  xslt:
