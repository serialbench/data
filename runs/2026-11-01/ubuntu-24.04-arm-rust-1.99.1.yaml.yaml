platform:
  platform_string: ubuntu-24.04-arm-rust-1.99.1
  kind: native
  os: linux
  arch: arm64
  runtime: rust
  runtime_version: 1.99.1
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002932, iterations_per_second: 341052.487978}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000010584, iterations_per_second: 94479.559347}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001834169, iterations_per_second: 545.206130}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.007924434, iterations_per_second: 126.191978}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024698248, iterations_per_second: 40.488702}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.098155360, iterations_per_second: 10.187931}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004531, iterations_per_second: 220721.317265}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000008680, iterations_per_second: 115203.391588}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002859666, iterations_per_second: 349.691228}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.008936405, iterations_per_second: 111.901826}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043368119, iterations_per_second: 23.058413}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.115160573, iterations_per_second: 8.683527}
  xpath:
