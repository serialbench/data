platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004349, iterations_per_second: 229964.355417}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003857, iterations_per_second: 259282.306522}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001829480, iterations_per_second: 546.603307}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003692134, iterations_per_second: 270.846074}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.022837164, iterations_per_second: 43.788274}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.045346464, iterations_per_second: 22.052436}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001285, iterations_per_second: 778270.682491}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001237120, iterations_per_second: 808.329240}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.038315284, iterations_per_second: 26.099245}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006346, iterations_per_second: 157591.994319}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006062, iterations_per_second: 164959.337554}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002829250, iterations_per_second: 353.450561}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005171538, iterations_per_second: 193.366062}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045923692, iterations_per_second: 21.775253}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.066102990, iterations_per_second: 15.127909}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001544, iterations_per_second: 647542.576124}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001544365, iterations_per_second: 647.515182}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.042940047, iterations_per_second: 23.288284}
  xpath:
  xslt:
