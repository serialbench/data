    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007800, iterations_per_second: 128205.128155}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001518000, iterations_per_second: 658.761528}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006014000, iterations_per_second: 166.278683}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.028903000, iterations_per_second: 34.598485}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078175000, iterations_per_second: 12.791813}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002883, iterations_per_second: 346812.790049}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002021903, iterations_per_second: 494.583650}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028601959, iterations_per_second: 34.962640}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000028000, iterations_per_second: 35714.285717}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000013600, iterations_per_second: 73529.411766}
