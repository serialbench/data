    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001157, iterations_per_second: 864528.401779}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000675808, iterations_per_second: 1479.709484}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001796856, iterations_per_second: 556.527624}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.017127708, iterations_per_second: 58.384928}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.039106793, iterations_per_second: 25.571005}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000410, iterations_per_second: 2442002.436982}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000384909, iterations_per_second: 2598.014424}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005011519, iterations_per_second: 199.540299}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001735, iterations_per_second: 576335.657994}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001451, iterations_per_second: 689132.382845}
