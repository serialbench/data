platform:
  platform_string: ubuntu-24.04-js-24.22.1
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.1
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.1', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000017481, iterations_per_second: 57203.983685}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000321835, iterations_per_second: 3107.178390}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003336013, iterations_per_second: 299.759024}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.034031854, iterations_per_second: 29.384235}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.023101138, iterations_per_second: 43.287911}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.414356286, iterations_per_second: 2.413382}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000024685, iterations_per_second: 40509.610905}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.004204011, iterations_per_second: 237.868055}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.046650421, iterations_per_second: 21.436034}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000030911, iterations_per_second: 32351.361669}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003946568, iterations_per_second: 253.384713}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.041695295, iterations_per_second: 23.983521}
