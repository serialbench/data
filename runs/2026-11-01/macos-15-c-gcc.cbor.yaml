platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.856957}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.647064}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001335000, iterations_per_second: 749.063670}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001266000, iterations_per_second: 789.889415}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006784000, iterations_per_second: 147.405660}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018891000, iterations_per_second: 52.935260}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.310170}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000317333, iterations_per_second: 3151.260504}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004252000, iterations_per_second: 235.183443}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238052}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000005500, iterations_per_second: 181818.181807}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001086667, iterations_per_second: 920.245399}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001645000, iterations_per_second: 607.902736}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013520000, iterations_per_second: 73.964497}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.021906000, iterations_per_second: 45.649594}
  xpath:
  xslt:
