platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002930, iterations_per_second: 341343.528363}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004056, iterations_per_second: 246542.244374}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001803637, iterations_per_second: 554.435391}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003964722, iterations_per_second: 252.224473}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024189601, iterations_per_second: 41.340078}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048025177, iterations_per_second: 20.822412}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001206, iterations_per_second: 828912.468561}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001180098, iterations_per_second: 847.387490}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.033855294, iterations_per_second: 29.537478}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004443, iterations_per_second: 225052.887054}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006092, iterations_per_second: 164144.315713}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002795132, iterations_per_second: 357.764857}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005489864, iterations_per_second: 182.153875}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043202211, iterations_per_second: 23.146963}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068883667, iterations_per_second: 14.517229}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001459, iterations_per_second: 685260.053378}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001443347, iterations_per_second: 692.834086}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.037309057, iterations_per_second: 26.803143}
  xpath:
  xslt:
