platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002966, iterations_per_second: 337131.683603}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004042, iterations_per_second: 247396.155499}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001818319, iterations_per_second: 549.958606}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003949263, iterations_per_second: 253.211802}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024397006, iterations_per_second: 40.988636}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047958842, iterations_per_second: 20.851212}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001174, iterations_per_second: 852079.072597}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001205551, iterations_per_second: 829.495993}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.033384334, iterations_per_second: 29.954170}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004441, iterations_per_second: 225154.230641}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006009, iterations_per_second: 166411.502407}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002804311, iterations_per_second: 356.593872}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005495145, iterations_per_second: 181.978808}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043444227, iterations_per_second: 23.018018}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068885736, iterations_per_second: 14.516793}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001462, iterations_per_second: 683854.202357}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001491550, iterations_per_second: 670.443648}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.036970415, iterations_per_second: 27.048655}
  xpath:
  xslt:
