    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608719}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000477333, iterations_per_second: 2094.972067}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002528333, iterations_per_second: 395.517469}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005634000, iterations_per_second: 177.493788}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.017789000, iterations_per_second: 56.214515}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000323667, iterations_per_second: 3089.598352}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004041000, iterations_per_second: 247.463499}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.555204}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608719}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001248667, iterations_per_second: 800.854245}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001717333, iterations_per_second: 582.298137}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012104000, iterations_per_second: 82.617317}
