    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 400000.002829}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001513500, iterations_per_second: 660.720185}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003367433, iterations_per_second: 296.962078}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012428900, iterations_per_second: 80.457643}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.049208700, iterations_per_second: 20.321610}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000370, iterations_per_second: 2702702.717831}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000370433, iterations_per_second: 2699.541078}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004624400, iterations_per_second: 216.244270}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002450, iterations_per_second: 408163.267284}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003090, iterations_per_second: 323624.595929}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002425633, iterations_per_second: 412.263464}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004022367, iterations_per_second: 248.609857}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022332800, iterations_per_second: 44.777189}
