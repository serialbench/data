platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.8.5', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.645834}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005190, iterations_per_second: 192678.227298}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000103333, iterations_per_second: 9677.419358}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000618833, iterations_per_second: 1615.943981}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001211300, iterations_per_second: 825.559316}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.007942100, iterations_per_second: 125.911283}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000003790, iterations_per_second: 263852.243964}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000127533, iterations_per_second: 7841.087298}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001806300, iterations_per_second: 553.617893}
  xpath:
  xslt:
