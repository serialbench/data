platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004900, iterations_per_second: 204081.632695}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005600, iterations_per_second: 178571.428660}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001258333, iterations_per_second: 794.701987}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003775000, iterations_per_second: 264.900662}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016899000, iterations_per_second: 59.175099}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.046157000, iterations_per_second: 21.665186}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000896, iterations_per_second: 1116320.604345}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000870542, iterations_per_second: 1148.710094}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013380541, iterations_per_second: 74.735394}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005700, iterations_per_second: 175438.596584}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008100, iterations_per_second: 123456.790089}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002205333, iterations_per_second: 453.446191}
