platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000717, iterations_per_second: 1394700.138790}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000661, iterations_per_second: 1512859.300879}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000396532, iterations_per_second: 2521.866686}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001099519, iterations_per_second: 909.488879}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014940818, iterations_per_second: 66.930740}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.025564975, iterations_per_second: 39.116017}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000239, iterations_per_second: 4178854.964378}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000216737, iterations_per_second: 4613.886877}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.002632020, iterations_per_second: 379.936323}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001172, iterations_per_second: 853460.785060}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000990, iterations_per_second: 1009591.117162}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001805547, iterations_per_second: 553.848778}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001436671, iterations_per_second: 696.053746}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.020789241, iterations_per_second: 48.101804}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030778881, iterations_per_second: 32.489810}
  xpath:
  xslt:
