    - {adapter: simd-json, format: json, data_size: small, time_per_iteration: 0.000001927, iterations_per_second: 518860.582162}
    - {adapter: serde-json, format: json, data_size: medium, time_per_iteration: 0.002228333, iterations_per_second: 448.766028}
    - {adapter: simd-json, format: json, data_size: medium, time_per_iteration: 0.001536360, iterations_per_second: 650.888973}
