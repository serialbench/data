platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256497}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010400, iterations_per_second: 96153.846160}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002420667, iterations_per_second: 413.109336}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004292000, iterations_per_second: 232.991612}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019183000, iterations_per_second: 52.129490}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.065826000, iterations_per_second: 15.191566}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000942, iterations_per_second: 1061909.312818}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001360597, iterations_per_second: 734.971487}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021426917, iterations_per_second: 46.670270}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000010500, iterations_per_second: 95238.095247}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000015700, iterations_per_second: 63694.267515}
