    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004842000, iterations_per_second: 206.526229}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.018551000, iterations_per_second: 53.905450}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.016742000, iterations_per_second: 59.730020}
