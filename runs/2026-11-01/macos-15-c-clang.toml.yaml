platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.400', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.53', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.53', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.17', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.53', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000500, iterations_per_second: 1999999.993681}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 624999.999358}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000039000, iterations_per_second: 25641.025643}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000227667, iterations_per_second: 4392.386530}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000884000, iterations_per_second: 1131.221719}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002527000, iterations_per_second: 395.726158}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000700, iterations_per_second: 1428571.426378}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000132000, iterations_per_second: 7575.757576}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001010000, iterations_per_second: 990.099010}
  xpath:
  xslt:
