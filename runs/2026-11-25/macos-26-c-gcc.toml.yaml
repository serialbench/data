platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.110408}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384746}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000100000, iterations_per_second: 10000.000000}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000360333, iterations_per_second: 2775.208141}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000504000, iterations_per_second: 1984.126984}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002041000, iterations_per_second: 489.955904}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.666732}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000072333, iterations_per_second: 13824.884793}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000910000, iterations_per_second: 1098.901099}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000007500, iterations_per_second: 133333.333316}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000200667, iterations_per_second: 4983.388704}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.002504000, iterations_per_second: 399.361022}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000040000, iterations_per_second: 24999.999998}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000534000, iterations_per_second: 1872.659176}
  xslt:
