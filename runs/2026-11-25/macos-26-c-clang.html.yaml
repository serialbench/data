    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 400000.000100}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006500, iterations_per_second: 153846.153831}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001001333, iterations_per_second: 998.668442}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001794000, iterations_per_second: 557.413601}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001540000, iterations_per_second: 649.350649}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004630000, iterations_per_second: 215.982721}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015882000, iterations_per_second: 62.964362}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.020324000, iterations_per_second: 49.202913}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006200, iterations_per_second: 161290.322618}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005700, iterations_per_second: 175438.596497}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001514333, iterations_per_second: 660.356593}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003434667, iterations_per_second: 291.149068}
