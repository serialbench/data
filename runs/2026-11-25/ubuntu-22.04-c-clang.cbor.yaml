platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000914, iterations_per_second: 1094331.360636}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001196, iterations_per_second: 835980.605104}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000828802, iterations_per_second: 1206.560310}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001908296, iterations_per_second: 524.027811}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.028228226, iterations_per_second: 35.425535}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040356064, iterations_per_second: 24.779423}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000445, iterations_per_second: 2248201.439583}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000447468, iterations_per_second: 2234.796678}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005552826, iterations_per_second: 180.088481}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001676, iterations_per_second: 596623.113767}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001689, iterations_per_second: 592031.259203}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003131444, iterations_per_second: 319.341526}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002429488, iterations_per_second: 411.609416}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.037176374, iterations_per_second: 26.898804}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.047584625, iterations_per_second: 21.015191}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
