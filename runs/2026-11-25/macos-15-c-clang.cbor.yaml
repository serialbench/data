    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000723000, iterations_per_second: 1383.125864}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004109000, iterations_per_second: 243.368216}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007508000, iterations_per_second: 133.191263}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.019910000, iterations_per_second: 50.226017}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000352333, iterations_per_second: 2838.221381}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004281000, iterations_per_second: 233.590283}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
