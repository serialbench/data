platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238052}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006700, iterations_per_second: 149253.731340}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001330333, iterations_per_second: 751.691305}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004050333, iterations_per_second: 246.893260}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021675000, iterations_per_second: 46.136101}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.066651000, iterations_per_second: 15.003526}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001017, iterations_per_second: 983574.309114}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001633778, iterations_per_second: 612.078388}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.024779833, iterations_per_second: 40.355397}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666693}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006800, iterations_per_second: 147058.823532}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002354000, iterations_per_second: 424.808836}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007548333, iterations_per_second: 132.479576}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.039823000, iterations_per_second: 25.111117}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.105653000, iterations_per_second: 9.464947}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001625, iterations_per_second: 615384.615862}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002133681, iterations_per_second: 468.673694}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029856834, iterations_per_second: 33.493169}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
