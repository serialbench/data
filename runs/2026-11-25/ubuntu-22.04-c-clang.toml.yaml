platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000588, iterations_per_second: 1700391.092041}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001835, iterations_per_second: 545107.658737}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000076866, iterations_per_second: 13009.596745}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000205276, iterations_per_second: 4871.498002}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001719001, iterations_per_second: 581.733228}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002396363, iterations_per_second: 417.299049}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000800, iterations_per_second: 1249219.240509}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000107400, iterations_per_second: 9310.986965}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002142841, iterations_per_second: 466.670182}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000002646, iterations_per_second: 377943.232966}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000369602, iterations_per_second: 2705.615505}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.004349459, iterations_per_second: 229.913651}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000001364, iterations_per_second: 732869.183083}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000052785, iterations_per_second: 18944.895613}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000708732, iterations_per_second: 1410.970578}
  xslt:
