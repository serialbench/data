platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003100, iterations_per_second: 322580.640061}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000008100, iterations_per_second: 123456.789915}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000013000, iterations_per_second: 76923.076714}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001271333, iterations_per_second: 786.575774}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004782667, iterations_per_second: 209.088375}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003297667, iterations_per_second: 303.244718}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.012748000, iterations_per_second: 78.443677}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.051146000, iterations_per_second: 19.551871}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.034178000, iterations_per_second: 29.258587}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000008700, iterations_per_second: 114942.529476}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000012400, iterations_per_second: 80645.161790}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002500333, iterations_per_second: 399.946674}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.004814667, iterations_per_second: 207.698698}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.024925000, iterations_per_second: 40.120361}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.045621000, iterations_per_second: 21.919730}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
