platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.10.0', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000750, iterations_per_second: 1333333.346805}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005570, iterations_per_second: 179533.213768}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000051433, iterations_per_second: 19442.644190}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000636767, iterations_per_second: 1570.433963}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001276500, iterations_per_second: 783.392088}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.007578400, iterations_per_second: 131.953974}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000005680, iterations_per_second: 176056.338261}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000129067, iterations_per_second: 7747.933885}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001900700, iterations_per_second: 526.121955}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000012990, iterations_per_second: 76982.294044}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000439200, iterations_per_second: 2276.867031}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.005321300, iterations_per_second: 187.924004}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000007480, iterations_per_second: 133689.839585}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000119300, iterations_per_second: 8382.229672}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.001305000, iterations_per_second: 766.283525}
  xslt:
