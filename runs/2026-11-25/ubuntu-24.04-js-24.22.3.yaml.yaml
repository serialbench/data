platform:
  platform_string: ubuntu-24.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000512301, iterations_per_second: 1951.979356}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.075346469, iterations_per_second: 13.272022}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 0.852229738, iterations_per_second: 1.173393}
  generation:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000807606, iterations_per_second: 1238.227245}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.089485273, iterations_per_second: 11.175023}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.164773097, iterations_per_second: 0.858536}
  xpath:
