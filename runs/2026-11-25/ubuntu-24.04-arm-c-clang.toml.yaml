platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000550, iterations_per_second: 1819505.094616}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002113, iterations_per_second: 473305.566387}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000070626, iterations_per_second: 14159.024726}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000203572, iterations_per_second: 4912.274956}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001257583, iterations_per_second: 795.176143}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002371745, iterations_per_second: 421.630487}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000726, iterations_per_second: 1378169.789852}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000089339, iterations_per_second: 11193.361590}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001620570, iterations_per_second: 617.066835}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000002194, iterations_per_second: 455850.845316}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000283140, iterations_per_second: 3531.825872}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.003577838, iterations_per_second: 279.498401}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000001265, iterations_per_second: 790638.836499}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000053772, iterations_per_second: 18596.924066}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000706806, iterations_per_second: 1414.815381}
  xslt:
