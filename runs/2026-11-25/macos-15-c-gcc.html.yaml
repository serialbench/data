platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.333228}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007000, iterations_per_second: 142857.142870}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010900, iterations_per_second: 91743.119282}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000586667, iterations_per_second: 1704.545455}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001403000, iterations_per_second: 712.758375}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001062667, iterations_per_second: 941.028858}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004362000, iterations_per_second: 229.252636}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014204000, iterations_per_second: 70.402703}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012026000, iterations_per_second: 83.153168}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006400, iterations_per_second: 156250.000048}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000013600, iterations_per_second: 73529.411766}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000811333, iterations_per_second: 1232.539030}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001613000, iterations_per_second: 619.962802}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008141000, iterations_per_second: 122.835033}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015083000, iterations_per_second: 66.299808}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
