platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001445, iterations_per_second: 692185.229540}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003696, iterations_per_second: 270526.173462}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005469, iterations_per_second: 182832.068783}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000474377, iterations_per_second: 2108.028003}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002376814, iterations_per_second: 420.731340}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001346886, iterations_per_second: 742.453517}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004772345, iterations_per_second: 209.540593}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.021254634, iterations_per_second: 47.048564}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014526599, iterations_per_second: 68.839238}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002606, iterations_per_second: 383700.406881}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006731, iterations_per_second: 148559.713540}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000939021, iterations_per_second: 1064.938532}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001783389, iterations_per_second: 560.730160}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009705248, iterations_per_second: 103.037037}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019069252, iterations_per_second: 52.440442}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
