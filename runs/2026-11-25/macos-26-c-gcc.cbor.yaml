platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370526}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000421333, iterations_per_second: 2373.417721}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001382333, iterations_per_second: 723.414517}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005030000, iterations_per_second: 198.807157}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.016325000, iterations_per_second: 61.255743}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000327333, iterations_per_second: 3054.989817}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004063000, iterations_per_second: 246.123554}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.714639}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.856957}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000942333, iterations_per_second: 1061.195614}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001676667, iterations_per_second: 596.421471}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010973000, iterations_per_second: 91.132780}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.022547000, iterations_per_second: 44.351798}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
