    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000007500, iterations_per_second: 133333.333468}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000151667, iterations_per_second: 6593.406595}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000704333, iterations_per_second: 1419.782300}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001479000, iterations_per_second: 676.132522}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.006029000, iterations_per_second: 165.864986}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 249999.999210}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000275333, iterations_per_second: 3631.961259}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.003744000, iterations_per_second: 267.094017}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000008000, iterations_per_second: 124999.999960}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000770000, iterations_per_second: 1298.701299}
