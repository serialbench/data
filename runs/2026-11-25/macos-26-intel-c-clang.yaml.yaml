platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011700, iterations_per_second: 85470.085769}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000012800, iterations_per_second: 78125.000197}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003200667, iterations_per_second: 312.434909}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.012243000, iterations_per_second: 81.679327}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.047019000, iterations_per_second: 21.267998}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.116772000, iterations_per_second: 8.563697}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001514, iterations_per_second: 660458.340492}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002534020, iterations_per_second: 394.629929}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.044905934, iterations_per_second: 22.268772}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000015300, iterations_per_second: 65359.477144}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000021200, iterations_per_second: 47169.811339}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.008167667, iterations_per_second: 122.433988}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.017914000, iterations_per_second: 55.822262}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.088827000, iterations_per_second: 11.257838}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.164079000, iterations_per_second: 6.094625}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002245, iterations_per_second: 445394.620839}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002800893, iterations_per_second: 357.028990}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.053755847, iterations_per_second: 18.602628}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
