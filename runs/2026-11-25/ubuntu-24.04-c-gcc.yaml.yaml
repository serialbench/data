platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004706, iterations_per_second: 212472.113081}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003470, iterations_per_second: 288201.048990}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001411104, iterations_per_second: 708.664989}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003284238, iterations_per_second: 304.484663}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019648250, iterations_per_second: 50.895118}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.040203293, iterations_per_second: 24.873584}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001061, iterations_per_second: 942684.766513}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001090239, iterations_per_second: 917.230075}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031464437, iterations_per_second: 31.781913}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007188, iterations_per_second: 139114.950676}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005300, iterations_per_second: 188682.805269}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002355888, iterations_per_second: 424.468456}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004577501, iterations_per_second: 218.459810}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.038993841, iterations_per_second: 25.645076}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.058423639, iterations_per_second: 17.116359}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001307, iterations_per_second: 764876.854310}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001379210, iterations_per_second: 725.052923}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.035921835, iterations_per_second: 27.838222}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
