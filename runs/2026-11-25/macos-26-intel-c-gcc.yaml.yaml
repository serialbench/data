platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000012000, iterations_per_second: 83333.333386}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000012600, iterations_per_second: 79365.079422}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003581667, iterations_per_second: 279.199628}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.013032667, iterations_per_second: 76.730268}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.055975000, iterations_per_second: 17.865118}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.128643000, iterations_per_second: 7.773451}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001790, iterations_per_second: 558565.601319}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002267703, iterations_per_second: 440.974789}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.040373106, iterations_per_second: 24.768964}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000017000, iterations_per_second: 58823.529403}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000016900, iterations_per_second: 59171.597584}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.010335667, iterations_per_second: 96.752346}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.017719667, iterations_per_second: 56.434470}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.082508000, iterations_per_second: 12.120037}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.193280000, iterations_per_second: 5.173841}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002662, iterations_per_second: 375600.962538}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.003028148, iterations_per_second: 330.234850}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.051682010, iterations_per_second: 19.349093}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
