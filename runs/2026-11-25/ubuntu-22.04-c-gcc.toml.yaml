platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000548, iterations_per_second: 1825817.052473}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003362, iterations_per_second: 297397.769639}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000067077, iterations_per_second: 14908.165698}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000320678, iterations_per_second: 3118.389664}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001335967, iterations_per_second: 748.521483}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003895347, iterations_per_second: 256.716539}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000779, iterations_per_second: 1283367.557948}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000091218, iterations_per_second: 10962.748580}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001599933, iterations_per_second: 625.026173}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000002530, iterations_per_second: 395272.540184}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000312944, iterations_per_second: 3195.459891}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.003758056, iterations_per_second: 266.095024}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000001303, iterations_per_second: 767518.612235}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000046384, iterations_per_second: 21559.003400}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000620656, iterations_per_second: 1611.198474}
  xslt:
