platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000802, iterations_per_second: 1247504.988534}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001222, iterations_per_second: 818531.554028}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000562020, iterations_per_second: 1779.296110}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001933354, iterations_per_second: 517.235850}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013889543, iterations_per_second: 71.996609}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032292387, iterations_per_second: 30.967051}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000365, iterations_per_second: 2741228.056935}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000322368, iterations_per_second: 3102.041660}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004174108, iterations_per_second: 239.572143}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001457, iterations_per_second: 686436.023614}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001525, iterations_per_second: 655823.715332}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001796828, iterations_per_second: 556.536399}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002175680, iterations_per_second: 459.626345}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.020978311, iterations_per_second: 47.668280}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035672275, iterations_per_second: 28.032975}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
