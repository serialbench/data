platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000397, iterations_per_second: 2515723.271396}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001520, iterations_per_second: 657938.022704}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000051998, iterations_per_second: 19231.632190}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000148395, iterations_per_second: 6738.756385}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000897697, iterations_per_second: 1113.961615}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.001788382, iterations_per_second: 559.164653}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000563, iterations_per_second: 1777145.901379}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000070293, iterations_per_second: 14226.100152}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001194393, iterations_per_second: 837.245362}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000001680, iterations_per_second: 595379.851947}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000212232, iterations_per_second: 4711.817395}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.002767629, iterations_per_second: 361.320105}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000000926, iterations_per_second: 1079913.608710}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000037775, iterations_per_second: 26472.768350}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000463656, iterations_per_second: 2156.771400}
  xslt:
