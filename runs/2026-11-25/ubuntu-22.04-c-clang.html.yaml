platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001563, iterations_per_second: 639836.202370}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004272, iterations_per_second: 234087.876630}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005599, iterations_per_second: 178587.373883}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000518490, iterations_per_second: 1928.678746}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002277349, iterations_per_second: 439.107049}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001406302, iterations_per_second: 711.084817}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004845283, iterations_per_second: 206.386294}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.022250412, iterations_per_second: 44.942988}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014113261, iterations_per_second: 70.855347}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002891, iterations_per_second: 345853.220089}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007203, iterations_per_second: 138823.333428}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000982862, iterations_per_second: 1017.436487}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001854738, iterations_per_second: 539.159709}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010067709, iterations_per_second: 99.327464}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018429349, iterations_per_second: 54.261276}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
