platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001772, iterations_per_second: 564334.086154}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003079, iterations_per_second: 324749.131515}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004980, iterations_per_second: 200799.180670}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000465674, iterations_per_second: 2147.426560}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001607973, iterations_per_second: 621.900861}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001345689, iterations_per_second: 743.113751}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004578689, iterations_per_second: 218.403128}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015899788, iterations_per_second: 62.893920}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013424019, iterations_per_second: 74.493339}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002303, iterations_per_second: 434310.531679}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006192, iterations_per_second: 161496.099878}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000838225, iterations_per_second: 1192.997581}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001767596, iterations_per_second: 565.740242}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008468160, iterations_per_second: 118.089408}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017786045, iterations_per_second: 56.223854}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
