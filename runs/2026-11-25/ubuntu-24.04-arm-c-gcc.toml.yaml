platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000548, iterations_per_second: 1824817.518691}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003614, iterations_per_second: 276724.686647}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000063191, iterations_per_second: 15825.038376}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000317886, iterations_per_second: 3145.785120}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001188015, iterations_per_second: 841.740214}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003784353, iterations_per_second: 264.245962}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000721, iterations_per_second: 1387347.391876}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000091698, iterations_per_second: 10905.323615}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001525568, iterations_per_second: 655.493560}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000002147, iterations_per_second: 465701.112942}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000269428, iterations_per_second: 3711.562135}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.003471809, iterations_per_second: 288.034278}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000001274, iterations_per_second: 784682.987898}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000050636, iterations_per_second: 19748.795321}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000712731, iterations_per_second: 1403.053887}
  xslt:
