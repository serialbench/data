platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.10.0', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005330, iterations_per_second: 187617.260821}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000011670, iterations_per_second: 85689.802888}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002119867, iterations_per_second: 471.727782}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007254300, iterations_per_second: 137.849276}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.028554800, iterations_per_second: 35.020382}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.088236900, iterations_per_second: 11.333127}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001730, iterations_per_second: 578034.683160}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002174567, iterations_per_second: 459.861735}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028206400, iterations_per_second: 35.452947}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000090960, iterations_per_second: 10993.843448}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000020980, iterations_per_second: 47664.442302}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003897767, iterations_per_second: 256.557174}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.009350767, iterations_per_second: 106.943103}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.049801100, iterations_per_second: 20.079878}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.114838300, iterations_per_second: 8.707896}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001990, iterations_per_second: 502512.560351}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002543333, iterations_per_second: 393.184797}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.037163100, iterations_per_second: 26.908412}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
