platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001005, iterations_per_second: 995123.893264}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002610, iterations_per_second: 383141.762668}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004075, iterations_per_second: 245404.795252}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000329504, iterations_per_second: 3034.867594}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001493589, iterations_per_second: 669.528380}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000976780, iterations_per_second: 1023.772335}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003381862, iterations_per_second: 295.695093}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014789799, iterations_per_second: 67.614171}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010391872, iterations_per_second: 96.229053}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001952, iterations_per_second: 512400.081749}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005051, iterations_per_second: 197980.597924}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000645228, iterations_per_second: 1549.839747}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001307946, iterations_per_second: 764.557363}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.006876296, iterations_per_second: 145.427131}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013610065, iterations_per_second: 73.475035}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
