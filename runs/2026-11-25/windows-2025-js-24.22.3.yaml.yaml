platform:
  platform_string: windows-2025-js-24.22.3
  kind: wasm
  os: windows
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000532570, iterations_per_second: 1877.687440}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.090857633, iterations_per_second: 11.006230}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.154336400, iterations_per_second: 0.866299}
  generation:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000788890, iterations_per_second: 1267.603848}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.111828733, iterations_per_second: 8.942246}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.498125200, iterations_per_second: 0.667501}
