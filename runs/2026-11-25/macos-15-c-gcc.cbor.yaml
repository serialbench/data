platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000800, iterations_per_second: 1249999.998715}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000528000, iterations_per_second: 1893.939394}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001282000, iterations_per_second: 780.031201}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006838000, iterations_per_second: 146.241591}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018353000, iterations_per_second: 54.487005}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000318667, iterations_per_second: 3138.075314}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003976000, iterations_per_second: 251.509054}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.000468}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001065333, iterations_per_second: 938.673342}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001641667, iterations_per_second: 609.137056}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013347000, iterations_per_second: 74.923204}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023687000, iterations_per_second: 42.217250}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
