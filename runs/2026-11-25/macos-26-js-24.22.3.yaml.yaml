platform:
  platform_string: macos-26-js-24.22.3
  kind: wasm
  os: macos
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000272192, iterations_per_second: 3673.881312}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.124088028, iterations_per_second: 8.058795}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.599232666, iterations_per_second: 0.625300}
  generation:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.001585425, iterations_per_second: 630.745699}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.150860181, iterations_per_second: 6.628654}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 2.761564417, iterations_per_second: 0.362114}
