platform:
  platform_string: ubuntu-24.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000015111, iterations_per_second: 66176.519247}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000102067, iterations_per_second: 9797.466767}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002135254, iterations_per_second: 468.328431}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.018400727, iterations_per_second: 54.345678}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.015431794, iterations_per_second: 64.801280}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.249962633, iterations_per_second: 4.000598}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000020773, iterations_per_second: 48139.875221}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.004335216, iterations_per_second: 230.668996}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.031701546, iterations_per_second: 31.544203}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000023425, iterations_per_second: 42689.798846}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002361603, iterations_per_second: 423.441137}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.031659263, iterations_per_second: 31.586332}
