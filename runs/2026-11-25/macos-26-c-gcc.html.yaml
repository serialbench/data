platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.331490}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384746}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006700, iterations_per_second: 149253.731340}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000419333, iterations_per_second: 2384.737679}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001332333, iterations_per_second: 750.562922}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001000333, iterations_per_second: 999.666778}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004101000, iterations_per_second: 243.842965}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.013756000, iterations_per_second: 72.695551}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009653000, iterations_per_second: 103.594737}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.647064}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006200, iterations_per_second: 161290.322618}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000786333, iterations_per_second: 1271.725307}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001328000, iterations_per_second: 753.012048}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007717000, iterations_per_second: 129.584035}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013457000, iterations_per_second: 74.310768}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
