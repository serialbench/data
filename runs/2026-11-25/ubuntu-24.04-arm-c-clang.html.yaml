platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001370, iterations_per_second: 730140.187111}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003152, iterations_per_second: 317248.818423}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004992, iterations_per_second: 200312.487414}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000482506, iterations_per_second: 2072.513088}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001642292, iterations_per_second: 608.904992}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001346662, iterations_per_second: 742.577015}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004609987, iterations_per_second: 216.920351}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016043975, iterations_per_second: 62.328693}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013494526, iterations_per_second: 74.104122}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002368, iterations_per_second: 422279.464770}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006255, iterations_per_second: 159882.326584}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000865732, iterations_per_second: 1155.092321}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001765179, iterations_per_second: 566.514784}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008567977, iterations_per_second: 116.713665}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017729413, iterations_per_second: 56.403447}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
