platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003007, iterations_per_second: 332535.248565}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003997, iterations_per_second: 250187.640800}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001866932, iterations_per_second: 535.638053}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003945514, iterations_per_second: 253.452423}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024820703, iterations_per_second: 40.288947}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048110055, iterations_per_second: 20.785676}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001166, iterations_per_second: 857265.324487}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001209032, iterations_per_second: 827.107967}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031336384, iterations_per_second: 31.911787}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004840, iterations_per_second: 206603.033035}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006047, iterations_per_second: 165363.054612}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002995442, iterations_per_second: 333.840548}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005547859, iterations_per_second: 180.249704}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.046287358, iterations_per_second: 21.604171}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068837095, iterations_per_second: 14.527051}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001427, iterations_per_second: 700672.646370}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001490171, iterations_per_second: 671.063775}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.036715574, iterations_per_second: 27.236398}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
