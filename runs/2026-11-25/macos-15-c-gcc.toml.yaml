platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000800, iterations_per_second: 1249999.998715}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.556081}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000051333, iterations_per_second: 19480.519479}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000578667, iterations_per_second: 1728.110599}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000816000, iterations_per_second: 1225.490196}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002085000, iterations_per_second: 479.616307}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000800, iterations_per_second: 1250000.003156}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000119667, iterations_per_second: 8356.545961}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001021000, iterations_per_second: 979.431929}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894811}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000373333, iterations_per_second: 2678.571429}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.002833000, iterations_per_second: 352.982704}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000006300, iterations_per_second: 158730.158701}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000051667, iterations_per_second: 19354.838709}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000616000, iterations_per_second: 1623.376623}
  xslt:
