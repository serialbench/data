platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000024400, iterations_per_second: 40983.606561}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007400, iterations_per_second: 135135.135113}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001953000, iterations_per_second: 512.032770}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005705000, iterations_per_second: 175.284838}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026284000, iterations_per_second: 38.045960}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.079487000, iterations_per_second: 12.580674}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000933, iterations_per_second: 1071352.046534}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001152125, iterations_per_second: 867.961376}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.014133292, iterations_per_second: 70.754924}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006400, iterations_per_second: 156249.999978}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000013100, iterations_per_second: 76335.877873}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002838000, iterations_per_second: 352.360817}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006914667, iterations_per_second: 144.620131}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.044785000, iterations_per_second: 22.328905}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.109060000, iterations_per_second: 9.169265}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001329, iterations_per_second: 752332.229599}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001606208, iterations_per_second: 622.584243}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.024319667, iterations_per_second: 41.118984}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
