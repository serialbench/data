platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000818, iterations_per_second: 1222942.397587}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001134, iterations_per_second: 881523.272161}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000599162, iterations_per_second: 1668.997700}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001820844, iterations_per_second: 549.195968}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.016871707, iterations_per_second: 59.270825}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.043635813, iterations_per_second: 22.916956}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000335, iterations_per_second: 2983293.536906}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000313446, iterations_per_second: 3190.338803}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003726322, iterations_per_second: 268.361135}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001667, iterations_per_second: 599772.086441}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001637, iterations_per_second: 611022.851836}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002157524, iterations_per_second: 463.494336}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002262592, iterations_per_second: 441.970913}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.026920512, iterations_per_second: 37.146396}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.049874260, iterations_per_second: 20.050423}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
