platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003002, iterations_per_second: 333144.551418}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004006, iterations_per_second: 249594.409216}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001858048, iterations_per_second: 538.199132}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003920235, iterations_per_second: 255.086749}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024846139, iterations_per_second: 40.247702}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047891238, iterations_per_second: 20.880646}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001214, iterations_per_second: 823451.909728}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001154054, iterations_per_second: 866.510579}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029675983, iterations_per_second: 33.697283}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004734, iterations_per_second: 211251.241046}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006047, iterations_per_second: 165382.198316}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002983003, iterations_per_second: 335.232687}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005506724, iterations_per_second: 181.596183}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045722830, iterations_per_second: 21.870912}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068724377, iterations_per_second: 14.550878}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001469, iterations_per_second: 680781.536695}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001426312, iterations_per_second: 701.109038}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.033716400, iterations_per_second: 29.659157}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
