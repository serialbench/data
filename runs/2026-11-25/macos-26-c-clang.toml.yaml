platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312500.000234}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000103333, iterations_per_second: 9677.419354}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000566333, iterations_per_second: 1765.744556}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001196000, iterations_per_second: 836.120401}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002390000, iterations_per_second: 418.410042}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 769230.769491}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000078667, iterations_per_second: 12711.864407}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001639000, iterations_per_second: 610.128127}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000045900, iterations_per_second: 21786.492374}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000287667, iterations_per_second: 3476.245655}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.002880000, iterations_per_second: 347.222222}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000005300, iterations_per_second: 188679.245355}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000041667, iterations_per_second: 24000.000001}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000591000, iterations_per_second: 1692.047377}
  xslt:
