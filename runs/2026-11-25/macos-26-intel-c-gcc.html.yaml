platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.778479}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000009900, iterations_per_second: 101010.100917}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010300, iterations_per_second: 97087.378564}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001475000, iterations_per_second: 677.966102}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.006880000, iterations_per_second: 145.348837}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003572333, iterations_per_second: 279.929085}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.015593000, iterations_per_second: 64.131341}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.051360000, iterations_per_second: 19.470405}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.042512000, iterations_per_second: 23.522770}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000010300, iterations_per_second: 97087.378779}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000013300, iterations_per_second: 75187.969922}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003279667, iterations_per_second: 304.909035}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.004987667, iterations_per_second: 200.494553}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.035959000, iterations_per_second: 27.809450}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.044985000, iterations_per_second: 22.229632}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
