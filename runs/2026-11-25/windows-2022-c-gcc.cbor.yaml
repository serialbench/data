platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.10.0', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001370, iterations_per_second: 729927.003691}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002540, iterations_per_second: 393700.788748}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001503533, iterations_per_second: 665.099987}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003426333, iterations_per_second: 291.857185}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011762700, iterations_per_second: 85.014495}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.052149100, iterations_per_second: 19.175786}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000360, iterations_per_second: 2777777.767247}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000354400, iterations_per_second: 2821.670429}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004572600, iterations_per_second: 218.693960}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002080, iterations_per_second: 480769.230406}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003070, iterations_per_second: 325732.899966}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002090700, iterations_per_second: 478.308700}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004225067, iterations_per_second: 236.682656}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.020330400, iterations_per_second: 49.187424}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.071516000, iterations_per_second: 13.982885}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
