platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.714639}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000046000, iterations_per_second: 21739.130436}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000197667, iterations_per_second: 5059.021922}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000652000, iterations_per_second: 1533.742331}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002300000, iterations_per_second: 434.782609}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001000, iterations_per_second: 1000000.002525}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000073333, iterations_per_second: 13636.363636}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001123000, iterations_per_second: 890.471950}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 400000.000100}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000201333, iterations_per_second: 4966.887417}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.003007000, iterations_per_second: 332.557366}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.110408}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000049000, iterations_per_second: 20408.163266}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000703000, iterations_per_second: 1422.475107}
  xslt:
