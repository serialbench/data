platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.10.0', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001510, iterations_per_second: 662251.653811}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007650, iterations_per_second: 130718.954287}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000454833, iterations_per_second: 2198.607549}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002090067, iterations_per_second: 478.453638}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001832700, iterations_per_second: 545.643040}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004589100, iterations_per_second: 217.907651}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.020790500, iterations_per_second: 48.098891}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019961200, iterations_per_second: 50.097189}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285508}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009450, iterations_per_second: 105820.105896}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000911267, iterations_per_second: 1097.373619}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002704800, iterations_per_second: 369.713103}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009680800, iterations_per_second: 103.297248}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.030643900, iterations_per_second: 32.632922}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
