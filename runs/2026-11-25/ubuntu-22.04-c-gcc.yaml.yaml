platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006246, iterations_per_second: 160094.776092}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004586, iterations_per_second: 218064.459888}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001833250, iterations_per_second: 545.479241}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004110529, iterations_per_second: 243.277690}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025265402, iterations_per_second: 39.579817}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.051519311, iterations_per_second: 19.410197}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001679, iterations_per_second: 595415.302407}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001357210, iterations_per_second: 736.805472}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.041153653, iterations_per_second: 24.299179}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008637, iterations_per_second: 115779.601976}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007038, iterations_per_second: 142083.801025}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003218671, iterations_per_second: 310.687237}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006161939, iterations_per_second: 162.286579}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.050909650, iterations_per_second: 19.642641}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.077807092, iterations_per_second: 12.852299}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001998, iterations_per_second: 500525.551803}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001731710, iterations_per_second: 577.463783}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.047318142, iterations_per_second: 21.133543}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
