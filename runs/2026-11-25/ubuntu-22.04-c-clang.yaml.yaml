platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004558, iterations_per_second: 219413.726567}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004887, iterations_per_second: 204620.327025}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001931961, iterations_per_second: 517.608792}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004574244, iterations_per_second: 218.615344}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026698655, iterations_per_second: 37.455070}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055755321, iterations_per_second: 17.935508}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001438, iterations_per_second: 695555.401704}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001760271, iterations_per_second: 568.094237}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.046045250, iterations_per_second: 21.717767}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007179, iterations_per_second: 139289.345723}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007162, iterations_per_second: 139619.954490}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003351073, iterations_per_second: 298.411852}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006688401, iterations_per_second: 149.512567}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.053849983, iterations_per_second: 18.570108}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085668922, iterations_per_second: 11.672844}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001802, iterations_per_second: 554815.800742}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002271006, iterations_per_second: 440.333556}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.051266884, iterations_per_second: 19.505769}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
