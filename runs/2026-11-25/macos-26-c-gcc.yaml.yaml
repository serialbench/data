platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004700, iterations_per_second: 212765.957469}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006400, iterations_per_second: 156250.000048}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001262333, iterations_per_second: 792.183787}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003626667, iterations_per_second: 275.735294}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.017357000, iterations_per_second: 57.613643}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.044538000, iterations_per_second: 22.452737}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000929, iterations_per_second: 1076310.404884}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000914847, iterations_per_second: 1093.078554}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.012422209, iterations_per_second: 80.500980}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006600, iterations_per_second: 151515.151506}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009800, iterations_per_second: 102040.816318}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002167000, iterations_per_second: 461.467467}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005765000, iterations_per_second: 173.460538}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.029702000, iterations_per_second: 33.667766}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.071562000, iterations_per_second: 13.973897}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001383, iterations_per_second: 722908.985914}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001140306, iterations_per_second: 876.957845}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.016139791, iterations_per_second: 61.958671}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
