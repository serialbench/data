platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000823, iterations_per_second: 1214771.623083}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001126, iterations_per_second: 887784.091376}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000568386, iterations_per_second: 1759.368785}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001763601, iterations_per_second: 567.021572}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015731583, iterations_per_second: 63.566394}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032123731, iterations_per_second: 31.129634}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000394, iterations_per_second: 2535496.948603}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000383876, iterations_per_second: 2605.007867}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004910184, iterations_per_second: 203.658356}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001442, iterations_per_second: 693673.695938}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001423, iterations_per_second: 702987.697664}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001851553, iterations_per_second: 540.087062}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002016145, iterations_per_second: 495.995990}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022684046, iterations_per_second: 44.083846}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.037295363, iterations_per_second: 26.812985}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
