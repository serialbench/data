platform:
  platform_string: ubuntu-24.04-arm-js-24.22.3
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000017514, iterations_per_second: 57097.505410}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000114774, iterations_per_second: 8712.744305}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002376557, iterations_per_second: 420.776838}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.025903895, iterations_per_second: 38.604234}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.025166208, iterations_per_second: 39.735824}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.395707803, iterations_per_second: 2.527117}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000019162, iterations_per_second: 52186.891697}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003763654, iterations_per_second: 265.699238}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.046622035, iterations_per_second: 21.449085}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000028565, iterations_per_second: 35007.631664}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003255042, iterations_per_second: 307.215729}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.043166660, iterations_per_second: 23.166027}
