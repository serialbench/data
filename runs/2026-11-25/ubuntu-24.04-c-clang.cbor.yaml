platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000617, iterations_per_second: 1621533.968684}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000883, iterations_per_second: 1132631.102678}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000459712, iterations_per_second: 2175.274955}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001486332, iterations_per_second: 672.797044}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011680002, iterations_per_second: 85.616424}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.028450805, iterations_per_second: 35.148390}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000305, iterations_per_second: 3280839.898891}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000290064, iterations_per_second: 3447.515031}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003488125, iterations_per_second: 286.686974}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001209, iterations_per_second: 827335.152377}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002909, iterations_per_second: 343772.559971}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001589159, iterations_per_second: 629.263523}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001860375, iterations_per_second: 537.526133}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.018644851, iterations_per_second: 53.634111}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033446764, iterations_per_second: 29.898259}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
