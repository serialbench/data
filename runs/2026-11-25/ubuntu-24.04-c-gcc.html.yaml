platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001062, iterations_per_second: 941619.584638}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002621, iterations_per_second: 381490.100565}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004213, iterations_per_second: 237354.916883}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000348127, iterations_per_second: 2872.517666}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001548068, iterations_per_second: 645.966317}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000980612, iterations_per_second: 1019.771673}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003817424, iterations_per_second: 261.956754}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015167594, iterations_per_second: 65.930035}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010349254, iterations_per_second: 96.625322}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001993, iterations_per_second: 501806.503402}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005177, iterations_per_second: 193176.988709}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000659049, iterations_per_second: 1517.338629}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001293773, iterations_per_second: 772.932920}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007075304, iterations_per_second: 141.336683}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013729556, iterations_per_second: 72.835567}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
