platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000612, iterations_per_second: 1633719.984611}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000814, iterations_per_second: 1227897.840149}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000453835, iterations_per_second: 2203.442365}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001486086, iterations_per_second: 672.908416}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013739177, iterations_per_second: 72.784563}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034357353, iterations_per_second: 29.105851}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000274, iterations_per_second: 3645643.480233}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000234262, iterations_per_second: 4268.730835}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.002783628, iterations_per_second: 359.243405}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001234, iterations_per_second: 810569.829582}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001173, iterations_per_second: 852805.731089}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001614166, iterations_per_second: 619.514969}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001797229, iterations_per_second: 556.412121}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.020620668, iterations_per_second: 48.495034}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040211086, iterations_per_second: 24.868764}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
