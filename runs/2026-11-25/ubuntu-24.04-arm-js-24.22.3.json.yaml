platform:
  platform_string: ubuntu-24.04-arm-js-24.22.3
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000003086, iterations_per_second: 324023.070443}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001112904, iterations_per_second: 898.550100}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.011143424, iterations_per_second: 89.739025}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000002266, iterations_per_second: 441403.663650}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001924490, iterations_per_second: 519.618185}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.015365131, iterations_per_second: 65.082426}
  xpath:
