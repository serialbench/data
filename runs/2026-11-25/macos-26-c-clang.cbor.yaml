platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285740}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000858667, iterations_per_second: 1164.596273}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001640667, iterations_per_second: 609.508330}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005341000, iterations_per_second: 187.230856}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030631000, iterations_per_second: 32.646665}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.310170}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000522000, iterations_per_second: 1915.708812}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005561000, iterations_per_second: 179.823773}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.665823}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.586402}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001025333, iterations_per_second: 975.292588}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003028333, iterations_per_second: 330.214640}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014578000, iterations_per_second: 68.596515}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.025927000, iterations_per_second: 38.569831}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
