platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.444', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.80', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.80', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.80', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004723, iterations_per_second: 211747.766095}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003519, iterations_per_second: 284187.791307}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001393050, iterations_per_second: 717.849495}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003236689, iterations_per_second: 308.957735}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019811331, iterations_per_second: 50.476164}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.040678719, iterations_per_second: 24.582878}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000841, iterations_per_second: 1189060.643166}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000916289, iterations_per_second: 1091.359128}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026199762, iterations_per_second: 38.168286}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006354, iterations_per_second: 157368.793795}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005090, iterations_per_second: 196475.234319}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002340549, iterations_per_second: 427.250188}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004608295, iterations_per_second: 216.999997}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.036657972, iterations_per_second: 27.279196}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057338097, iterations_per_second: 17.440411}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001061, iterations_per_second: 942418.243285}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001225124, iterations_per_second: 816.243685}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029930638, iterations_per_second: 33.410581}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
