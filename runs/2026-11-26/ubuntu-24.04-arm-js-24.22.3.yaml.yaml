platform:
  platform_string: ubuntu-24.04-arm-js-24.22.3
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000400963, iterations_per_second: 2493.996327}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.104834819, iterations_per_second: 9.538816}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.352857345, iterations_per_second: 0.739176}
  generation:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000576930, iterations_per_second: 1733.312834}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.132431126, iterations_per_second: 7.551095}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.889523592, iterations_per_second: 0.529234}
  xpath:
