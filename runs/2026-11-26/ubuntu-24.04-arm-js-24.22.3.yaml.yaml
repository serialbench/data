platform:
  platform_string: ubuntu-24.04-arm-js-24.22.3
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000061662, iterations_per_second: 16217.496083}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000346535, iterations_per_second: 2885.712233}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.008651319, iterations_per_second: 115.589311}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.100900725, iterations_per_second: 9.910732}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.106284877, iterations_per_second: 9.408676}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.304390526, iterations_per_second: 0.766642}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000052983, iterations_per_second: 18873.942823}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000608135, iterations_per_second: 1644.370645}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.014677631, iterations_per_second: 68.130886}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.132614085, iterations_per_second: 7.540677}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.203480568, iterations_per_second: 4.914474}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.778591036, iterations_per_second: 0.562243}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000022087, iterations_per_second: 45275.501426}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.006240905, iterations_per_second: 160.233180}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.084863723, iterations_per_second: 11.783598}
