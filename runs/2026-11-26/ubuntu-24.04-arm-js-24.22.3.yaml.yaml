platform:
  platform_string: ubuntu-24.04-arm-js-24.22.3
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000057238, iterations_per_second: 17470.941457}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000359806, iterations_per_second: 2779.274726}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.008850756, iterations_per_second: 112.984703}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.109678650, iterations_per_second: 9.117545}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.106559656, iterations_per_second: 9.384415}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.373641309, iterations_per_second: 0.727992}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000057783, iterations_per_second: 17306.188001}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000517319, iterations_per_second: 1933.043995}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.014904819, iterations_per_second: 67.092395}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.145746369, iterations_per_second: 6.861234}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.202885725, iterations_per_second: 4.928883}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.901203244, iterations_per_second: 0.525983}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000023532, iterations_per_second: 42495.325514}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.006220408, iterations_per_second: 160.761159}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.085000031, iterations_per_second: 11.764702}
