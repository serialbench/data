platform:
  platform_string: ubuntu-22.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000019405, iterations_per_second: 51532.578896}
    - {adapter: smol-toml, format: toml, data_size: small, time_per_iteration: 0.000211658, iterations_per_second: 4724.598433}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000698203, iterations_per_second: 1432.247531}
    - {adapter: smol-toml, format: toml, data_size: medium, time_per_iteration: 0.002112122, iterations_per_second: 473.457424}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.003005190, iterations_per_second: 332.757663}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.015648758, iterations_per_second: 63.902835}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000071369, iterations_per_second: 14011.646481}
    - {adapter: smol-toml, format: toml, data_size: small, time_per_iteration: 0.000040772, iterations_per_second: 24526.575771}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.001430086, iterations_per_second: 699.258483}
    - {adapter: smol-toml, format: toml, data_size: medium, time_per_iteration: 0.001431926, iterations_per_second: 698.360111}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.010538911, iterations_per_second: 94.886464}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.010822490, iterations_per_second: 92.400178}
  xpath:
  validation:
  plan:
