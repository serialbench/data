platform:
  platform_string: macos-26-js-24.22.3
  kind: wasm
  os: macos
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000041871, iterations_per_second: 23882.992443}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000678554, iterations_per_second: 1473.721628}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.007062667, iterations_per_second: 141.589579}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.128430083, iterations_per_second: 7.786338}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.130619375, iterations_per_second: 7.655832}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.748991709, iterations_per_second: 0.571758}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000038033, iterations_per_second: 26292.679592}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.001025767, iterations_per_second: 974.880545}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.015622097, iterations_per_second: 64.011892}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.164675556, iterations_per_second: 6.072547}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.238182042, iterations_per_second: 4.198469}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.839784875, iterations_per_second: 0.543542}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000021196, iterations_per_second: 47179.158135}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.004619778, iterations_per_second: 216.460633}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.154350417, iterations_per_second: 6.478764}
