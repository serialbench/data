platform:
  platform_string: macos-26-js-24.22.3
  kind: wasm
  os: macos
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000496104, iterations_per_second: 2015.705978}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.155368847, iterations_per_second: 6.436297}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 2.025099375, iterations_per_second: 0.493803}
  generation:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000929583, iterations_per_second: 1075.750707}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.201155972, iterations_per_second: 4.971267}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.983410584, iterations_per_second: 0.504182}
  xpath:
