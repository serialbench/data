platform:
  platform_string: macos-26-js-24.22.3
  kind: wasm
  os: macos
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000045367, iterations_per_second: 22042.648116}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000336371, iterations_per_second: 2972.909658}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.010854000, iterations_per_second: 92.131933}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.108724056, iterations_per_second: 9.197597}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.095295834, iterations_per_second: 10.493638}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.775790333, iterations_per_second: 0.563130}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000047946, iterations_per_second: 20856.840731}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000536958, iterations_per_second: 1862.342011}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.018949694, iterations_per_second: 52.771300}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.141424458, iterations_per_second: 7.070913}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.220191208, iterations_per_second: 4.541507}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.845351375, iterations_per_second: 0.541902}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000017621, iterations_per_second: 56751.112322}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.005811458, iterations_per_second: 172.073848}
