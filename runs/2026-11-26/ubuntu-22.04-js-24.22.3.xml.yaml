platform:
  platform_string: ubuntu-22.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000018053, iterations_per_second: 55390.921428}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000242537, iterations_per_second: 4123.080551}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001693837, iterations_per_second: 590.375695}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.025507924, iterations_per_second: 39.203504}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.016891408, iterations_per_second: 59.201696}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.321485375, iterations_per_second: 3.110561}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000026779, iterations_per_second: 37342.275564}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.004665840, iterations_per_second: 214.323696}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.036023765, iterations_per_second: 27.759453}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000022395, iterations_per_second: 44653.023679}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002978015, iterations_per_second: 335.794145}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.034139719, iterations_per_second: 29.291395}
