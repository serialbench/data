    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.011648981, iterations_per_second: 85.844418}
    - {adapter: quick-xml, format: xml, data_size: large, time_per_iteration: 0.011297092, iterations_per_second: 88.518355}
