platform:
  platform_string: macos-26-intel-js-24.19.0
  kind: wasm
  os: macos
  arch: x86_64
  runtime: js
  runtime_version: 24.19.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.19.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000863931, iterations_per_second: 1157.499311}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.152651994, iterations_per_second: 6.550848}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.826700494, iterations_per_second: 0.547435}
  generation:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.001102406, iterations_per_second: 907.106572}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.207424296, iterations_per_second: 4.821036}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 2.587911327, iterations_per_second: 0.386412}
  xpath:
