platform:
  platform_string: macos-26-intel-js-24.19.0
  kind: wasm
  os: macos
  arch: x86_64
  runtime: js
  runtime_version: 24.19.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.19.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000066583, iterations_per_second: 15018.893768}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000487923, iterations_per_second: 2049.502453}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.010124937, iterations_per_second: 98.766043}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.158803792, iterations_per_second: 6.297079}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.127741058, iterations_per_second: 7.828337}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.645173653, iterations_per_second: 0.607839}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000075309, iterations_per_second: 13278.607765}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000643570, iterations_per_second: 1553.832528}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.017215276, iterations_per_second: 58.087945}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.171284997, iterations_per_second: 5.838223}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.240879646, iterations_per_second: 4.151451}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 2.209097745, iterations_per_second: 0.452673}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000032942, iterations_per_second: 30356.015348}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.006729666, iterations_per_second: 148.595792}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.096128617, iterations_per_second: 10.402730}
