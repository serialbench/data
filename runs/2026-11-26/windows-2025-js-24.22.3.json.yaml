platform:
  platform_string: windows-2025-js-24.22.3
  kind: wasm
  os: windows
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000005250, iterations_per_second: 190476.190476}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001185400, iterations_per_second: 843.597098}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.013343700, iterations_per_second: 74.941733}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000004830, iterations_per_second: 207039.337474}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001385700, iterations_per_second: 721.656924}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.020040600, iterations_per_second: 49.898706}
  xpath:
  validation:
  plan:
