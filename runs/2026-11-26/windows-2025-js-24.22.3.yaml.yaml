    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.111965500, iterations_per_second: 8.931323}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.581091300, iterations_per_second: 0.632475}
  generation:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000885690, iterations_per_second: 1129.063216}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.147082033, iterations_per_second: 6.798927}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.823297500, iterations_per_second: 0.548457}
