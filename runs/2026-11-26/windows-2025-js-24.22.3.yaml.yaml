platform:
  platform_string: windows-2025-js-24.22.3
  kind: wasm
  os: windows
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000078540, iterations_per_second: 12732.365674}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000576820, iterations_per_second: 1733.643078}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.007419500, iterations_per_second: 134.779972}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.116383133, iterations_per_second: 8.592310}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.091875900, iterations_per_second: 10.884247}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.374826300, iterations_per_second: 0.727365}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000061320, iterations_per_second: 16307.893020}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000691500, iterations_per_second: 1446.131598}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.012375133, iterations_per_second: 80.807210}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.149799800, iterations_per_second: 6.675576}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.181625300, iterations_per_second: 5.505841}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.935196200, iterations_per_second: 0.516743}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000030400, iterations_per_second: 32894.736842}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.009359833, iterations_per_second: 106.839509}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.072595600, iterations_per_second: 13.774940}
