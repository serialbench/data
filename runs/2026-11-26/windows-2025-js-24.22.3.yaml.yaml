platform:
  platform_string: windows-2025-js-24.22.3
  kind: wasm
  os: windows
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000099250, iterations_per_second: 10075.566751}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000628400, iterations_per_second: 1591.343094}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.008080900, iterations_per_second: 123.748592}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.132569833, iterations_per_second: 7.543194}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.103820800, iterations_per_second: 9.631981}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.829642400, iterations_per_second: 0.546555}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000073400, iterations_per_second: 13623.978202}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000837600, iterations_per_second: 1193.887297}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.013733433, iterations_per_second: 72.815004}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.178230867, iterations_per_second: 5.610700}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.198524700, iterations_per_second: 5.037157}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 2.317283500, iterations_per_second: 0.431540}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000033200, iterations_per_second: 30120.481928}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.007917767, iterations_per_second: 126.298241}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.080303100, iterations_per_second: 12.452819}
