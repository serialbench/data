    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.003379427, iterations_per_second: 295.908152}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.008098997, iterations_per_second: 123.472079}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000047101, iterations_per_second: 21230.791441}
