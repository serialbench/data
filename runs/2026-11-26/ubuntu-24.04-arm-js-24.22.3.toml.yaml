platform:
  platform_string: ubuntu-24.04-arm-js-24.22.3
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000046638, iterations_per_second: 21441.558887}
    - {adapter: smol-toml, format: toml, data_size: small, time_per_iteration: 0.000039540, iterations_per_second: 25290.972640}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000326945, iterations_per_second: 3058.621540}
    - {adapter: smol-toml, format: toml, data_size: medium, time_per_iteration: 0.001060594, iterations_per_second: 942.867568}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.003480633, iterations_per_second: 287.304062}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.007432922, iterations_per_second: 134.536593}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000165937, iterations_per_second: 6026.387139}
    - {adapter: smol-toml, format: toml, data_size: small, time_per_iteration: 0.000090890, iterations_per_second: 11002.274170}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.001580378, iterations_per_second: 632.760144}
    - {adapter: smol-toml, format: toml, data_size: medium, time_per_iteration: 0.000819695, iterations_per_second: 1219.965963}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.006341468, iterations_per_second: 157.692194}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.009596181, iterations_per_second: 104.208122}
  xpath:
  validation:
  plan:
