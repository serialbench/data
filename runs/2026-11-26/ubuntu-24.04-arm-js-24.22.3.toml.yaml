    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.005801842, iterations_per_second: 172.359054}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.008474104, iterations_per_second: 118.006576}
