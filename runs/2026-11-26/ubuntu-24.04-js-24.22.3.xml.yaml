platform:
  platform_string: ubuntu-24.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000013790, iterations_per_second: 72514.738621}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000323617, iterations_per_second: 3090.071569}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003308410, iterations_per_second: 302.260028}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.020649045, iterations_per_second: 48.428390}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.016489772, iterations_per_second: 60.643652}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.258770888, iterations_per_second: 3.864422}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000021115, iterations_per_second: 47358.575454}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003772704, iterations_per_second: 265.061853}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.034167274, iterations_per_second: 29.267772}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000026219, iterations_per_second: 38140.279950}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002687564, iterations_per_second: 372.084209}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.035658730, iterations_per_second: 28.043624}
