    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.005232031, iterations_per_second: 191.130354}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019718337, iterations_per_second: 50.714216}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.069705160, iterations_per_second: 14.346140}
  generation:
