    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000005808, iterations_per_second: 172164.451484}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002410214, iterations_per_second: 414.900860}
