    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001521367, iterations_per_second: 657.303740}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.016066025, iterations_per_second: 62.243150}
