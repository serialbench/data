platform:
  platform_string: ubuntu-22.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000004093, iterations_per_second: 244289.727617}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001494197, iterations_per_second: 669.255645}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.017120144, iterations_per_second: 58.410724}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000004517, iterations_per_second: 221371.173046}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001833950, iterations_per_second: 545.271235}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.025025353, iterations_per_second: 39.959476}
  xpath:
  validation:
  plan:
