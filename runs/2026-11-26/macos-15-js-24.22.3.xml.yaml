    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002850820, iterations_per_second: 350.776309}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.048833667, iterations_per_second: 20.477676}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000049250, iterations_per_second: 20304.568528}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.004613000, iterations_per_second: 216.778669}
