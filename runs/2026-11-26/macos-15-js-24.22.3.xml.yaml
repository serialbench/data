platform:
  platform_string: macos-15-js-24.22.3
  kind: wasm
  os: macos
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000011404, iterations_per_second: 87686.992512}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000223179, iterations_per_second: 4480.706303}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002463694, iterations_per_second: 405.894508}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.042755736, iterations_per_second: 23.388675}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.018616292, iterations_per_second: 53.716390}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.477030000, iterations_per_second: 2.096304}
  generation:
