    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000008720, iterations_per_second: 114682.844593}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003002057, iterations_per_second: 333.104934}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.008954779, iterations_per_second: 111.672210}
