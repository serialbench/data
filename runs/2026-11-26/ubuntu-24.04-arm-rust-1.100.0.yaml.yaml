platform:
  platform_string: ubuntu-24.04-arm-rust-1.100.0
  kind: native
  os: linux
  arch: arm64
  runtime: rust
  runtime_version: 1.100.0
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.9.0', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {}}
    - {name: yeptris-json, format: json, version: '0.6.87', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002998, iterations_per_second: 333533.453405}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000007556, iterations_per_second: 132353.914367}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001881199, iterations_per_second: 531.575778}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.007860895, iterations_per_second: 127.211972}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025127307, iterations_per_second: 39.797341}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.102286978, iterations_per_second: 9.776416}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004711, iterations_per_second: 212273.663207}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000008684, iterations_per_second: 115151.654729}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003009999, iterations_per_second: 332.226061}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.008974837, iterations_per_second: 111.422636}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.046442003, iterations_per_second: 21.532232}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.120866320, iterations_per_second: 8.273603}
  xpath:
