    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001856560, iterations_per_second: 538.630682}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.007794633, iterations_per_second: 128.293404}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025005968, iterations_per_second: 39.990453}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.097194909, iterations_per_second: 10.288605}
  generation:
