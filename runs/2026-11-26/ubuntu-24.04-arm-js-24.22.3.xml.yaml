platform:
  platform_string: ubuntu-24.04-arm-js-24.22.3
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000017597, iterations_per_second: 56826.576653}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000148627, iterations_per_second: 6728.261659}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003310008, iterations_per_second: 302.114104}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.026583029, iterations_per_second: 37.617985}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.023363425, iterations_per_second: 42.801944}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.373944924, iterations_per_second: 2.674191}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000027182, iterations_per_second: 36789.592960}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.004030047, iterations_per_second: 248.136064}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.045918574, iterations_per_second: 21.777680}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000030584, iterations_per_second: 32696.941855}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003234185, iterations_per_second: 309.196876}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.042874154, iterations_per_second: 23.324075}
