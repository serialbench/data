platform:
  platform_string: ubuntu-24.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000043794, iterations_per_second: 22834.126058}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000346709, iterations_per_second: 2884.266499}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.006327169, iterations_per_second: 158.048576}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.074942005, iterations_per_second: 13.343651}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.070534274, iterations_per_second: 14.177505}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 0.929887549, iterations_per_second: 1.075399}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000055331, iterations_per_second: 18072.887957}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000490058, iterations_per_second: 2040.574373}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.009625277, iterations_per_second: 103.893114}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.098091804, iterations_per_second: 10.194532}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.139298085, iterations_per_second: 7.178850}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.334005954, iterations_per_second: 0.749622}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000025870, iterations_per_second: 38655.559636}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.003870349, iterations_per_second: 258.374632}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.056512985, iterations_per_second: 17.695048}
