platform:
  platform_string: ubuntu-24.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000070409, iterations_per_second: 14202.669250}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000724980, iterations_per_second: 1379.347445}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.005991522, iterations_per_second: 166.902491}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.079794899, iterations_per_second: 12.532129}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.077512514, iterations_per_second: 12.901143}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 0.998580790, iterations_per_second: 1.001421}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000061093, iterations_per_second: 16368.567767}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000895073, iterations_per_second: 1117.227060}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.010041144, iterations_per_second: 99.590243}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.117234894, iterations_per_second: 8.529884}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.152466724, iterations_per_second: 6.558808}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.351312018, iterations_per_second: 0.740022}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000022483, iterations_per_second: 44477.852253}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.004428158, iterations_per_second: 225.827517}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.061835607, iterations_per_second: 16.171912}
