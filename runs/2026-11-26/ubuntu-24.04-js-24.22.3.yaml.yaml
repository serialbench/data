platform:
  platform_string: ubuntu-24.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000446780, iterations_per_second: 2238.239061}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.081442033, iterations_per_second: 12.278672}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 0.938910516, iterations_per_second: 1.065064}
  generation:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000626821, iterations_per_second: 1595.353056}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.097832269, iterations_per_second: 10.221576}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.317057139, iterations_per_second: 0.759269}
  xpath:
