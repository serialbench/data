platform:
  platform_string: ubuntu-24.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000004824, iterations_per_second: 207296.849088}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.000759720, iterations_per_second: 1316.274994}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.009220570, iterations_per_second: 108.453165}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000003524, iterations_per_second: 283776.497631}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001027754, iterations_per_second: 972.995799}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.015076970, iterations_per_second: 66.326324}
  xpath:
  validation:
  plan:
