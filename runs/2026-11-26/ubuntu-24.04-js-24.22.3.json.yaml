platform:
  platform_string: ubuntu-24.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000002176, iterations_per_second: 459495.473969}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001284361, iterations_per_second: 778.597497}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.008561101, iterations_per_second: 116.807406}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000002933, iterations_per_second: 340912.964920}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.000911993, iterations_per_second: 1096.500045}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.013207245, iterations_per_second: 75.716018}
  xpath:
  validation:
  plan:
