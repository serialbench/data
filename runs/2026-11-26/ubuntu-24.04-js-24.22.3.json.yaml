platform:
  platform_string: ubuntu-24.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000002639, iterations_per_second: 378917.055057}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.000949633, iterations_per_second: 1053.038015}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.008929571, iterations_per_second: 111.987463}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000002176, iterations_per_second: 459601.066274}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001423989, iterations_per_second: 702.252616}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.011528549, iterations_per_second: 86.741185}
