platform:
  platform_string: macos-15-js-24.22.3
  kind: wasm
  os: macos
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000052613, iterations_per_second: 19006.889998}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000294221, iterations_per_second: 3398.807970}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.008892722, iterations_per_second: 112.451504}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.144453847, iterations_per_second: 6.922626}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.095850750, iterations_per_second: 10.432887}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.341688500, iterations_per_second: 0.745329}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000037938, iterations_per_second: 26359.143328}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000662792, iterations_per_second: 1508.769648}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.012124361, iterations_per_second: 82.478574}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.174896500, iterations_per_second: 5.717667}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.221554292, iterations_per_second: 4.513566}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.563573625, iterations_per_second: 0.639561}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000017737, iterations_per_second: 56377.730796}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.006015792, iterations_per_second: 166.229161}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.084867083, iterations_per_second: 11.783132}
