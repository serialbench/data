    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000015622, iterations_per_second: 64011.470856}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.004107251, iterations_per_second: 243.471870}
