platform:
  platform_string: macos-26-intel-rust-1.100.0
  kind: native
  os: macos
  arch: x86_64
  runtime: rust
  runtime_version: 1.100.0
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
