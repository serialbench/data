platform:
  platform_string: ubuntu-22.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000098496, iterations_per_second: 10152.655325}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.001176402, iterations_per_second: 850.049775}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.009027501, iterations_per_second: 110.772627}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.126216185, iterations_per_second: 7.922914}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.104943897, iterations_per_second: 9.528901}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.426906598, iterations_per_second: 0.700817}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000101583, iterations_per_second: 9844.147457}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.001328278, iterations_per_second: 752.854561}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.013884519, iterations_per_second: 72.022661}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.160208669, iterations_per_second: 6.241859}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.201636977, iterations_per_second: 4.959408}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 2.126364809, iterations_per_second: 0.470286}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000045266, iterations_per_second: 22091.733715}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.005836615, iterations_per_second: 171.332175}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.081821894, iterations_per_second: 12.221668}
