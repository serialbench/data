    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.006509627, iterations_per_second: 153.618633}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.006372878, iterations_per_second: 156.914976}
  xpath:
  validation:
  plan:
