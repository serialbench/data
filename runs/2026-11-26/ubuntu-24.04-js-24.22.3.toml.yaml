    - {adapter: smol-toml, format: toml, data_size: small, time_per_iteration: 0.000037351, iterations_per_second: 26772.758183}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.001458454, iterations_per_second: 685.657396}
    - {adapter: smol-toml, format: toml, data_size: medium, time_per_iteration: 0.000737872, iterations_per_second: 1355.248607}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002403518, iterations_per_second: 416.056797}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.004945749, iterations_per_second: 202.193844}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000050354, iterations_per_second: 19859.474359}
    - {adapter: smol-toml, format: toml, data_size: small, time_per_iteration: 0.000033023, iterations_per_second: 30281.557926}
