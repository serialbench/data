    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000487004, iterations_per_second: 2053.372630}
    - {adapter: smol-toml, format: toml, data_size: medium, time_per_iteration: 0.000741568, iterations_per_second: 1348.493396}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002862601, iterations_per_second: 349.332652}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.004479371, iterations_per_second: 223.245630}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000054725, iterations_per_second: 18273.217493}
    - {adapter: smol-toml, format: toml, data_size: small, time_per_iteration: 0.000039046, iterations_per_second: 25610.949193}
