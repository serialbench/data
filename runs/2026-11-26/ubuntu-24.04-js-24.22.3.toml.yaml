    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.008105787, iterations_per_second: 123.368650}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.008877757, iterations_per_second: 112.641065}
  xpath:
  validation:
  plan:
