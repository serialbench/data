    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001034513, iterations_per_second: 966.638097}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.014168519, iterations_per_second: 70.579007}
