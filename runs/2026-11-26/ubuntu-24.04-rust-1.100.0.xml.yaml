    - {adapter: roxmltree, format: xml, data_size: small, time_per_iteration: 0.000001956, iterations_per_second: 511273.582494}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000620533, iterations_per_second: 1611.516975}
    - {adapter: quick-xml, format: xml, data_size: medium, time_per_iteration: 0.000688186, iterations_per_second: 1453.096233}
    - {adapter: roxmltree, format: xml, data_size: medium, time_per_iteration: 0.001835089, iterations_per_second: 544.932599}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.008234318, iterations_per_second: 121.442966}
    - {adapter: quick-xml, format: xml, data_size: large, time_per_iteration: 0.009581747, iterations_per_second: 104.365102}
    - {adapter: roxmltree, format: xml, data_size: large, time_per_iteration: 0.027162889, iterations_per_second: 36.814935}
