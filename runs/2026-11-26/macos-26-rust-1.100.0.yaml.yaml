    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000009012, iterations_per_second: 110957.004161}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002094750, iterations_per_second: 477.383936}
