platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full-xml
  formats: [xml]
  operations: [parsing]
  serializers:
    - name: libxml2
      format: xml
      version: 2.15.4
      features: {xpath: true, namespaces: true}
benchmark_result:
  parsing:
    - adapter: libxml2
      format: xml
      data_size: small
      time_per_iterations: 0.000071000
      time_per_iteration: 0.000007100
      iterations_per_second: 140845.070412
      iterations_count: 10
    - adapter: libxml2
      format: xml
      data_size: medium
      time_per_iterations: 0.007319000
      time_per_iteration: 0.002439667
      iterations_per_second: 409.892062
      iterations_count: 3
    - adapter: libxml2
      format: xml
      data_size: large
      time_per_iterations: 0.045621000
      time_per_iteration: 0.045621000
      iterations_per_second: 21.919730
      iterations_count: 1
