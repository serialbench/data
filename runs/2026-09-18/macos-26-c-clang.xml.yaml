platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full-xml
  formats: [xml]
  operations: [parsing]
  serializers:
    - name: libxml2
      format: xml
      version: 2.9.13
      features: {xpath: true, namespaces: true}
benchmark_result:
  parsing:
    - adapter: libxml2
      format: xml
      data_size: small
      time_per_iterations: 0.000068000
      time_per_iteration: 0.000006800
      iterations_per_second: 147058.823532
      iterations_count: 10
    - adapter: libxml2
      format: xml
      data_size: medium
      time_per_iterations: 0.006147000
      time_per_iteration: 0.002049000
      iterations_per_second: 488.042948
      iterations_count: 3
    - adapter: libxml2
      format: xml
      data_size: large
      time_per_iterations: 0.035218000
      time_per_iteration: 0.035218000
      iterations_per_second: 28.394571
      iterations_count: 1
