platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full-xml
  formats: [xml]
  operations: [parsing]
  serializers:
    - name: libxml2
      format: xml
      version: 2.9.14
      features: {xpath: true, namespaces: true}
benchmark_result:
  parsing:
    - adapter: libxml2
      format: xml
      data_size: small
      time_per_iterations: 0.000057405
      time_per_iteration: 0.000005740
      iterations_per_second: 174200.853607
      iterations_count: 10
    - adapter: libxml2
      format: xml
      data_size: medium
      time_per_iterations: 0.008230405
      time_per_iteration: 0.002743468
      iterations_per_second: 364.502111
      iterations_count: 3
    - adapter: libxml2
      format: xml
      data_size: large
      time_per_iterations: 0.042649360
      time_per_iteration: 0.042649360
      iterations_per_second: 23.447011
      iterations_count: 1
