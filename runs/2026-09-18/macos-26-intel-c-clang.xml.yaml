platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full-xml
  formats: [xml]
  operations: [parsing]
  serializers:
    - name: libxml2
      format: xml
      version: 2.9.13
      features: {xpath: true, namespaces: true}
benchmark_result:
  parsing:
    - adapter: libxml2
      format: xml
      data_size: small
      time_per_iterations: 0.000202000
      time_per_iteration: 0.000020200
      iterations_per_second: 49504.950509
      iterations_count: 10
    - adapter: libxml2
      format: xml
      data_size: medium
      time_per_iterations: 0.027270000
      time_per_iteration: 0.009090000
      iterations_per_second: 110.011001
      iterations_count: 3
    - adapter: libxml2
      format: xml
      data_size: large
      time_per_iterations: 0.103638000
      time_per_iteration: 0.103638000
      iterations_per_second: 9.648970
      iterations_count: 1
