platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full-xml
  formats: [xml]
  operations: [parsing]
  serializers:
    - name: libxml2
      format: xml
      version: 2.9.14
      features: {xpath: true, namespaces: true}
benchmark_result:
  parsing:
    - adapter: libxml2
      format: xml
      data_size: small
      time_per_iterations: 0.000064370
      time_per_iteration: 0.000006437
      iterations_per_second: 155351.871946
      iterations_count: 10
    - adapter: libxml2
      format: xml
      data_size: medium
      time_per_iterations: 0.011069868
      time_per_iteration: 0.003689956
      iterations_per_second: 271.005942
      iterations_count: 3
    - adapter: libxml2
      format: xml
      data_size: large
      time_per_iterations: 0.066245971
      time_per_iteration: 0.066245971
      iterations_per_second: 15.095258
      iterations_count: 1
