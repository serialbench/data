benchmark_config:
  name: full-yaml
  data_sizes:
  - small
  - medium
  - large
  formats:
  - yaml
  iterations:
    small: 10
    medium: 3
    large: 1
  warmup: 2
  operations:
  - parsing
  - generation
  - streaming
  - memory
