platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.412', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003428, iterations_per_second: 291706.776246}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004917, iterations_per_second: 203363.634482}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001429794, iterations_per_second: 699.401289}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002888311, iterations_per_second: 346.223104}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.018091631, iterations_per_second: 55.274176}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.035304243, iterations_per_second: 28.325207}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001029, iterations_per_second: 972289.742165}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000952908, iterations_per_second: 1049.419251}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031479802, iterations_per_second: 31.766401}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004940, iterations_per_second: 202416.857311}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004710, iterations_per_second: 212314.225102}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002265982, iterations_per_second: 441.309837}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004062722, iterations_per_second: 246.140396}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.036035290, iterations_per_second: 27.750575}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.050754463, iterations_per_second: 19.702701}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001240, iterations_per_second: 806516.653699}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001229082, iterations_per_second: 813.615144}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.034793032, iterations_per_second: 28.741387}
  xpath:
  xslt:
