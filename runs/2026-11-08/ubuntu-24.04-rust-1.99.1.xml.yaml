platform:
  platform_string: ubuntu-24.04-rust-1.99.1
  kind: native
  os: linux
  arch: x86_64
  runtime: rust
  runtime_version: 1.99.1
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001261, iterations_per_second: 793084.304862}
    - {adapter: quick-xml, format: xml, data_size: small, time_per_iteration: 0.000001025, iterations_per_second: 975134.080936}
    - {adapter: roxmltree, format: xml, data_size: small, time_per_iteration: 0.000002340, iterations_per_second: 427277.388481}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000990570, iterations_per_second: 1009.520111}
    - {adapter: quick-xml, format: xml, data_size: medium, time_per_iteration: 0.000880023, iterations_per_second: 1136.334367}
    - {adapter: roxmltree, format: xml, data_size: medium, time_per_iteration: 0.002194250, iterations_per_second: 455.736515}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.013209996, iterations_per_second: 75.700250}
    - {adapter: quick-xml, format: xml, data_size: large, time_per_iteration: 0.012851777, iterations_per_second: 77.810251}
    - {adapter: roxmltree, format: xml, data_size: large, time_per_iteration: 0.032285089, iterations_per_second: 30.974051}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000002263, iterations_per_second: 441871.768813}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001802653, iterations_per_second: 554.737933}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.026375886, iterations_per_second: 37.913418}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000002265, iterations_per_second: 441520.596936}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001403437, iterations_per_second: 712.536437}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.020706152, iterations_per_second: 48.294826}
