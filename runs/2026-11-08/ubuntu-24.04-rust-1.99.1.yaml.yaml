platform:
  platform_string: ubuntu-24.04-rust-1.99.1
  kind: native
  os: linux
  arch: x86_64
  runtime: rust
  runtime_version: 1.99.1
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005622, iterations_per_second: 177875.807111}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000005618, iterations_per_second: 177989.783386}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001572258, iterations_per_second: 636.027929}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.005766082, iterations_per_second: 173.427988}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021928571, iterations_per_second: 45.602607}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.077306999, iterations_per_second: 12.935439}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007401, iterations_per_second: 135109.573864}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000007013, iterations_per_second: 142600.462025}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002504684, iterations_per_second: 399.251908}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.007701609, iterations_per_second: 129.843003}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.042633883, iterations_per_second: 23.455522}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.094674272, iterations_per_second: 10.562532}
