platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.413', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009000, iterations_per_second: 111111.111111}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000014000, iterations_per_second: 71428.571406}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002080333, iterations_per_second: 480.692197}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004103667, iterations_per_second: 243.684510}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019267000, iterations_per_second: 51.902216}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.081881000, iterations_per_second: 12.212845}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001163, iterations_per_second: 860215.052781}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000916917, iterations_per_second: 1090.611651}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.014199458, iterations_per_second: 70.425223}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011300, iterations_per_second: 88495.575222}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000019100, iterations_per_second: 52356.020950}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002050667, iterations_per_second: 487.646294}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005448333, iterations_per_second: 183.542368}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.044723000, iterations_per_second: 22.359860}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.096882000, iterations_per_second: 10.321835}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001842, iterations_per_second: 542976.596670}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001334250, iterations_per_second: 749.484729}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018582708, iterations_per_second: 53.813470}
  xpath:
  xslt:
