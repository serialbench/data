platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.413', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.555204}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.727259}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000089333, iterations_per_second: 11194.029851}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000554000, iterations_per_second: 1805.054152}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002121000, iterations_per_second: 471.475719}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.016852000, iterations_per_second: 59.340138}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.586402}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000301667, iterations_per_second: 3314.917127}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.007070000, iterations_per_second: 141.442716}
  xpath:
  xslt:
