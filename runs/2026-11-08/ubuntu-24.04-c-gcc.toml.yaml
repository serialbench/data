platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.412', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000579, iterations_per_second: 1725625.541414}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003742, iterations_per_second: 267265.341046}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000065642, iterations_per_second: 15234.148868}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000412326, iterations_per_second: 2425.265445}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001148454, iterations_per_second: 870.735789}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004748664, iterations_per_second: 210.585546}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000812, iterations_per_second: 1231678.778128}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000098698, iterations_per_second: 10131.917566}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001702949, iterations_per_second: 587.216646}
  xpath:
  xslt:
