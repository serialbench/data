    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384746}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270122}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000463333, iterations_per_second: 2158.273381}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001439667, iterations_per_second: 694.605233}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001062333, iterations_per_second: 941.324129}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005858000, iterations_per_second: 170.706726}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014577000, iterations_per_second: 68.601221}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015897000, iterations_per_second: 62.904951}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.666732}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004600, iterations_per_second: 217391.304359}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000845333, iterations_per_second: 1182.965300}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001457000, iterations_per_second: 686.341798}
