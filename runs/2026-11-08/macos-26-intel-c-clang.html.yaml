    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.012165000, iterations_per_second: 82.203042}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.053065000, iterations_per_second: 18.844813}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.030615000, iterations_per_second: 32.663727}
