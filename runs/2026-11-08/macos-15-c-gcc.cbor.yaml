    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 769230.771173}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000597333, iterations_per_second: 1674.107143}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001409000, iterations_per_second: 709.723208}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006930000, iterations_per_second: 144.300144}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018088000, iterations_per_second: 55.285272}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000313333, iterations_per_second: 3191.489362}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003896000, iterations_per_second: 256.673511}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.293636}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.293636}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001148000, iterations_per_second: 871.080139}
