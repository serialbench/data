platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.412', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000546, iterations_per_second: 1830496.071303}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001965, iterations_per_second: 508828.169214}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000065393, iterations_per_second: 15292.234607}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000192159, iterations_per_second: 5204.023751}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001188063, iterations_per_second: 841.706206}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002298404, iterations_per_second: 435.084520}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000720, iterations_per_second: 1388888.883623}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000095623, iterations_per_second: 10457.698610}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001575480, iterations_per_second: 634.727194}
  xpath:
  xslt:
