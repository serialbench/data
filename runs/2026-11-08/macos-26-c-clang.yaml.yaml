    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008800, iterations_per_second: 113636.363630}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001911333, iterations_per_second: 523.194977}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006899333, iterations_per_second: 144.941540}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.029493000, iterations_per_second: 33.906351}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.082640000, iterations_per_second: 12.100678}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000005487, iterations_per_second: 182232.346466}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001169986, iterations_per_second: 854.711082}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.022523542, iterations_per_second: 44.397990}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007500, iterations_per_second: 133333.333468}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000039900, iterations_per_second: 25062.656641}
