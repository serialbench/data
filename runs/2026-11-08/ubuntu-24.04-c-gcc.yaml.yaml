platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.412', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006009, iterations_per_second: 166422.580221}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004493, iterations_per_second: 222553.579784}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001783590, iterations_per_second: 560.666865}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004088757, iterations_per_second: 244.573126}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024608685, iterations_per_second: 40.636060}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.051034666, iterations_per_second: 19.594524}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001306, iterations_per_second: 765403.751045}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001196094, iterations_per_second: 836.054924}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.037692322, iterations_per_second: 26.530602}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008115, iterations_per_second: 123230.107564}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006633, iterations_per_second: 150756.799157}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002872312, iterations_per_second: 348.151553}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005732820, iterations_per_second: 174.434212}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045396491, iterations_per_second: 22.028134}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.072556029, iterations_per_second: 13.782452}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001658, iterations_per_second: 603063.562876}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001555598, iterations_per_second: 642.839465}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.042248008, iterations_per_second: 23.669755}
  xpath:
  xslt:
