platform:
  platform_string: macos-26-rust-1.99.1
  kind: native
  os: macos
  arch: arm64
  runtime: rust
  runtime_version: 1.99.1
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
