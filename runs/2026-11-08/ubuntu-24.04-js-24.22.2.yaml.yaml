platform:
  platform_string: ubuntu-24.04-js-24.22.2
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.2
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.2', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000547012, iterations_per_second: 1828.114463}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.101532384, iterations_per_second: 9.849074}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.197520630, iterations_per_second: 0.835059}
  generation:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000717688, iterations_per_second: 1393.363909}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.128140791, iterations_per_second: 7.803916}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.778804582, iterations_per_second: 0.562175}
  xpath:
