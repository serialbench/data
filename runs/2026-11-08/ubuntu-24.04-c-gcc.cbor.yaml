platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.412', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000977, iterations_per_second: 1023017.903314}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001023, iterations_per_second: 977135.039946}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000652416, iterations_per_second: 1532.765154}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001810933, iterations_per_second: 552.201443}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.016990267, iterations_per_second: 58.857227}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.036698451, iterations_per_second: 27.249107}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000302, iterations_per_second: 3315649.874245}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000306270, iterations_per_second: 3265.092892}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003424196, iterations_per_second: 292.039358}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001832, iterations_per_second: 545762.157515}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001743, iterations_per_second: 573855.158977}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002154418, iterations_per_second: 464.162479}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002295841, iterations_per_second: 435.570170}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.027117966, iterations_per_second: 36.875922}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.044019325, iterations_per_second: 22.717295}
  xpath:
  xslt:
