platform:
  platform_string: ubuntu-24.04-arm-rust-1.99.1
  kind: native
  os: linux
  arch: arm64
  runtime: rust
  runtime_version: 1.99.1
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002929, iterations_per_second: 341460.083316}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000007496, iterations_per_second: 133411.601473}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001821566, iterations_per_second: 548.978086}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.007851458, iterations_per_second: 127.364879}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024479919, iterations_per_second: 40.849808}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.097123915, iterations_per_second: 10.296125}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004525, iterations_per_second: 220979.824542}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000008683, iterations_per_second: 115172.874485}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002856574, iterations_per_second: 350.069699}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.008983236, iterations_per_second: 111.318460}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.042963307, iterations_per_second: 23.275676}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.114340283, iterations_per_second: 8.745824}
  xpath:
