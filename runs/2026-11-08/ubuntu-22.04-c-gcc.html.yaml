platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.412', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001505, iterations_per_second: 664540.137211}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004319, iterations_per_second: 231535.077643}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007595, iterations_per_second: 131663.835920}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000513361, iterations_per_second: 1947.945696}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002190426, iterations_per_second: 456.532130}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001440198, iterations_per_second: 694.348971}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004989858, iterations_per_second: 200.406505}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.021844677, iterations_per_second: 45.777743}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014256148, iterations_per_second: 70.145175}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002863, iterations_per_second: 349247.371920}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007216, iterations_per_second: 138573.249788}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000985295, iterations_per_second: 1014.924121}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001824326, iterations_per_second: 548.147745}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010059946, iterations_per_second: 99.404112}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018488787, iterations_per_second: 54.086837}
  xpath:
  xslt:
