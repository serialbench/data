platform:
  platform_string: windows-2025-js-24.22.2
  kind: wasm
  os: windows
  arch: x86_64
  runtime: js
  runtime_version: 24.22.2
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.2', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000398130, iterations_per_second: 2511.742396}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.105882900, iterations_per_second: 9.444396}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.466170000, iterations_per_second: 0.682049}
  generation:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000613610, iterations_per_second: 1629.699646}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.141860433, iterations_per_second: 7.049182}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.967631600, iterations_per_second: 0.508225}
