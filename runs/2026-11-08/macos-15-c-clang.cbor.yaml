    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.911386}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000544667, iterations_per_second: 1835.985312}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001313000, iterations_per_second: 761.614623}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010752000, iterations_per_second: 93.005952}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.019112000, iterations_per_second: 52.323148}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000342000, iterations_per_second: 2923.976608}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004034000, iterations_per_second: 247.892910}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.668350}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.668350}
