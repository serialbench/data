platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.412', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001134, iterations_per_second: 882067.564985}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003265, iterations_per_second: 306297.476097}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004098, iterations_per_second: 244015.519484}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000365280, iterations_per_second: 2737.623433}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001595424, iterations_per_second: 626.792496}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000956266, iterations_per_second: 1045.733772}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003622881, iterations_per_second: 276.023419}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015663782, iterations_per_second: 63.841542}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009673356, iterations_per_second: 103.376739}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003982, iterations_per_second: 251136.392032}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005194, iterations_per_second: 192540.963109}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000767379, iterations_per_second: 1303.137608}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001288975, iterations_per_second: 775.810237}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007817173, iterations_per_second: 127.923483}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012928291, iterations_per_second: 77.349744}
  xpath:
  xslt:
