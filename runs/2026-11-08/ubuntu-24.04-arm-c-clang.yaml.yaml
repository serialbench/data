platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.412', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002944, iterations_per_second: 339720.070270}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003928, iterations_per_second: 254563.042678}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001847306, iterations_per_second: 541.328930}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003944505, iterations_per_second: 253.517213}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024434457, iterations_per_second: 40.925812}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047989575, iterations_per_second: 20.837859}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001162, iterations_per_second: 860955.660387}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001205604, iterations_per_second: 829.459527}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031870027, iterations_per_second: 31.377444}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004478, iterations_per_second: 223323.953925}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006006, iterations_per_second: 166486.306621}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002830248, iterations_per_second: 353.325928}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005527919, iterations_per_second: 180.899890}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043401347, iterations_per_second: 23.040760}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.069004140, iterations_per_second: 14.491884}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001442, iterations_per_second: 693385.106450}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001489081, iterations_per_second: 671.555291}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.035478121, iterations_per_second: 28.186386}
  xpath:
  xslt:
