platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.412', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004444, iterations_per_second: 225007.312845}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004711, iterations_per_second: 212282.675609}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001907250, iterations_per_second: 524.315113}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004555644, iterations_per_second: 219.507950}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026189826, iterations_per_second: 38.182766}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055938426, iterations_per_second: 17.876799}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001739, iterations_per_second: 574977.000327}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001905410, iterations_per_second: 524.821430}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.047089185, iterations_per_second: 21.236299}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007169, iterations_per_second: 139483.631605}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007356, iterations_per_second: 135948.991924}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003134400, iterations_per_second: 319.040327}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006749987, iterations_per_second: 148.148433}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.051968941, iterations_per_second: 19.242262}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085340981, iterations_per_second: 11.717700}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 500075.011721}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002344222, iterations_per_second: 426.580759}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.051135402, iterations_per_second: 19.555923}
  xpath:
  xslt:
