platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.412', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001366, iterations_per_second: 731903.681247}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003105, iterations_per_second: 322102.686298}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004954, iterations_per_second: 201853.010597}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000467913, iterations_per_second: 2137.147905}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001607068, iterations_per_second: 622.251205}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001341443, iterations_per_second: 745.466075}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004631688, iterations_per_second: 215.904007}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015977370, iterations_per_second: 62.588524}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013521114, iterations_per_second: 73.958403}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002287, iterations_per_second: 437234.926350}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006302, iterations_per_second: 158679.784127}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000843105, iterations_per_second: 1186.092355}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001769956, iterations_per_second: 564.985796}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008581062, iterations_per_second: 116.535692}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017730046, iterations_per_second: 56.401433}
  xpath:
  xslt:
