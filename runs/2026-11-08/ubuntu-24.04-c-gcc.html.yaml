platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.412', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001409, iterations_per_second: 709521.782633}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003556, iterations_per_second: 281206.940154}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005418, iterations_per_second: 184580.172365}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000496208, iterations_per_second: 2015.282559}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002112107, iterations_per_second: 473.460936}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001279773, iterations_per_second: 781.388371}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004889647, iterations_per_second: 204.513741}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.021313339, iterations_per_second: 46.918974}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013763016, iterations_per_second: 72.658493}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002631, iterations_per_second: 380040.284177}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006628, iterations_per_second: 150881.904729}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001021780, iterations_per_second: 978.684576}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001750096, iterations_per_second: 571.397117}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010199030, iterations_per_second: 98.048540}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018058817, iterations_per_second: 55.374613}
  xpath:
  xslt:
