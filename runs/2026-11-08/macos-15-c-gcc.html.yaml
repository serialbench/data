    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 399999.999191}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.777602}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000433333, iterations_per_second: 2307.692308}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001366333, iterations_per_second: 731.885826}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001039333, iterations_per_second: 962.155228}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004299000, iterations_per_second: 232.612235}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014120000, iterations_per_second: 70.821530}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010598000, iterations_per_second: 94.357426}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.666732}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000797667, iterations_per_second: 1253.656498}
