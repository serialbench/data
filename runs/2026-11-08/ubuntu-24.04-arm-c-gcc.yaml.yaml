platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.412', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002917, iterations_per_second: 342864.979217}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003965, iterations_per_second: 252181.368987}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001794808, iterations_per_second: 557.162660}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003958245, iterations_per_second: 252.637195}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024182082, iterations_per_second: 41.352932}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047839975, iterations_per_second: 20.903021}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001202, iterations_per_second: 831739.165858}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001192306, iterations_per_second: 838.710868}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032678462, iterations_per_second: 30.601195}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004513, iterations_per_second: 221567.367486}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006047, iterations_per_second: 165376.728301}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002839236, iterations_per_second: 352.207466}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005520935, iterations_per_second: 181.128740}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043697286, iterations_per_second: 22.884716}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.069031340, iterations_per_second: 14.486174}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001458, iterations_per_second: 686106.345406}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001472229, iterations_per_second: 679.242156}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.036594598, iterations_per_second: 27.326438}
  xpath:
  xslt:
