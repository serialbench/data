    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008700, iterations_per_second: 114942.528725}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002375667, iterations_per_second: 420.934475}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008068667, iterations_per_second: 123.936214}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.038589000, iterations_per_second: 25.914121}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.105776000, iterations_per_second: 9.453940}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001682, iterations_per_second: 594530.323592}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001784925, iterations_per_second: 560.247734}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.030952157, iterations_per_second: 32.307926}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011900, iterations_per_second: 84033.613417}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000013200, iterations_per_second: 75757.575753}
