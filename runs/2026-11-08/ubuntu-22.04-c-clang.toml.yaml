platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.412', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000467, iterations_per_second: 2142704.099593}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001429, iterations_per_second: 699741.096520}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000062269, iterations_per_second: 16059.441344}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000160174, iterations_per_second: 6243.223501}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001419851, iterations_per_second: 704.299254}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.001943436, iterations_per_second: 514.552576}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000583, iterations_per_second: 1715854.491637}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000099397, iterations_per_second: 10060.665815}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001781266, iterations_per_second: 561.398466}
  xpath:
  xslt:
