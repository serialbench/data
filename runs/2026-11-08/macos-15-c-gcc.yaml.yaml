platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.413', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003100, iterations_per_second: 322580.644793}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270122}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001246333, iterations_per_second: 802.353570}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003645667, iterations_per_second: 274.298254}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.017743000, iterations_per_second: 56.360255}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048771000, iterations_per_second: 20.503988}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001000, iterations_per_second: 999999.996840}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001264500, iterations_per_second: 790.826414}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018594375, iterations_per_second: 53.779705}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.727259}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005900, iterations_per_second: 169491.525362}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002162333, iterations_per_second: 462.463388}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005724000, iterations_per_second: 174.703005}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.033070000, iterations_per_second: 30.238887}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.087312000, iterations_per_second: 11.453179}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001346, iterations_per_second: 742997.250822}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001768208, iterations_per_second: 565.544218}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.024264125, iterations_per_second: 41.213108}
  xpath:
  xslt:
