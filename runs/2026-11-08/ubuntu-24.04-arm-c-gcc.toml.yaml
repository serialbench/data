platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.412', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000530, iterations_per_second: 1885369.527975}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003126, iterations_per_second: 319877.167238}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000077024, iterations_per_second: 12982.910165}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000314758, iterations_per_second: 3177.043951}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001205649, iterations_per_second: 829.428797}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003759858, iterations_per_second: 265.967491}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000710, iterations_per_second: 1407657.653823}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000095247, iterations_per_second: 10499.018343}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001589880, iterations_per_second: 628.978288}
  xpath:
  xslt:
