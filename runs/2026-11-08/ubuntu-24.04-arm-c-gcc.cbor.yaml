platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.412', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001010, iterations_per_second: 989805.006223}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001243, iterations_per_second: 804375.804023}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000686195, iterations_per_second: 1457.310989}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001889402, iterations_per_second: 529.268084}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.016401141, iterations_per_second: 60.971368}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033482950, iterations_per_second: 29.865947}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000368, iterations_per_second: 2717391.289382}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000319715, iterations_per_second: 3127.785684}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004149449, iterations_per_second: 240.995853}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001702, iterations_per_second: 587440.521714}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001504, iterations_per_second: 664937.828117}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002108507, iterations_per_second: 474.269234}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002144374, iterations_per_second: 466.336490}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.025704068, iterations_per_second: 38.904348}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.037516631, iterations_per_second: 26.654845}
  xpath:
  xslt:
