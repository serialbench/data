    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007500, iterations_per_second: 133333.333367}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008700, iterations_per_second: 114942.528725}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000989333, iterations_per_second: 1010.781671}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001566000, iterations_per_second: 638.569604}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001296333, iterations_per_second: 771.406531}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005913000, iterations_per_second: 169.118891}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015452000, iterations_per_second: 64.716542}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018372000, iterations_per_second: 54.430655}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000004800, iterations_per_second: 208333.333366}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006700, iterations_per_second: 149253.731340}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001700667, iterations_per_second: 588.004704}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001555667, iterations_per_second: 642.811228}
