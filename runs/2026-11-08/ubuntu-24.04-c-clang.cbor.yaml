platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.412', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000977, iterations_per_second: 1023017.903314}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000936, iterations_per_second: 1067919.689975}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000579276, iterations_per_second: 1726.292821}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001608786, iterations_per_second: 621.586841}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.017656093, iterations_per_second: 56.637672}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034273228, iterations_per_second: 29.177293}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000349, iterations_per_second: 2861230.339523}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000327698, iterations_per_second: 3051.590184}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004150310, iterations_per_second: 240.945857}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001672, iterations_per_second: 598265.030864}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001371, iterations_per_second: 729341.404273}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002279985, iterations_per_second: 438.599313}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002038652, iterations_per_second: 490.520126}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.026498440, iterations_per_second: 37.738071}
