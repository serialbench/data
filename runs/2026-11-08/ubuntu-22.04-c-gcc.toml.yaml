platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.412', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.60', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.60', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.26', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.60', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000583, iterations_per_second: 1714971.700041}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003501, iterations_per_second: 285600.045306}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000088648, iterations_per_second: 11280.527928}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000413289, iterations_per_second: 2419.616313}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001797432, iterations_per_second: 556.349281}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004749102, iterations_per_second: 210.566124}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000807, iterations_per_second: 1239925.599642}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000123850, iterations_per_second: 8074.261676}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002213416, iterations_per_second: 451.790355}
  xpath:
  xslt:
