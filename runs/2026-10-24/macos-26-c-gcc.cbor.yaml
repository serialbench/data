platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.000468}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.666732}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000441333, iterations_per_second: 2265.861027}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001405667, iterations_per_second: 711.406213}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005396000, iterations_per_second: 185.322461}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.017801000, iterations_per_second: 56.176619}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.310170}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000320667, iterations_per_second: 3118.503119}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004115000, iterations_per_second: 243.013366}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001900, iterations_per_second: 526315.789228}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.666732}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000963333, iterations_per_second: 1038.062284}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001712333, iterations_per_second: 583.998443}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013057000, iterations_per_second: 76.587271}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023815000, iterations_per_second: 41.990342}
  xpath:
  xslt:
