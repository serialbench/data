    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.332912}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000448333, iterations_per_second: 2230.483272}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001540000, iterations_per_second: 649.350649}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005458000, iterations_per_second: 183.217296}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.019333000, iterations_per_second: 51.725030}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000351000, iterations_per_second: 2849.002849}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004022000, iterations_per_second: 248.632521}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 500000.001262}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.609793}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000983000, iterations_per_second: 1017.293998}
