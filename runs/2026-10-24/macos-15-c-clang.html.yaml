    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006800, iterations_per_second: 147058.823409}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009400, iterations_per_second: 106382.978735}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000996333, iterations_per_second: 1003.680161}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001586000, iterations_per_second: 630.517024}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001157333, iterations_per_second: 864.055300}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004374000, iterations_per_second: 228.623685}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016031000, iterations_per_second: 62.379140}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011596000, iterations_per_second: 86.236633}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005700, iterations_per_second: 175438.596584}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000011200, iterations_per_second: 89285.714149}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000860333, iterations_per_second: 1162.340178}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001579000, iterations_per_second: 633.312223}
