platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370136}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000900667, iterations_per_second: 1110.288675}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001471667, iterations_per_second: 679.501699}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001133000, iterations_per_second: 882.612533}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005334000, iterations_per_second: 187.476565}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.017672000, iterations_per_second: 56.586691}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014866000, iterations_per_second: 67.267590}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.666732}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004700, iterations_per_second: 212765.957341}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000905667, iterations_per_second: 1104.158999}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001484667, iterations_per_second: 673.551863}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.011230000, iterations_per_second: 89.047195}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018687000, iterations_per_second: 53.513137}
