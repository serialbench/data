    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007400, iterations_per_second: 135135.135061}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010400, iterations_per_second: 96153.846186}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001094667, iterations_per_second: 913.520097}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002698667, iterations_per_second: 370.553360}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001416333, iterations_per_second: 706.048482}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003966000, iterations_per_second: 252.143217}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.012886000, iterations_per_second: 77.603601}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009570000, iterations_per_second: 104.493208}
  generation:
