platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001333, iterations_per_second: 750243.828560}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003023, iterations_per_second: 330764.394456}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005106, iterations_per_second: 195828.845667}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000459154, iterations_per_second: 2177.918520}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001627964, iterations_per_second: 614.264197}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001334410, iterations_per_second: 749.394676}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004604331, iterations_per_second: 217.186818}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015978195, iterations_per_second: 62.585292}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013392371, iterations_per_second: 74.669377}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002322, iterations_per_second: 430718.869154}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006233, iterations_per_second: 160436.386994}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000832212, iterations_per_second: 1201.616896}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001762003, iterations_per_second: 567.535816}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008482270, iterations_per_second: 117.892970}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017676516, iterations_per_second: 56.572234}
  xpath:
  xslt:
