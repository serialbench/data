platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001360, iterations_per_second: 735348.187422}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003136, iterations_per_second: 318897.888885}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007465, iterations_per_second: 133954.884055}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000459886, iterations_per_second: 2174.451929}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001607615, iterations_per_second: 622.039610}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001338666, iterations_per_second: 747.012324}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004584963, iterations_per_second: 218.104268}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016020668, iterations_per_second: 62.419370}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013573085, iterations_per_second: 73.675218}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002290, iterations_per_second: 436776.588218}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006228, iterations_per_second: 160575.502616}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000826183, iterations_per_second: 1210.385104}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001771818, iterations_per_second: 564.392160}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008491161, iterations_per_second: 117.769525}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017742170, iterations_per_second: 56.362891}
  xpath:
  xslt:
