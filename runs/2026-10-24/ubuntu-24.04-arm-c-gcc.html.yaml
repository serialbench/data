platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001342, iterations_per_second: 744989.943501}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002997, iterations_per_second: 333622.472807}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005035, iterations_per_second: 198613.676571}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000462836, iterations_per_second: 2160.594077}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001602846, iterations_per_second: 623.890125}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001345580, iterations_per_second: 743.174131}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004655796, iterations_per_second: 214.786043}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015955030, iterations_per_second: 62.676159}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013509274, iterations_per_second: 74.023223}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002333, iterations_per_second: 428706.164452}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008332, iterations_per_second: 120026.405792}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000832443, iterations_per_second: 1201.283932}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001759434, iterations_per_second: 568.364491}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008458126, iterations_per_second: 118.229499}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017643934, iterations_per_second: 56.676703}
  xpath:
  xslt:
