platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001353, iterations_per_second: 739262.216690}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003092, iterations_per_second: 323436.186113}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004993, iterations_per_second: 200300.450623}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000461917, iterations_per_second: 2164.892657}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001613103, iterations_per_second: 619.923216}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001342241, iterations_per_second: 745.022505}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004612473, iterations_per_second: 216.803437}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015978063, iterations_per_second: 62.585809}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013478026, iterations_per_second: 74.194841}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002349, iterations_per_second: 425785.574322}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006296, iterations_per_second: 158820.913552}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000833341, iterations_per_second: 1199.989440}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001779144, iterations_per_second: 562.068156}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008463360, iterations_per_second: 118.156382}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017716826, iterations_per_second: 56.443519}
  xpath:
  xslt:
