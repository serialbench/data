    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000388, iterations_per_second: 2577319.582053}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000381429, iterations_per_second: 2621.717610}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004751269, iterations_per_second: 210.470087}
  generation:
