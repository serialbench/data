    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000791562, iterations_per_second: 1263.325452}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001804120, iterations_per_second: 554.286752}
