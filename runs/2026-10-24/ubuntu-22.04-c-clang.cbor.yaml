    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.019300338, iterations_per_second: 51.812564}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000251, iterations_per_second: 3977724.715875}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000279370, iterations_per_second: 3579.482407}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003415245, iterations_per_second: 292.804762}
  generation:
