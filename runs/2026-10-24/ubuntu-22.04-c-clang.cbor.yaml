platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001314, iterations_per_second: 760803.426061}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001236, iterations_per_second: 808799.756999}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000929598, iterations_per_second: 1075.733812}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001956498, iterations_per_second: 511.117400}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.029173762, iterations_per_second: 34.277376}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040771536, iterations_per_second: 24.526915}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000463, iterations_per_second: 2160293.725668}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000446338, iterations_per_second: 2240.456217}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005677063, iterations_per_second: 176.147420}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002181, iterations_per_second: 458484.243675}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001714, iterations_per_second: 583362.495990}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003262897, iterations_per_second: 306.476116}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002452251, iterations_per_second: 407.788544}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.039436068, iterations_per_second: 25.357498}
