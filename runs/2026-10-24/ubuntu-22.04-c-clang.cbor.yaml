    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000466, iterations_per_second: 2146383.364516}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000444482, iterations_per_second: 2249.811578}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005532997, iterations_per_second: 180.733877}
  generation:
