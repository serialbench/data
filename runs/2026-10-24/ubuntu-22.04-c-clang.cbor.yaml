    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001350, iterations_per_second: 741015.189779}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000925225, iterations_per_second: 1080.818179}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001946013, iterations_per_second: 513.871094}
