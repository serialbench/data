    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000814, iterations_per_second: 1228048.630380}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000387043, iterations_per_second: 2583.692251}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001052318, iterations_per_second: 950.283089}
