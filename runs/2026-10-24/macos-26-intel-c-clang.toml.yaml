platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.727690}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.649768}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000071667, iterations_per_second: 13953.488370}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000373667, iterations_per_second: 2676.181980}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000978000, iterations_per_second: 1022.494887}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004594000, iterations_per_second: 217.675229}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.607644}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000152000, iterations_per_second: 6578.947372}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002101000, iterations_per_second: 475.963827}
  xpath:
  xslt:
