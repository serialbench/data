platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.716089}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270122}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000152333, iterations_per_second: 6564.551421}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000439333, iterations_per_second: 2276.176024}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001136000, iterations_per_second: 880.281690}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004337000, iterations_per_second: 230.574130}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.334175}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000246000, iterations_per_second: 4065.040651}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002143000, iterations_per_second: 466.635558}
  xpath:
  xslt:
