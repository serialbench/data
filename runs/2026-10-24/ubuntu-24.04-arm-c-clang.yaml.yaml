platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002709, iterations_per_second: 369180.787743}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003986, iterations_per_second: 250865.485784}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001612574, iterations_per_second: 620.126708}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003959057, iterations_per_second: 252.585422}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021549732, iterations_per_second: 46.404289}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048217794, iterations_per_second: 20.739232}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001154, iterations_per_second: 866851.595897}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001201200, iterations_per_second: 832.500833}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028158615, iterations_per_second: 35.513110}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004205, iterations_per_second: 237789.508699}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006032, iterations_per_second: 165790.738951}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002602031, iterations_per_second: 384.315126}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005489118, iterations_per_second: 182.178631}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.039005485, iterations_per_second: 25.637420}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068908872, iterations_per_second: 14.511919}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001407, iterations_per_second: 710681.543115}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001480701, iterations_per_second: 675.355642}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031655701, iterations_per_second: 31.589886}
  xpath:
  xslt:
