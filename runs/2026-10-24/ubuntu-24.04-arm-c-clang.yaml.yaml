platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002726, iterations_per_second: 366810.945595}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004006, iterations_per_second: 249619.330565}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001684889, iterations_per_second: 593.510908}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003946651, iterations_per_second: 253.379406}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021891112, iterations_per_second: 45.680640}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047909461, iterations_per_second: 20.872704}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001145, iterations_per_second: 873515.023749}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001200648, iterations_per_second: 832.883807}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028516864, iterations_per_second: 35.066969}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004229, iterations_per_second: 236445.747643}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006096, iterations_per_second: 164033.922188}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002667935, iterations_per_second: 374.821725}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005489795, iterations_per_second: 182.156175}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040313106, iterations_per_second: 24.805829}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068769209, iterations_per_second: 14.541392}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001399, iterations_per_second: 714745.194638}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001488847, iterations_per_second: 671.660688}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031862257, iterations_per_second: 31.385096}
  xpath:
  xslt:
