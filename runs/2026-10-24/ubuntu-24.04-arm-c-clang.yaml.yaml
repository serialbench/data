platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002841, iterations_per_second: 351939.184744}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004105, iterations_per_second: 243635.034614}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001625721, iterations_per_second: 615.111695}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004006424, iterations_per_second: 249.599123}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021697265, iterations_per_second: 46.088758}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048594051, iterations_per_second: 20.578651}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001179, iterations_per_second: 848104.487085}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001201612, iterations_per_second: 832.215160}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026848484, iterations_per_second: 37.246051}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004325, iterations_per_second: 231240.605848}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006039, iterations_per_second: 165595.813714}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002653239, iterations_per_second: 376.897822}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005505944, iterations_per_second: 181.621887}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040075861, iterations_per_second: 24.952677}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068832306, iterations_per_second: 14.528062}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001442, iterations_per_second: 693337.030635}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001491222, iterations_per_second: 670.590965}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.030924661, iterations_per_second: 32.336652}
  xpath:
  xslt:
