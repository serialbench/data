platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002818, iterations_per_second: 354836.420484}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004033, iterations_per_second: 247978.971533}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001644139, iterations_per_second: 608.221204}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003944768, iterations_per_second: 253.500311}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021750503, iterations_per_second: 45.975948}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047942045, iterations_per_second: 20.858518}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001158, iterations_per_second: 863334.196466}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001207675, iterations_per_second: 828.037116}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028039109, iterations_per_second: 35.664471}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004313, iterations_per_second: 231835.674825}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006052, iterations_per_second: 165223.712931}
