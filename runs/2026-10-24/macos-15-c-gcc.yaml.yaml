    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 249999.999921}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001252000, iterations_per_second: 798.722045}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004329333, iterations_per_second: 230.982445}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016009000, iterations_per_second: 62.464864}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.065755000, iterations_per_second: 15.207969}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002663, iterations_per_second: 375586.854005}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002444778, iterations_per_second: 409.035150}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.034845666, iterations_per_second: 28.697974}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004900, iterations_per_second: 204081.632221}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005900, iterations_per_second: 169491.525198}
