platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007100, iterations_per_second: 140845.070383}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010900, iterations_per_second: 91743.119258}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002335333, iterations_per_second: 428.204396}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004952667, iterations_per_second: 201.911428}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.013552000, iterations_per_second: 73.789847}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.043136000, iterations_per_second: 23.182493}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000958, iterations_per_second: 1043514.556184}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001031764, iterations_per_second: 969.214203}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.016575667, iterations_per_second: 60.329397}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011400, iterations_per_second: 87719.298248}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000017100, iterations_per_second: 58479.532166}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001979667, iterations_per_second: 505.135545}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005456333, iterations_per_second: 183.273260}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024472000, iterations_per_second: 40.863027}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068186000, iterations_per_second: 14.665767}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001363, iterations_per_second: 733944.953685}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001332917, iterations_per_second: 750.234448}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020367291, iterations_per_second: 49.098331}
  xpath:
  xslt:
