platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006300, iterations_per_second: 158730.158701}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010500, iterations_per_second: 95238.095221}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001036333, iterations_per_second: 964.940495}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004811000, iterations_per_second: 207.856994}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019187000, iterations_per_second: 52.118622}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.067726000, iterations_per_second: 14.765378}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002608, iterations_per_second: 383391.481540}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001258611, iterations_per_second: 794.526665}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027029667, iterations_per_second: 36.996386}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009200, iterations_per_second: 108695.652180}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005900, iterations_per_second: 169491.525362}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003860000, iterations_per_second: 259.067358}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006019333, iterations_per_second: 166.131355}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.042031000, iterations_per_second: 23.791963}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.108700000, iterations_per_second: 9.199632}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.646818}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001548208, iterations_per_second: 645.907904}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.049071375, iterations_per_second: 20.378479}
  xpath:
  xslt:
