    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.895008}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001200667, iterations_per_second: 832.870627}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006306667, iterations_per_second: 158.562368}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031047000, iterations_per_second: 32.209231}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.077672000, iterations_per_second: 12.874652}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000983, iterations_per_second: 1016983.622888}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001378319, iterations_per_second: 725.521275}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027645167, iterations_per_second: 36.172688}
  generation:
