platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.8.5', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001820, iterations_per_second: 549450.549465}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004550, iterations_per_second: 219780.219511}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006910, iterations_per_second: 144717.800250}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000535300, iterations_per_second: 1868.111339}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002257333, iterations_per_second: 443.000591}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001869767, iterations_per_second: 534.826092}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005368500, iterations_per_second: 186.271771}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.021982800, iterations_per_second: 45.490110}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.020229100, iterations_per_second: 49.433737}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003630, iterations_per_second: 275482.093410}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008600, iterations_per_second: 116279.069754}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001015967, iterations_per_second: 984.284261}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002541967, iterations_per_second: 393.396189}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010060600, iterations_per_second: 99.397650}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.027175700, iterations_per_second: 36.797580}
  xpath:
  xslt:
