platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.8.5', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001660, iterations_per_second: 602409.639250}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004320, iterations_per_second: 231481.481518}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007470, iterations_per_second: 133868.808518}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000460300, iterations_per_second: 2172.496198}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002096000, iterations_per_second: 477.099237}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001905800, iterations_per_second: 524.714031}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004606600, iterations_per_second: 217.079842}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.021064800, iterations_per_second: 47.472561}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.020027200, iterations_per_second: 49.932092}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003540, iterations_per_second: 282485.875694}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009060, iterations_per_second: 110375.275981}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000908233, iterations_per_second: 1101.038646}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002593833, iterations_per_second: 385.529782}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009434600, iterations_per_second: 105.992835}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.027889000, iterations_per_second: 35.856431}
  xpath:
  xslt:
