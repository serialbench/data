    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008160, iterations_per_second: 122549.019627}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000468233, iterations_per_second: 2135.687335}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002169667, iterations_per_second: 460.900292}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001919767, iterations_per_second: 520.896637}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004825300, iterations_per_second: 207.241001}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.020981800, iterations_per_second: 47.660353}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.022086900, iterations_per_second: 45.275706}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003410, iterations_per_second: 293255.132021}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009870, iterations_per_second: 101317.122569}
