    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003860, iterations_per_second: 259067.357633}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007170, iterations_per_second: 139470.013990}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000469167, iterations_per_second: 2131.438721}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002078433, iterations_per_second: 481.131622}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001964333, iterations_per_second: 509.078568}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004786500, iterations_per_second: 208.920923}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.020772700, iterations_per_second: 48.140107}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.021898900, iterations_per_second: 45.664394}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003310, iterations_per_second: 302114.803662}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008710, iterations_per_second: 114810.562532}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000928433, iterations_per_second: 1077.083259}
