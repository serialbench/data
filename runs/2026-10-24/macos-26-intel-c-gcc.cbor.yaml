platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 499999.998420}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003100, iterations_per_second: 322580.644793}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000790667, iterations_per_second: 1264.755481}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003318000, iterations_per_second: 301.386377}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010860000, iterations_per_second: 92.081031}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.045508000, iterations_per_second: 21.974158}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000500, iterations_per_second: 2000000.005050}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000517667, iterations_per_second: 1931.745010}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.006206000, iterations_per_second: 161.134386}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.587078}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001537333, iterations_per_second: 650.477016}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004129667, iterations_per_second: 242.150295}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021621000, iterations_per_second: 46.251330}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.060613000, iterations_per_second: 16.498111}
  xpath:
  xslt:
