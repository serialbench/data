platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 500000.001262}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.334175}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000783000, iterations_per_second: 1277.139208}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003306333, iterations_per_second: 302.449844}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011889000, iterations_per_second: 84.111363}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.048257000, iterations_per_second: 20.722382}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000500, iterations_per_second: 2000000.005050}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000490667, iterations_per_second: 2038.043478}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.006013000, iterations_per_second: 166.306336}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.587078}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001513000, iterations_per_second: 660.938533}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004069333, iterations_per_second: 245.740498}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022431000, iterations_per_second: 44.581160}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.058085000, iterations_per_second: 17.216149}
  xpath:
  xslt:
