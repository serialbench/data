platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000561, iterations_per_second: 1782213.507287}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004233, iterations_per_second: 236244.654988}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000073110, iterations_per_second: 13677.957060}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000461426, iterations_per_second: 2167.194740}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001435485, iterations_per_second: 696.628666}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005604810, iterations_per_second: 178.418180}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000791, iterations_per_second: 1263423.879088}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000118436, iterations_per_second: 8443.402466}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002007037, iterations_per_second: 498.246918}
  xpath:
  xslt:
