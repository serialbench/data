platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 399999.995553}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006700, iterations_per_second: 149253.731467}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007400, iterations_per_second: 135135.135061}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000903000, iterations_per_second: 1107.419712}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003719333, iterations_per_second: 268.865388}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002274333, iterations_per_second: 439.689286}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009101000, iterations_per_second: 109.878035}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037450000, iterations_per_second: 26.702270}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.023190000, iterations_per_second: 43.122035}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006400, iterations_per_second: 156250.000394}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009600, iterations_per_second: 104166.666436}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001947000, iterations_per_second: 513.610683}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003261000, iterations_per_second: 306.654400}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019742000, iterations_per_second: 50.653429}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.033283000, iterations_per_second: 30.045369}
  xpath:
  xslt:
