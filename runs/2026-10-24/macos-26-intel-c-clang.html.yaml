    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000010600, iterations_per_second: 94339.622677}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010000, iterations_per_second: 100000.000025}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000998000, iterations_per_second: 1002.004008}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004631000, iterations_per_second: 215.936083}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002483333, iterations_per_second: 402.684564}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010277000, iterations_per_second: 97.304661}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.049549000, iterations_per_second: 20.182042}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.030666000, iterations_per_second: 32.609405}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006400, iterations_per_second: 156250.000117}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000013200, iterations_per_second: 75757.575753}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002159333, iterations_per_second: 463.105897}
