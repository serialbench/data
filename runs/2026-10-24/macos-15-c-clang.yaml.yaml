platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.334175}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.726672}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001090667, iterations_per_second: 916.870416}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003699667, iterations_per_second: 270.294621}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.013628000, iterations_per_second: 73.378339}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.043090000, iterations_per_second: 23.207241}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000937, iterations_per_second: 1066666.667743}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001016431, iterations_per_second: 983.834936}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018593250, iterations_per_second: 53.782959}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238696}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005800, iterations_per_second: 172413.792863}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001994000, iterations_per_second: 501.504514}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005853333, iterations_per_second: 170.842825}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026321000, iterations_per_second: 37.992477}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068437000, iterations_per_second: 14.611979}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001250, iterations_per_second: 799999.991106}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001318195, iterations_per_second: 758.613295}
