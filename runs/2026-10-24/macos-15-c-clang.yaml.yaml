    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001265083, iterations_per_second: 790.461761}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018420041, iterations_per_second: 54.288696}
