platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006400, iterations_per_second: 156249.999839}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010300, iterations_per_second: 97087.378779}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001234333, iterations_per_second: 810.153929}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004421667, iterations_per_second: 226.159065}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016907000, iterations_per_second: 59.147099}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.050431000, iterations_per_second: 19.829073}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001037, iterations_per_second: 963855.433362}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001292778, iterations_per_second: 773.528015}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021818708, iterations_per_second: 45.832228}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009500, iterations_per_second: 105263.157783}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000015700, iterations_per_second: 63694.267538}
