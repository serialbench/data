platform:
  platform_string: ubuntu-24.04-rust-1.99.1
  kind: native
  os: linux
  arch: x86_64
  runtime: rust
  runtime_version: 1.99.1
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000000983, iterations_per_second: 1017501.017501}
    - {adapter: quick-xml, format: xml, data_size: small, time_per_iteration: 0.000001408, iterations_per_second: 710176.834032}
    - {adapter: roxmltree, format: xml, data_size: small, time_per_iteration: 0.000002748, iterations_per_second: 363940.750446}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000731492, iterations_per_second: 1367.068327}
    - {adapter: quick-xml, format: xml, data_size: medium, time_per_iteration: 0.000732714, iterations_per_second: 1364.788990}
    - {adapter: roxmltree, format: xml, data_size: medium, time_per_iteration: 0.001742546, iterations_per_second: 573.873052}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.011857188, iterations_per_second: 84.337028}
    - {adapter: quick-xml, format: xml, data_size: large, time_per_iteration: 0.011837880, iterations_per_second: 84.474585}
    - {adapter: roxmltree, format: xml, data_size: large, time_per_iteration: 0.029340843, iterations_per_second: 34.082184}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000004151, iterations_per_second: 240882.593824}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001715001, iterations_per_second: 583.090152}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.028718208, iterations_per_second: 34.821114}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000002860, iterations_per_second: 349638.124541}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002983136, iterations_per_second: 335.217666}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.058900432, iterations_per_second: 16.977804}
