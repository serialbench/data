platform:
  platform_string: ubuntu-24.04-rust-1.99.1
  kind: native
  os: linux
  arch: x86_64
  runtime: rust
  runtime_version: 1.99.1
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001295, iterations_per_second: 771962.328238}
    - {adapter: quick-xml, format: xml, data_size: small, time_per_iteration: 0.000001218, iterations_per_second: 820815.890996}
    - {adapter: roxmltree, format: xml, data_size: small, time_per_iteration: 0.000002831, iterations_per_second: 353194.645569}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000990951, iterations_per_second: 1009.131293}
    - {adapter: quick-xml, format: xml, data_size: medium, time_per_iteration: 0.001076535, iterations_per_second: 928.906167}
    - {adapter: roxmltree, format: xml, data_size: medium, time_per_iteration: 0.002577760, iterations_per_second: 387.933710}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.012722986, iterations_per_second: 78.597901}
    - {adapter: quick-xml, format: xml, data_size: large, time_per_iteration: 0.015145608, iterations_per_second: 66.025742}
    - {adapter: roxmltree, format: xml, data_size: large, time_per_iteration: 0.028012666, iterations_per_second: 35.698137}
  generation:
