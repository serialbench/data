    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003818073, iterations_per_second: 261.912249}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.058385906, iterations_per_second: 17.127421}
