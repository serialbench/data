platform:
  platform_string: ubuntu-24.04-rust-1.99.1
  kind: native
  os: linux
  arch: x86_64
  runtime: rust
  runtime_version: 1.99.1
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000000947, iterations_per_second: 1055520.371543}
    - {adapter: quick-xml, format: xml, data_size: small, time_per_iteration: 0.000001013, iterations_per_second: 987654.320988}
    - {adapter: roxmltree, format: xml, data_size: small, time_per_iteration: 0.000002268, iterations_per_second: 440839.358138}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000713227, iterations_per_second: 1402.078816}
    - {adapter: quick-xml, format: xml, data_size: medium, time_per_iteration: 0.000837137, iterations_per_second: 1194.547607}
    - {adapter: roxmltree, format: xml, data_size: medium, time_per_iteration: 0.002085107, iterations_per_second: 479.591618}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.009756366, iterations_per_second: 102.497180}
    - {adapter: quick-xml, format: xml, data_size: large, time_per_iteration: 0.011651858, iterations_per_second: 85.823222}
    - {adapter: roxmltree, format: xml, data_size: large, time_per_iteration: 0.021162914, iterations_per_second: 47.252472}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001823, iterations_per_second: 548606.539390}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001785292, iterations_per_second: 560.132565}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.023572242, iterations_per_second: 42.422778}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000003231, iterations_per_second: 309511.281686}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003182243, iterations_per_second: 314.243725}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.046431126, iterations_per_second: 21.537277}
