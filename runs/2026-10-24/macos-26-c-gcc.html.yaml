platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.335437}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.385586}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.426032}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000463667, iterations_per_second: 2156.721783}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001512667, iterations_per_second: 661.084178}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001151667, iterations_per_second: 868.306802}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004625000, iterations_per_second: 216.216216}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014939000, iterations_per_second: 66.938885}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011399000, iterations_per_second: 87.726994}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.369746}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005700, iterations_per_second: 175438.596584}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000896333, iterations_per_second: 1115.656378}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001611667, iterations_per_second: 620.475698}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009103000, iterations_per_second: 109.853894}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014565000, iterations_per_second: 68.657741}
