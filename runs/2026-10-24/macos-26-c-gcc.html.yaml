platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.667087}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003300, iterations_per_second: 303030.303012}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005800, iterations_per_second: 172413.793032}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000454000, iterations_per_second: 2202.643172}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001502667, iterations_per_second: 665.483585}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001035000, iterations_per_second: 966.183575}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004254000, iterations_per_second: 235.072873}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016264000, iterations_per_second: 61.485489}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012147000, iterations_per_second: 82.324854}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.856957}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006500, iterations_per_second: 153846.153898}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000881333, iterations_per_second: 1134.644478}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001953000, iterations_per_second: 512.032770}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.013336000, iterations_per_second: 74.985003}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.016482000, iterations_per_second: 60.672249}
  xpath:
  xslt:
