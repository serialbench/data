platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 400000.000100}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000011100, iterations_per_second: 90090.090110}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000811333, iterations_per_second: 1232.539030}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003218667, iterations_per_second: 310.687655}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001643333, iterations_per_second: 608.519270}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008376000, iterations_per_second: 119.388730}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.024191000, iterations_per_second: 41.337688}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019436000, iterations_per_second: 51.450916}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.586402}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009900, iterations_per_second: 101010.101033}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002271333, iterations_per_second: 440.270032}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001528000, iterations_per_second: 654.450262}
