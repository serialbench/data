platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.335437}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.385586}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006400, iterations_per_second: 156249.999839}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000478667, iterations_per_second: 2089.136490}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001555333, iterations_per_second: 642.948993}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001153333, iterations_per_second: 867.052023}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004840000, iterations_per_second: 206.611570}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015195000, iterations_per_second: 65.811122}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010049000, iterations_per_second: 99.512389}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.334175}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005900, iterations_per_second: 169491.525198}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000926333, iterations_per_second: 1079.525009}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001533667, iterations_per_second: 652.032167}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008938000, iterations_per_second: 111.881853}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013791000, iterations_per_second: 72.511058}
