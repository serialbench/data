platform:
  platform_string: ubuntu-24.04-arm-js-24.21.0
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.11', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000002781, iterations_per_second: 359634.611235}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001156047, iterations_per_second: 865.016734}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.011761332, iterations_per_second: 85.024383}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000007962, iterations_per_second: 125598.161243}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001760462, iterations_per_second: 568.032602}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.015565539, iterations_per_second: 64.244483}
