platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007800, iterations_per_second: 128205.128903}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008500, iterations_per_second: 117647.058649}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001885667, iterations_per_second: 530.316422}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007675333, iterations_per_second: 130.287501}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026931000, iterations_per_second: 37.131930}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.092631000, iterations_per_second: 10.795522}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001357, iterations_per_second: 737082.614809}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001619705, iterations_per_second: 617.396251}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.030415755, iterations_per_second: 32.877698}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011000, iterations_per_second: 90909.090951}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000014700, iterations_per_second: 68027.210793}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003416333, iterations_per_second: 292.711484}
