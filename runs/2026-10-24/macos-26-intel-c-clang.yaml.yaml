    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002060377, iterations_per_second: 485.348148}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.037215514, iterations_per_second: 26.870514}
  generation:
