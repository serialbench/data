    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001814398, iterations_per_second: 551.146992}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.034494101, iterations_per_second: 28.990464}
  generation:
