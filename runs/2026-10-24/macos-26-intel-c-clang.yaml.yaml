    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001355, iterations_per_second: 737898.444353}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001570753, iterations_per_second: 636.637333}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029505821, iterations_per_second: 33.891618}
  generation:
