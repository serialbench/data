    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008400, iterations_per_second: 119047.619348}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001878000, iterations_per_second: 532.481363}
