    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384746}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007500, iterations_per_second: 133333.333266}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000435333, iterations_per_second: 2297.090352}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001476667, iterations_per_second: 677.200903}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001052000, iterations_per_second: 950.570342}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004320000, iterations_per_second: 231.481481}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014210000, iterations_per_second: 70.372977}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010232000, iterations_per_second: 97.732604}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370526}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007600, iterations_per_second: 131578.947405}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000832000, iterations_per_second: 1201.923077}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001390667, iterations_per_second: 719.079578}
