platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.001578}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000181000, iterations_per_second: 5524.861879}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000173667, iterations_per_second: 5758.157389}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000615000, iterations_per_second: 1626.016260}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003009000, iterations_per_second: 332.336324}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000700, iterations_per_second: 1428571.432178}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000073667, iterations_per_second: 13574.660633}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001012000, iterations_per_second: 988.142292}
  xpath:
  xslt:
