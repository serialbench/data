    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.006418000, iterations_per_second: 155.811779}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015105792, iterations_per_second: 66.199773}
