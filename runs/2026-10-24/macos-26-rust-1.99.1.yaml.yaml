    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000010417, iterations_per_second: 95999.692801}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001990181, iterations_per_second: 502.466945}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.007194903, iterations_per_second: 138.987287}
