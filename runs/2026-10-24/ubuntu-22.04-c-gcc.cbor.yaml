platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000992, iterations_per_second: 1008572.861470}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000947, iterations_per_second: 1055520.375247}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000585502, iterations_per_second: 1707.937068}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001604180, iterations_per_second: 623.371572}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021050728, iterations_per_second: 47.504295}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034430861, iterations_per_second: 29.043712}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000318, iterations_per_second: 3149606.225401}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000282747, iterations_per_second: 3536.726548}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003566810, iterations_per_second: 280.362565}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001634, iterations_per_second: 611807.894228}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001368, iterations_per_second: 730940.718502}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002357760, iterations_per_second: 424.131379}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002050673, iterations_per_second: 487.644788}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.029036629, iterations_per_second: 34.439259}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040547777, iterations_per_second: 24.662264}
  xpath:
  xslt:
