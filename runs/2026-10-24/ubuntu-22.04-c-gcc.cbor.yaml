platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001482, iterations_per_second: 674854.905693}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001336, iterations_per_second: 748727.163214}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000939268, iterations_per_second: 1064.658484}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002019908, iterations_per_second: 495.071971}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.029547886, iterations_per_second: 33.843369}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.041949824, iterations_per_second: 23.838002}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000399, iterations_per_second: 2507522.565742}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000380938, iterations_per_second: 2625.101395}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004710414, iterations_per_second: 212.295565}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002382, iterations_per_second: 419903.421860}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001835, iterations_per_second: 544840.361199}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003286918, iterations_per_second: 304.236401}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002559901, iterations_per_second: 390.640107}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.039620455, iterations_per_second: 25.239488}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.050089449, iterations_per_second: 19.964284}
  xpath:
  xslt:
