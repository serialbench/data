platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000708, iterations_per_second: 1412429.392076}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000658, iterations_per_second: 1519756.841167}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000371678, iterations_per_second: 2690.500917}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001085397, iterations_per_second: 921.322159}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.009666227, iterations_per_second: 103.452981}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018756293, iterations_per_second: 53.315439}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000243, iterations_per_second: 4108463.514515}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000225897, iterations_per_second: 4426.796283}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.002590266, iterations_per_second: 386.060737}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001105, iterations_per_second: 905305.083373}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000972, iterations_per_second: 1028383.375889}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001208423, iterations_per_second: 827.524571}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001417235, iterations_per_second: 705.599283}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014847630, iterations_per_second: 67.350816}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023804458, iterations_per_second: 42.008938}
  xpath:
  xslt:
