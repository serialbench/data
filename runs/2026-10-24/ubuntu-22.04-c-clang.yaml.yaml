platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006118, iterations_per_second: 163460.123848}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005927, iterations_per_second: 168713.726423}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001842096, iterations_per_second: 542.859971}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004327771, iterations_per_second: 231.065813}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025722030, iterations_per_second: 38.877180}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.053988257, iterations_per_second: 18.522546}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001152, iterations_per_second: 867754.251892}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001276697, iterations_per_second: 783.271002}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.040151469, iterations_per_second: 24.905689}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008885, iterations_per_second: 112554.307403}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009216, iterations_per_second: 108512.831637}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002982511, iterations_per_second: 335.287988}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006460594, iterations_per_second: 154.784529}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.050352469, iterations_per_second: 19.859999}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.083095455, iterations_per_second: 12.034353}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001530, iterations_per_second: 653552.054609}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001596913, iterations_per_second: 626.208060}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.045823547, iterations_per_second: 21.822841}
  xpath:
  xslt:
