platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004490, iterations_per_second: 222697.308164}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004749, iterations_per_second: 210575.081317}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001812873, iterations_per_second: 551.610722}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004530126, iterations_per_second: 220.744412}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024469599, iterations_per_second: 40.867037}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056076000, iterations_per_second: 17.832941}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001369, iterations_per_second: 730193.513032}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001802249, iterations_per_second: 554.862183}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.045120898, iterations_per_second: 22.162679}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006362, iterations_per_second: 157185.746953}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007196, iterations_per_second: 138975.748164}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002910789, iterations_per_second: 343.549503}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006730640, iterations_per_second: 148.574274}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.047351188, iterations_per_second: 21.118794}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085302702, iterations_per_second: 11.722958}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001745, iterations_per_second: 572967.396351}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002274993, iterations_per_second: 439.561728}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.049377687, iterations_per_second: 20.252062}
  xpath:
  xslt:
