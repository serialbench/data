platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002275, iterations_per_second: 439483.168074}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000002310, iterations_per_second: 432806.752378}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000886450, iterations_per_second: 1128.095211}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002125550, iterations_per_second: 470.466394}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.012460969, iterations_per_second: 80.250581}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.026370909, iterations_per_second: 37.920574}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000730, iterations_per_second: 1369675.390242}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000646801, iterations_per_second: 1546.069788}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018164091, iterations_per_second: 55.053677}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003448, iterations_per_second: 290006.379750}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003708, iterations_per_second: 269716.258406}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001576113, iterations_per_second: 634.472409}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003110272, iterations_per_second: 321.515254}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023864669, iterations_per_second: 41.902949}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.040076489, iterations_per_second: 24.952286}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000892, iterations_per_second: 1120699.316904}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000865916, iterations_per_second: 1154.846873}
