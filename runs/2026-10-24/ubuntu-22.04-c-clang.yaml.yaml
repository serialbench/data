platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004261, iterations_per_second: 234681.185778}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004737, iterations_per_second: 211108.530829}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001707643, iterations_per_second: 585.602380}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004553159, iterations_per_second: 219.627719}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024478784, iterations_per_second: 40.851702}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056165853, iterations_per_second: 17.804412}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001360, iterations_per_second: 735023.888689}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001736135, iterations_per_second: 575.991964}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.045131604, iterations_per_second: 22.157422}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006511, iterations_per_second: 153579.162501}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007263, iterations_per_second: 137691.735706}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003041137, iterations_per_second: 328.824384}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006764952, iterations_per_second: 147.820702}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.049570439, iterations_per_second: 20.173313}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085662226, iterations_per_second: 11.673757}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001706, iterations_per_second: 586097.761672}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002247573, iterations_per_second: 444.924304}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.050976448, iterations_per_second: 19.616902}
  xpath:
  xslt:
