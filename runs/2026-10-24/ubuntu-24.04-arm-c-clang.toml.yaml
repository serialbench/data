platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000565, iterations_per_second: 1770538.239686}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002039, iterations_per_second: 490436.489084}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000059263, iterations_per_second: 16873.934836}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000193441, iterations_per_second: 5169.525989}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001049728, iterations_per_second: 952.627728}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002331961, iterations_per_second: 428.823638}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000748, iterations_per_second: 1337077.153683}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000089461, iterations_per_second: 11178.055242}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001405194, iterations_per_second: 711.645509}
  xpath:
  xslt:
