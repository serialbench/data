platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000532, iterations_per_second: 1879699.253268}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002013, iterations_per_second: 496845.034056}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000060922, iterations_per_second: 16414.431569}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000195885, iterations_per_second: 5105.036118}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001076572, iterations_per_second: 928.874242}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002355596, iterations_per_second: 424.521013}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000729, iterations_per_second: 1370801.921195}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000090008, iterations_per_second: 11110.123544}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001415489, iterations_per_second: 706.469637}
  xpath:
  xslt:
