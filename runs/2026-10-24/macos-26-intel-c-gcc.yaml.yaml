    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001630, iterations_per_second: 613384.042062}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002060380, iterations_per_second: 485.347285}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.036442659, iterations_per_second: 27.440369}
  generation:
