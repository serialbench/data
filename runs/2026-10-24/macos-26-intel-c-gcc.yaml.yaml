    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008700, iterations_per_second: 114942.528876}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002280000, iterations_per_second: 438.596491}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.009773667, iterations_per_second: 102.315746}
