    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009200, iterations_per_second: 108695.652180}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002030333, iterations_per_second: 492.529962}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008665333, iterations_per_second: 115.402370}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.027617000, iterations_per_second: 36.209581}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.106268000, iterations_per_second: 9.410171}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001510, iterations_per_second: 662032.440090}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001716334, iterations_per_second: 582.637179}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029823634, iterations_per_second: 33.530454}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011800, iterations_per_second: 84745.762681}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000017600, iterations_per_second: 56818.181815}
