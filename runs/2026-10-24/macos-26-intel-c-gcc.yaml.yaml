platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007700, iterations_per_second: 129870.129815}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008500, iterations_per_second: 117647.058806}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002633667, iterations_per_second: 379.698772}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.009528333, iterations_per_second: 104.950149}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.034419000, iterations_per_second: 29.053720}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.096092000, iterations_per_second: 10.406694}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001371, iterations_per_second: 729607.470953}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002450623, iterations_per_second: 408.059446}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029334051, iterations_per_second: 34.090075}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011300, iterations_per_second: 88495.575178}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000020400, iterations_per_second: 49019.607830}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.004432667, iterations_per_second: 225.597834}
