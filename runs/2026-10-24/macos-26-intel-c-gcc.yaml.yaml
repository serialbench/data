    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009900, iterations_per_second: 101010.102077}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002349333, iterations_per_second: 425.652667}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.009157000, iterations_per_second: 109.206072}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031765000, iterations_per_second: 31.481190}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.115021000, iterations_per_second: 8.694065}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001672, iterations_per_second: 598014.638382}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002155857, iterations_per_second: 463.852658}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.040696048, iterations_per_second: 24.572411}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000012500, iterations_per_second: 79999.999693}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000016500, iterations_per_second: 60606.060801}
