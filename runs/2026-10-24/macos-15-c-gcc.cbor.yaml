platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 624999.999358}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.716089}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000639333, iterations_per_second: 1564.129301}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001932333, iterations_per_second: 517.509056}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011557000, iterations_per_second: 86.527646}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.025571000, iterations_per_second: 39.106801}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000368333, iterations_per_second: 2714.932127}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004395000, iterations_per_second: 227.531286}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.001578}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 624999.999358}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001884333, iterations_per_second: 530.691668}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002156333, iterations_per_second: 463.750193}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.020667000, iterations_per_second: 48.386316}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.028516000, iterations_per_second: 35.068032}
  xpath:
  xslt:
