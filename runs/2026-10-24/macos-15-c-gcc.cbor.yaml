    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.335437}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001395000, iterations_per_second: 716.845878}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002195333, iterations_per_second: 455.511691}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007541000, iterations_per_second: 132.608407}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.020740000, iterations_per_second: 48.216008}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000334333, iterations_per_second: 2991.026919}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004113000, iterations_per_second: 243.131534}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 624999.999358}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.665823}
