platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000551, iterations_per_second: 1814552.718199}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002063, iterations_per_second: 484730.974438}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000075235, iterations_per_second: 13291.627162}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000202596, iterations_per_second: 4935.939729}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001486446, iterations_per_second: 672.745596}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002389960, iterations_per_second: 418.417045}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000836, iterations_per_second: 1196744.850636}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000118193, iterations_per_second: 8460.714084}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001909805, iterations_per_second: 523.613667}
  xpath:
  xslt:
