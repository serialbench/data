platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000542, iterations_per_second: 1845018.457165}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002008, iterations_per_second: 498057.575314}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000075926, iterations_per_second: 13170.776681}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000213237, iterations_per_second: 4689.624986}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001473263, iterations_per_second: 678.765434}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002428925, iterations_per_second: 411.704767}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000804, iterations_per_second: 1244555.070390}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000121465, iterations_per_second: 8232.846864}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001888853, iterations_per_second: 529.421824}
  xpath:
  xslt:
