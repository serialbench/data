platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312499.983025}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000010900, iterations_per_second: 91743.118828}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009800, iterations_per_second: 102040.815874}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001228000, iterations_per_second: 814.332248}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005348000, iterations_per_second: 186.985789}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003225333, iterations_per_second: 310.045473}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.013207000, iterations_per_second: 75.717423}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.046135000, iterations_per_second: 21.675518}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.029543000, iterations_per_second: 33.848966}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000007100, iterations_per_second: 140845.069651}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000016400, iterations_per_second: 60975.609403}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002558000, iterations_per_second: 390.930414}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.004636667, iterations_per_second: 215.672178}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.026087000, iterations_per_second: 38.333269}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.048643000, iterations_per_second: 20.557943}
  xpath:
