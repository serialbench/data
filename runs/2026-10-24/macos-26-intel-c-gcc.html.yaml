    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007900, iterations_per_second: 126582.278436}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007700, iterations_per_second: 129870.129815}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001182333, iterations_per_second: 845.785171}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005403667, iterations_per_second: 185.059527}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002439333, iterations_per_second: 409.948073}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010921000, iterations_per_second: 91.566706}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.053807000, iterations_per_second: 18.584942}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.035925000, iterations_per_second: 27.835769}
  generation:
