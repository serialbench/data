    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010840000, iterations_per_second: 92.250923}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.042764000, iterations_per_second: 23.384155}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.025436000, iterations_per_second: 39.314358}
