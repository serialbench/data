    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000010600, iterations_per_second: 94339.622273}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009200, iterations_per_second: 108695.652448}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001056333, iterations_per_second: 946.670874}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004373333, iterations_per_second: 228.658537}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002500333, iterations_per_second: 399.946674}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010014000, iterations_per_second: 99.860196}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.043668000, iterations_per_second: 22.900064}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.028195000, iterations_per_second: 35.467281}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005900, iterations_per_second: 169491.525525}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009700, iterations_per_second: 103092.783403}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002114000, iterations_per_second: 473.036897}
