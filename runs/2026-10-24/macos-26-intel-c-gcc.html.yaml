    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007900, iterations_per_second: 126582.278436}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001099000, iterations_per_second: 909.918107}
