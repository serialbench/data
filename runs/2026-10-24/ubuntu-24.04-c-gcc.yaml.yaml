platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004791, iterations_per_second: 208742.119897}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003356, iterations_per_second: 297991.537181}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001288779, iterations_per_second: 775.928424}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003065785, iterations_per_second: 326.180733}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016530258, iterations_per_second: 60.495124}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.037582148, iterations_per_second: 26.608378}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000971, iterations_per_second: 1029548.022688}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000941427, iterations_per_second: 1062.217627}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018784567, iterations_per_second: 53.235190}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005784, iterations_per_second: 172881.766053}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004994, iterations_per_second: 200228.260129}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002055678, iterations_per_second: 486.457509}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004325950, iterations_per_second: 231.163097}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.028348978, iterations_per_second: 35.274640}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.054555629, iterations_per_second: 18.329914}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001206, iterations_per_second: 829256.155310}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001191450, iterations_per_second: 839.313207}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021921081, iterations_per_second: 45.618188}
  xpath:
  xslt:
