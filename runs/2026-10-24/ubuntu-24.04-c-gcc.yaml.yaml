platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003172, iterations_per_second: 315278.391360}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003026, iterations_per_second: 330414.670805}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001332020, iterations_per_second: 750.739291}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002884702, iterations_per_second: 346.656218}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016869165, iterations_per_second: 59.279757}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.035109930, iterations_per_second: 28.481971}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001187, iterations_per_second: 842672.961810}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000957955, iterations_per_second: 1043.890007}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.015498437, iterations_per_second: 64.522635}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004799, iterations_per_second: 208368.061502}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004612, iterations_per_second: 216825.671991}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002137734, iterations_per_second: 467.785047}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004033544, iterations_per_second: 247.920915}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.030074177, iterations_per_second: 33.251118}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.050901186, iterations_per_second: 19.645908}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001467, iterations_per_second: 681570.337118}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001239071, iterations_per_second: 807.056254}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018851202, iterations_per_second: 53.047015}
  xpath:
  xslt:
