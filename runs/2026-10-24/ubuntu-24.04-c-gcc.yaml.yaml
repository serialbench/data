platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004320, iterations_per_second: 231476.123178}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004664, iterations_per_second: 214422.025444}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001765531, iterations_per_second: 566.401836}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004509682, iterations_per_second: 221.745142}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023756003, iterations_per_second: 42.094623}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055115668, iterations_per_second: 18.143661}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001490, iterations_per_second: 671231.038209}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001369631, iterations_per_second: 730.123839}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020841281, iterations_per_second: 47.981696}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009718, iterations_per_second: 102899.713949}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006778, iterations_per_second: 147542.676723}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002906409, iterations_per_second: 344.067198}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006176584, iterations_per_second: 161.901789}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.041749007, iterations_per_second: 23.952666}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078372553, iterations_per_second: 12.759569}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001853, iterations_per_second: 539811.066082}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001722103, iterations_per_second: 580.685472}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.025390741, iterations_per_second: 39.384435}
  xpath:
  xslt:
