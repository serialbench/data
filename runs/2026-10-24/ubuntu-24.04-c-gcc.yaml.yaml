platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003324, iterations_per_second: 300851.409453}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003011, iterations_per_second: 332071.461805}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001323027, iterations_per_second: 755.842664}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002874921, iterations_per_second: 347.835645}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016969333, iterations_per_second: 58.929835}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.034914896, iterations_per_second: 28.641071}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001448, iterations_per_second: 690560.044492}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000966057, iterations_per_second: 1035.135251}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.016054716, iterations_per_second: 62.286994}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004682, iterations_per_second: 213588.500373}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004805, iterations_per_second: 208112.214012}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002134453, iterations_per_second: 468.504182}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004026679, iterations_per_second: 248.343610}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.030331740, iterations_per_second: 32.968765}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.052318098, iterations_per_second: 19.113845}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001495, iterations_per_second: 668806.847911}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001195980, iterations_per_second: 836.134617}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018861803, iterations_per_second: 53.017201}
  xpath:
  xslt:
