    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.007785000, iterations_per_second: 128.452152}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.073408000, iterations_per_second: 13.622493}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000024375, iterations_per_second: 41025.641026}
