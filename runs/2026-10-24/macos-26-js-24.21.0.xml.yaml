    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.036224486, iterations_per_second: 27.605637}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.035438084, iterations_per_second: 28.218230}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.502272583, iterations_per_second: 1.990951}
  generation:
