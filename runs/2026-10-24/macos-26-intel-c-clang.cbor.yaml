    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.334175}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000888667, iterations_per_second: 1125.281320}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003305333, iterations_per_second: 302.541347}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010985000, iterations_per_second: 91.033227}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.047671000, iterations_per_second: 20.977114}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000458000, iterations_per_second: 2183.406113}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005768000, iterations_per_second: 173.370319}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.332912}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
