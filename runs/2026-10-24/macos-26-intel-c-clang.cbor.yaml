    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.331649}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000774333, iterations_per_second: 1291.433491}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003428667, iterations_per_second: 291.658565}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011073000, iterations_per_second: 90.309762}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.044677000, iterations_per_second: 22.382882}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000500, iterations_per_second: 1999999.868625}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000897333, iterations_per_second: 1114.413076}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.008813000, iterations_per_second: 113.468739}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.336701}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
