platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001578, iterations_per_second: 633713.562111}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004746, iterations_per_second: 210708.190223}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005789, iterations_per_second: 172747.374196}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000498205, iterations_per_second: 2007.207212}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002313831, iterations_per_second: 432.183619}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001432705, iterations_per_second: 697.980556}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004995913, iterations_per_second: 200.163614}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.023046690, iterations_per_second: 43.390179}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014234287, iterations_per_second: 70.252904}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003094, iterations_per_second: 323227.099266}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007310, iterations_per_second: 136804.519999}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001058205, iterations_per_second: 944.996182}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001843392, iterations_per_second: 542.478214}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.011032208, iterations_per_second: 90.643686}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018815221, iterations_per_second: 53.148459}
  xpath:
  xslt:
