platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001556, iterations_per_second: 642714.826645}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004529, iterations_per_second: 220774.920075}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005768, iterations_per_second: 173376.330692}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000491814, iterations_per_second: 2033.287630}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002211874, iterations_per_second: 452.105319}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001430416, iterations_per_second: 699.097488}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004837937, iterations_per_second: 206.699674}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.021819444, iterations_per_second: 45.830682}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014212761, iterations_per_second: 70.359306}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003027, iterations_per_second: 330392.837087}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007272, iterations_per_second: 137521.315794}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001024973, iterations_per_second: 975.635773}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001866977, iterations_per_second: 535.625238}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010294108, iterations_per_second: 97.142948}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018659999, iterations_per_second: 53.590571}
  xpath:
  xslt:
