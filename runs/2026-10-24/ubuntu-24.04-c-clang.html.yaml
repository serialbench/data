platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001574, iterations_per_second: 635324.014879}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004686, iterations_per_second: 213406.176067}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005797, iterations_per_second: 172505.994551}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000509234, iterations_per_second: 1963.735050}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002279412, iterations_per_second: 438.709632}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001416865, iterations_per_second: 705.783377}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004988999, iterations_per_second: 200.441010}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.022551789, iterations_per_second: 44.342380}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014170543, iterations_per_second: 70.568926}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003114, iterations_per_second: 321140.691583}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000012495, iterations_per_second: 80028.810378}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001073862, iterations_per_second: 931.218639}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001860278, iterations_per_second: 537.554065}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.011226651, iterations_per_second: 89.073759}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018736614, iterations_per_second: 53.371436}
  xpath:
  xslt:
