platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000966, iterations_per_second: 1034768.211514}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000908, iterations_per_second: 1100957.835667}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000597000, iterations_per_second: 1675.041876}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001640846, iterations_per_second: 609.441839}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012105455, iterations_per_second: 82.607387}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034881330, iterations_per_second: 28.668632}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000319, iterations_per_second: 3130870.394551}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000282660, iterations_per_second: 3537.819288}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003519037, iterations_per_second: 284.168652}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001576, iterations_per_second: 634397.005916}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001326, iterations_per_second: 754147.812806}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002158248, iterations_per_second: 463.338711}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002082166, iterations_per_second: 480.269104}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.020365021, iterations_per_second: 49.103804}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040305256, iterations_per_second: 24.810660}
  xpath:
  xslt:
