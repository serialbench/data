platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001304, iterations_per_second: 766636.002106}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001209, iterations_per_second: 826924.666522}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000800843, iterations_per_second: 1248.684719}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002013471, iterations_per_second: 496.654699}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014053409, iterations_per_second: 71.157112}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.036528150, iterations_per_second: 27.376147}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000397, iterations_per_second: 2520796.573096}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000385326, iterations_per_second: 2595.202854}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004742959, iterations_per_second: 210.838846}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002237, iterations_per_second: 446987.305771}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001745, iterations_per_second: 573000.228915}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002704007, iterations_per_second: 369.821573}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002550839, iterations_per_second: 392.027827}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.025200094, iterations_per_second: 39.682392}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.044470943, iterations_per_second: 22.486593}
  xpath:
  xslt:
