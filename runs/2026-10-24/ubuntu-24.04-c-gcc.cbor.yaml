platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000899, iterations_per_second: 1112718.370848}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000990, iterations_per_second: 1010101.014971}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000574205, iterations_per_second: 1741.538301}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001510637, iterations_per_second: 661.972254}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010036038, iterations_per_second: 99.640914}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.028925333, iterations_per_second: 34.571771}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000269, iterations_per_second: 3717472.155054}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000248873, iterations_per_second: 4018.113656}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.002826346, iterations_per_second: 353.813723}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001601, iterations_per_second: 624648.633779}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001386, iterations_per_second: 721396.623709}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001863350, iterations_per_second: 536.667733}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001923686, iterations_per_second: 519.835268}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.018255050, iterations_per_second: 54.779362}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032769714, iterations_per_second: 30.515982}
  xpath:
  xslt:
