platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000987, iterations_per_second: 1012658.228948}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000878, iterations_per_second: 1138563.133533}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000630443, iterations_per_second: 1586.185383}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001607918, iterations_per_second: 621.922262}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011139679, iterations_per_second: 89.769194}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031536439, iterations_per_second: 31.709351}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000318, iterations_per_second: 3140703.538077}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000285495, iterations_per_second: 3502.684224}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003535279, iterations_per_second: 282.863106}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001658, iterations_per_second: 602990.833218}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001303, iterations_per_second: 767459.708897}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002220438, iterations_per_second: 450.361663}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002056715, iterations_per_second: 486.212158}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.019566974, iterations_per_second: 51.106523}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.037763901, iterations_per_second: 26.480315}
  xpath:
  xslt:
