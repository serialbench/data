platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.555204}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.586064}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000042000, iterations_per_second: 23809.523811}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000208000, iterations_per_second: 4807.692308}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000562000, iterations_per_second: 1779.359431}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002218000, iterations_per_second: 450.856628}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.909037}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000077667, iterations_per_second: 12875.536480}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000962000, iterations_per_second: 1039.501039}
  xpath:
  xslt:
