platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.909037}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000612333, iterations_per_second: 1633.097441}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001429333, iterations_per_second: 699.626866}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.009770000, iterations_per_second: 102.354145}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.027717000, iterations_per_second: 36.078941}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2499999.988548}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000400000, iterations_per_second: 2500.000000}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.006708000, iterations_per_second: 149.075730}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.000468}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.000468}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001268333, iterations_per_second: 788.436268}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001965333, iterations_per_second: 508.819539}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.016815000, iterations_per_second: 59.470711}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.028556000, iterations_per_second: 35.018910}
