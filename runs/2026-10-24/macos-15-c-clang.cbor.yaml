platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.001578}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.319647}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000640667, iterations_per_second: 1560.874089}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001435333, iterations_per_second: 696.702276}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.008302000, iterations_per_second: 120.452903}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.020616000, iterations_per_second: 48.506015}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000326333, iterations_per_second: 3064.351379}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004080000, iterations_per_second: 245.098039}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.001578}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 500000.001262}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001208667, iterations_per_second: 827.357970}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001798667, iterations_per_second: 555.967383}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015606000, iterations_per_second: 64.077919}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.024143000, iterations_per_second: 41.419873}
  xpath:
  xslt:
