platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001385, iterations_per_second: 722178.089582}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003163, iterations_per_second: 316145.553283}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004965, iterations_per_second: 201397.699961}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000481352, iterations_per_second: 2077.480321}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001652858, iterations_per_second: 605.012529}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001336720, iterations_per_second: 748.099826}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004585662, iterations_per_second: 218.071022}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015926286, iterations_per_second: 62.789278}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013539182, iterations_per_second: 73.859706}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002458, iterations_per_second: 406785.177247}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006224, iterations_per_second: 160678.706808}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000862135, iterations_per_second: 1159.910702}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001765369, iterations_per_second: 566.453812}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008547792, iterations_per_second: 116.989276}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017664366, iterations_per_second: 56.611146}
  xpath:
  xslt:
