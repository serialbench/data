platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001375, iterations_per_second: 727219.837946}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003157, iterations_per_second: 316796.553355}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004958, iterations_per_second: 201690.163633}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000473689, iterations_per_second: 2111.091251}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001660446, iterations_per_second: 602.247709}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001337730, iterations_per_second: 747.535190}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004624529, iterations_per_second: 216.238237}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015947820, iterations_per_second: 62.704495}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013473641, iterations_per_second: 74.218988}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002491, iterations_per_second: 401429.087600}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006288, iterations_per_second: 159043.196093}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000846186, iterations_per_second: 1181.772809}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001763635, iterations_per_second: 567.010855}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008548564, iterations_per_second: 116.978711}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017766398, iterations_per_second: 56.286029}
  xpath:
  xslt:
