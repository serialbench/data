platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001353, iterations_per_second: 739262.216690}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003101, iterations_per_second: 322518.222276}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004985, iterations_per_second: 200593.757565}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000484169, iterations_per_second: 2065.395943}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001641453, iterations_per_second: 609.216470}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001348145, iterations_per_second: 741.759790}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004622972, iterations_per_second: 216.311066}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015986814, iterations_per_second: 62.551550}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013474390, iterations_per_second: 74.214862}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002379, iterations_per_second: 420344.682636}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006258, iterations_per_second: 159795.461759}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000866771, iterations_per_second: 1153.706822}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001785208, iterations_per_second: 560.158816}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008561719, iterations_per_second: 116.798975}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017730588, iterations_per_second: 56.399709}
