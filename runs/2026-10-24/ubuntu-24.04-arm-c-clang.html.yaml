platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001361, iterations_per_second: 734915.852154}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003106, iterations_per_second: 321936.771861}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005008, iterations_per_second: 199660.577027}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000481733, iterations_per_second: 2075.838691}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001632159, iterations_per_second: 612.685531}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001344779, iterations_per_second: 743.616425}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004667122, iterations_per_second: 214.264808}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016007885, iterations_per_second: 62.469214}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013355871, iterations_per_second: 74.873440}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002388, iterations_per_second: 418778.005335}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006205, iterations_per_second: 161155.160178}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000880258, iterations_per_second: 1136.030573}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001762423, iterations_per_second: 567.400675}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008604426, iterations_per_second: 116.219257}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017561334, iterations_per_second: 56.943282}
  xpath:
  xslt:
