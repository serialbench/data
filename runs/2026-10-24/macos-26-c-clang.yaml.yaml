platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008000, iterations_per_second: 125000.000049}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000012100, iterations_per_second: 82644.628114}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001173667, iterations_per_second: 852.030673}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005967667, iterations_per_second: 167.569681}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016259000, iterations_per_second: 61.504398}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.073366000, iterations_per_second: 13.630292}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002542, iterations_per_second: 393437.463723}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002181833, iterations_per_second: 458.330150}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013845208, iterations_per_second: 72.227156}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000024400, iterations_per_second: 40983.606565}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000011600, iterations_per_second: 86206.896558}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002240333, iterations_per_second: 446.362148}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008282333, iterations_per_second: 120.738922}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.047321000, iterations_per_second: 21.132267}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.121935000, iterations_per_second: 8.201091}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000003504, iterations_per_second: 285371.839215}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002716125, iterations_per_second: 368.171568}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.024813958, iterations_per_second: 40.299899}
  xpath:
  xslt:
