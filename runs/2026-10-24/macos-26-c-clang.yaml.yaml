platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005200, iterations_per_second: 192307.692373}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006500, iterations_per_second: 153846.153831}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001154000, iterations_per_second: 866.551127}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003818667, iterations_per_second: 261.871508}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.018455000, iterations_per_second: 54.185857}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078295000, iterations_per_second: 12.772208}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.911386}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000852931, iterations_per_second: 1172.428240}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013241167, iterations_per_second: 75.522044}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006500, iterations_per_second: 153846.153831}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008000, iterations_per_second: 124999.999960}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001933333, iterations_per_second: 517.241379}
