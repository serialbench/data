    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.044780000, iterations_per_second: 22.331398}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.083252000, iterations_per_second: 12.011723}
