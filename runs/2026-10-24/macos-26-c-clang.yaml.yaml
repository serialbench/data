platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005500, iterations_per_second: 181818.181713}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009600, iterations_per_second: 104166.666683}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001389000, iterations_per_second: 719.942405}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008754333, iterations_per_second: 114.229144}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025086000, iterations_per_second: 39.862872}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.081526000, iterations_per_second: 12.266026}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000908, iterations_per_second: 1100836.636033}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000903583, iterations_per_second: 1106.704786}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.014749250, iterations_per_second: 67.800058}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000014200, iterations_per_second: 70422.535192}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010700, iterations_per_second: 93457.943913}
