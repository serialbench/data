platform:
  platform_string: ubuntu-24.04-arm-rust-1.99.1
  kind: native
  os: linux
  arch: arm64
  runtime: rust
  runtime_version: 1.99.1
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002770, iterations_per_second: 360984.766443}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000007454, iterations_per_second: 134159.757439}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001666029, iterations_per_second: 600.229528}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.007972551, iterations_per_second: 125.430362}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021746478, iterations_per_second: 45.984458}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.102677046, iterations_per_second: 9.739275}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004396, iterations_per_second: 227458.829952}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000008611, iterations_per_second: 116126.484967}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002676656, iterations_per_second: 373.600493}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.009049745, iterations_per_second: 110.500347}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040274028, iterations_per_second: 24.829898}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.121143881, iterations_per_second: 8.254647}
  xpath:
