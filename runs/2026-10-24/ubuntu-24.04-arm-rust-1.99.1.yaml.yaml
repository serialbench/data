    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000008665, iterations_per_second: 115405.477144}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002668055, iterations_per_second: 374.804867}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.009001381, iterations_per_second: 111.094060}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040082725, iterations_per_second: 24.948404}
