platform:
  platform_string: ubuntu-24.04-arm-rust-1.99.1
  kind: native
  os: linux
  arch: arm64
  runtime: rust
  runtime_version: 1.99.1
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002774, iterations_per_second: 360542.255552}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000007471, iterations_per_second: 133858.056916}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001628137, iterations_per_second: 614.198802}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.007935030, iterations_per_second: 126.023463}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021641357, iterations_per_second: 46.207823}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.103924478, iterations_per_second: 9.622372}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011120, iterations_per_second: 89931.292493}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000008632, iterations_per_second: 115854.718183}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002683488, iterations_per_second: 372.649328}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.009064273, iterations_per_second: 110.323240}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040452753, iterations_per_second: 24.720196}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.121940795, iterations_per_second: 8.200701}
  xpath:
