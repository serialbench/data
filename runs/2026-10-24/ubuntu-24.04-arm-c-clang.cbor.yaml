    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001147, iterations_per_second: 871763.576057}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000713467, iterations_per_second: 1401.605867}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001761097, iterations_per_second: 567.828001}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014266577, iterations_per_second: 70.093898}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.028820731, iterations_per_second: 34.697246}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000404, iterations_per_second: 2475247.528912}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000380066, iterations_per_second: 2631.124271}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004992443, iterations_per_second: 200.302738}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001817, iterations_per_second: 550448.615396}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000004162, iterations_per_second: 240257.556113}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001925103, iterations_per_second: 519.452725}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002030699, iterations_per_second: 492.441192}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023090547, iterations_per_second: 43.307766}
