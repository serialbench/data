platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001027, iterations_per_second: 973615.031874}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001162, iterations_per_second: 860955.660387}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000708303, iterations_per_second: 1411.824501}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001784329, iterations_per_second: 560.434763}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014386692, iterations_per_second: 69.508682}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.029256036, iterations_per_second: 34.180981}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000418, iterations_per_second: 2390057.374685}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000384992, iterations_per_second: 2597.454322}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005005567, iterations_per_second: 199.777568}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001786, iterations_per_second: 560067.207749}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001447, iterations_per_second: 691037.244868}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001858439, iterations_per_second: 538.085996}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002043358, iterations_per_second: 489.390423}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023011832, iterations_per_second: 43.455906}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033035781, iterations_per_second: 30.270209}
