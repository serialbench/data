platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001016, iterations_per_second: 984348.853373}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001137, iterations_per_second: 879739.598253}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000723333, iterations_per_second: 1382.488479}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001787680, iterations_per_second: 559.384334}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014894459, iterations_per_second: 67.139062}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031195987, iterations_per_second: 32.055405}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000403, iterations_per_second: 2480158.734742}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000389575, iterations_per_second: 2566.897630}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005068348, iterations_per_second: 197.302948}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001725, iterations_per_second: 579844.601689}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001435, iterations_per_second: 696815.554092}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001890539, iterations_per_second: 528.949587}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002045142, iterations_per_second: 488.963682}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023735831, iterations_per_second: 42.130398}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034481221, iterations_per_second: 29.001293}
  xpath:
  xslt:
