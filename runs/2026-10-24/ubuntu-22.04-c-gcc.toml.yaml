platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000613, iterations_per_second: 1630789.299367}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003548, iterations_per_second: 281880.708135}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000082181, iterations_per_second: 12168.262737}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000408503, iterations_per_second: 2447.962438}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001712642, iterations_per_second: 583.893190}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004753466, iterations_per_second: 210.372810}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000789, iterations_per_second: 1268230.817645}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000129994, iterations_per_second: 7692.662738}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002105078, iterations_per_second: 475.041780}
  xpath:
  xslt:
