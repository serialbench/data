platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000455, iterations_per_second: 2199252.252693}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003038, iterations_per_second: 329207.269688}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000061362, iterations_per_second: 16296.730867}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000340758, iterations_per_second: 2934.636834}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001399059, iterations_per_second: 714.766139}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004074982, iterations_per_second: 245.399857}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000579, iterations_per_second: 1727414.044377}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000096645, iterations_per_second: 10347.146772}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001738107, iterations_per_second: 575.338572}
  xpath:
  xslt:
