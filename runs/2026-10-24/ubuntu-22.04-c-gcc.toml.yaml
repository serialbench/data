platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000577, iterations_per_second: 1733703.140537}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003912, iterations_per_second: 255636.791873}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000079346, iterations_per_second: 12603.029773}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000446692, iterations_per_second: 2238.677330}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001832959, iterations_per_second: 545.565940}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005236080, iterations_per_second: 190.982567}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000789, iterations_per_second: 1267105.932452}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000126607, iterations_per_second: 7898.436636}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002266701, iterations_per_second: 441.169788}
  xpath:
  xslt:
