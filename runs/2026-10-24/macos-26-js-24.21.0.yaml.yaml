platform:
  platform_string: macos-26-js-24.21.0
  kind: wasm
  os: macos
  arch: arm64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.11', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000320221, iterations_per_second: 3122.845237}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.064597889, iterations_per_second: 15.480382}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 0.954377958, iterations_per_second: 1.047803}
  generation:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000709425, iterations_per_second: 1409.592275}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.085723903, iterations_per_second: 11.665358}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.406603875, iterations_per_second: 0.710932}
