    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000360, iterations_per_second: 2777777.767247}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000356567, iterations_per_second: 2804.524633}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004457700, iterations_per_second: 224.330933}
  generation:
