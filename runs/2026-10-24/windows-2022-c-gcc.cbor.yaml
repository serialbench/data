    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000290, iterations_per_second: 3448275.897811}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000276900, iterations_per_second: 3611.412062}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003450900, iterations_per_second: 289.779478}
