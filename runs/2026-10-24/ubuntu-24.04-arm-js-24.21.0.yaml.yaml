    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000014229, iterations_per_second: 70277.361319}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.107308299, iterations_per_second: 9.318944}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.000010064, iterations_per_second: 99364.069952}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.338867297, iterations_per_second: 0.746900}
  generation:
