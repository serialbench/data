    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000064355, iterations_per_second: 15538.888659}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.138700944, iterations_per_second: 7.209756}
