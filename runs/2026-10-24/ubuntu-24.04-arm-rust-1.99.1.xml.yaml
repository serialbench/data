platform:
  platform_string: ubuntu-24.04-arm-rust-1.99.1
  kind: native
  os: linux
  arch: arm64
  runtime: rust
  runtime_version: 1.99.1
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001091, iterations_per_second: 916422.287390}
    - {adapter: quick-xml, format: xml, data_size: small, time_per_iteration: 0.000000959, iterations_per_second: 1042535.446205}
    - {adapter: roxmltree, format: xml, data_size: small, time_per_iteration: 0.000002378, iterations_per_second: 420574.504774}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000874451, iterations_per_second: 1143.575090}
    - {adapter: quick-xml, format: xml, data_size: medium, time_per_iteration: 0.000826292, iterations_per_second: 1210.225925}
    - {adapter: roxmltree, format: xml, data_size: medium, time_per_iteration: 0.002108199, iterations_per_second: 474.338448}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.011422979, iterations_per_second: 87.542838}
    - {adapter: quick-xml, format: xml, data_size: large, time_per_iteration: 0.011313496, iterations_per_second: 88.390008}
    - {adapter: roxmltree, format: xml, data_size: large, time_per_iteration: 0.029506246, iterations_per_second: 33.891129}
  generation:
