platform:
  platform_string: ubuntu-24.04-arm-rust-1.99.1
  kind: native
  os: linux
  arch: arm64
  runtime: rust
  runtime_version: 1.99.1
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001109, iterations_per_second: 901306.894998}
    - {adapter: quick-xml, format: xml, data_size: small, time_per_iteration: 0.000000938, iterations_per_second: 1065757.220505}
    - {adapter: roxmltree, format: xml, data_size: small, time_per_iteration: 0.000002441, iterations_per_second: 409601.048579}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000862600, iterations_per_second: 1159.285432}
    - {adapter: quick-xml, format: xml, data_size: medium, time_per_iteration: 0.000823926, iterations_per_second: 1213.700739}
    - {adapter: roxmltree, format: xml, data_size: medium, time_per_iteration: 0.002108248, iterations_per_second: 474.327498}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.011712853, iterations_per_second: 85.376296}
    - {adapter: quick-xml, format: xml, data_size: large, time_per_iteration: 0.011338464, iterations_per_second: 88.195368}
    - {adapter: roxmltree, format: xml, data_size: large, time_per_iteration: 0.032276825, iterations_per_second: 30.981982}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000002050, iterations_per_second: 487757.291972}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001932104, iterations_per_second: 517.570483}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.027846475, iterations_per_second: 35.911188}
  xpath:
