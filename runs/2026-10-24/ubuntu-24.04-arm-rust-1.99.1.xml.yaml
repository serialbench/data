    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002939193, iterations_per_second: 340.229444}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.051175428, iterations_per_second: 19.540628}
