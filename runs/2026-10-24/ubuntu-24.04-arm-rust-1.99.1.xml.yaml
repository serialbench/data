    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002994425, iterations_per_second: 333.953968}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.055641554, iterations_per_second: 17.972180}
