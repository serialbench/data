platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004454, iterations_per_second: 224497.126483}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007966, iterations_per_second: 125533.517431}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001811941, iterations_per_second: 551.894248}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004544385, iterations_per_second: 220.051794}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024135104, iterations_per_second: 41.433424}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055317576, iterations_per_second: 18.077437}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001277, iterations_per_second: 782840.144152}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001351732, iterations_per_second: 739.791798}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021221678, iterations_per_second: 47.121627}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006517, iterations_per_second: 153437.773321}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006660, iterations_per_second: 150159.168695}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002995066, iterations_per_second: 333.882496}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006209485, iterations_per_second: 161.043943}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.042520330, iterations_per_second: 23.518162}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078413031, iterations_per_second: 12.752982}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001623, iterations_per_second: 616142.945165}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001709173, iterations_per_second: 585.078281}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.025206109, iterations_per_second: 39.672922}
  xpath:
  xslt:
