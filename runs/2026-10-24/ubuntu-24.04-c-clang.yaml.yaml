platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004174, iterations_per_second: 239589.822264}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004638, iterations_per_second: 215624.124075}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001775042, iterations_per_second: 563.367057}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004517504, iterations_per_second: 221.361160}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023504049, iterations_per_second: 42.545861}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055492047, iterations_per_second: 18.020600}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001297, iterations_per_second: 770772.314670}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001366352, iterations_per_second: 731.875648}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.019990725, iterations_per_second: 50.023198}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006355, iterations_per_second: 157361.364603}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006723, iterations_per_second: 148751.970966}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002879155, iterations_per_second: 347.324168}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006164260, iterations_per_second: 162.225465}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.041584852, iterations_per_second: 24.047218}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078344822, iterations_per_second: 12.764085}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001615, iterations_per_second: 619156.708134}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001632088, iterations_per_second: 612.711935}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.024041672, iterations_per_second: 41.594445}
  xpath:
  xslt:
