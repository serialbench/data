platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004287, iterations_per_second: 233257.913247}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004675, iterations_per_second: 213917.470645}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001772291, iterations_per_second: 564.241425}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004505883, iterations_per_second: 221.932099}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024545926, iterations_per_second: 40.739958}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055705387, iterations_per_second: 17.951585}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001369, iterations_per_second: 730673.681753}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001344128, iterations_per_second: 743.976764}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020766385, iterations_per_second: 48.154746}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006298, iterations_per_second: 158783.086410}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006695, iterations_per_second: 149376.353691}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002839263, iterations_per_second: 352.204075}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006132413, iterations_per_second: 163.067938}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040404594, iterations_per_second: 24.749661}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078646882, iterations_per_second: 12.715062}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001675, iterations_per_second: 596943.648755}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001641589, iterations_per_second: 609.165752}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.024887546, iterations_per_second: 40.180739}
  xpath:
  xslt:
