platform:
  platform_string: windows-2025-js-24.22.1
  kind: wasm
  os: windows
  arch: x86_64
  runtime: js
  runtime_version: 24.22.1
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
