platform:
  platform_string: ubuntu-24.04-arm-js-24.21.0
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.11', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000016558, iterations_per_second: 60395.226361}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000110057, iterations_per_second: 9086.233811}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001886457, iterations_per_second: 530.094245}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.025122105, iterations_per_second: 39.805582}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.024331748, iterations_per_second: 41.098568}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.370371638, iterations_per_second: 2.699991}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000018373, iterations_per_second: 54426.507886}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003864071, iterations_per_second: 258.794417}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.044798695, iterations_per_second: 22.322079}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000024538, iterations_per_second: 40752.785453}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003281035, iterations_per_second: 304.781875}
