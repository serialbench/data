platform:
  platform_string: ubuntu-24.04-arm-js-24.21.0
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.11', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000016982, iterations_per_second: 58884.838921}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000285935, iterations_per_second: 3497.297114}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002389106, iterations_per_second: 418.566552}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.025513560, iterations_per_second: 39.194844}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.023522829, iterations_per_second: 42.511893}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.377239123, iterations_per_second: 2.650839}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000019422, iterations_per_second: 51487.208003}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003567527, iterations_per_second: 280.306218}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.045626678, iterations_per_second: 21.917002}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000024411, iterations_per_second: 40965.474298}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003290559, iterations_per_second: 303.899733}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.041264959, iterations_per_second: 24.233636}
