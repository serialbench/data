platform:
  platform_string: ubuntu-24.04-arm-js-24.21.0
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.11', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000025002, iterations_per_second: 39997.440164}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000182192, iterations_per_second: 5488.715202}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002411298, iterations_per_second: 414.714399}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.027062371, iterations_per_second: 36.951678}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.023679976, iterations_per_second: 42.229773}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.376402643, iterations_per_second: 2.656729}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000031002, iterations_per_second: 32256.087530}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003671349, iterations_per_second: 272.379469}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.046056605, iterations_per_second: 21.712412}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000142231, iterations_per_second: 7030.791351}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003305599, iterations_per_second: 302.517002}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.041732862, iterations_per_second: 23.961932}
