platform:
  platform_string: ubuntu-24.04-arm-js-24.21.0
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: yeptris, format: yaml, version: '0.1.0', features: {wasm: true}}
    - {name: teptris, format: toml, version: '0.3.11', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000018777, iterations_per_second: 53257.211026}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000124390, iterations_per_second: 8039.257301}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001949457, iterations_per_second: 512.963353}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.026971491, iterations_per_second: 37.076186}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.024761636, iterations_per_second: 40.385054}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.399450791, iterations_per_second: 2.503437}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000018786, iterations_per_second: 53229.996167}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003801247, iterations_per_second: 263.071543}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.045478535, iterations_per_second: 21.988395}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000103627, iterations_per_second: 9649.966756}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003364543, iterations_per_second: 297.217156}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.042033821, iterations_per_second: 23.790366}
