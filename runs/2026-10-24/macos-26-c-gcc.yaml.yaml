    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001171, iterations_per_second: 854116.841973}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001731319, iterations_per_second: 577.594197}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021123041, iterations_per_second: 47.341668}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005300, iterations_per_second: 188679.245253}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008300, iterations_per_second: 120481.927726}
