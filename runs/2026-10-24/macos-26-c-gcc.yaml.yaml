platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004100, iterations_per_second: 243902.438964}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007200, iterations_per_second: 138888.888911}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001125000, iterations_per_second: 888.888889}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003921667, iterations_per_second: 254.993625}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015403000, iterations_per_second: 64.922418}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048633000, iterations_per_second: 20.562170}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001029, iterations_per_second: 971722.865085}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001158153, iterations_per_second: 863.443776}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013337667, iterations_per_second: 74.975631}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005700, iterations_per_second: 175438.596497}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008400, iterations_per_second: 119047.619066}
