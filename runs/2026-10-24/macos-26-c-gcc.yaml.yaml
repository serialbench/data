    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006700, iterations_per_second: 149253.731340}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001222667, iterations_per_second: 817.884406}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005222333, iterations_per_second: 191.485288}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021991000, iterations_per_second: 45.473148}
