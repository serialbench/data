platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007100, iterations_per_second: 140845.070553}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007700, iterations_per_second: 129870.129815}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001149333, iterations_per_second: 870.069606}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004068000, iterations_per_second: 245.821042}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016374000, iterations_per_second: 61.072432}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.060941000, iterations_per_second: 16.409314}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001242, iterations_per_second: 805347.507868}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000884014, iterations_per_second: 1131.203804}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013580333, iterations_per_second: 73.635897}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007500, iterations_per_second: 133333.333468}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009500, iterations_per_second: 105263.157909}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002183667, iterations_per_second: 457.945352}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006490667, iterations_per_second: 154.067379}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.033998000, iterations_per_second: 29.413495}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.077251000, iterations_per_second: 12.944816}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001258, iterations_per_second: 794723.035420}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001255861, iterations_per_second: 796.266254}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.017782708, iterations_per_second: 56.234405}
  xpath:
