platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001064, iterations_per_second: 940203.087727}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002952, iterations_per_second: 338707.491411}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004076, iterations_per_second: 245326.530139}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000371247, iterations_per_second: 2693.626879}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001498745, iterations_per_second: 667.225060}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001006476, iterations_per_second: 993.565669}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003473910, iterations_per_second: 287.860077}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014929893, iterations_per_second: 66.979716}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010185287, iterations_per_second: 98.180837}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002060, iterations_per_second: 485413.330389}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005225, iterations_per_second: 191394.886022}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000718284, iterations_per_second: 1392.206982}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001314288, iterations_per_second: 760.868435}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007404966, iterations_per_second: 135.044509}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013250644, iterations_per_second: 75.468030}
  xpath:
  xslt:
