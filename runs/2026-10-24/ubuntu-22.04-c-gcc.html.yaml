platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000000773, iterations_per_second: 1293326.440303}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002126, iterations_per_second: 470322.640925}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003190, iterations_per_second: 313509.107584}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000242161, iterations_per_second: 4129.478419}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.000989405, iterations_per_second: 1010.708116}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000692680, iterations_per_second: 1443.668767}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.002472238, iterations_per_second: 404.491801}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.010134084, iterations_per_second: 98.676901}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.007066820, iterations_per_second: 141.506364}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002650, iterations_per_second: 377372.731039}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003937, iterations_per_second: 254006.959931}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000465444, iterations_per_second: 2148.484638}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000913656, iterations_per_second: 1094.503840}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004916332, iterations_per_second: 203.403676}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009116737, iterations_per_second: 109.688368}
  xpath:
  xslt:
