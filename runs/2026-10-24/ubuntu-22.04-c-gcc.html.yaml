platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001462, iterations_per_second: 684088.112137}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004243, iterations_per_second: 235687.854903}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005743, iterations_per_second: 174131.085736}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000522877, iterations_per_second: 1912.495673}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002203211, iterations_per_second: 453.882923}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001399107, iterations_per_second: 714.741617}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005236139, iterations_per_second: 190.980415}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.021802473, iterations_per_second: 45.866357}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014274166, iterations_per_second: 70.056632}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002910, iterations_per_second: 343701.666928}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007332, iterations_per_second: 136392.154660}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001017341, iterations_per_second: 982.954585}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001838955, iterations_per_second: 543.787195}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010101602, iterations_per_second: 98.994199}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018310655, iterations_per_second: 54.613011}
  xpath:
  xslt:
