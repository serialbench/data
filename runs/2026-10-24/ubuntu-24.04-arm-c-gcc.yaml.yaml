platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002770, iterations_per_second: 361049.933852}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004039, iterations_per_second: 247616.688460}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001640991, iterations_per_second: 609.387864}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003974597, iterations_per_second: 251.597835}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021897126, iterations_per_second: 45.668094}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048112147, iterations_per_second: 20.784772}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001197, iterations_per_second: 835491.681960}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001170122, iterations_per_second: 854.611741}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026021407, iterations_per_second: 38.429897}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004317, iterations_per_second: 231642.345299}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006010, iterations_per_second: 166394.888490}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002650355, iterations_per_second: 377.307898}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005510579, iterations_per_second: 181.469123}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.039476786, iterations_per_second: 25.331343}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068798400, iterations_per_second: 14.535222}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001438, iterations_per_second: 695603.780164}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001432091, iterations_per_second: 698.279811}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029187153, iterations_per_second: 34.261649}
  xpath:
  xslt:
