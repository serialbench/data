platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002761, iterations_per_second: 362240.092690}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000012494, iterations_per_second: 80040.981042}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001636120, iterations_per_second: 611.201988}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003994062, iterations_per_second: 250.371677}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021790660, iterations_per_second: 45.891221}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048230386, iterations_per_second: 20.733817}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001234, iterations_per_second: 810110.176969}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001169571, iterations_per_second: 855.014116}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029335767, iterations_per_second: 34.088081}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004269, iterations_per_second: 234274.335030}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006075, iterations_per_second: 164611.763158}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002605707, iterations_per_second: 383.773003}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005523546, iterations_per_second: 181.043120}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.039233540, iterations_per_second: 25.488396}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068726424, iterations_per_second: 14.550444}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001464, iterations_per_second: 683106.768273}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001449225, iterations_per_second: 690.023820}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032786804, iterations_per_second: 30.500076}
  xpath:
  xslt:
