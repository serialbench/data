platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002758, iterations_per_second: 362555.289665}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004063, iterations_per_second: 246123.554019}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001636327, iterations_per_second: 611.124794}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003968507, iterations_per_second: 251.983932}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021666309, iterations_per_second: 46.154608}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048246287, iterations_per_second: 20.726984}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001193, iterations_per_second: 838433.805458}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001180889, iterations_per_second: 846.819403}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026944525, iterations_per_second: 37.113291}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004295, iterations_per_second: 232834.291810}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006075, iterations_per_second: 164614.472955}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002678803, iterations_per_second: 373.301107}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005507119, iterations_per_second: 181.583136}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.039758129, iterations_per_second: 25.152089}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068822987, iterations_per_second: 14.530029}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001428, iterations_per_second: 700280.112642}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001456953, iterations_per_second: 686.363782}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.030254462, iterations_per_second: 33.052976}
  xpath:
  xslt:
