platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000866, iterations_per_second: 1155268.021426}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003050, iterations_per_second: 327847.354410}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000062399, iterations_per_second: 16025.897851}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000312544, iterations_per_second: 3199.552916}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001079095, iterations_per_second: 926.702468}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003948843, iterations_per_second: 253.238733}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000711, iterations_per_second: 1406074.236763}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000089853, iterations_per_second: 11129.288950}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001464624, iterations_per_second: 682.769093}
  xpath:
  xslt:
