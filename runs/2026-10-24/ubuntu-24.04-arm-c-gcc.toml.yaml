platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000883, iterations_per_second: 1132246.399725}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003040, iterations_per_second: 328936.548101}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000060949, iterations_per_second: 16407.249824}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000315403, iterations_per_second: 3170.550239}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001075268, iterations_per_second: 930.000707}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003766286, iterations_per_second: 265.513559}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000740, iterations_per_second: 1351351.358915}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000089299, iterations_per_second: 11198.333690}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001423735, iterations_per_second: 702.377900}
  xpath:
  xslt:
