platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000849, iterations_per_second: 1178133.837148}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003041, iterations_per_second: 328795.949145}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000062167, iterations_per_second: 16085.704634}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000311528, iterations_per_second: 3209.980901}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001066969, iterations_per_second: 937.234353}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003812504, iterations_per_second: 262.294807}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000714, iterations_per_second: 1399776.036963}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000091731, iterations_per_second: 10901.479694}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001448794, iterations_per_second: 690.229253}
  xpath:
  xslt:
