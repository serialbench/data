    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000773915, iterations_per_second: 1292.131398}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000041051, iterations_per_second: 24359.744710}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.098061949, iterations_per_second: 10.197635}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.000019970, iterations_per_second: 50075.112669}
