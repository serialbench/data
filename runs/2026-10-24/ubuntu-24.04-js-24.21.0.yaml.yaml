platform:
  platform_string: ubuntu-24.04-js-24.21.0
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.11', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000876073, iterations_per_second: 1141.457781}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.121736044, iterations_per_second: 8.214494}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.402737684, iterations_per_second: 0.712892}
  generation:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.001276535, iterations_per_second: 783.370670}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.154392102, iterations_per_second: 6.477015}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 2.096551295, iterations_per_second: 0.476974}
  xpath:
