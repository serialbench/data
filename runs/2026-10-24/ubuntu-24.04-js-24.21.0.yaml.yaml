platform:
  platform_string: ubuntu-24.04-js-24.21.0
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.11', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000532971, iterations_per_second: 1876.275398}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.129331306, iterations_per_second: 7.732080}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.455925131, iterations_per_second: 0.686849}
  generation:
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.001023327, iterations_per_second: 977.204936}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.156651430, iterations_per_second: 6.383600}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 2.256356543, iterations_per_second: 0.443192}
  xpath:
