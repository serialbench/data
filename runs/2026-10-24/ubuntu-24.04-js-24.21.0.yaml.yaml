platform:
  platform_string: ubuntu-24.04-js-24.21.0
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: yeptris, format: yaml, version: '0.1.0', features: {wasm: true}}
    - {name: teptris, format: toml, version: '0.3.11', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000060261, iterations_per_second: 16594.425601}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.001752517, iterations_per_second: 570.607874}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000009595, iterations_per_second: 104224.569205}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.086345498, iterations_per_second: 11.581380}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.000009504, iterations_per_second: 105218.855218}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.017311710, iterations_per_second: 0.982983}
  generation:
