platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001101, iterations_per_second: 908595.312140}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003005, iterations_per_second: 332723.340583}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004100, iterations_per_second: 243902.438964}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000355434, iterations_per_second: 2813.464491}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001559120, iterations_per_second: 641.387312}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000962241, iterations_per_second: 1039.240689}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003485334, iterations_per_second: 286.916548}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015494147, iterations_per_second: 64.540500}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009727902, iterations_per_second: 102.797088}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002186, iterations_per_second: 457414.691926}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005194, iterations_per_second: 192540.963109}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000754635, iterations_per_second: 1325.143944}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001281578, iterations_per_second: 780.287848}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007821723, iterations_per_second: 127.849069}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013146869, iterations_per_second: 76.063738}
  xpath:
  xslt:
