platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001102, iterations_per_second: 907770.515451}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003085, iterations_per_second: 324191.143233}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004082, iterations_per_second: 244971.950718}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000352456, iterations_per_second: 2837.233584}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001581054, iterations_per_second: 632.489333}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000981988, iterations_per_second: 1018.342037}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003504713, iterations_per_second: 285.330068}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015487650, iterations_per_second: 64.567575}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009789473, iterations_per_second: 102.150545}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002159, iterations_per_second: 463134.494344}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005307, iterations_per_second: 188430.374952}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000751686, iterations_per_second: 1330.343313}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001292655, iterations_per_second: 773.601618}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007663410, iterations_per_second: 130.490213}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013142498, iterations_per_second: 76.089036}
  xpath:
  xslt:
