platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000000989, iterations_per_second: 1010917.915507}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002518, iterations_per_second: 397203.685919}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003828, iterations_per_second: 261253.493964}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000325239, iterations_per_second: 3074.665169}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001410442, iterations_per_second: 708.997773}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000926207, iterations_per_second: 1079.672255}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003241179, iterations_per_second: 308.529705}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014113807, iterations_per_second: 70.852606}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009927668, iterations_per_second: 100.728590}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001862, iterations_per_second: 536999.249052}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004833, iterations_per_second: 206889.417717}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000666902, iterations_per_second: 1499.470687}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001260403, iterations_per_second: 793.396823}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007010747, iterations_per_second: 142.638153}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013512419, iterations_per_second: 74.005994}
  xpath:
  xslt:
