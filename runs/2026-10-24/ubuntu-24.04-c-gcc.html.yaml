platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001492, iterations_per_second: 670286.212459}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004226, iterations_per_second: 236635.982725}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005692, iterations_per_second: 175694.432172}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000475102, iterations_per_second: 2104.812654}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002214422, iterations_per_second: 451.585041}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001433690, iterations_per_second: 697.500692}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004736207, iterations_per_second: 211.139420}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.021801410, iterations_per_second: 45.868593}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014340992, iterations_per_second: 69.730183}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002911, iterations_per_second: 343583.576586}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007387, iterations_per_second: 135376.617774}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001010489, iterations_per_second: 989.619551}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001872096, iterations_per_second: 534.160546}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010083970, iterations_per_second: 99.167292}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018862119, iterations_per_second: 53.016313}
  xpath:
  xslt:
