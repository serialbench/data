platform:
  platform_string: ubuntu-24.04-rust-1.99.1
  kind: native
  os: linux
  arch: x86_64
  runtime: rust
  runtime_version: 1.99.1
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004507, iterations_per_second: 221852.468109}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000007154, iterations_per_second: 139774.125014}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001746525, iterations_per_second: 572.565632}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.007811697, iterations_per_second: 128.013152}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023841915, iterations_per_second: 41.942940}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.106812320, iterations_per_second: 9.362216}
  generation:
