    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000008457, iterations_per_second: 118248.037083}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002876771, iterations_per_second: 347.611998}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.009858272, iterations_per_second: 101.437659}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.042080294, iterations_per_second: 23.764093}
