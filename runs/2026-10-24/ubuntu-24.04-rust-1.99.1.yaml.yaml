platform:
  platform_string: ubuntu-24.04-rust-1.99.1
  kind: native
  os: linux
  arch: x86_64
  runtime: rust
  runtime_version: 1.99.1
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003241, iterations_per_second: 308556.265235}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000007880, iterations_per_second: 126906.774284}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001285997, iterations_per_second: 777.606589}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.005916821, iterations_per_second: 169.009685}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016946192, iterations_per_second: 59.010307}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.082562804, iterations_per_second: 12.111992}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004966, iterations_per_second: 201349.038558}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000006500, iterations_per_second: 153853.254766}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002146094, iterations_per_second: 465.962814}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.006844656, iterations_per_second: 146.099380}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.030213643, iterations_per_second: 33.097631}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.095104933, iterations_per_second: 10.514702}
  xpath:
