platform:
  platform_string: ubuntu-24.04-rust-1.99.1
  kind: native
  os: linux
  arch: x86_64
  runtime: rust
  runtime_version: 1.99.1
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004897, iterations_per_second: 204214.997549}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000005485, iterations_per_second: 182305.434525}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001423523, iterations_per_second: 702.482503}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.006040877, iterations_per_second: 165.538869}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.018520258, iterations_per_second: 53.994928}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.088795546, iterations_per_second: 11.261826}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006927, iterations_per_second: 144364.723036}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000006314, iterations_per_second: 158368.174332}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002436640, iterations_per_second: 410.401264}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.006705942, iterations_per_second: 149.121481}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.036117540, iterations_per_second: 27.687378}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.105011429, iterations_per_second: 9.522773}
  xpath:
