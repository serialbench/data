    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002421396, iterations_per_second: 412.984906}
    - {adapter: toml, format: toml, data_size: large, time_per_iteration: 0.005744955, iterations_per_second: 174.065767}
  generation:
