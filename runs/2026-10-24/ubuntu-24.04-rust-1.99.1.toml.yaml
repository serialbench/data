    - {adapter: toml, format: toml, data_size: small, time_per_iteration: 0.000005438, iterations_per_second: 183891.136447}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000221932, iterations_per_second: 4505.891453}
