platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001327, iterations_per_second: 753352.418434}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001185, iterations_per_second: 843739.453250}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000782751, iterations_per_second: 1277.545477}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001985541, iterations_per_second: 503.641158}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015446061, iterations_per_second: 64.741425}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.042323191, iterations_per_second: 23.627708}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000444, iterations_per_second: 2253267.242260}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000433621, iterations_per_second: 2306.159599}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005403978, iterations_per_second: 185.048866}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002197, iterations_per_second: 455145.419058}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001663, iterations_per_second: 601250.601848}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002623190, iterations_per_second: 381.215238}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002495157, iterations_per_second: 400.776438}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.025711026, iterations_per_second: 38.893819}
