platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001347, iterations_per_second: 742611.021207}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001203, iterations_per_second: 831047.950181}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000894268, iterations_per_second: 1118.233013}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001988247, iterations_per_second: 502.955703}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.016638060, iterations_per_second: 60.103161}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.041428149, iterations_per_second: 24.138177}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000449, iterations_per_second: 2228163.991948}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000443213, iterations_per_second: 2256.249812}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005428939, iterations_per_second: 184.198054}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002281, iterations_per_second: 438365.772450}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001654, iterations_per_second: 604558.369821}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002891639, iterations_per_second: 345.824674}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002471222, iterations_per_second: 404.658155}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.028196260, iterations_per_second: 35.465697}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.048777734, iterations_per_second: 20.501157}
