platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001278, iterations_per_second: 782288.978264}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001194, iterations_per_second: 837380.674220}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000769653, iterations_per_second: 1299.286821}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001981955, iterations_per_second: 504.552238}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013474346, iterations_per_second: 74.215105}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.037992311, iterations_per_second: 26.321115}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000455, iterations_per_second: 2198285.332384}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000434113, iterations_per_second: 2303.545925}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005399977, iterations_per_second: 185.185974}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002160, iterations_per_second: 462962.963035}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001648, iterations_per_second: 606796.116530}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002615214, iterations_per_second: 382.377934}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002497120, iterations_per_second: 400.461331}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.024526621, iterations_per_second: 40.772025}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.048703380, iterations_per_second: 20.532456}
  xpath:
  xslt:
