platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001309, iterations_per_second: 763650.249020}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001191, iterations_per_second: 839489.590974}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000857185, iterations_per_second: 1166.608855}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001999500, iterations_per_second: 500.125115}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014392734, iterations_per_second: 69.479503}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.037452946, iterations_per_second: 26.700169}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000456, iterations_per_second: 2193463.469985}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000435841, iterations_per_second: 2294.412952}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005445331, iterations_per_second: 183.643565}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002235, iterations_per_second: 447387.258371}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001665, iterations_per_second: 600564.530301}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002732953, iterations_per_second: 365.904573}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002464870, iterations_per_second: 405.700964}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.025572177, iterations_per_second: 39.105001}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.044448487, iterations_per_second: 22.497954}
  xpath:
  xslt:
