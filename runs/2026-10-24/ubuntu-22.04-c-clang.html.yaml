platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000000782, iterations_per_second: 1278608.874042}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002227, iterations_per_second: 448953.937273}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003201, iterations_per_second: 312412.134140}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000267318, iterations_per_second: 3740.867607}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001077886, iterations_per_second: 927.741608}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000701364, iterations_per_second: 1425.793846}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.002648024, iterations_per_second: 377.640082}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.010556971, iterations_per_second: 94.724140}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.007051932, iterations_per_second: 141.805111}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001449, iterations_per_second: 690035.882287}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003998, iterations_per_second: 250118.806519}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000481748, iterations_per_second: 2075.772620}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000937498, iterations_per_second: 1066.669321}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004867659, iterations_per_second: 205.437562}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009295013, iterations_per_second: 107.584573}
  xpath:
  xslt:
