platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001574, iterations_per_second: 635364.381824}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004436, iterations_per_second: 225418.150468}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005616, iterations_per_second: 178049.996439}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000528981, iterations_per_second: 1890.427066}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002315312, iterations_per_second: 431.907295}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001407406, iterations_per_second: 710.527195}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005159550, iterations_per_second: 193.815352}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.022192814, iterations_per_second: 45.059631}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014229638, iterations_per_second: 70.275857}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002901, iterations_per_second: 344661.197970}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007233, iterations_per_second: 138264.777011}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000994945, iterations_per_second: 1005.081020}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001813852, iterations_per_second: 551.312897}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010050531, iterations_per_second: 99.497231}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018454909, iterations_per_second: 54.186125}
  xpath:
  xslt:
