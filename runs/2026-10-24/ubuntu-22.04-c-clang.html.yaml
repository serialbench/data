platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001370, iterations_per_second: 730086.881097}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003538, iterations_per_second: 282653.551572}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005887, iterations_per_second: 169871.577098}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000492652, iterations_per_second: 2029.831761}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002345242, iterations_per_second: 426.395169}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001361772, iterations_per_second: 734.337319}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005092923, iterations_per_second: 196.350897}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.021111066, iterations_per_second: 47.368522}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.016277849, iterations_per_second: 61.433178}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002496, iterations_per_second: 400705.241156}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006784, iterations_per_second: 147403.487497}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001041078, iterations_per_second: 960.542822}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001801092, iterations_per_second: 555.218723}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010021351, iterations_per_second: 99.786945}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019993471, iterations_per_second: 50.016328}
  xpath:
  xslt:
