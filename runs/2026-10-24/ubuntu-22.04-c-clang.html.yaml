platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001605, iterations_per_second: 623052.963943}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004446, iterations_per_second: 224906.101729}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005664, iterations_per_second: 176566.141820}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000562425, iterations_per_second: 1778.015900}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002327464, iterations_per_second: 429.652188}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001465433, iterations_per_second: 682.392322}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005313392, iterations_per_second: 188.203694}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.022291067, iterations_per_second: 44.861020}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014792331, iterations_per_second: 67.602598}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003004, iterations_per_second: 332933.815297}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007414, iterations_per_second: 134883.595556}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001010068, iterations_per_second: 990.032354}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001876852, iterations_per_second: 532.807157}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010318637, iterations_per_second: 96.912024}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018975980, iterations_per_second: 52.698201}
  xpath:
  xslt:
