platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000621, iterations_per_second: 1610046.699044}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002028, iterations_per_second: 493120.963671}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000083073, iterations_per_second: 12037.605479}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000210135, iterations_per_second: 4758.853053}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001717778, iterations_per_second: 582.147402}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002354333, iterations_per_second: 424.748750}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000859, iterations_per_second: 1164686.702188}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000124581, iterations_per_second: 8026.906189}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002172973, iterations_per_second: 460.198999}
  xpath:
  xslt:
