platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000569, iterations_per_second: 1757160.477517}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002011, iterations_per_second: 497314.497447}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000083493, iterations_per_second: 11977.051947}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000218599, iterations_per_second: 4574.593318}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001712832, iterations_per_second: 583.828420}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002443929, iterations_per_second: 409.177190}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000786, iterations_per_second: 1273074.450709}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000126056, iterations_per_second: 7933.003139}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002130664, iterations_per_second: 469.337258}
  xpath:
  xslt:
