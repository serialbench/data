platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000587, iterations_per_second: 1702417.429870}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001751, iterations_per_second: 571037.003216}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000067094, iterations_per_second: 14904.388351}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000187838, iterations_per_second: 5323.745858}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001248984, iterations_per_second: 800.650769}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002156331, iterations_per_second: 463.750695}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000783, iterations_per_second: 1276813.075491}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000096401, iterations_per_second: 10373.300509}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001577168, iterations_per_second: 634.047863}
  xpath:
  xslt:
