    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384746}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.778040}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000427333, iterations_per_second: 2340.093604}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001458000, iterations_per_second: 685.871056}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001266000, iterations_per_second: 789.889415}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008504000, iterations_per_second: 117.591722}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.022488000, iterations_per_second: 44.468161}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.023524000, iterations_per_second: 42.509777}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.857320}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004300, iterations_per_second: 232558.139507}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000797667, iterations_per_second: 1253.656498}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001458000, iterations_per_second: 685.871056}
