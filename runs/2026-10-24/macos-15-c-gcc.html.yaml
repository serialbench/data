    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.369746}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238052}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000432333, iterations_per_second: 2313.030069}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001405667, iterations_per_second: 711.406213}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001041333, iterations_per_second: 960.307298}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004452000, iterations_per_second: 224.618149}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.013837000, iterations_per_second: 72.270001}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012651000, iterations_per_second: 79.045135}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.665745}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000817667, iterations_per_second: 1222.992254}
