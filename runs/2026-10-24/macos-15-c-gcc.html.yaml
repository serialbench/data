platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.331490}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384746}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270122}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000458333, iterations_per_second: 2181.818182}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003184333, iterations_per_second: 314.037475}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001076000, iterations_per_second: 929.368030}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005375000, iterations_per_second: 186.046512}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.023094000, iterations_per_second: 43.301290}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014033000, iterations_per_second: 71.260600}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608719}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000816667, iterations_per_second: 1224.489796}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001471000, iterations_per_second: 679.809653}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008500000, iterations_per_second: 117.647059}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018096000, iterations_per_second: 55.260831}
