platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.8.5', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005080, iterations_per_second: 196850.393713}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000011540, iterations_per_second: 86655.112631}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001738733, iterations_per_second: 575.131322}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007277867, iterations_per_second: 137.402902}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023732300, iterations_per_second: 42.136666}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.088409300, iterations_per_second: 11.311027}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001530, iterations_per_second: 653594.772406}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002183433, iterations_per_second: 457.994290}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027684500, iterations_per_second: 36.121295}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000084400, iterations_per_second: 11848.341232}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000019880, iterations_per_second: 50301.810874}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003390333, iterations_per_second: 294.956248}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.009226367, iterations_per_second: 108.385027}
