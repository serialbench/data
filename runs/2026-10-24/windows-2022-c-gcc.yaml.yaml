    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001540, iterations_per_second: 649350.651949}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002138500, iterations_per_second: 467.617489}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027203400, iterations_per_second: 36.760111}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000102460, iterations_per_second: 9759.906304}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000021400, iterations_per_second: 46728.971956}
