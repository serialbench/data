    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.114987200, iterations_per_second: 8.696620}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002020, iterations_per_second: 495049.505086}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002616033, iterations_per_second: 382.258126}
