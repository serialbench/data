platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.8.5', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000005310, iterations_per_second: 188323.917129}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005200, iterations_per_second: 192307.692373}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000127733, iterations_per_second: 7828.810021}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000636033, iterations_per_second: 1572.244641}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001234100, iterations_per_second: 810.307106}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.007392800, iterations_per_second: 135.266746}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000005160, iterations_per_second: 193798.449589}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000113767, iterations_per_second: 8789.920891}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001994200, iterations_per_second: 501.454217}
  xpath:
  xslt:
