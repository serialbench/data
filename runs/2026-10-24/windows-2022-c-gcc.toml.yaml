platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.8.5', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000006610, iterations_per_second: 151285.930478}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004960, iterations_per_second: 201612.903180}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000122733, iterations_per_second: 8147.745791}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000635867, iterations_per_second: 1572.656741}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001237000, iterations_per_second: 808.407437}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.007480500, iterations_per_second: 133.680904}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000007160, iterations_per_second: 139664.804445}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000148767, iterations_per_second: 6721.935918}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001780600, iterations_per_second: 561.608447}
  xpath:
  xslt:
