platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.8.5', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000720, iterations_per_second: 1388888.883623}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005220, iterations_per_second: 191570.881543}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000051233, iterations_per_second: 19518.542608}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000624267, iterations_per_second: 1601.879539}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001216600, iterations_per_second: 821.962847}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.007239100, iterations_per_second: 138.138719}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002520, iterations_per_second: 396825.397111}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000103733, iterations_per_second: 9640.102830}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001715100, iterations_per_second: 583.056382}
  xpath:
  xslt:
