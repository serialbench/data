platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001314, iterations_per_second: 760861.295584}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001271, iterations_per_second: 786658.275633}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000702955, iterations_per_second: 1422.566167}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001903696, iterations_per_second: 525.293863}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014716836, iterations_per_second: 67.949388}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030529462, iterations_per_second: 32.755245}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000383, iterations_per_second: 2609603.337281}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000323970, iterations_per_second: 3086.705559}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004208907, iterations_per_second: 237.591375}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001768, iterations_per_second: 565642.853247}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001573, iterations_per_second: 635808.748973}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001850105, iterations_per_second: 540.509863}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002155972, iterations_per_second: 463.827988}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023102485, iterations_per_second: 43.285387}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033757181, iterations_per_second: 29.623327}
