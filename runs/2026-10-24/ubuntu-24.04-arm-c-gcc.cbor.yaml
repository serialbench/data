platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001347, iterations_per_second: 742225.186665}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001241, iterations_per_second: 805866.711954}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000697058, iterations_per_second: 1434.600851}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001902024, iterations_per_second: 525.755813}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014375826, iterations_per_second: 69.561220}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030102562, iterations_per_second: 33.219764}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000380, iterations_per_second: 2631578.906774}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000335006, iterations_per_second: 2985.021163}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004254591, iterations_per_second: 235.040219}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001788, iterations_per_second: 559252.842938}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001562, iterations_per_second: 640040.959729}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001863279, iterations_per_second: 536.688375}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002151950, iterations_per_second: 464.694884}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022974539, iterations_per_second: 43.526445}
