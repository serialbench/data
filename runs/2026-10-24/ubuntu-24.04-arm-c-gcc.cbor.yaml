platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001345, iterations_per_second: 743218.135237}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001250, iterations_per_second: 799744.081164}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000719184, iterations_per_second: 1390.464104}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001901554, iterations_per_second: 525.885578}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015008347, iterations_per_second: 66.629590}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031628543, iterations_per_second: 31.617011}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000378, iterations_per_second: 2649006.615244}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000321034, iterations_per_second: 3114.931632}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004187753, iterations_per_second: 238.791543}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001837, iterations_per_second: 544217.687186}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001518, iterations_per_second: 658935.160558}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001924668, iterations_per_second: 519.570128}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002174589, iterations_per_second: 459.857012}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.024256514, iterations_per_second: 41.226039}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035863957, iterations_per_second: 27.883147}
  xpath:
  xslt:
