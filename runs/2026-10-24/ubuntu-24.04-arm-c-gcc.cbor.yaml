platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001362, iterations_per_second: 734052.706464}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001228, iterations_per_second: 814398.560775}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000695082, iterations_per_second: 1438.679177}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001901050, iterations_per_second: 526.025184}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014642248, iterations_per_second: 68.295524}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031045145, iterations_per_second: 32.211156}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000402, iterations_per_second: 2490039.881323}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000348797, iterations_per_second: 2866.997136}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004279934, iterations_per_second: 233.648463}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001819, iterations_per_second: 549752.611579}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001557, iterations_per_second: 642384.531740}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001892495, iterations_per_second: 528.402888}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002178136, iterations_per_second: 459.108085}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023640440, iterations_per_second: 42.300397}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035200079, iterations_per_second: 28.409027}
  xpath:
  xslt:
