platform:
  platform_string: ubuntu-24.04-js-24.21.0
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.11', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000023799, iterations_per_second: 42018.042547}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000407307, iterations_per_second: 2455.152346}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003341422, iterations_per_second: 299.273752}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.031460503, iterations_per_second: 31.785887}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.021205818, iterations_per_second: 47.156870}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.445720950, iterations_per_second: 2.243556}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000052810, iterations_per_second: 18935.735900}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003339632, iterations_per_second: 299.434159}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.042125342, iterations_per_second: 23.738680}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000057728, iterations_per_second: 17322.496380}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003817595, iterations_per_second: 261.945043}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.040520597, iterations_per_second: 24.678807}
