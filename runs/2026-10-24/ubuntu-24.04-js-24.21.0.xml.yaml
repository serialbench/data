platform:
  platform_string: ubuntu-24.04-js-24.21.0
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.11', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000013360, iterations_per_second: 74850.859662}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000392825, iterations_per_second: 2545.663475}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001672076, iterations_per_second: 598.058940}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.020245850, iterations_per_second: 49.392839}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.012325949, iterations_per_second: 81.129656}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.297354008, iterations_per_second: 3.362995}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000022553, iterations_per_second: 44340.588932}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003081899, iterations_per_second: 324.475232}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.023010341, iterations_per_second: 43.458721}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000024953, iterations_per_second: 40074.699239}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001937737, iterations_per_second: 516.065906}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.030268835, iterations_per_second: 33.037281}
