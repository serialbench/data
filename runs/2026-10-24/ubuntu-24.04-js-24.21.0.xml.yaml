platform:
  platform_string: ubuntu-24.04-js-24.21.0
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: yeptris, format: yaml, version: '0.1.0', features: {wasm: true}}
    - {name: teptris, format: toml, version: '0.3.11', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000010255, iterations_per_second: 97510.555518}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000103461, iterations_per_second: 9665.496497}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002385035, iterations_per_second: 419.281000}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.020140782, iterations_per_second: 49.650504}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.017207578, iterations_per_second: 58.113931}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.281842882, iterations_per_second: 3.548076}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000015285, iterations_per_second: 65424.473987}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.004268694, iterations_per_second: 234.263688}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.022249301, iterations_per_second: 44.945232}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000013709, iterations_per_second: 72947.441368}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002180366, iterations_per_second: 458.638666}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.023883166, iterations_per_second: 41.870496}
