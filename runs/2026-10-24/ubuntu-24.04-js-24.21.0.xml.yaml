platform:
  platform_string: ubuntu-24.04-js-24.21.0
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.21.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.11', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.21.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000021488, iterations_per_second: 46537.169237}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000390197, iterations_per_second: 2562.804734}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.004111016, iterations_per_second: 243.248851}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.032593040, iterations_per_second: 30.681397}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.022154254, iterations_per_second: 45.138058}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.446801926, iterations_per_second: 2.238128}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000026422, iterations_per_second: 37846.532311}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.007957808, iterations_per_second: 125.662751}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.042868883, iterations_per_second: 23.326943}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000025361, iterations_per_second: 39429.844449}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003781152, iterations_per_second: 264.469688}
