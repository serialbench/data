platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003154, iterations_per_second: 317087.864637}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000002997, iterations_per_second: 333722.675709}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001231961, iterations_per_second: 811.713788}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002901192, iterations_per_second: 344.685948}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016684046, iterations_per_second: 59.937500}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.035915732, iterations_per_second: 27.842952}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001341, iterations_per_second: 745712.157813}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001092035, iterations_per_second: 915.721845}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.034858527, iterations_per_second: 28.687385}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004773, iterations_per_second: 209507.448011}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004796, iterations_per_second: 208498.394331}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002161078, iterations_per_second: 462.731954}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004395620, iterations_per_second: 227.499210}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.036068010, iterations_per_second: 27.725400}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055728560, iterations_per_second: 17.944121}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001558, iterations_per_second: 641724.954647}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001362320, iterations_per_second: 734.041928}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.043028902, iterations_per_second: 23.240193}
  xpath:
  xslt:
