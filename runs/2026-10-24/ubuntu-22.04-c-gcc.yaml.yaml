platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.40', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.40', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.40', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004086, iterations_per_second: 244732.139978}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007011, iterations_per_second: 142622.833974}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001640990, iterations_per_second: 609.388235}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003742236, iterations_per_second: 267.219943}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021539409, iterations_per_second: 46.426529}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.046206456, iterations_per_second: 21.641997}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001638, iterations_per_second: 610314.312586}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001353097, iterations_per_second: 739.045498}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.043990350, iterations_per_second: 22.732258}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006141, iterations_per_second: 162834.624757}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006211, iterations_per_second: 160996.892727}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002766704, iterations_per_second: 361.440862}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005620930, iterations_per_second: 177.906503}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.047157677, iterations_per_second: 21.205455}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.071329498, iterations_per_second: 14.019445}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002935, iterations_per_second: 340669.074819}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001763815, iterations_per_second: 566.952991}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.047914336, iterations_per_second: 20.870580}
  xpath:
  xslt:
