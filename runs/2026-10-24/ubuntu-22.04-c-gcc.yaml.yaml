platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.41', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.41', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.41', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002280, iterations_per_second: 438519.556395}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000002323, iterations_per_second: 430385.195531}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000877370, iterations_per_second: 1139.770427}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002211127, iterations_per_second: 452.257988}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.012235924, iterations_per_second: 81.726562}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.026168982, iterations_per_second: 38.213179}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001036, iterations_per_second: 965623.796553}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000750123, iterations_per_second: 1333.114703}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020036669, iterations_per_second: 49.908495}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003429, iterations_per_second: 291621.708150}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003973, iterations_per_second: 251698.967870}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001532364, iterations_per_second: 652.586461}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003385720, iterations_per_second: 295.358122}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023772184, iterations_per_second: 42.065971}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.043048077, iterations_per_second: 23.229841}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001162, iterations_per_second: 860807.434335}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000923866, iterations_per_second: 1082.408445}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.022489740, iterations_per_second: 44.464720}
  xpath:
  xslt:
