platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.42', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.42', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.8', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.42', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004872, iterations_per_second: 205246.089932}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006566, iterations_per_second: 152292.767516}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001811417, iterations_per_second: 552.053898}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004567640, iterations_per_second: 218.931439}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024493076, iterations_per_second: 40.827865}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055921168, iterations_per_second: 17.882316}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001820, iterations_per_second: 549329.818913}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001939691, iterations_per_second: 515.546033}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.046794081, iterations_per_second: 21.370224}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006958, iterations_per_second: 143717.394135}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007297, iterations_per_second: 137048.254701}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002990295, iterations_per_second: 334.415166}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006694065, iterations_per_second: 149.386061}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.047516766, iterations_per_second: 21.045203}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085195272, iterations_per_second: 11.737741}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002024, iterations_per_second: 494119.972561}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002354877, iterations_per_second: 424.650689}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.051089286, iterations_per_second: 19.573576}
  xpath:
  xslt:
