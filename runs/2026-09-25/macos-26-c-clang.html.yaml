    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001043000, iterations_per_second: 958.772771}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004163000, iterations_per_second: 240.211386}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001115000, iterations_per_second: 896.860987}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.013577000, iterations_per_second: 73.653974}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.023044000, iterations_per_second: 43.395244}
