platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.239', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.21', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.21', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.21', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000615, iterations_per_second: 1625487.646973}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002142, iterations_per_second: 466853.408118}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000083924, iterations_per_second: 11915.589961}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000209165, iterations_per_second: 4780.922208}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001570629, iterations_per_second: 636.687595}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002406482, iterations_per_second: 415.544351}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000926, iterations_per_second: 1080263.582412}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000129836, iterations_per_second: 7702.024092}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002060645, iterations_per_second: 485.284947}
  xpath:
  xslt:
