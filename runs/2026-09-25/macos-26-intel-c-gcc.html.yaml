platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.239', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.21', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.21', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.21', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.895401}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007600, iterations_per_second: 131578.947307}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007700, iterations_per_second: 129870.129623}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002600000, iterations_per_second: 384.615385}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004986667, iterations_per_second: 200.534759}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002264667, iterations_per_second: 441.566088}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.029271000, iterations_per_second: 34.163507}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.059392000, iterations_per_second: 16.837284}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.023222000, iterations_per_second: 43.062613}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000007700, iterations_per_second: 129870.129623}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009700, iterations_per_second: 103092.783403}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003702333, iterations_per_second: 270.099937}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003280667, iterations_per_second: 304.816094}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.043276000, iterations_per_second: 23.107496}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.034213000, iterations_per_second: 29.228656}
  xpath:
  xslt:
