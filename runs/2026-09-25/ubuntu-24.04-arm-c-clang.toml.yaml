platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.239', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.21', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.21', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.21', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000553, iterations_per_second: 1809299.805954}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002109, iterations_per_second: 474225.825851}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000060458, iterations_per_second: 16540.499415}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000195191, iterations_per_second: 5123.187032}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001071144, iterations_per_second: 933.581293}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002387873, iterations_per_second: 418.782741}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000778, iterations_per_second: 1284686.533387}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000091701, iterations_per_second: 10905.006488}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001473640, iterations_per_second: 678.591786}
  xpath:
  xslt:
