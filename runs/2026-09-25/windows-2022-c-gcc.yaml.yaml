    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007282100, iterations_per_second: 137.323025}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025668600, iterations_per_second: 38.958104}
