    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009700, iterations_per_second: 103092.783403}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.004231000, iterations_per_second: 236.350745}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.008127667, iterations_per_second: 123.036542}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002990333, iterations_per_second: 334.410879}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.037832000, iterations_per_second: 26.432650}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.069375000, iterations_per_second: 14.414414}
