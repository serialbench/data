platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.240', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.21', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.21', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.21', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000759, iterations_per_second: 1317175.974209}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000894, iterations_per_second: 1118568.230792}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000584573, iterations_per_second: 1710.651313}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001358029, iterations_per_second: 736.361481}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013304182, iterations_per_second: 75.164336}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.028618669, iterations_per_second: 34.942226}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000325, iterations_per_second: 3076923.084692}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000315788, iterations_per_second: 3166.684787}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003861851, iterations_per_second: 258.943186}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001427, iterations_per_second: 700623.554718}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001157, iterations_per_second: 864603.146262}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001819497, iterations_per_second: 549.602344}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001773300, iterations_per_second: 563.920268}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022173254, iterations_per_second: 45.099380}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032519735, iterations_per_second: 30.750558}
  xpath:
  xslt:
