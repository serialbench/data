    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000783333, iterations_per_second: 1276.595745}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001803333, iterations_per_second: 554.528651}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007626000, iterations_per_second: 131.130344}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.021087000, iterations_per_second: 47.422583}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000324000, iterations_per_second: 3086.419753}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003970000, iterations_per_second: 251.889169}
  generation:
