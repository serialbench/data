platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.239', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.21', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.21', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.21', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000567, iterations_per_second: 1763046.548739}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003205, iterations_per_second: 311973.544349}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000059521, iterations_per_second: 16800.698908}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000315931, iterations_per_second: 3165.244769}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001085968, iterations_per_second: 920.837446}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003763953, iterations_per_second: 265.678131}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000764, iterations_per_second: 1308900.517516}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000091375, iterations_per_second: 10943.872527}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001479615, iterations_per_second: 675.851488}
  xpath:
  xslt:
