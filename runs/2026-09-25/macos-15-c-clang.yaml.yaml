    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001201333, iterations_per_second: 832.408435}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004058000, iterations_per_second: 246.426811}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024316000, iterations_per_second: 41.125185}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057999000, iterations_per_second: 17.241677}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000003892, iterations_per_second: 256957.113216}
