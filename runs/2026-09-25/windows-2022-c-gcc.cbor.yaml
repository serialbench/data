    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001455567, iterations_per_second: 687.017656}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003403767, iterations_per_second: 293.792171}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012096300, iterations_per_second: 82.669907}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.051214800, iterations_per_second: 19.525606}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000370, iterations_per_second: 2702702.717831}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000367700, iterations_per_second: 2719.608376}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004631400, iterations_per_second: 215.917433}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002380, iterations_per_second: 420168.067083}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003120, iterations_per_second: 320512.820271}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002215167, iterations_per_second: 451.433301}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004022867, iterations_per_second: 248.578957}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021580400, iterations_per_second: 46.338344}
