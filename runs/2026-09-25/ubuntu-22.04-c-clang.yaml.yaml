platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.240', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.21', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.21', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.21', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004420, iterations_per_second: 226228.989047}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003518, iterations_per_second: 284268.576800}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001268554, iterations_per_second: 788.299326}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003191589, iterations_per_second: 313.323584}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.017268821, iterations_per_second: 57.907833}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.039101701, iterations_per_second: 25.574335}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000907, iterations_per_second: 1102292.767543}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000925809, iterations_per_second: 1080.136400}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027599311, iterations_per_second: 36.232789}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006048, iterations_per_second: 165335.714171}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005500, iterations_per_second: 181814.876117}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002195613, iterations_per_second: 455.453671}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004709910, iterations_per_second: 212.318267}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.034158479, iterations_per_second: 29.275308}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.058260216, iterations_per_second: 17.164372}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001105, iterations_per_second: 904568.069775}
