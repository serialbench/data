platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.239', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.21', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.21', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.21', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.713189}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270122}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006200, iterations_per_second: 161290.322544}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001009000, iterations_per_second: 991.080278}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002120333, iterations_per_second: 471.623958}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001205000, iterations_per_second: 829.875519}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.012608000, iterations_per_second: 79.314721}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.023446000, iterations_per_second: 42.651198}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011193000, iterations_per_second: 89.341553}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.333228}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000013300, iterations_per_second: 75187.969922}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001333667, iterations_per_second: 749.812547}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001990333, iterations_per_second: 502.428404}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.024083000, iterations_per_second: 41.523066}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019779000, iterations_per_second: 50.558673}
  xpath:
  xslt:
