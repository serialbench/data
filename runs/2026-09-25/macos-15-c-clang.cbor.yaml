    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000558667, iterations_per_second: 1789.976134}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001468333, iterations_per_second: 681.044268}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010558000, iterations_per_second: 94.714908}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.028363000, iterations_per_second: 35.257201}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000318667, iterations_per_second: 3138.075314}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004105000, iterations_per_second: 243.605359}
  generation:
