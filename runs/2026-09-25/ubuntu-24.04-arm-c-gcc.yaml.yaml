platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.239', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.21', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.21', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.21', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004650, iterations_per_second: 215049.138794}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004039, iterations_per_second: 247592.166235}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001692089, iterations_per_second: 590.985462}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003972948, iterations_per_second: 251.702284}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.022538698, iterations_per_second: 44.368135}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047874398, iterations_per_second: 20.887991}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001188, iterations_per_second: 841750.842587}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001154399, iterations_per_second: 866.251617}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028299033, iterations_per_second: 35.336896}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004296, iterations_per_second: 232790.930438}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006172, iterations_per_second: 162011.535133}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002799952, iterations_per_second: 357.148937}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005534272, iterations_per_second: 180.692239}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.041569284, iterations_per_second: 24.056224}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.069045802, iterations_per_second: 14.483140}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001443, iterations_per_second: 692952.670806}
