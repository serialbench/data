    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000714000, iterations_per_second: 1400.560224}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002165667, iterations_per_second: 461.751578}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006549000, iterations_per_second: 152.695068}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018504000, iterations_per_second: 54.042369}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000346000, iterations_per_second: 2890.173410}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005479000, iterations_per_second: 182.515057}
  generation:
