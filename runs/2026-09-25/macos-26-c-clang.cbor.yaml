    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270122}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001134000, iterations_per_second: 881.834215}
