platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.239', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.21', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.21', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.21', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.663297}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285508}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000073667, iterations_per_second: 13574.660633}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000408667, iterations_per_second: 2446.982055}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001072000, iterations_per_second: 932.835821}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004384000, iterations_per_second: 228.102190}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002100, iterations_per_second: 476190.474815}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000140000, iterations_per_second: 7142.857142}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001877000, iterations_per_second: 532.765051}
  xpath:
  xslt:
