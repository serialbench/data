platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.239', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.21', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.21', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.21', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000012500, iterations_per_second: 79999.999984}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000022200, iterations_per_second: 45045.045055}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001181667, iterations_per_second: 846.262341}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004007000, iterations_per_second: 249.563264}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.018767000, iterations_per_second: 53.285022}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.063486000, iterations_per_second: 15.751504}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002421, iterations_per_second: 413086.582718}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001158667, iterations_per_second: 863.060990}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.014228500, iterations_per_second: 70.281477}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000015800, iterations_per_second: 63291.139241}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000024200, iterations_per_second: 41322.314047}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002493333, iterations_per_second: 401.069519}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008121667, iterations_per_second: 123.127437}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.032152000, iterations_per_second: 31.102264}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.092063000, iterations_per_second: 10.862127}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000005075, iterations_per_second: 197044.334921}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001778181, iterations_per_second: 562.372552}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.017795667, iterations_per_second: 56.193454}
  xpath:
  xslt:
