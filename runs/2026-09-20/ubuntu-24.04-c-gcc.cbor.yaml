platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.209', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.11', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.11', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.11', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000756, iterations_per_second: 1322751.322709}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000903, iterations_per_second: 1107174.489677}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000600851, iterations_per_second: 1664.307049}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001461930, iterations_per_second: 684.027279}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010529733, iterations_per_second: 94.969170}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.027476126, iterations_per_second: 36.395233}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000321, iterations_per_second: 3115264.808683}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000252277, iterations_per_second: 3963.902065}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003000149, iterations_per_second: 333.316779}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001580, iterations_per_second: 632951.452204}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001158, iterations_per_second: 863930.885377}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001848574, iterations_per_second: 540.957516}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001842871, iterations_per_second: 542.631579}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.019692940, iterations_per_second: 50.779619}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035405810, iterations_per_second: 28.243952}
  xpath:
  xslt:
