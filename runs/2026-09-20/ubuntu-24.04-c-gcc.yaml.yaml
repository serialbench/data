platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.209', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.11', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.11', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.11', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004945, iterations_per_second: 202232.648444}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003629, iterations_per_second: 275588.381327}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001156167, iterations_per_second: 864.927202}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003338081, iterations_per_second: 299.573348}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016738149, iterations_per_second: 59.743763}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.039599869, iterations_per_second: 25.252609}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001050, iterations_per_second: 952380.952208}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001028175, iterations_per_second: 972.597393}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020425037, iterations_per_second: 48.959520}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005924, iterations_per_second: 168793.464320}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005596, iterations_per_second: 178708.651284}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001872637, iterations_per_second: 534.006419}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004794890, iterations_per_second: 208.555343}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026828559, iterations_per_second: 37.273713}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057696181, iterations_per_second: 17.332170}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001277, iterations_per_second: 783024.040487}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001263089, iterations_per_second: 791.709639}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.023975475, iterations_per_second: 41.709288}
  xpath:
  xslt:
