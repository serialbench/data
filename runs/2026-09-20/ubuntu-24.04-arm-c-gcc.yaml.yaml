platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.209', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.11', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.11', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.11', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003103, iterations_per_second: 322268.772131}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004025, iterations_per_second: 248478.071585}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001731502, iterations_per_second: 577.533374}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003920423, iterations_per_second: 255.074538}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025907984, iterations_per_second: 38.598140}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047743010, iterations_per_second: 20.945475}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001183, iterations_per_second: 845237.089375}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001160012, iterations_per_second: 862.059800}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026616508, iterations_per_second: 37.570669}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004095, iterations_per_second: 244206.207835}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006107, iterations_per_second: 163751.883202}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002572393, iterations_per_second: 388.743139}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005523908, iterations_per_second: 181.031244}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.037531260, iterations_per_second: 26.644456}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068852713, iterations_per_second: 14.523756}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001453, iterations_per_second: 688325.990794}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001430251, iterations_per_second: 699.177976}
