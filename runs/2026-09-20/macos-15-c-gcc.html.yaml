platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.209', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.11', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.11', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.11', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005400, iterations_per_second: 185185.185165}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000009100, iterations_per_second: 109890.109893}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009700, iterations_per_second: 103092.783494}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001534000, iterations_per_second: 651.890482}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002792333, iterations_per_second: 358.123433}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001043000, iterations_per_second: 958.772771}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022587000, iterations_per_second: 44.273255}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.064390000, iterations_per_second: 15.530362}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011512000, iterations_per_second: 86.865879}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006600, iterations_per_second: 151515.151571}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000011700, iterations_per_second: 85470.085457}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001626000, iterations_per_second: 615.006150}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001344333, iterations_per_second: 743.863129}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021428000, iterations_per_second: 46.667911}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.016293000, iterations_per_second: 61.376051}
  xpath:
  xslt:
