platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.209', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.11', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.11', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.11', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000560, iterations_per_second: 1785714.301098}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003405, iterations_per_second: 293720.260857}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000058375, iterations_per_second: 17130.620985}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000312050, iterations_per_second: 3204.618068}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001068525, iterations_per_second: 935.869540}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003760747, iterations_per_second: 265.904619}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000768, iterations_per_second: 1302252.893995}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000093173, iterations_per_second: 10732.761398}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001476323, iterations_per_second: 677.358546}
  xpath:
  xslt:
