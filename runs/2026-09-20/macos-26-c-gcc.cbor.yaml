platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.209', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.11', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.11', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.11', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 769230.771173}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256684}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000452333, iterations_per_second: 2210.759027}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001456667, iterations_per_second: 686.498856}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006285000, iterations_per_second: 159.108990}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018483000, iterations_per_second: 54.103771}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000369667, iterations_per_second: 2705.139765}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004116000, iterations_per_second: 242.954325}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.293636}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 400000.000100}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000950667, iterations_per_second: 1051.893408}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001746333, iterations_per_second: 572.628364}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012815000, iterations_per_second: 78.033554}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023401000, iterations_per_second: 42.733217}
  xpath:
  xslt:
