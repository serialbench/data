platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.209', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.11', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.11', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.11', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.911386}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.335437}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000525667, iterations_per_second: 1902.346227}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001311333, iterations_per_second: 762.582613}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006883000, iterations_per_second: 145.285486}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018693000, iterations_per_second: 53.495961}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000345667, iterations_per_second: 2892.960463}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004202000, iterations_per_second: 237.981913}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.293636}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002100, iterations_per_second: 476190.476104}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001106333, iterations_per_second: 903.886713}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001684000, iterations_per_second: 593.824228}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013753000, iterations_per_second: 72.711408}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023268000, iterations_per_second: 42.977480}
  xpath:
  xslt:
