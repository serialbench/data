    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001273667, iterations_per_second: 785.134781}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003715667, iterations_per_second: 269.130708}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.017278000, iterations_per_second: 57.877069}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047599000, iterations_per_second: 21.008845}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000950, iterations_per_second: 1052631.575307}
