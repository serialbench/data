    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666614}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001998667, iterations_per_second: 500.333556}
