    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009100, iterations_per_second: 109890.109893}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002051000, iterations_per_second: 487.567040}
