    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001176000, iterations_per_second: 850.340136}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004221333, iterations_per_second: 236.891977}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016824000, iterations_per_second: 59.438897}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057921000, iterations_per_second: 17.264895}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000988, iterations_per_second: 1012658.223118}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000841486, iterations_per_second: 1188.373900}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018272167, iterations_per_second: 54.728046}
  generation:
