platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.209', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.11', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.11', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.11', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.909037}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000702667, iterations_per_second: 1423.149905}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001326000, iterations_per_second: 754.147813}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007440000, iterations_per_second: 134.408602}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.025832000, iterations_per_second: 38.711675}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000536667, iterations_per_second: 1863.354037}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004377000, iterations_per_second: 228.466987}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.667087}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.667087}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001132000, iterations_per_second: 883.392226}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001678333, iterations_per_second: 595.829196}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.018089000, iterations_per_second: 55.282216}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035926000, iterations_per_second: 27.834994}
  xpath:
  xslt:
