    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000012400, iterations_per_second: 80645.161291}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003795333, iterations_per_second: 263.481468}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004828000, iterations_per_second: 207.125104}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001485667, iterations_per_second: 673.098497}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.034905000, iterations_per_second: 28.649191}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.048075000, iterations_per_second: 20.800832}
