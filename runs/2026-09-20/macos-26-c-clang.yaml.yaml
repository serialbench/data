    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000024000, iterations_per_second: 41666.666668}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003292667, iterations_per_second: 303.705203}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.010371667, iterations_per_second: 96.416519}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.046480000, iterations_per_second: 21.514630}
