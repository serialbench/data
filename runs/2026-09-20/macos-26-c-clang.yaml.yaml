    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003426667, iterations_per_second: 291.828794}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005889000, iterations_per_second: 169.808117}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.032324000, iterations_per_second: 30.936765}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.108408000, iterations_per_second: 9.224411}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002683, iterations_per_second: 372661.549031}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000998667, iterations_per_second: 1001.335113}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.017868917, iterations_per_second: 55.963101}
  generation:
