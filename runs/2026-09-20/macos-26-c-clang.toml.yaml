platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.209', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.11', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.11', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.11', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001000, iterations_per_second: 1000000.002525}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.586064}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000044667, iterations_per_second: 22388.059701}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000207333, iterations_per_second: 4823.151125}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000619000, iterations_per_second: 1615.508885}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003949000, iterations_per_second: 253.228665}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001000, iterations_per_second: 999999.999683}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000089000, iterations_per_second: 11235.955056}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000963000, iterations_per_second: 1038.421599}
  xpath:
  xslt:
