    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000007800, iterations_per_second: 128205.128202}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002780333, iterations_per_second: 359.669104}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002010333, iterations_per_second: 497.429945}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.026766000, iterations_per_second: 37.360831}
