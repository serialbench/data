    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000904667, iterations_per_second: 1105.379514}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002332000, iterations_per_second: 428.816467}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.009063000, iterations_per_second: 110.338740}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023046000, iterations_per_second: 43.391478}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000825000, iterations_per_second: 1212.121212}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005787000, iterations_per_second: 172.801106}
  generation:
