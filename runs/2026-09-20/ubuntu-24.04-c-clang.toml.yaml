platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.209', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.11', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.11', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.11', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000578, iterations_per_second: 1729804.532475}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002120, iterations_per_second: 471698.113387}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000071024, iterations_per_second: 14079.813770}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000212559, iterations_per_second: 4704.576141}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001496651, iterations_per_second: 668.158442}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002349694, iterations_per_second: 425.587332}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000883, iterations_per_second: 1133016.089033}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000120633, iterations_per_second: 8289.582758}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002016999, iterations_per_second: 495.786066}
  xpath:
  xslt:
