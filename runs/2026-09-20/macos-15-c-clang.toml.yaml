platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.209', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.11', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.11', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.11', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000500, iterations_per_second: 2000000.005050}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000012300, iterations_per_second: 81300.812988}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000040667, iterations_per_second: 24590.163939}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000192667, iterations_per_second: 5190.311419}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000863000, iterations_per_second: 1158.748552}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002137000, iterations_per_second: 467.945718}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000700, iterations_per_second: 1428571.432178}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000083333, iterations_per_second: 12000.000000}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001045000, iterations_per_second: 956.937799}
  xpath:
  xslt:
