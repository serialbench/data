platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.209', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.11', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.11', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.11', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.555204}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285972}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.777602}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001665667, iterations_per_second: 600.360216}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002881333, iterations_per_second: 347.061546}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001048667, iterations_per_second: 953.591863}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021896000, iterations_per_second: 45.670442}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.033554000, iterations_per_second: 29.802706}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012511000, iterations_per_second: 79.929662}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608719}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.727259}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001800000, iterations_per_second: 555.555556}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001437667, iterations_per_second: 695.571528}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.030376000, iterations_per_second: 32.920727}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015288000, iterations_per_second: 65.410780}
  xpath:
  xslt:
