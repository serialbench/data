    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000020970, iterations_per_second: 47687.172144}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003131000, iterations_per_second: 319.386777}
