    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002266633, iterations_per_second: 441.182959}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007261400, iterations_per_second: 137.714490}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.027596200, iterations_per_second: 36.236873}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.088068100, iterations_per_second: 11.354849}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001470, iterations_per_second: 680272.105826}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002148600, iterations_per_second: 465.419343}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027273200, iterations_per_second: 36.666031}
  generation:
