platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.209', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.11', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.11', features: {}}
    - {name: jansson, format: json, version: '2.15.0', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.11', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000005200, iterations_per_second: 192307.691952}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005410, iterations_per_second: 184842.883355}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000114167, iterations_per_second: 8759.124088}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000635833, iterations_per_second: 1572.739187}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001232800, iterations_per_second: 811.161583}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.007486400, iterations_per_second: 133.575550}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000005720, iterations_per_second: 174825.174780}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000150267, iterations_per_second: 6654.835846}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001973500, iterations_per_second: 506.713960}
  xpath:
  xslt:
