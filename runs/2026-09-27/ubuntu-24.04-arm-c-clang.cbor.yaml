platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.260', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.26', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.26', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.26', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001073, iterations_per_second: 932140.193315}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001174, iterations_per_second: 851571.151736}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000703765, iterations_per_second: 1420.929534}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001757512, iterations_per_second: 568.986266}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015334642, iterations_per_second: 65.211826}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031319380, iterations_per_second: 31.929112}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000385, iterations_per_second: 2598752.594872}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000370552, iterations_per_second: 2698.676569}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004861599, iterations_per_second: 205.693641}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001817, iterations_per_second: 550448.615396}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001457, iterations_per_second: 686483.147131}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001914271, iterations_per_second: 522.392166}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002022142, iterations_per_second: 494.525194}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.024236942, iterations_per_second: 41.259330}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034961066, iterations_per_second: 28.603247}
  xpath:
  xslt:
