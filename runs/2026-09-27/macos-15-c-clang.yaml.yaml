    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001000000, iterations_per_second: 1000.000000}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004324333, iterations_per_second: 231.249518}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.014706000, iterations_per_second: 67.999456}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.053552000, iterations_per_second: 18.673439}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000967, iterations_per_second: 1034447.091020}
