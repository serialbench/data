platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.260', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.26', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.26', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.26', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.335437}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.371305}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238052}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000476333, iterations_per_second: 2099.370189}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001172667, iterations_per_second: 852.757248}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001024333, iterations_per_second: 976.244712}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003814000, iterations_per_second: 262.191924}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.012145000, iterations_per_second: 82.338411}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012056000, iterations_per_second: 82.946251}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.667719}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005200, iterations_per_second: 192307.692373}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000805000, iterations_per_second: 1242.236025}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001403000, iterations_per_second: 712.758375}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007644000, iterations_per_second: 130.821559}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014905000, iterations_per_second: 67.091580}
