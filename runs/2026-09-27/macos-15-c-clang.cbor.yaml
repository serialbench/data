platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.260', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.26', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.26', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.26', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.911386}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.327542}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000629667, iterations_per_second: 1588.141874}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001424667, iterations_per_second: 701.918577}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.008135000, iterations_per_second: 122.925630}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.019626000, iterations_per_second: 50.952818}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000328333, iterations_per_second: 3045.685279}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004728000, iterations_per_second: 211.505922}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.295603}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.663297}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001175667, iterations_per_second: 850.581231}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001868333, iterations_per_second: 535.236396}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015594000, iterations_per_second: 64.127228}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023758000, iterations_per_second: 42.091085}
  xpath:
  xslt:
