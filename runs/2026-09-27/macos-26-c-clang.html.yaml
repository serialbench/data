platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.260', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.26', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.26', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.26', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384325}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009100, iterations_per_second: 109890.109893}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000393333, iterations_per_second: 2542.372881}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001223000, iterations_per_second: 817.661488}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001046333, iterations_per_second: 955.718382}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003817000, iterations_per_second: 261.985853}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.013701000, iterations_per_second: 72.987373}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010502000, iterations_per_second: 95.219958}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370136}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666693}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000798333, iterations_per_second: 1252.609603}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001395333, iterations_per_second: 716.674630}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007776000, iterations_per_second: 128.600823}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014387000, iterations_per_second: 69.507194}
  xpath:
  xslt:
