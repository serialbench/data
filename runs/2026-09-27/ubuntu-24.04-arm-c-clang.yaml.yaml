    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003982, iterations_per_second: 251117.472991}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001644052, iterations_per_second: 608.253390}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003955625, iterations_per_second: 252.804572}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021665722, iterations_per_second: 46.155859}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047998895, iterations_per_second: 20.833813}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001160, iterations_per_second: 862143.287915}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001211722, iterations_per_second: 825.271803}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029176840, iterations_per_second: 34.273760}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006190, iterations_per_second: 161550.888552}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006031, iterations_per_second: 165812.731125}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002713939, iterations_per_second: 368.468074}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005574707, iterations_per_second: 179.381636}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040079105, iterations_per_second: 24.950657}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.069128640, iterations_per_second: 14.465784}
