    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.425727}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001783667, iterations_per_second: 560.642871}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.005369000, iterations_per_second: 186.254424}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015509000, iterations_per_second: 64.478690}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.077480000, iterations_per_second: 12.906557}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000500, iterations_per_second: 2000000.050524}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000504000, iterations_per_second: 1984.126984}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.008932000, iterations_per_second: 111.957009}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.727847}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000005900, iterations_per_second: 169491.525525}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001587000, iterations_per_second: 630.119723}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.005468667, iterations_per_second: 182.859929}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.029131000, iterations_per_second: 34.327692}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.076839000, iterations_per_second: 13.014225}
