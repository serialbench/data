platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.260', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.26', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.26', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.26', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000596, iterations_per_second: 1678415.574938}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003890, iterations_per_second: 257082.626264}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000063780, iterations_per_second: 15678.814263}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000408181, iterations_per_second: 2449.891551}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001160051, iterations_per_second: 862.031066}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004717118, iterations_per_second: 211.993849}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000830, iterations_per_second: 1204383.959476}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000116785, iterations_per_second: 8562.719063}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001548365, iterations_per_second: 645.842550}
  xpath:
  xslt:
