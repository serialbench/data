platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.260', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.26', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.26', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.26', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000014200, iterations_per_second: 70422.535051}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000017700, iterations_per_second: 56497.175175}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.004794667, iterations_per_second: 208.565072}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.016091667, iterations_per_second: 62.143967}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.051648000, iterations_per_second: 19.361834}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.187454000, iterations_per_second: 5.334642}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344803.803701}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.004021082, iterations_per_second: 248.689263}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.059453808, iterations_per_second: 16.819780}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000027000, iterations_per_second: 37037.037037}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000032100, iterations_per_second: 31152.647976}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.007533667, iterations_per_second: 132.737489}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.020453000, iterations_per_second: 48.892583}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.105303000, iterations_per_second: 9.496406}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.252035000, iterations_per_second: 3.967703}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000004570, iterations_per_second: 218832.747676}
