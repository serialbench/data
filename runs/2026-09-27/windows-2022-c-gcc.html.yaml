    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007400, iterations_per_second: 135135.135165}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000436367, iterations_per_second: 2291.650752}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001730000, iterations_per_second: 578.034682}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001908300, iterations_per_second: 524.026621}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004472800, iterations_per_second: 223.573600}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.017391800, iterations_per_second: 57.498361}
