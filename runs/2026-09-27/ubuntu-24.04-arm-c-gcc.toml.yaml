platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.260', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.26', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.26', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.26', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000554, iterations_per_second: 1806358.380425}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003149, iterations_per_second: 317510.716255}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000059204, iterations_per_second: 16890.655526}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000312347, iterations_per_second: 3201.570904}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001072864, iterations_per_second: 932.084589}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003758400, iterations_per_second: 266.070668}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000758, iterations_per_second: 1319957.766031}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000093200, iterations_per_second: 10729.613734}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001470928, iterations_per_second: 679.842929}
  xpath:
  xslt:
