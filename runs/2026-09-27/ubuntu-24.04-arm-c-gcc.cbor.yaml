platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.260', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.26', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.26', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.26', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000999, iterations_per_second: 1000900.809419}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001262, iterations_per_second: 792204.703693}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000713528, iterations_per_second: 1401.486042}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001883805, iterations_per_second: 530.840412}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014610164, iterations_per_second: 68.445501}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030767891, iterations_per_second: 32.501415}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000382, iterations_per_second: 2615062.739498}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000333335, iterations_per_second: 2999.988000}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004261171, iterations_per_second: 234.677275}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001715, iterations_per_second: 583056.383190}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001560, iterations_per_second: 641066.735297}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001914438, iterations_per_second: 522.346415}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002157933, iterations_per_second: 463.406417}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023345957, iterations_per_second: 42.833969}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035800120, iterations_per_second: 27.932867}
  xpath:
  xslt:
