    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.010218333, iterations_per_second: 97.863318}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.041415000, iterations_per_second: 24.145841}
