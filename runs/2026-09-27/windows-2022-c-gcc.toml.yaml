platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.260', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.26', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.26', features: {}}
    - {name: jansson, format: json, version: '2.15.0', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.26', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000003480, iterations_per_second: 287356.321532}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005500, iterations_per_second: 181818.181901}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000109000, iterations_per_second: 9174.311926}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000641233, iterations_per_second: 1559.494724}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001317700, iterations_per_second: 758.898080}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.007325600, iterations_per_second: 136.507590}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000004070, iterations_per_second: 245700.245703}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000136933, iterations_per_second: 7302.823759}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002001300, iterations_per_second: 499.675211}
  xpath:
  xslt:
