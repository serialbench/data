platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.260', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.26', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.26', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.26', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.909037}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 769230.769491}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000599333, iterations_per_second: 1668.520578}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001364000, iterations_per_second: 733.137830}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007142000, iterations_per_second: 140.016802}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.027828000, iterations_per_second: 35.935029}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000328000, iterations_per_second: 3048.780488}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003928000, iterations_per_second: 254.582485}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.000468}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.000468}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001131000, iterations_per_second: 884.173298}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002142000, iterations_per_second: 466.853408}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014676000, iterations_per_second: 68.138457}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.022883000, iterations_per_second: 43.700564}
  xpath:
  xslt:
