platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.260', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.26', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.26', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.26', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.607644}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005800, iterations_per_second: 172413.792863}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000131333, iterations_per_second: 7614.213195}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000643667, iterations_per_second: 1553.599172}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001742000, iterations_per_second: 574.052813}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.007937000, iterations_per_second: 125.992188}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000003100, iterations_per_second: 322580.644793}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000233667, iterations_per_second: 4279.600571}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.003386000, iterations_per_second: 295.333727}
  xpath:
  xslt:
