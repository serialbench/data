platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.260', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.26', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.26', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.26', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005009, iterations_per_second: 199632.675896}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004056, iterations_per_second: 246548.323544}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001330036, iterations_per_second: 751.859348}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003720247, iterations_per_second: 268.799333}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019087979, iterations_per_second: 52.388993}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.044816094, iterations_per_second: 22.313413}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001556, iterations_per_second: 642797.454623}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001373507, iterations_per_second: 728.063095}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.037993225, iterations_per_second: 26.320482}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006971, iterations_per_second: 143445.268454}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008001, iterations_per_second: 124985.939080}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002500657, iterations_per_second: 399.894961}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005708036, iterations_per_second: 175.191607}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.038008661, iterations_per_second: 26.309793}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.072342132, iterations_per_second: 13.823203}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001861, iterations_per_second: 537316.640651}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001535147, iterations_per_second: 651.403275}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.041294994, iterations_per_second: 24.216010}
  xpath:
  xslt:
