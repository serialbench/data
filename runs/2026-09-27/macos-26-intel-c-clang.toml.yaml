platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.260', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.26', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.26', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.26', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.331649}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000007000, iterations_per_second: 142857.142754}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000140000, iterations_per_second: 7142.857145}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000675333, iterations_per_second: 1480.750247}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001393000, iterations_per_second: 717.875090}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.007558000, iterations_per_second: 132.310135}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 250000.000631}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000207333, iterations_per_second: 4823.151129}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.003640000, iterations_per_second: 274.725275}
  xpath:
  xslt:
