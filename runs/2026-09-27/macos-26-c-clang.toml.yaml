platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.260', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.26', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.26', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.26', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.110408}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270330}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000045333, iterations_per_second: 22058.823530}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000188667, iterations_per_second: 5300.353357}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000581000, iterations_per_second: 1721.170396}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002263000, iterations_per_second: 441.891295}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.909037}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000070333, iterations_per_second: 14218.009480}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001082000, iterations_per_second: 924.214418}
  xpath:
  xslt:
