    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001472333, iterations_per_second: 679.194023}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003402433, iterations_per_second: 293.907302}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011761900, iterations_per_second: 85.020277}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.048117500, iterations_per_second: 20.782460}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000360, iterations_per_second: 2777777.811107}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000357367, iterations_per_second: 2798.246432}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004467100, iterations_per_second: 223.858879}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002390, iterations_per_second: 418410.042300}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003080, iterations_per_second: 324675.324776}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002071667, iterations_per_second: 482.703138}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004088900, iterations_per_second: 244.564553}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021302100, iterations_per_second: 46.943729}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.060104200, iterations_per_second: 16.637772}
