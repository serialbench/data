platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.260', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.26', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.26', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.26', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000892, iterations_per_second: 1120950.565739}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000932, iterations_per_second: 1073306.857618}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000588048, iterations_per_second: 1700.540488}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001547502, iterations_per_second: 646.202858}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014586289, iterations_per_second: 68.557534}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030046355, iterations_per_second: 33.281907}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000272, iterations_per_second: 3675119.439605}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000267438, iterations_per_second: 3739.179749}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003111456, iterations_per_second: 321.392943}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001680, iterations_per_second: 595202.666472}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001375, iterations_per_second: 727378.528504}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002037796, iterations_per_second: 490.726175}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001940282, iterations_per_second: 515.389000}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023896364, iterations_per_second: 41.847371}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035822856, iterations_per_second: 27.915139}
  xpath:
  xslt:
