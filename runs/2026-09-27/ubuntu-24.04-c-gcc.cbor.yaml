platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.260', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.26', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.26', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.27', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.26', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001010, iterations_per_second: 989902.989065}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001185, iterations_per_second: 843525.938651}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000684172, iterations_per_second: 1461.620050}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001830308, iterations_per_second: 546.356232}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013529131, iterations_per_second: 73.914577}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.049747389, iterations_per_second: 20.101557}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000332, iterations_per_second: 3007518.802015}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000293239, iterations_per_second: 3410.183718}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003862140, iterations_per_second: 258.923809}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001957, iterations_per_second: 511064.547944}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001584, iterations_per_second: 631313.131185}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002247853, iterations_per_second: 444.868948}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002309847, iterations_per_second: 432.929107}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.024496366, iterations_per_second: 40.822382}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.052737292, iterations_per_second: 18.961914}
  xpath:
  xslt:
