    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001746967, iterations_per_second: 572.420767}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007185367, iterations_per_second: 139.171743}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024026700, iterations_per_second: 41.620364}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.087539800, iterations_per_second: 11.423375}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001520, iterations_per_second: 657894.736535}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002181667, iterations_per_second: 458.365164}
