    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000019840, iterations_per_second: 50403.225810}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003206200, iterations_per_second: 311.895702}
