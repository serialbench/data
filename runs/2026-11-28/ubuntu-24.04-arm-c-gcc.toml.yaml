platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000545, iterations_per_second: 1835535.977845}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003190, iterations_per_second: 313459.970988}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000064217, iterations_per_second: 15572.119678}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000319385, iterations_per_second: 3131.017424}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001201100, iterations_per_second: 832.570144}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003783928, iterations_per_second: 264.275642}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000716, iterations_per_second: 1396843.133318}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000090810, iterations_per_second: 11012.003084}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001583436, iterations_per_second: 631.537997}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000002172, iterations_per_second: 460426.355044}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000278913, iterations_per_second: 3585.347402}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.003496106, iterations_per_second: 286.032517}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000001302, iterations_per_second: 767872.225580}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000050285, iterations_per_second: 19886.646119}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000699788, iterations_per_second: 1429.004213}
  xslt:
