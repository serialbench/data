platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000538, iterations_per_second: 1860465.116057}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003149, iterations_per_second: 317601.474126}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000064676, iterations_per_second: 15461.685946}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000323058, iterations_per_second: 3095.419398}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001229048, iterations_per_second: 813.637873}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003795865, iterations_per_second: 263.444564}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000719, iterations_per_second: 1390627.171155}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000090232, iterations_per_second: 11082.542780}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001566644, iterations_per_second: 638.307107}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000002173, iterations_per_second: 460108.585012}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000284274, iterations_per_second: 3517.732891}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.003553903, iterations_per_second: 281.380781}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000001304, iterations_per_second: 766929.978735}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000056074, iterations_per_second: 17833.577057}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000717846, iterations_per_second: 1393.056449}
  xslt:
