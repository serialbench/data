platform:
  platform_string: windows-2025-js-24.22.3
  kind: wasm
  os: windows
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000083390, iterations_per_second: 11991.845545}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.001094770, iterations_per_second: 913.433872}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.007591867, iterations_per_second: 131.719911}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.124818367, iterations_per_second: 8.011641}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.100832100, iterations_per_second: 9.917477}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.505590400, iterations_per_second: 0.664191}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000079640, iterations_per_second: 12556.504269}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000687460, iterations_per_second: 1454.630088}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.012305067, iterations_per_second: 81.267337}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.152649667, iterations_per_second: 6.550948}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.201884200, iterations_per_second: 4.953335}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.944127000, iterations_per_second: 0.514370}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000039850, iterations_per_second: 25094.102886}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.005243967, iterations_per_second: 190.695339}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.076204100, iterations_per_second: 13.122654}
