platform:
  platform_string: windows-2025-js-24.22.3
  kind: wasm
  os: windows
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000109570, iterations_per_second: 9126.585744}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000690690, iterations_per_second: 1447.827535}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.008315633, iterations_per_second: 120.255423}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.136847133, iterations_per_second: 7.307424}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.104272300, iterations_per_second: 9.590275}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.803111100, iterations_per_second: 0.554597}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000071430, iterations_per_second: 13999.720006}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000887850, iterations_per_second: 1126.316382}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.013987767, iterations_per_second: 71.491041}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.180491867, iterations_per_second: 5.540416}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.208204900, iterations_per_second: 4.802961}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 2.417676300, iterations_per_second: 0.413620}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000037270, iterations_per_second: 26831.231554}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.006541333, iterations_per_second: 152.874032}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.084041400, iterations_per_second: 11.898897}
