platform:
  platform_string: windows-2025-js-24.22.3
  kind: wasm
  os: windows
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: teptris-plan, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000078100, iterations_per_second: 12804.097311}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000519390, iterations_per_second: 1925.335490}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.007284033, iterations_per_second: 137.286577}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.112031000, iterations_per_second: 8.926101}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.091775300, iterations_per_second: 10.896178}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.379315600, iterations_per_second: 0.724997}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000063090, iterations_per_second: 15850.372484}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000798480, iterations_per_second: 1252.379521}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.013200333, iterations_per_second: 75.755663}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.143255900, iterations_per_second: 6.980515}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.184212300, iterations_per_second: 5.428519}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.991468400, iterations_per_second: 0.502142}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000033660, iterations_per_second: 29708.853238}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.005115100, iterations_per_second: 195.499599}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.073022800, iterations_per_second: 13.694353}
