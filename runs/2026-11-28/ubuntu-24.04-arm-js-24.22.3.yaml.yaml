platform:
  platform_string: ubuntu-24.04-arm-js-24.22.3
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000058402, iterations_per_second: 17122.584003}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000372922, iterations_per_second: 2681.523019}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.008828640, iterations_per_second: 113.267729}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.107765661, iterations_per_second: 9.279394}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.107451480, iterations_per_second: 9.306526}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.368314939, iterations_per_second: 0.730826}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000060855, iterations_per_second: 16432.449487}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000568406, iterations_per_second: 1759.307086}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.015028837, iterations_per_second: 66.538747}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.144713240, iterations_per_second: 6.910218}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.204218359, iterations_per_second: 4.896719}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.857255334, iterations_per_second: 0.538429}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000023805, iterations_per_second: 42008.334454}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.006273693, iterations_per_second: 159.395741}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.085969339, iterations_per_second: 11.632054}
