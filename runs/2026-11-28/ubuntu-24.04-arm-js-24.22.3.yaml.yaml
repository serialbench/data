platform:
  platform_string: ubuntu-24.04-arm-js-24.22.3
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: teptris-plan, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000065517, iterations_per_second: 15263.330611}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000462094, iterations_per_second: 2164.059984}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.008674869, iterations_per_second: 115.275520}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.106439972, iterations_per_second: 9.394967}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.106278871, iterations_per_second: 9.409208}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.355905564, iterations_per_second: 0.737514}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000054466, iterations_per_second: 18360.145265}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000504388, iterations_per_second: 1982.601876}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.014765639, iterations_per_second: 67.724804}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.142332750, iterations_per_second: 7.025790}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.203592704, iterations_per_second: 4.911767}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.833616768, iterations_per_second: 0.545370}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000024849, iterations_per_second: 40243.392035}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.006194371, iterations_per_second: 161.436883}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.084889345, iterations_per_second: 11.780041}
