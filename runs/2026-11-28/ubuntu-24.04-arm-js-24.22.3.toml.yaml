    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002988347, iterations_per_second: 334.633160}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.008892054, iterations_per_second: 112.459956}
  generation:
