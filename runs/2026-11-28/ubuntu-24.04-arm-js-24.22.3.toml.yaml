    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.008212552, iterations_per_second: 121.764830}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.009793420, iterations_per_second: 102.109375}
