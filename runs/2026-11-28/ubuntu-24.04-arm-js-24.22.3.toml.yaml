    - {adapter: smol-toml, format: toml, data_size: medium, time_per_iteration: 0.001125900, iterations_per_second: 888.178346}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.003371461, iterations_per_second: 296.607317}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.006497449, iterations_per_second: 153.906556}
  generation:
