platform:
  platform_string: ubuntu-24.04-arm-js-24.22.3
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
