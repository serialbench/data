    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.005906824, iterations_per_second: 169.295716}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.008624905, iterations_per_second: 115.943306}
