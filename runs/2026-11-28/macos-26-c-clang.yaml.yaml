platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004100, iterations_per_second: 243902.439133}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666693}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001271333, iterations_per_second: 786.575773}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003566667, iterations_per_second: 280.373832}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016477000, iterations_per_second: 60.690660}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.054163000, iterations_per_second: 18.462788}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000887, iterations_per_second: 1126760.564421}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000790972, iterations_per_second: 1264.266723}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.011944750, iterations_per_second: 83.718789}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005500, iterations_per_second: 181818.181807}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007700, iterations_per_second: 129870.129862}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002190333, iterations_per_second: 456.551514}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005665000, iterations_per_second: 176.522507}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.028465000, iterations_per_second: 35.130862}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.087411000, iterations_per_second: 11.440208}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001554, iterations_per_second: 643417.835548}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001069125, iterations_per_second: 935.344324}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.015427042, iterations_per_second: 64.821241}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
