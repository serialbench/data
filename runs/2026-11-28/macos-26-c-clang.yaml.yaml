    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000908, iterations_per_second: 1100957.832222}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000827500, iterations_per_second: 1208.459214}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.014530500, iterations_per_second: 68.820756}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007600, iterations_per_second: 131578.947307}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009600, iterations_per_second: 104166.666683}
