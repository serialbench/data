platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001447, iterations_per_second: 691037.244868}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003173, iterations_per_second: 315119.430227}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004924, iterations_per_second: 203099.295074}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000473530, iterations_per_second: 2111.797132}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001615981, iterations_per_second: 618.819029}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001342623, iterations_per_second: 744.810902}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004742167, iterations_per_second: 210.874058}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015932737, iterations_per_second: 62.763855}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013421119, iterations_per_second: 74.509435}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002470, iterations_per_second: 404940.270720}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006267, iterations_per_second: 159571.072960}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000859269, iterations_per_second: 1163.779911}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001767972, iterations_per_second: 565.619818}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008611868, iterations_per_second: 116.118826}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017776445, iterations_per_second: 56.254217}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
