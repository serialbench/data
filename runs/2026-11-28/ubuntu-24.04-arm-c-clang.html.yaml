platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001406, iterations_per_second: 711035.268869}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003097, iterations_per_second: 322934.831781}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005068, iterations_per_second: 197328.176529}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000474107, iterations_per_second: 2109.229990}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001611483, iterations_per_second: 620.546288}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001338018, iterations_per_second: 747.373915}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004662404, iterations_per_second: 214.481628}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015960132, iterations_per_second: 62.656123}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013557643, iterations_per_second: 73.759134}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002430, iterations_per_second: 411607.326561}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006244, iterations_per_second: 160140.924092}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000866807, iterations_per_second: 1153.658906}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001761128, iterations_per_second: 567.817791}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008760830, iterations_per_second: 114.144436}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017763207, iterations_per_second: 56.296141}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
