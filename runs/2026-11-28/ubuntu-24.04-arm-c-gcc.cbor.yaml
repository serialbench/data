platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000785, iterations_per_second: 1274209.990513}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001207, iterations_per_second: 828431.777637}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000566452, iterations_per_second: 1765.373609}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001852110, iterations_per_second: 539.924637}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006607879, iterations_per_second: 151.334490}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023769101, iterations_per_second: 42.071427}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000359, iterations_per_second: 2783964.377219}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000321541, iterations_per_second: 3110.023294}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004166653, iterations_per_second: 240.000787}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001414, iterations_per_second: 707463.741737}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001488, iterations_per_second: 672088.178367}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001087326, iterations_per_second: 919.687380}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002123140, iterations_per_second: 471.000425}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013542465, iterations_per_second: 73.841801}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.027278329, iterations_per_second: 36.659137}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
