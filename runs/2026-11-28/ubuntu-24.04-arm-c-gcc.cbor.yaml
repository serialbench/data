platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000797, iterations_per_second: 1255177.605087}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001230, iterations_per_second: 812809.883409}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000574030, iterations_per_second: 1742.068218}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001910065, iterations_per_second: 523.542301}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006643043, iterations_per_second: 150.533423}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.025734368, iterations_per_second: 38.858541}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000366, iterations_per_second: 2735229.745622}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000321745, iterations_per_second: 3108.051407}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004196958, iterations_per_second: 238.267812}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001478, iterations_per_second: 676452.681601}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001540, iterations_per_second: 649392.817471}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001097874, iterations_per_second: 910.851060}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002134800, iterations_per_second: 468.427883}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013836483, iterations_per_second: 72.272701}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.027957171, iterations_per_second: 35.768998}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
