    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 250000.000631}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000083333, iterations_per_second: 11999.999998}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000425333, iterations_per_second: 2351.097179}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001180000, iterations_per_second: 847.457627}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005878000, iterations_per_second: 170.125893}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.369746}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000178333, iterations_per_second: 5607.476634}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002510000, iterations_per_second: 398.406374}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000006400, iterations_per_second: 156249.999284}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000479333, iterations_per_second: 2086.230877}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.006427000, iterations_per_second: 155.593590}
