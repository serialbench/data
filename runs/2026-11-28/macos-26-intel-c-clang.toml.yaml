    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004600, iterations_per_second: 217391.303822}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000078667, iterations_per_second: 12711.864390}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000410333, iterations_per_second: 2437.043054}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001601000, iterations_per_second: 624.609619}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.007491000, iterations_per_second: 133.493526}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 399999.995553}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000195667, iterations_per_second: 5110.732538}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002822000, iterations_per_second: 354.358611}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000006200, iterations_per_second: 161290.322396}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000482000, iterations_per_second: 2074.688796}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.009609000, iterations_per_second: 104.069102}
