platform:
  platform_string: ubuntu-24.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000050088, iterations_per_second: 19964.981423}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000527641, iterations_per_second: 1895.228365}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.007129756, iterations_per_second: 140.257254}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.075708668, iterations_per_second: 13.208527}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.070054232, iterations_per_second: 14.274655}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 0.976531446, iterations_per_second: 1.024033}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000044747, iterations_per_second: 22347.667127}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000579419, iterations_per_second: 1725.866476}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.009573037, iterations_per_second: 104.460058}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.103276990, iterations_per_second: 9.682699}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.139752435, iterations_per_second: 7.155510}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.353977167, iterations_per_second: 0.738565}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000029453, iterations_per_second: 33952.052911}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.004064872, iterations_per_second: 246.010186}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.064585089, iterations_per_second: 15.483450}
