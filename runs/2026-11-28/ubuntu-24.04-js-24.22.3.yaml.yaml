platform:
  platform_string: ubuntu-24.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000053887, iterations_per_second: 18557.489246}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000600620, iterations_per_second: 1664.945945}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.006712463, iterations_per_second: 148.976613}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.076523784, iterations_per_second: 13.067833}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.069168825, iterations_per_second: 14.457380}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 0.894867995, iterations_per_second: 1.117483}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000052505, iterations_per_second: 19045.877710}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.001089289, iterations_per_second: 918.030018}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.009182939, iterations_per_second: 108.897598}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.095144163, iterations_per_second: 10.510366}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.137199241, iterations_per_second: 7.288670}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.183822517, iterations_per_second: 0.844721}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000027872, iterations_per_second: 35878.558256}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.003824734, iterations_per_second: 261.456068}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.055326390, iterations_per_second: 18.074557}
