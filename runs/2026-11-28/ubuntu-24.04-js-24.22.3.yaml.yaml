platform:
  platform_string: ubuntu-24.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: teptris-plan, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000054477, iterations_per_second: 18356.235797}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000348474, iterations_per_second: 2869.652904}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.006032997, iterations_per_second: 165.755097}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.074976619, iterations_per_second: 13.337491}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.070934572, iterations_per_second: 14.097498}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 0.919090747, iterations_per_second: 1.088032}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000065130, iterations_per_second: 15353.954718}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000465239, iterations_per_second: 2149.433334}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.009465922, iterations_per_second: 105.642113}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.096914173, iterations_per_second: 10.318408}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.138504842, iterations_per_second: 7.219964}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.347770736, iterations_per_second: 0.741966}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000023963, iterations_per_second: 41731.176110}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.003813007, iterations_per_second: 262.260229}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.055783103, iterations_per_second: 17.926575}
