platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.716089}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.334175}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000734000, iterations_per_second: 1362.397820}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003957333, iterations_per_second: 252.695418}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011906000, iterations_per_second: 83.991265}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.046755000, iterations_per_second: 21.388087}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000600, iterations_per_second: 1666666.670875}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000593333, iterations_per_second: 1685.393259}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.007652000, iterations_per_second: 130.684788}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454545.455693}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.895401}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001736000, iterations_per_second: 576.036866}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004824000, iterations_per_second: 207.296849}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.020467000, iterations_per_second: 48.859139}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.058986000, iterations_per_second: 16.953175}
