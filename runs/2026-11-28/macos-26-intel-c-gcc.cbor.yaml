platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.716089}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003100, iterations_per_second: 322580.644793}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000726667, iterations_per_second: 1376.146789}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003321667, iterations_per_second: 301.053688}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011207000, iterations_per_second: 89.229946}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.045391000, iterations_per_second: 22.030799}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000500, iterations_per_second: 2000000.005050}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000471000, iterations_per_second: 2123.142251}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.006029000, iterations_per_second: 165.864986}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 399999.999191}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001406667, iterations_per_second: 710.900474}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004108000, iterations_per_second: 243.427459}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021519000, iterations_per_second: 46.470561}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.056944000, iterations_per_second: 17.561113}
