platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000611, iterations_per_second: 1637197.108771}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000855, iterations_per_second: 1169043.725529}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000457556, iterations_per_second: 2185.523240}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001458730, iterations_per_second: 685.527822}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005421694, iterations_per_second: 184.444198}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.020307794, iterations_per_second: 49.242178}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000237, iterations_per_second: 4222973.029049}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000239177, iterations_per_second: 4180.998199}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.002816104, iterations_per_second: 355.100522}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001201, iterations_per_second: 832500.831577}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002809, iterations_per_second: 356011.249813}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000906574, iterations_per_second: 1103.053509}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001768785, iterations_per_second: 565.359731}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011910554, iterations_per_second: 83.959151}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.024520133, iterations_per_second: 40.782813}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
