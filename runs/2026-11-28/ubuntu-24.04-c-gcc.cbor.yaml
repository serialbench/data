platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000816, iterations_per_second: 1225189.904388}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001159, iterations_per_second: 862738.331214}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000576648, iterations_per_second: 1734.161183}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001804066, iterations_per_second: 554.303446}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007027643, iterations_per_second: 142.295219}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.027875112, iterations_per_second: 35.874295}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000299, iterations_per_second: 3342245.998505}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000297190, iterations_per_second: 3364.850769}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003577155, iterations_per_second: 279.551767}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001662, iterations_per_second: 601684.717328}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001670, iterations_per_second: 598909.983592}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001219882, iterations_per_second: 819.751419}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002334318, iterations_per_second: 428.390709}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015222748, iterations_per_second: 65.691162}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033620562, iterations_per_second: 29.743703}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
