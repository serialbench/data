platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006291, iterations_per_second: 158964.821085}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004637, iterations_per_second: 215656.674542}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001839922, iterations_per_second: 543.501301}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004123284, iterations_per_second: 242.525113}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026014771, iterations_per_second: 38.439700}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.051509989, iterations_per_second: 19.413710}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001372, iterations_per_second: 728916.101284}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001229594, iterations_per_second: 813.276798}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.040657786, iterations_per_second: 24.595535}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008620, iterations_per_second: 116013.318327}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006959, iterations_per_second: 143696.742397}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003124778, iterations_per_second: 320.022734}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005689218, iterations_per_second: 175.771071}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.050545147, iterations_per_second: 19.784293}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.072738348, iterations_per_second: 13.747906}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001695, iterations_per_second: 589935.697284}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001521725, iterations_per_second: 657.149103}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.046497797, iterations_per_second: 21.506395}
  xpath:
  validation:
  c14n:
  diff:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000008165, iterations_per_second: 122475.474273}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.002807819, iterations_per_second: 356.148355}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.045754729, iterations_per_second: 21.855664}
