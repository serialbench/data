platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004726, iterations_per_second: 211608.862154}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003520, iterations_per_second: 284082.838533}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001417718, iterations_per_second: 705.359059}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003235412, iterations_per_second: 309.079679}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019896982, iterations_per_second: 50.258878}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.040160017, iterations_per_second: 24.900388}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001085, iterations_per_second: 921404.215881}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001090733, iterations_per_second: 916.814936}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026624676, iterations_per_second: 37.559143}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006608, iterations_per_second: 151343.170624}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005231, iterations_per_second: 191182.655959}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002397874, iterations_per_second: 417.036149}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004548839, iterations_per_second: 219.836298}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.036966502, iterations_per_second: 27.051518}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057253538, iterations_per_second: 17.466170}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001340, iterations_per_second: 746212.969755}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001377526, iterations_per_second: 725.938935}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.030420496, iterations_per_second: 32.872574}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
