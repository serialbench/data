platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000608, iterations_per_second: 1645819.616721}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003750, iterations_per_second: 266688.001750}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000064164, iterations_per_second: 15585.063276}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000390230, iterations_per_second: 2562.593481}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001200436, iterations_per_second: 833.030666}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004854550, iterations_per_second: 205.992316}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000776, iterations_per_second: 1287995.877931}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000093870, iterations_per_second: 10652.992959}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001587363, iterations_per_second: 629.975626}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000002413, iterations_per_second: 414404.707577}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000300907, iterations_per_second: 3323.282251}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.003550059, iterations_per_second: 281.685459}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000001326, iterations_per_second: 753920.386631}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000046958, iterations_per_second: 21295.625877}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000615260, iterations_per_second: 1625.329129}
  xslt:
