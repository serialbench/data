platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000452, iterations_per_second: 2214348.958449}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002855, iterations_per_second: 350250.428885}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000044117, iterations_per_second: 22666.827847}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000306615, iterations_per_second: 3261.419043}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000924561, iterations_per_second: 1081.594400}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003744286, iterations_per_second: 267.073616}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000573, iterations_per_second: 1746419.844363}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000070850, iterations_per_second: 14114.259636}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001210709, iterations_per_second: 825.962308}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000001684, iterations_per_second: 593753.711682}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000224090, iterations_per_second: 4462.492748}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.002722712, iterations_per_second: 367.280858}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000000922, iterations_per_second: 1084363.476644}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000035769, iterations_per_second: 27956.909085}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000475011, iterations_per_second: 2105.214406}
  xslt:
