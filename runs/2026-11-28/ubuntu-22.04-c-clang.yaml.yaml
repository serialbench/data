platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004931, iterations_per_second: 202790.395665}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004711, iterations_per_second: 212278.169359}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001907999, iterations_per_second: 524.109198}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004497320, iterations_per_second: 222.354647}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026399335, iterations_per_second: 37.879742}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055839640, iterations_per_second: 17.908425}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001319, iterations_per_second: 758437.618492}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001722973, iterations_per_second: 580.392035}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.044673039, iterations_per_second: 22.384866}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007054, iterations_per_second: 141759.519145}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007159, iterations_per_second: 139676.509278}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003514752, iterations_per_second: 284.515122}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006690342, iterations_per_second: 149.469190}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.054794394, iterations_per_second: 18.250042}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085695832, iterations_per_second: 11.669179}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001726, iterations_per_second: 579273.590316}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002203312, iterations_per_second: 453.862254}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.049410572, iterations_per_second: 20.238584}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
