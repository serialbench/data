platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003375, iterations_per_second: 296287.517499}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000002992, iterations_per_second: 334168.755462}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001330884, iterations_per_second: 751.380097}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002811434, iterations_per_second: 355.690370}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.018061261, iterations_per_second: 55.367120}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.035411430, iterations_per_second: 28.239470}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001008, iterations_per_second: 991571.642493}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001003324, iterations_per_second: 996.686681}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.033999684, iterations_per_second: 29.412038}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005088, iterations_per_second: 196552.469766}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006331, iterations_per_second: 157940.456505}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002341039, iterations_per_second: 427.160761}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004321241, iterations_per_second: 231.415003}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.038427612, iterations_per_second: 26.022955}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.054650524, iterations_per_second: 18.298086}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001270, iterations_per_second: 787463.581847}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001265773, iterations_per_second: 790.031280}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.037448127, iterations_per_second: 26.703605}
  xpath:
  validation:
  c14n:
  diff:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000004712, iterations_per_second: 212219.605000}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.002086596, iterations_per_second: 479.249534}
