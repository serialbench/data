platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.858045}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006900, iterations_per_second: 144927.535881}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007600, iterations_per_second: 131578.947307}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000923667, iterations_per_second: 1082.641646}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004250333, iterations_per_second: 235.275665}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002734000, iterations_per_second: 365.764448}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010842000, iterations_per_second: 92.233905}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037485000, iterations_per_second: 26.677338}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.029057000, iterations_per_second: 34.415115}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005600, iterations_per_second: 178571.429022}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009700, iterations_per_second: 103092.783403}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002226000, iterations_per_second: 449.236298}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003906333, iterations_per_second: 255.994539}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019774000, iterations_per_second: 50.571457}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.041841000, iterations_per_second: 23.900002}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
