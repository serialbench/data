platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.369746}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006900, iterations_per_second: 144927.536359}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007800, iterations_per_second: 128205.128155}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001000667, iterations_per_second: 999.333778}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003832667, iterations_per_second: 260.914942}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002314000, iterations_per_second: 432.152118}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009419000, iterations_per_second: 106.168383}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.038803000, iterations_per_second: 25.771203}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.023581000, iterations_per_second: 42.407023}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005700, iterations_per_second: 175438.596584}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009900, iterations_per_second: 101010.100917}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001956000, iterations_per_second: 511.247444}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003540000, iterations_per_second: 282.485876}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020544000, iterations_per_second: 48.676012}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.034117000, iterations_per_second: 29.310901}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
