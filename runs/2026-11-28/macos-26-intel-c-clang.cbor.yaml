    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003300, iterations_per_second: 303030.304839}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001347000, iterations_per_second: 742.390497}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003629667, iterations_per_second: 275.507393}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011034000, iterations_per_second: 90.628965}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.048625000, iterations_per_second: 20.565553}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000600, iterations_per_second: 1666666.734034}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000508667, iterations_per_second: 1965.923984}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.007082000, iterations_per_second: 141.203050}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.369746}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.425727}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001519667, iterations_per_second: 658.039044}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004428000, iterations_per_second: 225.835592}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022434000, iterations_per_second: 44.575198}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.066445000, iterations_per_second: 15.050041}
