platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 624999.983814}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.649768}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001418000, iterations_per_second: 705.218618}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.005584667, iterations_per_second: 179.061717}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013454000, iterations_per_second: 74.327338}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.059796000, iterations_per_second: 16.723527}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000600, iterations_per_second: 1666666.607715}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000520000, iterations_per_second: 1923.076923}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.010648000, iterations_per_second: 93.914350}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.382223}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000005200, iterations_per_second: 192307.692793}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002743000, iterations_per_second: 364.564346}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.006748333, iterations_per_second: 148.184737}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.026554000, iterations_per_second: 37.659110}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.086834000, iterations_per_second: 11.516226}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
