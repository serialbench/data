platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008100, iterations_per_second: 123456.790089}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.895008}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001340000, iterations_per_second: 746.268657}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004053667, iterations_per_second: 246.690239}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.017469000, iterations_per_second: 57.244261}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.053370000, iterations_per_second: 18.737118}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002554, iterations_per_second: 391512.019372}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001305320, iterations_per_second: 766.095866}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020444083, iterations_per_second: 48.913908}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004700, iterations_per_second: 212765.957469}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666614}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002346000, iterations_per_second: 426.257460}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005817000, iterations_per_second: 171.909919}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040620000, iterations_per_second: 24.618415}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.098289000, iterations_per_second: 10.174078}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001583, iterations_per_second: 631592.245501}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001678972, iterations_per_second: 595.602429}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.025518084, iterations_per_second: 39.187895}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
