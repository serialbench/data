platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008400, iterations_per_second: 119047.619026}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008600, iterations_per_second: 116279.069754}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002413667, iterations_per_second: 414.307416}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007698667, iterations_per_second: 129.892622}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.034980000, iterations_per_second: 28.587764}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.094050000, iterations_per_second: 10.632642}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001467, iterations_per_second: 681802.688188}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001625333, iterations_per_second: 615.258535}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032251123, iterations_per_second: 31.006672}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011800, iterations_per_second: 84745.762763}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000013400, iterations_per_second: 74626.865670}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.004329333, iterations_per_second: 230.982445}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.011133667, iterations_per_second: 89.817670}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.059335000, iterations_per_second: 16.853459}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.135543000, iterations_per_second: 7.377733}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002088, iterations_per_second: 478904.268071}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002160779, iterations_per_second: 462.796128}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.039157478, iterations_per_second: 25.537906}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
