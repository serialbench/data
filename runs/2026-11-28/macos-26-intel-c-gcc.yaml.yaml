platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009300, iterations_per_second: 107526.881598}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010900, iterations_per_second: 91743.119211}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002563667, iterations_per_second: 390.066311}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008102333, iterations_per_second: 123.421237}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043415000, iterations_per_second: 23.033514}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.116795000, iterations_per_second: 8.562010}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001677, iterations_per_second: 596125.188097}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001626681, iterations_per_second: 614.748682}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029628786, iterations_per_second: 33.750961}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000017400, iterations_per_second: 57471.264363}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000016200, iterations_per_second: 61728.395044}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.004393333, iterations_per_second: 227.617602}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.011545333, iterations_per_second: 86.615083}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.075096000, iterations_per_second: 13.316288}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.164612000, iterations_per_second: 6.074891}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002466, iterations_per_second: 405432.800247}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002034120, iterations_per_second: 491.613161}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.036375475, iterations_per_second: 27.491050}
  xpath:
  validation:
  c14n:
  diff:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000012200, iterations_per_second: 81967.213169}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.003581000, iterations_per_second: 279.251606}
