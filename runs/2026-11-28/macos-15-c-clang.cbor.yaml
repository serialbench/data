platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000700, iterations_per_second: 1428571.432178}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.909037}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000506000, iterations_per_second: 1976.284585}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001270667, iterations_per_second: 786.988458}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006989000, iterations_per_second: 143.081986}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018746000, iterations_per_second: 53.344714}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000372333, iterations_per_second: 2685.765443}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004206000, iterations_per_second: 237.755587}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.909037}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.665823}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000966667, iterations_per_second: 1034.482759}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001617667, iterations_per_second: 618.174325}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021318000, iterations_per_second: 46.908716}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.022327000, iterations_per_second: 44.788821}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
