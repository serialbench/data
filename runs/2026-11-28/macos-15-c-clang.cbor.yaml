    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.713189}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000570667, iterations_per_second: 1752.336449}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001176333, iterations_per_second: 850.099178}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006526000, iterations_per_second: 153.233221}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.016882000, iterations_per_second: 59.234688}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000295333, iterations_per_second: 3386.004515}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003936000, iterations_per_second: 254.065041}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.295603}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 499999.999841}
