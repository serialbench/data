platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 624999.999358}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 400000.000100}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000424667, iterations_per_second: 2354.788069}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001355333, iterations_per_second: 737.825873}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.004976000, iterations_per_second: 200.964630}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.016658000, iterations_per_second: 60.031216}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000354000, iterations_per_second: 2824.858757}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004379000, iterations_per_second: 228.362640}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.716089}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002100, iterations_per_second: 476190.477393}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000888667, iterations_per_second: 1125.281320}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001717333, iterations_per_second: 582.298137}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011693000, iterations_per_second: 85.521252}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.024995000, iterations_per_second: 40.008002}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
