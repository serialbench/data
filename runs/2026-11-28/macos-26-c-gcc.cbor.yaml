    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.585726}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000488333, iterations_per_second: 2047.781570}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001529333, iterations_per_second: 653.879686}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005173000, iterations_per_second: 193.311425}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018644000, iterations_per_second: 53.636559}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000329333, iterations_per_second: 3036.437247}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004494000, iterations_per_second: 222.518914}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.716089}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370526}
