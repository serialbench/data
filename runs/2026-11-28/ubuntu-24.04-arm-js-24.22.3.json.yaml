platform:
  platform_string: ubuntu-24.04-arm-js-24.22.3
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: teptris-plan, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000004011, iterations_per_second: 249295.739536}
    - {adapter: yeptris-tape, format: json, data_size: small, time_per_iteration: 0.000044378, iterations_per_second: 22533.586310}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.000782404, iterations_per_second: 1278.111531}
    - {adapter: yeptris-tape, format: json, data_size: medium, time_per_iteration: 0.001303691, iterations_per_second: 767.053125}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.011156574, iterations_per_second: 89.633251}
    - {adapter: yeptris-tape, format: json, data_size: large, time_per_iteration: 0.016366752, iterations_per_second: 61.099478}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000002195, iterations_per_second: 455539.358601}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001265241, iterations_per_second: 790.363051}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.016969908, iterations_per_second: 58.927839}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-json-plan, format: json, data_size: small, time_per_iteration: 0.000017245, iterations_per_second: 57986.813799}
    - {adapter: yeptris-json-plan, format: json, data_size: medium, time_per_iteration: 0.003494168, iterations_per_second: 286.191162}
    - {adapter: yeptris-json-plan, format: json, data_size: large, time_per_iteration: 0.043745610, iterations_per_second: 22.859437}
