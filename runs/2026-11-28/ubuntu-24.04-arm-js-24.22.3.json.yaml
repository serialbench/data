platform:
  platform_string: ubuntu-24.04-arm-js-24.22.3
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000003399, iterations_per_second: 294186.867498}
    - {adapter: yeptris-tape, format: json, data_size: small, time_per_iteration: 0.000042290, iterations_per_second: 23646.475729}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.000810987, iterations_per_second: 1233.065895}
    - {adapter: yeptris-tape, format: json, data_size: medium, time_per_iteration: 0.001333600, iterations_per_second: 749.850030}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.011109809, iterations_per_second: 90.010548}
    - {adapter: yeptris-tape, format: json, data_size: large, time_per_iteration: 0.016285105, iterations_per_second: 61.405806}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000002283, iterations_per_second: 437981.779958}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001274973, iterations_per_second: 784.330130}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.016666097, iterations_per_second: 60.002051}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-json-plan, format: json, data_size: small, time_per_iteration: 0.000019402, iterations_per_second: 51542.140854}
    - {adapter: yeptris-json-plan, format: json, data_size: medium, time_per_iteration: 0.005615347, iterations_per_second: 178.083395}
    - {adapter: yeptris-json-plan, format: json, data_size: large, time_per_iteration: 0.043913393, iterations_per_second: 22.772096}
