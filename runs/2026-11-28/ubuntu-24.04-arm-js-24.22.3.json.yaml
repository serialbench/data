platform:
  platform_string: ubuntu-24.04-arm-js-24.22.3
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000004364, iterations_per_second: 229147.571036}
    - {adapter: yeptris-tape, format: json, data_size: small, time_per_iteration: 0.000046236, iterations_per_second: 21628.168527}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.000798485, iterations_per_second: 1252.371156}
    - {adapter: yeptris-tape, format: json, data_size: medium, time_per_iteration: 0.001531320, iterations_per_second: 653.031372}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.011185784, iterations_per_second: 89.399187}
    - {adapter: yeptris-tape, format: json, data_size: large, time_per_iteration: 0.016315112, iterations_per_second: 61.292868}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000003360, iterations_per_second: 297619.047619}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001289013, iterations_per_second: 775.787165}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.016381528, iterations_per_second: 61.044367}
  xpath:
  validation:
  plan:
