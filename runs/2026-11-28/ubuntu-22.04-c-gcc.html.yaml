platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001553, iterations_per_second: 643956.468740}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004469, iterations_per_second: 223748.685443}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005572, iterations_per_second: 179455.889768}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000484944, iterations_per_second: 2062.095185}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002217384, iterations_per_second: 450.981878}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001428408, iterations_per_second: 700.079926}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004845684, iterations_per_second: 206.369214}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.022392573, iterations_per_second: 44.657664}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014091507, iterations_per_second: 70.964731}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002868, iterations_per_second: 348626.411936}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007194, iterations_per_second: 139014.387946}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000967887, iterations_per_second: 1033.178460}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001893926, iterations_per_second: 528.003827}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009933670, iterations_per_second: 100.667729}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018384285, iterations_per_second: 54.394283}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
