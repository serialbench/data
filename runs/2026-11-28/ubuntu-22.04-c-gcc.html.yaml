platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001370, iterations_per_second: 729767.205372}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003394, iterations_per_second: 294646.277224}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005311, iterations_per_second: 188302.640018}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000444490, iterations_per_second: 2249.769399}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001964674, iterations_per_second: 508.990296}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001290745, iterations_per_second: 774.746167}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004441861, iterations_per_second: 225.130863}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.019620009, iterations_per_second: 50.968376}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013655819, iterations_per_second: 73.228856}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002513, iterations_per_second: 397962.432278}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006470, iterations_per_second: 154564.283245}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000877145, iterations_per_second: 1140.062361}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001731702, iterations_per_second: 577.466451}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008934387, iterations_per_second: 111.927097}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017940006, iterations_per_second: 55.741341}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
