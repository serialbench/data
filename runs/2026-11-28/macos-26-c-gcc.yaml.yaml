platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009400, iterations_per_second: 106382.978735}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000025300, iterations_per_second: 39525.691702}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002000000, iterations_per_second: 500.000000}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003834000, iterations_per_second: 260.824204}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016274000, iterations_per_second: 61.447708}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.044536000, iterations_per_second: 22.453745}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000846, iterations_per_second: 1182172.831680}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000814792, iterations_per_second: 1227.307594}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.011838042, iterations_per_second: 84.473429}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000012800, iterations_per_second: 78125.000024}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000020700, iterations_per_second: 48309.178747}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002252000, iterations_per_second: 444.049734}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005628333, iterations_per_second: 177.672490}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.028464000, iterations_per_second: 35.132097}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.070309000, iterations_per_second: 14.222930}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001254, iterations_per_second: 797321.002769}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001062014, iterations_per_second: 941.607173}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.015951292, iterations_per_second: 62.690847}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
