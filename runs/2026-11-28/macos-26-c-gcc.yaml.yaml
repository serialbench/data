    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000896014, iterations_per_second: 1116.053990}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013980833, iterations_per_second: 71.526496}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007700, iterations_per_second: 129870.129910}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009600, iterations_per_second: 104166.666683}
