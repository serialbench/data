platform:
  platform_string: macos-15-js-24.22.3
  kind: wasm
  os: macos
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: teptris-plan, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000039000, iterations_per_second: 25641.025641}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000279988, iterations_per_second: 3571.588017}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.006422792, iterations_per_second: 155.695537}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.072996361, iterations_per_second: 13.699313}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.080000333, iterations_per_second: 12.499948}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.521875583, iterations_per_second: 0.657084}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000039258, iterations_per_second: 25472.320503}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000334971, iterations_per_second: 2985.333950}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.010755208, iterations_per_second: 92.978208}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.100419236, iterations_per_second: 9.958251}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.158057958, iterations_per_second: 6.326793}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.310582084, iterations_per_second: 0.763020}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000015537, iterations_per_second: 64360.418343}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.004480805, iterations_per_second: 223.174168}
