platform:
  platform_string: macos-15-js-24.22.3
  kind: wasm
  os: macos
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000042992, iterations_per_second: 23260.357837}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000404542, iterations_per_second: 2471.933054}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.005947111, iterations_per_second: 168.148862}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.081030250, iterations_per_second: 12.341070}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.075157167, iterations_per_second: 13.305451}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.091914584, iterations_per_second: 0.915823}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000034879, iterations_per_second: 28670.382348}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000451337, iterations_per_second: 2215.636857}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.012560361, iterations_per_second: 79.615546}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.089868194, iterations_per_second: 11.127407}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.190624833, iterations_per_second: 5.245906}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.393454167, iterations_per_second: 0.717641}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000017871, iterations_per_second: 55956.890811}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.006534611, iterations_per_second: 153.031290}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.067613833, iterations_per_second: 14.789873}
