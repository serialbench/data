platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.713189}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370136}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285740}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000421667, iterations_per_second: 2371.541502}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001394000, iterations_per_second: 717.360115}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000996000, iterations_per_second: 1004.016064}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003995000, iterations_per_second: 250.312891}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.013977000, iterations_per_second: 71.546111}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010245000, iterations_per_second: 97.608590}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 400000.000100}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.727406}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000819000, iterations_per_second: 1221.001221}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001355667, iterations_per_second: 737.644455}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008374000, iterations_per_second: 119.417244}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014608000, iterations_per_second: 68.455641}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
