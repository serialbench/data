platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.856957}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000428333, iterations_per_second: 2334.630350}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001340000, iterations_per_second: 746.268657}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.004637000, iterations_per_second: 215.656675}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.016232000, iterations_per_second: 61.606703}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2499999.988548}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000376333, iterations_per_second: 2657.218778}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004326000, iterations_per_second: 231.160425}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.667087}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384746}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000811333, iterations_per_second: 1232.539030}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001530333, iterations_per_second: 653.452407}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010379000, iterations_per_second: 96.348396}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023514000, iterations_per_second: 42.527856}
