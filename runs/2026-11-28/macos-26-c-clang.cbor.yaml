platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 624999.999358}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608719}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000389000, iterations_per_second: 2570.694087}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001338667, iterations_per_second: 747.011952}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.004716000, iterations_per_second: 212.044105}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.016650000, iterations_per_second: 60.060060}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.278590}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000298667, iterations_per_second: 3348.214286}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003987000, iterations_per_second: 250.815149}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 769230.771173}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002100, iterations_per_second: 476190.476104}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000852667, iterations_per_second: 1172.791243}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001598000, iterations_per_second: 625.782228}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010751000, iterations_per_second: 93.014603}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.020708000, iterations_per_second: 48.290516}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
