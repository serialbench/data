platform:
  platform_string: ubuntu-22.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: teptris-plan, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000004701, iterations_per_second: 212734.273619}
    - {adapter: yeptris-tape, format: json, data_size: small, time_per_iteration: 0.000039317, iterations_per_second: 25434.031752}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001380303, iterations_per_second: 724.478611}
    - {adapter: yeptris-tape, format: json, data_size: medium, time_per_iteration: 0.002483876, iterations_per_second: 402.596587}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.013225013, iterations_per_second: 75.614292}
    - {adapter: yeptris-tape, format: json, data_size: large, time_per_iteration: 0.017839606, iterations_per_second: 56.055050}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000004567, iterations_per_second: 218986.094383}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.002517626, iterations_per_second: 397.199637}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.020371653, iterations_per_second: 49.087818}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-json-plan, format: json, data_size: small, time_per_iteration: 0.000030030, iterations_per_second: 33299.922411}
    - {adapter: yeptris-json-plan, format: json, data_size: medium, time_per_iteration: 0.010355752, iterations_per_second: 96.564695}
    - {adapter: yeptris-json-plan, format: json, data_size: large, time_per_iteration: 0.042442036, iterations_per_second: 23.561546}
