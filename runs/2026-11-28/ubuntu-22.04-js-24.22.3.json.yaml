platform:
  platform_string: ubuntu-22.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000002906, iterations_per_second: 344080.101848}
    - {adapter: yeptris-tape, format: json, data_size: small, time_per_iteration: 0.000037964, iterations_per_second: 26340.952015}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001068278, iterations_per_second: 936.085633}
    - {adapter: yeptris-tape, format: json, data_size: medium, time_per_iteration: 0.001085150, iterations_per_second: 921.531585}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.009492460, iterations_per_second: 105.346770}
    - {adapter: yeptris-tape, format: json, data_size: large, time_per_iteration: 0.014530857, iterations_per_second: 68.819066}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000002267, iterations_per_second: 441033.783188}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001398522, iterations_per_second: 715.040593}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.014648894, iterations_per_second: 68.264539}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-json-plan, format: json, data_size: small, time_per_iteration: 0.000013811, iterations_per_second: 72407.625971}
    - {adapter: yeptris-json-plan, format: json, data_size: medium, time_per_iteration: 0.003313086, iterations_per_second: 301.833396}
    - {adapter: yeptris-json-plan, format: json, data_size: large, time_per_iteration: 0.033985671, iterations_per_second: 29.424165}
