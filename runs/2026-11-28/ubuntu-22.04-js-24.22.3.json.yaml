platform:
  platform_string: ubuntu-22.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000003655, iterations_per_second: 273627.756800}
    - {adapter: yeptris-tape, format: json, data_size: small, time_per_iteration: 0.000051028, iterations_per_second: 19597.007145}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.000780756, iterations_per_second: 1280.809882}
    - {adapter: yeptris-tape, format: json, data_size: medium, time_per_iteration: 0.001593332, iterations_per_second: 627.615457}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.018726895, iterations_per_second: 53.399135}
    - {adapter: yeptris-tape, format: json, data_size: large, time_per_iteration: 0.017293697, iterations_per_second: 57.824536}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000003698, iterations_per_second: 270423.754023}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.002208045, iterations_per_second: 452.889252}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.016933764, iterations_per_second: 59.053616}
  xpath:
  validation:
  plan:
