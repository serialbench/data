platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002982, iterations_per_second: 335322.916107}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004013, iterations_per_second: 249165.296154}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001877259, iterations_per_second: 532.691641}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003922189, iterations_per_second: 254.959645}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025053009, iterations_per_second: 39.915365}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048018692, iterations_per_second: 20.825224}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001163, iterations_per_second: 859771.300341}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001206543, iterations_per_second: 828.813995}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031314993, iterations_per_second: 31.933585}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004684, iterations_per_second: 213469.954169}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006186, iterations_per_second: 161655.350897}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003001801, iterations_per_second: 333.133305}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005581096, iterations_per_second: 179.176276}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045937998, iterations_per_second: 21.768471}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.069583086, iterations_per_second: 14.371309}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001438, iterations_per_second: 695265.243352}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001503717, iterations_per_second: 665.018898}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.034953197, iterations_per_second: 28.609686}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
