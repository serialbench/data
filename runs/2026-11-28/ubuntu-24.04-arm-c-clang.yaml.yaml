    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004019, iterations_per_second: 248818.114003}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001867229, iterations_per_second: 535.552950}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003960234, iterations_per_second: 252.510310}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024844022, iterations_per_second: 40.251132}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047961238, iterations_per_second: 20.850171}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001170, iterations_per_second: 855066.266761}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001190978, iterations_per_second: 839.645837}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.030451812, iterations_per_second: 32.838768}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004711, iterations_per_second: 212269.157433}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006140, iterations_per_second: 162877.060302}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002991023, iterations_per_second: 334.333734}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005501050, iterations_per_second: 181.783467}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.046030218, iterations_per_second: 21.724859}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068418545, iterations_per_second: 14.615920}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001458, iterations_per_second: 685729.957098}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001474808, iterations_per_second: 678.054364}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.035692669, iterations_per_second: 28.016958}
  xpath:
  validation:
  c14n:
  diff:
  plan:
