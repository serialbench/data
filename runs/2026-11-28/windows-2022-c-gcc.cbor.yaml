platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.10.0', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001180, iterations_per_second: 847457.624359}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002240, iterations_per_second: 446428.570743}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001632500, iterations_per_second: 612.557427}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003438500, iterations_per_second: 290.824487}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013213300, iterations_per_second: 75.681321}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.048345300, iterations_per_second: 20.684534}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000310, iterations_per_second: 3225806.495247}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000293767, iterations_per_second: 3404.062181}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003636100, iterations_per_second: 275.019939}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 499999.998420}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002720, iterations_per_second: 367647.059137}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002417367, iterations_per_second: 413.673281}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004068500, iterations_per_second: 245.790832}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022378800, iterations_per_second: 44.685148}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.061847200, iterations_per_second: 16.168881}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
