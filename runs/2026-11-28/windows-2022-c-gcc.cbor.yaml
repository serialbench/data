platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.10.0', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000930, iterations_per_second: 1075268.818605}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001630, iterations_per_second: 613496.933636}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000890667, iterations_per_second: 1122.754491}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002137067, iterations_per_second: 467.931121}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007298100, iterations_per_second: 137.021965}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031276400, iterations_per_second: 31.972989}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000240, iterations_per_second: 4166666.617975}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000189533, iterations_per_second: 5276.116779}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.002351500, iterations_per_second: 425.260472}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001330, iterations_per_second: 751879.700504}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001970, iterations_per_second: 507614.213308}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001278900, iterations_per_second: 781.921964}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002487300, iterations_per_second: 402.042375}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012128800, iterations_per_second: 82.448387}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.036522000, iterations_per_second: 27.380757}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
