platform:
  platform_string: ubuntu-24.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000001900, iterations_per_second: 526177.321758}
    - {adapter: yeptris-tape, format: json, data_size: small, time_per_iteration: 0.000025854, iterations_per_second: 38678.884037}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.000578625, iterations_per_second: 1728.236036}
    - {adapter: yeptris-tape, format: json, data_size: medium, time_per_iteration: 0.001243629, iterations_per_second: 804.098328}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.013171351, iterations_per_second: 75.922356}
    - {adapter: yeptris-tape, format: json, data_size: large, time_per_iteration: 0.012730929, iterations_per_second: 78.548863}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000001567, iterations_per_second: 638243.553740}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001446006, iterations_per_second: 691.560222}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.012753260, iterations_per_second: 78.411324}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-json-plan, format: json, data_size: small, time_per_iteration: 0.000018618, iterations_per_second: 53711.173535}
    - {adapter: yeptris-json-plan, format: json, data_size: medium, time_per_iteration: 0.005184881, iterations_per_second: 192.868445}
    - {adapter: yeptris-json-plan, format: json, data_size: large, time_per_iteration: 0.032781975, iterations_per_second: 30.504568}
