platform:
  platform_string: ubuntu-24.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: teptris-plan, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000001821, iterations_per_second: 549088.513068}
    - {adapter: yeptris-tape, format: json, data_size: small, time_per_iteration: 0.000027957, iterations_per_second: 35768.705244}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.000845635, iterations_per_second: 1182.542830}
    - {adapter: yeptris-tape, format: json, data_size: medium, time_per_iteration: 0.001690866, iterations_per_second: 591.412921}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.008385323, iterations_per_second: 119.255990}
    - {adapter: yeptris-tape, format: json, data_size: large, time_per_iteration: 0.012721774, iterations_per_second: 78.605389}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000002338, iterations_per_second: 427770.885914}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.000921234, iterations_per_second: 1085.500142}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.012573456, iterations_per_second: 79.532628}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-json-plan, format: json, data_size: small, time_per_iteration: 0.000019364, iterations_per_second: 51641.955991}
    - {adapter: yeptris-json-plan, format: json, data_size: medium, time_per_iteration: 0.004415641, iterations_per_second: 226.467686}
    - {adapter: yeptris-json-plan, format: json, data_size: large, time_per_iteration: 0.030603391, iterations_per_second: 32.676117}
