platform:
  platform_string: ubuntu-24.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000001791, iterations_per_second: 558378.468926}
    - {adapter: yeptris-tape, format: json, data_size: small, time_per_iteration: 0.000029435, iterations_per_second: 33972.930369}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.000583216, iterations_per_second: 1714.629620}
    - {adapter: yeptris-tape, format: json, data_size: medium, time_per_iteration: 0.001144703, iterations_per_second: 873.589299}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.009021370, iterations_per_second: 110.847909}
    - {adapter: yeptris-tape, format: json, data_size: large, time_per_iteration: 0.012747542, iterations_per_second: 78.446496}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000002563, iterations_per_second: 390213.446755}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001036511, iterations_per_second: 964.775407}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.012367981, iterations_per_second: 80.853941}
  xpath:
  validation:
  plan:
