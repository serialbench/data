platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285972}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007100, iterations_per_second: 140845.070440}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000453000, iterations_per_second: 2207.505519}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001832667, iterations_per_second: 545.652965}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001168000, iterations_per_second: 856.164384}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010058000, iterations_per_second: 99.423345}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015525000, iterations_per_second: 64.412238}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011529000, iterations_per_second: 86.737792}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608719}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005000, iterations_per_second: 200000.000050}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000870667, iterations_per_second: 1148.545176}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002473000, iterations_per_second: 404.367165}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.011501000, iterations_per_second: 86.948961}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015833000, iterations_per_second: 63.159224}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
