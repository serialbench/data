platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.293636}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.777602}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004100, iterations_per_second: 243902.438964}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000470333, iterations_per_second: 2126.151665}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001518667, iterations_per_second: 658.472344}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001163000, iterations_per_second: 859.845228}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004310000, iterations_per_second: 232.018561}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014588000, iterations_per_second: 68.549493}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010930000, iterations_per_second: 91.491308}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006900, iterations_per_second: 144927.536120}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000011300, iterations_per_second: 88495.575222}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000869000, iterations_per_second: 1150.747986}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001526000, iterations_per_second: 655.307995}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009597000, iterations_per_second: 104.199229}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014936000, iterations_per_second: 66.952330}
  xpath:
  validation:
  c14n:
  diff:
  plan:
