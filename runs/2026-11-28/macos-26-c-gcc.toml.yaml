platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000800, iterations_per_second: 1250000.003156}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000037333, iterations_per_second: 26785.714285}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000177000, iterations_per_second: 5649.717514}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000509000, iterations_per_second: 1964.636542}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002064000, iterations_per_second: 484.496124}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.106899}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000072333, iterations_per_second: 13824.884795}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000909000, iterations_per_second: 1100.110011}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.646818}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000204667, iterations_per_second: 4885.993485}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.002474000, iterations_per_second: 404.203719}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.665823}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000040333, iterations_per_second: 24793.388434}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000545000, iterations_per_second: 1834.862385}
  xslt:
