platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.113916}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004700, iterations_per_second: 212765.957469}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000038667, iterations_per_second: 25862.068967}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000182667, iterations_per_second: 5474.452555}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000529000, iterations_per_second: 1890.359168}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002375000, iterations_per_second: 421.052632}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.713189}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000073333, iterations_per_second: 13636.363636}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000979000, iterations_per_second: 1021.450460}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312500.000234}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000227333, iterations_per_second: 4398.826980}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.002713000, iterations_per_second: 368.595651}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454545.454519}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000041667, iterations_per_second: 24000.000006}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000625000, iterations_per_second: 1600.000000}
  xslt:
