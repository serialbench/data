platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.668350}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.778040}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006200, iterations_per_second: 161290.322692}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000442000, iterations_per_second: 2262.443439}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001529667, iterations_per_second: 653.737198}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001173333, iterations_per_second: 852.272727}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004081000, iterations_per_second: 245.037981}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014141000, iterations_per_second: 70.716357}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011420000, iterations_per_second: 87.565674}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285972}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000013200, iterations_per_second: 75757.575753}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000950000, iterations_per_second: 1052.631579}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001606000, iterations_per_second: 622.665006}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010300000, iterations_per_second: 97.087379}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015700000, iterations_per_second: 63.694268}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
