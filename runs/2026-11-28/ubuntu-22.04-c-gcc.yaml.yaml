platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006029, iterations_per_second: 165853.982211}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004521, iterations_per_second: 221199.787564}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001737001, iterations_per_second: 575.704907}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003976305, iterations_per_second: 251.489784}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025155979, iterations_per_second: 39.751981}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.049347719, iterations_per_second: 20.264361}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001574, iterations_per_second: 635364.381824}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001404526, iterations_per_second: 711.984141}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.039016849, iterations_per_second: 25.629953}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008333, iterations_per_second: 120000.480054}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006808, iterations_per_second: 146877.386714}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003053631, iterations_per_second: 327.478991}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005929529, iterations_per_second: 168.647469}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.047744061, iterations_per_second: 20.945013}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.075732660, iterations_per_second: 13.204343}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001934, iterations_per_second: 517116.557657}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001715726, iterations_per_second: 582.843761}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.044839558, iterations_per_second: 22.301736}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
