platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004535, iterations_per_second: 220482.857470}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004714, iterations_per_second: 212143.069225}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001912741, iterations_per_second: 522.810027}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004483011, iterations_per_second: 223.064348}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026623835, iterations_per_second: 37.560329}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055823138, iterations_per_second: 17.913719}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001760, iterations_per_second: 568084.985403}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002020369, iterations_per_second: 494.959171}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.046009363, iterations_per_second: 21.734706}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007117, iterations_per_second: 140500.744601}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007170, iterations_per_second: 139464.178619}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003297351, iterations_per_second: 303.273780}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006686396, iterations_per_second: 149.557407}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.053316310, iterations_per_second: 18.755987}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085851161, iterations_per_second: 11.648066}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002050, iterations_per_second: 487852.473464}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002441486, iterations_per_second: 409.586565}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.050109752, iterations_per_second: 19.956195}
  xpath:
  validation:
  c14n:
  diff:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000006532, iterations_per_second: 153087.780506}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.002944918, iterations_per_second: 339.568029}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.047859925, iterations_per_second: 20.894308}
  xslt:
