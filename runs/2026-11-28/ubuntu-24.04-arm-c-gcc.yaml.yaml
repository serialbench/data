platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002994, iterations_per_second: 333967.872752}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004011, iterations_per_second: 249314.385525}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001865662, iterations_per_second: 536.002866}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003983680, iterations_per_second: 251.024200}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025009390, iterations_per_second: 39.984982}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048338302, iterations_per_second: 20.687528}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001236, iterations_per_second: 809126.949499}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001173630, iterations_per_second: 852.057050}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028916090, iterations_per_second: 34.582822}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004805, iterations_per_second: 208103.552326}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006131, iterations_per_second: 163110.850135}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002984757, iterations_per_second: 335.035687}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005508724, iterations_per_second: 181.530231}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045555016, iterations_per_second: 21.951480}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068945436, iterations_per_second: 14.504223}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001468, iterations_per_second: 681198.910430}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001458568, iterations_per_second: 685.603806}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032170309, iterations_per_second: 31.084563}
  xpath:
  validation:
  c14n:
  diff:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000004389, iterations_per_second: 227868.291997}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.002691240, iterations_per_second: 371.575882}
