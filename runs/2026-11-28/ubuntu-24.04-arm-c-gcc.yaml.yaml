platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003046, iterations_per_second: 328277.854244}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004054, iterations_per_second: 246657.787025}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001855922, iterations_per_second: 538.815651}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003938108, iterations_per_second: 253.929066}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025208865, iterations_per_second: 39.668585}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048196040, iterations_per_second: 20.748593}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001170, iterations_per_second: 854481.755892}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001158551, iterations_per_second: 863.147404}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032283321, iterations_per_second: 30.975748}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004653, iterations_per_second: 214938.205192}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006073, iterations_per_second: 164657.841060}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003009247, iterations_per_second: 332.309083}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005558541, iterations_per_second: 179.903334}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.046495588, iterations_per_second: 21.507417}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068761896, iterations_per_second: 14.542938}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001435, iterations_per_second: 696815.554092}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001438055, iterations_per_second: 695.383534}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.036694617, iterations_per_second: 27.251954}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
