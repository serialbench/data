    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000080000, iterations_per_second: 12499.999996}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000418333, iterations_per_second: 2390.438247}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001262000, iterations_per_second: 792.393027}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005570000, iterations_per_second: 179.533214}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.382223}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000181333, iterations_per_second: 5514.705882}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002580000, iterations_per_second: 387.596899}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000006300, iterations_per_second: 158730.158844}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000489333, iterations_per_second: 2043.596730}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.006761000, iterations_per_second: 147.907114}
