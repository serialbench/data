platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006262, iterations_per_second: 159680.638727}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004659, iterations_per_second: 214642.941499}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001906666, iterations_per_second: 524.475708}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004163725, iterations_per_second: 240.169579}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026542075, iterations_per_second: 37.676029}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.052342829, iterations_per_second: 19.104814}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001804, iterations_per_second: 554200.842360}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001208479, iterations_per_second: 827.486452}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.037925055, iterations_per_second: 26.367793}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008657, iterations_per_second: 115506.786046}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006919, iterations_per_second: 144523.289925}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003196562, iterations_per_second: 312.836071}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005849459, iterations_per_second: 170.955971}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.052080641, iterations_per_second: 19.200993}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.075504247, iterations_per_second: 13.244288}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001470, iterations_per_second: 680179.566683}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001479201, iterations_per_second: 676.040799}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.042517372, iterations_per_second: 23.519798}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
