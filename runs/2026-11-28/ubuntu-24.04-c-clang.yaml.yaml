platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004726, iterations_per_second: 211613.340032}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003439, iterations_per_second: 290816.029454}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001394319, iterations_per_second: 717.196165}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003186583, iterations_per_second: 313.815738}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.020013871, iterations_per_second: 49.965347}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.040967823, iterations_per_second: 24.409401}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000837, iterations_per_second: 1194457.712660}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000927236, iterations_per_second: 1078.474476}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027914483, iterations_per_second: 35.823698}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006397, iterations_per_second: 156315.945765}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005161, iterations_per_second: 193745.883006}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002394443, iterations_per_second: 417.633663}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004570890, iterations_per_second: 218.775790}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.037886950, iterations_per_second: 26.394313}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057234187, iterations_per_second: 17.472075}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001015, iterations_per_second: 985707.241748}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001168663, iterations_per_second: 855.678425}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.030887812, iterations_per_second: 32.375229}
  xpath:
  validation:
  c14n:
  diff:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000006060, iterations_per_second: 165027.394477}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.002155852, iterations_per_second: 463.853662}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.033226788, iterations_per_second: 30.096198}
