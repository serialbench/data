platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001418, iterations_per_second: 704970.038886}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003713, iterations_per_second: 269287.734051}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005524, iterations_per_second: 181028.240330}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000443203, iterations_per_second: 2256.302417}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002035957, iterations_per_second: 491.169509}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001361193, iterations_per_second: 734.649679}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004512399, iterations_per_second: 221.611608}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.020224143, iterations_per_second: 49.445853}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013839094, iterations_per_second: 72.259066}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005035, iterations_per_second: 198621.566392}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006906, iterations_per_second: 144795.331833}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000956531, iterations_per_second: 1045.444424}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001735174, iterations_per_second: 576.311190}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009744572, iterations_per_second: 102.621234}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018356704, iterations_per_second: 54.476011}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
