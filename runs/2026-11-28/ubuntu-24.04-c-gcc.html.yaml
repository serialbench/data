platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001098, iterations_per_second: 911161.730440}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002737, iterations_per_second: 365310.148149}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004209, iterations_per_second: 237591.769957}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000343255, iterations_per_second: 2913.288870}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001541348, iterations_per_second: 648.782613}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000966021, iterations_per_second: 1035.174541}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003445663, iterations_per_second: 290.219908}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015299880, iterations_per_second: 65.359990}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010458875, iterations_per_second: 95.612578}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002026, iterations_per_second: 493485.985004}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005106, iterations_per_second: 195832.680595}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000669775, iterations_per_second: 1493.038707}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001290507, iterations_per_second: 774.889449}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007000938, iterations_per_second: 142.838003}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013840276, iterations_per_second: 72.252894}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
