platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000557, iterations_per_second: 1795977.009575}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002062, iterations_per_second: 484895.504743}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000065954, iterations_per_second: 15162.159293}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000197797, iterations_per_second: 5055.688408}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001233203, iterations_per_second: 810.896503}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002342485, iterations_per_second: 426.897077}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000742, iterations_per_second: 1348617.661922}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000095693, iterations_per_second: 10450.048768}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001590015, iterations_per_second: 628.924884}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000002197, iterations_per_second: 455228.296800}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000285720, iterations_per_second: 3499.930001}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.003494868, iterations_per_second: 286.133840}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000001308, iterations_per_second: 764525.992093}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000050464, iterations_per_second: 19816.106529}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000702801, iterations_per_second: 1422.877884}
  xslt:
