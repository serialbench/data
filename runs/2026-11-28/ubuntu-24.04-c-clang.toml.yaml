platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000402, iterations_per_second: 2485707.199734}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001438, iterations_per_second: 695216.907848}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000046348, iterations_per_second: 21575.904034}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000142744, iterations_per_second: 7005.532035}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000885243, iterations_per_second: 1129.633332}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.001633867, iterations_per_second: 612.044922}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000573, iterations_per_second: 1744287.434233}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000070128, iterations_per_second: 14259.571734}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001187371, iterations_per_second: 842.196752}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000001724, iterations_per_second: 580046.402576}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000218743, iterations_per_second: 4571.574862}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.002707921, iterations_per_second: 369.286992}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000000921, iterations_per_second: 1085187.197464}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000032804, iterations_per_second: 30484.397084}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000436821, iterations_per_second: 2289.267228}
  xslt:
