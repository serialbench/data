platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000583, iterations_per_second: 1714089.824705}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001995, iterations_per_second: 501228.009010}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000064581, iterations_per_second: 15484.430404}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000197400, iterations_per_second: 5065.864684}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001169955, iterations_per_second: 854.733729}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002159072, iterations_per_second: 463.161951}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000770, iterations_per_second: 1298027.001702}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000102375, iterations_per_second: 9767.977963}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001584991, iterations_per_second: 630.918409}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000002357, iterations_per_second: 424340.151395}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000296825, iterations_per_second: 3368.984678}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.003627541, iterations_per_second: 275.668835}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000001279, iterations_per_second: 781738.587937}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000047974, iterations_per_second: 20844.769007}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000629070, iterations_per_second: 1589.648211}
  xslt:
