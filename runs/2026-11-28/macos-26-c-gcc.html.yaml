platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.001578}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 400000.000100}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008900, iterations_per_second: 112359.550558}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000416000, iterations_per_second: 2403.846154}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001773333, iterations_per_second: 563.909774}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001090667, iterations_per_second: 916.870416}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004289000, iterations_per_second: 233.154581}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014482000, iterations_per_second: 69.051236}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010029000, iterations_per_second: 99.710839}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312500.000234}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008400, iterations_per_second: 119047.619107}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000857667, iterations_per_second: 1165.954139}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001448333, iterations_per_second: 690.448792}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008274000, iterations_per_second: 120.860527}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013023000, iterations_per_second: 76.787223}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
