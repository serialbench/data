platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.335437}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384746}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010200, iterations_per_second: 98039.215715}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000425667, iterations_per_second: 2349.256069}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001408667, iterations_per_second: 709.891150}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001015000, iterations_per_second: 985.221675}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004294000, iterations_per_second: 232.883093}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014298000, iterations_per_second: 69.939852}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010403000, iterations_per_second: 96.126117}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.895008}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009000, iterations_per_second: 111111.111111}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001015000, iterations_per_second: 985.221675}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001388333, iterations_per_second: 720.288115}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008850000, iterations_per_second: 112.994350}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014112000, iterations_per_second: 70.861678}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
