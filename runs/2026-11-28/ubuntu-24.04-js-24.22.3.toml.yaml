    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.006219624, iterations_per_second: 160.781423}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.006576207, iterations_per_second: 152.063340}
