    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000414860, iterations_per_second: 2410.449782}
    - {adapter: smol-toml, format: toml, data_size: medium, time_per_iteration: 0.000953589, iterations_per_second: 1048.670181}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002053260, iterations_per_second: 487.030381}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.005759149, iterations_per_second: 173.636765}
  generation:
