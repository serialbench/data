    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.003496843, iterations_per_second: 285.972233}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.008104256, iterations_per_second: 123.391956}
  generation:
