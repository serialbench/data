    - {adapter: smol-toml, format: toml, data_size: medium, time_per_iteration: 0.000547715, iterations_per_second: 1825.767050}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.006713337, iterations_per_second: 148.957218}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.007184190, iterations_per_second: 139.194537}
