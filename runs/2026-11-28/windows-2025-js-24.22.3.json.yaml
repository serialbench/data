platform:
  platform_string: windows-2025-js-24.22.3
  kind: wasm
  os: windows
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000005290, iterations_per_second: 189035.916824}
    - {adapter: yeptris-tape, format: json, data_size: small, time_per_iteration: 0.000050710, iterations_per_second: 19719.976336}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.000928300, iterations_per_second: 1077.237962}
    - {adapter: yeptris-tape, format: json, data_size: medium, time_per_iteration: 0.001821700, iterations_per_second: 548.937805}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.011656000, iterations_per_second: 85.792725}
    - {adapter: yeptris-tape, format: json, data_size: large, time_per_iteration: 0.017263000, iterations_per_second: 57.927359}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000002850, iterations_per_second: 350877.192983}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001254467, iterations_per_second: 797.151512}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.019445600, iterations_per_second: 51.425515}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-json-plan, format: json, data_size: small, time_per_iteration: 0.000025580, iterations_per_second: 39093.041439}
    - {adapter: yeptris-json-plan, format: json, data_size: medium, time_per_iteration: 0.003143267, iterations_per_second: 318.140364}
    - {adapter: yeptris-json-plan, format: json, data_size: large, time_per_iteration: 0.042699400, iterations_per_second: 23.419533}
