  validation:
  plan:
    - {adapter: yeptris-json-plan, format: json, data_size: small, time_per_iteration: 0.000019500, iterations_per_second: 51282.051282}
    - {adapter: yeptris-json-plan, format: json, data_size: medium, time_per_iteration: 0.003254833, iterations_per_second: 307.235394}
