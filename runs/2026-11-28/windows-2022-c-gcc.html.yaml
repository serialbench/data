platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.10.0', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001460, iterations_per_second: 684931.507512}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004180, iterations_per_second: 239234.449649}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007040, iterations_per_second: 142045.454491}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000487900, iterations_per_second: 2049.600328}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002262967, iterations_per_second: 441.897804}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001895433, iterations_per_second: 527.583842}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004913800, iterations_per_second: 203.508486}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.022462300, iterations_per_second: 44.519039}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.020416500, iterations_per_second: 48.979992}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.647310}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008260, iterations_per_second: 121065.375325}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001020833, iterations_per_second: 979.591837}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002449000, iterations_per_second: 408.329931}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010627200, iterations_per_second: 94.098163}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.028021800, iterations_per_second: 35.686501}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
