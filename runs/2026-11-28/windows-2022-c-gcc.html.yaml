platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.10.0', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000000790, iterations_per_second: 1265822.782541}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002240, iterations_per_second: 446428.571876}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003890, iterations_per_second: 257069.408788}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000235300, iterations_per_second: 4249.893753}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.000995133, iterations_per_second: 1004.890467}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001271467, iterations_per_second: 786.493289}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.002420900, iterations_per_second: 413.069520}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.009493500, iterations_per_second: 105.335229}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013670600, iterations_per_second: 73.149679}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001820, iterations_per_second: 549450.549465}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004540, iterations_per_second: 220264.317020}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000453767, iterations_per_second: 2203.775803}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001632400, iterations_per_second: 612.594952}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004894000, iterations_per_second: 204.331835}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015983000, iterations_per_second: 62.566477}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
