platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312499.999956}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270330}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001295667, iterations_per_second: 771.803447}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003727667, iterations_per_second: 268.264330}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.018308000, iterations_per_second: 54.620931}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.046910000, iterations_per_second: 21.317416}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000875, iterations_per_second: 1142857.142030}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001094917, iterations_per_second: 913.311515}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.023620666, iterations_per_second: 42.335809}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004600, iterations_per_second: 217391.304359}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.426261}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002342333, iterations_per_second: 426.924719}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005809667, iterations_per_second: 172.126915}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.093382000, iterations_per_second: 10.708702}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.072963000, iterations_per_second: 13.705577}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001250, iterations_per_second: 800000.000201}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001470917, iterations_per_second: 679.848167}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.034186167, iterations_per_second: 29.251598}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
