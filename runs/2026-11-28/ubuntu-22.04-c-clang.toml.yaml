platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000443, iterations_per_second: 2258866.067186}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001419, iterations_per_second: 704671.975637}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000060958, iterations_per_second: 16404.647983}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000156713, iterations_per_second: 6381.105123}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001397725, iterations_per_second: 715.448318}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.001757287, iterations_per_second: 569.059010}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000591, iterations_per_second: 1692333.717409}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000086073, iterations_per_second: 11618.045148}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001769685, iterations_per_second: 565.072315}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000001898, iterations_per_second: 526898.150488}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000309293, iterations_per_second: 3233.183673}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.003358779, iterations_per_second: 297.727240}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000001044, iterations_per_second: 958221.538521}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000040247, iterations_per_second: 24846.366626}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000563769, iterations_per_second: 1773.776139}
  xslt:
