platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000605, iterations_per_second: 1652619.397944}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001787, iterations_per_second: 559471.859202}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000074856, iterations_per_second: 13358.923092}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000197563, iterations_per_second: 5061.676529}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001662701, iterations_per_second: 601.431045}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002278152, iterations_per_second: 438.952274}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000810, iterations_per_second: 1235177.867482}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000107548, iterations_per_second: 9298.202659}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002116869, iterations_per_second: 472.395788}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000003991, iterations_per_second: 250538.658035}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000375609, iterations_per_second: 2662.340659}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.004231967, iterations_per_second: 236.296739}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000001314, iterations_per_second: 761324.703977}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000050788, iterations_per_second: 19689.561256}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000683549, iterations_per_second: 1462.952912}
  xslt:
