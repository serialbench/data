    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.017140250, iterations_per_second: 58.342206}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-json-plan, format: json, data_size: small, time_per_iteration: 0.000033508, iterations_per_second: 29843.352244}
    - {adapter: yeptris-json-plan, format: json, data_size: medium, time_per_iteration: 0.003086347, iterations_per_second: 324.007603}
