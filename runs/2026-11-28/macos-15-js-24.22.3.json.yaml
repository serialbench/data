platform:
  platform_string: macos-15-js-24.22.3
  kind: wasm
  os: macos
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608696}
    - {adapter: yeptris-tape, format: json, data_size: small, time_per_iteration: 0.000019650, iterations_per_second: 50890.585242}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.000901764, iterations_per_second: 1108.937593}
    - {adapter: yeptris-tape, format: json, data_size: medium, time_per_iteration: 0.001169708, iterations_per_second: 854.913974}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.014241333, iterations_per_second: 70.218146}
    - {adapter: yeptris-tape, format: json, data_size: large, time_per_iteration: 0.014975958, iterations_per_second: 66.773692}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000001563, iterations_per_second: 640000.000000}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.001469514, iterations_per_second: 680.497090}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.016977667, iterations_per_second: 58.900908}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-json-plan, format: json, data_size: small, time_per_iteration: 0.000011821, iterations_per_second: 84596.643205}
    - {adapter: yeptris-json-plan, format: json, data_size: medium, time_per_iteration: 0.009247278, iterations_per_second: 108.139934}
    - {adapter: yeptris-json-plan, format: json, data_size: large, time_per_iteration: 0.050488208, iterations_per_second: 19.806605}
