platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001014, iterations_per_second: 986485.153024}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002560, iterations_per_second: 390609.742608}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004086, iterations_per_second: 244756.100279}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000332460, iterations_per_second: 3007.883663}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001504882, iterations_per_second: 664.503928}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000979524, iterations_per_second: 1020.904031}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003340813, iterations_per_second: 299.328337}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014930662, iterations_per_second: 66.976267}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010183234, iterations_per_second: 98.200631}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001912, iterations_per_second: 522875.817148}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005161, iterations_per_second: 193749.636786}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000646011, iterations_per_second: 1547.961258}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001298739, iterations_per_second: 769.977450}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.006764850, iterations_per_second: 147.822938}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013511457, iterations_per_second: 74.011263}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
