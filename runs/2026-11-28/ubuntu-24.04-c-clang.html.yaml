platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001732, iterations_per_second: 577267.217653}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003626, iterations_per_second: 275793.595980}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008431, iterations_per_second: 118612.705796}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000462672, iterations_per_second: 2161.359928}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002000546, iterations_per_second: 499.863537}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001302740, iterations_per_second: 767.612681}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004597630, iterations_per_second: 217.503366}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.020088428, iterations_per_second: 49.779903}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013911524, iterations_per_second: 71.882851}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002752, iterations_per_second: 363424.916561}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006828, iterations_per_second: 146455.770310}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000932007, iterations_per_second: 1072.952931}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001767188, iterations_per_second: 565.870857}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009570588, iterations_per_second: 104.486788}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018214098, iterations_per_second: 54.902527}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
