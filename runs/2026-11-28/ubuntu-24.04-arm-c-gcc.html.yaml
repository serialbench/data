platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001729, iterations_per_second: 578469.368430}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003069, iterations_per_second: 325796.572890}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004942, iterations_per_second: 202343.133602}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000462280, iterations_per_second: 2163.192699}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001612581, iterations_per_second: 620.123888}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001344188, iterations_per_second: 743.943371}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004646178, iterations_per_second: 215.230669}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015915619, iterations_per_second: 62.831361}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013544373, iterations_per_second: 73.831398}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002380, iterations_per_second: 420203.378922}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006224, iterations_per_second: 160678.706955}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000837328, iterations_per_second: 1194.275598}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001767519, iterations_per_second: 565.764888}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008524665, iterations_per_second: 117.306662}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017844267, iterations_per_second: 56.040408}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
