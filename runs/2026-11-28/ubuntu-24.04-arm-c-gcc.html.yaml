platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001658, iterations_per_second: 603027.196887}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003034, iterations_per_second: 329576.165027}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004930, iterations_per_second: 202835.642203}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000460117, iterations_per_second: 2173.360254}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001664309, iterations_per_second: 600.850083}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001337127, iterations_per_second: 747.872117}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004656276, iterations_per_second: 214.763901}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015900671, iterations_per_second: 62.890428}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013931470, iterations_per_second: 71.779934}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002375, iterations_per_second: 421034.904036}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006204, iterations_per_second: 161196.724475}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000842332, iterations_per_second: 1187.179882}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001759396, iterations_per_second: 568.376875}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008719054, iterations_per_second: 114.691342}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018218034, iterations_per_second: 54.890665}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
