platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.10.0', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007260, iterations_per_second: 137741.046705}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000012230, iterations_per_second: 81766.148785}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002071467, iterations_per_second: 482.749743}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006896133, iterations_per_second: 145.008797}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.027181100, iterations_per_second: 36.790270}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.081110100, iterations_per_second: 12.328921}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001470, iterations_per_second: 680272.111087}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002751733, iterations_per_second: 363.407307}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.040028200, iterations_per_second: 24.982387}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000120870, iterations_per_second: 8273.351535}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000023750, iterations_per_second: 42105.263153}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003840267, iterations_per_second: 260.398583}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008871567, iterations_per_second: 112.719662}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.047924700, iterations_per_second: 20.866067}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.107892600, iterations_per_second: 9.268476}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001780, iterations_per_second: 561797.752075}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.003268700, iterations_per_second: 305.932022}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.045853900, iterations_per_second: 21.808396}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
