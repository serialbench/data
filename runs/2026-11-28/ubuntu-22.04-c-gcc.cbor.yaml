platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000925, iterations_per_second: 1081431.814745}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001155, iterations_per_second: 865725.911172}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000868092, iterations_per_second: 1151.951636}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001983970, iterations_per_second: 504.039880}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010713626, iterations_per_second: 93.339081}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.027200228, iterations_per_second: 36.764398}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000398, iterations_per_second: 2513826.046280}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000378280, iterations_per_second: 2643.544464}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004657972, iterations_per_second: 214.685704}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001678, iterations_per_second: 595876.534780}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001652, iterations_per_second: 605290.235918}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001350416, iterations_per_second: 740.512370}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002543849, iterations_per_second: 393.105042}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.019975780, iterations_per_second: 50.060623}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033872884, iterations_per_second: 29.522139}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
