platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000696, iterations_per_second: 1436781.607660}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000925, iterations_per_second: 1080613.786342}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000495246, iterations_per_second: 2019.198540}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001537886, iterations_per_second: 650.243256}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006092585, iterations_per_second: 164.133943}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.019670865, iterations_per_second: 50.836605}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000367, iterations_per_second: 2728512.954207}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000352611, iterations_per_second: 2835.986399}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004413577, iterations_per_second: 226.573593}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001209, iterations_per_second: 827266.710418}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001399, iterations_per_second: 714745.193186}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000963100, iterations_per_second: 1038.313419}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002006402, iterations_per_second: 498.404690}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012420946, iterations_per_second: 80.509166}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.025449327, iterations_per_second: 39.293770}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
