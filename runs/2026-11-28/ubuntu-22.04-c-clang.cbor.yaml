platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000974, iterations_per_second: 1026904.912805}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001157, iterations_per_second: 864154.856151}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000869429, iterations_per_second: 1150.180176}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001896102, iterations_per_second: 527.397880}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011132134, iterations_per_second: 89.830036}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023901659, iterations_per_second: 41.838100}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000451, iterations_per_second: 2218278.607073}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000443917, iterations_per_second: 2252.675052}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005553944, iterations_per_second: 180.052230}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001769, iterations_per_second: 565195.274393}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001654, iterations_per_second: 604594.921766}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001375699, iterations_per_second: 726.903372}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002425057, iterations_per_second: 412.361385}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.020464953, iterations_per_second: 48.864026}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030878193, iterations_per_second: 32.385315}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
