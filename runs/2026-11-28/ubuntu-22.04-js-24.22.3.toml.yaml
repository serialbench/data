    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002912466, iterations_per_second: 343.351648}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.006093017, iterations_per_second: 164.122306}
