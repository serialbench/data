    - {adapter: smol-toml, format: toml, data_size: small, time_per_iteration: 0.000035759, iterations_per_second: 27965.144244}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000689647, iterations_per_second: 1450.017183}
    - {adapter: smol-toml, format: toml, data_size: medium, time_per_iteration: 0.001391627, iterations_per_second: 718.583528}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.004449663, iterations_per_second: 224.736120}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.006297112, iterations_per_second: 158.802956}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000064350, iterations_per_second: 15539.991391}
    - {adapter: smol-toml, format: toml, data_size: small, time_per_iteration: 0.000032007, iterations_per_second: 31243.458401}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.002003111, iterations_per_second: 499.223375}
    - {adapter: smol-toml, format: toml, data_size: medium, time_per_iteration: 0.001423056, iterations_per_second: 702.713199}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.009152921, iterations_per_second: 109.254740}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.012082046, iterations_per_second: 82.767439}
