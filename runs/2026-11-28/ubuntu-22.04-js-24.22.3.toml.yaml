    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.004018300, iterations_per_second: 248.861459}
    - {adapter: smol-toml, format: toml, data_size: large, time_per_iteration: 0.003585133, iterations_per_second: 278.929680}
