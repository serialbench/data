platform:
  platform_string: ubuntu-22.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: teptris-plan, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000086741, iterations_per_second: 11528.573570}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.001034563, iterations_per_second: 966.591505}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.009644052, iterations_per_second: 103.690855}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.117385816, iterations_per_second: 8.518917}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.103028061, iterations_per_second: 9.706094}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.459283707, iterations_per_second: 0.685268}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000066693, iterations_per_second: 14993.964929}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000834058, iterations_per_second: 1198.957530}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.014040889, iterations_per_second: 71.220560}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.154691927, iterations_per_second: 6.464461}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.199271038, iterations_per_second: 5.018291}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 2.032304672, iterations_per_second: 0.492052}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000045033, iterations_per_second: 22205.888558}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.005784591, iterations_per_second: 172.873069}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.079961214, iterations_per_second: 12.506063}
