platform:
  platform_string: ubuntu-22.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000065571, iterations_per_second: 15250.644340}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000601436, iterations_per_second: 1662.688131}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.008389636, iterations_per_second: 119.194678}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.100343851, iterations_per_second: 9.965733}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.091955343, iterations_per_second: 10.874844}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.217800064, iterations_per_second: 0.821153}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000076292, iterations_per_second: 13107.499849}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000736035, iterations_per_second: 1358.631413}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.012503648, iterations_per_second: 79.976662}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.133359339, iterations_per_second: 7.498537}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.179485668, iterations_per_second: 5.571475}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.759487167, iterations_per_second: 0.568347}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000039327, iterations_per_second: 25427.693810}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.005117064, iterations_per_second: 195.424564}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.073750331, iterations_per_second: 13.559261}
