platform:
  platform_string: ubuntu-22.04-js-24.22.3
  kind: wasm
  os: linux
  arch: x86_64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000053012, iterations_per_second: 18863.546762}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000705997, iterations_per_second: 1416.436413}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.006765130, iterations_per_second: 147.816819}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.100552866, iterations_per_second: 9.945017}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.080718877, iterations_per_second: 12.388676}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.157030298, iterations_per_second: 0.864282}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000066953, iterations_per_second: 14935.805906}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.001105203, iterations_per_second: 904.810989}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.010563839, iterations_per_second: 94.662553}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.124911805, iterations_per_second: 8.005648}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.153866819, iterations_per_second: 6.499127}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.590671290, iterations_per_second: 0.628665}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000026778, iterations_per_second: 37343.948973}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.004463924, iterations_per_second: 224.018134}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.061279377, iterations_per_second: 16.318704}
