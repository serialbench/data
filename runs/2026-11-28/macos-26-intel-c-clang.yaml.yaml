    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009800, iterations_per_second: 102040.816347}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002809667, iterations_per_second: 355.914106}
