    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001659, iterations_per_second: 602954.471867}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002153024, iterations_per_second: 464.463006}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.036133583, iterations_per_second: 27.675086}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000013600, iterations_per_second: 73529.411704}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000015000, iterations_per_second: 66666.666532}
