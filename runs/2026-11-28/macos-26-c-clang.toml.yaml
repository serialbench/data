    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000110000, iterations_per_second: 9090.909091}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000504667, iterations_per_second: 1981.505945}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001218000, iterations_per_second: 821.018062}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003335000, iterations_per_second: 299.850075}
  generation:
