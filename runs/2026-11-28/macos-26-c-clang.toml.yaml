platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.113916}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000007500, iterations_per_second: 133333.333367}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000039000, iterations_per_second: 25641.025643}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000186667, iterations_per_second: 5357.142857}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000543000, iterations_per_second: 1841.620626}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002225000, iterations_per_second: 449.438202}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.713189}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000077667, iterations_per_second: 12875.536482}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001015000, iterations_per_second: 985.221675}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238052}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000246333, iterations_per_second: 4059.539919}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.002748000, iterations_per_second: 363.901019}
