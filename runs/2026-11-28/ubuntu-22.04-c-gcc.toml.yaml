platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000561, iterations_per_second: 1782213.507287}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003575, iterations_per_second: 279743.754734}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000074556, iterations_per_second: 13412.736735}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000408216, iterations_per_second: 2449.681501}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001700589, iterations_per_second: 588.031558}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004815132, iterations_per_second: 207.678626}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000790, iterations_per_second: 1266624.444216}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000105658, iterations_per_second: 9464.528525}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002127518, iterations_per_second: 470.031276}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000002525, iterations_per_second: 396070.976141}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000412565, iterations_per_second: 2423.862441}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.004247731, iterations_per_second: 235.419804}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000001270, iterations_per_second: 787153.652422}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000050144, iterations_per_second: 19942.697984}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000692866, iterations_per_second: 1443.280519}
  xslt:
