    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.128725208, iterations_per_second: 7.768486}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.185181667, iterations_per_second: 5.400103}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.385718708, iterations_per_second: 0.721647}
