platform:
  platform_string: macos-26-js-24.22.3
  kind: wasm
  os: macos
  arch: arm64
  runtime: js
  runtime_version: 24.22.3
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.3', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000037604, iterations_per_second: 26592.844929}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000244050, iterations_per_second: 4097.521000}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.005624417, iterations_per_second: 177.796216}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.066982042, iterations_per_second: 14.929375}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.127440916, iterations_per_second: 7.846773}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.138442250, iterations_per_second: 0.878393}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000035154, iterations_per_second: 28446.103168}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000288462, iterations_per_second: 3466.655111}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.009789292, iterations_per_second: 102.152437}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.089405500, iterations_per_second: 11.184994}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.162289667, iterations_per_second: 6.161822}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.195884209, iterations_per_second: 0.836201}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000016092, iterations_per_second: 62143.838128}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.004212153, iterations_per_second: 237.408299}
    - {adapter: yeptris-plan, format: yaml, data_size: large, time_per_iteration: 0.068553041, iterations_per_second: 14.587245}
