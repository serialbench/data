    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.006308736, iterations_per_second: 158.510349}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.087050681, iterations_per_second: 11.487561}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.101544875, iterations_per_second: 9.847863}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.274173458, iterations_per_second: 0.784823}
  generation:
