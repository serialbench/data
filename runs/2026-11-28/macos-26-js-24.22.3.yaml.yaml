    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.097342528, iterations_per_second: 10.273002}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.155749750, iterations_per_second: 6.420556}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.200664500, iterations_per_second: 0.832872}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000016179, iterations_per_second: 61807.753165}
