    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.005807681, iterations_per_second: 172.185776}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.072278236, iterations_per_second: 13.835423}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.078680292, iterations_per_second: 12.709663}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.167215958, iterations_per_second: 0.856739}
  generation:
