    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.010393239, iterations_per_second: 96.216396}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.140438974, iterations_per_second: 7.120531}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.131312990, iterations_per_second: 7.615393}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.699421757, iterations_per_second: 0.588435}
  generation:
