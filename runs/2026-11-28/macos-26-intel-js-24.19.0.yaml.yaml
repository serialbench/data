    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.011614234, iterations_per_second: 86.101247}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.139940053, iterations_per_second: 7.145917}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.127960451, iterations_per_second: 7.814915}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 1.634102323, iterations_per_second: 0.611957}
  generation:
