    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.235956222, iterations_per_second: 4.238074}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 2.443112144, iterations_per_second: 0.409314}
