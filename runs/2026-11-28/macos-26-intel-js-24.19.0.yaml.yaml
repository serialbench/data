    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.176953778, iterations_per_second: 5.651193}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.244242224, iterations_per_second: 4.094296}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 2.320441410, iterations_per_second: 0.430952}
  xpath:
  validation:
