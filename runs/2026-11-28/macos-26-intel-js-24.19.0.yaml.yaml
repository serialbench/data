platform:
  platform_string: macos-26-intel-js-24.19.0
  kind: wasm
  os: macos
  arch: x86_64
  runtime: js
  runtime_version: 24.19.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.19.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000100581, iterations_per_second: 9942.186187}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000773502, iterations_per_second: 1292.820811}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.012784500, iterations_per_second: 78.219717}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.235552570, iterations_per_second: 4.245337}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.181297040, iterations_per_second: 5.515810}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 2.278304474, iterations_per_second: 0.438923}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000106383, iterations_per_second: 9399.989284}
    - {adapter: yaml22, format: yaml, data_size: small, time_per_iteration: 0.000819835, iterations_per_second: 1219.758081}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.021511646, iterations_per_second: 46.486448}
    - {adapter: yaml22, format: yaml, data_size: medium, time_per_iteration: 0.294214527, iterations_per_second: 3.398880}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.357994061, iterations_per_second: 2.793342}
    - {adapter: yaml22, format: yaml, data_size: large, time_per_iteration: 3.493139124, iterations_per_second: 0.286275}
  xpath:
  validation:
  plan:
    - {adapter: yeptris-plan, format: yaml, data_size: small, time_per_iteration: 0.000047530, iterations_per_second: 21039.166512}
    - {adapter: yeptris-plan, format: yaml, data_size: medium, time_per_iteration: 0.009694236, iterations_per_second: 103.154084}
