platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000811, iterations_per_second: 1232893.601336}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001173, iterations_per_second: 852733.008232}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000584252, iterations_per_second: 1711.591181}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001711643, iterations_per_second: 584.234092}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006653545, iterations_per_second: 150.295820}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.022449729, iterations_per_second: 44.543968}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000396, iterations_per_second: 2525252.515679}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000386635, iterations_per_second: 2586.420945}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004938540, iterations_per_second: 202.488995}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001479, iterations_per_second: 676086.808982}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001439, iterations_per_second: 694878.741917}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001115256, iterations_per_second: 896.655386}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001986068, iterations_per_second: 503.507348}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013847529, iterations_per_second: 72.215050}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.025750315, iterations_per_second: 38.834476}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
