platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000003321, iterations_per_second: 301150.394399}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001114, iterations_per_second: 897988.504787}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000579948, iterations_per_second: 1724.293514}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001705778, iterations_per_second: 586.242873}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006648987, iterations_per_second: 150.398850}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.022624150, iterations_per_second: 44.200556}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000383, iterations_per_second: 2609603.337281}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000381202, iterations_per_second: 2623.283389}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004951375, iterations_per_second: 201.964101}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001406, iterations_per_second: 711490.572331}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001394, iterations_per_second: 717617.508488}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001101853, iterations_per_second: 907.562080}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001979890, iterations_per_second: 505.078650}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013752533, iterations_per_second: 72.713878}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.026344822, iterations_per_second: 37.958123}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
