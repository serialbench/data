platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.10.0', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000430, iterations_per_second: 2325581.395072}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002870, iterations_per_second: 348432.055387}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000026233, iterations_per_second: 38119.440906}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000398367, iterations_per_second: 2510.250188}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000805000, iterations_per_second: 1242.236025}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004449400, iterations_per_second: 224.749404}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000003130, iterations_per_second: 319488.818002}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000070733, iterations_per_second: 14137.606034}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001091400, iterations_per_second: 916.254352}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000007420, iterations_per_second: 134770.889436}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000252100, iterations_per_second: 3966.679889}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.002662700, iterations_per_second: 375.558643}
  c14n:
  diff:
  plan:
    - {adapter: teptris-plan, format: toml, data_size: small, time_per_iteration: 0.000004490, iterations_per_second: 222717.149050}
    - {adapter: teptris-plan, format: toml, data_size: medium, time_per_iteration: 0.000092900, iterations_per_second: 10764.262647}
    - {adapter: teptris-plan, format: toml, data_size: large, time_per_iteration: 0.000949600, iterations_per_second: 1053.074979}
  xslt:
