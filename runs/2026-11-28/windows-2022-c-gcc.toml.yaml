platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.10.0', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000790, iterations_per_second: 1265822.782541}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005000, iterations_per_second: 200000.000050}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000051500, iterations_per_second: 19417.475727}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000603900, iterations_per_second: 1655.903295}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001579700, iterations_per_second: 633.031588}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.006524500, iterations_per_second: 153.268450}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000004690, iterations_per_second: 213219.616071}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000166167, iterations_per_second: 6018.054162}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002469000, iterations_per_second: 405.022276}
  xpath:
  validation:
    - {adapter: teptris-schema, format: toml, data_size: small, time_per_iteration: 0.000011380, iterations_per_second: 87873.462208}
    - {adapter: teptris-schema, format: toml, data_size: medium, time_per_iteration: 0.000443767, iterations_per_second: 2253.436491}
    - {adapter: teptris-schema, format: toml, data_size: large, time_per_iteration: 0.004937500, iterations_per_second: 202.531646}
