platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 769230.767809}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.778040}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000800333, iterations_per_second: 1249.479384}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001517000, iterations_per_second: 659.195781}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.017572000, iterations_per_second: 56.908718}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030656000, iterations_per_second: 32.620042}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000387333, iterations_per_second: 2581.755594}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005669000, iterations_per_second: 176.397954}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.665823}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 624999.999358}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001850667, iterations_per_second: 540.345821}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002417000, iterations_per_second: 413.736036}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.017713000, iterations_per_second: 56.455710}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.037188000, iterations_per_second: 26.890395}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
