platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.586402}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285508}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001042667, iterations_per_second: 959.079284}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003194000, iterations_per_second: 313.087038}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.019875000, iterations_per_second: 50.314465}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031443000, iterations_per_second: 31.803581}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2499999.970785}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000471333, iterations_per_second: 2121.640735}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.007309000, iterations_per_second: 136.817622}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.646818}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000004100, iterations_per_second: 243902.439302}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001140667, iterations_per_second: 876.680304}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003142333, iterations_per_second: 318.234857}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021429000, iterations_per_second: 46.665733}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.042544000, iterations_per_second: 23.505077}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
