platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001579, iterations_per_second: 633312.222108}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004663, iterations_per_second: 214468.012016}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005518, iterations_per_second: 181215.229419}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000528565, iterations_per_second: 1891.916095}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002449361, iterations_per_second: 408.269749}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001419416, iterations_per_second: 704.515096}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005058244, iterations_per_second: 197.697066}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.023559953, iterations_per_second: 42.444906}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014216741, iterations_per_second: 70.339609}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002986, iterations_per_second: 334840.113984}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007149, iterations_per_second: 139871.877367}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001061775, iterations_per_second: 941.819419}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001841719, iterations_per_second: 542.971094}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010586155, iterations_per_second: 94.463004}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018441616, iterations_per_second: 54.225183}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
