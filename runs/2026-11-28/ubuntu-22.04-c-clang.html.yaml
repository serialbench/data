platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001113, iterations_per_second: 898714.838316}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003116, iterations_per_second: 320955.162321}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004032, iterations_per_second: 248009.722155}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000353723, iterations_per_second: 2827.070900}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001618427, iterations_per_second: 617.883781}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000989787, iterations_per_second: 1010.318041}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003522726, iterations_per_second: 283.871070}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016212417, iterations_per_second: 61.681118}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009986831, iterations_per_second: 100.131864}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002196, iterations_per_second: 455290.475653}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005183, iterations_per_second: 192945.897824}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000766060, iterations_per_second: 1305.380212}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001303653, iterations_per_second: 767.075092}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007842231, iterations_per_second: 127.514734}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013145498, iterations_per_second: 76.071671}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
