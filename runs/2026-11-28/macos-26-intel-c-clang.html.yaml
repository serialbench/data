platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.645834}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000010400, iterations_per_second: 96153.845976}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000012100, iterations_per_second: 82644.628075}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001158333, iterations_per_second: 863.309353}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004721667, iterations_per_second: 211.789622}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002761000, iterations_per_second: 362.187613}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.012121000, iterations_per_second: 82.501444}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.046929000, iterations_per_second: 21.308786}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.028833000, iterations_per_second: 34.682482}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000008400, iterations_per_second: 119047.618704}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000016400, iterations_per_second: 60975.609741}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002307667, iterations_per_second: 433.338148}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.004185000, iterations_per_second: 238.948626}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.024744000, iterations_per_second: 40.413838}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.040507000, iterations_per_second: 24.687091}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
