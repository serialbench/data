platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000004900, iterations_per_second: 204081.633642}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000011400, iterations_per_second: 87719.297942}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000013600, iterations_per_second: 73529.411950}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001426000, iterations_per_second: 701.262272}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005477000, iterations_per_second: 182.581705}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003947000, iterations_per_second: 253.356980}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.015666000, iterations_per_second: 63.832504}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.049223000, iterations_per_second: 20.315706}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.037964000, iterations_per_second: 26.340744}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000009500, iterations_per_second: 105263.158035}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000017100, iterations_per_second: 58479.532117}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002880667, iterations_per_second: 347.141865}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.005507000, iterations_per_second: 181.587071}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.029754000, iterations_per_second: 33.608927}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.039662000, iterations_per_second: 25.213050}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
