platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000801, iterations_per_second: 1248283.609167}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001096, iterations_per_second: 912741.878030}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000616498, iterations_per_second: 1622.066155}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001738629, iterations_per_second: 575.165724}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007341703, iterations_per_second: 136.208179}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.027931026, iterations_per_second: 35.802480}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000398, iterations_per_second: 2515090.550904}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000374671, iterations_per_second: 2669.008277}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004731649, iterations_per_second: 211.342811}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001597, iterations_per_second: 626174.076681}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001569, iterations_per_second: 637267.397190}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001209282, iterations_per_second: 826.936748}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002231672, iterations_per_second: 448.094456}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015519130, iterations_per_second: 64.436602}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031716989, iterations_per_second: 31.528844}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
