platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, generation, xpath, validation, c14n, diff, plan, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.451', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.91', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.91', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.33', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.91', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000580, iterations_per_second: 1723543.596023}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000810, iterations_per_second: 1235177.867482}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000458152, iterations_per_second: 2182.680142}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001370788, iterations_per_second: 729.507585}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005413248, iterations_per_second: 184.731976}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.020783394, iterations_per_second: 48.115337}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000317, iterations_per_second: 3153579.309515}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000297052, iterations_per_second: 3366.413961}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003559666, iterations_per_second: 280.925233}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001156, iterations_per_second: 865426.221321}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001113, iterations_per_second: 898391.873309}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000907466, iterations_per_second: 1101.969661}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001742903, iterations_per_second: 573.755286}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011589493, iterations_per_second: 86.285051}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023845855, iterations_per_second: 41.936009}
  xpath:
  validation:
  c14n:
  diff:
  plan:
  xslt:
