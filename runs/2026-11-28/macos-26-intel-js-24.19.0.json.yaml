platform:
  platform_string: macos-26-intel-js-24.19.0
  kind: wasm
  os: macos
  arch: x86_64
  runtime: js
  runtime_version: 24.19.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.19.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000007998, iterations_per_second: 125037.511253}
    - {adapter: yeptris-tape, format: json, data_size: small, time_per_iteration: 0.000055514, iterations_per_second: 18013.441630}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.002512729, iterations_per_second: 397.973730}
    - {adapter: yeptris-tape, format: json, data_size: medium, time_per_iteration: 0.005332402, iterations_per_second: 187.532736}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.198313271, iterations_per_second: 5.042527}
    - {adapter: yeptris-tape, format: json, data_size: large, time_per_iteration: 0.104251301, iterations_per_second: 9.592206}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000007366, iterations_per_second: 135766.264798}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.006407385, iterations_per_second: 156.069918}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.424828830, iterations_per_second: 2.353889}
  xpath:
  validation:
  plan:
