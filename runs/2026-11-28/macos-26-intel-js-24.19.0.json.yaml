  validation:
  plan:
    - {adapter: yeptris-json-plan, format: json, data_size: small, time_per_iteration: 0.000030009, iterations_per_second: 33323.669469}
    - {adapter: yeptris-json-plan, format: json, data_size: medium, time_per_iteration: 0.005217735, iterations_per_second: 191.654029}
    - {adapter: yeptris-json-plan, format: json, data_size: large, time_per_iteration: 0.083040039, iterations_per_second: 12.042384}
