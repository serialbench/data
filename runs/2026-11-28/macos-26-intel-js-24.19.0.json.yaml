platform:
  platform_string: macos-26-intel-js-24.19.0
  kind: wasm
  os: macos
  arch: x86_64
  runtime: js
  runtime_version: 24.19.0
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath, validation, plan]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.82', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.41', features: {wasm: true}}
    - {name: yeptris, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: leptris-xsd, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: leptris-schematron, format: xml, version: '0.1.82', features: {wasm: true}}
    - {name: yeptris-plan, format: yaml, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-tape, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: yeptris-json-plan, format: json, version: '0.6.87', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.19.0', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000009107, iterations_per_second: 109803.232607}
    - {adapter: yeptris-tape, format: json, data_size: small, time_per_iteration: 0.000045410, iterations_per_second: 22021.532655}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.046066317, iterations_per_second: 21.707835}
    - {adapter: yeptris-tape, format: json, data_size: medium, time_per_iteration: 0.002511627, iterations_per_second: 398.148345}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.196931064, iterations_per_second: 5.077919}
    - {adapter: yeptris-tape, format: json, data_size: large, time_per_iteration: 0.051629736, iterations_per_second: 19.368683}
  generation:
    - {adapter: native-json, format: json, data_size: small, time_per_iteration: 0.000003433, iterations_per_second: 291281.931782}
    - {adapter: native-json, format: json, data_size: medium, time_per_iteration: 0.002452958, iterations_per_second: 407.671009}
    - {adapter: native-json, format: json, data_size: large, time_per_iteration: 0.034852236, iterations_per_second: 28.692564}
