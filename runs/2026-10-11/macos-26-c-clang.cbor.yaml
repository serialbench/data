platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.337', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.0', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.000468}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.856957}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000534000, iterations_per_second: 1872.659176}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001588333, iterations_per_second: 629.590766}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005702000, iterations_per_second: 175.377061}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.017892000, iterations_per_second: 55.890901}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000349333, iterations_per_second: 2862.595420}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005846000, iterations_per_second: 171.057133}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001900, iterations_per_second: 526315.789228}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608719}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001107667, iterations_per_second: 902.798676}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001865667, iterations_per_second: 536.001429}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015362000, iterations_per_second: 65.095691}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.026641000, iterations_per_second: 37.536129}
  xpath:
  xslt:
