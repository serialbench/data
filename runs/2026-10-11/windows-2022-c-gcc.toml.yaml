platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.337', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.0', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000006240, iterations_per_second: 160256.410427}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004570, iterations_per_second: 218818.380262}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000132133, iterations_per_second: 7568.113017}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000568733, iterations_per_second: 1758.293283}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001483700, iterations_per_second: 673.990699}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.006830400, iterations_per_second: 146.404310}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000006470, iterations_per_second: 154559.505012}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000168933, iterations_per_second: 5919.494872}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002212300, iterations_per_second: 452.018262}
  xpath:
  xslt:
