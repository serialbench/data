    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008800, iterations_per_second: 113636.363630}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001049333, iterations_per_second: 952.986023}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003324667, iterations_per_second: 300.782033}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002975667, iterations_per_second: 336.059146}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010708000, iterations_per_second: 93.388121}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.034817000, iterations_per_second: 28.721602}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.028431000, iterations_per_second: 35.172875}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006300, iterations_per_second: 158730.158701}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000016100, iterations_per_second: 62111.801246}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002318333, iterations_per_second: 431.344357}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.004438667, iterations_per_second: 225.292881}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022983000, iterations_per_second: 43.510421}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.039975000, iterations_per_second: 25.015635}
