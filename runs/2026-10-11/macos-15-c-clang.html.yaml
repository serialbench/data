platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.337', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.0', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370526}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.426261}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009200, iterations_per_second: 108695.652180}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000757667, iterations_per_second: 1319.841619}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001233000, iterations_per_second: 811.030008}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001192667, iterations_per_second: 838.457239}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004390000, iterations_per_second: 227.790433}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.012173000, iterations_per_second: 82.149018}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013423000, iterations_per_second: 74.498994}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005600, iterations_per_second: 178571.428569}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000011600, iterations_per_second: 86206.896558}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000941333, iterations_per_second: 1062.322946}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001697667, iterations_per_second: 589.043786}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009447000, iterations_per_second: 105.853710}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017426000, iterations_per_second: 57.385516}
