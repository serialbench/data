    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000589333, iterations_per_second: 1696.832579}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001393333, iterations_per_second: 717.703349}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007638000, iterations_per_second: 130.924326}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.022432000, iterations_per_second: 44.579173}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.310170}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000359333, iterations_per_second: 2782.931354}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004523000, iterations_per_second: 221.092195}
  generation:
