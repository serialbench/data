    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 499999.999841}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001228000, iterations_per_second: 814.332248}
