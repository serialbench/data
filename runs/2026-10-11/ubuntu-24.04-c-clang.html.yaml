platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.337', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.0', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001398, iterations_per_second: 715512.306540}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003874, iterations_per_second: 258117.804960}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005776, iterations_per_second: 173136.188935}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000431000, iterations_per_second: 2320.185615}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001663504, iterations_per_second: 601.140725}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001431045, iterations_per_second: 698.789882}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004273579, iterations_per_second: 233.995908}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016169766, iterations_per_second: 61.843814}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014300017, iterations_per_second: 69.929987}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002917, iterations_per_second: 342759.211718}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007303, iterations_per_second: 136935.653938}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000965551, iterations_per_second: 1035.678432}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001955647, iterations_per_second: 511.339638}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009746474, iterations_per_second: 102.601207}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018753704, iterations_per_second: 53.322800}
  xpath:
  xslt:
