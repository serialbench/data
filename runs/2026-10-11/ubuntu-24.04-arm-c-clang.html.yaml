platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.337', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.0', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001350, iterations_per_second: 740960.284858}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002890, iterations_per_second: 345960.906495}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005016, iterations_per_second: 199354.092708}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000483013, iterations_per_second: 2070.339080}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001332282, iterations_per_second: 750.591842}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001330954, iterations_per_second: 751.340579}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004531664, iterations_per_second: 220.669494}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.013033702, iterations_per_second: 76.724172}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013484293, iterations_per_second: 74.160358}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002382, iterations_per_second: 419744.795237}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006390, iterations_per_second: 156499.420968}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000864057, iterations_per_second: 1157.331502}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001770534, iterations_per_second: 564.801460}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008456149, iterations_per_second: 118.257140}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017830423, iterations_per_second: 56.083919}
  xpath:
  xslt:
