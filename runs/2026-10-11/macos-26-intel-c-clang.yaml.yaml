    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002189000, iterations_per_second: 456.829603}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.010958333, iterations_per_second: 91.254753}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.038254000, iterations_per_second: 26.141057}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.273587000, iterations_per_second: 3.655144}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001596, iterations_per_second: 626644.942745}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001812546, iterations_per_second: 551.710136}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032549720, iterations_per_second: 30.722230}
  generation:
