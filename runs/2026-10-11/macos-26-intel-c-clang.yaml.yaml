    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000015200, iterations_per_second: 65789.473678}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.005092333, iterations_per_second: 196.373634}
