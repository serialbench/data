platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.337', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.0', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000574, iterations_per_second: 1741856.820766}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002174, iterations_per_second: 459981.600863}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000070589, iterations_per_second: 14166.580093}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000214942, iterations_per_second: 4652.410647}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001520207, iterations_per_second: 657.805154}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002459425, iterations_per_second: 406.599103}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000870, iterations_per_second: 1149821.777837}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000119283, iterations_per_second: 8383.400866}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001977232, iterations_per_second: 505.757544}
  xpath:
  xslt:
