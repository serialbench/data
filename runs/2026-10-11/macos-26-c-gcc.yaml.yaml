    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001895333, iterations_per_second: 527.611678}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008653333, iterations_per_second: 115.562404}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023156000, iterations_per_second: 43.185352}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.114338000, iterations_per_second: 8.745999}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000954, iterations_per_second: 1047998.324675}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001217430, iterations_per_second: 821.402238}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.014304375, iterations_per_second: 69.908682}
  generation:
