platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.337', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.0', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.110408}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.586402}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000039333, iterations_per_second: 25423.728810}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000183667, iterations_per_second: 5444.646098}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000573000, iterations_per_second: 1745.200698}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002237000, iterations_per_second: 447.027269}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001000, iterations_per_second: 999999.999683}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000069667, iterations_per_second: 14354.066987}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000917000, iterations_per_second: 1090.512541}
  xpath:
  xslt:
