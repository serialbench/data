    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000846000, iterations_per_second: 1182.033097}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.006168667, iterations_per_second: 162.109586}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012753000, iterations_per_second: 78.412922}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.053713000, iterations_per_second: 18.617467}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000600, iterations_per_second: 1666666.670875}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000576333, iterations_per_second: 1735.106998}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.006471000, iterations_per_second: 154.535620}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000003100, iterations_per_second: 322580.644793}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000004100, iterations_per_second: 243902.438964}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001756667, iterations_per_second: 569.259962}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004588667, iterations_per_second: 217.928229}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.027195000, iterations_per_second: 36.771465}
