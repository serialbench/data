    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001775675, iterations_per_second: 563.166226}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004485001, iterations_per_second: 222.965391}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023920959, iterations_per_second: 41.804344}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.054869526, iterations_per_second: 18.225053}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001324, iterations_per_second: 755058.894504}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001325211, iterations_per_second: 754.596625}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020388164, iterations_per_second: 49.048065}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006123, iterations_per_second: 163307.966162}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006615, iterations_per_second: 151162.439135}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002882246, iterations_per_second: 346.951608}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006173850, iterations_per_second: 161.973494}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.041521343, iterations_per_second: 24.083999}
