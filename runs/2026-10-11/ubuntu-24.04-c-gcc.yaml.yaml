platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.337', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.0', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005099, iterations_per_second: 196120.731916}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003958, iterations_per_second: 252684.775727}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001417499, iterations_per_second: 705.467870}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003836885, iterations_per_second: 260.628065}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.020230721, iterations_per_second: 49.429776}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.046505265, iterations_per_second: 21.502942}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001194, iterations_per_second: 837170.364370}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001046678, iterations_per_second: 955.403363}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.019978532, iterations_per_second: 50.053728}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006897, iterations_per_second: 144986.371264}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005900, iterations_per_second: 169482.907637}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002488803, iterations_per_second: 401.799634}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005549560, iterations_per_second: 180.194466}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.034200255, iterations_per_second: 29.239548}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.063735563, iterations_per_second: 15.689828}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001472, iterations_per_second: 679117.147719}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001466483, iterations_per_second: 681.903730}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.023709292, iterations_per_second: 42.177556}
  xpath:
  xslt:
