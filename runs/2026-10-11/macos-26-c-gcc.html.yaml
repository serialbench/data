platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.337', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.0', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.713189}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370526}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007400, iterations_per_second: 135135.135165}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000409000, iterations_per_second: 2444.987775}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002411000, iterations_per_second: 414.765657}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001292000, iterations_per_second: 773.993808}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004747000, iterations_per_second: 210.659364}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015724000, iterations_per_second: 63.597049}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012369000, iterations_per_second: 80.847279}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.857320}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007100, iterations_per_second: 140845.070440}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001846667, iterations_per_second: 541.516245}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001593333, iterations_per_second: 627.615063}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009700000, iterations_per_second: 103.092784}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.020524000, iterations_per_second: 48.723446}
  xpath:
  xslt:
