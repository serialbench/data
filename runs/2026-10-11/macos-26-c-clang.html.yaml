platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.337', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.0', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.909037}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608719}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005900, iterations_per_second: 169491.525362}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000427667, iterations_per_second: 2338.269680}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001099333, iterations_per_second: 909.642207}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001044667, iterations_per_second: 957.243140}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.006250000, iterations_per_second: 160.000000}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.026181000, iterations_per_second: 38.195638}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011061000, iterations_per_second: 90.407739}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.586064}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.426185}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000848333, iterations_per_second: 1178.781925}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001382000, iterations_per_second: 723.589001}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010487000, iterations_per_second: 95.356155}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015157000, iterations_per_second: 65.976117}
  xpath:
  xslt:
