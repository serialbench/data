platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.337', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.0', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454545.455693}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004300, iterations_per_second: 232558.139507}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000087333, iterations_per_second: 11450.381678}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000425000, iterations_per_second: 2352.941177}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001140000, iterations_per_second: 877.192983}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004682000, iterations_per_second: 213.583938}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454545.455693}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000153667, iterations_per_second: 6507.592190}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002087000, iterations_per_second: 479.156684}
  xpath:
  xslt:
