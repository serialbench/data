platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.337', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.32', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.32', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.0', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.32', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270330}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000011600, iterations_per_second: 86206.896537}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001328333, iterations_per_second: 752.823087}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004841667, iterations_per_second: 206.540448}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016517000, iterations_per_second: 60.543682}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057957000, iterations_per_second: 17.254171}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000987, iterations_per_second: 1012658.228948}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001863694, iterations_per_second: 536.568676}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026128708, iterations_per_second: 38.272080}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005300, iterations_per_second: 188679.245253}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000018500, iterations_per_second: 54054.054049}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002156000, iterations_per_second: 463.821892}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007167000, iterations_per_second: 139.528394}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.030679000, iterations_per_second: 32.595587}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.113751000, iterations_per_second: 8.791132}
