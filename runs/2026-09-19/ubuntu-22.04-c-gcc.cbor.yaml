platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000676, iterations_per_second: 1479289.936602}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000757, iterations_per_second: 1320829.486292}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000387075, iterations_per_second: 2583.478654}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001145685, iterations_per_second: 872.840266}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.009955399, iterations_per_second: 100.448008}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.020938802, iterations_per_second: 47.758224}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000244, iterations_per_second: 4091652.903400}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000211079, iterations_per_second: 4737.562714}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.002617737, iterations_per_second: 382.009346}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001216, iterations_per_second: 822436.056035}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001056, iterations_per_second: 947328.532948}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001216813, iterations_per_second: 821.819190}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001494055, iterations_per_second: 669.319403}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.016044443, iterations_per_second: 62.326875}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.024484091, iterations_per_second: 40.842848}
  xpath:
  xslt:
