platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000910, iterations_per_second: 1098538.943633}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001159, iterations_per_second: 862589.492869}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000609423, iterations_per_second: 1640.897286}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001751912, iterations_per_second: 570.804926}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015869825, iterations_per_second: 63.012667}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034815957, iterations_per_second: 28.722462}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000329, iterations_per_second: 3039513.682335}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000308273, iterations_per_second: 3243.881499}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003669303, iterations_per_second: 272.531323}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001853, iterations_per_second: 539694.532426}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001602, iterations_per_second: 624219.725192}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002109846, iterations_per_second: 473.968242}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002333842, iterations_per_second: 428.478020}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.025406896, iterations_per_second: 39.359393}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.043939730, iterations_per_second: 22.758447}
  xpath:
  xslt:
