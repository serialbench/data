platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001121, iterations_per_second: 891981.088843}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001228, iterations_per_second: 814067.076753}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000841056, iterations_per_second: 1188.981000}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002050195, iterations_per_second: 487.758482}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.028842983, iterations_per_second: 34.670478}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.044561646, iterations_per_second: 22.440823}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000402, iterations_per_second: 2488800.451954}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000380289, iterations_per_second: 2629.579083}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004722578, iterations_per_second: 211.748752}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001946, iterations_per_second: 513953.846744}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001747, iterations_per_second: 572311.564097}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003199969, iterations_per_second: 312.503027}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002614781, iterations_per_second: 382.441158}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.039207519, iterations_per_second: 25.505312}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.053427391, iterations_per_second: 18.716991}
  xpath:
  xslt:
