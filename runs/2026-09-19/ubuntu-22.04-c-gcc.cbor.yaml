platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001071, iterations_per_second: 933706.816237}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000987, iterations_per_second: 1013376.572989}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002490790, iterations_per_second: 401.479103}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001773538, iterations_per_second: 563.844593}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.028660023, iterations_per_second: 34.891807}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040364948, iterations_per_second: 24.773970}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000396, iterations_per_second: 2527167.034043}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000379575, iterations_per_second: 2634.527770}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004719895, iterations_per_second: 211.869120}
  xslt:
