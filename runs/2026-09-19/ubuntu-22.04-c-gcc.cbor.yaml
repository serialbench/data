platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000877, iterations_per_second: 1139990.879937}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000956, iterations_per_second: 1045587.616071}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000524308, iterations_per_second: 1907.275876}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001613912, iterations_per_second: 619.612598}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.020083504, iterations_per_second: 49.792108}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033838756, iterations_per_second: 29.551914}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000305, iterations_per_second: 3284072.157952}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000284205, iterations_per_second: 3518.586936}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003530575, iterations_per_second: 283.239982}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001465, iterations_per_second: 682500.677001}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001382, iterations_per_second: 723588.998869}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002279625, iterations_per_second: 438.668705}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002052637, iterations_per_second: 487.178121}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.027952594, iterations_per_second: 35.774855}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040584783, iterations_per_second: 24.639777}
  xpath:
  xslt:
