platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000788, iterations_per_second: 1269518.852097}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000967, iterations_per_second: 1034447.087979}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000489385, iterations_per_second: 2043.379586}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001555215, iterations_per_second: 642.997913}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012868673, iterations_per_second: 77.708090}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.028808662, iterations_per_second: 34.711782}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000254, iterations_per_second: 3930817.592233}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000262966, iterations_per_second: 3802.768162}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003104291, iterations_per_second: 322.134748}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001588, iterations_per_second: 629881.581453}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001434, iterations_per_second: 697398.703366}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001807941, iterations_per_second: 553.115293}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002011122, iterations_per_second: 497.234959}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021475229, iterations_per_second: 46.565278}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035695089, iterations_per_second: 28.015058}
  xpath:
  xslt:
