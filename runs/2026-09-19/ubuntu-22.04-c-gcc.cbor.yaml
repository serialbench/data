platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000893, iterations_per_second: 1119444.754937}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000946, iterations_per_second: 1056635.676617}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000555636, iterations_per_second: 1799.740477}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001596697, iterations_per_second: 626.292773}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.020513921, iterations_per_second: 48.747385}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034581329, iterations_per_second: 28.917339}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000318, iterations_per_second: 3139717.456333}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000291744, iterations_per_second: 3427.666525}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003610941, iterations_per_second: 276.936123}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002418, iterations_per_second: 413633.356181}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001378, iterations_per_second: 725636.745880}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002362580, iterations_per_second: 423.266031}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002034138, iterations_per_second: 491.608811}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.028485596, iterations_per_second: 35.105462}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.041901993, iterations_per_second: 23.865213}
  xpath:
  xslt:
