platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001116, iterations_per_second: 895977.065003}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001743, iterations_per_second: 573657.641356}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000861023, iterations_per_second: 1161.409611}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002046248, iterations_per_second: 488.699317}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.028102226, iterations_per_second: 35.584370}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.042346780, iterations_per_second: 23.614546}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000396, iterations_per_second: 2526528.526688}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000387454, iterations_per_second: 2580.951545}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004726604, iterations_per_second: 211.568390}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001921, iterations_per_second: 520697.734939}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001779, iterations_per_second: 562018.771945}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003200742, iterations_per_second: 312.427523}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002612433, iterations_per_second: 382.784985}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.038133906, iterations_per_second: 26.223382}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.051970758, iterations_per_second: 19.241590}
  xpath:
  xslt:
