platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001336, iterations_per_second: 748783.226055}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001506, iterations_per_second: 664098.816542}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000919050, iterations_per_second: 1088.080083}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002075714, iterations_per_second: 481.761938}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.030293937, iterations_per_second: 33.009906}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.044850880, iterations_per_second: 22.296107}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000409, iterations_per_second: 2446183.971726}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000378906, iterations_per_second: 2639.174677}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004728441, iterations_per_second: 211.486196}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002287, iterations_per_second: 437196.694134}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001999, iterations_per_second: 500325.212056}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003309470, iterations_per_second: 302.163186}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002623372, iterations_per_second: 381.188839}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.041321406, iterations_per_second: 24.200532}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.053280359, iterations_per_second: 18.768642}
  xpath:
  xslt:
