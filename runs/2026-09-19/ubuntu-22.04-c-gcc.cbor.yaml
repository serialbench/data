platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000847, iterations_per_second: 1180219.491965}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000968, iterations_per_second: 1032631.154182}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000517662, iterations_per_second: 1931.761180}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001613782, iterations_per_second: 619.662511}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.020638234, iterations_per_second: 48.453758}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033775212, iterations_per_second: 29.607512}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000306, iterations_per_second: 3262642.875321}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000285066, iterations_per_second: 3507.963662}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003530403, iterations_per_second: 283.253782}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001403, iterations_per_second: 712707.571431}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001404, iterations_per_second: 712199.986476}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002268326, iterations_per_second: 440.853675}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002067398, iterations_per_second: 483.699878}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.028009666, iterations_per_second: 35.701961}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040773182, iterations_per_second: 24.525925}
  xpath:
  xslt:
