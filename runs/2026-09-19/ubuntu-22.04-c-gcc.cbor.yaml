platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001138, iterations_per_second: 878657.399940}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001207, iterations_per_second: 828363.161928}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000831517, iterations_per_second: 1202.621233}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002036266, iterations_per_second: 491.094894}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.028004727, iterations_per_second: 35.708257}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.041070850, iterations_per_second: 24.348169}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000396, iterations_per_second: 2527167.052195}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000379504, iterations_per_second: 2635.016026}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004802986, iterations_per_second: 208.203813}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001921, iterations_per_second: 520670.619401}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001755, iterations_per_second: 569703.180282}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003221083, iterations_per_second: 310.454621}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002606129, iterations_per_second: 383.710811}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.038137329, iterations_per_second: 26.221029}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.050530177, iterations_per_second: 19.790154}
  xpath:
  xslt:
