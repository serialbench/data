platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000843, iterations_per_second: 1185817.620551}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000959, iterations_per_second: 1042318.118022}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000549153, iterations_per_second: 1820.986137}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001637748, iterations_per_second: 610.594548}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.019950566, iterations_per_second: 50.123891}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033746671, iterations_per_second: 29.632552}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000321, iterations_per_second: 3110419.913991}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000286656, iterations_per_second: 3488.497841}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003578397, iterations_per_second: 279.454739}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001478, iterations_per_second: 676452.681601}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001384, iterations_per_second: 722491.149604}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002292634, iterations_per_second: 436.179521}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002058467, iterations_per_second: 485.798412}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.030280364, iterations_per_second: 33.024702}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040912740, iterations_per_second: 24.442264}
  xpath:
  xslt:
