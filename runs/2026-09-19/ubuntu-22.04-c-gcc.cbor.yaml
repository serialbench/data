platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001083, iterations_per_second: 923275.787550}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000977, iterations_per_second: 1023751.031388}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002416572, iterations_per_second: 413.809256}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001760327, iterations_per_second: 568.076272}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.028324467, iterations_per_second: 35.305166}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.038886648, iterations_per_second: 25.715768}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000391, iterations_per_second: 2558853.673084}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000384460, iterations_per_second: 2601.050825}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004717214, iterations_per_second: 211.989534}
  xslt:
