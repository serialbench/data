platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001119, iterations_per_second: 893575.194457}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001192, iterations_per_second: 838785.438771}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000829231, iterations_per_second: 1205.937069}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002042529, iterations_per_second: 489.589052}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.027919907, iterations_per_second: 35.816738}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.041262876, iterations_per_second: 24.234859}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000415, iterations_per_second: 2410800.409258}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000382532, iterations_per_second: 2614.160384}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004709416, iterations_per_second: 212.340553}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001959, iterations_per_second: 510542.706974}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001761, iterations_per_second: 567762.447826}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003177659, iterations_per_second: 314.697110}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002719365, iterations_per_second: 367.732953}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.038111213, iterations_per_second: 26.238997}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.050826980, iterations_per_second: 19.674590}
  xpath:
  xslt:
