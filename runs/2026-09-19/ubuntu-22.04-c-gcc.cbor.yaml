platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000762, iterations_per_second: 1313025.209244}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000982, iterations_per_second: 1018226.250711}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000537275, iterations_per_second: 1861.244242}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001635072, iterations_per_second: 611.593987}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013070398, iterations_per_second: 76.508764}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.029713951, iterations_per_second: 33.654225}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000276, iterations_per_second: 3621876.144411}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000256799, iterations_per_second: 3894.091106}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003317105, iterations_per_second: 301.467695}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001499, iterations_per_second: 666888.963584}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001417, iterations_per_second: 705766.109291}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001826161, iterations_per_second: 547.596844}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002217896, iterations_per_second: 450.877701}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021737507, iterations_per_second: 46.003435}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.037450919, iterations_per_second: 26.701614}
  xpath:
  xslt:
