platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001169, iterations_per_second: 855285.665335}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000006360, iterations_per_second: 157232.704392}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000602692, iterations_per_second: 1659.222289}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002873614, iterations_per_second: 347.993891}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.013224808, iterations_per_second: 75.615465}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.066254606, iterations_per_second: 15.093290}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000426, iterations_per_second: 2347969.002521}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000298163, iterations_per_second: 3353.866449}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.003906677, iterations_per_second: 255.972019}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000051400, iterations_per_second: 19455.063667}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000074960, iterations_per_second: 13340.483833}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002750890, iterations_per_second: 363.518760}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004516112, iterations_per_second: 221.429407}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.055173715, iterations_per_second: 18.124573}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.092669978, iterations_per_second: 10.790981}
