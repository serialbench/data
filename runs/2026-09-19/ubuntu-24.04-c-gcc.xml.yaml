platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
benchmark_result:
  parsing:
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000004463, iterations_per_second: 224084.614398}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002062686, iterations_per_second: 484.804764}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.054433411, iterations_per_second: 18.371070}
  xslt:
