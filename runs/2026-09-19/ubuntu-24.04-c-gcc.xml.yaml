platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000002137, iterations_per_second: 467945.718632}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000009340, iterations_per_second: 107061.796055}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000625774, iterations_per_second: 1598.020160}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002942145, iterations_per_second: 339.888075}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.016227374, iterations_per_second: 61.624265}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.062853018, iterations_per_second: 15.910135}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000392, iterations_per_second: 2552974.205179}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000290968, iterations_per_second: 3436.807984}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.004114669, iterations_per_second: 243.032915}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000051926, iterations_per_second: 19258.100920}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000076556, iterations_per_second: 13062.282268}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002809313, iterations_per_second: 355.958870}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004847207, iterations_per_second: 206.304387}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.048861127, iterations_per_second: 20.466167}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.092442594, iterations_per_second: 10.817524}
