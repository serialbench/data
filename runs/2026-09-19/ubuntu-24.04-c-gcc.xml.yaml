platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001150, iterations_per_second: 869414.014451}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000006205, iterations_per_second: 161170.744333}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000601727, iterations_per_second: 1661.884133}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002755625, iterations_per_second: 362.894036}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.011725933, iterations_per_second: 85.281060}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.066901780, iterations_per_second: 14.947285}
  xslt:
