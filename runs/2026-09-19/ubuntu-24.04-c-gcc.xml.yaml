platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001165, iterations_per_second: 858221.763623}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000006359, iterations_per_second: 157262.376576}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000604762, iterations_per_second: 1653.542135}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002729545, iterations_per_second: 366.361382}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.012768796, iterations_per_second: 78.315920}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.062576256, iterations_per_second: 15.980502}
  xslt:
