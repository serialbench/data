platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001196, iterations_per_second: 835910.724335}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000006244, iterations_per_second: 160161.442742}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000631584, iterations_per_second: 1583.320667}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002804929, iterations_per_second: 356.515263}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.014141521, iterations_per_second: 70.713751}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.062822135, iterations_per_second: 15.917956}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000383, iterations_per_second: 2613012.803451}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000292056, iterations_per_second: 3424.004784}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.010792677, iterations_per_second: 92.655418}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000049892, iterations_per_second: 20043.414035}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000077614, iterations_per_second: 12884.290056}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002762980, iterations_per_second: 361.928020}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004617660, iterations_per_second: 216.559918}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.056423398, iterations_per_second: 17.723144}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.099568706, iterations_per_second: 10.043316}
