platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001531, iterations_per_second: 653039.898067}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000008135, iterations_per_second: 122921.096885}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000492456, iterations_per_second: 2030.636896}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.001910055, iterations_per_second: 523.545134}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.010999965, iterations_per_second: 90.909380}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.053301334, iterations_per_second: 18.761257}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000309, iterations_per_second: 3232062.033112}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000221190, iterations_per_second: 4520.993232}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.003058554, iterations_per_second: 326.951886}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000036116, iterations_per_second: 27688.175768}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000098622, iterations_per_second: 10139.745978}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002121093, iterations_per_second: 471.454973}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.003408228, iterations_per_second: 293.407572}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.043212112, iterations_per_second: 23.141660}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.077345107, iterations_per_second: 12.929066}
