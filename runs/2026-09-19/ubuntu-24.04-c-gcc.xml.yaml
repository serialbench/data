platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001142, iterations_per_second: 875580.066626}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000006390, iterations_per_second: 156494.522725}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000610378, iterations_per_second: 1638.328141}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002871143, iterations_per_second: 348.293305}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.011538592, iterations_per_second: 86.665687}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.069325581, iterations_per_second: 14.424690}
  xslt:
