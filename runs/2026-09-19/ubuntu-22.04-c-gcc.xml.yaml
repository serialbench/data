platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001212, iterations_per_second: 824946.378410}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000006165, iterations_per_second: 162219.158076}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000643721, iterations_per_second: 1553.467235}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002827753, iterations_per_second: 353.637676}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.031877842, iterations_per_second: 31.369752}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.060963523, iterations_per_second: 16.403251}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000410, iterations_per_second: 2440214.735851}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000293037, iterations_per_second: 3412.538348}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.003963405, iterations_per_second: 252.308306}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000053372, iterations_per_second: 18736.556521}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000076014, iterations_per_second: 13155.505974}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002706971, iterations_per_second: 369.416591}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004760830, iterations_per_second: 210.047408}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.085670125, iterations_per_second: 11.672681}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.097127712, iterations_per_second: 10.295723}
