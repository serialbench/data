platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001216, iterations_per_second: 822233.187915}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000007349, iterations_per_second: 136076.638366}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000625315, iterations_per_second: 1599.194006}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002800751, iterations_per_second: 357.047050}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.031820534, iterations_per_second: 31.426248}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.070591010, iterations_per_second: 14.166110}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000407, iterations_per_second: 2458210.382578}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000284717, iterations_per_second: 3512.259542}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.003870162, iterations_per_second: 258.387117}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000053378, iterations_per_second: 18734.310013}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000085021, iterations_per_second: 11761.758524}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002793748, iterations_per_second: 357.942091}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004344838, iterations_per_second: 230.158179}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.082999561, iterations_per_second: 12.048256}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.100090815, iterations_per_second: 9.990927}
