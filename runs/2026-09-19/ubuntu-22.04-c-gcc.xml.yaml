platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001357, iterations_per_second: 737191.300193}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000005929, iterations_per_second: 168659.661630}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000778575, iterations_per_second: 1284.398328}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002602639, iterations_per_second: 384.225445}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.031900634, iterations_per_second: 31.347339}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.067591990, iterations_per_second: 14.794652}
  xslt:
