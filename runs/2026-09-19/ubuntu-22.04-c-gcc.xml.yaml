platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001239, iterations_per_second: 806907.123689}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000006442, iterations_per_second: 155231.294763}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000603395, iterations_per_second: 1657.289172}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002704280, iterations_per_second: 369.784148}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.030984858, iterations_per_second: 32.273829}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.065125934, iterations_per_second: 15.354866}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000442, iterations_per_second: 2263467.630789}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000315042, iterations_per_second: 3174.176592}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.015905237, iterations_per_second: 62.872373}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000051323, iterations_per_second: 19484.289818}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000091549, iterations_per_second: 10923.088350}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002797263, iterations_per_second: 357.492263}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004412693, iterations_per_second: 226.618983}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.081226093, iterations_per_second: 12.311315}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.099357098, iterations_per_second: 10.064706}
