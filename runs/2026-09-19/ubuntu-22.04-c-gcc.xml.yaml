platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000000908, iterations_per_second: 1100836.636033}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000004538, iterations_per_second: 220375.961428}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000518301, iterations_per_second: 1929.379563}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002079254, iterations_per_second: 480.941645}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.027539834, iterations_per_second: 36.311039}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.056256583, iterations_per_second: 17.775697}
  xslt:
