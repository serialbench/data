platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000000952, iterations_per_second: 1049868.766862}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000004728, iterations_per_second: 211505.922212}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000541603, iterations_per_second: 1846.370866}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002048408, iterations_per_second: 488.183915}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.017455218, iterations_per_second: 57.289459}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.038701342, iterations_per_second: 25.838897}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000363, iterations_per_second: 2751788.666307}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000260739, iterations_per_second: 3835.247974}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.003536814, iterations_per_second: 282.740342}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000042433, iterations_per_second: 23566.397145}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000064937, iterations_per_second: 15399.564808}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002252388, iterations_per_second: 443.973175}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.003749663, iterations_per_second: 266.690633}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.047022889, iterations_per_second: 21.266239}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.060760558, iterations_per_second: 16.458045}
