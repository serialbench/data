platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001195, iterations_per_second: 836680.051967}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000007402, iterations_per_second: 135100.447060}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000604501, iterations_per_second: 1654.256982}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002693269, iterations_per_second: 371.295952}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.030744388, iterations_per_second: 32.526261}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.064065167, iterations_per_second: 15.609106}
  xslt:
