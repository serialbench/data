platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: json-c, format: json, version: '0.15', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002599, iterations_per_second: 384778.174631}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003723273, iterations_per_second: 268.580872}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.050037084, iterations_per_second: 19.985177}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002684, iterations_per_second: 372578.240983}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002451154, iterations_per_second: 407.971103}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.058845711, iterations_per_second: 16.993592}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002058, iterations_per_second: 485932.261859}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002507202, iterations_per_second: 398.850937}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.036654228, iterations_per_second: 27.281982}
