platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: json-c, format: json, version: '0.15', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000001055, iterations_per_second: 948226.815979}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002606, iterations_per_second: 383744.579718}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.002101458, iterations_per_second: 475.860169}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003544433, iterations_per_second: 282.132572}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.008123056, iterations_per_second: 123.106378}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.043977973, iterations_per_second: 22.738656}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000004623, iterations_per_second: 216309.755526}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002408070, iterations_per_second: 415.270378}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.046883703, iterations_per_second: 21.329373}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000001943, iterations_per_second: 514694.528281}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002443419, iterations_per_second: 409.262595}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.036294900, iterations_per_second: 27.552080}
