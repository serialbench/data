    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001334918, iterations_per_second: 749.109870}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003264926, iterations_per_second: 306.285655}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.007057348, iterations_per_second: 141.696286}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.044133440, iterations_per_second: 22.658556}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000004655, iterations_per_second: 214841.232755}
