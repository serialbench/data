platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
    - {name: json-c, format: json, version: '0.15', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000990, iterations_per_second: 1010203.054605}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002518, iterations_per_second: 397187.909636}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.002412962, iterations_per_second: 414.428351}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003663199, iterations_per_second: 272.985443}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.012267710, iterations_per_second: 81.514806}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.051135489, iterations_per_second: 19.555890}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002702, iterations_per_second: 370082.528486}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002518905, iterations_per_second: 396.997902}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.035144492, iterations_per_second: 28.453961}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000001986, iterations_per_second: 503600.744297}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002545197, iterations_per_second: 392.896844}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.032621238, iterations_per_second: 30.654876}
