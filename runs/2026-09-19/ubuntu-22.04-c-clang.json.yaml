platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: json-c, format: json, version: '0.15', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002657, iterations_per_second: 376378.486217}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003842294, iterations_per_second: 260.261165}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.047247085, iterations_per_second: 21.165327}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002961, iterations_per_second: 337780.780173}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002498851, iterations_per_second: 400.183925}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.046590092, iterations_per_second: 21.463791}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002401, iterations_per_second: 416579.879188}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002511347, iterations_per_second: 398.192630}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.031079464, iterations_per_second: 32.175587}
  xslt:
