platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: json-c, format: json, version: '0.15', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000988, iterations_per_second: 1012248.202868}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002643, iterations_per_second: 378372.241772}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.002393452, iterations_per_second: 417.806524}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003721283, iterations_per_second: 268.724547}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.011277019, iterations_per_second: 88.675917}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.054740373, iterations_per_second: 18.268052}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002871, iterations_per_second: 348262.171818}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002552065, iterations_per_second: 391.839601}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.039409440, iterations_per_second: 25.374631}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000001964, iterations_per_second: 509242.755070}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002867038, iterations_per_second: 348.792069}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.034106221, iterations_per_second: 29.320164}
