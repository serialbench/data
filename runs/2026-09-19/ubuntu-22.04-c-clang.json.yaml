platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: json-c, format: json, version: '0.15', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000001496, iterations_per_second: 668315.176886}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.002257119, iterations_per_second: 443.042592}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.032907053, iterations_per_second: 30.388622}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000001501, iterations_per_second: 666133.759404}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.001266225, iterations_per_second: 789.749057}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.028924309, iterations_per_second: 34.572995}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000000936, iterations_per_second: 1067919.693216}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.001222929, iterations_per_second: 817.708737}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.021509857, iterations_per_second: 46.490314}
