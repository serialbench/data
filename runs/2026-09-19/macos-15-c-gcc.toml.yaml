platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000500, iterations_per_second: 2000000.005050}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.293636}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000040333, iterations_per_second: 24793.388434}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000174667, iterations_per_second: 5725.190839}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000606000, iterations_per_second: 1650.165017}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002096000, iterations_per_second: 477.099237}
  xslt:
