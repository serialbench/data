platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.556958}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005200, iterations_per_second: 192307.692793}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000038333, iterations_per_second: 26086.956510}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000169667, iterations_per_second: 5893.909624}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000641000, iterations_per_second: 1560.062402}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002019000, iterations_per_second: 495.294700}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.611942}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000075333, iterations_per_second: 13274.336277}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001002000, iterations_per_second: 998.003992}
  xpath:
  xslt:
