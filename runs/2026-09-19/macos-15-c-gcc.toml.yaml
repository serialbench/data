platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 499999.995578}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005700, iterations_per_second: 175438.596584}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000143667, iterations_per_second: 6960.556842}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000491000, iterations_per_second: 2036.659878}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001402000, iterations_per_second: 713.266762}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003528000, iterations_per_second: 283.446712}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.855144}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000215000, iterations_per_second: 4651.162790}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001542000, iterations_per_second: 648.508431}
  xpath:
  xslt:
