platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.663297}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.726672}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000109333, iterations_per_second: 9146.341467}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000477333, iterations_per_second: 2094.972067}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001350000, iterations_per_second: 740.740741}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003572000, iterations_per_second: 279.955207}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002100, iterations_per_second: 476190.479971}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000213000, iterations_per_second: 4694.835682}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001652000, iterations_per_second: 605.326877}
  xpath:
  xslt:
