platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2499999.935258}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.668350}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000053333, iterations_per_second: 18749.999994}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000199333, iterations_per_second: 5016.722408}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000673000, iterations_per_second: 1485.884101}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002556000, iterations_per_second: 391.236307}
  xslt:
