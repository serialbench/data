platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004519, iterations_per_second: 221268.309978}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004715, iterations_per_second: 212098.074053}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001668031, iterations_per_second: 599.509242}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004492176, iterations_per_second: 222.609249}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031520656, iterations_per_second: 31.725228}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056157135, iterations_per_second: 17.807176}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001775, iterations_per_second: 563253.351416}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001788783, iterations_per_second: 559.039198}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.047863553, iterations_per_second: 20.892724}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009050, iterations_per_second: 110498.458604}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007245, iterations_per_second: 138035.751258}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003205415, iterations_per_second: 311.972117}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006720802, iterations_per_second: 148.791766}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.050925817, iterations_per_second: 19.636406}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.084977563, iterations_per_second: 11.767812}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002100, iterations_per_second: 476213.152681}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002217906, iterations_per_second: 450.875804}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.052045268, iterations_per_second: 19.214043}
  xpath:
  xslt:
