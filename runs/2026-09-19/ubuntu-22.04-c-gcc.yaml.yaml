platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005902, iterations_per_second: 169439.831911}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004072, iterations_per_second: 245561.476414}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001282846, iterations_per_second: 779.516793}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003395456, iterations_per_second: 294.511282}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.020994037, iterations_per_second: 47.632573}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.044329863, iterations_per_second: 22.558157}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001378, iterations_per_second: 725689.407006}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001233403, iterations_per_second: 810.765014}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028596596, iterations_per_second: 34.969197}
  xslt:
