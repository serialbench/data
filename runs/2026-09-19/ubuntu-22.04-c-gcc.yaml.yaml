platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004660, iterations_per_second: 214601.484858}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004802, iterations_per_second: 208246.563895}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001739374, iterations_per_second: 574.919483}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004521694, iterations_per_second: 221.156037}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031873328, iterations_per_second: 31.374195}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057144432, iterations_per_second: 17.499518}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001690, iterations_per_second: 591680.966293}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001957726, iterations_per_second: 510.796623}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.049012765, iterations_per_second: 20.402848}
  xslt:
