platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008641, iterations_per_second: 115724.667868}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004746, iterations_per_second: 210708.190223}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001736837, iterations_per_second: 575.759268}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004470404, iterations_per_second: 223.693446}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031468490, iterations_per_second: 31.777820}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057409738, iterations_per_second: 17.418648}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001794, iterations_per_second: 557289.344418}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001995723, iterations_per_second: 501.071458}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.050309502, iterations_per_second: 19.876961}
  xslt:
