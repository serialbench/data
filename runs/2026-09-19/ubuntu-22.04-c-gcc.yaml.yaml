platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005977, iterations_per_second: 167299.616873}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004380, iterations_per_second: 228305.289813}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001443123, iterations_per_second: 692.941787}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003527581, iterations_per_second: 283.480406}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023385443, iterations_per_second: 42.761644}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.046679672, iterations_per_second: 21.422601}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001439, iterations_per_second: 695071.940278}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001260626, iterations_per_second: 793.256684}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.034076417, iterations_per_second: 29.345808}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008733, iterations_per_second: 114504.253857}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006740, iterations_per_second: 148356.946855}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002548568, iterations_per_second: 392.377209}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005783870, iterations_per_second: 172.894629}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.039617968, iterations_per_second: 25.241072}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.067980925, iterations_per_second: 14.710009}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001754, iterations_per_second: 570125.427075}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001540196, iterations_per_second: 649.268156}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.037919291, iterations_per_second: 26.371801}
  xpath:
  xslt:
