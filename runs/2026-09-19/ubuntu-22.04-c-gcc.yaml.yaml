platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003583, iterations_per_second: 279072.363477}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005599, iterations_per_second: 178596.942420}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001306124, iterations_per_second: 765.624286}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003047309, iterations_per_second: 328.158349}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025647661, iterations_per_second: 38.989910}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.037742486, iterations_per_second: 26.495340}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002098, iterations_per_second: 476621.705221}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001081175, iterations_per_second: 924.919362}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.039645904, iterations_per_second: 25.223287}
  xslt:
