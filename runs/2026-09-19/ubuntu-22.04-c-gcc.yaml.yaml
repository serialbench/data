platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003375, iterations_per_second: 296287.517499}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003090, iterations_per_second: 323666.494061}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001279278, iterations_per_second: 781.690923}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002895037, iterations_per_second: 345.418689}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023787324, iterations_per_second: 42.039197}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.036992900, iterations_per_second: 27.032214}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001322, iterations_per_second: 756429.653692}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001057820, iterations_per_second: 945.340119}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.036418653, iterations_per_second: 27.458457}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004682, iterations_per_second: 213579.376720}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005025, iterations_per_second: 199020.817575}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002426544, iterations_per_second: 412.108801}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004424547, iterations_per_second: 226.011855}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040225611, iterations_per_second: 24.859784}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055477968, iterations_per_second: 18.025174}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001550, iterations_per_second: 645036.445142}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001306636, iterations_per_second: 765.324084}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.039317651, iterations_per_second: 25.433869}
  xpath:
  xslt:
