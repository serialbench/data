platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005489, iterations_per_second: 182172.590413}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004723, iterations_per_second: 211734.315957}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001649738, iterations_per_second: 606.156856}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004486333, iterations_per_second: 222.899175}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031388391, iterations_per_second: 31.858912}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056387899, iterations_per_second: 17.734301}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001761, iterations_per_second: 567762.445993}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001805030, iterations_per_second: 554.007310}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.048414604, iterations_per_second: 20.654925}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006295, iterations_per_second: 158858.758579}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007204, iterations_per_second: 138821.406229}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003188701, iterations_per_second: 313.607328}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006688888, iterations_per_second: 149.501674}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.053696334, iterations_per_second: 18.623245}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085264032, iterations_per_second: 11.728275}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002032, iterations_per_second: 492174.426686}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002236445, iterations_per_second: 447.138137}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.052347344, iterations_per_second: 19.103166}
  xpath:
  xslt:
