platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006228, iterations_per_second: 160570.345791}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005624, iterations_per_second: 177822.035777}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001673129, iterations_per_second: 597.682546}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004570643, iterations_per_second: 218.787581}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.032013041, iterations_per_second: 31.237270}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057063300, iterations_per_second: 17.524398}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001689, iterations_per_second: 592031.260199}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001803812, iterations_per_second: 554.381499}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.048797452, iterations_per_second: 20.492873}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008221, iterations_per_second: 121647.101739}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008438, iterations_per_second: 118514.304681}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003203009, iterations_per_second: 312.206461}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006794262, iterations_per_second: 147.183020}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.051375514, iterations_per_second: 19.464525}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.087830474, iterations_per_second: 11.385570}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002034, iterations_per_second: 491690.431390}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002210831, iterations_per_second: 452.318540}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.053104659, iterations_per_second: 18.830740}
  xpath:
  xslt:
