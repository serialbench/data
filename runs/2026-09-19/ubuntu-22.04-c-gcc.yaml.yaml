platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004552, iterations_per_second: 219702.961595}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004781, iterations_per_second: 209165.638418}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001793312, iterations_per_second: 557.627555}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004488397, iterations_per_second: 222.796708}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031977943, iterations_per_second: 31.271555}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057297990, iterations_per_second: 17.452619}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001747, iterations_per_second: 572311.564097}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001840981, iterations_per_second: 543.188757}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.048631036, iterations_per_second: 20.563000}
  xslt:
