platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004485, iterations_per_second: 222950.527179}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004731, iterations_per_second: 211380.739086}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001657154, iterations_per_second: 603.444097}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004493527, iterations_per_second: 222.542337}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031118685, iterations_per_second: 32.135034}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056154078, iterations_per_second: 17.808146}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001685, iterations_per_second: 593436.591369}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001778842, iterations_per_second: 562.163475}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.047327106, iterations_per_second: 21.129540}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006152, iterations_per_second: 162535.554710}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007164, iterations_per_second: 139579.029643}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003183652, iterations_per_second: 314.104715}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006687629, iterations_per_second: 149.529833}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.051123723, iterations_per_second: 19.560391}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085259658, iterations_per_second: 11.728877}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002033, iterations_per_second: 491932.311367}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002225888, iterations_per_second: 449.258903}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.051915002, iterations_per_second: 19.262255}
  xpath:
  xslt:
