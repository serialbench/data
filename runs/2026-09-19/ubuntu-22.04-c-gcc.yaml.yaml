platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002598, iterations_per_second: 384926.285983}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003576, iterations_per_second: 279610.781655}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000919837, iterations_per_second: 1087.148742}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002059797, iterations_per_second: 485.484656}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.014286708, iterations_per_second: 69.995131}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.026787575, iterations_per_second: 37.330740}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001096, iterations_per_second: 912741.878030}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000738913, iterations_per_second: 1353.338687}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020465857, iterations_per_second: 48.861868}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003272, iterations_per_second: 305632.813369}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003659, iterations_per_second: 273261.374630}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001725088, iterations_per_second: 579.680573}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003176272, iterations_per_second: 314.834531}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025782352, iterations_per_second: 38.786221}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.041601405, iterations_per_second: 24.037650}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001230, iterations_per_second: 813074.234280}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000922114, iterations_per_second: 1084.465003}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.022323976, iterations_per_second: 44.794888}
  xpath:
  xslt:
