platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006164, iterations_per_second: 162229.684782}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004528, iterations_per_second: 220852.934005}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001496608, iterations_per_second: 668.177788}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004024675, iterations_per_second: 248.467247}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026034203, iterations_per_second: 38.411009}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.051723859, iterations_per_second: 19.333438}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001691, iterations_per_second: 591366.055610}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001435865, iterations_per_second: 696.444304}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.041696177, iterations_per_second: 23.983014}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007925, iterations_per_second: 126184.557519}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006999, iterations_per_second: 142875.512558}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002886410, iterations_per_second: 346.451088}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006144782, iterations_per_second: 162.739712}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045761798, iterations_per_second: 21.852288}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.077457598, iterations_per_second: 12.910289}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002057, iterations_per_second: 486121.238126}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001747678, iterations_per_second: 572.187783}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.047009988, iterations_per_second: 21.272075}
  xpath:
  xslt:
