platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004656, iterations_per_second: 214790.471939}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004727, iterations_per_second: 211559.617487}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001694898, iterations_per_second: 590.006006}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004479749, iterations_per_second: 223.226792}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031457352, iterations_per_second: 31.789071}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056962548, iterations_per_second: 17.555394}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001740, iterations_per_second: 574613.571868}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001918059, iterations_per_second: 521.360306}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.048377774, iterations_per_second: 20.670649}
  xslt:
