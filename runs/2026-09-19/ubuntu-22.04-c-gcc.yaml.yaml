platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003363, iterations_per_second: 297362.395797}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003027, iterations_per_second: 330316.443344}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001272996, iterations_per_second: 785.548217}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002870181, iterations_per_second: 348.410123}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023995519, iterations_per_second: 41.674448}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.035795118, iterations_per_second: 27.936771}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001329, iterations_per_second: 752502.070489}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001041194, iterations_per_second: 960.435807}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.036264465, iterations_per_second: 27.575203}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007092, iterations_per_second: 140995.995602}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004885, iterations_per_second: 204704.100332}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002408829, iterations_per_second: 415.139472}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004433318, iterations_per_second: 225.564673}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.039366736, iterations_per_second: 25.402157}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055249611, iterations_per_second: 18.099675}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001511, iterations_per_second: 661725.779600}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001305518, iterations_per_second: 765.979676}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.039513000, iterations_per_second: 25.308126}
  xpath:
  xslt:
