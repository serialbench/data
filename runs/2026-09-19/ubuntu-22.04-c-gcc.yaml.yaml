platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006731, iterations_per_second: 148561.920611}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004260, iterations_per_second: 234758.316293}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001373803, iterations_per_second: 727.906579}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003548185, iterations_per_second: 281.834234}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021154787, iterations_per_second: 47.270625}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.043845247, iterations_per_second: 22.807489}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001384, iterations_per_second: 722491.149604}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001224630, iterations_per_second: 816.572947}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.030422836, iterations_per_second: 32.870045}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008318, iterations_per_second: 120226.988549}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007498, iterations_per_second: 133365.341013}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002649785, iterations_per_second: 377.389109}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005276615, iterations_per_second: 189.515425}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.038444433, iterations_per_second: 26.011568}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.067837008, iterations_per_second: 14.741216}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001719, iterations_per_second: 581632.058908}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001597277, iterations_per_second: 626.065355}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.033533924, iterations_per_second: 29.820548}
  xpath:
  xslt:
