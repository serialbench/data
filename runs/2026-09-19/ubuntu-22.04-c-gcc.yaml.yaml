platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004540, iterations_per_second: 220244.912663}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004782, iterations_per_second: 209121.897268}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001776631, iterations_per_second: 562.863187}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004482636, iterations_per_second: 223.083009}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.036023463, iterations_per_second: 27.759685}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057377556, iterations_per_second: 17.428417}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001657, iterations_per_second: 603463.884637}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001926079, iterations_per_second: 519.189594}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.049001689, iterations_per_second: 20.407460}
  xslt:
