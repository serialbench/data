platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004479, iterations_per_second: 223244.184397}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004747, iterations_per_second: 210663.801599}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001789586, iterations_per_second: 558.788353}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004458923, iterations_per_second: 224.269386}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031790681, iterations_per_second: 31.455759}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056753746, iterations_per_second: 17.619982}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001785, iterations_per_second: 560098.576702}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001978129, iterations_per_second: 505.528204}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.048208763, iterations_per_second: 20.743117}
  xslt:
