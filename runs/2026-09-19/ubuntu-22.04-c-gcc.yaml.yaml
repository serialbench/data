platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003360, iterations_per_second: 297610.189810}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003035, iterations_per_second: 329532.721182}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001267348, iterations_per_second: 789.049051}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002873573, iterations_per_second: 347.998775}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023944893, iterations_per_second: 41.762559}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.036843875, iterations_per_second: 27.141553}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001266, iterations_per_second: 789951.809876}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001040320, iterations_per_second: 961.243003}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.036687029, iterations_per_second: 27.257590}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004705, iterations_per_second: 212535.334404}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004997, iterations_per_second: 200100.050382}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002452830, iterations_per_second: 407.692339}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004412747, iterations_per_second: 226.616193}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040377235, iterations_per_second: 24.766431}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055427476, iterations_per_second: 18.041594}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001533, iterations_per_second: 652188.092542}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001302825, iterations_per_second: 767.562796}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.040244796, iterations_per_second: 24.847933}
  xpath:
  xslt:
