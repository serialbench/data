platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003361, iterations_per_second: 297521.644770}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003047, iterations_per_second: 328234.753514}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001419565, iterations_per_second: 704.441315}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002915398, iterations_per_second: 343.006380}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024397867, iterations_per_second: 40.987190}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.035817830, iterations_per_second: 27.919056}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001365, iterations_per_second: 732547.066736}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001044648, iterations_per_second: 957.260245}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.036208641, iterations_per_second: 27.617717}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004637, iterations_per_second: 215656.674542}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004917, iterations_per_second: 203396.725283}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002428545, iterations_per_second: 411.769130}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004435938, iterations_per_second: 225.431465}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043363128, iterations_per_second: 23.061067}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055576048, iterations_per_second: 17.993363}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001483, iterations_per_second: 674217.906997}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001310867, iterations_per_second: 762.853897}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.039887324, iterations_per_second: 25.070621}
  xpath:
  xslt:
