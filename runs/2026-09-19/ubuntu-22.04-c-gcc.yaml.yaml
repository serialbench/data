platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004457, iterations_per_second: 224346.031532}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004708, iterations_per_second: 212413.441163}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001691521, iterations_per_second: 591.184027}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004496748, iterations_per_second: 222.382931}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.030908000, iterations_per_second: 32.354083}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056113076, iterations_per_second: 17.821158}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001674, iterations_per_second: 597335.879065}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001787503, iterations_per_second: 559.439621}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.047662850, iterations_per_second: 20.980701}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006213, iterations_per_second: 160963.204135}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007218, iterations_per_second: 138552.130212}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003175187, iterations_per_second: 314.942081}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006726699, iterations_per_second: 148.661320}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.051031662, iterations_per_second: 19.595678}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085753553, iterations_per_second: 11.661324}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002008, iterations_per_second: 498082.381717}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002215448, iterations_per_second: 451.376042}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.051833246, iterations_per_second: 19.292637}
  xpath:
  xslt:
