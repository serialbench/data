platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.335437}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000631000, iterations_per_second: 1584.786054}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.001999667, iterations_per_second: 500.083347}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.010556000, iterations_per_second: 94.732853}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.033630000, iterations_per_second: 29.735355}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000333, iterations_per_second: 2999400.082751}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000235611, iterations_per_second: 4244.278006}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.004667125, iterations_per_second: 214.264670}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000037700, iterations_per_second: 26525.198942}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000044700, iterations_per_second: 22371.364653}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002718667, iterations_per_second: 367.827366}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004383333, iterations_per_second: 228.136882}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.039339000, iterations_per_second: 25.420067}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.062585000, iterations_per_second: 15.978270}
