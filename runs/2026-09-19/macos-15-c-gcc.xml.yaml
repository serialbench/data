platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.335437}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000705667, iterations_per_second: 1417.099669}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002242333, iterations_per_second: 445.964026}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.011534000, iterations_per_second: 86.700191}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.033634000, iterations_per_second: 29.731819}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000329, iterations_per_second: 3037667.095723}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000236333, iterations_per_second: 4231.311706}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.006623459, iterations_per_second: 150.978514}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000037500, iterations_per_second: 26666.666665}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000047100, iterations_per_second: 21231.422505}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002710333, iterations_per_second: 368.958308}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.008179667, iterations_per_second: 122.254371}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.042731000, iterations_per_second: 23.402214}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.070816000, iterations_per_second: 14.121103}
