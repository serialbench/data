platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 769230.771173}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 249999.999921}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000735333, iterations_per_second: 1359.927471}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002014000, iterations_per_second: 496.524330}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.010770000, iterations_per_second: 92.850511}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.032717000, iterations_per_second: 30.565150}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000329, iterations_per_second: 3038590.108481}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000238361, iterations_per_second: 4195.311320}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.004213000, iterations_per_second: 237.360551}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000037100, iterations_per_second: 26954.177895}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000045900, iterations_per_second: 21786.492373}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002687333, iterations_per_second: 372.116100}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.003637667, iterations_per_second: 274.901494}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.039293000, iterations_per_second: 25.449826}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.065159000, iterations_per_second: 15.347074}
