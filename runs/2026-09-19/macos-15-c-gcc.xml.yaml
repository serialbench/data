platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 769230.777900}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 250000.000631}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000694667, iterations_per_second: 1439.539347}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002017000, iterations_per_second: 495.785821}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.010196000, iterations_per_second: 98.077678}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.030987000, iterations_per_second: 32.271598}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000312, iterations_per_second: 3200000.080839}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000230042, iterations_per_second: 4347.038579}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.004288000, iterations_per_second: 233.208955}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000034800, iterations_per_second: 28735.632181}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000044100, iterations_per_second: 22675.736954}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002499667, iterations_per_second: 400.053340}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.003698000, iterations_per_second: 270.416441}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.039137000, iterations_per_second: 25.551269}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.064258000, iterations_per_second: 15.562265}
