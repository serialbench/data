platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009000, iterations_per_second: 111111.111111}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008400, iterations_per_second: 119047.618704}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001899333, iterations_per_second: 526.500527}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007732333, iterations_per_second: 129.327068}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.028173000, iterations_per_second: 35.494977}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.094770000, iterations_per_second: 10.551862}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001380, iterations_per_second: 724585.173791}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001585167, iterations_per_second: 630.848359}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.036277969, iterations_per_second: 27.564939}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000010900, iterations_per_second: 91743.119211}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000013000, iterations_per_second: 76923.076983}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003674667, iterations_per_second: 272.133527}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.011075667, iterations_per_second: 90.288019}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.051456000, iterations_per_second: 19.434080}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.137401000, iterations_per_second: 7.277967}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001977, iterations_per_second: 505868.066300}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002111288, iterations_per_second: 473.644599}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.038931851, iterations_per_second: 25.685909}
  xpath:
  xslt:
