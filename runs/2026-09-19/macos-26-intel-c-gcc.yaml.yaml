platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008500, iterations_per_second: 117647.058649}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007697000, iterations_per_second: 129.920748}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.093290000, iterations_per_second: 10.719263}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001380, iterations_per_second: 724795.241923}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001366051, iterations_per_second: 732.037091}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.030191436, iterations_per_second: 33.121975}
  xslt:
