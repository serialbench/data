platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000022400, iterations_per_second: 44642.857165}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000014000, iterations_per_second: 71428.571493}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002498333, iterations_per_second: 400.266845}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.010212667, iterations_per_second: 97.917619}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.039479000, iterations_per_second: 25.329922}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.131416000, iterations_per_second: 7.609424}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001788, iterations_per_second: 559190.297846}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002284624, iterations_per_second: 437.708723}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.042629451, iterations_per_second: 23.457961}
  xslt:
