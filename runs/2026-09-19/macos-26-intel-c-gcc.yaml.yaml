platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000010600, iterations_per_second: 94339.622627}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010100, iterations_per_second: 99009.901017}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002434000, iterations_per_second: 410.846343}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.009859000, iterations_per_second: 101.430165}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.037450000, iterations_per_second: 26.702270}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.119333000, iterations_per_second: 8.379912}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001731, iterations_per_second: 577533.930799}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001819756, iterations_per_second: 549.524222}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.038656649, iterations_per_second: 25.868771}
  xslt:
