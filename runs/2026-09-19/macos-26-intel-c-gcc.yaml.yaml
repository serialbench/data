platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008500, iterations_per_second: 117647.058649}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007758667, iterations_per_second: 128.888125}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.093406000, iterations_per_second: 10.705950}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001328, iterations_per_second: 753125.465215}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001369803, iterations_per_second: 730.031983}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029228321, iterations_per_second: 34.213392}
  xslt:
