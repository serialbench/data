platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009200, iterations_per_second: 108695.652180}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008700, iterations_per_second: 114942.528575}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002175000, iterations_per_second: 459.770115}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008506333, iterations_per_second: 117.559465}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.039447000, iterations_per_second: 25.350470}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.128813000, iterations_per_second: 7.763192}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001372, iterations_per_second: 729128.690003}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001449214, iterations_per_second: 690.029375}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.035831758, iterations_per_second: 27.908204}
  xslt:
