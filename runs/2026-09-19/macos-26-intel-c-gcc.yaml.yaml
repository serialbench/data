platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008900, iterations_per_second: 112359.550415}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008600, iterations_per_second: 116279.069754}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001938000, iterations_per_second: 515.995872}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008881333, iterations_per_second: 112.595706}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.028934000, iterations_per_second: 34.561416}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.107211000, iterations_per_second: 9.327401}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001566, iterations_per_second: 638610.386748}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001585512, iterations_per_second: 630.711221}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.035923228, iterations_per_second: 27.837142}
  xslt:
