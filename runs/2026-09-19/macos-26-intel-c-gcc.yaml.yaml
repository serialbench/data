platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011800, iterations_per_second: 84745.762763}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000012800, iterations_per_second: 78124.999920}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003007000, iterations_per_second: 332.557366}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.012411333, iterations_per_second: 80.571521}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.042790000, iterations_per_second: 23.369946}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.117067000, iterations_per_second: 8.542117}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001709, iterations_per_second: 585103.277899}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001853129, iterations_per_second: 539.627743}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.036788448, iterations_per_second: 27.182446}
