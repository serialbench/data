platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000013800, iterations_per_second: 72463.768120}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000013900, iterations_per_second: 71942.446019}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003225667, iterations_per_second: 310.013434}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.011422000, iterations_per_second: 87.550341}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.039477000, iterations_per_second: 25.331206}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.127210000, iterations_per_second: 7.861017}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001696, iterations_per_second: 589483.610494}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.005776559, iterations_per_second: 173.113440}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.041470933, iterations_per_second: 24.113275}
  xslt:
