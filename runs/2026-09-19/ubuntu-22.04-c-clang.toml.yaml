platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000568, iterations_per_second: 1760253.457449}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002127, iterations_per_second: 470145.744132}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000089612, iterations_per_second: 11159.261260}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000204154, iterations_per_second: 4898.271073}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001784563, iterations_per_second: 560.361276}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002271217, iterations_per_second: 440.292583}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000870, iterations_per_second: 1149954.000654}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000146315, iterations_per_second: 6834.569251}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002203399, iterations_per_second: 453.844265}
  xpath:
  xslt:
