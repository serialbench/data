platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000562, iterations_per_second: 1779042.879533}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002185, iterations_per_second: 457644.959346}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000076009, iterations_per_second: 13156.336750}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000198381, iterations_per_second: 5040.796849}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001773232, iterations_per_second: 563.942000}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002278336, iterations_per_second: 438.916824}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000828, iterations_per_second: 1208313.192320}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000125812, iterations_per_second: 7948.346347}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002192176, iterations_per_second: 456.167753}
  xpath:
  xslt:
