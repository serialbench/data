platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000608, iterations_per_second: 1643655.488185}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002222, iterations_per_second: 450146.297520}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000068344, iterations_per_second: 14631.790979}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000230047, iterations_per_second: 4346.944098}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001560982, iterations_per_second: 640.622377}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002154047, iterations_per_second: 464.242424}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000835, iterations_per_second: 1197318.006383}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000132350, iterations_per_second: 7555.742490}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001403867, iterations_per_second: 712.318190}
  xpath:
  xslt:
