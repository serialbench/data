platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000505, iterations_per_second: 1978630.793470}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001841, iterations_per_second: 543183.051142}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000050249, iterations_per_second: 19900.761534}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000157453, iterations_per_second: 6351.101598}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001002924, iterations_per_second: 997.084525}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.001823399, iterations_per_second: 548.426318}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000755, iterations_per_second: 1324678.769881}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000097196, iterations_per_second: 10288.489239}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001470833, iterations_per_second: 679.886840}
  xpath:
  xslt:
