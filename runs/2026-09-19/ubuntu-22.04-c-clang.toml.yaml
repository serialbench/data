platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000585, iterations_per_second: 1709693.967668}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002378, iterations_per_second: 420592.193700}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000083526, iterations_per_second: 11972.319997}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000203260, iterations_per_second: 4919.807144}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001829590, iterations_per_second: 546.570543}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002369945, iterations_per_second: 421.950720}
  xslt:
