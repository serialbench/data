platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000571, iterations_per_second: 1751313.490582}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002191, iterations_per_second: 456370.939015}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000079482, iterations_per_second: 12581.464987}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000212097, iterations_per_second: 4714.816468}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001686027, iterations_per_second: 593.110312}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002348247, iterations_per_second: 425.849581}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000868, iterations_per_second: 1152472.047324}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000139996, iterations_per_second: 7143.078237}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002190282, iterations_per_second: 456.562214}
  xpath:
  xslt:
