platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000606, iterations_per_second: 1649620.591925}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002190, iterations_per_second: 456600.155314}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000091484, iterations_per_second: 10930.833330}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000222583, iterations_per_second: 4492.712820}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001702442, iterations_per_second: 587.391523}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002286643, iterations_per_second: 437.322310}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000858, iterations_per_second: 1166044.776250}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000127852, iterations_per_second: 7821.523268}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002174793, iterations_per_second: 459.813877}
  xpath:
  xslt:
