platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000558, iterations_per_second: 1793400.275676}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002004, iterations_per_second: 498927.304718}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000060125, iterations_per_second: 16631.924424}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000184945, iterations_per_second: 5407.012896}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001122390, iterations_per_second: 890.955907}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002054258, iterations_per_second: 486.793772}
  xslt:
