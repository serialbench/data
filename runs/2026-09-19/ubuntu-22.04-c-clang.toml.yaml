platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000585, iterations_per_second: 1709109.562986}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002099, iterations_per_second: 476440.041165}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000080597, iterations_per_second: 12407.461019}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000206477, iterations_per_second: 4843.146624}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001782836, iterations_per_second: 560.904088}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002257519, iterations_per_second: 442.964157}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000868, iterations_per_second: 1152604.903064}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000142372, iterations_per_second: 7023.869452}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002192518, iterations_per_second: 456.096598}
  xpath:
  xslt:
