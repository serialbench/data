platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000463, iterations_per_second: 2161227.572684}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001771, iterations_per_second: 564748.405109}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000062254, iterations_per_second: 16063.224853}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000154460, iterations_per_second: 6474.182041}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001418881, iterations_per_second: 704.780739}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.001770141, iterations_per_second: 564.926749}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000638, iterations_per_second: 1567398.118611}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000103800, iterations_per_second: 9633.942306}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001805464, iterations_per_second: 553.874240}
  xpath:
  xslt:
