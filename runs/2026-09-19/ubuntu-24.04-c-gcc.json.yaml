platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: json-c, format: json, version: '0.17', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002576, iterations_per_second: 388228.899872}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003798467, iterations_per_second: 263.264124}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.047718894, iterations_per_second: 20.956060}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002770, iterations_per_second: 360984.766296}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002439430, iterations_per_second: 409.931772}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.044132440, iterations_per_second: 22.659069}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002201, iterations_per_second: 454318.296599}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002580954, iterations_per_second: 387.453631}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.034882719, iterations_per_second: 28.667490}
