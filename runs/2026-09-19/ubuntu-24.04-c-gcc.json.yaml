platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: json-c, format: json, version: '0.17', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000981, iterations_per_second: 1019575.848902}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002602, iterations_per_second: 384334.525349}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001732457, iterations_per_second: 577.215015}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003737289, iterations_per_second: 267.573634}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.008530231, iterations_per_second: 117.230120}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.052228110, iterations_per_second: 19.146777}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002888, iterations_per_second: 346212.435751}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002555730, iterations_per_second: 391.277639}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.041727121, iterations_per_second: 23.965229}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002185, iterations_per_second: 457644.960537}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002624305, iterations_per_second: 381.053318}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.042100588, iterations_per_second: 23.752637}
