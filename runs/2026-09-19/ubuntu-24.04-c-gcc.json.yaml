platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
    - {name: json-c, format: json, version: '0.17', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000001415, iterations_per_second: 706913.614544}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002534, iterations_per_second: 394679.717239}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001678987, iterations_per_second: 595.597108}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003633049, iterations_per_second: 275.250873}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.008150917, iterations_per_second: 122.685582}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.047052284, iterations_per_second: 21.252953}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002672, iterations_per_second: 374251.497091}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002579779, iterations_per_second: 387.630103}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.051654623, iterations_per_second: 19.359351}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002122, iterations_per_second: 471253.534228}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002510386, iterations_per_second: 398.345168}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.031422357, iterations_per_second: 31.824475}
