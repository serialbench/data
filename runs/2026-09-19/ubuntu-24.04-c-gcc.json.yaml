platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: json-c, format: json, version: '0.17', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000003702, iterations_per_second: 270131.554037}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002793, iterations_per_second: 358012.315691}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001690555, iterations_per_second: 591.521836}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003707632, iterations_per_second: 269.713931}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.008215417, iterations_per_second: 121.722367}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.046080948, iterations_per_second: 21.700942}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002824, iterations_per_second: 354057.498858}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002396737, iterations_per_second: 417.233931}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.036192120, iterations_per_second: 27.630324}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002196, iterations_per_second: 455352.670610}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002567715, iterations_per_second: 389.451322}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.033081048, iterations_per_second: 30.228788}
    - {adapter: simdjson, format: json, data_size: small, time_per_iteration: 0.000000160, iterations_per_second: 6238303.176933}
    - {adapter: simdjson, format: json, data_size: medium, time_per_iteration: 0.000129353, iterations_per_second: 7730.803127}
    - {adapter: simdjson, format: json, data_size: large, time_per_iteration: 0.001814527, iterations_per_second: 551.107809}
