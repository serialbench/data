    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001688059, iterations_per_second: 592.396356}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003675571, iterations_per_second: 272.066571}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.008110541, iterations_per_second: 123.296337}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.047012413, iterations_per_second: 21.270978}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002851, iterations_per_second: 350717.216488}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002414433, iterations_per_second: 414.175859}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.033917384, iterations_per_second: 29.483406}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454524.794519}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002519704, iterations_per_second: 396.872066}
