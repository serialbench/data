platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: json-c, format: json, version: '0.17', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000972, iterations_per_second: 1028912.440548}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002824, iterations_per_second: 354070.035375}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001671940, iterations_per_second: 598.107468}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003693989, iterations_per_second: 270.710089}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.008406921, iterations_per_second: 118.949613}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.051995478, iterations_per_second: 19.232442}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002882, iterations_per_second: 346933.110984}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002463979, iterations_per_second: 405.847670}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.044939364, iterations_per_second: 22.252206}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002235, iterations_per_second: 447387.258940}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002639495, iterations_per_second: 378.860398}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.036618153, iterations_per_second: 27.308860}
