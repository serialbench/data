platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000592, iterations_per_second: 1688903.910594}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004457, iterations_per_second: 224351.064419}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000081937, iterations_per_second: 12204.448928}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000500523, iterations_per_second: 1997.908855}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001680657, iterations_per_second: 595.005406}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005789154, iterations_per_second: 172.736811}
  xslt:
