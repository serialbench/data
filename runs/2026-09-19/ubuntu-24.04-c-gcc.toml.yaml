platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000429, iterations_per_second: 2333177.769159}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003835, iterations_per_second: 260769.792594}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000056148, iterations_per_second: 17810.073378}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000403846, iterations_per_second: 2476.191419}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001218108, iterations_per_second: 820.945269}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004839290, iterations_per_second: 206.641883}
  xslt:
