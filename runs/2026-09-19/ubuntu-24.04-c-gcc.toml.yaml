platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000595, iterations_per_second: 1680389.852858}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004379, iterations_per_second: 228357.425063}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000068331, iterations_per_second: 14634.646062}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000465422, iterations_per_second: 2148.589272}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001504678, iterations_per_second: 664.594019}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005635778, iterations_per_second: 177.437791}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000857, iterations_per_second: 1167406.025027}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000120812, iterations_per_second: 8277.300607}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001953095, iterations_per_second: 512.007864}
  xpath:
  xslt:
