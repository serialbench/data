platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000465, iterations_per_second: 2151925.975021}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003837, iterations_per_second: 260640.654716}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000057411, iterations_per_second: 17418.163662}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000403604, iterations_per_second: 2477.678184}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001223891, iterations_per_second: 817.066226}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004850894, iterations_per_second: 206.147568}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000625, iterations_per_second: 1600256.042299}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000097160, iterations_per_second: 10292.266049}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001588950, iterations_per_second: 629.346424}
  xpath:
  xslt:
