platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000524, iterations_per_second: 1907668.823413}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003217, iterations_per_second: 310887.272442}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000050342, iterations_per_second: 19864.129356}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000330181, iterations_per_second: 3028.638809}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000949522, iterations_per_second: 1053.161485}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003980084, iterations_per_second: 251.250979}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000729, iterations_per_second: 1371365.881869}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000090898, iterations_per_second: 11001.301820}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001346642, iterations_per_second: 742.587859}
  xpath:
  xslt:
