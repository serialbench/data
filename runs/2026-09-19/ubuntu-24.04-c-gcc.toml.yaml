platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000461, iterations_per_second: 2170609.930858}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003856, iterations_per_second: 259356.277839}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000056211, iterations_per_second: 17790.217753}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000422740, iterations_per_second: 2365.518313}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001210465, iterations_per_second: 826.128802}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004886236, iterations_per_second: 204.656509}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000638, iterations_per_second: 1567643.835196}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000097469, iterations_per_second: 10259.707393}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001613156, iterations_per_second: 619.902849}
  xpath:
  xslt:
