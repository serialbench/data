platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000574, iterations_per_second: 1741856.820766}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004331, iterations_per_second: 230888.226940}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000070141, iterations_per_second: 14256.928868}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000462044, iterations_per_second: 2164.294480}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001552955, iterations_per_second: 643.933662}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005654578, iterations_per_second: 176.847857}
  xslt:
