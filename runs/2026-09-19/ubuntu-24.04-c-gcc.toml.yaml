platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000603, iterations_per_second: 1658099.818138}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004395, iterations_per_second: 227520.931933}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000074322, iterations_per_second: 13454.905882}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000473216, iterations_per_second: 2113.199892}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001546735, iterations_per_second: 646.523160}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005666345, iterations_per_second: 176.480606}
  xslt:
