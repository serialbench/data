platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000573, iterations_per_second: 1746419.844363}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003581, iterations_per_second: 279251.605365}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000057206, iterations_per_second: 17480.683842}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000368431, iterations_per_second: 2714.212431}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001055790, iterations_per_second: 947.158052}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004457490, iterations_per_second: 224.341502}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000800, iterations_per_second: 1250781.733474}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000096696, iterations_per_second: 10341.653767}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001505967, iterations_per_second: 664.025175}
  xpath:
  xslt:
