platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000561, iterations_per_second: 1782531.198074}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004370, iterations_per_second: 228827.715561}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000066881, iterations_per_second: 14951.929547}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000483333, iterations_per_second: 2068.965517}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001456531, iterations_per_second: 686.562799}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005674184, iterations_per_second: 176.236795}
  xslt:
