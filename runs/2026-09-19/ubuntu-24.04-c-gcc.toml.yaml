platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000580, iterations_per_second: 1724137.932008}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004370, iterations_per_second: 228817.243727}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000071771, iterations_per_second: 13933.139508}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000476051, iterations_per_second: 2100.616741}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001492884, iterations_per_second: 669.844409}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005705706, iterations_per_second: 175.263149}
  xslt:
