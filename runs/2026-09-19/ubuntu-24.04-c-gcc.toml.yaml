platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000341, iterations_per_second: 2936857.561488}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002681, iterations_per_second: 372995.151340}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000040858, iterations_per_second: 24474.811339}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000269366, iterations_per_second: 3712.421018}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000965716, iterations_per_second: 1035.501120}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003230813, iterations_per_second: 309.519616}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000455, iterations_per_second: 2199252.252693}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000068540, iterations_per_second: 14590.020426}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001217687, iterations_per_second: 821.229101}
  xpath:
  xslt:
