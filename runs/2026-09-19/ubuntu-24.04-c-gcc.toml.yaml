platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000581, iterations_per_second: 1720874.205848}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004364, iterations_per_second: 229142.320344}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000069313, iterations_per_second: 14427.308008}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000470720, iterations_per_second: 2124.405167}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001480888, iterations_per_second: 675.270513}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005614565, iterations_per_second: 178.108188}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000862, iterations_per_second: 1160631.386985}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000126483, iterations_per_second: 7906.200833}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001985912, iterations_per_second: 503.546985}
  xpath:
  xslt:
