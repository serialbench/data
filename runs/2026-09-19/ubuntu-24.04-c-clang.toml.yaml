platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000446, iterations_per_second: 2243661.661544}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001640, iterations_per_second: 609607.412557}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000055919, iterations_per_second: 17882.902752}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000149504, iterations_per_second: 6688.769333}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001205520, iterations_per_second: 829.517553}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.001721441, iterations_per_second: 580.908669}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000645, iterations_per_second: 1550387.596715}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000095237, iterations_per_second: 10500.084000}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001579211, iterations_per_second: 633.227605}
  xpath:
  xslt:
