platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000591, iterations_per_second: 1691761.126722}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002079, iterations_per_second: 481023.617835}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000068054, iterations_per_second: 14694.285390}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000217185, iterations_per_second: 4604.362480}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001502925, iterations_per_second: 665.369197}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002373019, iterations_per_second: 421.404127}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000931, iterations_per_second: 1074460.083909}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000125334, iterations_per_second: 7978.680965}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002026131, iterations_per_second: 493.551503}
  xpath:
  xslt:
