platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000602, iterations_per_second: 1660853.681510}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002068, iterations_per_second: 483605.764616}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000080684, iterations_per_second: 12394.082237}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000203853, iterations_per_second: 4905.487606}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001566060, iterations_per_second: 638.545139}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002326399, iterations_per_second: 429.848878}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000887, iterations_per_second: 1127777.148747}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000125040, iterations_per_second: 7997.440819}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001981235, iterations_per_second: 504.735683}
  xpath:
  xslt:
