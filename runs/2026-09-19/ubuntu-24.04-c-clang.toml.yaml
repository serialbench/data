platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000397, iterations_per_second: 2516989.649893}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001449, iterations_per_second: 689988.271124}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000041338, iterations_per_second: 24190.622105}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000139705, iterations_per_second: 7157.939945}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000851280, iterations_per_second: 1174.701626}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.001529993, iterations_per_second: 653.597762}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000591, iterations_per_second: 1691474.964456}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000074481, iterations_per_second: 13426.242936}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001144793, iterations_per_second: 873.520366}
  xpath:
  xslt:
