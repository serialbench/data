platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000603, iterations_per_second: 1658099.818138}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002078, iterations_per_second: 481255.113095}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000072268, iterations_per_second: 13837.319251}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000209575, iterations_per_second: 4771.569083}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001641446, iterations_per_second: 609.218945}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002318139, iterations_per_second: 431.380517}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000874, iterations_per_second: 1144688.646804}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000119984, iterations_per_second: 8334.444593}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001990136, iterations_per_second: 502.478223}
  xpath:
  xslt:
