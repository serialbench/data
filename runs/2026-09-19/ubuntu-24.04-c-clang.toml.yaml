platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000580, iterations_per_second: 1723840.721234}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002143, iterations_per_second: 466635.557545}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000069153, iterations_per_second: 14460.758322}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000208079, iterations_per_second: 4805.867003}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001507488, iterations_per_second: 663.355198}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002419454, iterations_per_second: 413.316393}
  xslt:
