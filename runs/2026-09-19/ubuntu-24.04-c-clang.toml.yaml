platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000598, iterations_per_second: 1671961.206236}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002056, iterations_per_second: 486404.981308}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000076407, iterations_per_second: 13087.863187}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000204280, iterations_per_second: 4895.249813}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001529478, iterations_per_second: 653.817839}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002319330, iterations_per_second: 431.158999}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000891, iterations_per_second: 1122838.535185}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000128187, iterations_per_second: 7801.103076}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002027341, iterations_per_second: 493.256931}
  xpath:
  xslt:
