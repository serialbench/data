platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000598, iterations_per_second: 1671961.214181}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002404, iterations_per_second: 415904.175926}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000074625, iterations_per_second: 13400.275152}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000202022, iterations_per_second: 4949.955945}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001516889, iterations_per_second: 659.244019}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002342723, iterations_per_second: 426.853708}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000887, iterations_per_second: 1127904.357108}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000119485, iterations_per_second: 8369.228023}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001996240, iterations_per_second: 500.941771}
  xpath:
  xslt:
