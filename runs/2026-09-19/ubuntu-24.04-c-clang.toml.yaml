platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000456, iterations_per_second: 2194426.152206}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001655, iterations_per_second: 604083.604713}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000056483, iterations_per_second: 17704.442045}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000160329, iterations_per_second: 6237.161842}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001224692, iterations_per_second: 816.531830}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.001798906, iterations_per_second: 555.893415}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000652, iterations_per_second: 1533742.331417}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000094262, iterations_per_second: 10608.728863}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001614074, iterations_per_second: 619.550281}
  xpath:
  xslt:
