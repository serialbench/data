    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003147000, iterations_per_second: 317.762949}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.006492000, iterations_per_second: 154.035736}
