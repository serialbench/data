    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.023359000, iterations_per_second: 42.810052}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000001413, iterations_per_second: 707964.601421}
