    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.000536667, iterations_per_second: 1863.354037}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003165000, iterations_per_second: 315.955766}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.006733000, iterations_per_second: 148.522204}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.039965000, iterations_per_second: 25.021894}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 400000.000100}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002011667, iterations_per_second: 497.100249}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.043278000, iterations_per_second: 23.106428}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002392, iterations_per_second: 418112.640165}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.001651972, iterations_per_second: 605.337136}
