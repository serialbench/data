    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370526}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.000545333, iterations_per_second: 1833.740831}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003516333, iterations_per_second: 284.387146}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.006999000, iterations_per_second: 142.877554}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.046647000, iterations_per_second: 21.437606}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000003100, iterations_per_second: 322580.645384}
