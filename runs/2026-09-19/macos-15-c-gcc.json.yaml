    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.383905}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.000537000, iterations_per_second: 1862.197393}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.002850333, iterations_per_second: 350.836160}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.006435000, iterations_per_second: 155.400155}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.038372000, iterations_per_second: 26.060669}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.369746}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.001894000, iterations_per_second: 527.983105}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.032300000, iterations_per_second: 30.959752}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000001575, iterations_per_second: 634920.633086}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.001674361, iterations_per_second: 597.242650}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.025806583, iterations_per_second: 38.749803}
    - {adapter: simdjson, format: json, data_size: small, time_per_iteration: 0.000000146, iterations_per_second: 6858710.630002}
    - {adapter: simdjson, format: json, data_size: medium, time_per_iteration: 0.000115514, iterations_per_second: 8656.959330}
