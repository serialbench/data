platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000006200, iterations_per_second: 161290.322396}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000015400, iterations_per_second: 64935.064811}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002153667, iterations_per_second: 464.324408}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.009927333, iterations_per_second: 100.731986}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.038062000, iterations_per_second: 26.272923}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.113050000, iterations_per_second: 8.845644}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000767, iterations_per_second: 1303441.039389}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000481697, iterations_per_second: 2075.995266}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.010431604, iterations_per_second: 95.862535}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000158200, iterations_per_second: 6321.112516}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000195600, iterations_per_second: 5112.474437}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.010580000, iterations_per_second: 94.517958}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.017328333, iterations_per_second: 57.708955}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.159040000, iterations_per_second: 6.287726}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.193789000, iterations_per_second: 5.160252}
