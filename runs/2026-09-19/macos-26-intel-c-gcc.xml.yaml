platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000004800, iterations_per_second: 208333.333859}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000013100, iterations_per_second: 76335.877857}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001452000, iterations_per_second: 688.705234}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.007672333, iterations_per_second: 130.338445}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.019191000, iterations_per_second: 52.107759}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.074175000, iterations_per_second: 13.481631}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000607, iterations_per_second: 1646632.603087}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000389099, iterations_per_second: 2570.040016}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.006328793, iterations_per_second: 158.008012}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000098800, iterations_per_second: 10121.457490}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000102500, iterations_per_second: 9756.097561}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.005842333, iterations_per_second: 171.164489}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.009160667, iterations_per_second: 109.162361}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.113416000, iterations_per_second: 8.817098}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.146251000, iterations_per_second: 6.837560}
