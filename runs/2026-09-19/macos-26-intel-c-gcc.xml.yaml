platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000004100, iterations_per_second: 243902.438964}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000010300, iterations_per_second: 97087.378618}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001200333, iterations_per_second: 833.101916}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.006682333, iterations_per_second: 149.648326}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.022957000, iterations_per_second: 43.559699}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.088642000, iterations_per_second: 11.281334}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000687, iterations_per_second: 1456027.952761}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000389116, iterations_per_second: 2569.929935}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.006948522, iterations_per_second: 143.915497}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000140900, iterations_per_second: 7097.232079}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000193600, iterations_per_second: 5165.289256}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.006935667, iterations_per_second: 144.182246}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.011821667, iterations_per_second: 84.590441}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.145195000, iterations_per_second: 6.887290}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.153678000, iterations_per_second: 6.507112}
