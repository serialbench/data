platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000006900, iterations_per_second: 144927.536359}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000017900, iterations_per_second: 55865.921822}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002392667, iterations_per_second: 417.943717}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.011220000, iterations_per_second: 89.126560}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.033476000, iterations_per_second: 29.872147}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.130339000, iterations_per_second: 7.672301}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000981, iterations_per_second: 1019575.860720}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000770940, iterations_per_second: 1297.118365}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.012206840, iterations_per_second: 81.921283}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000182000, iterations_per_second: 5494.505494}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000221500, iterations_per_second: 4514.672686}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.010292667, iterations_per_second: 97.156552}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.017225000, iterations_per_second: 58.055152}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.185425000, iterations_per_second: 5.393016}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.236314000, iterations_per_second: 4.231658}
