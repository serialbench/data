platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.645834}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000009100, iterations_per_second: 109890.110030}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001114333, iterations_per_second: 897.397547}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.005884333, iterations_per_second: 169.942786}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.020934000, iterations_per_second: 47.769179}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.078430000, iterations_per_second: 12.750223}
  xslt:
