platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000000973, iterations_per_second: 1027221.367058}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000005704, iterations_per_second: 175321.715322}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000541412, iterations_per_second: 1847.021094}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002626864, iterations_per_second: 380.682012}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.017160877, iterations_per_second: 58.272080}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.046121693, iterations_per_second: 21.681771}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000336, iterations_per_second: 2976190.469103}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000210493, iterations_per_second: 4750.759330}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.002920352, iterations_per_second: 342.424475}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000038544, iterations_per_second: 25944.173328}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000052146, iterations_per_second: 19176.815997}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002387072, iterations_per_second: 418.923325}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004467115, iterations_per_second: 223.858111}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.051797486, iterations_per_second: 19.305956}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.072131331, iterations_per_second: 13.863601}
