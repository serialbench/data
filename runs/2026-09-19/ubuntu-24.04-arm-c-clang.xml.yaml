platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000000971, iterations_per_second: 1029654.029394}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000005740, iterations_per_second: 174203.888178}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000533243, iterations_per_second: 1875.316460}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002498273, iterations_per_second: 400.276564}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.016321399, iterations_per_second: 61.269258}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.043472269, iterations_per_second: 23.003170}
  xslt:
