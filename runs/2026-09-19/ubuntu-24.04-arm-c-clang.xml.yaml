platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000000979, iterations_per_second: 1021241.831529}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000008118, iterations_per_second: 123184.567429}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000544031, iterations_per_second: 1838.130548}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002523350, iterations_per_second: 396.298571}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.016412075, iterations_per_second: 60.930748}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.044224646, iterations_per_second: 22.611826}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000338, iterations_per_second: 2961208.161570}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000213221, iterations_per_second: 4689.969562}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.002924421, iterations_per_second: 341.948030}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000034832, iterations_per_second: 28709.480157}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000053899, iterations_per_second: 18553.288755}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002392046, iterations_per_second: 418.052103}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004428832, iterations_per_second: 225.793183}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.053625332, iterations_per_second: 18.647903}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.070792484, iterations_per_second: 14.125793}
