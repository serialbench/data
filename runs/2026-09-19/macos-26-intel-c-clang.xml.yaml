platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000003300, iterations_per_second: 303030.302751}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000008700, iterations_per_second: 114942.528575}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001444000, iterations_per_second: 692.520776}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.006776333, iterations_per_second: 147.572433}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.020655000, iterations_per_second: 48.414427}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.070376000, iterations_per_second: 14.209390}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000504, iterations_per_second: 1983339.989991}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000266583, iterations_per_second: 3751.181621}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.005154650, iterations_per_second: 193.999593}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000112000, iterations_per_second: 8928.571428}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000119000, iterations_per_second: 8403.361345}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.005619000, iterations_per_second: 177.967610}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.008031667, iterations_per_second: 124.507159}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.105093000, iterations_per_second: 9.515382}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.116427000, iterations_per_second: 8.589073}
