platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000007800, iterations_per_second: 128205.128155}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000016000, iterations_per_second: 62500.000069}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002093333, iterations_per_second: 477.707006}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.009863000, iterations_per_second: 101.389030}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.032579000, iterations_per_second: 30.694619}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.090200000, iterations_per_second: 11.086475}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000631, iterations_per_second: 1585288.544913}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000357866, iterations_per_second: 2794.344619}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.007010465, iterations_per_second: 142.643890}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000144100, iterations_per_second: 6939.625261}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000132100, iterations_per_second: 7570.022710}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.011387667, iterations_per_second: 87.814302}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.013714000, iterations_per_second: 72.918186}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.128196000, iterations_per_second: 7.800555}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.148134000, iterations_per_second: 6.750645}
