platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.778479}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000009400, iterations_per_second: 106382.978735}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001083000, iterations_per_second: 923.361034}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.005709667, iterations_per_second: 175.141573}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.021141000, iterations_per_second: 47.301452}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.078359000, iterations_per_second: 12.761776}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000653, iterations_per_second: 1531628.103144}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000333425, iterations_per_second: 2999.172228}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.006370506, iterations_per_second: 156.973402}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000109700, iterations_per_second: 9115.770282}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000114700, iterations_per_second: 8718.395816}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.006383000, iterations_per_second: 156.666144}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.009506333, iterations_per_second: 105.193029}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.109929000, iterations_per_second: 9.096781}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.128108000, iterations_per_second: 7.805914}
