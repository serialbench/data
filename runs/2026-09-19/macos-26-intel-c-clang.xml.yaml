platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000005200, iterations_per_second: 192307.692793}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000011800, iterations_per_second: 84745.762763}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001332333, iterations_per_second: 750.562922}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.004731333, iterations_per_second: 211.356911}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.019958000, iterations_per_second: 50.105221}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.068379000, iterations_per_second: 14.624373}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000515, iterations_per_second: 1939864.360501}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000345553, iterations_per_second: 2893.912077}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.006275627, iterations_per_second: 159.346628}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000100500, iterations_per_second: 9950.248755}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000102600, iterations_per_second: 9746.588695}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.005384667, iterations_per_second: 185.712517}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.009952000, iterations_per_second: 100.482315}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.102772000, iterations_per_second: 9.730277}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.120738000, iterations_per_second: 8.282397}
