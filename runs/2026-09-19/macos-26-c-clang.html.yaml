platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666456}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000018900, iterations_per_second: 52910.052885}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000020700, iterations_per_second: 48309.178733}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003432000, iterations_per_second: 291.375291}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005132333, iterations_per_second: 194.843151}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000985667, iterations_per_second: 1014.541765}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.035503000, iterations_per_second: 28.166634}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.061538000, iterations_per_second: 16.250122}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009192000, iterations_per_second: 108.790252}
  xslt:
