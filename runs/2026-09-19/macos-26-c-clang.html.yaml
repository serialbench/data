    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000013400, iterations_per_second: 74626.865670}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000018400, iterations_per_second: 54347.826090}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001657000, iterations_per_second: 603.500302}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003241000, iterations_per_second: 308.546745}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001087333, iterations_per_second: 919.681177}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.015403000, iterations_per_second: 64.922418}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.030146000, iterations_per_second: 33.171897}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009146000, iterations_per_second: 109.337415}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000008800, iterations_per_second: 113636.363630}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000017000, iterations_per_second: 58823.529403}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001787333, iterations_per_second: 559.492727}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001646000, iterations_per_second: 607.533414}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.016494000, iterations_per_second: 60.628107}
