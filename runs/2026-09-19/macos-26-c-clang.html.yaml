platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.333228}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004600, iterations_per_second: 217391.304359}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005800, iterations_per_second: 172413.793116}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001630333, iterations_per_second: 613.371499}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003210333, iterations_per_second: 311.494134}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001139000, iterations_per_second: 877.963126}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.016889000, iterations_per_second: 59.210137}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.033535000, iterations_per_second: 29.819591}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010065000, iterations_per_second: 99.354198}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312499.999956}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007100, iterations_per_second: 140845.070440}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001705000, iterations_per_second: 586.510264}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001440333, iterations_per_second: 694.283731}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018146000, iterations_per_second: 55.108564}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013907000, iterations_per_second: 71.906234}
  xpath:
  xslt:
