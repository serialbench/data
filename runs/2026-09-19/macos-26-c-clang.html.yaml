platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005200, iterations_per_second: 192307.691952}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000013700, iterations_per_second: 72992.700733}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000014100, iterations_per_second: 70921.985823}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001602667, iterations_per_second: 623.960067}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003158667, iterations_per_second: 316.589278}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001013000, iterations_per_second: 987.166831}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.017156000, iterations_per_second: 58.288645}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.032181000, iterations_per_second: 31.074236}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009531000, iterations_per_second: 104.920785}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000007200, iterations_per_second: 138888.888801}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000015200, iterations_per_second: 65789.473653}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001683667, iterations_per_second: 593.941794}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001391000, iterations_per_second: 718.907261}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.017109000, iterations_per_second: 58.448770}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014326000, iterations_per_second: 69.803155}
