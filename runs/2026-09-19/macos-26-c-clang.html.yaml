platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454545.455693}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005200, iterations_per_second: 192307.692793}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008400, iterations_per_second: 119047.619026}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001967000, iterations_per_second: 508.388409}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.006340667, iterations_per_second: 157.712123}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001125333, iterations_per_second: 888.625592}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.054756000, iterations_per_second: 18.262839}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.082484000, iterations_per_second: 12.123563}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010264000, iterations_per_second: 97.427903}
  xslt:
