    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005700, iterations_per_second: 175438.596497}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001641000, iterations_per_second: 609.384522}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003014333, iterations_per_second: 331.748314}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000962667, iterations_per_second: 1038.781163}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.017724000, iterations_per_second: 56.420673}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.034795000, iterations_per_second: 28.739761}
