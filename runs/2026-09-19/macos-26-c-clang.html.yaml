platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454545.454519}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006900, iterations_per_second: 144927.536240}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001541333, iterations_per_second: 648.788927}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003273333, iterations_per_second: 305.498982}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001072667, iterations_per_second: 932.256060}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.017924000, iterations_per_second: 55.791118}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.032671000, iterations_per_second: 30.608185}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010468000, iterations_per_second: 95.529232}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.333228}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007100, iterations_per_second: 140845.070440}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001776667, iterations_per_second: 562.851782}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001471000, iterations_per_second: 679.809653}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.017312000, iterations_per_second: 57.763401}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014610000, iterations_per_second: 68.446270}
  xpath:
  xslt:
