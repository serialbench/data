platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000004900, iterations_per_second: 204081.632576}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006300, iterations_per_second: 158730.158773}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.006851000, iterations_per_second: 145.964093}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001081000, iterations_per_second: 925.069380}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.086872000, iterations_per_second: 11.511189}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010928000, iterations_per_second: 91.508053}
  xslt:
