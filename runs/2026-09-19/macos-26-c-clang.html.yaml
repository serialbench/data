    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007900, iterations_per_second: 126582.278482}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001825333, iterations_per_second: 547.845142}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001563000, iterations_per_second: 639.795266}
