    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000020500, iterations_per_second: 48780.487793}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003156333, iterations_per_second: 316.823318}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004125333, iterations_per_second: 242.404654}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000976000, iterations_per_second: 1024.590164}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.015404000, iterations_per_second: 64.918203}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.030107000, iterations_per_second: 33.214867}
