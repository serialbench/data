    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000028200, iterations_per_second: 35460.992912}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002837333, iterations_per_second: 352.443609}
