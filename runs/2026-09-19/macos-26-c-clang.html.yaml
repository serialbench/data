    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004460333, iterations_per_second: 224.198490}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001726000, iterations_per_second: 579.374276}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.027446000, iterations_per_second: 36.435182}
