platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005400, iterations_per_second: 185185.185165}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000011400, iterations_per_second: 87719.298248}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000027100, iterations_per_second: 36900.369004}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003019000, iterations_per_second: 331.235508}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003954667, iterations_per_second: 252.865813}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001224667, iterations_per_second: 816.548721}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.026823000, iterations_per_second: 37.281438}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.052804000, iterations_per_second: 18.937959}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017891000, iterations_per_second: 55.894025}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000007500, iterations_per_second: 133333.333316}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000021000, iterations_per_second: 47619.047617}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002586000, iterations_per_second: 386.697602}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002627667, iterations_per_second: 380.565774}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023432000, iterations_per_second: 42.676681}
