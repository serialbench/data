    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008200, iterations_per_second: 121951.219820}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003498000, iterations_per_second: 285.877644}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004777667, iterations_per_second: 209.307193}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001803333, iterations_per_second: 554.528651}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.027539000, iterations_per_second: 36.312139}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.065650000, iterations_per_second: 15.232292}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018983000, iterations_per_second: 52.678713}
