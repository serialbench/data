    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001745333, iterations_per_second: 572.956455}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003424333, iterations_per_second: 292.027645}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001282667, iterations_per_second: 779.625780}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018312000, iterations_per_second: 54.609000}
