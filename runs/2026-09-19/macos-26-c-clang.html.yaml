    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001935667, iterations_per_second: 516.617875}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003759000, iterations_per_second: 266.028199}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001255667, iterations_per_second: 796.389700}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019861000, iterations_per_second: 50.349932}
