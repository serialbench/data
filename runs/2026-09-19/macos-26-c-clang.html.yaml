    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010200, iterations_per_second: 98039.215688}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001671333, iterations_per_second: 598.324691}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003294667, iterations_per_second: 303.520842}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001128667, iterations_per_second: 886.001181}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020497000, iterations_per_second: 48.787627}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.038533000, iterations_per_second: 25.951782}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012509000, iterations_per_second: 79.942441}
  generation:
