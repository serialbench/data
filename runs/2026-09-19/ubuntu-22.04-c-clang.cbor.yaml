platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000866, iterations_per_second: 1154734.404602}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001041, iterations_per_second: 960984.047550}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000465120, iterations_per_second: 2149.984341}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001491152, iterations_per_second: 670.622445}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013072251, iterations_per_second: 76.497919}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030217488, iterations_per_second: 33.093419}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000328, iterations_per_second: 3049710.279619}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000325116, iterations_per_second: 3075.825244}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004024121, iterations_per_second: 248.501474}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001517, iterations_per_second: 659152.331289}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001465, iterations_per_second: 682500.682296}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001694031, iterations_per_second: 590.307970}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001955087, iterations_per_second: 511.486277}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.020575221, iterations_per_second: 48.602151}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.036805922, iterations_per_second: 27.169541}
  xpath:
  xslt:
