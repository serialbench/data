platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001128, iterations_per_second: 886446.240462}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001202, iterations_per_second: 831808.349885}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000814692, iterations_per_second: 1227.457739}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001999437, iterations_per_second: 500.140873}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.030959818, iterations_per_second: 32.299931}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.041774431, iterations_per_second: 23.938088}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000454, iterations_per_second: 2203613.934281}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000448002, iterations_per_second: 2232.132892}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005609412, iterations_per_second: 178.271805}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001902, iterations_per_second: 525872.948814}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001794, iterations_per_second: 557320.403844}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003168299, iterations_per_second: 315.626810}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002530294, iterations_per_second: 395.210991}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.037344276, iterations_per_second: 26.777866}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.049423110, iterations_per_second: 20.233449}
  xpath:
  xslt:
