platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001224, iterations_per_second: 816859.990409}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001232, iterations_per_second: 811490.708901}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000877407, iterations_per_second: 1139.722364}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001984717, iterations_per_second: 503.850171}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.028755832, iterations_per_second: 34.775554}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.042632352, iterations_per_second: 23.456365}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000444, iterations_per_second: 2253267.242260}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000451870, iterations_per_second: 2213.027503}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005643632, iterations_per_second: 177.190859}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002098, iterations_per_second: 476644.422888}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001744, iterations_per_second: 573328.746679}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003279365, iterations_per_second: 304.937084}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002544525, iterations_per_second: 393.000607}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.039619860, iterations_per_second: 25.239867}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.050461369, iterations_per_second: 19.817140}
  xpath:
