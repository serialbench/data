platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001063, iterations_per_second: 940733.780654}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001206, iterations_per_second: 828981.183119}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000847656, iterations_per_second: 1179.723850}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001999123, iterations_per_second: 500.219430}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.028405619, iterations_per_second: 35.204302}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.042136917, iterations_per_second: 23.732159}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000463, iterations_per_second: 2160760.561547}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000448857, iterations_per_second: 2227.882695}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005600192, iterations_per_second: 178.565306}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001863, iterations_per_second: 536912.750166}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001792, iterations_per_second: 557911.178169}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003207530, iterations_per_second: 311.766407}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002531620, iterations_per_second: 395.004042}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.037868207, iterations_per_second: 26.407377}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.049286319, iterations_per_second: 20.289606}
  xpath:
  xslt:
