platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000866, iterations_per_second: 1154334.523894}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000956, iterations_per_second: 1045587.622286}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000549432, iterations_per_second: 1820.060341}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001560875, iterations_per_second: 640.666156}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.020367023, iterations_per_second: 49.098977}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033955506, iterations_per_second: 29.450305}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000351, iterations_per_second: 2844950.256900}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000350118, iterations_per_second: 2856.177197}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004417225, iterations_per_second: 226.386476}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001417, iterations_per_second: 705616.707932}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001408, iterations_per_second: 710126.402148}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002252299, iterations_per_second: 443.990850}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002016980, iterations_per_second: 495.790655}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.028153387, iterations_per_second: 35.519705}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.042046656, iterations_per_second: 23.783104}
  xpath:
  xslt:
