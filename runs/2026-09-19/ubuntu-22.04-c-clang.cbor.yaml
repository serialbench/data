platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001116, iterations_per_second: 895977.062721}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001218, iterations_per_second: 820815.891299}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000825836, iterations_per_second: 1210.893684}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002010886, iterations_per_second: 497.293233}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.028281140, iterations_per_second: 35.359254}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.042676144, iterations_per_second: 23.432295}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000450, iterations_per_second: 2223210.310857}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000447353, iterations_per_second: 2235.371172}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005599651, iterations_per_second: 178.582558}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001908, iterations_per_second: 524218.913792}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001727, iterations_per_second: 578938.226425}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003138387, iterations_per_second: 318.635019}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002538196, iterations_per_second: 393.980607}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.038060356, iterations_per_second: 26.274058}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.050679545, iterations_per_second: 19.731827}
  xpath:
  xslt:
