platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001149, iterations_per_second: 870246.287603}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001206, iterations_per_second: 829049.893441}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000823206, iterations_per_second: 1214.763261}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002002396, iterations_per_second: 499.401717}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.029147201, iterations_per_second: 34.308612}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.044514072, iterations_per_second: 22.464806}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000460, iterations_per_second: 2174385.725770}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000453508, iterations_per_second: 2205.031147}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005675566, iterations_per_second: 176.193881}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001926, iterations_per_second: 519318.663847}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001722, iterations_per_second: 580652.646026}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003185952, iterations_per_second: 313.877957}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002566094, iterations_per_second: 389.697287}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.039149089, iterations_per_second: 25.543379}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.054451498, iterations_per_second: 18.364968}
  xpath:
  xslt:
