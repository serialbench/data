platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001134, iterations_per_second: 881756.458555}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001211, iterations_per_second: 825559.318591}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000841025, iterations_per_second: 1189.024825}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002010445, iterations_per_second: 497.402316}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.028210182, iterations_per_second: 35.448194}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.044736351, iterations_per_second: 22.353187}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000451, iterations_per_second: 2218278.607073}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000449926, iterations_per_second: 2222.587714}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005690227, iterations_per_second: 175.739913}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001896, iterations_per_second: 527287.108355}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001728, iterations_per_second: 578603.252522}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003174896, iterations_per_second: 314.970947}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002538501, iterations_per_second: 393.933322}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.038514941, iterations_per_second: 25.963950}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.051537980, iterations_per_second: 19.403166}
  xpath:
  xslt:
