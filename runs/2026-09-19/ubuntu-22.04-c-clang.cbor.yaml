platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001172, iterations_per_second: 853096.740395}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001266, iterations_per_second: 789639.924430}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000854584, iterations_per_second: 1170.160441}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002020476, iterations_per_second: 494.932959}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.028238807, iterations_per_second: 35.412261}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.043140493, iterations_per_second: 23.180078}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000496, iterations_per_second: 2016535.582475}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000489067, iterations_per_second: 2044.708227}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005706032, iterations_per_second: 175.253136}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001981, iterations_per_second: 504872.014918}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001759, iterations_per_second: 568407.889647}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003209681, iterations_per_second: 311.557441}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002540133, iterations_per_second: 393.680173}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.038525519, iterations_per_second: 25.956821}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.053258117, iterations_per_second: 18.776481}
  xpath:
  xslt:
