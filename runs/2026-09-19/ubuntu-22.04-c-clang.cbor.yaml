platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002655, iterations_per_second: 376676.209217}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000981, iterations_per_second: 1019160.208843}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000572097, iterations_per_second: 1747.954311}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001546632, iterations_per_second: 646.566077}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013880688, iterations_per_second: 72.042539}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.028967938, iterations_per_second: 34.520924}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000332, iterations_per_second: 3008423.607218}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000320244, iterations_per_second: 3122.615753}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004599571, iterations_per_second: 217.411580}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001574, iterations_per_second: 635122.261653}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001377, iterations_per_second: 726321.904248}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001933333, iterations_per_second: 517.241468}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001924862, iterations_per_second: 519.517853}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022626265, iterations_per_second: 44.196424}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.036202465, iterations_per_second: 27.622428}
  xpath:
  xslt:
