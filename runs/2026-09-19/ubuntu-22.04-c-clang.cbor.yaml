platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001117, iterations_per_second: 895174.998980}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001219, iterations_per_second: 820142.706511}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000858894, iterations_per_second: 1164.287574}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001999059, iterations_per_second: 500.235444}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.027803339, iterations_per_second: 35.966903}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.042017870, iterations_per_second: 23.799398}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000449, iterations_per_second: 2227667.608107}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000450508, iterations_per_second: 2219.718051}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005702237, iterations_per_second: 175.369772}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001920, iterations_per_second: 520941.861822}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001726, iterations_per_second: 579307.147694}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003155684, iterations_per_second: 316.888543}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002526366, iterations_per_second: 395.825466}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.037708643, iterations_per_second: 26.519119}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.053422815, iterations_per_second: 18.718594}
  xpath:
  xslt:
