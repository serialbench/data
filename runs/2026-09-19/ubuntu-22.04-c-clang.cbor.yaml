platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001178, iterations_per_second: 848752.333968}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001261, iterations_per_second: 792769.937322}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000836416, iterations_per_second: 1195.576844}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002030440, iterations_per_second: 492.504007}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.029572894, iterations_per_second: 33.814749}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.045126714, iterations_per_second: 22.159823}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000444, iterations_per_second: 2253267.227829}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000451998, iterations_per_second: 2212.400801}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005585647, iterations_per_second: 179.030290}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001983, iterations_per_second: 504388.177888}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001779, iterations_per_second: 562018.771945}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003192151, iterations_per_second: 313.268389}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002561817, iterations_per_second: 390.347995}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.038789875, iterations_per_second: 25.779923}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.053226187, iterations_per_second: 18.787744}
  xpath:
  xslt:
