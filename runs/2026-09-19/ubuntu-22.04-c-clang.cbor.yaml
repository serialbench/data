platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001098, iterations_per_second: 910746.825436}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001219, iterations_per_second: 820142.706511}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002418499, iterations_per_second: 413.479657}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001949208, iterations_per_second: 513.028881}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.027865247, iterations_per_second: 35.886996}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040915247, iterations_per_second: 24.440767}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000444, iterations_per_second: 2252759.683949}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000445309, iterations_per_second: 2245.631685}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005566151, iterations_per_second: 179.657361}
  xslt:
