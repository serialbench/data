    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.000665333, iterations_per_second: 1503.006012}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.008930333, iterations_per_second: 111.977903}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.012165000, iterations_per_second: 82.203042}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.112555000, iterations_per_second: 8.884545}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000006600, iterations_per_second: 151515.151376}
