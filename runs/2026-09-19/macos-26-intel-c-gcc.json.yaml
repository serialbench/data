platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: json-c, format: json, version: '0.19', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.425727}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.007685333, iterations_per_second: 130.117974}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.096502000, iterations_per_second: 10.362480}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000006200, iterations_per_second: 161290.322396}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.006129000, iterations_per_second: 163.158753}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.078351000, iterations_per_second: 12.763079}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000004449, iterations_per_second: 224774.664816}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.004822337, iterations_per_second: 207.368350}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.064671241, iterations_per_second: 15.462824}
