platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: json-c, format: json, version: '0.19', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.426338}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.007402000, iterations_per_second: 135.098622}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.096258000, iterations_per_second: 10.388747}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000007700, iterations_per_second: 129870.130006}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.006256333, iterations_per_second: 159.838031}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.077158000, iterations_per_second: 12.960419}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000004581, iterations_per_second: 218273.891009}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.004855185, iterations_per_second: 205.965375}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.063631406, iterations_per_second: 15.715510}
  xslt:
