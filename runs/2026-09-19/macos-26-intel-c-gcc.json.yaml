platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: json-c, format: json, version: '0.19', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000012000, iterations_per_second: 83333.333386}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.013039000, iterations_per_second: 76.692998}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.131653000, iterations_per_second: 7.595725}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000015100, iterations_per_second: 66225.165581}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.008974667, iterations_per_second: 111.424751}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.106083000, iterations_per_second: 9.426581}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000005826, iterations_per_second: 171653.192291}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.006165594, iterations_per_second: 162.190383}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.086372953, iterations_per_second: 11.577698}
