platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: json-c, format: json, version: '0.19', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.556958}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000010500, iterations_per_second: 95238.095272}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001245333, iterations_per_second: 802.997859}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.012636000, iterations_per_second: 79.138968}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.013921000, iterations_per_second: 71.833920}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.273349000, iterations_per_second: 3.658327}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000007900, iterations_per_second: 126582.278527}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.046112333, iterations_per_second: 21.686172}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.224093000, iterations_per_second: 4.462433}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000005624, iterations_per_second: 177822.035777}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.006502389, iterations_per_second: 153.789622}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.110743493, iterations_per_second: 9.029876}
