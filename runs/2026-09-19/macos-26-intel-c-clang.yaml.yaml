    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000012900, iterations_per_second: 77519.379836}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003652667, iterations_per_second: 273.772586}
