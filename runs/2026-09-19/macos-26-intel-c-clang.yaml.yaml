    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001900000, iterations_per_second: 526.315789}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007803333, iterations_per_second: 128.150363}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.029173000, iterations_per_second: 34.278271}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.107615000, iterations_per_second: 9.292385}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001397, iterations_per_second: 716075.898538}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001597261, iterations_per_second: 626.071887}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031113454, iterations_per_second: 32.140437}
  generation:
