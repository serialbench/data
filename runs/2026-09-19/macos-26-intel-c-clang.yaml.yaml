platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009000, iterations_per_second: 111111.111111}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008500, iterations_per_second: 117647.058963}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001929000, iterations_per_second: 518.403318}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008437000, iterations_per_second: 118.525542}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.032325000, iterations_per_second: 30.935808}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.094258000, iterations_per_second: 10.609179}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001424, iterations_per_second: 702099.281967}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001307922, iterations_per_second: 764.571393}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029419329, iterations_per_second: 33.991258}
  xslt:
