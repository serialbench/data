platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009100, iterations_per_second: 109890.109893}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008531667, iterations_per_second: 117.210393}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.100158000, iterations_per_second: 9.984225}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001372, iterations_per_second: 729128.690003}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001362196, iterations_per_second: 734.108928}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.030528613, iterations_per_second: 32.756156}
  xslt:
