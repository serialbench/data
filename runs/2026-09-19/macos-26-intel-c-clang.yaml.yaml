platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008800, iterations_per_second: 113636.363630}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007950667, iterations_per_second: 125.775616}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.095987000, iterations_per_second: 10.418077}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001393, iterations_per_second: 717926.626178}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001352309, iterations_per_second: 739.476145}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031969574, iterations_per_second: 31.279741}
  xslt:
