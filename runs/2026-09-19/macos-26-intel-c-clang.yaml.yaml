platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011100, iterations_per_second: 90090.090225}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010500, iterations_per_second: 95238.095375}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002395667, iterations_per_second: 417.420342}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.009679333, iterations_per_second: 103.312900}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.035540000, iterations_per_second: 28.137310}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.122013000, iterations_per_second: 8.195848}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001683, iterations_per_second: 594282.994691}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002021152, iterations_per_second: 494.767422}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.042049972, iterations_per_second: 23.781229}
  xslt:
