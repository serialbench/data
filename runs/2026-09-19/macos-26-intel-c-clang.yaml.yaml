platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009300, iterations_per_second: 107526.881729}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008700, iterations_per_second: 114942.528725}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002043333, iterations_per_second: 489.396411}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008155667, iterations_per_second: 122.614133}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031431000, iterations_per_second: 31.815723}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.101277000, iterations_per_second: 9.873910}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001441, iterations_per_second: 693818.079417}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001446080, iterations_per_second: 691.524833}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.033326650, iterations_per_second: 30.006016}
  xslt:
