platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009100, iterations_per_second: 109890.110030}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009000, iterations_per_second: 111111.111111}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002153333, iterations_per_second: 464.396285}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.010046000, iterations_per_second: 99.542106}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.033936000, iterations_per_second: 29.467232}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.143771000, iterations_per_second: 6.955506}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002041, iterations_per_second: 489955.911019}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002192410, iterations_per_second: 456.119065}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.040508497, iterations_per_second: 24.686179}
  xslt:
