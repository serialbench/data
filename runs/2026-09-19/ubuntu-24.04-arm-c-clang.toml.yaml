platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000545, iterations_per_second: 1835535.977845}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002028, iterations_per_second: 493096.646916}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000062866, iterations_per_second: 15906.849490}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000193819, iterations_per_second: 5159.452892}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001057576, iterations_per_second: 945.558523}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002300310, iterations_per_second: 434.724015}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000749, iterations_per_second: 1335470.086490}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000091267, iterations_per_second: 10956.902849}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001462925, iterations_per_second: 683.562042}
  xpath:
  xslt:
