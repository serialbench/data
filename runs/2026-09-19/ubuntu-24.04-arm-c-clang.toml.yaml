platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000538, iterations_per_second: 1859773.114775}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002043, iterations_per_second: 489404.394097}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000059586, iterations_per_second: 16782.371792}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000196146, iterations_per_second: 5098.243145}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001082912, iterations_per_second: 923.436069}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002358814, iterations_per_second: 423.941862}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000753, iterations_per_second: 1328197.643113}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000094358, iterations_per_second: 10597.935523}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001488350, iterations_per_second: 671.884973}
  xpath:
  xslt:
