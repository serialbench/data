platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000537, iterations_per_second: 1862891.181241}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002033, iterations_per_second: 491908.108947}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000074010, iterations_per_second: 13511.687608}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000192538, iterations_per_second: 5193.779928}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001081994, iterations_per_second: 924.219543}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002328753, iterations_per_second: 429.414369}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000753, iterations_per_second: 1328374.075578}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000093866, iterations_per_second: 10653.446927}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001495156, iterations_per_second: 668.826531}
  xpath:
  xslt:
