platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000542, iterations_per_second: 1843657.819136}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002081, iterations_per_second: 480422.772714}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000068449, iterations_per_second: 14609.346085}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000195517, iterations_per_second: 5114.644762}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001073996, iterations_per_second: 931.102164}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002360397, iterations_per_second: 423.657546}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000755, iterations_per_second: 1324152.542447}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000089790, iterations_per_second: 11137.139017}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001457935, iterations_per_second: 685.901635}
  xpath:
  xslt:
