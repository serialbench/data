platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000560, iterations_per_second: 1785714.282972}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002086, iterations_per_second: 479294.479351}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000058772, iterations_per_second: 17015.001562}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000197697, iterations_per_second: 5058.237170}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001224401, iterations_per_second: 816.725893}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002347271, iterations_per_second: 426.026650}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000750, iterations_per_second: 1334044.829864}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000098762, iterations_per_second: 10125.351857}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001539510, iterations_per_second: 649.557327}
  xpath:
  xslt:
