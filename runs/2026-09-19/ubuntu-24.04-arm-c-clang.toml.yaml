platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000543, iterations_per_second: 1841281.539794}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002122, iterations_per_second: 471186.920382}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000058428, iterations_per_second: 17114.984168}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000194692, iterations_per_second: 5136.317876}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001064415, iterations_per_second: 939.483190}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002364769, iterations_per_second: 422.874285}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000762, iterations_per_second: 1311647.423329}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000090301, iterations_per_second: 11074.033606}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001477702, iterations_per_second: 676.726431}
  xpath:
  xslt:
