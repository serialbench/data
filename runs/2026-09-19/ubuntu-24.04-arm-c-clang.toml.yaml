platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000542, iterations_per_second: 1843657.838458}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002054, iterations_per_second: 486973.455123}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000059644, iterations_per_second: 16766.145805}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000192336, iterations_per_second: 5199.225665}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001112246, iterations_per_second: 899.081678}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002363163, iterations_per_second: 423.161669}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000767, iterations_per_second: 1303611.032874}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000093687, iterations_per_second: 10673.839473}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001490789, iterations_per_second: 670.785738}
  xpath:
  xslt:
