platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000557, iterations_per_second: 1795977.009575}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002328, iterations_per_second: 429553.264724}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000058946, iterations_per_second: 16964.583604}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000193852, iterations_per_second: 5158.565712}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001101831, iterations_per_second: 907.580201}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002347260, iterations_per_second: 426.028646}
  xslt:
