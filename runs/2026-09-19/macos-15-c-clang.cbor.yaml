    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000536667, iterations_per_second: 1863.354037}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001220000, iterations_per_second: 819.672131}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006870000, iterations_per_second: 145.560408}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018625000, iterations_per_second: 53.691275}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000333333, iterations_per_second: 3000.000000}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003667000, iterations_per_second: 272.702482}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 624999.999358}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.293636}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000931667, iterations_per_second: 1073.345259}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001569000, iterations_per_second: 637.348630}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012047000, iterations_per_second: 83.008218}
