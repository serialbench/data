platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001000, iterations_per_second: 999999.996840}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.911386}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000544333, iterations_per_second: 1837.109614}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001280333, iterations_per_second: 781.046602}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006586000, iterations_per_second: 151.837230}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.017719000, iterations_per_second: 56.436593}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.278590}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000328333, iterations_per_second: 3045.685279}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004052000, iterations_per_second: 246.791708}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.665823}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.665823}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001040333, iterations_per_second: 961.230375}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001548000, iterations_per_second: 645.994832}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014120000, iterations_per_second: 70.821530}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023856000, iterations_per_second: 41.918176}
  xpath:
  xslt:
