platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 769230.767809}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.331490}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000809333, iterations_per_second: 1235.584843}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001873000, iterations_per_second: 533.902830}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007036000, iterations_per_second: 142.126208}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.017916000, iterations_per_second: 55.816030}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000335000, iterations_per_second: 2985.074627}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004308000, iterations_per_second: 232.126277}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.295603}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.001578}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001047667, iterations_per_second: 954.502068}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001984333, iterations_per_second: 503.947589}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.016927000, iterations_per_second: 59.077214}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023949000, iterations_per_second: 41.755397}
