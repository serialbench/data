platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.645834}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.237407}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000720333, iterations_per_second: 1388.246182}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001375000, iterations_per_second: 727.272727}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007033000, iterations_per_second: 142.186833}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.019096000, iterations_per_second: 52.366988}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.215430}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000410667, iterations_per_second: 2435.064935}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004625000, iterations_per_second: 216.216216}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000005000, iterations_per_second: 200000.000505}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000005100, iterations_per_second: 196078.431431}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001012333, iterations_per_second: 987.816925}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001704333, iterations_per_second: 586.739683}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012014000, iterations_per_second: 83.236224}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023419000, iterations_per_second: 42.700371}
