platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.857320}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312499.999679}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000573667, iterations_per_second: 1743.172574}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003453000, iterations_per_second: 289.603244}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.016396000, iterations_per_second: 60.990485}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034225000, iterations_per_second: 29.218408}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000327333, iterations_per_second: 3054.989817}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003966000, iterations_per_second: 252.143217}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238374}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001148667, iterations_per_second: 870.574579}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003535667, iterations_per_second: 282.832092}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.018739000, iterations_per_second: 53.364641}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033141000, iterations_per_second: 30.174105}
  xpath:
  xslt:
