    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000677000, iterations_per_second: 1477.104874}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001752667, iterations_per_second: 570.559148}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007733000, iterations_per_second: 129.315919}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.026883000, iterations_per_second: 37.198229}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.113916}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000338333, iterations_per_second: 2955.665025}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.006282000, iterations_per_second: 159.184973}
  generation:
