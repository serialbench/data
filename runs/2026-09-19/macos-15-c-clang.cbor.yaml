    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000663000, iterations_per_second: 1508.295626}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001433667, iterations_per_second: 697.512206}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007605000, iterations_per_second: 131.492439}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.020549000, iterations_per_second: 48.664169}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.215430}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000371000, iterations_per_second: 2695.417790}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004474000, iterations_per_second: 223.513634}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000004100, iterations_per_second: 243902.438964}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 249999.999210}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001344667, iterations_per_second: 743.678731}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001840000, iterations_per_second: 543.478261}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.017419000, iterations_per_second: 57.408577}
