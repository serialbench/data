platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 769230.771173}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.901991}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000580333, iterations_per_second: 1723.147616}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001517333, iterations_per_second: 659.050967}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006973000, iterations_per_second: 143.410297}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018972000, iterations_per_second: 52.709256}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000383000, iterations_per_second: 2610.966057}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003964000, iterations_per_second: 252.270434}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.556958}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.553449}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001238000, iterations_per_second: 807.754443}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001929333, iterations_per_second: 518.313753}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013337000, iterations_per_second: 74.979381}
