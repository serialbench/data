platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000007500, iterations_per_second: 133333.333367}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.665823}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001083333, iterations_per_second: 923.076923}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001338667, iterations_per_second: 747.011952}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.008690000, iterations_per_second: 115.074799}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.020025000, iterations_per_second: 49.937578}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.278590}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000329333, iterations_per_second: 3036.437247}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003966000, iterations_per_second: 252.143217}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 499999.999841}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.001578}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001420667, iterations_per_second: 703.894885}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001903667, iterations_per_second: 525.302049}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015320000, iterations_per_second: 65.274151}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.026994000, iterations_per_second: 37.045269}
  xpath:
  xslt:
