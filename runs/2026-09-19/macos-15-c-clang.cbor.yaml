platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.668350}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.327542}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000562000, iterations_per_second: 1779.359431}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002152667, iterations_per_second: 464.540105}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010106000, iterations_per_second: 98.951118}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.024276000, iterations_per_second: 41.192948}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000324333, iterations_per_second: 3083.247687}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004192000, iterations_per_second: 238.549618}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.001578}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.668350}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001474000, iterations_per_second: 678.426052}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001717667, iterations_per_second: 582.185135}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.017016000, iterations_per_second: 58.768218}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.026047000, iterations_per_second: 38.392137}
  xpath:
  xslt:
