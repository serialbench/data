    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 249999.999921}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001149000, iterations_per_second: 870.322019}
