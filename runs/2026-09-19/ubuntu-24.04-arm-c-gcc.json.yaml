    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001192541, iterations_per_second: 838.545827}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003451826, iterations_per_second: 289.701768}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.008127327, iterations_per_second: 123.041684}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.042711662, iterations_per_second: 23.412809}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002625, iterations_per_second: 380966.895198}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002496052, iterations_per_second: 400.632626}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.030024309, iterations_per_second: 33.306345}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002030, iterations_per_second: 492707.922685}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002406762, iterations_per_second: 415.496064}
