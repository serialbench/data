platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: json-c, format: json, version: '0.17', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000910, iterations_per_second: 1099263.496523}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002391, iterations_per_second: 418182.578395}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001194307, iterations_per_second: 837.305417}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003392222, iterations_per_second: 294.791998}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.008288023, iterations_per_second: 120.656036}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.045615052, iterations_per_second: 21.922588}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002591, iterations_per_second: 385906.687737}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002454758, iterations_per_second: 407.372132}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.034898126, iterations_per_second: 28.654834}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002007, iterations_per_second: 498206.455745}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002417957, iterations_per_second: 413.572227}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.031635178, iterations_per_second: 31.610380}
