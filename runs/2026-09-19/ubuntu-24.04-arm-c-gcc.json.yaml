platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: json-c, format: json, version: '0.17', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002697, iterations_per_second: 370727.366986}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003416616, iterations_per_second: 292.687239}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.044356787, iterations_per_second: 22.544464}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002785, iterations_per_second: 359118.006245}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002443815, iterations_per_second: 409.196221}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.036095829, iterations_per_second: 27.704032}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002073, iterations_per_second: 482299.605103}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002465910, iterations_per_second: 405.529804}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.031419746, iterations_per_second: 31.827119}
  xslt:
