platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: json-c, format: json, version: '0.17', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000920, iterations_per_second: 1086956.520790}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002397, iterations_per_second: 417118.545070}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001184489, iterations_per_second: 844.245915}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003418317, iterations_per_second: 292.541622}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.008257190, iterations_per_second: 121.106575}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.044573840, iterations_per_second: 22.434684}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002729, iterations_per_second: 366488.308953}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002485933, iterations_per_second: 402.263456}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.042521029, iterations_per_second: 23.517775}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002008, iterations_per_second: 498057.575314}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002492695, iterations_per_second: 401.172225}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.031518393, iterations_per_second: 31.727506}
