    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003415461, iterations_per_second: 292.786216}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.008179626, iterations_per_second: 122.254978}
