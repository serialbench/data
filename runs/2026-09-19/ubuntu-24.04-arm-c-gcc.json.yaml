platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
    - {name: json-c, format: json, version: '0.17', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000855, iterations_per_second: 1169180.398615}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002394, iterations_per_second: 417763.296651}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001134665, iterations_per_second: 881.317652}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003367236, iterations_per_second: 296.979510}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.007848224, iterations_per_second: 127.417362}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.044797793, iterations_per_second: 22.322528}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002751, iterations_per_second: 363477.757004}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002432386, iterations_per_second: 411.119015}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.034962043, iterations_per_second: 28.602448}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002091, iterations_per_second: 478194.341508}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002455613, iterations_per_second: 407.230348}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.032571709, iterations_per_second: 30.701490}
