platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
    - {name: json-c, format: json, version: '0.17', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000926, iterations_per_second: 1080380.294043}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002441, iterations_per_second: 409701.737109}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001209463, iterations_per_second: 826.813222}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003399311, iterations_per_second: 294.177261}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.008333526, iterations_per_second: 119.997226}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.044672074, iterations_per_second: 22.385350}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002605, iterations_per_second: 383891.896269}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002443633, iterations_per_second: 409.226698}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.032902019, iterations_per_second: 30.393272}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002074, iterations_per_second: 482229.830741}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002449783, iterations_per_second: 408.199476}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.031826832, iterations_per_second: 31.420029}
