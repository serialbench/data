    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002429, iterations_per_second: 411759.861913}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001184449, iterations_per_second: 844.274426}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003409278, iterations_per_second: 293.317207}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.008123236, iterations_per_second: 123.103650}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.047259947, iterations_per_second: 21.159567}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002619, iterations_per_second: 381810.544521}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002446648, iterations_per_second: 408.722464}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.035410470, iterations_per_second: 28.240235}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000001995, iterations_per_second: 501228.011152}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002428727, iterations_per_second: 411.738387}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.031669302, iterations_per_second: 31.576320}
