    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384746}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000433667, iterations_per_second: 2305.918524}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001555000, iterations_per_second: 643.086817}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005891000, iterations_per_second: 169.750467}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.017663000, iterations_per_second: 56.615524}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000309667, iterations_per_second: 3229.278794}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003866000, iterations_per_second: 258.665287}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001900, iterations_per_second: 526315.789228}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312499.999679}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002784000, iterations_per_second: 359.195402}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002335333, iterations_per_second: 428.204396}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013447000, iterations_per_second: 74.366030}
