    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000658667, iterations_per_second: 1518.218623}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001489000, iterations_per_second: 671.591672}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005960000, iterations_per_second: 167.785235}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018855000, iterations_per_second: 53.036330}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000342333, iterations_per_second: 2921.129503}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004780000, iterations_per_second: 209.205021}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000004800, iterations_per_second: 208333.333243}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000006600, iterations_per_second: 151515.151506}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000995333, iterations_per_second: 1004.688547}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002003000, iterations_per_second: 499.251123}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.017473000, iterations_per_second: 57.231157}
