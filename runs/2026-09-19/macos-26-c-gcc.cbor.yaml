    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001061000, iterations_per_second: 942.507069}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002680000, iterations_per_second: 373.134328}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.004977000, iterations_per_second: 200.924252}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.015697000, iterations_per_second: 63.706441}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000297667, iterations_per_second: 3359.462486}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003646000, iterations_per_second: 274.273176}
  generation:
