    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000008000, iterations_per_second: 124999.999960}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001553667, iterations_per_second: 643.638704}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002264333, iterations_per_second: 441.631091}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010730000, iterations_per_second: 93.196645}
