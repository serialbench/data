    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666456}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001463000, iterations_per_second: 683.526999}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002196667, iterations_per_second: 455.235205}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010839000, iterations_per_second: 92.259434}
