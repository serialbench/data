platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312499.998569}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000006400, iterations_per_second: 156249.999839}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000974000, iterations_per_second: 1026.694045}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002418000, iterations_per_second: 413.564930}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005130000, iterations_per_second: 194.931774}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.015855000, iterations_per_second: 63.071586}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.468068}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000357667, iterations_per_second: 2795.899347}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004084000, iterations_per_second: 244.857982}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 250000.000631}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666456}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001356333, iterations_per_second: 737.281887}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002270333, iterations_per_second: 440.463955}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011515000, iterations_per_second: 86.843248}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.024024000, iterations_per_second: 41.625042}
