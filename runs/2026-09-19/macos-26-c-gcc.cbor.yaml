    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001137000, iterations_per_second: 879.507476}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002763667, iterations_per_second: 361.838138}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.004955000, iterations_per_second: 201.816347}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.016579000, iterations_per_second: 60.317269}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000301000, iterations_per_second: 3322.259136}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003634000, iterations_per_second: 275.178866}
  generation:
