platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000004800, iterations_per_second: 208333.333366}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000010900, iterations_per_second: 91743.119306}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000962667, iterations_per_second: 1038.781163}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002646667, iterations_per_second: 377.833753}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.004945000, iterations_per_second: 202.224469}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.015854000, iterations_per_second: 63.075565}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000291333, iterations_per_second: 3432.494279}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003643000, iterations_per_second: 274.499039}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000005000, iterations_per_second: 200000.000050}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000009400, iterations_per_second: 106382.978606}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001454333, iterations_per_second: 687.600275}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002180333, iterations_per_second: 458.645467}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010719000, iterations_per_second: 93.292285}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.019544000, iterations_per_second: 51.166598}
  xpath:
  xslt:
