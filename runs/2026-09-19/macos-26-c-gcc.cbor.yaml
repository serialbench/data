platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.857320}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000009000, iterations_per_second: 111111.111111}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000586000, iterations_per_second: 1706.484642}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001559667, iterations_per_second: 641.162642}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.016793000, iterations_per_second: 59.548621}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.019266000, iterations_per_second: 51.904910}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000323333, iterations_per_second: 3092.783505}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004682000, iterations_per_second: 213.583938}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 399999.999191}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608719}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001106000, iterations_per_second: 904.159132}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001775667, iterations_per_second: 563.168763}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011570000, iterations_per_second: 86.430424}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.022769000, iterations_per_second: 43.919364}
  xpath:
  xslt:
