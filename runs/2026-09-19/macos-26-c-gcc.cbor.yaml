    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001101333, iterations_per_second: 907.990315}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001458667, iterations_per_second: 685.557587}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005553000, iterations_per_second: 180.082838}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.017805000, iterations_per_second: 56.163999}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000342333, iterations_per_second: 2921.129503}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004224000, iterations_per_second: 236.742424}
  generation:
