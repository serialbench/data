    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 400000.001010}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000418000, iterations_per_second: 2392.344498}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001449667, iterations_per_second: 689.813750}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005086000, iterations_per_second: 196.618168}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.020136000, iterations_per_second: 49.662296}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000347333, iterations_per_second: 2879.078695}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004344000, iterations_per_second: 230.202578}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.553449}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 500000.001262}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000928000, iterations_per_second: 1077.586207}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001656667, iterations_per_second: 603.621730}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013760000, iterations_per_second: 72.674419}
