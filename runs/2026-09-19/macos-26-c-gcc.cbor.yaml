    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001852333, iterations_per_second: 539.859636}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007894000, iterations_per_second: 126.678490}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.024972000, iterations_per_second: 40.044850}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
