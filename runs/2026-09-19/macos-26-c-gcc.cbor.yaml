    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000005800, iterations_per_second: 172413.792863}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000964333, iterations_per_second: 1036.985828}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001726667, iterations_per_second: 579.150579}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012166000, iterations_per_second: 82.196285}
