platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000004600, iterations_per_second: 217391.304897}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000010500, iterations_per_second: 95238.095169}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000995000, iterations_per_second: 1005.025126}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002695333, iterations_per_second: 371.011625}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006014000, iterations_per_second: 166.278683}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.015672000, iterations_per_second: 63.808065}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.468068}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000289667, iterations_per_second: 3452.243959}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003653000, iterations_per_second: 273.747605}
