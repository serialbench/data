    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000484333, iterations_per_second: 2064.693737}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001561333, iterations_per_second: 640.478224}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.008060000, iterations_per_second: 124.069479}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.019520000, iterations_per_second: 51.229508}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000315333, iterations_per_second: 3171.247357}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003955000, iterations_per_second: 252.844501}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.293636}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454545.454519}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001509000, iterations_per_second: 662.690524}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001735000, iterations_per_second: 576.368876}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012502000, iterations_per_second: 79.987202}
