    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002487000, iterations_per_second: 402.090873}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007022000, iterations_per_second: 142.409570}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.026016000, iterations_per_second: 38.437884}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
