  kind: local
  os: linux
  arch: x86_64
  runtime: python
  runtime_version: '3.12'
metadata:
  benchmark_config_path: serialbench-py/py-full-toml.yml
  environment_config_path: python-3.12
  tags:
  - local
  - linux
  - x86_64
  - python-3.12
benchmark_config:
  name: py-full-toml
  formats:
  - toml
  operations:
  - parsing
  - generation
  - xpath
  - xquery
  - xslt
  - xslt30
  - validation
  - streaming
  - memory
benchmark_result:
