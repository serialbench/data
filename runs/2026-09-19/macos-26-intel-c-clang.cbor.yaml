platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.645834}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000004300, iterations_per_second: 232558.139507}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000909000, iterations_per_second: 1100.110011}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004022333, iterations_per_second: 248.611917}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013440000, iterations_per_second: 74.404762}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.062621000, iterations_per_second: 15.969084}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000500, iterations_per_second: 2000000.050524}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000689000, iterations_per_second: 1451.378810}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.007259000, iterations_per_second: 137.760022}
