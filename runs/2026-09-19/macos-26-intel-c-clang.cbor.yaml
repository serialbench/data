platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 500000.001262}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003100, iterations_per_second: 322580.644793}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000762667, iterations_per_second: 1311.188811}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003330333, iterations_per_second: 300.270243}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011260000, iterations_per_second: 88.809947}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.045611000, iterations_per_second: 21.924536}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000600, iterations_per_second: 1666666.734034}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000572667, iterations_per_second: 1746.216531}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.007626000, iterations_per_second: 131.130344}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.858045}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001497333, iterations_per_second: 667.853963}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004103667, iterations_per_second: 243.684510}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022628000, iterations_per_second: 44.193035}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.062003000, iterations_per_second: 16.128252}
  xpath:
  xslt:
