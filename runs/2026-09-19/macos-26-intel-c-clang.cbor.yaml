platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 500000.001262}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000006400, iterations_per_second: 156250.000394}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001108000, iterations_per_second: 902.527076}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004291000, iterations_per_second: 233.045910}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012153000, iterations_per_second: 82.284210}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.047903000, iterations_per_second: 20.875519}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000500, iterations_per_second: 2000000.050524}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000482000, iterations_per_second: 2074.688797}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005901000, iterations_per_second: 169.462803}
  xslt:
