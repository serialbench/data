platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384746}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000006200, iterations_per_second: 161290.322618}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000633667, iterations_per_second: 1578.116781}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002364333, iterations_per_second: 422.952206}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.008508000, iterations_per_second: 117.536436}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.043154000, iterations_per_second: 23.172823}
  xslt:
