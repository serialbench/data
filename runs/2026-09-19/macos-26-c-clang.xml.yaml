platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000003300, iterations_per_second: 303030.304839}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000007400, iterations_per_second: 135135.135061}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000669667, iterations_per_second: 1493.280239}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002240333, iterations_per_second: 446.362148}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.008795000, iterations_per_second: 113.700966}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.032435000, iterations_per_second: 30.830893}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000421, iterations_per_second: 2376425.819396}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000393542, iterations_per_second: 2541.026998}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.003520250, iterations_per_second: 284.070734}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000085500, iterations_per_second: 11695.906433}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000166400, iterations_per_second: 6009.615385}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002865667, iterations_per_second: 348.958939}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.005655000, iterations_per_second: 176.834660}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.083945000, iterations_per_second: 11.912562}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.070283000, iterations_per_second: 14.228192}
