platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000002100, iterations_per_second: 476190.474815}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000006300, iterations_per_second: 158730.158844}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000552000, iterations_per_second: 1811.594203}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.001967667, iterations_per_second: 508.216161}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.007649000, iterations_per_second: 130.736044}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.042385000, iterations_per_second: 23.593252}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000346, iterations_per_second: 2891844.965809}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000240125, iterations_per_second: 4164.497657}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.003557375, iterations_per_second: 281.106153}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000046900, iterations_per_second: 21321.961623}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000051200, iterations_per_second: 19531.249997}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002487333, iterations_per_second: 402.036987}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004293667, iterations_per_second: 232.901172}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.032687000, iterations_per_second: 30.593202}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.059002000, iterations_per_second: 16.948578}
