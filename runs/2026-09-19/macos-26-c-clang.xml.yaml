platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000002100, iterations_per_second: 476190.476104}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000006900, iterations_per_second: 144927.536240}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000603667, iterations_per_second: 1656.543346}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002158667, iterations_per_second: 463.248919}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.008066000, iterations_per_second: 123.977188}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.028184000, iterations_per_second: 35.481124}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000350, iterations_per_second: 2857142.817954}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000231986, iterations_per_second: 4310.604950}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.003224541, iterations_per_second: 310.121658}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000040800, iterations_per_second: 24509.803922}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000046900, iterations_per_second: 21321.961620}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002311667, iterations_per_second: 432.588320}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.003606667, iterations_per_second: 277.264325}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.028593000, iterations_per_second: 34.973595}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.057155000, iterations_per_second: 17.496282}
