platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.607644}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000006300, iterations_per_second: 158730.158844}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000601667, iterations_per_second: 1662.049861}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002136000, iterations_per_second: 468.164794}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.007694000, iterations_per_second: 129.971406}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.027891000, iterations_per_second: 35.853860}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000363, iterations_per_second: 2758620.620919}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000242917, iterations_per_second: 4116.638079}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.003038708, iterations_per_second: 329.087230}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000044200, iterations_per_second: 22624.434388}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000049900, iterations_per_second: 20040.080161}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002430333, iterations_per_second: 411.466191}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004120333, iterations_per_second: 242.698811}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.032897000, iterations_per_second: 30.397909}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.056883000, iterations_per_second: 17.579945}
