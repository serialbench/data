platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002604, iterations_per_second: 384039.325552}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006911, iterations_per_second: 144698.953867}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008873, iterations_per_second: 112705.264475}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002232618, iterations_per_second: 447.904657}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005320529, iterations_per_second: 187.951247}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001400558, iterations_per_second: 714.000964}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023553666, iterations_per_second: 42.456236}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.054604933, iterations_per_second: 18.313364}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014583293, iterations_per_second: 68.571618}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003327, iterations_per_second: 300543.984487}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007310, iterations_per_second: 136804.519999}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002433648, iterations_per_second: 410.905768}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001842196, iterations_per_second: 542.830306}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.026011642, iterations_per_second: 38.444324}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019458951, iterations_per_second: 51.390232}
  xpath:
  xslt:
