platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000007668, iterations_per_second: 130407.000291}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005815, iterations_per_second: 171972.002840}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.006877729, iterations_per_second: 145.396831}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001385266, iterations_per_second: 721.883017}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.091710312, iterations_per_second: 10.903899}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014049866, iterations_per_second: 71.175056}
  xslt:
