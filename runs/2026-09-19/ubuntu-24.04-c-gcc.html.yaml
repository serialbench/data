platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002411, iterations_per_second: 414834.480833}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000010284, iterations_per_second: 97235.592136}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005977, iterations_per_second: 167302.415807}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002299747, iterations_per_second: 434.830377}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.006765418, iterations_per_second: 147.810527}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001406688, iterations_per_second: 710.889861}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.047606606, iterations_per_second: 21.005488}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.093250967, iterations_per_second: 10.723749}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014407969, iterations_per_second: 69.406035}
  xslt:
