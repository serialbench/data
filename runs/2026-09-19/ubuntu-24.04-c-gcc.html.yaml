platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001907, iterations_per_second: 524438.850422}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004947, iterations_per_second: 202126.369374}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006565, iterations_per_second: 152329.885568}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001714416, iterations_per_second: 583.289003}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003911662, iterations_per_second: 255.645788}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000937146, iterations_per_second: 1067.069592}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018204726, iterations_per_second: 54.930791}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.040150195, iterations_per_second: 24.906479}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010039499, iterations_per_second: 99.606564}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002623, iterations_per_second: 381257.386663}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005146, iterations_per_second: 194340.796042}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001870820, iterations_per_second: 534.524872}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001274185, iterations_per_second: 784.815597}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019824042, iterations_per_second: 50.443800}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013612504, iterations_per_second: 73.461870}
  xpath:
  xslt:
