platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002050, iterations_per_second: 487804.877928}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004891, iterations_per_second: 204448.806032}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004520, iterations_per_second: 221238.938041}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001739533, iterations_per_second: 574.867043}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004123569, iterations_per_second: 242.508371}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001099069, iterations_per_second: 909.860982}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018342246, iterations_per_second: 54.518950}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.042334494, iterations_per_second: 23.621400}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011724663, iterations_per_second: 85.290298}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002578, iterations_per_second: 387897.595014}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005671, iterations_per_second: 176341.962326}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001866531, iterations_per_second: 535.753223}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001482752, iterations_per_second: 674.421464}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020054146, iterations_per_second: 49.865000}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015647083, iterations_per_second: 63.909676}
  xpath:
  xslt:
