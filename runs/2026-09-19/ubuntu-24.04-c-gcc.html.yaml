platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001919, iterations_per_second: 521159.058239}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005494, iterations_per_second: 182010.119791}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004003, iterations_per_second: 249812.640469}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001711655, iterations_per_second: 584.229769}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005394255, iterations_per_second: 185.382400}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000979320, iterations_per_second: 1021.116693}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019321816, iterations_per_second: 51.754970}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.055373914, iterations_per_second: 18.059045}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010216141, iterations_per_second: 97.884319}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002496, iterations_per_second: 400689.185500}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005237, iterations_per_second: 190956.309253}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001884132, iterations_per_second: 530.748283}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001305229, iterations_per_second: 766.149082}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020491730, iterations_per_second: 48.800175}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014297535, iterations_per_second: 69.942126}
  xpath:
  xslt:
