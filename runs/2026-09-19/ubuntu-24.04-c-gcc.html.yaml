platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002602, iterations_per_second: 384334.524720}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000008691, iterations_per_second: 115058.910161}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005667, iterations_per_second: 176472.664365}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002200986, iterations_per_second: 454.341758}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005302437, iterations_per_second: 188.592528}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001419943, iterations_per_second: 704.253787}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023190733, iterations_per_second: 43.120672}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.053906091, iterations_per_second: 18.550779}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014614443, iterations_per_second: 68.425461}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003279, iterations_per_second: 304961.727215}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000012177, iterations_per_second: 82123.382170}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002423276, iterations_per_second: 412.664565}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001863218, iterations_per_second: 536.705754}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025598927, iterations_per_second: 39.064137}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019499741, iterations_per_second: 51.282732}
  xpath:
  xslt:
