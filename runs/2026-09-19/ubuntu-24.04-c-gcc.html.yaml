platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002461, iterations_per_second: 406388.426053}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006409, iterations_per_second: 156042.755668}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005178, iterations_per_second: 193135.948356}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002234743, iterations_per_second: 447.478681}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005066045, iterations_per_second: 197.392641}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001269043, iterations_per_second: 787.995570}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023614315, iterations_per_second: 42.347195}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.051971561, iterations_per_second: 19.241292}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012993005, iterations_per_second: 76.964490}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003130, iterations_per_second: 319529.652320}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006675, iterations_per_second: 149817.222936}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002416776, iterations_per_second: 413.774441}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001702256, iterations_per_second: 587.455706}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025537548, iterations_per_second: 39.158027}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017773882, iterations_per_second: 56.262329}
  xpath:
  xslt:
