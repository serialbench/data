platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002635, iterations_per_second: 379521.044511}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006952, iterations_per_second: 143845.567354}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005712, iterations_per_second: 175082.288695}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002256382, iterations_per_second: 443.187303}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005338194, iterations_per_second: 187.329284}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001413432, iterations_per_second: 707.497945}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023750347, iterations_per_second: 42.104648}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.054619862, iterations_per_second: 18.308358}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014624596, iterations_per_second: 68.377957}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003383, iterations_per_second: 295569.414696}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007421, iterations_per_second: 134756.360499}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002456181, iterations_per_second: 407.136119}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001873624, iterations_per_second: 533.724921}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025780833, iterations_per_second: 38.788506}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019421036, iterations_per_second: 51.490559}
  xpath:
  xslt:
