platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002414, iterations_per_second: 414336.026207}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007037, iterations_per_second: 142101.972354}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005777, iterations_per_second: 173106.217961}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002310562, iterations_per_second: 432.795076}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.006844935, iterations_per_second: 146.093418}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001392212, iterations_per_second: 718.281239}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.047125965, iterations_per_second: 21.219725}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.092082075, iterations_per_second: 10.859877}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014130805, iterations_per_second: 70.767377}
  xslt:
