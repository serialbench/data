platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000010395, iterations_per_second: 96204.723620}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005810, iterations_per_second: 172117.039449}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.007022158, iterations_per_second: 142.406366}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001403513, iterations_per_second: 712.497854}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.092982528, iterations_per_second: 10.754709}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014571362, iterations_per_second: 68.627765}
  xslt:
