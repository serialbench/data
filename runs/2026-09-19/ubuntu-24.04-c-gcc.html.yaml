platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001789, iterations_per_second: 559065.242517}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005090, iterations_per_second: 196475.234100}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004069, iterations_per_second: 245754.589581}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001855302, iterations_per_second: 538.995711}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005182562, iterations_per_second: 192.954759}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000941470, iterations_per_second: 1062.168360}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.050727311, iterations_per_second: 19.713247}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.085354582, iterations_per_second: 11.715833}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009655668, iterations_per_second: 103.566113}
  xslt:
