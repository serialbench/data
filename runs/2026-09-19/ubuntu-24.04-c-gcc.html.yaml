platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002592, iterations_per_second: 385832.240057}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000009119, iterations_per_second: 109661.147048}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005740, iterations_per_second: 174228.169160}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002243482, iterations_per_second: 445.735691}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005358839, iterations_per_second: 186.607573}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001403669, iterations_per_second: 712.418669}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023476971, iterations_per_second: 42.594933}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.054676364, iterations_per_second: 18.289439}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014831081, iterations_per_second: 67.425968}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003348, iterations_per_second: 298659.020907}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007431, iterations_per_second: 134575.012121}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002456625, iterations_per_second: 407.062480}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001863071, iterations_per_second: 536.748293}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025547715, iterations_per_second: 39.142444}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019596650, iterations_per_second: 51.029130}
  xpath:
  xslt:
