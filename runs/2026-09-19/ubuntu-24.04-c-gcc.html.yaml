platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002572, iterations_per_second: 388817.605555}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006869, iterations_per_second: 145583.717912}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005716, iterations_per_second: 174956.698216}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002230362, iterations_per_second: 448.357778}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005256033, iterations_per_second: 190.257569}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001412878, iterations_per_second: 707.775361}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023146773, iterations_per_second: 43.202567}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.053714099, iterations_per_second: 18.617086}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014601559, iterations_per_second: 68.485838}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003267, iterations_per_second: 306081.846289}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010588, iterations_per_second: 94448.327308}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002408847, iterations_per_second: 415.136428}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001873716, iterations_per_second: 533.698905}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025395533, iterations_per_second: 39.377004}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019536338, iterations_per_second: 51.186666}
  xpath:
  xslt:
