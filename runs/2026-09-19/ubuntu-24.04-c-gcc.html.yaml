platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002296, iterations_per_second: 435559.039913}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005483, iterations_per_second: 182385.234116}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005219, iterations_per_second: 191596.574298}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002150374, iterations_per_second: 465.035312}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004545265, iterations_per_second: 220.009174}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001210249, iterations_per_second: 826.276018}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020464702, iterations_per_second: 48.864626}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.045616181, iterations_per_second: 21.922046}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011926587, iterations_per_second: 83.846284}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003988, iterations_per_second: 250739.682178}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006465, iterations_per_second: 154681.433599}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002109607, iterations_per_second: 474.021939}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001653892, iterations_per_second: 604.634524}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022083369, iterations_per_second: 45.282946}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017483146, iterations_per_second: 57.197944}
  xpath:
  xslt:
