platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002605, iterations_per_second: 383906.633978}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006942, iterations_per_second: 144052.780941}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005811, iterations_per_second: 172090.381844}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002234294, iterations_per_second: 447.568739}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005327657, iterations_per_second: 187.699783}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001431650, iterations_per_second: 698.494906}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023296753, iterations_per_second: 42.924437}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.054429886, iterations_per_second: 18.372260}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014927558, iterations_per_second: 66.990194}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003341, iterations_per_second: 299293.667005}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010653, iterations_per_second: 93870.271276}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002430294, iterations_per_second: 411.472907}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001932923, iterations_per_second: 517.351093}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025857821, iterations_per_second: 38.673019}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.020243705, iterations_per_second: 49.398072}
  xpath:
  xslt:
