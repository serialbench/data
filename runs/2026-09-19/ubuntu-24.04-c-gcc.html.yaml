platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002567, iterations_per_second: 389590.151064}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006832, iterations_per_second: 146374.308404}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005769, iterations_per_second: 173349.281441}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002200777, iterations_per_second: 454.384974}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005282255, iterations_per_second: 189.313087}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001407246, iterations_per_second: 710.607643}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023321576, iterations_per_second: 42.878749}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.054060764, iterations_per_second: 18.497704}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014797196, iterations_per_second: 67.580371}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003305, iterations_per_second: 302553.552052}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007326, iterations_per_second: 136507.589808}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002400734, iterations_per_second: 416.539275}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001854097, iterations_per_second: 539.346205}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025439929, iterations_per_second: 39.308286}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019679078, iterations_per_second: 50.815389}
  xpath:
  xslt:
