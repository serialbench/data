platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001211, iterations_per_second: 825900.229801}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003294, iterations_per_second: 303591.487356}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003936, iterations_per_second: 254065.040543}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001107552, iterations_per_second: 902.892144}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002684229, iterations_per_second: 372.546502}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000748934, iterations_per_second: 1335.231736}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.012272906, iterations_per_second: 81.480295}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.026907977, iterations_per_second: 37.163701}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.007914247, iterations_per_second: 126.354409}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001747, iterations_per_second: 572508.157566}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003995, iterations_per_second: 250312.891105}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001245437, iterations_per_second: 802.931234}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000969891, iterations_per_second: 1031.044049}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.013653229, iterations_per_second: 73.242747}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010633571, iterations_per_second: 94.041785}
  xpath:
  xslt:
