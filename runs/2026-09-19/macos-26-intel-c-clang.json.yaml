platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: json-c, format: json, version: '0.19', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.426032}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.007669000, iterations_per_second: 130.395097}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.095965000, iterations_per_second: 10.420466}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000006600, iterations_per_second: 151515.151376}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.006678667, iterations_per_second: 149.730485}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.081941000, iterations_per_second: 12.203903}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000004473, iterations_per_second: 223543.613504}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.004659740, iterations_per_second: 214.604233}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.062568186, iterations_per_second: 15.982563}
