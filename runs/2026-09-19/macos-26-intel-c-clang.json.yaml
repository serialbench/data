platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: json-c, format: json, version: '0.19', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.425727}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.007311667, iterations_per_second: 136.767723}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.099478000, iterations_per_second: 10.052474}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000006500, iterations_per_second: 153846.153427}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.006620333, iterations_per_second: 151.049796}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.081412000, iterations_per_second: 12.283201}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000004561, iterations_per_second: 219226.132415}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.004844683, iterations_per_second: 206.411854}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.062234829, iterations_per_second: 16.068173}
