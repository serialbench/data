    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.011616000, iterations_per_second: 86.088154}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.111756000, iterations_per_second: 8.948065}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000010100, iterations_per_second: 99009.901017}
