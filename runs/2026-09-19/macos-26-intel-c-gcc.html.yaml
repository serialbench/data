    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009900, iterations_per_second: 101010.101149}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.004974000, iterations_per_second: 201.045436}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003271667, iterations_per_second: 305.654610}
