platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000015300, iterations_per_second: 65359.477144}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000025200, iterations_per_second: 39682.539640}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000019200, iterations_per_second: 52083.333341}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.009207667, iterations_per_second: 108.605148}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.022298667, iterations_per_second: 44.845731}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.004408667, iterations_per_second: 226.825949}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.175447000, iterations_per_second: 5.699727}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.311253000, iterations_per_second: 3.212820}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.033407000, iterations_per_second: 29.933846}
  xslt:
