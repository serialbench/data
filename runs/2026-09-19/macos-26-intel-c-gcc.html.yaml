    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007700, iterations_per_second: 129870.130390}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.004485667, iterations_per_second: 222.932303}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.008948667, iterations_per_second: 111.748491}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002300667, iterations_per_second: 434.656621}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.051608000, iterations_per_second: 19.376841}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.096020000, iterations_per_second: 10.414497}
