platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000011100, iterations_per_second: 90090.090087}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000015300, iterations_per_second: 65359.477119}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009700, iterations_per_second: 103092.783524}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.007174333, iterations_per_second: 139.385773}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.018929333, iterations_per_second: 52.828062}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003242333, iterations_per_second: 308.419862}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.104518000, iterations_per_second: 9.567730}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.247261000, iterations_per_second: 4.044309}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.032535000, iterations_per_second: 30.736130}
  xslt:
