platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002102, iterations_per_second: 475850.579987}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004465, iterations_per_second: 223944.104586}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005085, iterations_per_second: 196672.304521}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001906318, iterations_per_second: 524.571451}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003636880, iterations_per_second: 274.960956}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001354905, iterations_per_second: 738.059308}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019917936, iterations_per_second: 50.206005}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037418951, iterations_per_second: 26.724426}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013557768, iterations_per_second: 73.758453}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002578, iterations_per_second: 387972.841298}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006200, iterations_per_second: 161295.525423}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002059307, iterations_per_second: 485.600332}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001783472, iterations_per_second: 560.704065}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021573984, iterations_per_second: 46.352125}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018128253, iterations_per_second: 55.162513}
  xpath:
  xslt:
