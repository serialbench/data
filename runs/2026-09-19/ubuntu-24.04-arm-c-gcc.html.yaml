platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002119, iterations_per_second: 471898.447413}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004441, iterations_per_second: 225154.230641}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005067, iterations_per_second: 197359.332177}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001950380, iterations_per_second: 512.720598}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003634811, iterations_per_second: 275.117443}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001357128, iterations_per_second: 736.849991}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020343600, iterations_per_second: 49.155508}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037599825, iterations_per_second: 26.595868}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013597531, iterations_per_second: 73.542763}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002570, iterations_per_second: 389059.642757}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006300, iterations_per_second: 158717.562131}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002055665, iterations_per_second: 486.460665}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001774973, iterations_per_second: 563.388852}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021831537, iterations_per_second: 45.805295}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018232398, iterations_per_second: 54.847421}
  xpath:
  xslt:
