platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002103, iterations_per_second: 475465.947496}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004825, iterations_per_second: 207258.181628}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005097, iterations_per_second: 196197.689338}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001894939, iterations_per_second: 527.721473}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004505360, iterations_per_second: 221.957846}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001355562, iterations_per_second: 737.701229}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020327674, iterations_per_second: 49.194020}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.046142320, iterations_per_second: 21.672079}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013543648, iterations_per_second: 73.835351}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002569, iterations_per_second: 389271.675539}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006131, iterations_per_second: 163097.548484}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002056172, iterations_per_second: 486.340716}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001777931, iterations_per_second: 562.451524}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021662558, iterations_per_second: 46.162600}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018070986, iterations_per_second: 55.337324}
  xpath:
  xslt:
