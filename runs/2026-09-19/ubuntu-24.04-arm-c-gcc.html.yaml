platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000004739, iterations_per_second: 211001.624764}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005064, iterations_per_second: 197464.555037}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.004686235, iterations_per_second: 213.390920}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001362311, iterations_per_second: 734.046778}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.089684509, iterations_per_second: 11.150198}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013581826, iterations_per_second: 73.627802}
  xslt:
