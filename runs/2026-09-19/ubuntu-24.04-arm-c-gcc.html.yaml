platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002018, iterations_per_second: 495662.948421}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004702, iterations_per_second: 212666.411513}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005060, iterations_per_second: 197640.176137}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002013798, iterations_per_second: 496.574135}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004621484, iterations_per_second: 216.380712}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001351104, iterations_per_second: 740.135474}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.066745894, iterations_per_second: 14.982195}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.094455501, iterations_per_second: 10.586996}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013585162, iterations_per_second: 73.609722}
  xslt:
