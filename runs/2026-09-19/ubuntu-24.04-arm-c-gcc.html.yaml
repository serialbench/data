platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002035, iterations_per_second: 491328.060517}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004702, iterations_per_second: 212652.844422}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005078, iterations_per_second: 196908.536044}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001984830, iterations_per_second: 503.821571}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004592439, iterations_per_second: 217.749202}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001347593, iterations_per_second: 742.063997}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.065187948, iterations_per_second: 15.340259}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.092316951, iterations_per_second: 10.832247}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013488951, iterations_per_second: 74.134749}
  xslt:
