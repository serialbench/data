platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000004695, iterations_per_second: 212978.936214}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005033, iterations_per_second: 198692.602771}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.004654854, iterations_per_second: 214.829525}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001357501, iterations_per_second: 736.647527}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.091375607, iterations_per_second: 10.943840}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013662178, iterations_per_second: 73.194772}
  xslt:
