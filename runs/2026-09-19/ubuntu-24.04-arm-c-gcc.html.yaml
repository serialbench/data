platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002094, iterations_per_second: 477646.158462}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004470, iterations_per_second: 223688.625751}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005067, iterations_per_second: 197339.858619}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001898638, iterations_per_second: 526.693438}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003655049, iterations_per_second: 273.594168}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001350007, iterations_per_second: 740.736900}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019973373, iterations_per_second: 50.066656}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037473591, iterations_per_second: 26.685460}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013517688, iterations_per_second: 73.977148}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002560, iterations_per_second: 390609.740873}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006155, iterations_per_second: 162480.095932}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002046435, iterations_per_second: 488.654660}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001771577, iterations_per_second: 564.468832}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021499837, iterations_per_second: 46.511981}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018062983, iterations_per_second: 55.361841}
  xpath:
  xslt:
