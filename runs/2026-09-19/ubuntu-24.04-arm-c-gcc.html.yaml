platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002109, iterations_per_second: 474225.826490}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004495, iterations_per_second: 222474.359833}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005004, iterations_per_second: 199852.109349}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001888121, iterations_per_second: 529.626980}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003684155, iterations_per_second: 271.432662}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001351043, iterations_per_second: 740.168892}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020404028, iterations_per_second: 49.009931}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.038562230, iterations_per_second: 25.932110}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013763926, iterations_per_second: 72.653689}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002597, iterations_per_second: 385119.001628}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006253, iterations_per_second: 159918.121882}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002054641, iterations_per_second: 486.702951}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001782781, iterations_per_second: 560.921287}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022196292, iterations_per_second: 45.052570}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018375068, iterations_per_second: 54.421567}
  xpath:
  xslt:
