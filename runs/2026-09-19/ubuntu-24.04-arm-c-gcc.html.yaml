platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002030, iterations_per_second: 492489.534779}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004720, iterations_per_second: 211855.429898}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005086, iterations_per_second: 196625.899640}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002005311, iterations_per_second: 498.675849}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004625316, iterations_per_second: 216.201460}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001356575, iterations_per_second: 737.150545}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.062012043, iterations_per_second: 16.125900}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.089353637, iterations_per_second: 11.191486}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013587906, iterations_per_second: 73.594857}
  xslt:
