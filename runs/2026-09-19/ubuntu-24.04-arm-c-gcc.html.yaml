platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002112, iterations_per_second: 473507.268428}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004472, iterations_per_second: 223623.596914}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005164, iterations_per_second: 193659.585133}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001892757, iterations_per_second: 528.329745}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003636273, iterations_per_second: 275.006855}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001354451, iterations_per_second: 738.306335}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019890195, iterations_per_second: 50.276028}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037226297, iterations_per_second: 26.862731}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013572970, iterations_per_second: 73.675843}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002571, iterations_per_second: 388953.713822}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006232, iterations_per_second: 160451.832365}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002045601, iterations_per_second: 488.853807}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001779506, iterations_per_second: 561.953816}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021487387, iterations_per_second: 46.538930}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018129590, iterations_per_second: 55.158445}
  xpath:
  xslt:
