platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002100, iterations_per_second: 476213.152681}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004446, iterations_per_second: 224911.160065}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005101, iterations_per_second: 196028.463482}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001896068, iterations_per_second: 527.407245}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003652749, iterations_per_second: 273.766390}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001354867, iterations_per_second: 738.080008}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019848156, iterations_per_second: 50.382514}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037198014, iterations_per_second: 26.883156}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013544875, iterations_per_second: 73.828662}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002590, iterations_per_second: 386070.573635}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006218, iterations_per_second: 160823.415925}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002054494, iterations_per_second: 486.737933}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001789517, iterations_per_second: 558.810107}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021562530, iterations_per_second: 46.376747}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018363904, iterations_per_second: 54.454652}
