platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002123, iterations_per_second: 471142.520351}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004474, iterations_per_second: 223528.622718}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005052, iterations_per_second: 197933.573568}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001892061, iterations_per_second: 528.524093}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003623986, iterations_per_second: 275.939230}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001352626, iterations_per_second: 739.302478}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019860996, iterations_per_second: 50.349942}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037847823, iterations_per_second: 26.421599}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013530365, iterations_per_second: 73.907836}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003880, iterations_per_second: 257725.316437}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006272, iterations_per_second: 159433.691539}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002049808, iterations_per_second: 487.850490}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001783991, iterations_per_second: 560.540944}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021959607, iterations_per_second: 45.538156}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018159433, iterations_per_second: 55.067799}
  xpath:
  xslt:
