platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002096, iterations_per_second: 477122.000490}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004485, iterations_per_second: 222990.299826}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005096, iterations_per_second: 196213.087468}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001888465, iterations_per_second: 529.530598}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003625203, iterations_per_second: 275.846622}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001355383, iterations_per_second: 737.799018}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019993261, iterations_per_second: 50.016853}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037434516, iterations_per_second: 26.713315}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013950401, iterations_per_second: 71.682527}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002558, iterations_per_second: 390884.571416}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006194, iterations_per_second: 161446.561128}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002047568, iterations_per_second: 488.384348}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001778317, iterations_per_second: 562.329438}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021882276, iterations_per_second: 45.699085}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018452810, iterations_per_second: 54.192288}
  xpath:
  xslt:
