platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002129, iterations_per_second: 469748.210584}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004535, iterations_per_second: 220492.579781}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005085, iterations_per_second: 196656.833904}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001887716, iterations_per_second: 529.740703}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003637472, iterations_per_second: 274.916180}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001352972, iterations_per_second: 739.113778}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020409695, iterations_per_second: 48.996323}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.038120173, iterations_per_second: 26.232830}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013840506, iterations_per_second: 72.251694}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002621, iterations_per_second: 381548.323127}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006223, iterations_per_second: 160683.870889}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002057543, iterations_per_second: 486.016495}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001784198, iterations_per_second: 560.476016}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022283067, iterations_per_second: 44.877126}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018363957, iterations_per_second: 54.454495}
  xpath:
  xslt:
