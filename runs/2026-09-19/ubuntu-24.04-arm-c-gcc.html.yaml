platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002099, iterations_per_second: 476349.260090}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004446, iterations_per_second: 224931.395971}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005198, iterations_per_second: 192363.181796}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001873477, iterations_per_second: 533.766894}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003613401, iterations_per_second: 276.747585}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001344823, iterations_per_second: 743.592464}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019825187, iterations_per_second: 50.440886}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037169422, iterations_per_second: 26.903835}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013588725, iterations_per_second: 73.590421}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002577, iterations_per_second: 388063.176838}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006271, iterations_per_second: 159454.029344}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002031054, iterations_per_second: 492.355120}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001786837, iterations_per_second: 559.648034}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021446663, iterations_per_second: 46.627300}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018085197, iterations_per_second: 55.293841}
  xpath:
  xslt:
