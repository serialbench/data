platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002095, iterations_per_second: 477304.185720}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004441, iterations_per_second: 225154.230353}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005095, iterations_per_second: 196274.706249}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001886616, iterations_per_second: 530.049664}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003646936, iterations_per_second: 274.202758}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001355686, iterations_per_second: 737.633936}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020220578, iterations_per_second: 49.454570}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037668916, iterations_per_second: 26.547087}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013627227, iterations_per_second: 73.382501}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002583, iterations_per_second: 387146.728207}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006201, iterations_per_second: 161277.316299}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002048863, iterations_per_second: 488.075581}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001792794, iterations_per_second: 557.788569}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021558835, iterations_per_second: 46.384696}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018108536, iterations_per_second: 55.222576}
  xpath:
  xslt:
