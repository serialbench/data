platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002137, iterations_per_second: 467989.517529}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004487, iterations_per_second: 222846.191434}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005040, iterations_per_second: 198408.761692}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001889495, iterations_per_second: 529.241940}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003644055, iterations_per_second: 274.419568}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001353783, iterations_per_second: 738.671003}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019954800, iterations_per_second: 50.113256}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037509221, iterations_per_second: 26.660111}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013548596, iterations_per_second: 73.808386}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002598, iterations_per_second: 384837.406502}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006299, iterations_per_second: 158745.277282}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002063804, iterations_per_second: 484.542137}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001782667, iterations_per_second: 560.957157}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021502470, iterations_per_second: 46.506285}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018179794, iterations_per_second: 55.006124}
