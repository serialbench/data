platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000012900, iterations_per_second: 77519.379836}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000017700, iterations_per_second: 56497.175139}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002405333, iterations_per_second: 415.742794}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004704000, iterations_per_second: 212.585034}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.014319000, iterations_per_second: 69.837279}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.042714000, iterations_per_second: 23.411528}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000850, iterations_per_second: 1176470.591206}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000853181, iterations_per_second: 1172.084693}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.011786875, iterations_per_second: 84.840129}
  xslt:
