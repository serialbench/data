platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007300, iterations_per_second: 136986.301076}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000011000, iterations_per_second: 90909.090951}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001601667, iterations_per_second: 624.349636}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004961000, iterations_per_second: 201.572264}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019788000, iterations_per_second: 50.535678}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055098000, iterations_per_second: 18.149479}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001238, iterations_per_second: 808080.801769}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002303375, iterations_per_second: 434.145547}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.012418667, iterations_per_second: 80.523940}
  xslt:
