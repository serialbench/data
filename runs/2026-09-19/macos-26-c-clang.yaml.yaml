    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000018800, iterations_per_second: 53191.489335}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002746333, iterations_per_second: 364.121859}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005091667, iterations_per_second: 196.399345}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015056000, iterations_per_second: 66.418704}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.060338000, iterations_per_second: 16.573304}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001150, iterations_per_second: 869565.215289}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001160972, iterations_per_second: 861.346969}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.015175541, iterations_per_second: 65.895509}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000013000, iterations_per_second: 76923.076915}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000021200, iterations_per_second: 47169.811313}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003044667, iterations_per_second: 328.443179}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005972333, iterations_per_second: 167.438745}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.037299000, iterations_per_second: 26.810370}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.082976000, iterations_per_second: 12.051678}
