platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011100, iterations_per_second: 90090.090041}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000016700, iterations_per_second: 59880.239550}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001140333, iterations_per_second: 876.936568}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003747667, iterations_per_second: 266.832696}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015331000, iterations_per_second: 65.227317}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055450000, iterations_per_second: 18.034265}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001042, iterations_per_second: 959969.291589}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000846917, iterations_per_second: 1180.753714}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013169834, iterations_per_second: 75.931101}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000012400, iterations_per_second: 80645.161198}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000020500, iterations_per_second: 48780.487847}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002316333, iterations_per_second: 431.716794}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005776333, iterations_per_second: 173.120203}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.028525000, iterations_per_second: 35.056968}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.082486000, iterations_per_second: 12.123269}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001283, iterations_per_second: 779180.301266}
