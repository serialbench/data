    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001692333, iterations_per_second: 590.900138}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004756667, iterations_per_second: 210.231254}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015428000, iterations_per_second: 64.817215}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.046425000, iterations_per_second: 21.540118}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000913, iterations_per_second: 1095890.367645}
