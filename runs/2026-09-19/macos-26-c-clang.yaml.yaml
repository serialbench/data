platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007100, iterations_per_second: 140845.070383}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001510333, iterations_per_second: 662.105495}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003968333, iterations_per_second: 251.994960}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016759000, iterations_per_second: 59.669431}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.052706000, iterations_per_second: 18.973172}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001150, iterations_per_second: 869565.217438}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001238931, iterations_per_second: 807.147669}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.022706792, iterations_per_second: 44.039686}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005600, iterations_per_second: 178571.428569}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008800, iterations_per_second: 113636.363630}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002561000, iterations_per_second: 390.472472}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006085000, iterations_per_second: 164.338537}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.039307000, iterations_per_second: 25.440761}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.081500000, iterations_per_second: 12.269939}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001321, iterations_per_second: 757116.898115}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001391694, iterations_per_second: 718.548589}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.016633333, iterations_per_second: 60.120242}
  xpath:
  xslt:
