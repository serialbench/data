    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003924000, iterations_per_second: 254.841998}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015529000, iterations_per_second: 64.395647}
