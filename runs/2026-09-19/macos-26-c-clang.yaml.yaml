    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000028400, iterations_per_second: 35211.267610}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002229000, iterations_per_second: 448.631673}
