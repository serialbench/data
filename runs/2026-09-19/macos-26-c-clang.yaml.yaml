    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002345667, iterations_per_second: 426.318033}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004537333, iterations_per_second: 220.393770}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.014157000, iterations_per_second: 70.636434}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.042744000, iterations_per_second: 23.395096}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000846, iterations_per_second: 1182312.615877}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000794708, iterations_per_second: 1258.323284}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.011736709, iterations_per_second: 85.202760}
  generation:
