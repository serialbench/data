platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005400, iterations_per_second: 185185.185263}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000016400, iterations_per_second: 60975.609762}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001143000, iterations_per_second: 874.890639}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003946333, iterations_per_second: 253.399780}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015537000, iterations_per_second: 64.362490}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.051143000, iterations_per_second: 19.553018}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000954, iterations_per_second: 1047998.324675}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000939222, iterations_per_second: 1064.711005}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013667708, iterations_per_second: 73.165157}
  generation:
