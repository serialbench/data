platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011600, iterations_per_second: 86206.896558}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000015000, iterations_per_second: 66666.666671}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002089667, iterations_per_second: 478.545223}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004557667, iterations_per_second: 219.410517}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.014332000, iterations_per_second: 69.773932}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.042909000, iterations_per_second: 23.305134}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000912, iterations_per_second: 1095890.412019}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000882153, iterations_per_second: 1133.590205}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013506000, iterations_per_second: 74.041167}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000014300, iterations_per_second: 69930.069926}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000024600, iterations_per_second: 40650.406503}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002254333, iterations_per_second: 443.590123}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005279333, iterations_per_second: 189.417856}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.027894000, iterations_per_second: 35.850004}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.075539000, iterations_per_second: 13.238195}
