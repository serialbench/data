    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009400, iterations_per_second: 106382.978670}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002378667, iterations_per_second: 420.403587}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005912333, iterations_per_second: 169.137960}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031102000, iterations_per_second: 32.152273}
