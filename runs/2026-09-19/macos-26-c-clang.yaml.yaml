platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008400, iterations_per_second: 119047.619026}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007000, iterations_per_second: 142857.142754}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001142333, iterations_per_second: 875.401226}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003976333, iterations_per_second: 251.487970}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016857000, iterations_per_second: 59.322537}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.043645000, iterations_per_second: 22.912132}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000950, iterations_per_second: 1052631.575307}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000783153, iterations_per_second: 1276.889701}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013126042, iterations_per_second: 76.184428}
  xslt:
