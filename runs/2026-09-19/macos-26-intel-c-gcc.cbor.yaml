platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.549940}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.331649}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000752333, iterations_per_second: 1329.198050}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003468000, iterations_per_second: 288.350634}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011357000, iterations_per_second: 88.051422}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.047001000, iterations_per_second: 21.276143}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000500, iterations_per_second: 1999999.868625}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000507333, iterations_per_second: 1971.090670}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.006675000, iterations_per_second: 149.812734}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.369746}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 249999.997789}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001617667, iterations_per_second: 618.174325}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004913000, iterations_per_second: 203.541624}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023233000, iterations_per_second: 43.042224}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.057008000, iterations_per_second: 17.541398}
  xpath:
  xslt:
