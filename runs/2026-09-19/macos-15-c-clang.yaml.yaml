    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001185333, iterations_per_second: 843.644544}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003802000, iterations_per_second: 263.019463}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016216000, iterations_per_second: 61.667489}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.051471000, iterations_per_second: 19.428416}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001025, iterations_per_second: 975609.761266}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001295417, iterations_per_second: 771.952396}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.016991125, iterations_per_second: 58.854255}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004600, iterations_per_second: 217391.304359}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005900, iterations_per_second: 169491.525198}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002396000, iterations_per_second: 417.362270}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005880333, iterations_per_second: 170.058387}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.039159000, iterations_per_second: 25.536914}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.082548000, iterations_per_second: 12.114164}
