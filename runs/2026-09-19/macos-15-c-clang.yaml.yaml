    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001104333, iterations_per_second: 905.523695}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003490667, iterations_per_second: 286.478228}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016571000, iterations_per_second: 60.346388}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.050283000, iterations_per_second: 19.887437}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000950, iterations_per_second: 1052631.575307}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001047069, iterations_per_second: 955.046594}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018052250, iterations_per_second: 55.394757}
