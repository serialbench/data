platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 250000.000631}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.895401}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001287000, iterations_per_second: 777.000777}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004232000, iterations_per_second: 236.294896}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.017288000, iterations_per_second: 57.843591}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.050595000, iterations_per_second: 19.764799}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001204, iterations_per_second: 830426.840755}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001311861, iterations_per_second: 762.275881}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021083625, iterations_per_second: 47.430174}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005000, iterations_per_second: 199999.999595}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.425727}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002767667, iterations_per_second: 361.315187}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006563667, iterations_per_second: 152.353867}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.035582000, iterations_per_second: 28.104098}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.072581000, iterations_per_second: 13.777710}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001596, iterations_per_second: 626644.944977}
