    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001229333, iterations_per_second: 813.449024}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003832333, iterations_per_second: 260.937636}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.014827000, iterations_per_second: 67.444527}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.044218000, iterations_per_second: 22.615225}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000892, iterations_per_second: 1121453.396162}
