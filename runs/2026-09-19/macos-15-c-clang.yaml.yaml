platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.778479}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270953}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001165333, iterations_per_second: 858.123570}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003859667, iterations_per_second: 259.089731}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016873000, iterations_per_second: 59.266283}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048360000, iterations_per_second: 20.678246}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000933, iterations_per_second: 1071466.840402}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001216417, iterations_per_second: 822.086730}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021109375, iterations_per_second: 47.372317}
  xslt:
