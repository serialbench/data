platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 249999.999921}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001180667, iterations_per_second: 846.979108}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003777667, iterations_per_second: 264.713668}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016301000, iterations_per_second: 61.345930}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048894000, iterations_per_second: 20.452407}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002663, iterations_per_second: 375586.854005}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001294639, iterations_per_second: 772.416094}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.019931000, iterations_per_second: 50.173097}
  xslt:
