    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005900, iterations_per_second: 169491.525525}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002315667, iterations_per_second: 431.841082}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005633667, iterations_per_second: 177.504290}
