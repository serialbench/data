platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001215000, iterations_per_second: 823.045267}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004509000, iterations_per_second: 221.778665}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.017093000, iterations_per_second: 58.503481}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.053687000, iterations_per_second: 18.626483}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000942, iterations_per_second: 1061909.312818}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001168028, iterations_per_second: 856.144104}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.025891334, iterations_per_second: 38.622962}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005200, iterations_per_second: 192307.692373}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005900, iterations_per_second: 169491.525525}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002508667, iterations_per_second: 398.618124}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007283000, iterations_per_second: 137.306055}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.055524000, iterations_per_second: 18.010230}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.118797000, iterations_per_second: 8.417721}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001321, iterations_per_second: 757116.899744}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001543945, iterations_per_second: 647.691606}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.025470500, iterations_per_second: 39.261106}
  xpath:
  xslt:
