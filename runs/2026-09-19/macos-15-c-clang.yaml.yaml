platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270537}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001183333, iterations_per_second: 845.070423}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003832333, iterations_per_second: 260.937636}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015488000, iterations_per_second: 64.566116}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056113000, iterations_per_second: 17.821182}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001017, iterations_per_second: 983671.056699}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001401167, iterations_per_second: 713.690972}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020332625, iterations_per_second: 49.182041}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000010000, iterations_per_second: 100000.000025}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007400, iterations_per_second: 135135.135165}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002471000, iterations_per_second: 404.694456}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006455000, iterations_per_second: 154.918668}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.036262000, iterations_per_second: 27.577078}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078389000, iterations_per_second: 12.756892}
