    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001173333, iterations_per_second: 852.272727}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003696333, iterations_per_second: 270.538371}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016292000, iterations_per_second: 61.379818}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.046383000, iterations_per_second: 21.559623}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000975, iterations_per_second: 1025641.025241}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001187597, iterations_per_second: 842.036482}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018391125, iterations_per_second: 54.374053}
  generation:
