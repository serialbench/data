    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.426338}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002423000, iterations_per_second: 412.711515}
