platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.727259}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001249333, iterations_per_second: 800.426894}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003809667, iterations_per_second: 262.490157}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015634000, iterations_per_second: 63.963157}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.072938000, iterations_per_second: 13.710274}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002517, iterations_per_second: 397345.729784}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001272083, iterations_per_second: 786.112021}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.023357666, iterations_per_second: 42.812497}
  xslt:
