platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270537}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001345667, iterations_per_second: 743.126084}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003823667, iterations_per_second: 261.529073}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024388000, iterations_per_second: 41.003772}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.053035000, iterations_per_second: 18.855473}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000963, iterations_per_second: 1038961.036982}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001239680, iterations_per_second: 806.659566}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020092000, iterations_per_second: 49.771053}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.727259}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666772}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002426333, iterations_per_second: 412.144525}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007009667, iterations_per_second: 142.660136}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.032362000, iterations_per_second: 30.900439}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078997000, iterations_per_second: 12.658709}
