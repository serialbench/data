    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004100, iterations_per_second: 243902.438964}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001156000, iterations_per_second: 865.051903}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003632000, iterations_per_second: 275.330396}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016336000, iterations_per_second: 61.214496}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048293000, iterations_per_second: 20.706935}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000963, iterations_per_second: 1038961.036982}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001147333, iterations_per_second: 871.586287}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021260084, iterations_per_second: 47.036503}
  generation:
