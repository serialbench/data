    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006623333, iterations_per_second: 150.981379}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026038000, iterations_per_second: 38.405407}
