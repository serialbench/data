    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666772}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002495667, iterations_per_second: 400.694537}
