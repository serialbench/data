platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007200, iterations_per_second: 138888.889240}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010900, iterations_per_second: 91743.119211}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001201000, iterations_per_second: 832.639467}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005753667, iterations_per_second: 173.802213}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016721000, iterations_per_second: 59.805036}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048015000, iterations_per_second: 20.826825}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000942, iterations_per_second: 1062022.088740}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001272819, iterations_per_second: 785.657457}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.019632833, iterations_per_second: 50.935084}
  xslt:
