    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003950667, iterations_per_second: 253.121836}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016465000, iterations_per_second: 60.734892}
