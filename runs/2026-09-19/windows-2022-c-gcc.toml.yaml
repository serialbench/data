platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.0', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000770, iterations_per_second: 1298701.294310}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005570, iterations_per_second: 179533.213585}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000051100, iterations_per_second: 19569.471621}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000637633, iterations_per_second: 1568.299441}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001304900, iterations_per_second: 766.342248}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.007437000, iterations_per_second: 134.462821}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000004300, iterations_per_second: 232558.139507}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000170800, iterations_per_second: 5854.800937}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001945500, iterations_per_second: 514.006682}
  xpath:
  xslt:
