platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006918, iterations_per_second: 144548.358622}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003856, iterations_per_second: 259369.731530}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001296819, iterations_per_second: 771.117833}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003393332, iterations_per_second: 294.695568}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023699494, iterations_per_second: 42.194994}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.043073704, iterations_per_second: 23.216021}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000961, iterations_per_second: 1040474.453724}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001037137, iterations_per_second: 964.192773}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028066627, iterations_per_second: 35.629504}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006796, iterations_per_second: 147149.710140}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006005, iterations_per_second: 166519.574380}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002542458, iterations_per_second: 393.320217}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005369199, iterations_per_second: 186.247520}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.038668997, iterations_per_second: 25.860510}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.064981478, iterations_per_second: 15.389001}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001294, iterations_per_second: 772857.252344}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001398208, iterations_per_second: 715.201172}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031275167, iterations_per_second: 31.974250}
  xpath:
  xslt:
