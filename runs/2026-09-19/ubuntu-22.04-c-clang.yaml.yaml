platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006009, iterations_per_second: 166428.119800}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004350, iterations_per_second: 229890.342531}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001516465, iterations_per_second: 659.428487}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003806956, iterations_per_second: 262.677057}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025281896, iterations_per_second: 39.553995}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.049575282, iterations_per_second: 20.171343}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001046, iterations_per_second: 956480.148327}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001097348, iterations_per_second: 911.288218}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032545067, iterations_per_second: 30.726623}
  xslt:
