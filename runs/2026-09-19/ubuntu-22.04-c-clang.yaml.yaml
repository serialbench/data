platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004401, iterations_per_second: 227236.575928}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003989, iterations_per_second: 250689.395771}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001713605, iterations_per_second: 583.565057}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003655391, iterations_per_second: 273.568571}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.032525733, iterations_per_second: 30.744887}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047106728, iterations_per_second: 21.228390}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001262, iterations_per_second: 792455.819497}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001269979, iterations_per_second: 787.414595}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.043161097, iterations_per_second: 23.169013}
  xslt:
