platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004538, iterations_per_second: 220385.674866}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007836, iterations_per_second: 127622.645334}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001655496, iterations_per_second: 604.048697}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004490133, iterations_per_second: 222.710536}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031437538, iterations_per_second: 31.809107}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055941000, iterations_per_second: 17.875976}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001348, iterations_per_second: 741564.704049}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001665979, iterations_per_second: 600.247782}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.046979571, iterations_per_second: 21.285848}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006527, iterations_per_second: 153205.049571}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007223, iterations_per_second: 138437.045853}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003231212, iterations_per_second: 309.481364}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006734995, iterations_per_second: 148.478217}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.052519802, iterations_per_second: 19.040437}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085139851, iterations_per_second: 11.745381}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001785, iterations_per_second: 560129.949169}
