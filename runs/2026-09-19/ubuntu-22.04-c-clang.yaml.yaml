platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005476, iterations_per_second: 182621.717644}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003964, iterations_per_second: 252276.798325}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001319767, iterations_per_second: 757.709505}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003530642, iterations_per_second: 283.234580}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021773444, iterations_per_second: 45.927507}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.044096648, iterations_per_second: 22.677461}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000950, iterations_per_second: 1052520.784817}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001035935, iterations_per_second: 965.311220}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028130429, iterations_per_second: 35.548694}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000010101, iterations_per_second: 98998.138764}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006099, iterations_per_second: 163966.682043}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002645880, iterations_per_second: 377.946090}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005282416, iterations_per_second: 189.307305}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.039757237, iterations_per_second: 25.152653}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.065783795, iterations_per_second: 15.201312}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001256, iterations_per_second: 796305.145378}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001356982, iterations_per_second: 736.929270}
