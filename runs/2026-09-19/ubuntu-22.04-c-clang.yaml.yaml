platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004549, iterations_per_second: 219847.865392}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004905, iterations_per_second: 203865.285902}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001650518, iterations_per_second: 605.870399}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004507504, iterations_per_second: 221.852255}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031584926, iterations_per_second: 31.660673}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056192227, iterations_per_second: 17.796056}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001320, iterations_per_second: 757862.826358}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001637581, iterations_per_second: 610.656941}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.046626433, iterations_per_second: 21.447062}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006427, iterations_per_second: 155591.168681}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007694, iterations_per_second: 129962.960574}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003218805, iterations_per_second: 310.674303}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006834812, iterations_per_second: 146.309803}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.052317412, iterations_per_second: 19.114095}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.086574195, iterations_per_second: 11.550786}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001750, iterations_per_second: 571297.989071}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002150197, iterations_per_second: 465.073593}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.051478820, iterations_per_second: 19.425465}
  xpath:
  xslt:
