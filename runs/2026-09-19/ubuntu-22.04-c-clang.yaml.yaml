platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005423, iterations_per_second: 184396.378431}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004842, iterations_per_second: 206521.963600}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001611428, iterations_per_second: 620.567596}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004469706, iterations_per_second: 223.728362}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031134202, iterations_per_second: 32.119018}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055566108, iterations_per_second: 17.996582}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001324, iterations_per_second: 755001.888018}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001675164, iterations_per_second: 596.956477}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.047241512, iterations_per_second: 21.167824}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006832, iterations_per_second: 146374.308404}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007331, iterations_per_second: 136412.620934}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003221013, iterations_per_second: 310.461368}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006673969, iterations_per_second: 149.835885}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.052844403, iterations_per_second: 18.923480}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085005965, iterations_per_second: 11.763880}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001725, iterations_per_second: 579642.940213}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002181560, iterations_per_second: 458.387506}
