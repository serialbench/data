platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004555, iterations_per_second: 219514.872202}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005246, iterations_per_second: 190628.693331}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001689123, iterations_per_second: 592.023198}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004481755, iterations_per_second: 223.126894}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031469544, iterations_per_second: 31.776755}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056011303, iterations_per_second: 17.853539}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001357, iterations_per_second: 736648.252166}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001637443, iterations_per_second: 610.708281}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.046688913, iterations_per_second: 21.418361}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006297, iterations_per_second: 158810.824524}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007297, iterations_per_second: 137050.132930}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003214767, iterations_per_second: 311.064502}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006786017, iterations_per_second: 147.361847}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.052642329, iterations_per_second: 18.996120}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085183926, iterations_per_second: 11.739304}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001758, iterations_per_second: 568731.161183}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002148909, iterations_per_second: 465.352491}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.051752616, iterations_per_second: 19.322695}
  xpath:
  xslt:
