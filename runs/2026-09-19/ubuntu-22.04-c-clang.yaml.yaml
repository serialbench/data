platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000002166, iterations_per_second: 461616.581607}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.001938337, iterations_per_second: 515.906250}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.024693780, iterations_per_second: 40.496028}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000681, iterations_per_second: 1468428.780744}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000638284, iterations_per_second: 1566.701534}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026414687, iterations_per_second: 37.857727}
  xslt:
