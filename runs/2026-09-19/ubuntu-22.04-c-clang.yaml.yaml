platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002451, iterations_per_second: 408046.679963}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000002257, iterations_per_second: 442987.507492}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000876863, iterations_per_second: 1140.429007}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002033044, iterations_per_second: 491.873270}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015145932, iterations_per_second: 66.024329}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.026004545, iterations_per_second: 38.454816}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000708, iterations_per_second: 1412229.904006}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000635736, iterations_per_second: 1572.979979}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018875790, iterations_per_second: 52.977915}
  xslt:
