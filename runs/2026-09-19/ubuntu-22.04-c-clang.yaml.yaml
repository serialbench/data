platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004501, iterations_per_second: 222153.107951}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004710, iterations_per_second: 212318.732883}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001701918, iterations_per_second: 587.572489}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004489836, iterations_per_second: 222.725284}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031789058, iterations_per_second: 31.457365}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056003100, iterations_per_second: 17.856154}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001318, iterations_per_second: 759013.281538}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001679679, iterations_per_second: 595.351850}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.046420081, iterations_per_second: 21.542401}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006239, iterations_per_second: 160289.804003}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007222, iterations_per_second: 138475.385967}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003201987, iterations_per_second: 312.306045}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006692171, iterations_per_second: 149.428347}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.051603078, iterations_per_second: 19.378689}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.084837033, iterations_per_second: 11.787305}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001744, iterations_per_second: 573295.878325}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002184545, iterations_per_second: 457.761297}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.051291365, iterations_per_second: 19.496459}
  xpath:
  xslt:
