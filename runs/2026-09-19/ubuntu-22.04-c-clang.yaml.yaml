platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005962, iterations_per_second: 167723.323020}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005062, iterations_per_second: 197530.864752}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001763749, iterations_per_second: 566.974206}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004520837, iterations_per_second: 221.197994}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031604779, iterations_per_second: 31.640784}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055982532, iterations_per_second: 17.862715}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001369, iterations_per_second: 730673.687822}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001668549, iterations_per_second: 599.323124}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.047438122, iterations_per_second: 21.080093}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007537, iterations_per_second: 132677.024955}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007756, iterations_per_second: 128939.088878}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003227151, iterations_per_second: 309.870811}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006722917, iterations_per_second: 148.744957}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.052944338, iterations_per_second: 18.887761}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085540158, iterations_per_second: 11.690416}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001747, iterations_per_second: 572311.571544}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002178253, iterations_per_second: 459.083565}
