platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004590, iterations_per_second: 217883.911370}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004685, iterations_per_second: 213460.840770}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001649081, iterations_per_second: 606.398229}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004497188, iterations_per_second: 222.361157}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031112542, iterations_per_second: 32.141379}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055882217, iterations_per_second: 17.894780}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001338, iterations_per_second: 747663.549318}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001633877, iterations_per_second: 612.041301}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.045834842, iterations_per_second: 21.817464}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006372, iterations_per_second: 156936.597720}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009001, iterations_per_second: 111100.001158}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003254942, iterations_per_second: 307.225136}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006683619, iterations_per_second: 149.619540}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.052439941, iterations_per_second: 19.069434}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.084950552, iterations_per_second: 11.771554}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001724, iterations_per_second: 579979.120327}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002155657, iterations_per_second: 463.895766}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.051206250, iterations_per_second: 19.528866}
  xpath:
  xslt:
