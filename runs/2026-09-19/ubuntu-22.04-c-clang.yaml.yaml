platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004466, iterations_per_second: 223893.963103}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004682, iterations_per_second: 213597.625324}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001682239, iterations_per_second: 594.445737}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004482745, iterations_per_second: 223.077584}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031050609, iterations_per_second: 32.205487}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055868895, iterations_per_second: 17.899047}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001378, iterations_per_second: 725900.124974}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001670798, iterations_per_second: 598.516517}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.046452863, iterations_per_second: 21.527198}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006353, iterations_per_second: 157410.905291}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007169, iterations_per_second: 139483.631826}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003223857, iterations_per_second: 310.187456}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006753489, iterations_per_second: 148.071604}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.053102990, iterations_per_second: 18.831331}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.084733795, iterations_per_second: 11.801667}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001764, iterations_per_second: 566797.027028}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002169138, iterations_per_second: 461.012694}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.051507334, iterations_per_second: 19.414711}
  xpath:
  xslt:
