platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004631, iterations_per_second: 215954.735615}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004609, iterations_per_second: 216943.269795}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001731703, iterations_per_second: 577.466339}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004475263, iterations_per_second: 223.450571}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031879894, iterations_per_second: 31.367733}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056870761, iterations_per_second: 17.583728}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001374, iterations_per_second: 728013.976380}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001765823, iterations_per_second: 566.308068}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.046490362, iterations_per_second: 21.509835}
  xslt:
