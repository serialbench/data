platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004464, iterations_per_second: 223994.265680}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004858, iterations_per_second: 205841.790054}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001619853, iterations_per_second: 617.339841}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004640992, iterations_per_second: 215.471175}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031459371, iterations_per_second: 31.787031}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057008942, iterations_per_second: 17.541108}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001363, iterations_per_second: 733406.676189}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001630814, iterations_per_second: 613.190713}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.045887487, iterations_per_second: 21.792433}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006265, iterations_per_second: 159622.014968}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007375, iterations_per_second: 135596.897376}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003218079, iterations_per_second: 310.744391}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006831401, iterations_per_second: 146.382865}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.052109587, iterations_per_second: 19.190327}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085990499, iterations_per_second: 11.629192}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001772, iterations_per_second: 564238.558733}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002162209, iterations_per_second: 462.490053}
