platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004453, iterations_per_second: 224552.579020}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004658, iterations_per_second: 214693.632076}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001638926, iterations_per_second: 610.155799}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004466998, iterations_per_second: 223.863991}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031192529, iterations_per_second: 32.058959}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055673419, iterations_per_second: 17.961893}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001385, iterations_per_second: 722230.246917}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001657741, iterations_per_second: 603.230662}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.052333786, iterations_per_second: 19.108115}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006399, iterations_per_second: 156276.860057}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007260, iterations_per_second: 137748.636297}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003213364, iterations_per_second: 311.200382}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006687960, iterations_per_second: 149.522425}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.052546314, iterations_per_second: 19.030831}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.084686558, iterations_per_second: 11.808249}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001766, iterations_per_second: 566155.239954}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002142385, iterations_per_second: 466.769512}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.051790348, iterations_per_second: 19.308617}
  xpath:
