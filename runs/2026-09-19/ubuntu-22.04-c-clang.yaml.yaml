platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004683, iterations_per_second: 213547.450266}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004474321, iterations_per_second: 223.497616}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056006367, iterations_per_second: 17.855113}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001303, iterations_per_second: 767754.316033}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001786032, iterations_per_second: 559.900383}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.069105854, iterations_per_second: 14.470554}
  xslt:
