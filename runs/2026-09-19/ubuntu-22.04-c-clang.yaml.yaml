platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005601, iterations_per_second: 178523.609798}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003069, iterations_per_second: 325881.509458}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001268671, iterations_per_second: 788.226420}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002852802, iterations_per_second: 350.532605}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024019153, iterations_per_second: 41.633441}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.035475460, iterations_per_second: 28.188500}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001013, iterations_per_second: 986679.822731}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001003317, iterations_per_second: 996.693966}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.035307516, iterations_per_second: 28.322582}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004699, iterations_per_second: 212806.707774}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005092, iterations_per_second: 196398.059658}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002465677, iterations_per_second: 405.568126}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004345437, iterations_per_second: 230.126470}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040410416, iterations_per_second: 24.746095}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.054876986, iterations_per_second: 18.222575}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001310, iterations_per_second: 763417.054723}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001309556, iterations_per_second: 763.617593}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.038927469, iterations_per_second: 25.688801}
  xpath:
  xslt:
