platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454545.469786}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005400, iterations_per_second: 185185.184873}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000117000, iterations_per_second: 8547.008555}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000588333, iterations_per_second: 1699.716714}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001874000, iterations_per_second: 533.617929}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.009831000, iterations_per_second: 101.719052}
  xslt:
