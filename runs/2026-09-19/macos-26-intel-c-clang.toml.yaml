platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.704488}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.645834}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000074000, iterations_per_second: 13513.513534}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000368667, iterations_per_second: 2712.477396}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001008000, iterations_per_second: 992.063492}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004379000, iterations_per_second: 228.362640}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002100, iterations_per_second: 476190.469659}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000140667, iterations_per_second: 7109.004738}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001894000, iterations_per_second: 527.983105}
  xpath:
  xslt:
