platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001148, iterations_per_second: 871231.923740}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000005594, iterations_per_second: 178750.178763}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000631753, iterations_per_second: 1582.896278}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002382581, iterations_per_second: 419.712849}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.031108975, iterations_per_second: 32.145064}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.063307483, iterations_per_second: 15.795921}
  xslt:
