platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000000617, iterations_per_second: 1621008.262781}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000003047, iterations_per_second: 328234.753514}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000314174, iterations_per_second: 3182.949576}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.001272737, iterations_per_second: 785.708281}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.012355102, iterations_per_second: 80.938223}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.039926074, iterations_per_second: 25.046289}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000219, iterations_per_second: 4559963.519749}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000131101, iterations_per_second: 7627.687489}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.001865776, iterations_per_second: 535.970020}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000024139, iterations_per_second: 41426.050358}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000033127, iterations_per_second: 30186.856642}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001455904, iterations_per_second: 686.858631}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.002308226, iterations_per_second: 433.233078}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.037060000, iterations_per_second: 26.983270}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.055764973, iterations_per_second: 17.932404}
