platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001066, iterations_per_second: 937734.433497}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000005421, iterations_per_second: 184461.004913}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000607546, iterations_per_second: 1645.964999}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002338169, iterations_per_second: 427.685082}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.020397758, iterations_per_second: 49.024996}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.043142598, iterations_per_second: 23.178947}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000395, iterations_per_second: 2529724.239451}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000267071, iterations_per_second: 3744.317998}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.003588207, iterations_per_second: 278.690722}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000041042, iterations_per_second: 24365.403077}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000059106, iterations_per_second: 16918.842005}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002554128, iterations_per_second: 391.523056}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004141762, iterations_per_second: 241.443154}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.056824079, iterations_per_second: 17.598173}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.071211207, iterations_per_second: 14.042733}
