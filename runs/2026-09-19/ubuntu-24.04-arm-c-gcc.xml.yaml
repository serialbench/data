platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000000996, iterations_per_second: 1004116.878152}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000005704, iterations_per_second: 175303.274616}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000551653, iterations_per_second: 1812.732634}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002619547, iterations_per_second: 381.745393}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.018738706, iterations_per_second: 53.365478}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.051152844, iterations_per_second: 19.549255}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000385, iterations_per_second: 2598752.594872}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000226893, iterations_per_second: 4407.357348}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.003161984, iterations_per_second: 316.257135}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000034440, iterations_per_second: 29036.341885}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000055793, iterations_per_second: 17923.491783}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002401336, iterations_per_second: 416.434909}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004537009, iterations_per_second: 220.409509}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.058318388, iterations_per_second: 17.147250}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.083731212, iterations_per_second: 11.942978}
