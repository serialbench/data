platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000000997, iterations_per_second: 1003210.275681}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000005614, iterations_per_second: 178132.459326}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000560349, iterations_per_second: 1784.603158}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002616528, iterations_per_second: 382.185907}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.016187442, iterations_per_second: 61.776283}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.040907493, iterations_per_second: 24.445399}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000350, iterations_per_second: 2860411.918442}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000230364, iterations_per_second: 4340.962333}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.003061612, iterations_per_second: 326.625320}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000034864, iterations_per_second: 28682.799789}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000052688, iterations_per_second: 18979.725858}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002415221, iterations_per_second: 414.040843}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004460391, iterations_per_second: 224.195575}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.044950852, iterations_per_second: 22.246519}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.062904758, iterations_per_second: 15.897049}
