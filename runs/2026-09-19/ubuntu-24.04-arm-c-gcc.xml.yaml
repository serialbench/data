platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000000993, iterations_per_second: 1007252.213354}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000005646, iterations_per_second: 177122.816907}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000549567, iterations_per_second: 1819.613247}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002611616, iterations_per_second: 382.904733}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.017762578, iterations_per_second: 56.298134}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.046871990, iterations_per_second: 21.334703}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000359, iterations_per_second: 2783964.377219}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000228418, iterations_per_second: 4377.938691}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.007039366, iterations_per_second: 142.058248}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000035214, iterations_per_second: 28397.876975}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000055180, iterations_per_second: 18122.442471}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002403275, iterations_per_second: 416.098807}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004464759, iterations_per_second: 223.976272}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.052813328, iterations_per_second: 18.934614}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.072155789, iterations_per_second: 13.858902}
