platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000000972, iterations_per_second: 1028806.574445}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000005661, iterations_per_second: 176662.838802}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000560423, iterations_per_second: 1784.367513}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002541220, iterations_per_second: 393.511829}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.016326308, iterations_per_second: 61.250835}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.042553348, iterations_per_second: 23.499914}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000223358, iterations_per_second: 4477.110771}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.003037289, iterations_per_second: 329.240978}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000037356, iterations_per_second: 26769.819705}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000059551, iterations_per_second: 16792.301068}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002466408, iterations_per_second: 405.447923}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004408776, iterations_per_second: 226.820341}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.046978441, iterations_per_second: 21.286360}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.064178379, iterations_per_second: 15.581571}
