platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000000979, iterations_per_second: 1021346.134566}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000005687, iterations_per_second: 175827.267308}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000554292, iterations_per_second: 1804.104337}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002651368, iterations_per_second: 377.163789}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.017547373, iterations_per_second: 56.988587}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.047249774, iterations_per_second: 21.164122}
  xslt:
