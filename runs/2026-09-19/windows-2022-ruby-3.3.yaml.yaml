  created_at: '2026-09-19T03:32:52Z'
  ruby_build_tag: '3.3'
benchmark_config:
  name: full-yaml
  data_sizes:
  - small
  - medium
  - large
  formats:
  - yaml
  iterations:
    small: 10
    medium: 3
    large: 1
  warmup: 2
  operations:
  - parsing
  - generation
  - streaming
  - memory
