    name: oga
    version: '3.5'
    features:
      xpath: true
      namespaces: true
      validation: false
      streaming: true
      stax: false
  - format: xml
    name: leptris
    version: 1.9.193.4
    features:
      xpath: true
      namespaces: true
      validation: true
      streaming: true
      stax: true
  - format: xml
    name: saxon-he
    features:
      xslt_version: '3.0'
      cold_process: true
  - format: json
    name: json
    version: 3.0.2
