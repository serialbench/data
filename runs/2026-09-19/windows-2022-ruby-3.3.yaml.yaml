  kind: local
  os: windows
  arch: x86_64
  ruby_version: '3.3'
  ruby_build_tag: '3.3'
metadata:
  benchmark_config_path: config/benchmarks/full-yaml.yml
  environment_config_path: config/environments/ci-ruby-3.3.yml
  tags:
  - local
  - windows
  - x86_64
  - ruby-3.3
environment_config:
