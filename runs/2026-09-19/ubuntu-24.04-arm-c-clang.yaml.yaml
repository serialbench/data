platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003118, iterations_per_second: 320749.270182}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003987, iterations_per_second: 250789.988405}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001725458, iterations_per_second: 579.556381}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003921288, iterations_per_second: 255.018271}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026077494, iterations_per_second: 38.347243}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047892651, iterations_per_second: 20.880030}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001166, iterations_per_second: 857338.820394}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001195885, iterations_per_second: 836.200572}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026954577, iterations_per_second: 37.099451}
  xslt:
