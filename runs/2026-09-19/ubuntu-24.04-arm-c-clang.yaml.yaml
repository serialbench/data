    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006026, iterations_per_second: 165947.559794}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002989859, iterations_per_second: 334.463896}
