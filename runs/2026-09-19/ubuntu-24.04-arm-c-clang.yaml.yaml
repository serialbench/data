    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005987, iterations_per_second: 167034.142113}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002996875, iterations_per_second: 333.680918}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005516200, iterations_per_second: 181.284206}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043359637, iterations_per_second: 23.062924}
