platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003992, iterations_per_second: 250513.552256}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003923918, iterations_per_second: 254.847324}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047719108, iterations_per_second: 20.955966}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001146, iterations_per_second: 872905.025009}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001212285, iterations_per_second: 824.888537}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.035177614, iterations_per_second: 28.427170}
  xslt:
