    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003999, iterations_per_second: 250043.757826}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001777376, iterations_per_second: 562.627154}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003909103, iterations_per_second: 255.813140}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026220171, iterations_per_second: 38.138577}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047910108, iterations_per_second: 20.872422}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001159, iterations_per_second: 862663.904564}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001201533, iterations_per_second: 832.270339}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027371857, iterations_per_second: 36.533875}
  generation:
