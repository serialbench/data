platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003096, iterations_per_second: 322986.983696}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003991, iterations_per_second: 250538.658035}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001741990, iterations_per_second: 574.056218}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003894243, iterations_per_second: 256.789339}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026511756, iterations_per_second: 37.719116}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047787344, iterations_per_second: 20.926043}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001144, iterations_per_second: 874125.875638}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001195812, iterations_per_second: 836.251619}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028385463, iterations_per_second: 35.229300}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004358, iterations_per_second: 229478.853301}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006040, iterations_per_second: 165554.690936}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002997716, iterations_per_second: 333.587267}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005530983, iterations_per_second: 180.799677}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043280295, iterations_per_second: 23.105203}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068573449, iterations_per_second: 14.582904}
