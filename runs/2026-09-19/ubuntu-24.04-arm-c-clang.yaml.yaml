platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003097, iterations_per_second: 322934.831781}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003957, iterations_per_second: 252742.253462}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001727413, iterations_per_second: 578.900467}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003932920, iterations_per_second: 254.263986}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026396954, iterations_per_second: 37.883159}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048147367, iterations_per_second: 20.769568}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001151, iterations_per_second: 868658.789726}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001208928, iterations_per_second: 827.179121}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026911852, iterations_per_second: 37.158349}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004361, iterations_per_second: 229326.239405}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007913, iterations_per_second: 126371.126731}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003005438, iterations_per_second: 332.730241}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005501854, iterations_per_second: 181.756902}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.042966930, iterations_per_second: 23.273713}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068636310, iterations_per_second: 14.569548}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001421, iterations_per_second: 703878.370192}
