    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006021, iterations_per_second: 166077.092876}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002980553, iterations_per_second: 335.508247}
