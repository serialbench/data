platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003986, iterations_per_second: 250896.956682}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003923687, iterations_per_second: 254.862349}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048050321, iterations_per_second: 20.811515}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001168, iterations_per_second: 856091.084696}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001223708, iterations_per_second: 817.188637}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.035239769, iterations_per_second: 28.377031}
  xslt:
