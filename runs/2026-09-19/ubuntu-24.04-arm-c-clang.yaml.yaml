platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003119, iterations_per_second: 320595.023838}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003978, iterations_per_second: 251401.563821}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001733893, iterations_per_second: 576.736857}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003932979, iterations_per_second: 254.260215}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026116854, iterations_per_second: 38.289451}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048349117, iterations_per_second: 20.682901}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001155, iterations_per_second: 865650.974577}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001204817, iterations_per_second: 830.001569}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027521273, iterations_per_second: 36.335529}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004414, iterations_per_second: 226526.220681}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006043, iterations_per_second: 165472.506933}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002999321, iterations_per_second: 333.408758}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005543274, iterations_per_second: 180.398804}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043216456, iterations_per_second: 23.139334}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.069035574, iterations_per_second: 14.485286}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001441, iterations_per_second: 694058.852160}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001503961, iterations_per_second: 664.911006}
