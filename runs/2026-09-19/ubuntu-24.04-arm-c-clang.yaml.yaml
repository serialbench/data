platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003067, iterations_per_second: 326030.255520}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004047, iterations_per_second: 247078.299035}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001728531, iterations_per_second: 578.526039}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003929238, iterations_per_second: 254.502272}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026126054, iterations_per_second: 38.275968}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047996215, iterations_per_second: 20.834976}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001170, iterations_per_second: 854408.748996}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001195632, iterations_per_second: 836.377515}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027339874, iterations_per_second: 36.576613}
  xslt:
