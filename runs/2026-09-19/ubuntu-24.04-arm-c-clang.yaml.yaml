platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003146, iterations_per_second: 317833.645879}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003981, iterations_per_second: 251218.409351}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001730099, iterations_per_second: 578.001606}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003904561, iterations_per_second: 256.110716}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026350651, iterations_per_second: 37.949727}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047832376, iterations_per_second: 20.906342}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001160, iterations_per_second: 862068.963892}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001226863, iterations_per_second: 815.086933}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028212800, iterations_per_second: 35.444904}
  xslt:
