    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001724274, iterations_per_second: 579.954230}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003898042, iterations_per_second: 256.539074}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026015396, iterations_per_second: 38.438777}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048005600, iterations_per_second: 20.830903}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001129, iterations_per_second: 885896.474061}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001191865, iterations_per_second: 839.021433}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026400229, iterations_per_second: 37.878459}
  generation:
