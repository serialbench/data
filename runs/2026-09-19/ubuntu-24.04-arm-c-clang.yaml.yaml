    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006037, iterations_per_second: 165647.931935}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002996840, iterations_per_second: 333.684815}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005506677, iterations_per_second: 181.597722}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.042832020, iterations_per_second: 23.347019}
