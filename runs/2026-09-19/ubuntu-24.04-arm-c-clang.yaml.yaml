    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001727010, iterations_per_second: 579.035555}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003920942, iterations_per_second: 255.040753}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025787499, iterations_per_second: 38.778479}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047821133, iterations_per_second: 20.911257}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001147, iterations_per_second: 871763.578217}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001211573, iterations_per_second: 825.373069}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026267140, iterations_per_second: 38.070380}
  generation:
