platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003144, iterations_per_second: 318056.041430}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003976, iterations_per_second: 251502.728917}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001748602, iterations_per_second: 571.885317}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003904782, iterations_per_second: 256.096243}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.027110591, iterations_per_second: 36.885954}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047905225, iterations_per_second: 20.874550}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001155, iterations_per_second: 865576.040306}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001224300, iterations_per_second: 816.793492}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.036753507, iterations_per_second: 27.208288}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004378, iterations_per_second: 228430.454338}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005950, iterations_per_second: 168053.104793}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003004183, iterations_per_second: 332.869203}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005501226, iterations_per_second: 181.777651}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.044068641, iterations_per_second: 22.691873}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068883085, iterations_per_second: 14.517352}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001437, iterations_per_second: 695991.090175}
