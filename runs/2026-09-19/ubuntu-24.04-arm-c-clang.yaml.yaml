platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003095, iterations_per_second: 323101.775917}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003969, iterations_per_second: 251933.590544}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001719773, iterations_per_second: 581.471977}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003900068, iterations_per_second: 256.405786}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026279520, iterations_per_second: 38.052445}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047890455, iterations_per_second: 20.880988}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001143, iterations_per_second: 874814.096234}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001214183, iterations_per_second: 823.599079}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028337366, iterations_per_second: 35.289095}
  generation:
