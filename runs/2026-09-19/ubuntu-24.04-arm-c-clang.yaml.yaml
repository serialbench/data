platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003128, iterations_per_second: 319713.536728}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003990, iterations_per_second: 250614.004148}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001724109, iterations_per_second: 580.009845}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003907832, iterations_per_second: 255.896342}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026437963, iterations_per_second: 37.824397}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047917309, iterations_per_second: 20.869285}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001193, iterations_per_second: 837871.807370}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001213161, iterations_per_second: 824.292901}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028073056, iterations_per_second: 35.621345}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004422, iterations_per_second: 226131.789391}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006048, iterations_per_second: 165332.980733}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003026851, iterations_per_second: 330.376355}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005496208, iterations_per_second: 181.943635}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043473378, iterations_per_second: 23.002583}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068738117, iterations_per_second: 14.547969}
