platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003097, iterations_per_second: 322851.425280}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003983, iterations_per_second: 251073.337792}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001911600, iterations_per_second: 523.122083}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004173360, iterations_per_second: 239.615082}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026626897, iterations_per_second: 37.556010}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048024186, iterations_per_second: 20.822841}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001151, iterations_per_second: 868734.243712}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001210766, iterations_per_second: 825.923424}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028238399, iterations_per_second: 35.412773}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006950, iterations_per_second: 143886.962155}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006008, iterations_per_second: 166455.822751}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003166554, iterations_per_second: 315.800676}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005513643, iterations_per_second: 181.368290}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043505979, iterations_per_second: 22.985346}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068708114, iterations_per_second: 14.554322}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001434, iterations_per_second: 697204.212316}
