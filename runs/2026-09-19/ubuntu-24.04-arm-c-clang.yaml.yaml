    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001777044, iterations_per_second: 562.732373}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003896140, iterations_per_second: 256.664266}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026316612, iterations_per_second: 37.998812}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047970810, iterations_per_second: 20.846010}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001181, iterations_per_second: 846883.468070}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001202789, iterations_per_second: 831.401249}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028519112, iterations_per_second: 35.064205}
  generation:
