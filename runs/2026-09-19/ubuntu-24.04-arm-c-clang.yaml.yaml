    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005993, iterations_per_second: 166852.985787}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002981844, iterations_per_second: 335.362912}
