    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001720035, iterations_per_second: 581.383518}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003906810, iterations_per_second: 255.963283}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026460573, iterations_per_second: 37.792077}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048016634, iterations_per_second: 20.826116}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001168, iterations_per_second: 856237.690803}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001196724, iterations_per_second: 835.614328}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028465239, iterations_per_second: 35.130567}
  generation:
