platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003107, iterations_per_second: 321905.681323}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003999, iterations_per_second: 250043.757826}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001716843, iterations_per_second: 582.464555}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003914637, iterations_per_second: 255.451527}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026808085, iterations_per_second: 37.302180}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047977875, iterations_per_second: 20.842941}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001204, iterations_per_second: 830495.806627}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001205171, iterations_per_second: 829.757998}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029243972, iterations_per_second: 34.195081}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004391, iterations_per_second: 227722.998267}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005988, iterations_per_second: 166997.879210}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002992890, iterations_per_second: 334.125247}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005511946, iterations_per_second: 181.424140}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043371730, iterations_per_second: 23.056493}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068759065, iterations_per_second: 14.543537}
