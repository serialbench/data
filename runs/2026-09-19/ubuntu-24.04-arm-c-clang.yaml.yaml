    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005989, iterations_per_second: 166972.783389}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003003649, iterations_per_second: 332.928381}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005509521, iterations_per_second: 181.503993}
