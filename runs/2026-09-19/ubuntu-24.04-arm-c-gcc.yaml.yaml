platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003105, iterations_per_second: 322019.708445}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004013, iterations_per_second: 249165.296507}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001719497, iterations_per_second: 581.565423}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003922503, iterations_per_second: 254.939257}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026731481, iterations_per_second: 37.409076}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047878913, iterations_per_second: 20.886021}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001205, iterations_per_second: 829531.317801}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001150412, iterations_per_second: 869.253798}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029049310, iterations_per_second: 34.424226}
  xslt:
