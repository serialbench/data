platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003081, iterations_per_second: 324580.479636}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003956, iterations_per_second: 252774.196666}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001731357, iterations_per_second: 577.581631}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003914889, iterations_per_second: 255.435106}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026040918, iterations_per_second: 38.401104}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047867452, iterations_per_second: 20.891022}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001190, iterations_per_second: 840618.696100}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001170040, iterations_per_second: 854.671392}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026936554, iterations_per_second: 37.124274}
  xslt:
