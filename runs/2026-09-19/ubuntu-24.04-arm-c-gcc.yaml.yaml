platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004309, iterations_per_second: 232056.250500}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003903195, iterations_per_second: 256.200347}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047821699, iterations_per_second: 20.911009}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001189, iterations_per_second: 841184.388406}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001160575, iterations_per_second: 861.642106}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.033612998, iterations_per_second: 29.750396}
  xslt:
