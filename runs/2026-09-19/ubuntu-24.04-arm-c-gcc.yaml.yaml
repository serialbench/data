platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003102, iterations_per_second: 322351.878998}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004121, iterations_per_second: 242677.215817}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001734806, iterations_per_second: 576.433330}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003965656, iterations_per_second: 252.165068}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.027345157, iterations_per_second: 36.569547}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048531390, iterations_per_second: 20.605221}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001170, iterations_per_second: 854993.159953}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001180806, iterations_per_second: 846.878927}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026687063, iterations_per_second: 37.471340}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004437, iterations_per_second: 225397.827756}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006090, iterations_per_second: 164198.220471}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003014211, iterations_per_second: 331.761741}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005585278, iterations_per_second: 179.042128}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.042918996, iterations_per_second: 23.299706}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.069207227, iterations_per_second: 14.449358}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001428, iterations_per_second: 700280.114036}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001453132, iterations_per_second: 688.168886}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.030688009, iterations_per_second: 32.586018}
  xpath:
  xslt:
