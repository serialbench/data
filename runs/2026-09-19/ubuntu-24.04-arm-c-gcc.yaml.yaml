platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003215, iterations_per_second: 311090.371422}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004021, iterations_per_second: 248694.354584}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001744100, iterations_per_second: 573.361619}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003929632, iterations_per_second: 254.476755}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025718121, iterations_per_second: 38.883089}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047908543, iterations_per_second: 20.873104}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001171, iterations_per_second: 853825.136414}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001175704, iterations_per_second: 850.553980}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026301138, iterations_per_second: 38.021169}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004333, iterations_per_second: 230792.309733}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006121, iterations_per_second: 163371.998006}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002988303, iterations_per_second: 334.638125}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005510709, iterations_per_second: 181.464864}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.042363793, iterations_per_second: 23.605063}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068819344, iterations_per_second: 14.530798}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001411, iterations_per_second: 708968.448494}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001454230, iterations_per_second: 687.649134}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.030417085, iterations_per_second: 32.876260}
  xpath:
  xslt:
