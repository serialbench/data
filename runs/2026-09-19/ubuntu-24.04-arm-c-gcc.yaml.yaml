platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003071, iterations_per_second: 325595.024897}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003998, iterations_per_second: 250143.832881}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001741147, iterations_per_second: 574.334155}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003929106, iterations_per_second: 254.510801}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026384496, iterations_per_second: 37.901046}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048012382, iterations_per_second: 20.827961}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001745, iterations_per_second: 573131.589338}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001181466, iterations_per_second: 846.405836}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028918522, iterations_per_second: 34.579914}
  xslt:
