platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003117, iterations_per_second: 320831.594804}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003991, iterations_per_second: 250538.658749}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001739428, iterations_per_second: 574.901634}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003937989, iterations_per_second: 253.936696}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.027510314, iterations_per_second: 36.350003}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047988617, iterations_per_second: 20.838275}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.335437}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001180840, iterations_per_second: 846.855020}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029098823, iterations_per_second: 34.365651}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004353, iterations_per_second: 229731.903568}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006054, iterations_per_second: 165185.503127}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002987673, iterations_per_second: 334.708689}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005501624, iterations_per_second: 181.764501}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043576634, iterations_per_second: 22.948078}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068783017, iterations_per_second: 14.538472}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001394, iterations_per_second: 717514.532306}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001459473, iterations_per_second: 685.178672}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032628989, iterations_per_second: 30.647594}
  xpath:
  xslt:
