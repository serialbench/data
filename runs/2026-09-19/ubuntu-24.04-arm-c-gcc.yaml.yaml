platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003190, iterations_per_second: 313469.797187}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003985, iterations_per_second: 250928.435207}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001714755, iterations_per_second: 583.173576}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003904824, iterations_per_second: 256.093488}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026453610, iterations_per_second: 37.802024}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047718576, iterations_per_second: 20.956200}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001201, iterations_per_second: 832847.505958}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001168408, iterations_per_second: 855.865173}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027198382, iterations_per_second: 36.766893}
  xslt:
