platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003065, iterations_per_second: 326274.919293}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004104, iterations_per_second: 243658.780058}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001726821, iterations_per_second: 579.098818}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003930133, iterations_per_second: 254.444294}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026429426, iterations_per_second: 37.836614}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048161519, iterations_per_second: 20.763465}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001226, iterations_per_second: 815926.893557}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001170403, iterations_per_second: 854.406559}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028364534, iterations_per_second: 35.255295}
  xslt:
