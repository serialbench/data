platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003111, iterations_per_second: 321440.051337}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004010, iterations_per_second: 249370.339739}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001719834, iterations_per_second: 581.451353}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003956396, iterations_per_second: 252.755307}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025657245, iterations_per_second: 38.975346}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048067210, iterations_per_second: 20.804203}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001203, iterations_per_second: 831117.019260}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001160324, iterations_per_second: 861.828496}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.025943924, iterations_per_second: 38.544670}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004388, iterations_per_second: 227868.292292}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006033, iterations_per_second: 165749.519238}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002984437, iterations_per_second: 335.071573}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005538417, iterations_per_second: 180.557008}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.042473029, iterations_per_second: 23.544353}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068667002, iterations_per_second: 14.563036}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001442, iterations_per_second: 693721.817087}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001432782, iterations_per_second: 697.942883}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029301614, iterations_per_second: 34.127813}
  xpath:
  xslt:
