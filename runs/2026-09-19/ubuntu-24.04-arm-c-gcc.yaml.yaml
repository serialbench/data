platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003080, iterations_per_second: 324664.783823}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004035, iterations_per_second: 247856.045261}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001750053, iterations_per_second: 571.411157}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003932838, iterations_per_second: 254.269287}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025879518, iterations_per_second: 38.640596}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048142559, iterations_per_second: 20.771642}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001219, iterations_per_second: 820209.974723}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001175411, iterations_per_second: 850.766243}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.025935729, iterations_per_second: 38.556850}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004380, iterations_per_second: 228300.077657}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006005, iterations_per_second: 166527.893417}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002997350, iterations_per_second: 333.628001}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005519244, iterations_per_second: 181.184235}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.042710871, iterations_per_second: 23.413243}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068621007, iterations_per_second: 14.572797}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001451, iterations_per_second: 689037.414901}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001452320, iterations_per_second: 688.553645}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029451346, iterations_per_second: 33.954306}
  xpath:
  xslt:
