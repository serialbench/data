platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003135, iterations_per_second: 318979.266343}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004029, iterations_per_second: 248182.066290}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001745084, iterations_per_second: 573.038208}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003922930, iterations_per_second: 254.911486}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026566654, iterations_per_second: 37.641172}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048169855, iterations_per_second: 20.759872}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001739, iterations_per_second: 575010.062673}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001162796, iterations_per_second: 859.996325}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029122484, iterations_per_second: 34.337730}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004381, iterations_per_second: 228242.759047}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005981, iterations_per_second: 167210.099472}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002993813, iterations_per_second: 334.022161}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005523728, iterations_per_second: 181.037166}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043292931, iterations_per_second: 23.098459}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068940628, iterations_per_second: 14.505235}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001428, iterations_per_second: 700280.111248}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001444242, iterations_per_second: 692.404895}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032914092, iterations_per_second: 30.382123}
  xpath:
