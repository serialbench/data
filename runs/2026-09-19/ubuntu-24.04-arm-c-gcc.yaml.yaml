platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003085, iterations_per_second: 324107.085109}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004003, iterations_per_second: 249818.881372}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001749560, iterations_per_second: 571.572281}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003925610, iterations_per_second: 254.737459}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026483409, iterations_per_second: 37.759489}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048115795, iterations_per_second: 20.783196}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001167, iterations_per_second: 856824.609356}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001163580, iterations_per_second: 859.416874}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029310705, iterations_per_second: 34.117228}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004318, iterations_per_second: 231583.335136}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005990, iterations_per_second: 166942.121206}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002995415, iterations_per_second: 333.843558}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005530048, iterations_per_second: 180.830268}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043465658, iterations_per_second: 23.006669}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068682683, iterations_per_second: 14.559711}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001413, iterations_per_second: 707814.270776}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001428815, iterations_per_second: 699.880507}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.034053141, iterations_per_second: 29.365867}
  xpath:
  xslt:
