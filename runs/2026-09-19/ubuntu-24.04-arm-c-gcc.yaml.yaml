platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003092, iterations_per_second: 323404.806199}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004023, iterations_per_second: 248552.182521}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001720034, iterations_per_second: 581.383744}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003913030, iterations_per_second: 255.556436}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026157550, iterations_per_second: 38.229880}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047737035, iterations_per_second: 20.948096}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001217, iterations_per_second: 821760.210273}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001174160, iterations_per_second: 851.672927}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027347939, iterations_per_second: 36.565827}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004317, iterations_per_second: 231647.709965}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006013, iterations_per_second: 166309.101258}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003014419, iterations_per_second: 331.738922}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005507613, iterations_per_second: 181.566849}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043070768, iterations_per_second: 23.217603}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068442131, iterations_per_second: 14.610883}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001475, iterations_per_second: 677874.187928}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001433601, iterations_per_second: 697.544318}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.030407448, iterations_per_second: 32.886680}
  xpath:
  xslt:
