platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003076, iterations_per_second: 325118.668527}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004005, iterations_per_second: 249662.955657}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001745885, iterations_per_second: 572.775521}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003931336, iterations_per_second: 254.366476}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025951360, iterations_per_second: 38.533626}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047995230, iterations_per_second: 20.835404}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001233, iterations_per_second: 810701.259792}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001204078, iterations_per_second: 830.510750}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.025451595, iterations_per_second: 39.290268}
  xslt:
