platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004989, iterations_per_second: 200444.987889}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004035, iterations_per_second: 247806.908904}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001734643, iterations_per_second: 576.487385}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003928855, iterations_per_second: 254.527082}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026297522, iterations_per_second: 38.026397}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047960071, iterations_per_second: 20.850678}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001174, iterations_per_second: 851426.139160}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001176007, iterations_per_second: 850.334834}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027415825, iterations_per_second: 36.475284}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004447, iterations_per_second: 224895.985597}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006078, iterations_per_second: 164533.219243}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002985501, iterations_per_second: 334.952120}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005509807, iterations_per_second: 181.494561}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043516120, iterations_per_second: 22.979990}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068735715, iterations_per_second: 14.548477}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001407, iterations_per_second: 710631.040413}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001458367, iterations_per_second: 685.698613}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032850508, iterations_per_second: 30.440930}
  xpath:
  xslt:
