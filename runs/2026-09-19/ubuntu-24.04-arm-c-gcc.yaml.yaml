platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004024, iterations_per_second: 248521.298295}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003962, iterations_per_second: 252385.038416}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001729533, iterations_per_second: 578.190760}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003926660, iterations_per_second: 254.669384}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026018421, iterations_per_second: 38.434308}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047880621, iterations_per_second: 20.885276}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001157, iterations_per_second: 863930.891741}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001156726, iterations_per_second: 864.509217}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027051983, iterations_per_second: 36.965867}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004340, iterations_per_second: 230425.365211}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006096, iterations_per_second: 164028.540996}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002978723, iterations_per_second: 335.714331}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005509694, iterations_per_second: 181.498294}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.042970200, iterations_per_second: 23.271942}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068625593, iterations_per_second: 14.571823}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714336.739602}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001429023, iterations_per_second: 699.778637}
