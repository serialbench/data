platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003126, iterations_per_second: 319866.935533}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004020, iterations_per_second: 248768.595492}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001730821, iterations_per_second: 577.760385}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003933530, iterations_per_second: 254.224577}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026212907, iterations_per_second: 38.149145}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048040583, iterations_per_second: 20.815734}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001190, iterations_per_second: 840689.365273}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001162855, iterations_per_second: 859.952691}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.026638755, iterations_per_second: 37.539292}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004433, iterations_per_second: 225601.227301}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006116, iterations_per_second: 163494.866295}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002981428, iterations_per_second: 335.409706}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005517107, iterations_per_second: 181.254426}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043222936, iterations_per_second: 23.135865}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068561815, iterations_per_second: 14.585378}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001414, iterations_per_second: 707063.564236}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001443676, iterations_per_second: 692.676356}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.030948142, iterations_per_second: 32.312117}
  xpath:
  xslt:
