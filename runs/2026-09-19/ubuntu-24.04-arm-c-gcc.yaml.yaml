platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003147, iterations_per_second: 317762.949023}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004058, iterations_per_second: 246414.666620}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001726439, iterations_per_second: 579.226840}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003935224, iterations_per_second: 254.115162}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026577241, iterations_per_second: 37.626178}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048269013, iterations_per_second: 20.717225}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001171, iterations_per_second: 853898.045677}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001160898, iterations_per_second: 861.401874}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028245289, iterations_per_second: 35.404134}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004451, iterations_per_second: 224668.613891}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006084, iterations_per_second: 164354.743230}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002974811, iterations_per_second: 336.155847}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005543883, iterations_per_second: 180.378998}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043426677, iterations_per_second: 23.027320}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.069021186, iterations_per_second: 14.488305}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001432, iterations_per_second: 698372.791313}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001430327, iterations_per_second: 699.140826}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032092173, iterations_per_second: 31.160246}
  xpath:
  xslt:
