platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003089, iterations_per_second: 323739.841903}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003992, iterations_per_second: 250494.726758}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001725270, iterations_per_second: 579.619310}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003949433, iterations_per_second: 253.200924}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026345380, iterations_per_second: 37.957319}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048036138, iterations_per_second: 20.817660}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001186, iterations_per_second: 842886.038701}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001168490, iterations_per_second: 855.805356}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027188484, iterations_per_second: 36.780278}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004351, iterations_per_second: 229811.096341}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006073, iterations_per_second: 164663.264008}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002990766, iterations_per_second: 334.362464}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005514305, iterations_per_second: 181.346505}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043185971, iterations_per_second: 23.155668}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068607438, iterations_per_second: 14.575679}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002206, iterations_per_second: 453370.811498}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001438055, iterations_per_second: 695.383857}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031671941, iterations_per_second: 31.573689}
  xpath:
  xslt:
