platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003102, iterations_per_second: 322403.843373}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004087, iterations_per_second: 244702.197729}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001732796, iterations_per_second: 577.101979}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003923773, iterations_per_second: 254.856741}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026016539, iterations_per_second: 38.437088}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048002941, iterations_per_second: 20.832057}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001204, iterations_per_second: 830564.783954}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001190119, iterations_per_second: 840.252109}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.025801029, iterations_per_second: 38.758144}
  xslt:
