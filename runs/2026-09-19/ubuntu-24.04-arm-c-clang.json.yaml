platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: json-c, format: json, version: '0.17', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002746, iterations_per_second: 364205.849313}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003421243, iterations_per_second: 292.291427}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.046480178, iterations_per_second: 21.514548}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002665, iterations_per_second: 375262.683648}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002394534, iterations_per_second: 417.617733}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.044334977, iterations_per_second: 22.555555}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002038, iterations_per_second: 490773.458754}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002405100, iterations_per_second: 415.783128}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.029941682, iterations_per_second: 33.398257}
