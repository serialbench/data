platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: json-c, format: json, version: '0.17', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000921, iterations_per_second: 1086012.163986}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002386, iterations_per_second: 419164.186574}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001169264, iterations_per_second: 855.239095}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003414154, iterations_per_second: 292.898357}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.008175223, iterations_per_second: 122.320822}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.044812883, iterations_per_second: 22.315012}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002566, iterations_per_second: 389635.690914}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002444138, iterations_per_second: 409.142145}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.040274117, iterations_per_second: 24.829843}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002066, iterations_per_second: 483909.992885}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002340047, iterations_per_second: 427.341783}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.028701250, iterations_per_second: 34.841688}
