platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
    - {name: json-c, format: json, version: '0.17', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000880, iterations_per_second: 1136492.790648}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002417, iterations_per_second: 413650.466936}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001187987, iterations_per_second: 841.760289}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003388904, iterations_per_second: 295.080680}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.008151605, iterations_per_second: 122.675228}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.044431642, iterations_per_second: 22.506483}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002653, iterations_per_second: 376974.402792}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002539049, iterations_per_second: 393.848196}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.040539781, iterations_per_second: 24.667129}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002020, iterations_per_second: 495074.016228}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002362084, iterations_per_second: 423.355029}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.028425952, iterations_per_second: 35.179121}
