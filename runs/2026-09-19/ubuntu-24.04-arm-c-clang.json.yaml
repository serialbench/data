platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: json-c, format: json, version: '0.17', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002781, iterations_per_second: 359518.246157}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003424341, iterations_per_second: 292.026991}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.045295974, iterations_per_second: 22.077017}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000005215, iterations_per_second: 191758.231228}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002482782, iterations_per_second: 402.774039}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.035742118, iterations_per_second: 27.978196}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002077, iterations_per_second: 481533.201166}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002393368, iterations_per_second: 417.821188}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.028624169, iterations_per_second: 34.935512}
