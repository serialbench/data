platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: json-c, format: json, version: '0.17', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000922, iterations_per_second: 1084128.388014}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002443, iterations_per_second: 409332.788571}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001195491, iterations_per_second: 836.476393}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003416972, iterations_per_second: 292.656773}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.008273563, iterations_per_second: 120.866911}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.042655950, iterations_per_second: 23.443388}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002760, iterations_per_second: 362345.096317}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002462460, iterations_per_second: 406.097912}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.030134468, iterations_per_second: 33.184591}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002071, iterations_per_second: 482835.204588}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002353763, iterations_per_second: 424.851610}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.028554194, iterations_per_second: 35.021125}
