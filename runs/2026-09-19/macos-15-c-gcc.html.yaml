platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 499999.999841}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001683000, iterations_per_second: 594.177065}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005206333, iterations_per_second: 192.073756}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001057000, iterations_per_second: 946.073794}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019482000, iterations_per_second: 51.329432}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037738000, iterations_per_second: 26.498490}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013613000, iterations_per_second: 73.459193}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384746}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005000, iterations_per_second: 200000.000050}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002506000, iterations_per_second: 399.042298}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001469333, iterations_per_second: 680.580762}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025959000, iterations_per_second: 38.522285}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019229000, iterations_per_second: 52.004784}
  xpath:
  xslt:
