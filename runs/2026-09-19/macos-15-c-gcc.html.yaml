platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.666238}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007200, iterations_per_second: 138888.888911}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894811}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001643667, iterations_per_second: 608.395863}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004270000, iterations_per_second: 234.192037}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001202333, iterations_per_second: 831.716108}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023428000, iterations_per_second: 42.683968}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.046098000, iterations_per_second: 21.692915}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018914000, iterations_per_second: 52.870889}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000008700, iterations_per_second: 114942.528725}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.727259}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001858667, iterations_per_second: 538.020086}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002207000, iterations_per_second: 453.103761}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.024258000, iterations_per_second: 41.223514}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.020533000, iterations_per_second: 48.702089}
  xpath:
  xslt:
