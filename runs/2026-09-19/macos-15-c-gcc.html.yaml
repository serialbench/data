platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005700, iterations_per_second: 175438.596584}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000011700, iterations_per_second: 85470.085437}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000011200, iterations_per_second: 89285.714330}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003473667, iterations_per_second: 287.880242}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004242333, iterations_per_second: 235.719337}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000971667, iterations_per_second: 1029.159520}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.015821000, iterations_per_second: 63.207130}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.030370000, iterations_per_second: 32.927231}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010970000, iterations_per_second: 91.157703}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006700, iterations_per_second: 149253.731467}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000012600, iterations_per_second: 79365.079279}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001747333, iterations_per_second: 572.300649}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001285000, iterations_per_second: 778.210117}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.017118000, iterations_per_second: 58.418039}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013177000, iterations_per_second: 75.889808}
  xpath:
  xslt:
