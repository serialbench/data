platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384746}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004600, iterations_per_second: 217391.304359}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270122}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001796667, iterations_per_second: 556.586271}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.007075000, iterations_per_second: 141.342756}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002093333, iterations_per_second: 477.707006}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023634000, iterations_per_second: 42.311924}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.049916000, iterations_per_second: 20.033657}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015596000, iterations_per_second: 64.119005}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608719}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.727259}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002802000, iterations_per_second: 356.887937}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002902333, iterations_per_second: 344.550362}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.032033000, iterations_per_second: 31.217807}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.016880000, iterations_per_second: 59.241706}
  xpath:
  xslt:
