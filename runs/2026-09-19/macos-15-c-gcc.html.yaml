platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005500, iterations_per_second: 181818.181150}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000011700, iterations_per_second: 85470.085603}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010000, iterations_per_second: 100000.000025}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003592333, iterations_per_second: 278.370604}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005207333, iterations_per_second: 192.036871}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001008667, iterations_per_second: 991.407799}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.035437000, iterations_per_second: 28.219093}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.060906000, iterations_per_second: 16.418744}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009915000, iterations_per_second: 100.857287}
  xslt:
