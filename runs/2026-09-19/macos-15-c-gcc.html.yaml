platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000007200, iterations_per_second: 138888.888801}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000013500, iterations_per_second: 74074.074074}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000013000, iterations_per_second: 76923.076983}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003114000, iterations_per_second: 321.130379}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004268333, iterations_per_second: 234.283483}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001000000, iterations_per_second: 1000.000000}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.016334000, iterations_per_second: 61.221991}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.032088000, iterations_per_second: 31.164298}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009489000, iterations_per_second: 105.385183}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000008200, iterations_per_second: 121951.219482}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000014300, iterations_per_second: 69930.069829}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001873000, iterations_per_second: 533.902830}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001290333, iterations_per_second: 774.993542}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.017983000, iterations_per_second: 55.608074}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012998000, iterations_per_second: 76.934913}
  xpath:
  xslt:
