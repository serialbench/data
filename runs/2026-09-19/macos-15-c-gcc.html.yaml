platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005800, iterations_per_second: 172413.792863}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000011000, iterations_per_second: 90909.090951}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270122}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001874000, iterations_per_second: 533.617930}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003504333, iterations_per_second: 285.360982}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001118667, iterations_per_second: 893.921335}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020192000, iterations_per_second: 49.524564}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.058271000, iterations_per_second: 17.161195}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013586000, iterations_per_second: 73.605182}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006300, iterations_per_second: 158730.158844}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004600, iterations_per_second: 217391.303822}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001832000, iterations_per_second: 545.851528}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001593667, iterations_per_second: 627.483790}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023645000, iterations_per_second: 42.292239}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.021803000, iterations_per_second: 45.865248}
  xpath:
  xslt:
