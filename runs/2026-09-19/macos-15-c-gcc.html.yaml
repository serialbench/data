platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454545.454519}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004800, iterations_per_second: 208333.333366}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004100, iterations_per_second: 243902.438964}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001803000, iterations_per_second: 554.631170}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004170000, iterations_per_second: 239.808153}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001002667, iterations_per_second: 997.340426}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.045363000, iterations_per_second: 22.044397}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.072675000, iterations_per_second: 13.759890}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011019000, iterations_per_second: 90.752337}
  xslt:
