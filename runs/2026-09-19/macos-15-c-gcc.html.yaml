platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370526}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.777602}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002448000, iterations_per_second: 408.496732}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004631000, iterations_per_second: 215.936083}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001860667, iterations_per_second: 537.441777}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.032680000, iterations_per_second: 30.599755}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.059345000, iterations_per_second: 16.850619}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.016723000, iterations_per_second: 59.797883}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.666732}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004600, iterations_per_second: 217391.304091}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002629667, iterations_per_second: 380.276334}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002659000, iterations_per_second: 376.081234}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023286000, iterations_per_second: 42.944258}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.022443000, iterations_per_second: 44.557323}
