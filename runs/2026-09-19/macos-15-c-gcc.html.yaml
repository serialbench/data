platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005600, iterations_per_second: 178571.428660}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000010800, iterations_per_second: 92592.592534}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000014100, iterations_per_second: 70921.985823}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001564000, iterations_per_second: 639.386189}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003180667, iterations_per_second: 314.399497}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001037333, iterations_per_second: 964.010283}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.017992000, iterations_per_second: 55.580258}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.035092000, iterations_per_second: 28.496523}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010730000, iterations_per_second: 93.196645}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000010400, iterations_per_second: 96153.846186}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000015900, iterations_per_second: 62893.081740}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001705000, iterations_per_second: 586.510264}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001396333, iterations_per_second: 716.161375}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022827000, iterations_per_second: 43.807771}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015934000, iterations_per_second: 62.758880}
  xpath:
  xslt:
