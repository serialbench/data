    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.777602}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001630333, iterations_per_second: 613.371499}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003479333, iterations_per_second: 287.411381}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001088000, iterations_per_second: 919.117647}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020551000, iterations_per_second: 48.659433}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.039772000, iterations_per_second: 25.143317}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013110000, iterations_per_second: 76.277651}
  generation:
