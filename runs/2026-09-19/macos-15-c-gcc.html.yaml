platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001900, iterations_per_second: 526315.790803}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.895401}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285508}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001597667, iterations_per_second: 625.912789}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003173000, iterations_per_second: 315.159155}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001034000, iterations_per_second: 967.117988}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018208000, iterations_per_second: 54.920914}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.035296000, iterations_per_second: 28.331822}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010613000, iterations_per_second: 94.224065}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.587078}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.727259}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001765333, iterations_per_second: 566.465257}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001397333, iterations_per_second: 715.648855}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019324000, iterations_per_second: 51.749120}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014262000, iterations_per_second: 70.116393}
