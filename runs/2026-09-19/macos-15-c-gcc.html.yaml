    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007700, iterations_per_second: 129870.129815}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001887000, iterations_per_second: 529.941706}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001582667, iterations_per_second: 631.844987}
