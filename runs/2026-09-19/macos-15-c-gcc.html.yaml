platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.586402}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005800, iterations_per_second: 172413.793201}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005400, iterations_per_second: 185185.185068}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001963000, iterations_per_second: 509.424350}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003107667, iterations_per_second: 321.784833}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000979000, iterations_per_second: 1021.450460}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.017925000, iterations_per_second: 55.788006}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037280000, iterations_per_second: 26.824034}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012110000, iterations_per_second: 82.576383}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285508}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006600, iterations_per_second: 151515.151506}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001637667, iterations_per_second: 610.624873}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001394333, iterations_per_second: 717.188621}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020979000, iterations_per_second: 47.666714}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.024717000, iterations_per_second: 40.457984}
  xpath:
  xslt:
