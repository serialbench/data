platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 500000.001262}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.257058}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.777602}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001951667, iterations_per_second: 512.382579}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004017667, iterations_per_second: 248.900689}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001066000, iterations_per_second: 938.086304}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025232000, iterations_per_second: 39.632213}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.041078000, iterations_per_second: 24.343931}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012777000, iterations_per_second: 78.265634}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.607644}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008000, iterations_per_second: 124999.999960}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002949667, iterations_per_second: 339.021358}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001466333, iterations_per_second: 681.973176}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.033892000, iterations_per_second: 29.505488}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019690000, iterations_per_second: 50.787202}
  xpath:
  xslt:
