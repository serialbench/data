platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001900, iterations_per_second: 526315.789228}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238052}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000091333, iterations_per_second: 10948.905110}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000505333, iterations_per_second: 1978.891821}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001523000, iterations_per_second: 656.598818}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005692000, iterations_per_second: 175.685172}
  xslt:
