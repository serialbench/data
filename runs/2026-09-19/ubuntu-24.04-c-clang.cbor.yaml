platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000683, iterations_per_second: 1463486.038823}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000786, iterations_per_second: 1273074.469135}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000529518, iterations_per_second: 1888.508739}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001321977, iterations_per_second: 756.442622}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.009936951, iterations_per_second: 100.634490}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.026865696, iterations_per_second: 37.222188}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000310, iterations_per_second: 3225806.376947}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000288544, iterations_per_second: 3465.679949}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003627232, iterations_per_second: 275.692319}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001322, iterations_per_second: 756372.443295}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001110, iterations_per_second: 900819.742643}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001614601, iterations_per_second: 619.347934}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001625964, iterations_per_second: 615.019641}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.016778399, iterations_per_second: 59.600442}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033176430, iterations_per_second: 30.141881}
  xpath:
  xslt:
