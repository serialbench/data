platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001225, iterations_per_second: 816126.665138}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001211, iterations_per_second: 825627.478316}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000751130, iterations_per_second: 1331.327467}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002020863, iterations_per_second: 494.838096}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013374686, iterations_per_second: 74.768110}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.039016559, iterations_per_second: 25.630143}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000423, iterations_per_second: 2365184.471536}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000432328, iterations_per_second: 2313.056820}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005451453, iterations_per_second: 183.437333}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002068, iterations_per_second: 483582.378541}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001704, iterations_per_second: 586785.589659}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002699170, iterations_per_second: 370.484260}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002511555, iterations_per_second: 398.159759}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.024348195, iterations_per_second: 41.070806}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.049893546, iterations_per_second: 20.042672}
  xpath:
