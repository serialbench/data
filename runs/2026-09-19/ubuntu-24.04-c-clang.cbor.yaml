platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001167, iterations_per_second: 856751.199495}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001183, iterations_per_second: 845165.651565}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000749961, iterations_per_second: 1333.402670}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002020097, iterations_per_second: 495.025816}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013592290, iterations_per_second: 73.571120}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040996289, iterations_per_second: 24.392452}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000421, iterations_per_second: 2376425.851497}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000446504, iterations_per_second: 2239.623266}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005464409, iterations_per_second: 183.002407}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002061, iterations_per_second: 485224.901995}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001702, iterations_per_second: 587475.032994}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002656372, iterations_per_second: 376.453298}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002532938, iterations_per_second: 394.798451}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.025060231, iterations_per_second: 39.903862}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.050208017, iterations_per_second: 19.917138}
