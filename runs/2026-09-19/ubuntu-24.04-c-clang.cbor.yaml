platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001306, iterations_per_second: 765814.059906}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001102, iterations_per_second: 907441.017314}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000700708, iterations_per_second: 1427.127312}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001935724, iterations_per_second: 516.602485}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015099735, iterations_per_second: 66.226328}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.049836617, iterations_per_second: 20.065567}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000405, iterations_per_second: 2467308.168106}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000350445, iterations_per_second: 2853.512103}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004431824, iterations_per_second: 225.640729}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002138, iterations_per_second: 467704.972096}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001542, iterations_per_second: 648424.329304}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002124112, iterations_per_second: 470.784894}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002433992, iterations_per_second: 410.847638}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.024867062, iterations_per_second: 40.213838}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.063212747, iterations_per_second: 15.819594}
  xpath:
  xslt:
