platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001260, iterations_per_second: 793461.873147}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001231, iterations_per_second: 812149.759534}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000754305, iterations_per_second: 1325.723094}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002025623, iterations_per_second: 493.675279}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014335482, iterations_per_second: 69.756985}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.038886873, iterations_per_second: 25.715619}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000423, iterations_per_second: 2365184.471536}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000429713, iterations_per_second: 2327.136428}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005408280, iterations_per_second: 184.901669}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002120, iterations_per_second: 471720.364112}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001723, iterations_per_second: 580315.691578}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002668470, iterations_per_second: 374.746531}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002534233, iterations_per_second: 394.596708}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.025515551, iterations_per_second: 39.191785}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.045728170, iterations_per_second: 21.868358}
  xpath:
  xslt:
