platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000843, iterations_per_second: 1185817.620551}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000922, iterations_per_second: 1084128.361290}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000571924, iterations_per_second: 1748.483045}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001626355, iterations_per_second: 614.871907}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010135468, iterations_per_second: 98.663426}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034274404, iterations_per_second: 29.176291}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000360, iterations_per_second: 2781641.160798}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000326329, iterations_per_second: 3064.395201}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004142428, iterations_per_second: 241.404317}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001489, iterations_per_second: 671501.477491}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001377, iterations_per_second: 726163.677346}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002175569, iterations_per_second: 459.649796}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002107325, iterations_per_second: 474.535177}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.018465938, iterations_per_second: 54.153761}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040325469, iterations_per_second: 24.798224}
  xpath:
  xslt:
