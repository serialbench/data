platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001206, iterations_per_second: 828981.183119}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001197, iterations_per_second: 835282.324727}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000800489, iterations_per_second: 1249.236404}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002056700, iterations_per_second: 486.215861}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014772282, iterations_per_second: 67.694348}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.041269496, iterations_per_second: 24.230972}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000420, iterations_per_second: 2382086.708423}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000435254, iterations_per_second: 2297.510800}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005413980, iterations_per_second: 184.706999}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002070, iterations_per_second: 483138.467813}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001715, iterations_per_second: 583022.388125}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002707644, iterations_per_second: 369.324725}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002603102, iterations_per_second: 384.157105}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.025891618, iterations_per_second: 38.622538}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.049090012, iterations_per_second: 20.370743}
  xpath:
