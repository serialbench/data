platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833472.244035}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001209, iterations_per_second: 827266.710418}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000755546, iterations_per_second: 1323.546151}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002081555, iterations_per_second: 480.410155}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014339114, iterations_per_second: 69.739316}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040387010, iterations_per_second: 24.760437}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000426, iterations_per_second: 2349624.054032}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000420765, iterations_per_second: 2376.625414}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005323748, iterations_per_second: 187.837591}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001987, iterations_per_second: 503296.592706}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001762, iterations_per_second: 567633.535871}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002801437, iterations_per_second: 356.959618}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002696394, iterations_per_second: 370.865682}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.025366578, iterations_per_second: 39.421951}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.050185386, iterations_per_second: 19.926120}
  xpath:
  xslt:
