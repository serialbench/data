platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001217, iterations_per_second: 821490.182113}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001241, iterations_per_second: 805671.931066}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000810956, iterations_per_second: 1233.113031}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002053877, iterations_per_second: 486.884152}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015309640, iterations_per_second: 65.318322}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.042445806, iterations_per_second: 23.559454}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000001730, iterations_per_second: 577967.864874}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000452450, iterations_per_second: 2210.187343}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005492132, iterations_per_second: 182.078654}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002123, iterations_per_second: 471031.558765}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000004746, iterations_per_second: 210708.190349}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002669281, iterations_per_second: 374.632673}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002599027, iterations_per_second: 384.759423}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.026180343, iterations_per_second: 38.196597}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.048317647, iterations_per_second: 20.696372}
  xpath:
  xslt:
