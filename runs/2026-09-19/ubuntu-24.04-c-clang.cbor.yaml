platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001193, iterations_per_second: 838082.468840}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001186, iterations_per_second: 843028.158590}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000787887, iterations_per_second: 1269.217003}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001997088, iterations_per_second: 500.729145}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013130781, iterations_per_second: 76.156932}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.037825544, iterations_per_second: 26.437161}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000419, iterations_per_second: 2387774.582865}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000430938, iterations_per_second: 2320.517630}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005415825, iterations_per_second: 184.644075}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002172, iterations_per_second: 460383.959706}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588200.693961}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002661003, iterations_per_second: 375.798195}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002559783, iterations_per_second: 390.658114}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.024240071, iterations_per_second: 41.254005}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.045581627, iterations_per_second: 21.938664}
  xpath:
  xslt:
