platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001185, iterations_per_second: 843739.453250}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001188, iterations_per_second: 841609.155016}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000790683, iterations_per_second: 1264.728821}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002034234, iterations_per_second: 491.585611}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014199176, iterations_per_second: 70.426622}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.038571576, iterations_per_second: 25.925827}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000428, iterations_per_second: 2337540.903798}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000439549, iterations_per_second: 2275.059208}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005458120, iterations_per_second: 183.213268}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002109, iterations_per_second: 474158.369121}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001689, iterations_per_second: 592031.259203}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002691458, iterations_per_second: 371.545831}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002590136, iterations_per_second: 386.080113}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.025114943, iterations_per_second: 39.816933}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.045946677, iterations_per_second: 21.764360}
  xpath:
  xslt:
