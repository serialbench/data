platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000608, iterations_per_second: 1644736.844413}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000637, iterations_per_second: 1569858.714158}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001190505, iterations_per_second: 839.979672}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001115181, iterations_per_second: 896.715153}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.008009479, iterations_per_second: 124.852066}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023839020, iterations_per_second: 41.948033}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000277, iterations_per_second: 3604902.674070}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000269120, iterations_per_second: 3715.819109}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003276700, iterations_per_second: 305.185095}
  xslt:
