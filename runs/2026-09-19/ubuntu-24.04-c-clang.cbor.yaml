platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001176, iterations_per_second: 850195.546021}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001209, iterations_per_second: 826993.053838}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000774837, iterations_per_second: 1290.594577}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001999442, iterations_per_second: 500.139539}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013718411, iterations_per_second: 72.894740}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.041756853, iterations_per_second: 23.948165}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000435, iterations_per_second: 2299908.001308}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000432033, iterations_per_second: 2314.639788}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005547218, iterations_per_second: 180.270543}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002053, iterations_per_second: 487139.516919}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001697, iterations_per_second: 589205.750739}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002655101, iterations_per_second: 376.633554}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002572904, iterations_per_second: 388.665881}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.025095282, iterations_per_second: 39.848128}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.049597984, iterations_per_second: 20.162110}
  xpath:
  xslt:
