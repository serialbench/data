platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000924, iterations_per_second: 1081782.776652}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000943, iterations_per_second: 1059995.760930}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000599141, iterations_per_second: 1669.055270}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001627057, iterations_per_second: 614.606744}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011210650, iterations_per_second: 89.200894}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032403776, iterations_per_second: 30.860601}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000354, iterations_per_second: 2820874.494944}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000326350, iterations_per_second: 3064.194883}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004139890, iterations_per_second: 241.552312}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001515, iterations_per_second: 659978.880540}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001398, iterations_per_second: 715307.581972}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002196264, iterations_per_second: 455.318668}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002086843, iterations_per_second: 479.192733}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.019521015, iterations_per_second: 51.226845}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.038983044, iterations_per_second: 25.652178}
  xpath:
  xslt:
