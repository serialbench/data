platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: json-c, format: json, version: '0.15', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000762, iterations_per_second: 1312163.756515}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002145, iterations_per_second: 466157.001709}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001817594, iterations_per_second: 550.177973}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.002874240, iterations_per_second: 347.918018}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.006960507, iterations_per_second: 143.667695}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.038958493, iterations_per_second: 25.668344}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002073, iterations_per_second: 482369.398997}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.001983265, iterations_per_second: 504.219053}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.044651838, iterations_per_second: 22.395495}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000001632, iterations_per_second: 612594.952194}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002028385, iterations_per_second: 493.003054}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.031067872, iterations_per_second: 32.187592}
