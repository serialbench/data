platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: json-c, format: json, version: '0.15', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000999, iterations_per_second: 1001101.210750}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002572, iterations_per_second: 388832.723896}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.002474213, iterations_per_second: 404.168976}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003869419, iterations_per_second: 258.436732}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.011311624, iterations_per_second: 88.404636}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.049034182, iterations_per_second: 20.393937}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002818, iterations_per_second: 354823.830176}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002549440, iterations_per_second: 392.243002}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.046045386, iterations_per_second: 21.717703}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002287, iterations_per_second: 437196.694678}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002824790, iterations_per_second: 354.008617}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.041738982, iterations_per_second: 23.958419}
    - {adapter: simdjson, format: json, data_size: small, time_per_iteration: 0.000000180, iterations_per_second: 5543237.272235}
    - {adapter: simdjson, format: json, data_size: medium, time_per_iteration: 0.000140155, iterations_per_second: 7134.957725}
