platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
    - {name: json-c, format: json, version: '0.15', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000976, iterations_per_second: 1024800.163499}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002603, iterations_per_second: 384201.628901}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.002431917, iterations_per_second: 411.198300}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003727681, iterations_per_second: 268.263322}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.011299359, iterations_per_second: 88.500595}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.052469933, iterations_per_second: 19.058534}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002907, iterations_per_second: 343949.920929}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002564104, iterations_per_second: 389.999782}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.043879502, iterations_per_second: 22.789684}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002298, iterations_per_second: 435104.207844}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002833888, iterations_per_second: 352.872055}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.041591842, iterations_per_second: 24.043177}
  xslt:
