platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: json-c, format: json, version: '0.15', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000999, iterations_per_second: 1001101.213598}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000005692, iterations_per_second: 175697.519310}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.002425862, iterations_per_second: 412.224546}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003712400, iterations_per_second: 269.367549}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.011506089, iterations_per_second: 86.910505}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.048004612, iterations_per_second: 20.831332}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002862, iterations_per_second: 349369.389052}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002514064, iterations_per_second: 397.762348}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.069580583, iterations_per_second: 14.371826}
