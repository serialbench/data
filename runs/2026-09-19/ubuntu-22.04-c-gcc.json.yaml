    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002561, iterations_per_second: 390518.217709}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.002465636, iterations_per_second: 405.574870}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003700273, iterations_per_second: 270.250355}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.011697246, iterations_per_second: 85.490209}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.048350746, iterations_per_second: 20.682204}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000003025, iterations_per_second: 330611.299850}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002547402, iterations_per_second: 392.556860}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.040588719, iterations_per_second: 24.637388}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002253, iterations_per_second: 443813.243334}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002704176, iterations_per_second: 369.798415}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.038038411, iterations_per_second: 26.289216}
