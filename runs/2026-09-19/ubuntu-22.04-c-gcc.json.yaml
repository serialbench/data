platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: json-c, format: json, version: '0.15', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002584, iterations_per_second: 387011.881011}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003837470, iterations_per_second: 260.588356}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.058389272, iterations_per_second: 17.126434}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000005074, iterations_per_second: 197067.633642}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002554237, iterations_per_second: 391.506348}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.053513481, iterations_per_second: 18.686880}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002274, iterations_per_second: 439715.064662}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002655839, iterations_per_second: 376.528801}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.043178714, iterations_per_second: 23.159560}
  xslt:
