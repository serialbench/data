    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.003751536, iterations_per_second: 266.557461}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.051959823, iterations_per_second: 19.245639}
