platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: json-c, format: json, version: '0.15', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000889, iterations_per_second: 1124859.392107}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002054, iterations_per_second: 486854.916362}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001209870, iterations_per_second: 826.534855}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.002913306, iterations_per_second: 343.252648}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.006418938, iterations_per_second: 155.789011}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.040026671, iterations_per_second: 24.983342}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002523, iterations_per_second: 396337.838451}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002010848, iterations_per_second: 497.302631}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.027117342, iterations_per_second: 36.876771}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000001755, iterations_per_second: 569768.104872}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.001846481, iterations_per_second: 541.570794}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.025655845, iterations_per_second: 38.977473}
    - {adapter: simdjson, format: json, data_size: small, time_per_iteration: 0.000000113, iterations_per_second: 8833922.528652}
    - {adapter: simdjson, format: json, data_size: medium, time_per_iteration: 0.000070261, iterations_per_second: 14232.714368}
    - {adapter: simdjson, format: json, data_size: large, time_per_iteration: 0.000889672, iterations_per_second: 1124.009747}
