platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: json-c, format: json, version: '0.17', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000970, iterations_per_second: 1031140.441381}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002674, iterations_per_second: 373971.578222}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.001662485, iterations_per_second: 601.509307}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003683584, iterations_per_second: 271.474738}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.008203295, iterations_per_second: 121.902236}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.045333908, iterations_per_second: 22.058544}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002910, iterations_per_second: 343583.576754}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002398366, iterations_per_second: 416.950540}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.033793464, iterations_per_second: 29.591521}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002045, iterations_per_second: 489021.467937}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002524410, iterations_per_second: 396.132218}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.031121567, iterations_per_second: 32.132058}
