    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.002610729, iterations_per_second: 383.034777}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.032739988, iterations_per_second: 30.543689}
