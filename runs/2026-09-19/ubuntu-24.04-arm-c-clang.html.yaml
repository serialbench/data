    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005039, iterations_per_second: 198456.013701}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001940765, iterations_per_second: 515.260823}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003771045, iterations_per_second: 265.178485}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001355847, iterations_per_second: 737.546164}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020161138, iterations_per_second: 49.600375}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037528177, iterations_per_second: 26.646645}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013501693, iterations_per_second: 74.064786}
  generation:
