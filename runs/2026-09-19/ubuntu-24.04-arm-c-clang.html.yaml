platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002138, iterations_per_second: 467617.489590}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004672, iterations_per_second: 214031.933660}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005044, iterations_per_second: 198247.492270}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001917650, iterations_per_second: 521.471593}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003645280, iterations_per_second: 274.327349}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001350224, iterations_per_second: 740.617670}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020383091, iterations_per_second: 49.060273}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037609725, iterations_per_second: 26.588868}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013540766, iterations_per_second: 73.851066}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002627, iterations_per_second: 380618.886264}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006282, iterations_per_second: 159190.041206}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002102486, iterations_per_second: 475.627424}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001783760, iterations_per_second: 560.613640}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021860560, iterations_per_second: 45.744482}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018045974, iterations_per_second: 55.414022}
  xpath:
  xslt:
