    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005060, iterations_per_second: 197640.176248}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001945337, iterations_per_second: 514.049663}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003800126, iterations_per_second: 263.149192}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001351183, iterations_per_second: 740.092018}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020136059, iterations_per_second: 49.662151}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037415989, iterations_per_second: 26.726542}
