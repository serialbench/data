platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002148, iterations_per_second: 465549.348519}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006594, iterations_per_second: 151657.617683}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005096, iterations_per_second: 196228.487797}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001939118, iterations_per_second: 515.698374}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003783377, iterations_per_second: 264.314107}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001352676, iterations_per_second: 739.275151}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020586475, iterations_per_second: 48.575582}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.038020520, iterations_per_second: 26.301587}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013765576, iterations_per_second: 72.644980}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002634, iterations_per_second: 379578.668776}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006238, iterations_per_second: 160312.930414}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002113370, iterations_per_second: 473.177910}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001781359, iterations_per_second: 561.369052}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022358103, iterations_per_second: 44.726514}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018462638, iterations_per_second: 54.163441}
  xpath:
  xslt:
