platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000004723, iterations_per_second: 211747.765968}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005034, iterations_per_second: 198657.078175}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.004656846, iterations_per_second: 214.737630}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001353245, iterations_per_second: 738.964489}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.089538238, iterations_per_second: 11.168413}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013561454, iterations_per_second: 73.738406}
  xslt:
