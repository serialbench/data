platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002059, iterations_per_second: 485649.069768}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004953, iterations_per_second: 201881.535920}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005118, iterations_per_second: 195381.188726}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001993819, iterations_per_second: 501.550040}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004633383, iterations_per_second: 215.825025}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001355823, iterations_per_second: 737.559401}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.069036967, iterations_per_second: 14.484993}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.096679256, iterations_per_second: 10.343481}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013704821, iterations_per_second: 72.967024}
  xslt:
