platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002107, iterations_per_second: 474608.447974}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004473, iterations_per_second: 223548.610170}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005071, iterations_per_second: 197207.541645}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001903475, iterations_per_second: 525.355035}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003649234, iterations_per_second: 274.030112}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001351858, iterations_per_second: 739.722846}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020409582, iterations_per_second: 48.996594}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.038430802, iterations_per_second: 26.020794}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013850223, iterations_per_second: 72.201004}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002591, iterations_per_second: 385936.475362}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006161, iterations_per_second: 162308.679002}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002075442, iterations_per_second: 481.825154}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001779013, iterations_per_second: 562.109334}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022443263, iterations_per_second: 44.556801}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018351006, iterations_per_second: 54.492925}
