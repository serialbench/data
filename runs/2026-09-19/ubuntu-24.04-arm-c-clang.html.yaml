platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002148, iterations_per_second: 465592.704265}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004746, iterations_per_second: 210699.310472}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004994, iterations_per_second: 200236.279548}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001904854, iterations_per_second: 524.974709}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003651864, iterations_per_second: 273.832760}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001362836, iterations_per_second: 733.764183}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020330968, iterations_per_second: 49.186050}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.038077243, iterations_per_second: 26.262406}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013648863, iterations_per_second: 73.266176}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002649, iterations_per_second: 377429.704727}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006306, iterations_per_second: 158579.131553}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002062833, iterations_per_second: 484.770295}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001796885, iterations_per_second: 556.518745}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021960869, iterations_per_second: 45.535539}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018112659, iterations_per_second: 55.210005}
