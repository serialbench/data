platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002111, iterations_per_second: 473641.831990}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004512, iterations_per_second: 221626.293746}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005137, iterations_per_second: 194666.147579}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001912652, iterations_per_second: 522.834173}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003630891, iterations_per_second: 275.414517}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001353699, iterations_per_second: 738.716475}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020510810, iterations_per_second: 48.754779}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037873781, iterations_per_second: 26.403490}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013612538, iterations_per_second: 73.461687}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002591, iterations_per_second: 385921.580551}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006268, iterations_per_second: 159535.432839}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002085932, iterations_per_second: 479.401936}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001781547, iterations_per_second: 561.309813}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021800497, iterations_per_second: 45.870514}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018265863, iterations_per_second: 54.746934}
