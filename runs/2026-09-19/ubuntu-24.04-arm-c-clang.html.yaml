platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000004931, iterations_per_second: 202802.734170}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005045, iterations_per_second: 198204.269878}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.004674307, iterations_per_second: 213.935456}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001355545, iterations_per_second: 737.710481}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.089195434, iterations_per_second: 11.211336}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013909301, iterations_per_second: 71.894339}
  xslt:
