platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002148, iterations_per_second: 465549.348519}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004649, iterations_per_second: 215100.021827}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005146, iterations_per_second: 194337.019535}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001925738, iterations_per_second: 519.281439}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003768020, iterations_per_second: 265.391373}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001352533, iterations_per_second: 739.353312}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020859577, iterations_per_second: 47.939611}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.038309545, iterations_per_second: 26.103155}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013740405, iterations_per_second: 72.778059}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002623, iterations_per_second: 381315.537794}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006209, iterations_per_second: 161056.530768}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002101674, iterations_per_second: 475.811187}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001787262, iterations_per_second: 559.515161}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022565852, iterations_per_second: 44.314746}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018269744, iterations_per_second: 54.735304}
  xpath:
  xslt:
