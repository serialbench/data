    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006296, iterations_per_second: 158820.913839}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002098715, iterations_per_second: 476.482038}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001788878, iterations_per_second: 559.009718}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021742252, iterations_per_second: 45.993396}
