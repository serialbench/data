platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002149, iterations_per_second: 465246.114996}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005026, iterations_per_second: 198961.421331}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005056, iterations_per_second: 197800.458822}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001921702, iterations_per_second: 520.371955}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004604416, iterations_per_second: 217.182825}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001349849, iterations_per_second: 740.823420}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020196129, iterations_per_second: 49.514439}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.046788634, iterations_per_second: 21.372712}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013578662, iterations_per_second: 73.644959}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002650, iterations_per_second: 377330.013274}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006244, iterations_per_second: 160164.007925}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002062424, iterations_per_second: 484.866430}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001780920, iterations_per_second: 561.507641}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021596100, iterations_per_second: 46.304657}
