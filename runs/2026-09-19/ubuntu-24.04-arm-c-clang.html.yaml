platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002156, iterations_per_second: 463821.892537}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004684, iterations_per_second: 213488.183431}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005139, iterations_per_second: 194579.028247}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001904115, iterations_per_second: 525.178456}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003662191, iterations_per_second: 273.060605}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001365294, iterations_per_second: 732.443154}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021132990, iterations_per_second: 47.319381}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.038282990, iterations_per_second: 26.121262}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013984964, iterations_per_second: 71.505368}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002627, iterations_per_second: 380633.374147}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006239, iterations_per_second: 160294.942677}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002086186, iterations_per_second: 479.343721}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001797597, iterations_per_second: 556.298111}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022630754, iterations_per_second: 44.187657}
