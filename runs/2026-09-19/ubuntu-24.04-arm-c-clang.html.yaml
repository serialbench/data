platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002169, iterations_per_second: 461126.993841}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005923, iterations_per_second: 168839.062612}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005085, iterations_per_second: 196676.172556}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001943358, iterations_per_second: 514.573228}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003656306, iterations_per_second: 273.500109}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001355923, iterations_per_second: 737.505006}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021210876, iterations_per_second: 47.145625}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.038737512, iterations_per_second: 25.814771}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013915088, iterations_per_second: 71.864440}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005001, iterations_per_second: 199948.013662}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006275, iterations_per_second: 159367.629235}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002103495, iterations_per_second: 475.399201}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001789668, iterations_per_second: 558.762750}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022168452, iterations_per_second: 45.109149}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018411865, iterations_per_second: 54.312803}
