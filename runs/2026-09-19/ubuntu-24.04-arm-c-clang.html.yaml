platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002148, iterations_per_second: 465527.676138}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004620, iterations_per_second: 216440.846616}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007140, iterations_per_second: 140052.099375}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001891590, iterations_per_second: 528.655694}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003657596, iterations_per_second: 273.403648}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001350108, iterations_per_second: 740.681486}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020191715, iterations_per_second: 49.525263}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037842357, iterations_per_second: 26.425415}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013698945, iterations_per_second: 72.998322}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002623, iterations_per_second: 381199.253265}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006207, iterations_per_second: 161118.809015}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002070315, iterations_per_second: 483.018207}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001779904, iterations_per_second: 561.827948}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021916941, iterations_per_second: 45.626805}
