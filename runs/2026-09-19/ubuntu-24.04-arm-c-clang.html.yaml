platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002151, iterations_per_second: 464878.434291}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004684, iterations_per_second: 213506.415806}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005069, iterations_per_second: 197297.030605}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001917211, iterations_per_second: 521.590908}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003630968, iterations_per_second: 275.408626}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001349219, iterations_per_second: 741.169521}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020199051, iterations_per_second: 49.507276}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.037706481, iterations_per_second: 26.520640}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013563911, iterations_per_second: 73.725049}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002643, iterations_per_second: 378357.926724}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006152, iterations_per_second: 162559.334113}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002070346, iterations_per_second: 483.011052}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001790254, iterations_per_second: 558.580060}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021865901, iterations_per_second: 45.733309}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018145624, iterations_per_second: 55.109706}
  xpath:
  xslt:
