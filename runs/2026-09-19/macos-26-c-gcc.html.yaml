platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 399999.999646}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005100, iterations_per_second: 196078.431431}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008200, iterations_per_second: 121951.219524}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002836000, iterations_per_second: 352.609309}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003676333, iterations_per_second: 272.010155}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001093333, iterations_per_second: 914.634146}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.026209000, iterations_per_second: 38.154832}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.049939000, iterations_per_second: 20.024430}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.016501000, iterations_per_second: 60.602388}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.647064}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006400, iterations_per_second: 156249.999978}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001780667, iterations_per_second: 561.587420}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003079667, iterations_per_second: 324.710467}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018992000, iterations_per_second: 52.653749}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018983000, iterations_per_second: 52.678713}
  xpath:
  xslt:
