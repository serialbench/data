platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454545.454519}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005400, iterations_per_second: 185185.185165}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000021100, iterations_per_second: 47393.364927}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001713667, iterations_per_second: 583.544058}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003787667, iterations_per_second: 264.014785}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001461667, iterations_per_second: 684.150513}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020992000, iterations_per_second: 47.637195}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.046752000, iterations_per_second: 21.389459}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010777000, iterations_per_second: 92.790201}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285740}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009200, iterations_per_second: 108695.652180}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002946333, iterations_per_second: 339.404910}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001795000, iterations_per_second: 557.103064}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.028136000, iterations_per_second: 35.541655}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.023493000, iterations_per_second: 42.565871}
