platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608182}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005000, iterations_per_second: 199999.999937}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000015300, iterations_per_second: 65359.477119}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001730667, iterations_per_second: 577.812018}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004776333, iterations_per_second: 209.365622}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001100333, iterations_per_second: 908.815510}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.028694000, iterations_per_second: 34.850491}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.057556000, iterations_per_second: 17.374383}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014675000, iterations_per_second: 68.143101}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007200, iterations_per_second: 138888.888856}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003525333, iterations_per_second: 283.661120}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001583333, iterations_per_second: 631.578947}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022075000, iterations_per_second: 45.300113}
