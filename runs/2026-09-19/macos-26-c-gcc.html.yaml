platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.371305}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005100, iterations_per_second: 196078.431431}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006800, iterations_per_second: 147058.823655}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001967667, iterations_per_second: 508.216161}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003861667, iterations_per_second: 258.955546}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001225667, iterations_per_second: 815.882513}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022316000, iterations_per_second: 44.810898}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.035995000, iterations_per_second: 27.781636}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010911000, iterations_per_second: 91.650628}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005600, iterations_per_second: 178571.428660}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002097667, iterations_per_second: 476.720165}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001590667, iterations_per_second: 628.667225}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019607000, iterations_per_second: 51.002193}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.016870000, iterations_per_second: 59.276823}
