platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005000, iterations_per_second: 200000.000505}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000013100, iterations_per_second: 76335.877857}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000013900, iterations_per_second: 71942.446048}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001812000, iterations_per_second: 551.876380}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004499667, iterations_per_second: 222.238684}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001057667, iterations_per_second: 945.477466}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.039032000, iterations_per_second: 25.620004}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.064343000, iterations_per_second: 15.541706}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010029000, iterations_per_second: 99.710839}
  xslt:
