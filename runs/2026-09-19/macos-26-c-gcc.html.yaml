platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002100, iterations_per_second: 476190.476104}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238052}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005900, iterations_per_second: 169491.525362}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001499667, iterations_per_second: 666.814848}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003053000, iterations_per_second: 327.546675}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000952667, iterations_per_second: 1049.685094}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.017340000, iterations_per_second: 57.670127}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.030302000, iterations_per_second: 33.001122}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010249000, iterations_per_second: 97.570495}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.586402}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005100, iterations_per_second: 196078.431212}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001669667, iterations_per_second: 598.921941}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001278667, iterations_per_second: 782.064651}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.017377000, iterations_per_second: 57.547333}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014583000, iterations_per_second: 68.572996}
