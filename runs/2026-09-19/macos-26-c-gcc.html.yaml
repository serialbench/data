platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005400, iterations_per_second: 185185.185214}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008400, iterations_per_second: 119047.619066}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.004197000, iterations_per_second: 238.265428}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000962667, iterations_per_second: 1038.781163}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.059284000, iterations_per_second: 16.867958}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009221000, iterations_per_second: 108.448108}
  xslt:
