platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005300, iterations_per_second: 188679.245355}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000011200, iterations_per_second: 89285.714239}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000014100, iterations_per_second: 70921.985823}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001627667, iterations_per_second: 614.376408}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003167667, iterations_per_second: 315.689782}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001030000, iterations_per_second: 970.873786}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.016778000, iterations_per_second: 59.601860}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.034971000, iterations_per_second: 28.595122}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010448000, iterations_per_second: 95.712098}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000007200, iterations_per_second: 138888.889020}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000013600, iterations_per_second: 73529.411766}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001701667, iterations_per_second: 587.659158}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001374667, iterations_per_second: 727.449079}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018764000, iterations_per_second: 53.293541}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015084000, iterations_per_second: 66.295412}
