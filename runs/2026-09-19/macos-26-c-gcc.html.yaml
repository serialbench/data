platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.778479}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007800, iterations_per_second: 128205.128155}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000012700, iterations_per_second: 78740.157609}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002455333, iterations_per_second: 407.276677}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004298000, iterations_per_second: 232.666356}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000959333, iterations_per_second: 1042.390549}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.035374000, iterations_per_second: 28.269350}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.060492000, iterations_per_second: 16.531112}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009433000, iterations_per_second: 106.010813}
  xslt:
