platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000004900, iterations_per_second: 204081.632695}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008300, iterations_per_second: 120481.927685}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.004694333, iterations_per_second: 213.022793}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001009667, iterations_per_second: 990.425883}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.069471000, iterations_per_second: 14.394496}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010537000, iterations_per_second: 94.903673}
  xslt:
