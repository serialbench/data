platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370526}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006200, iterations_per_second: 161290.322544}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006500, iterations_per_second: 153846.153831}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002505333, iterations_per_second: 399.148483}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003404333, iterations_per_second: 293.743268}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001083667, iterations_per_second: 922.792987}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019290000, iterations_per_second: 51.840332}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.052416000, iterations_per_second: 19.078144}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010885000, iterations_per_second: 91.869545}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238052}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005600, iterations_per_second: 178571.428660}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001910000, iterations_per_second: 523.560209}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002250333, iterations_per_second: 444.378611}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025302000, iterations_per_second: 39.522567}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015891000, iterations_per_second: 62.928702}
  xpath:
  xslt:
