platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006600, iterations_per_second: 151515.151376}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000014300, iterations_per_second: 69930.069940}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000021500, iterations_per_second: 46511.627901}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003598000, iterations_per_second: 277.932185}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005228667, iterations_per_second: 191.253347}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001003667, iterations_per_second: 996.346729}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.035312000, iterations_per_second: 28.318985}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.060419000, iterations_per_second: 16.551085}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009152000, iterations_per_second: 109.265734}
  xslt:
