platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.426338}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000014800, iterations_per_second: 67567.567582}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000016300, iterations_per_second: 61349.693278}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003245333, iterations_per_second: 308.134758}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004162333, iterations_per_second: 240.249860}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000969667, iterations_per_second: 1031.282228}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.015427000, iterations_per_second: 64.821417}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.030124000, iterations_per_second: 33.196123}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009281000, iterations_per_second: 107.747010}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000011500, iterations_per_second: 86956.521787}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000024200, iterations_per_second: 41322.314037}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001791333, iterations_per_second: 558.243394}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001274667, iterations_per_second: 784.518828}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.016522000, iterations_per_second: 60.525360}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012631000, iterations_per_second: 79.170295}
