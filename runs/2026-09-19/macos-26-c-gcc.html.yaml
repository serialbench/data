platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005400, iterations_per_second: 185185.185263}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000011700, iterations_per_second: 85470.085437}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000014400, iterations_per_second: 69444.444455}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002716000, iterations_per_second: 368.188513}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004058000, iterations_per_second: 246.426811}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001602000, iterations_per_second: 624.219725}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.017824000, iterations_per_second: 56.104129}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.034060000, iterations_per_second: 29.359953}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011109000, iterations_per_second: 90.017103}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000007100, iterations_per_second: 140845.070553}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000018200, iterations_per_second: 54945.054946}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002345000, iterations_per_second: 426.439232}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001622667, iterations_per_second: 616.269515}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019288000, iterations_per_second: 51.845707}
