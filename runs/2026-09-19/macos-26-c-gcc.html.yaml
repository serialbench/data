    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004300, iterations_per_second: 232558.139507}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007400, iterations_per_second: 135135.135061}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001743667, iterations_per_second: 573.504110}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003487000, iterations_per_second: 286.779467}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001108667, iterations_per_second: 901.984366}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.017811000, iterations_per_second: 56.145079}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.035655000, iterations_per_second: 28.046557}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011343000, iterations_per_second: 88.160099}
  generation:
