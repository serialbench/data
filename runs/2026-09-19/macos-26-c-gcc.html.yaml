    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006500, iterations_per_second: 153846.153965}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001844667, iterations_per_second: 542.103361}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001481667, iterations_per_second: 674.915636}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019735000, iterations_per_second: 50.671396}
