platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.857320}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004800, iterations_per_second: 208333.333366}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006700, iterations_per_second: 149253.731340}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001718333, iterations_per_second: 581.959263}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003357000, iterations_per_second: 297.885016}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001051667, iterations_per_second: 950.871632}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018955000, iterations_per_second: 52.756529}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.035199000, iterations_per_second: 28.409898}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009523000, iterations_per_second: 105.008926}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312499.999679}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007000, iterations_per_second: 142857.142870}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001778000, iterations_per_second: 562.429696}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001479000, iterations_per_second: 676.132522}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018606000, iterations_per_second: 53.746103}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014339000, iterations_per_second: 69.739870}
  xpath:
