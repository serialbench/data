platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006200, iterations_per_second: 161290.322692}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000012000, iterations_per_second: 83333.333386}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000017700, iterations_per_second: 56497.175139}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003249333, iterations_per_second: 307.755437}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004106333, iterations_per_second: 243.526260}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000988333, iterations_per_second: 1011.804384}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.015520000, iterations_per_second: 64.432990}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.030325000, iterations_per_second: 32.976092}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009146000, iterations_per_second: 109.337415}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000008300, iterations_per_second: 120481.927685}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000015400, iterations_per_second: 64935.064907}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001817333, iterations_per_second: 550.256786}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001283000, iterations_per_second: 779.423227}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.016487000, iterations_per_second: 60.653848}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012595000, iterations_per_second: 79.396586}
  xpath:
  xslt:
