platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008600, iterations_per_second: 116279.069754}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010500, iterations_per_second: 95238.095169}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002494667, iterations_per_second: 400.855158}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004852333, iterations_per_second: 206.086419}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015101000, iterations_per_second: 66.220780}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.043161000, iterations_per_second: 23.169065}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000879, iterations_per_second: 1137527.012710}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001078833, iterations_per_second: 926.927236}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.016501541, iterations_per_second: 60.600401}
  xslt:
