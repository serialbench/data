platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005100, iterations_per_second: 196078.431431}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006400, iterations_per_second: 156249.999978}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001782333, iterations_per_second: 561.062278}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004238667, iterations_per_second: 235.923246}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016633000, iterations_per_second: 60.121445}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.043203000, iterations_per_second: 23.146541}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000954, iterations_per_second: 1047998.324675}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001036028, iterations_per_second: 965.225189}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.016277083, iterations_per_second: 61.436069}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006900, iterations_per_second: 144927.536240}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010300, iterations_per_second: 97087.378672}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002159000, iterations_per_second: 463.177397}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005390333, iterations_per_second: 185.517284}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.028556000, iterations_per_second: 35.018910}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.067216000, iterations_per_second: 14.877410}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 769230.767809}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001345667, iterations_per_second: 743.126084}
