    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001151667, iterations_per_second: 868.306802}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004036333, iterations_per_second: 247.749608}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016099000, iterations_per_second: 62.115659}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047699000, iterations_per_second: 20.964800}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000958, iterations_per_second: 1043514.574753}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001292903, iterations_per_second: 773.453229}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020051667, iterations_per_second: 49.871165}
  generation:
