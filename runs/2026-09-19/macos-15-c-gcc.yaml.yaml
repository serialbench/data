platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270122}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001163000, iterations_per_second: 859.845228}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003741333, iterations_per_second: 267.284391}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.058636000, iterations_per_second: 17.054369}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048356000, iterations_per_second: 20.679957}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001046, iterations_per_second: 956114.350437}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001191458, iterations_per_second: 839.307571}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.019648500, iterations_per_second: 50.894470}
  xslt:
