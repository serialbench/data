    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001188333, iterations_per_second: 841.514726}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003777667, iterations_per_second: 264.713668}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016981000, iterations_per_second: 58.889347}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048597000, iterations_per_second: 20.577402}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001004, iterations_per_second: 995916.741766}
