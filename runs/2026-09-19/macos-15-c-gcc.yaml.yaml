platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009000, iterations_per_second: 111111.111111}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001199667, iterations_per_second: 833.564879}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003995667, iterations_per_second: 250.271127}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015369000, iterations_per_second: 65.066042}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.058147000, iterations_per_second: 17.197792}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001008, iterations_per_second: 991768.322282}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001185583, iterations_per_second: 843.466648}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020152833, iterations_per_second: 49.620815}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004600, iterations_per_second: 217391.304359}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006200, iterations_per_second: 161290.322544}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002472000, iterations_per_second: 404.530744}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006104667, iterations_per_second: 163.809108}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031960000, iterations_per_second: 31.289111}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.074566000, iterations_per_second: 13.410938}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001379, iterations_per_second: 725058.004415}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001615417, iterations_per_second: 619.035337}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.023317334, iterations_per_second: 42.886550}
  xpath:
  xslt:
