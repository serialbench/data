platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256684}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.895008}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001343333, iterations_per_second: 744.416873}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004254667, iterations_per_second: 235.036039}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.018068000, iterations_per_second: 55.346469}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.064458000, iterations_per_second: 15.513978}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001017, iterations_per_second: 983671.056699}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002600014, iterations_per_second: 384.613314}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020883416, iterations_per_second: 47.884886}
  xslt:
