platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005100, iterations_per_second: 196078.431431}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002320333, iterations_per_second: 430.972561}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003936000, iterations_per_second: 254.065041}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.028343000, iterations_per_second: 35.282080}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.065397000, iterations_per_second: 15.291221}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000967, iterations_per_second: 1034447.091020}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001350167, iterations_per_second: 740.649303}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032091708, iterations_per_second: 31.160697}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007500, iterations_per_second: 133333.333266}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007700, iterations_per_second: 129870.129815}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002390667, iterations_per_second: 418.293363}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006060333, iterations_per_second: 165.007425}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.033823000, iterations_per_second: 29.565680}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.116030000, iterations_per_second: 8.618461}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001675, iterations_per_second: 597014.925867}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001957375, iterations_per_second: 510.888307}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.033238292, iterations_per_second: 30.085782}
  xpath:
  xslt:
