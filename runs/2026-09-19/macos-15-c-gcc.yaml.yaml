platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008400, iterations_per_second: 119047.619026}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010600, iterations_per_second: 94339.622677}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002486333, iterations_per_second: 402.198686}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004829667, iterations_per_second: 207.053627}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.014605000, iterations_per_second: 68.469702}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048094000, iterations_per_second: 20.792614}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001042, iterations_per_second: 959969.291589}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001070514, iterations_per_second: 934.130707}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.016850167, iterations_per_second: 59.346593}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011400, iterations_per_second: 87719.298292}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000017000, iterations_per_second: 58823.529403}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002369333, iterations_per_second: 422.059651}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005337000, iterations_per_second: 187.371182}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031363000, iterations_per_second: 31.884705}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068123000, iterations_per_second: 14.679330}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001671, iterations_per_second: 598479.862407}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001381153, iterations_per_second: 724.032747}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021277000, iterations_per_second: 46.999107}
  xpath:
  xslt:
