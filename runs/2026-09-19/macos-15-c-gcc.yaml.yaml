platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238052}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001195667, iterations_per_second: 836.353499}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003758333, iterations_per_second: 266.075388}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015644000, iterations_per_second: 63.922271}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.046997000, iterations_per_second: 21.277954}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000975, iterations_per_second: 1025641.025241}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001197278, iterations_per_second: 835.227909}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018196583, iterations_per_second: 54.955373}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005200, iterations_per_second: 192307.691952}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006500, iterations_per_second: 153846.153965}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002372333, iterations_per_second: 421.525924}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005825333, iterations_per_second: 171.663996}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031408000, iterations_per_second: 31.839022}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.073610000, iterations_per_second: 13.585111}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001329, iterations_per_second: 752388.836855}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001579958, iterations_per_second: 632.928084}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.023699250, iterations_per_second: 42.195428}
  xpath:
  xslt:
