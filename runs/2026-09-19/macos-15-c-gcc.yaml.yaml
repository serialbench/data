    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007700, iterations_per_second: 129870.130006}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002352333, iterations_per_second: 425.109820}
