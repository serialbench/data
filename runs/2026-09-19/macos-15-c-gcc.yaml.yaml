platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.727259}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004100, iterations_per_second: 243902.438964}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001176000, iterations_per_second: 850.340136}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004044333, iterations_per_second: 247.259540}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.017221000, iterations_per_second: 58.068637}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056729000, iterations_per_second: 17.627668}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000987, iterations_per_second: 1012658.228948}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001278486, iterations_per_second: 782.174963}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021832833, iterations_per_second: 45.802576}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004700, iterations_per_second: 212765.957469}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.426185}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002423667, iterations_per_second: 412.597992}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006291000, iterations_per_second: 158.957241}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.033893000, iterations_per_second: 29.504617}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.108298000, iterations_per_second: 9.233781}
