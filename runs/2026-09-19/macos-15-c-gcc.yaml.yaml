    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001370333, iterations_per_second: 729.749453}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004242667, iterations_per_second: 235.700817}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.018510000, iterations_per_second: 54.024851}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.073328000, iterations_per_second: 13.637355}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001000, iterations_per_second: 999999.996840}
