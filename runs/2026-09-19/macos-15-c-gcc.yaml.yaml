platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008500, iterations_per_second: 117647.058963}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010500, iterations_per_second: 95238.095169}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002264333, iterations_per_second: 441.631091}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004581667, iterations_per_second: 218.261186}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.014615000, iterations_per_second: 68.422853}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.043092000, iterations_per_second: 23.206164}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000963, iterations_per_second: 1038961.030846}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001059500, iterations_per_second: 943.841435}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.016355875, iterations_per_second: 61.140110}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011200, iterations_per_second: 89285.714330}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000016800, iterations_per_second: 59523.809594}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002329667, iterations_per_second: 429.245958}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005340667, iterations_per_second: 187.242542}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.028787000, iterations_per_second: 34.737903}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.067058000, iterations_per_second: 14.912464}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001296, iterations_per_second: 771664.490268}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001360958, iterations_per_second: 734.776352}
