platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.778040}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010300, iterations_per_second: 97087.378618}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001412667, iterations_per_second: 707.881076}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005566333, iterations_per_second: 179.651476}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021852000, iterations_per_second: 45.762402}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.072096000, iterations_per_second: 13.870395}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002658, iterations_per_second: 376180.265277}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001335319, iterations_per_second: 748.884536}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.023687958, iterations_per_second: 42.215543}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008400, iterations_per_second: 119047.619026}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006400, iterations_per_second: 156249.999978}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003364000, iterations_per_second: 297.265161}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007628000, iterations_per_second: 131.095962}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.037392000, iterations_per_second: 26.743688}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.133226000, iterations_per_second: 7.506042}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000003663, iterations_per_second: 273037.542610}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001872236, iterations_per_second: 534.120603}
