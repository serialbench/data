platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007500, iterations_per_second: 133333.333064}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010900, iterations_per_second: 91743.119211}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001222667, iterations_per_second: 817.884406}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004161333, iterations_per_second: 240.307594}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016959000, iterations_per_second: 58.965741}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.045376000, iterations_per_second: 22.038082}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000950, iterations_per_second: 1052631.575307}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001177139, iterations_per_second: 849.517347}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020428542, iterations_per_second: 48.951119}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005600, iterations_per_second: 178571.428297}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006600, iterations_per_second: 151515.151376}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002371667, iterations_per_second: 421.644413}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005655333, iterations_per_second: 176.824237}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.032738000, iterations_per_second: 30.545543}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.076051000, iterations_per_second: 13.149071}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001329, iterations_per_second: 752332.219947}
