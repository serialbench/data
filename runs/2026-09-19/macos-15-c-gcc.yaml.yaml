    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.426185}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002640667, iterations_per_second: 378.692249}
