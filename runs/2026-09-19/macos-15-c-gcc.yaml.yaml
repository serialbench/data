platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001118667, iterations_per_second: 893.921335}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003494000, iterations_per_second: 286.204923}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015395000, iterations_per_second: 64.956155}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047157000, iterations_per_second: 21.205759}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000987, iterations_per_second: 1012658.228948}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001257778, iterations_per_second: 795.052863}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018264833, iterations_per_second: 54.750022}
  xslt:
