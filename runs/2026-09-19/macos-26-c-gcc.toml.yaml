platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.383905}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000006900, iterations_per_second: 144927.536359}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000099000, iterations_per_second: 10101.010103}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000213333, iterations_per_second: 4687.500000}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000532000, iterations_per_second: 1879.699248}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002056000, iterations_per_second: 486.381323}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.667719}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000067333, iterations_per_second: 14851.485153}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000875000, iterations_per_second: 1142.857143}
  xpath:
  xslt:
