platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.607644}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000008000, iterations_per_second: 125000.000138}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000104667, iterations_per_second: 9554.140127}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000431333, iterations_per_second: 2318.392581}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001096000, iterations_per_second: 912.408759}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003592000, iterations_per_second: 278.396437}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.383905}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000169000, iterations_per_second: 5917.159762}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001362000, iterations_per_second: 734.214391}
  xpath:
  xslt:
