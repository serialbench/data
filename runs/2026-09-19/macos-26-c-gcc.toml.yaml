platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000005000, iterations_per_second: 199999.999823}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005500, iterations_per_second: 181818.181901}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000040000, iterations_per_second: 25000.000004}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000186667, iterations_per_second: 5357.142857}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000575000, iterations_per_second: 1739.130435}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002092000, iterations_per_second: 478.011472}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.668350}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000073333, iterations_per_second: 13636.363636}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000896000, iterations_per_second: 1116.071429}
  xpath:
  xslt:
