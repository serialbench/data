platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.385586}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000009700, iterations_per_second: 103092.783524}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000112000, iterations_per_second: 8928.571427}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000520333, iterations_per_second: 1921.844971}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001246000, iterations_per_second: 802.568218}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003687000, iterations_per_second: 271.223217}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.646818}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000206000, iterations_per_second: 4854.368932}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001403000, iterations_per_second: 712.758375}
  xpath:
  xslt:
