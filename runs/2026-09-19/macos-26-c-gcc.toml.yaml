platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.113916}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.857320}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000038333, iterations_per_second: 26086.956523}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000177667, iterations_per_second: 5628.517823}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000517000, iterations_per_second: 1934.235977}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002106000, iterations_per_second: 474.833808}
  xslt:
