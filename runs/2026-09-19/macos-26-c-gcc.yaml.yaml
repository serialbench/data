    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008200, iterations_per_second: 121951.219524}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001148667, iterations_per_second: 870.574579}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003603000, iterations_per_second: 277.546489}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015525000, iterations_per_second: 64.412238}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.046867000, iterations_per_second: 21.336975}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001163, iterations_per_second: 860215.052781}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000911514, iterations_per_second: 1097.075854}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013246375, iterations_per_second: 75.492352}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007900, iterations_per_second: 126582.278482}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008500, iterations_per_second: 117647.058806}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002553000, iterations_per_second: 391.696044}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005697000, iterations_per_second: 175.530981}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.032472000, iterations_per_second: 30.795763}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.089676000, iterations_per_second: 11.151256}
