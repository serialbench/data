platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007300, iterations_per_second: 136986.301342}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000011400, iterations_per_second: 87719.298248}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001156000, iterations_per_second: 865.051903}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003911667, iterations_per_second: 255.645505}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016218000, iterations_per_second: 61.659884}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056446000, iterations_per_second: 17.716047}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002458, iterations_per_second: 406785.176776}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001901653, iterations_per_second: 525.858385}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.014630542, iterations_per_second: 68.350168}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000015200, iterations_per_second: 65789.473690}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000015500, iterations_per_second: 64516.129030}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002617000, iterations_per_second: 382.116928}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005982333, iterations_per_second: 167.158857}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031718000, iterations_per_second: 31.527839}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.125981000, iterations_per_second: 7.937705}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000003442, iterations_per_second: 290554.086447}
