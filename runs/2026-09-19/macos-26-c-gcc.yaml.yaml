    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001292333, iterations_per_second: 773.794171}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004125667, iterations_per_second: 242.385069}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016669000, iterations_per_second: 59.991601}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.046937000, iterations_per_second: 21.305154}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.113916}
