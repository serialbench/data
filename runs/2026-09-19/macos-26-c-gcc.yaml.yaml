    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003841333, iterations_per_second: 260.326276}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016269000, iterations_per_second: 61.466593}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048692000, iterations_per_second: 20.537255}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000858, iterations_per_second: 1164958.061550}
