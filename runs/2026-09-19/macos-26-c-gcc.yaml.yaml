    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001317667, iterations_per_second: 758.917278}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004203000, iterations_per_second: 237.925291}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016525000, iterations_per_second: 60.514372}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055690000, iterations_per_second: 17.956545}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002429, iterations_per_second: 411658.162331}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002292889, iterations_per_second: 436.131012}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.017340875, iterations_per_second: 57.667217}
  generation:
