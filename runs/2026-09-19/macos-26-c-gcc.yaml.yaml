platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008400, iterations_per_second: 119047.619026}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000019900, iterations_per_second: 50251.256265}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001140000, iterations_per_second: 877.192982}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003698000, iterations_per_second: 270.416441}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015276000, iterations_per_second: 65.462163}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.046653000, iterations_per_second: 21.434849}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000929, iterations_per_second: 1076194.580751}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000843486, iterations_per_second: 1185.556133}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.012776750, iterations_per_second: 78.267165}
  xslt:
