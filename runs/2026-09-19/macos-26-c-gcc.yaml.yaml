platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000010200, iterations_per_second: 98039.215715}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000021000, iterations_per_second: 47619.047636}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002472000, iterations_per_second: 404.530744}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004780000, iterations_per_second: 209.205021}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.014184000, iterations_per_second: 70.501974}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.042624000, iterations_per_second: 23.460961}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000867, iterations_per_second: 1153934.920045}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000808570, iterations_per_second: 1236.751812}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.012085291, iterations_per_second: 82.745215}
  xslt:
