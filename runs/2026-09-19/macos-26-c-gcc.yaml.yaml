platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000012000, iterations_per_second: 83333.333307}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000024300, iterations_per_second: 41152.263382}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002180333, iterations_per_second: 458.645467}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004535667, iterations_per_second: 220.474756}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.014136000, iterations_per_second: 70.741370}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.043385000, iterations_per_second: 23.049441}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001004, iterations_per_second: 995817.567676}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000775319, iterations_per_second: 1289.791131}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.012011583, iterations_per_second: 83.252973}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000019400, iterations_per_second: 51546.391762}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000022600, iterations_per_second: 44247.787611}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002179000, iterations_per_second: 458.926113}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005408000, iterations_per_second: 184.911243}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.027701000, iterations_per_second: 36.099780}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.066698000, iterations_per_second: 14.992953}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001338, iterations_per_second: 747663.546140}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001081445, iterations_per_second: 924.689012}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.015361792, iterations_per_second: 65.096572}
  xpath:
