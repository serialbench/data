platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004100, iterations_per_second: 243902.438964}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007000, iterations_per_second: 142857.142986}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001075667, iterations_per_second: 929.656027}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003715000, iterations_per_second: 269.179004}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.014917000, iterations_per_second: 67.037608}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.050288000, iterations_per_second: 19.885460}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000913, iterations_per_second: 1095890.408606}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000921278, iterations_per_second: 1085.448692}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013741875, iterations_per_second: 72.770273}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005400, iterations_per_second: 185185.185263}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008100, iterations_per_second: 123456.790262}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002129000, iterations_per_second: 469.704086}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005416333, iterations_per_second: 184.626746}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031711000, iterations_per_second: 31.534799}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.077137000, iterations_per_second: 12.963947}
