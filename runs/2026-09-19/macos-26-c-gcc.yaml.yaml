    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001246667, iterations_per_second: 802.139037}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003926333, iterations_per_second: 254.690551}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016433000, iterations_per_second: 60.853161}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.049006000, iterations_per_second: 20.405665}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000921, iterations_per_second: 1085894.242501}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000843653, iterations_per_second: 1185.321922}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013084916, iterations_per_second: 76.423876}
  generation:
