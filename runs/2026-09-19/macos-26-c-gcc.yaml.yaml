platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000011000, iterations_per_second: 90909.090904}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000019000, iterations_per_second: 52631.578946}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002565333, iterations_per_second: 389.812890}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004632333, iterations_per_second: 215.873930}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.014815000, iterations_per_second: 67.499156}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.042712000, iterations_per_second: 23.412624}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000833, iterations_per_second: 1200048.002396}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000784778, iterations_per_second: 1274.245710}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.012443459, iterations_per_second: 80.363507}
  xslt:
