    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002259000, iterations_per_second: 442.673749}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004648667, iterations_per_second: 215.115445}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.014594000, iterations_per_second: 68.521310}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048957000, iterations_per_second: 20.426088}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001179, iterations_per_second: 848032.563779}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000861847, iterations_per_second: 1160.298305}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013156750, iterations_per_second: 76.006613}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000016600, iterations_per_second: 60240.963842}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000023100, iterations_per_second: 43290.043293}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002223667, iterations_per_second: 449.707690}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005280667, iterations_per_second: 189.370029}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.032549000, iterations_per_second: 30.722910}
