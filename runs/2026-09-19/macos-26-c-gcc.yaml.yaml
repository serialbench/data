    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000027100, iterations_per_second: 36900.369019}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002619333, iterations_per_second: 381.776533}
