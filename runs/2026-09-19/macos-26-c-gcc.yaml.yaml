platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006900, iterations_per_second: 144927.536240}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009400, iterations_per_second: 106382.978735}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001359667, iterations_per_second: 735.474381}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004559667, iterations_per_second: 219.314277}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019202000, iterations_per_second: 52.077909}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.138780000, iterations_per_second: 7.205649}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000975, iterations_per_second: 1025641.025241}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001155805, iterations_per_second: 865.197600}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013895792, iterations_per_second: 71.964232}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007800, iterations_per_second: 128205.128249}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000011700, iterations_per_second: 85470.085478}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002533333, iterations_per_second: 394.736842}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007900333, iterations_per_second: 126.576938}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.031255000, iterations_per_second: 31.994881}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.109895000, iterations_per_second: 9.099595}
