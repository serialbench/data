platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009700, iterations_per_second: 103092.783524}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001241333, iterations_per_second: 805.585392}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003816333, iterations_per_second: 262.031618}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016695000, iterations_per_second: 59.898173}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.062270000, iterations_per_second: 16.059097}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002437, iterations_per_second: 410256.411053}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000996639, iterations_per_second: 1003.372334}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013594666, iterations_per_second: 73.558262}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000015700, iterations_per_second: 63694.267538}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010500, iterations_per_second: 95238.095272}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002338667, iterations_per_second: 427.594071}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005769667, iterations_per_second: 173.320238}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.034392000, iterations_per_second: 29.076529}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.109897000, iterations_per_second: 9.099429}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000003225, iterations_per_second: 310077.519343}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001404014, iterations_per_second: 712.243779}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.017758125, iterations_per_second: 56.312251}
  xpath:
  xslt:
