    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008300, iterations_per_second: 120481.927685}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001408667, iterations_per_second: 709.891150}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008162000, iterations_per_second: 122.518990}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025043000, iterations_per_second: 39.931318}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.064127000, iterations_per_second: 15.594056}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001050, iterations_per_second: 952380.952208}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000987167, iterations_per_second: 1013.000169}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.016803250, iterations_per_second: 59.512297}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007700, iterations_per_second: 129870.129862}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008800, iterations_per_second: 113636.363630}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.004102667, iterations_per_second: 243.743906}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007862333, iterations_per_second: 127.188706}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.048173000, iterations_per_second: 20.758516}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.123546000, iterations_per_second: 8.094151}
