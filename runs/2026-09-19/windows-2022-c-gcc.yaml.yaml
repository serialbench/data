    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007484067, iterations_per_second: 133.617196}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.027923300, iterations_per_second: 35.812386}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.089739400, iterations_per_second: 11.143377}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.668350}
