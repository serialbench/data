platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001000, iterations_per_second: 1000000.002525}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.295603}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000041333, iterations_per_second: 24193.548393}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000187667, iterations_per_second: 5328.596803}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000613000, iterations_per_second: 1631.321370}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002091000, iterations_per_second: 478.240077}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000800, iterations_per_second: 1249999.994274}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000079667, iterations_per_second: 12552.301254}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000987000, iterations_per_second: 1013.171226}
  xpath:
  xslt:
