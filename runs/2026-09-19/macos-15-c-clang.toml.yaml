platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.001578}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.727259}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000099000, iterations_per_second: 10101.010103}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000457333, iterations_per_second: 2186.588921}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000780000, iterations_per_second: 1282.051282}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002267000, iterations_per_second: 441.111601}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 499999.998420}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000186667, iterations_per_second: 5357.142858}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001000000, iterations_per_second: 1000.000000}
  xpath:
  xslt:
