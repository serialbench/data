platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001000, iterations_per_second: 1000000.002525}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003100, iterations_per_second: 322580.645384}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000077333, iterations_per_second: 12931.034481}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000336333, iterations_per_second: 2973.240832}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001223000, iterations_per_second: 817.661488}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002964000, iterations_per_second: 337.381916}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.668350}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000151667, iterations_per_second: 6593.406594}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001374000, iterations_per_second: 727.802038}
  xpath:
  xslt:
