platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.113916}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454545.454519}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000048667, iterations_per_second: 20547.945209}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000220333, iterations_per_second: 4538.577912}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000723000, iterations_per_second: 1383.125864}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002120000, iterations_per_second: 471.698113}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.906688}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000097333, iterations_per_second: 10273.972603}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001009000, iterations_per_second: 991.080277}
  xpath:
  xslt:
