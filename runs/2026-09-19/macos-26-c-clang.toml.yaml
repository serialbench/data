platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 399999.999191}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000007000, iterations_per_second: 142857.142754}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000100000, iterations_per_second: 10000.000003}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000503333, iterations_per_second: 1986.754967}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000528000, iterations_per_second: 1893.939394}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002088000, iterations_per_second: 478.927203}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.667719}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000198667, iterations_per_second: 5033.557048}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000883000, iterations_per_second: 1132.502831}
  xpath:
  xslt:
