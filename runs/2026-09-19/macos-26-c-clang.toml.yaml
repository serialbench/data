platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.586402}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000007100, iterations_per_second: 140845.070440}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000102667, iterations_per_second: 9740.259741}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000726667, iterations_per_second: 1376.146789}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000548000, iterations_per_second: 1824.817518}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002245000, iterations_per_second: 445.434298}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384325}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000074333, iterations_per_second: 13452.914798}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000895000, iterations_per_second: 1117.318436}
  xpath:
  xslt:
