platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.909037}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.856957}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000037333, iterations_per_second: 26785.714285}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000178000, iterations_per_second: 5617.977528}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000527000, iterations_per_second: 1897.533207}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002051000, iterations_per_second: 487.567040}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001000, iterations_per_second: 999999.999683}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000067000, iterations_per_second: 14925.373134}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000888000, iterations_per_second: 1126.126126}
  xpath:
  xslt:
