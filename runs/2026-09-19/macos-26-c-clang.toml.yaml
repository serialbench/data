platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.549940}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004900, iterations_per_second: 204081.632695}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000081000, iterations_per_second: 12345.679015}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000204667, iterations_per_second: 4885.993485}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000595000, iterations_per_second: 1680.672269}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005453000, iterations_per_second: 183.385292}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 769230.764446}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000111000, iterations_per_second: 9009.009010}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001510000, iterations_per_second: 662.251656}
  xpath:
  xslt:
