platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.106899}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312500.000234}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000039333, iterations_per_second: 25423.728817}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000200667, iterations_per_second: 4983.388705}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000536000, iterations_per_second: 1865.671642}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002334000, iterations_per_second: 428.449015}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001000, iterations_per_second: 999999.996840}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000073667, iterations_per_second: 13574.660633}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000976000, iterations_per_second: 1024.590164}
  xpath:
  xslt:
