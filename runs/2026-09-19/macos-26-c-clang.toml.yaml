platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 250000.000631}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000010000, iterations_per_second: 99999.999911}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000111000, iterations_per_second: 9009.009007}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000527000, iterations_per_second: 1897.533207}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001245000, iterations_per_second: 803.212851}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003588000, iterations_per_second: 278.706800}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312499.999679}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000202667, iterations_per_second: 4934.210527}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001380000, iterations_per_second: 724.637681}
  xpath:
  xslt:
