platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.909037}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.856957}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000039000, iterations_per_second: 25641.025643}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000182000, iterations_per_second: 5494.505494}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000533000, iterations_per_second: 1876.172608}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002127000, iterations_per_second: 470.145745}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001000, iterations_per_second: 999999.999683}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000069667, iterations_per_second: 14354.066987}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000930000, iterations_per_second: 1075.268817}
  xpath:
  xslt:
