platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002723, iterations_per_second: 367242.012478}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006477, iterations_per_second: 154390.081952}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006732, iterations_per_second: 148535.440525}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001899594, iterations_per_second: 526.428279}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004400458, iterations_per_second: 227.249073}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001328972, iterations_per_second: 752.461112}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021975172, iterations_per_second: 45.505901}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.047071466, iterations_per_second: 21.244293}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014987810, iterations_per_second: 66.720889}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003486, iterations_per_second: 286886.421642}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008314, iterations_per_second: 120274.707415}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002091975, iterations_per_second: 478.017185}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001753973, iterations_per_second: 570.134204}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023952482, iterations_per_second: 41.749327}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019883702, iterations_per_second: 50.292446}
  xpath:
  xslt:
