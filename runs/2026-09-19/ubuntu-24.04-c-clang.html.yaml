platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002512, iterations_per_second: 398120.869553}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006470, iterations_per_second: 154566.672336}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005178, iterations_per_second: 193132.218318}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002214978, iterations_per_second: 451.471753}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005097489, iterations_per_second: 196.175032}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001221724, iterations_per_second: 818.515475}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022958063, iterations_per_second: 43.557682}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.050834879, iterations_per_second: 19.671533}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013033955, iterations_per_second: 76.722683}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003178, iterations_per_second: 314683.113890}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006700, iterations_per_second: 149251.503666}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002355600, iterations_per_second: 424.520352}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001679151, iterations_per_second: 595.539173}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025070484, iterations_per_second: 39.887543}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017996283, iterations_per_second: 55.567030}
  xpath:
  xslt:
