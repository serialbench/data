platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000004785, iterations_per_second: 208986.415939}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004976, iterations_per_second: 200952.514950}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004023, iterations_per_second: 248576.897221}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001664398, iterations_per_second: 600.817713}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003974370, iterations_per_second: 251.612205}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000946245, iterations_per_second: 1056.808382}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.017841026, iterations_per_second: 56.050588}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.039956850, iterations_per_second: 25.026998}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010074641, iterations_per_second: 99.259120}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002457, iterations_per_second: 407066.677868}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005221, iterations_per_second: 191548.864039}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001825309, iterations_per_second: 547.852546}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001282350, iterations_per_second: 779.818505}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019572683, iterations_per_second: 51.091616}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013847892, iterations_per_second: 72.213157}
  xpath:
  xslt:
