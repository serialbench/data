platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002612, iterations_per_second: 382863.049715}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006763, iterations_per_second: 147872.120183}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005627, iterations_per_second: 177698.800560}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002145494, iterations_per_second: 466.093051}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005287166, iterations_per_second: 189.137231}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001409114, iterations_per_second: 709.665622}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022634660, iterations_per_second: 44.180032}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.053231046, iterations_per_second: 18.786029}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014830045, iterations_per_second: 67.430679}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003354, iterations_per_second: 298124.795033}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007211, iterations_per_second: 138686.637513}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002354063, iterations_per_second: 424.797407}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001857835, iterations_per_second: 538.261029}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025435593, iterations_per_second: 39.314987}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019629265, iterations_per_second: 50.944343}
  xpath:
