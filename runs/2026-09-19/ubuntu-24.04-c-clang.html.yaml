platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002654, iterations_per_second: 376789.751415}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006875, iterations_per_second: 145456.661172}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005719, iterations_per_second: 174864.916908}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002173479, iterations_per_second: 460.091933}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005191890, iterations_per_second: 192.608099}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001409648, iterations_per_second: 709.396788}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023253247, iterations_per_second: 43.004747}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.053579417, iterations_per_second: 18.663884}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015063097, iterations_per_second: 66.387410}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003403, iterations_per_second: 293823.823155}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007550, iterations_per_second: 132446.822623}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002374085, iterations_per_second: 421.214851}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001895190, iterations_per_second: 527.651674}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025673268, iterations_per_second: 38.951021}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019999620, iterations_per_second: 50.000950}
