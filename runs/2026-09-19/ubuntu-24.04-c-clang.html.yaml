platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000007458, iterations_per_second: 134082.407035}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005936, iterations_per_second: 168457.936048}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.007070716, iterations_per_second: 141.428399}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001404627, iterations_per_second: 711.932945}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.094742275, iterations_per_second: 10.554950}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014196695, iterations_per_second: 70.438930}
  xslt:
