platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002641, iterations_per_second: 378658.790358}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006930, iterations_per_second: 144302.226547}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005679, iterations_per_second: 176099.742933}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002168413, iterations_per_second: 461.166761}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005247376, iterations_per_second: 190.571440}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001410799, iterations_per_second: 708.818195}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023051122, iterations_per_second: 43.381836}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.053658759, iterations_per_second: 18.636286}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014735115, iterations_per_second: 67.865096}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003411, iterations_per_second: 293143.376442}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007441, iterations_per_second: 134392.345000}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002405844, iterations_per_second: 415.654548}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001871551, iterations_per_second: 534.316190}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025484193, iterations_per_second: 39.240010}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019756158, iterations_per_second: 50.617129}
