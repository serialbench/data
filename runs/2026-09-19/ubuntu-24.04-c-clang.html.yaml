platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002602, iterations_per_second: 384334.524930}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006768, iterations_per_second: 147760.686783}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005694, iterations_per_second: 175632.716829}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002132105, iterations_per_second: 469.019980}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005151852, iterations_per_second: 194.104942}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001411411, iterations_per_second: 708.511012}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022542328, iterations_per_second: 44.360991}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.052598799, iterations_per_second: 19.011841}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014513891, iterations_per_second: 68.899512}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003341, iterations_per_second: 299284.709443}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007294, iterations_per_second: 137104.624541}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002362337, iterations_per_second: 423.309570}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001858916, iterations_per_second: 537.947826}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025086730, iterations_per_second: 39.861712}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019256545, iterations_per_second: 51.930396}
  xpath:
  xslt:
