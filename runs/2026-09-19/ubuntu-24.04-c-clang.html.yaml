platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002622, iterations_per_second: 381417.347037}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000009111, iterations_per_second: 109757.436067}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005645, iterations_per_second: 177163.610555}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002164274, iterations_per_second: 462.048705}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005177287, iterations_per_second: 193.151368}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001393878, iterations_per_second: 717.422902}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022754874, iterations_per_second: 43.946629}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.053021710, iterations_per_second: 18.860199}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014402727, iterations_per_second: 69.431296}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003372, iterations_per_second: 296533.523103}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007341, iterations_per_second: 136226.790357}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002359475, iterations_per_second: 423.823156}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001863036, iterations_per_second: 536.758281}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.024976786, iterations_per_second: 40.037177}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019483806, iterations_per_second: 51.324674}
