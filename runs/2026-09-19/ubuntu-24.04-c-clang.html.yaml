platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001555, iterations_per_second: 643169.540945}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003664, iterations_per_second: 272910.867751}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003718, iterations_per_second: 268997.981775}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001364780, iterations_per_second: 732.718826}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003087231, iterations_per_second: 323.914861}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000902503, iterations_per_second: 1108.029149}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.014747691, iterations_per_second: 67.807225}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.032035349, iterations_per_second: 31.215518}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010013092, iterations_per_second: 99.869251}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001967, iterations_per_second: 508310.883012}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004616, iterations_per_second: 216619.010099}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001493707, iterations_per_second: 669.475189}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001199653, iterations_per_second: 833.574144}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.016070912, iterations_per_second: 62.224222}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013402278, iterations_per_second: 74.614181}
  xpath:
  xslt:
