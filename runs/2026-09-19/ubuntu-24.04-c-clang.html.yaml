platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001255, iterations_per_second: 796876.245738}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003690, iterations_per_second: 271032.090114}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003281, iterations_per_second: 304794.416130}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001281035, iterations_per_second: 780.618797}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003818885, iterations_per_second: 261.856514}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000690116, iterations_per_second: 1449.032457}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.056366895, iterations_per_second: 17.740910}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.079736116, iterations_per_second: 12.541368}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.006772731, iterations_per_second: 147.650925}
  xslt:
