platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002470, iterations_per_second: 404923.873895}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007181, iterations_per_second: 139248.614487}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005758, iterations_per_second: 173677.446172}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002145662, iterations_per_second: 466.056702}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.006715792, iterations_per_second: 148.902758}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001486741, iterations_per_second: 672.612260}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022673938, iterations_per_second: 44.103499}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.067882222, iterations_per_second: 14.731398}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014990364, iterations_per_second: 66.709521}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003542, iterations_per_second: 282358.256132}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007369, iterations_per_second: 135707.306454}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002371527, iterations_per_second: 421.669245}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001957200, iterations_per_second: 510.934074}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.024915645, iterations_per_second: 40.135425}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019733615, iterations_per_second: 50.674952}
  xpath:
  xslt:
