platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001954, iterations_per_second: 511796.918419}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004980, iterations_per_second: 200791.117017}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004014, iterations_per_second: 249128.051756}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001700340, iterations_per_second: 588.117671}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003895343, iterations_per_second: 256.716781}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000971835, iterations_per_second: 1028.981610}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018019782, iterations_per_second: 55.494567}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.040137322, iterations_per_second: 24.914467}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009988595, iterations_per_second: 100.114180}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002474, iterations_per_second: 404269.081496}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005199, iterations_per_second: 192355.781230}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001838160, iterations_per_second: 544.022283}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001306389, iterations_per_second: 765.468980}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019968648, iterations_per_second: 50.078503}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013762677, iterations_per_second: 72.660283}
  xpath:
  xslt:
