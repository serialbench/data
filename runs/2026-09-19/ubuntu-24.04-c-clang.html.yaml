platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002606, iterations_per_second: 383744.579718}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006785, iterations_per_second: 147390.451992}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005700, iterations_per_second: 175450.908799}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002191119, iterations_per_second: 456.387879}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005137852, iterations_per_second: 194.633866}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001397320, iterations_per_second: 715.655854}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022460756, iterations_per_second: 44.522099}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.052304281, iterations_per_second: 19.118894}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014764594, iterations_per_second: 67.729597}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003374, iterations_per_second: 296357.763439}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007408, iterations_per_second: 134992.845358}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002338644, iterations_per_second: 427.598154}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002188668, iterations_per_second: 456.898969}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.024840581, iterations_per_second: 40.256707}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019567944, iterations_per_second: 51.103989}
