platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000957, iterations_per_second: 1045150.502125}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001233, iterations_per_second: 810701.257924}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000680226, iterations_per_second: 1470.099643}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001904861, iterations_per_second: 524.972596}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015147849, iterations_per_second: 66.015974}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032769910, iterations_per_second: 30.515799}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000375, iterations_per_second: 2665955.759380}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000329396, iterations_per_second: 3035.859573}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004253218, iterations_per_second: 235.116093}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001661, iterations_per_second: 602155.716726}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001530, iterations_per_second: 653466.640620}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001867037, iterations_per_second: 535.608025}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002151685, iterations_per_second: 464.752043}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023841512, iterations_per_second: 41.943649}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.037445684, iterations_per_second: 26.705347}
  xpath:
  xslt:
