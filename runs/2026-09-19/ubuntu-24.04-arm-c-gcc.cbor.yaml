platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000957, iterations_per_second: 1045150.502125}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001245, iterations_per_second: 803341.901877}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000658642, iterations_per_second: 1518.274714}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001899081, iterations_per_second: 526.570391}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014435133, iterations_per_second: 69.275427}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031335724, iterations_per_second: 31.912459}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000375, iterations_per_second: 2665245.123361}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000322028, iterations_per_second: 3105.323248}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004208662, iterations_per_second: 237.605206}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001647, iterations_per_second: 607348.920323}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001504, iterations_per_second: 664849.407322}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001842824, iterations_per_second: 542.645516}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002158862, iterations_per_second: 463.207076}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023102197, iterations_per_second: 43.285926}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035298969, iterations_per_second: 28.329439}
  xpath:
  xslt:
