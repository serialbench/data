platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000942, iterations_per_second: 1062134.888619}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001242, iterations_per_second: 805477.244314}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000660183, iterations_per_second: 1514.730757}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001878939, iterations_per_second: 532.215350}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013403798, iterations_per_second: 74.605720}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030357973, iterations_per_second: 32.940276}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000391, iterations_per_second: 2556890.806629}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000334466, iterations_per_second: 2989.840522}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004241830, iterations_per_second: 235.747307}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001665, iterations_per_second: 600708.836594}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001542, iterations_per_second: 648340.247885}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001847306, iterations_per_second: 541.328930}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002146952, iterations_per_second: 465.776599}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021821244, iterations_per_second: 45.826902}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033903204, iterations_per_second: 29.495737}
  xpath:
  xslt:
