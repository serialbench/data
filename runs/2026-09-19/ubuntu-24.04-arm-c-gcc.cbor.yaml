platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000954, iterations_per_second: 1047888.504175}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001241, iterations_per_second: 805996.615749}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000662440, iterations_per_second: 1509.571438}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001899514, iterations_per_second: 526.450358}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014790840, iterations_per_second: 67.609412}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033268592, iterations_per_second: 30.058381}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000363, iterations_per_second: 2754062.242983}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000322787, iterations_per_second: 3098.018198}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004200639, iterations_per_second: 238.059019}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001645, iterations_per_second: 607718.019597}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001518, iterations_per_second: 658631.364549}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001841107, iterations_per_second: 543.151386}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002155417, iterations_per_second: 463.947276}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023470645, iterations_per_second: 42.606413}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.038380204, iterations_per_second: 26.055099}
  xpath:
  xslt:
