platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000948, iterations_per_second: 1054852.321947}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001231, iterations_per_second: 812215.724792}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000652420, iterations_per_second: 1532.754191}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001887797, iterations_per_second: 529.718066}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014440208, iterations_per_second: 69.251080}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031153719, iterations_per_second: 32.098896}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000370, iterations_per_second: 2699784.021775}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000322894, iterations_per_second: 3096.991582}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004225803, iterations_per_second: 236.641415}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001646, iterations_per_second: 607385.811541}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001524, iterations_per_second: 656167.978554}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001906709, iterations_per_second: 524.463788}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002178713, iterations_per_second: 458.986497}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022909488, iterations_per_second: 43.650037}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035023286, iterations_per_second: 28.552432}
  xpath:
  xslt:
