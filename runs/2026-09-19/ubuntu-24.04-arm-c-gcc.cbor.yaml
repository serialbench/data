platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000949, iterations_per_second: 1054073.996016}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001234, iterations_per_second: 810635.538426}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000650496, iterations_per_second: 1537.287681}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001893548, iterations_per_second: 528.109044}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014441026, iterations_per_second: 69.247157}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032684635, iterations_per_second: 30.595416}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000384, iterations_per_second: 2604166.682493}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000323350, iterations_per_second: 3092.627280}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004221776, iterations_per_second: 236.867138}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001659, iterations_per_second: 602736.422666}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001523, iterations_per_second: 656555.710326}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001814691, iterations_per_second: 551.057903}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002148299, iterations_per_second: 465.484553}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023305073, iterations_per_second: 42.909113}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.036458380, iterations_per_second: 27.428536}
  xpath:
  xslt:
