platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000954, iterations_per_second: 1048657.731370}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001246, iterations_per_second: 802375.025227}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000690301, iterations_per_second: 1448.642718}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001892464, iterations_per_second: 528.411544}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013145279, iterations_per_second: 76.072938}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.029776213, iterations_per_second: 33.583854}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000378, iterations_per_second: 2642706.130763}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000329492, iterations_per_second: 3034.978123}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004464673, iterations_per_second: 223.980569}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001737, iterations_per_second: 575804.685228}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001547, iterations_per_second: 646370.624865}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001810303, iterations_per_second: 552.393817}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002150396, iterations_per_second: 465.030555}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021492316, iterations_per_second: 46.528257}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034662402, iterations_per_second: 28.849703}
  xpath:
  xslt:
