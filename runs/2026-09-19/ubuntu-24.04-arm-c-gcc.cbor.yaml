platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000958, iterations_per_second: 1043514.562374}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001226, iterations_per_second: 815394.649683}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000660131, iterations_per_second: 1514.850840}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001889297, iterations_per_second: 529.297405}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013956133, iterations_per_second: 71.653086}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030759494, iterations_per_second: 32.510288}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000366, iterations_per_second: 2729257.627811}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000320504, iterations_per_second: 3120.089110}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004190583, iterations_per_second: 238.630281}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001669, iterations_per_second: 599268.893020}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001565, iterations_per_second: 638773.555993}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001851734, iterations_per_second: 540.034465}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002143649, iterations_per_second: 466.494281}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022230104, iterations_per_second: 44.984045}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033590867, iterations_per_second: 29.769997}
  xpath:
  xslt:
