platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000933, iterations_per_second: 1072041.169140}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000994, iterations_per_second: 1005631.536753}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001188401, iterations_per_second: 841.466575}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001656268, iterations_per_second: 603.767145}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014098056, iterations_per_second: 70.931765}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.028147896, iterations_per_second: 35.526634}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000370, iterations_per_second: 2705627.731434}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000343380, iterations_per_second: 2912.225523}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004269079, iterations_per_second: 234.242561}
  xslt:
