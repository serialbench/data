platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000928, iterations_per_second: 1077470.091482}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001229, iterations_per_second: 813735.869996}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000677385, iterations_per_second: 1476.266070}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001885432, iterations_per_second: 530.382521}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014077796, iterations_per_second: 71.033846}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031467074, iterations_per_second: 31.779250}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000376, iterations_per_second: 2659574.609896}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000330180, iterations_per_second: 3028.651039}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004235923, iterations_per_second: 236.076057}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001590, iterations_per_second: 628772.642221}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001521, iterations_per_second: 657548.661952}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001866330, iterations_per_second: 535.811019}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002158562, iterations_per_second: 463.271382}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022614717, iterations_per_second: 44.218992}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033452051, iterations_per_second: 29.893533}
  xpath:
  xslt:
