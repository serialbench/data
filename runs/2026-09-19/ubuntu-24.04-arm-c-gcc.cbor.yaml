platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000913, iterations_per_second: 1095530.238091}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001214, iterations_per_second: 823926.835378}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000669251, iterations_per_second: 1494.208448}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001885569, iterations_per_second: 530.343891}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013129481, iterations_per_second: 76.164473}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.029616130, iterations_per_second: 33.765384}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000386, iterations_per_second: 2592688.601793}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000330894, iterations_per_second: 3022.112799}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004275202, iterations_per_second: 233.907076}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001588, iterations_per_second: 629683.268349}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001493, iterations_per_second: 669837.230719}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001810798, iterations_per_second: 552.242611}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002148760, iterations_per_second: 465.384687}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021399890, iterations_per_second: 46.729212}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033172482, iterations_per_second: 30.145468}
  xpath:
  xslt:
