platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000966, iterations_per_second: 1035518.256362}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001236, iterations_per_second: 809061.501730}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000645713, iterations_per_second: 1548.675650}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001899928, iterations_per_second: 526.335827}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013293825, iterations_per_second: 75.222895}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030606173, iterations_per_second: 32.673147}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000371, iterations_per_second: 2693965.294342}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000320534, iterations_per_second: 3119.793845}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004171367, iterations_per_second: 239.729566}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001656, iterations_per_second: 603828.273481}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001530, iterations_per_second: 653423.939569}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001830315, iterations_per_second: 546.353943}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002163631, iterations_per_second: 462.186020}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022106908, iterations_per_second: 45.234729}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033804450, iterations_per_second: 29.581904}
  xpath:
  xslt:
