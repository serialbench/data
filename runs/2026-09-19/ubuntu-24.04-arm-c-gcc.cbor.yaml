platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000942, iterations_per_second: 1061233.153542}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001241, iterations_per_second: 805996.613902}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000696779, iterations_per_second: 1435.175285}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001885737, iterations_per_second: 530.296549}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013279256, iterations_per_second: 75.305424}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.029899784, iterations_per_second: 33.445058}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000378, iterations_per_second: 2642706.130763}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000329989, iterations_per_second: 3030.400983}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004248893, iterations_per_second: 235.355421}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001657, iterations_per_second: 603573.152826}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001528, iterations_per_second: 654493.095275}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001838196, iterations_per_second: 544.011629}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002134131, iterations_per_second: 468.574797}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021983518, iterations_per_second: 45.488625}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034191123, iterations_per_second: 29.247358}
  xpath:
  xslt:
