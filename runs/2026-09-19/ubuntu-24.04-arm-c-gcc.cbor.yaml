platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000929, iterations_per_second: 1076658.053274}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001270, iterations_per_second: 787649.646451}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001161739, iterations_per_second: 860.778540}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001898040, iterations_per_second: 526.859194}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013360094, iterations_per_second: 74.849773}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030273745, iterations_per_second: 33.031923}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000370, iterations_per_second: 2699783.980342}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000354940, iterations_per_second: 2817.380231}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004288927, iterations_per_second: 233.158550}
  xslt:
