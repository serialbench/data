platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002560, iterations_per_second: 390640.258128}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007645, iterations_per_second: 130797.603772}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006086, iterations_per_second: 164300.735976}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002438396, iterations_per_second: 410.105716}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.007286723, iterations_per_second: 137.235895}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001384307, iterations_per_second: 722.382939}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.048996136, iterations_per_second: 20.409773}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.098077219, iterations_per_second: 10.196048}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014031508, iterations_per_second: 71.268177}
  xslt:
