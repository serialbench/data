platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002458, iterations_per_second: 406785.176776}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005762, iterations_per_second: 173544.826672}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005714, iterations_per_second: 175011.813279}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002040499, iterations_per_second: 490.076202}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004806653, iterations_per_second: 208.044989}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001316572, iterations_per_second: 759.548281}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023357163, iterations_per_second: 42.813419}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.049715038, iterations_per_second: 20.114638}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013780357, iterations_per_second: 72.567060}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003095, iterations_per_second: 323080.899426}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006888, iterations_per_second: 145184.238783}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002208422, iterations_per_second: 452.811940}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001653918, iterations_per_second: 604.624897}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023935725, iterations_per_second: 41.778555}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018251983, iterations_per_second: 54.788567}
  xpath:
  xslt:
