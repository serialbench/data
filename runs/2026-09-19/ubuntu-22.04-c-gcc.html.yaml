platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002715, iterations_per_second: 368310.558918}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000009321, iterations_per_second: 107280.022311}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005912, iterations_per_second: 169147.496608}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002354010, iterations_per_second: 424.807092}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005404231, iterations_per_second: 185.040214}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001476283, iterations_per_second: 677.377052}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.024735091, iterations_per_second: 40.428394}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.054476999, iterations_per_second: 18.356371}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014971191, iterations_per_second: 66.794953}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003480, iterations_per_second: 287389.354911}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007397, iterations_per_second: 135193.597162}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002587353, iterations_per_second: 386.495437}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001886135, iterations_per_second: 530.184649}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.027050648, iterations_per_second: 36.967691}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019708124, iterations_per_second: 50.740497}
  xpath:
  xslt:
