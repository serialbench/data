platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002781, iterations_per_second: 359544.098417}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006968, iterations_per_second: 143511.143612}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005697, iterations_per_second: 175540.225111}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002386619, iterations_per_second: 419.002782}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005386355, iterations_per_second: 185.654318}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001451649, iterations_per_second: 688.871759}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025764233, iterations_per_second: 38.813498}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.055519969, iterations_per_second: 18.011537}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014981050, iterations_per_second: 66.750995}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003420, iterations_per_second: 292363.466000}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007178, iterations_per_second: 139324.277182}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002617530, iterations_per_second: 382.039556}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001861093, iterations_per_second: 537.318662}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.027624431, iterations_per_second: 36.199841}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.021881301, iterations_per_second: 45.701122}
  xpath:
  xslt:
