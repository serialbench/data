platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002747, iterations_per_second: 364006.988943}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006917, iterations_per_second: 144569.255888}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006381, iterations_per_second: 156715.248323}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002356420, iterations_per_second: 424.372505}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005534368, iterations_per_second: 180.689116}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001440729, iterations_per_second: 694.092899}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.027775169, iterations_per_second: 36.003381}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.057708703, iterations_per_second: 17.328409}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014877814, iterations_per_second: 67.214175}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003476, iterations_per_second: 287720.105956}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010085, iterations_per_second: 99157.164082}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002594038, iterations_per_second: 385.499364}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002733925, iterations_per_second: 365.774526}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.027505773, iterations_per_second: 36.356004}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.021941856, iterations_per_second: 45.574996}
  xpath:
  xslt:
