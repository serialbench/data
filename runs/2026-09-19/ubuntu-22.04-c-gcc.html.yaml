platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002127, iterations_per_second: 470079.443078}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005014, iterations_per_second: 199437.585997}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004803, iterations_per_second: 208207.541284}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001832919, iterations_per_second: 545.577945}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004388644, iterations_per_second: 227.860815}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001141335, iterations_per_second: 876.166945}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020907648, iterations_per_second: 47.829388}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.046626739, iterations_per_second: 21.446921}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013356927, iterations_per_second: 74.867520}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002654, iterations_per_second: 376818.147761}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005733, iterations_per_second: 174443.959877}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002146986, iterations_per_second: 465.769295}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001461986, iterations_per_second: 684.001234}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022094508, iterations_per_second: 45.260116}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017070266, iterations_per_second: 58.581395}
  xpath:
  xslt:
