platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002005, iterations_per_second: 498753.117476}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004868, iterations_per_second: 205406.293741}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004183, iterations_per_second: 239045.729382}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001828079, iterations_per_second: 547.022212}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003872479, iterations_per_second: 258.232539}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001008778, iterations_per_second: 991.298383}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018922425, iterations_per_second: 52.847349}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.039754285, iterations_per_second: 25.154521}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010308669, iterations_per_second: 97.005734}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002490, iterations_per_second: 401638.685961}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005177, iterations_per_second: 193169.525501}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001948748, iterations_per_second: 513.149894}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001306711, iterations_per_second: 765.279962}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020866302, iterations_per_second: 47.924160}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014037283, iterations_per_second: 71.238857}
  xpath:
  xslt:
