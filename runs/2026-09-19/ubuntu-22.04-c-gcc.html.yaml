platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001258, iterations_per_second: 794975.754147}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003069, iterations_per_second: 325881.508855}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003129, iterations_per_second: 319621.567350}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001131484, iterations_per_second: 883.795347}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002498030, iterations_per_second: 400.315502}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000690083, iterations_per_second: 1449.101050}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.012088203, iterations_per_second: 82.725282}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.026627722, iterations_per_second: 37.554846}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.007174055, iterations_per_second: 139.391181}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001588, iterations_per_second: 629564.339514}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003832, iterations_per_second: 260973.954354}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001195938, iterations_per_second: 836.163981}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000879566, iterations_per_second: 1136.923916}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.013089678, iterations_per_second: 76.396073}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009350245, iterations_per_second: 106.949069}
  xpath:
  xslt:
