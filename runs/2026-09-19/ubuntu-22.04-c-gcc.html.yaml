platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002518, iterations_per_second: 397187.909636}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007186, iterations_per_second: 139155.603744}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006048, iterations_per_second: 165335.714249}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002468847, iterations_per_second: 405.047431}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.007056936, iterations_per_second: 141.704552}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001389128, iterations_per_second: 719.876066}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.047805735, iterations_per_second: 20.917992}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.096738716, iterations_per_second: 10.337123}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013969159, iterations_per_second: 71.586271}
  xslt:
