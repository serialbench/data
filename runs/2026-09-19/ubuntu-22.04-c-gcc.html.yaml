platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001981, iterations_per_second: 504821.042902}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005437, iterations_per_second: 183918.193112}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004248, iterations_per_second: 235382.733554}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001767264, iterations_per_second: 565.846309}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005208320, iterations_per_second: 192.000504}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001031603, iterations_per_second: 969.364840}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018572397, iterations_per_second: 53.843346}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.052874421, iterations_per_second: 18.912737}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010564309, iterations_per_second: 94.658344}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002454, iterations_per_second: 407564.395916}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005175, iterations_per_second: 193244.183228}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001895364, iterations_per_second: 527.603048}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001323209, iterations_per_second: 755.738321}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020299229, iterations_per_second: 49.262955}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014062980, iterations_per_second: 71.108684}
  xpath:
  xslt:
