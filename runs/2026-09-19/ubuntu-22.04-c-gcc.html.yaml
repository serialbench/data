platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002149, iterations_per_second: 465441.004939}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004987, iterations_per_second: 200509.293627}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004749, iterations_per_second: 210570.646515}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001778232, iterations_per_second: 562.356213}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004177035, iterations_per_second: 239.404286}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001104572, iterations_per_second: 905.328037}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019153318, iterations_per_second: 52.210275}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.042734126, iterations_per_second: 23.400502}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012058185, iterations_per_second: 82.931221}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002675, iterations_per_second: 373845.751245}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005754, iterations_per_second: 173789.124222}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001943662, iterations_per_second: 514.492834}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001506144, iterations_per_second: 663.947139}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021777868, iterations_per_second: 45.918177}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015769398, iterations_per_second: 63.413962}
  xpath:
  xslt:
