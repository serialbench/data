platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002764, iterations_per_second: 361781.410521}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006938, iterations_per_second: 144135.833559}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005875, iterations_per_second: 170212.765646}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002372485, iterations_per_second: 421.498918}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005365000, iterations_per_second: 186.393301}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001448593, iterations_per_second: 690.324867}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.024865536, iterations_per_second: 40.216306}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.054779782, iterations_per_second: 18.254910}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014723813, iterations_per_second: 67.917190}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003457, iterations_per_second: 289234.685166}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007417, iterations_per_second: 134829.036631}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002573480, iterations_per_second: 388.578889}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001883070, iterations_per_second: 531.047704}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.027064353, iterations_per_second: 36.948971}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019566629, iterations_per_second: 51.107424}
  xpath:
  xslt:
