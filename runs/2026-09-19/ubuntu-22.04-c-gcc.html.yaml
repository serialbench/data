platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002714, iterations_per_second: 368459.838067}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006853, iterations_per_second: 145923.623568}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010046, iterations_per_second: 99544.088085}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002369316, iterations_per_second: 422.062739}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005489788, iterations_per_second: 182.156408}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001446453, iterations_per_second: 691.346349}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.024954719, iterations_per_second: 40.072581}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.055913721, iterations_per_second: 17.884698}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014720230, iterations_per_second: 67.933721}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003402, iterations_per_second: 293910.181036}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007309, iterations_per_second: 136823.238051}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002599347, iterations_per_second: 384.712056}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001869588, iterations_per_second: 534.877298}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.027147070, iterations_per_second: 36.836388}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019716679, iterations_per_second: 50.718481}
  xpath:
  xslt:
