platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000007410, iterations_per_second: 134954.587751}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006029, iterations_per_second: 165856.732903}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.007434472, iterations_per_second: 134.508537}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001391407, iterations_per_second: 718.697146}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.098069293, iterations_per_second: 10.196872}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014090932, iterations_per_second: 70.967627}
  xslt:
