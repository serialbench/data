platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
benchmark_result:
  parsing:
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006047, iterations_per_second: 165363.054612}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001449856, iterations_per_second: 689.723669}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014447648, iterations_per_second: 69.215418}
  xslt:
