platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005457, iterations_per_second: 183250.870431}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004520, iterations_per_second: 221258.518582}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.005416408, iterations_per_second: 184.624190}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001062554, iterations_per_second: 941.128344}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.091445313, iterations_per_second: 10.935498}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011115320, iterations_per_second: 89.965921}
  xslt:
