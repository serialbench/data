platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002539, iterations_per_second: 393902.391084}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007314, iterations_per_second: 136731.568589}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006030, iterations_per_second: 165829.229066}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002357423, iterations_per_second: 424.192070}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.007053631, iterations_per_second: 141.770961}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001394669, iterations_per_second: 717.015837}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.052002842, iterations_per_second: 19.229718}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.093949907, iterations_per_second: 10.643970}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014206243, iterations_per_second: 70.391588}
  xslt:
