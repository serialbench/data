platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001971, iterations_per_second: 507382.415222}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004863, iterations_per_second: 205617.469280}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004156, iterations_per_second: 240598.609197}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001755306, iterations_per_second: 569.701129}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003844914, iterations_per_second: 260.083863}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001004436, iterations_per_second: 995.583261}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018621199, iterations_per_second: 53.702235}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.039237960, iterations_per_second: 25.485525}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010363514, iterations_per_second: 96.492367}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002501, iterations_per_second: 399872.041491}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005097, iterations_per_second: 196205.387827}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001921070, iterations_per_second: 520.543239}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001315532, iterations_per_second: 760.148553}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020346003, iterations_per_second: 49.149703}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013808424, iterations_per_second: 72.419561}
  xpath:
  xslt:
