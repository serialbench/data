platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002107, iterations_per_second: 474585.923963}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004884, iterations_per_second: 204741.820274}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004049, iterations_per_second: 246974.560559}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001873269, iterations_per_second: 533.826067}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003937070, iterations_per_second: 253.996013}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001001275, iterations_per_second: 998.726624}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019700927, iterations_per_second: 50.759033}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.040121759, iterations_per_second: 24.924132}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010294961, iterations_per_second: 97.134899}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002602, iterations_per_second: 384334.525349}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005085, iterations_per_second: 196672.304521}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002009550, iterations_per_second: 497.623764}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001330438, iterations_per_second: 751.632358}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021335972, iterations_per_second: 46.869203}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013829649, iterations_per_second: 72.308415}
  xpath:
  xslt:
