platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000540, iterations_per_second: 1851851.844831}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003143, iterations_per_second: 318217.978997}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000058471, iterations_per_second: 17102.495252}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000312478, iterations_per_second: 3200.225296}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001138064, iterations_per_second: 878.685206}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003758160, iterations_per_second: 266.087660}
  xslt:
