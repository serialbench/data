platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000549, iterations_per_second: 1822157.434624}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003162, iterations_per_second: 316285.542682}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000065981, iterations_per_second: 15155.954775}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000310062, iterations_per_second: 3225.161419}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001075814, iterations_per_second: 929.528710}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003803930, iterations_per_second: 262.886015}
  xslt:
