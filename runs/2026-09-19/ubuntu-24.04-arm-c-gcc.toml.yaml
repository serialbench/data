platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000554, iterations_per_second: 1803751.811709}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004677, iterations_per_second: 213793.988124}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000058399, iterations_per_second: 17123.483148}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000312915, iterations_per_second: 3195.752632}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001066162, iterations_per_second: 937.943765}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003774174, iterations_per_second: 264.958637}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000790, iterations_per_second: 1265182.190739}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000093389, iterations_per_second: 10707.860997}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001469700, iterations_per_second: 680.410968}
  xpath:
  xslt:
