platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000538, iterations_per_second: 1857355.129499}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003125, iterations_per_second: 319959.045319}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000058596, iterations_per_second: 17065.914250}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000314082, iterations_per_second: 3183.885295}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001069885, iterations_per_second: 934.679896}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003759052, iterations_per_second: 266.024519}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000751, iterations_per_second: 1331203.403505}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000092642, iterations_per_second: 10794.201356}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001491562, iterations_per_second: 670.438104}
  xpath:
  xslt:
