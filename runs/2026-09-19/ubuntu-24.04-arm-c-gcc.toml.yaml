platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000543, iterations_per_second: 1840942.535492}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003189, iterations_per_second: 313528.767319}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000141572, iterations_per_second: 7063.543639}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000313546, iterations_per_second: 3189.328083}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001079982, iterations_per_second: 925.941358}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003744987, iterations_per_second: 267.023624}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000778, iterations_per_second: 1286008.218056}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000090593, iterations_per_second: 11038.380446}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001488683, iterations_per_second: 671.734681}
  xpath:
  xslt:
