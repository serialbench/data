platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000555, iterations_per_second: 1801152.736251}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003115, iterations_per_second: 321027.287339}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000058002, iterations_per_second: 17240.883884}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000312850, iterations_per_second: 3196.420010}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001072158, iterations_per_second: 932.698352}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003750081, iterations_per_second: 266.660907}
  xslt:
