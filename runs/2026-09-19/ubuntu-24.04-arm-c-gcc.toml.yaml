platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000561, iterations_per_second: 1783166.910515}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003215, iterations_per_second: 311012.969728}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000058255, iterations_per_second: 17165.908506}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000314895, iterations_per_second: 3175.661729}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001072785, iterations_per_second: 932.153227}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003781251, iterations_per_second: 264.462740}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000778, iterations_per_second: 1284686.538077}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000091123, iterations_per_second: 10974.217903}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001483477, iterations_per_second: 674.092015}
  xpath:
  xslt:
