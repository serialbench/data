platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000559, iterations_per_second: 1788268.925846}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003109, iterations_per_second: 321605.453761}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000057034, iterations_per_second: 17533.298649}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000312162, iterations_per_second: 3203.461447}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001043402, iterations_per_second: 958.403377}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003747454, iterations_per_second: 266.847839}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000762, iterations_per_second: 1311819.495756}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000091030, iterations_per_second: 10985.389434}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001456997, iterations_per_second: 686.343211}
  xpath:
  xslt:
