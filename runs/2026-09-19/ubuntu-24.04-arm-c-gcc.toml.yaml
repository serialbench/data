platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000535, iterations_per_second: 1868460.382879}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003106, iterations_per_second: 321988.602771}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000053732, iterations_per_second: 18610.883655}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000313165, iterations_per_second: 3193.208259}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001006288, iterations_per_second: 993.751292}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003726431, iterations_per_second: 268.353285}
  xslt:
