platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000568, iterations_per_second: 1760563.375565}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003162, iterations_per_second: 316225.532210}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000057517, iterations_per_second: 17386.264851}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000310940, iterations_per_second: 3216.057992}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001078282, iterations_per_second: 927.401181}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003739562, iterations_per_second: 267.410996}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000774, iterations_per_second: 1291322.311471}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000092712, iterations_per_second: 10786.090258}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001473164, iterations_per_second: 678.811049}
  xpath:
  xslt:
