platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000557, iterations_per_second: 1795977.009575}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003138, iterations_per_second: 318654.005450}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000058004, iterations_per_second: 17240.289406}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000314080, iterations_per_second: 3183.898811}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001058544, iterations_per_second: 944.693844}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003791580, iterations_per_second: 263.742292}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000756, iterations_per_second: 1322926.316086}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000090529, iterations_per_second: 11046.184095}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001451835, iterations_per_second: 688.783505}
  xpath:
  xslt:
