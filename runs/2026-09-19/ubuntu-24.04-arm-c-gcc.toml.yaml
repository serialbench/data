platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000574, iterations_per_second: 1743375.159666}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003140, iterations_per_second: 318461.194339}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000057663, iterations_per_second: 17342.042892}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000311675, iterations_per_second: 3208.466930}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001076703, iterations_per_second: 928.761228}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003781736, iterations_per_second: 264.428823}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000758, iterations_per_second: 1318565.390574}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000095857, iterations_per_second: 10432.206309}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001487453, iterations_per_second: 672.290150}
  xpath:
  xslt:
