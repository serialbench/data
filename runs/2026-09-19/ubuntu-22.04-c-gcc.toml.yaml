platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000526, iterations_per_second: 1900779.325265}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002865, iterations_per_second: 349040.139736}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000065948, iterations_per_second: 15163.462121}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000277800, iterations_per_second: 3599.716342}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001110611, iterations_per_second: 900.405272}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003490602, iterations_per_second: 286.483535}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000769, iterations_per_second: 1299883.012831}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000094194, iterations_per_second: 10616.349887}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001633170, iterations_per_second: 612.306129}
  xpath:
  xslt:
