platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000441, iterations_per_second: 2269117.310372}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003352, iterations_per_second: 298329.355714}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000065248, iterations_per_second: 15326.061956}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000341457, iterations_per_second: 2928.623586}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001436121, iterations_per_second: 696.320157}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004122193, iterations_per_second: 242.589321}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000617, iterations_per_second: 1621008.262781}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000113851, iterations_per_second: 8783.384180}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001810915, iterations_per_second: 552.207033}
  xpath:
  xslt:
