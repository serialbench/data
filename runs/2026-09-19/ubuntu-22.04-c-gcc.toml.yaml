platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000575, iterations_per_second: 1738828.063275}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003815, iterations_per_second: 262116.326359}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000077575, iterations_per_second: 12890.806280}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000403512, iterations_per_second: 2478.238997}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001720828, iterations_per_second: 581.115602}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004748474, iterations_per_second: 210.593972}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000853, iterations_per_second: 1173020.512440}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000136595, iterations_per_second: 7320.930053}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002258902, iterations_per_second: 442.692954}
  xpath:
  xslt:
