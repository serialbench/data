platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000450, iterations_per_second: 2224199.272950}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004301, iterations_per_second: 232531.100986}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000062297, iterations_per_second: 16052.051453}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000341692, iterations_per_second: 2926.609416}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001447315, iterations_per_second: 690.934593}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004070295, iterations_per_second: 245.682438}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000628, iterations_per_second: 1592356.693071}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000104254, iterations_per_second: 9591.958102}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001784735, iterations_per_second: 560.307273}
  xpath:
  xslt:
