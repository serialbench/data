platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000587, iterations_per_second: 1704448.611247}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003096, iterations_per_second: 323007.848942}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000058943, iterations_per_second: 16965.542982}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000304973, iterations_per_second: 3278.978795}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001266171, iterations_per_second: 789.782739}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003700225, iterations_per_second: 270.253836}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000836, iterations_per_second: 1196458.482559}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000102569, iterations_per_second: 9749.534460}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001480133, iterations_per_second: 675.614962}
  xpath:
  xslt:
