platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000461, iterations_per_second: 2170609.930858}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003478, iterations_per_second: 287513.297401}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000072066, iterations_per_second: 13876.104885}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000359457, iterations_per_second: 2781.971342}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001486224, iterations_per_second: 672.846085}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004308311, iterations_per_second: 232.109520}
  xslt:
