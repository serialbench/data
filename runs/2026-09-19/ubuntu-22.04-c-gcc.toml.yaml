platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000515, iterations_per_second: 1940240.587114}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002761, iterations_per_second: 362174.495577}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000062063, iterations_per_second: 16112.659719}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000278924, iterations_per_second: 3585.206006}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001014052, iterations_per_second: 986.142722}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003352844, iterations_per_second: 298.254258}
  xslt:
