platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000569, iterations_per_second: 1757469.245916}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003335, iterations_per_second: 299886.043220}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000065232, iterations_per_second: 15329.821100}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000335751, iterations_per_second: 2978.400639}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001201918, iterations_per_second: 832.003514}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003999202, iterations_per_second: 250.049885}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000844, iterations_per_second: 1184553.424053}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000108653, iterations_per_second: 9203.583262}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001698800, iterations_per_second: 588.650812}
  xpath:
  xslt:
