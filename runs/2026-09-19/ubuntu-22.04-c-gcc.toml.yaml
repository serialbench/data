platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000591, iterations_per_second: 1691761.118588}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003783, iterations_per_second: 264333.483220}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000097786, iterations_per_second: 10226.412778}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000393559, iterations_per_second: 2540.915085}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001726008, iterations_per_second: 579.371590}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004683127, iterations_per_second: 213.532539}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000876, iterations_per_second: 1142074.006432}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000134378, iterations_per_second: 7441.712784}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002218347, iterations_per_second: 450.786103}
  xpath:
  xslt:
