platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000594, iterations_per_second: 1683218.318084}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003981, iterations_per_second: 251224.720332}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000077709, iterations_per_second: 12868.577507}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000419180, iterations_per_second: 2385.610001}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001732830, iterations_per_second: 577.090655}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004938671, iterations_per_second: 202.483624}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000864, iterations_per_second: 1157943.489915}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000136789, iterations_per_second: 7310.529355}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002222033, iterations_per_second: 450.038321}
  xpath:
  xslt:
