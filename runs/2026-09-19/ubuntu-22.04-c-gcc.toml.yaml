platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000466, iterations_per_second: 2147305.129670}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003395, iterations_per_second: 294533.458794}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000068233, iterations_per_second: 14655.593553}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000340204, iterations_per_second: 2939.409943}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001421347, iterations_per_second: 703.557963}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004080055, iterations_per_second: 245.094735}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000643, iterations_per_second: 1555451.859859}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000102999, iterations_per_second: 9708.832125}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001828843, iterations_per_second: 546.793793}
  xpath:
  xslt:
