platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000564, iterations_per_second: 1773049.641646}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003909, iterations_per_second: 255800.271161}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000090563, iterations_per_second: 11042.037036}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000404530, iterations_per_second: 2472.004549}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001716291, iterations_per_second: 582.651776}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004753654, iterations_per_second: 210.364490}
  xslt:
