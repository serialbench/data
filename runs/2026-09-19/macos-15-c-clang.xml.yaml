platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.335437}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 249999.999921}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000684667, iterations_per_second: 1460.564752}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002220000, iterations_per_second: 450.450450}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.011294000, iterations_per_second: 88.542589}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.036283000, iterations_per_second: 27.561117}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000321, iterations_per_second: 3116235.643523}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000237556, iterations_per_second: 4209.539659}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.004483375, iterations_per_second: 223.046254}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000039500, iterations_per_second: 25316.455695}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000047300, iterations_per_second: 21141.649046}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002785667, iterations_per_second: 358.980495}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004544000, iterations_per_second: 220.070423}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.044419000, iterations_per_second: 22.512889}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.089242000, iterations_per_second: 11.205486}
