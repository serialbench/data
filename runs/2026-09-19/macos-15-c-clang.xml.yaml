platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000003300, iterations_per_second: 303030.302751}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238696}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000724333, iterations_per_second: 1380.579843}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002269000, iterations_per_second: 440.722785}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.014976000, iterations_per_second: 66.773504}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.034705000, iterations_per_second: 28.814292}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000317, iterations_per_second: 3157562.203320}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000258861, iterations_per_second: 3863.077095}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.004572500, iterations_per_second: 218.698742}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000056800, iterations_per_second: 17605.633798}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000046600, iterations_per_second: 21459.227459}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002821333, iterations_per_second: 354.442344}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.003983333, iterations_per_second: 251.046025}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.039408000, iterations_per_second: 25.375558}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.066943000, iterations_per_second: 14.938082}
