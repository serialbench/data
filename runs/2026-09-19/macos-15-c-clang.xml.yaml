platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.331490}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256684}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000690667, iterations_per_second: 1447.876448}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002220333, iterations_per_second: 450.382825}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.011380000, iterations_per_second: 87.873462}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.042325000, iterations_per_second: 23.626698}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000325, iterations_per_second: 3076923.057783}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000521139, iterations_per_second: 1918.875079}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.004380959, iterations_per_second: 228.260525}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000039100, iterations_per_second: 25575.447572}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000135200, iterations_per_second: 7396.449704}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002994333, iterations_per_second: 333.964155}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.003968667, iterations_per_second: 251.973795}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.055772000, iterations_per_second: 17.930144}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.077969000, iterations_per_second: 12.825610}
