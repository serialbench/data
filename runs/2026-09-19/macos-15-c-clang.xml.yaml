platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.319647}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 250000.000631}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000761667, iterations_per_second: 1312.910284}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002506000, iterations_per_second: 399.042298}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.011675000, iterations_per_second: 85.653105}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.039007000, iterations_per_second: 25.636424}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000317, iterations_per_second: 3158559.754431}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000228528, iterations_per_second: 4375.837791}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.004522292, iterations_per_second: 221.126809}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000047700, iterations_per_second: 20964.360585}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000048100, iterations_per_second: 20790.020788}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002998667, iterations_per_second: 333.481547}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.005099667, iterations_per_second: 196.091248}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.047176000, iterations_per_second: 21.197219}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.066669000, iterations_per_second: 14.999475}
