platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001145, iterations_per_second: 873286.175423}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000006295, iterations_per_second: 158858.758686}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000616483, iterations_per_second: 1622.104746}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002783008, iterations_per_second: 359.323437}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.012595681, iterations_per_second: 79.392293}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.061344360, iterations_per_second: 16.301417}
  xslt:
