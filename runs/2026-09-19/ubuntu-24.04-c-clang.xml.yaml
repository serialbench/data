platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001204, iterations_per_second: 830357.882417}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000006279, iterations_per_second: 159266.101782}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000633466, iterations_per_second: 1578.617520}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002610185, iterations_per_second: 383.114558}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.012074251, iterations_per_second: 82.820872}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.060487846, iterations_per_second: 16.532247}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000427, iterations_per_second: 2343017.808108}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000290183, iterations_per_second: 3446.105212}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.003792757, iterations_per_second: 263.660445}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000050979, iterations_per_second: 19615.958759}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000074856, iterations_per_second: 13359.018273}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002771335, iterations_per_second: 360.836925}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.004620855, iterations_per_second: 216.410151}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.046470278, iterations_per_second: 21.519131}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.088933986, iterations_per_second: 11.244295}
