platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000000656, iterations_per_second: 1524390.243260}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000004151, iterations_per_second: 240888.396492}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000350069, iterations_per_second: 2856.582423}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.001393274, iterations_per_second: 717.733741}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.006851869, iterations_per_second: 145.945581}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.040117094, iterations_per_second: 24.927030}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000215, iterations_per_second: 4642525.563254}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000148084, iterations_per_second: 6752.939217}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.001810314, iterations_per_second: 552.390359}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000026657, iterations_per_second: 37513.317229}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000037931, iterations_per_second: 26363.451820}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001551690, iterations_per_second: 644.458484}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.002749109, iterations_per_second: 363.754220}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.032906814, iterations_per_second: 30.388843}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.056064382, iterations_per_second: 17.836636}
