platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003504, iterations_per_second: 285371.839677}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000002995, iterations_per_second: 333845.229526}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001402061, iterations_per_second: 713.235899}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002805930, iterations_per_second: 356.388036}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019147279, iterations_per_second: 52.226742}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.035029069, iterations_per_second: 28.547718}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001128, iterations_per_second: 886760.663399}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000973505, iterations_per_second: 1027.216090}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.015614803, iterations_per_second: 64.041794}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004753, iterations_per_second: 210389.009247}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004707, iterations_per_second: 212449.543262}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002577356, iterations_per_second: 387.994468}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004350707, iterations_per_second: 229.847701}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.034963111, iterations_per_second: 28.601574}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.050591974, iterations_per_second: 19.765981}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001403, iterations_per_second: 712707.575762}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001213720, iterations_per_second: 823.913485}
