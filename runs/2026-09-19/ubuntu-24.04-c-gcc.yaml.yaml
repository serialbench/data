platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003569, iterations_per_second: 280159.130685}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000002979, iterations_per_second: 335739.465747}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001396944, iterations_per_second: 715.848138}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002821700, iterations_per_second: 354.396244}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.018394992, iterations_per_second: 54.362622}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.035620437, iterations_per_second: 28.073771}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001161, iterations_per_second: 861474.843262}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000975775, iterations_per_second: 1024.826070}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.015712764, iterations_per_second: 63.642527}
  xslt:
