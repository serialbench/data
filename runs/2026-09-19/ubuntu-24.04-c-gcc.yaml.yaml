platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004701, iterations_per_second: 212729.748019}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004474046, iterations_per_second: 223.511320}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055263296, iterations_per_second: 18.095193}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001504, iterations_per_second: 664982.044821}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001422524, iterations_per_second: 702.975837}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.024470112, iterations_per_second: 40.866180}
  xslt:
