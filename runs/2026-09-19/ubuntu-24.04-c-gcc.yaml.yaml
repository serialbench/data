platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004959, iterations_per_second: 201641.360792}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007917, iterations_per_second: 126313.661974}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001762530, iterations_per_second: 567.366122}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004513764, iterations_per_second: 221.544608}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024889649, iterations_per_second: 40.177344}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056639782, iterations_per_second: 17.655435}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001490, iterations_per_second: 671231.042051}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001450386, iterations_per_second: 689.471472}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021170161, iterations_per_second: 47.236296}
  xslt:
