platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003637, iterations_per_second: 274921.647408}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003541, iterations_per_second: 282390.150098}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001393717, iterations_per_second: 717.505778}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003172096, iterations_per_second: 315.248938}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.018053354, iterations_per_second: 55.391369}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.039885581, iterations_per_second: 25.071717}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833541.718664}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000943362, iterations_per_second: 1060.038833}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.015543445, iterations_per_second: 64.335802}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004677, iterations_per_second: 213816.844390}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004592, iterations_per_second: 217779.519957}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002481013, iterations_per_second: 403.061115}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004021360, iterations_per_second: 248.672070}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.032854734, iterations_per_second: 30.437014}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.050484434, iterations_per_second: 19.808086}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002139, iterations_per_second: 467464.472529}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001218755, iterations_per_second: 820.509230}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018618342, iterations_per_second: 53.710475}
  xpath:
  xslt:
