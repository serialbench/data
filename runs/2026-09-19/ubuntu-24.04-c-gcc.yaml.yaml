platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004544, iterations_per_second: 220046.209783}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004697, iterations_per_second: 212910.917978}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001708272, iterations_per_second: 585.386870}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004440629, iterations_per_second: 225.193306}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024498693, iterations_per_second: 40.818504}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055619211, iterations_per_second: 17.979399}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001493, iterations_per_second: 669926.978176}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001400129, iterations_per_second: 714.219904}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020649273, iterations_per_second: 48.427855}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006252, iterations_per_second: 159956.491825}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006690, iterations_per_second: 149488.003580}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003341053, iterations_per_second: 299.306865}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006160800, iterations_per_second: 162.316582}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045335948, iterations_per_second: 22.057551}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.077961171, iterations_per_second: 12.826898}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001821, iterations_per_second: 549028.220244}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001728410, iterations_per_second: 578.566540}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.024722833, iterations_per_second: 40.448439}
  xpath:
  xslt:
