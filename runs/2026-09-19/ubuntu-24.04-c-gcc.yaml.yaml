platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004498, iterations_per_second: 222296.321054}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004675, iterations_per_second: 213917.470645}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001698886, iterations_per_second: 588.621014}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004422627, iterations_per_second: 226.109974}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023580229, iterations_per_second: 42.408409}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055963362, iterations_per_second: 17.868834}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001528, iterations_per_second: 654535.934964}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001399796, iterations_per_second: 714.389641}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020743681, iterations_per_second: 48.207452}
  xslt:
