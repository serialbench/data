platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004561, iterations_per_second: 219274.202269}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004781, iterations_per_second: 209165.638169}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001762791, iterations_per_second: 567.282117}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004570439, iterations_per_second: 218.797363}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024165696, iterations_per_second: 41.380972}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055594022, iterations_per_second: 17.987545}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001506, iterations_per_second: 664142.924236}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001403881, iterations_per_second: 712.311255}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021143568, iterations_per_second: 47.295707}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000010347, iterations_per_second: 96644.502828}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006717, iterations_per_second: 148887.069117}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003345454, iterations_per_second: 298.913062}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006233845, iterations_per_second: 160.414631}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045689702, iterations_per_second: 21.886770}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.079153202, iterations_per_second: 12.633728}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001806, iterations_per_second: 553617.892095}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001689679, iterations_per_second: 591.828505}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.024405964, iterations_per_second: 40.973592}
  xpath:
  xslt:
