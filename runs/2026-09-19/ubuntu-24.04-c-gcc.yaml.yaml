platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005944, iterations_per_second: 168231.217041}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004361, iterations_per_second: 229315.721893}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001449718, iterations_per_second: 689.789166}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003667229, iterations_per_second: 272.685453}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019808456, iterations_per_second: 50.483490}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.049313692, iterations_per_second: 20.278344}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001298, iterations_per_second: 770356.675284}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001150641, iterations_per_second: 869.080548}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021434725, iterations_per_second: 46.653269}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007534, iterations_per_second: 132733.378453}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006395, iterations_per_second: 156367.275514}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002731699, iterations_per_second: 366.072498}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005339426, iterations_per_second: 187.286061}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.038206964, iterations_per_second: 26.173239}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.069739541, iterations_per_second: 14.339068}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001588, iterations_per_second: 629643.621163}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001401422, iterations_per_second: 713.560771}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.025568281, iterations_per_second: 39.110959}
  xpath:
  xslt:
