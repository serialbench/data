platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002466, iterations_per_second: 405564.342593}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000002267, iterations_per_second: 441033.783598}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000883415, iterations_per_second: 1131.970391}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002009236, iterations_per_second: 497.701531}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.012291492, iterations_per_second: 81.357088}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.024425737, iterations_per_second: 40.940423}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000868, iterations_per_second: 1151675.691320}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000613004, iterations_per_second: 1631.309838}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.011329602, iterations_per_second: 88.264354}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003371, iterations_per_second: 296639.079354}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004418, iterations_per_second: 226367.258152}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001690786, iterations_per_second: 591.441020}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002799537, iterations_per_second: 357.201881}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023452830, iterations_per_second: 42.638777}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.036417216, iterations_per_second: 27.459540}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001089, iterations_per_second: 918611.061418}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000793587, iterations_per_second: 1260.101816}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013512643, iterations_per_second: 74.004767}
  xpath:
  xslt:
