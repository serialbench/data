platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004654, iterations_per_second: 214873.547002}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004019, iterations_per_second: 248824.305137}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001798628, iterations_per_second: 555.979232}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003628250, iterations_per_second: 275.614991}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024420567, iterations_per_second: 40.949090}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.045531201, iterations_per_second: 21.962961}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001511, iterations_per_second: 661725.780844}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001221492, iterations_per_second: 818.670937}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.019285676, iterations_per_second: 51.851955}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006003, iterations_per_second: 166586.150037}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006054, iterations_per_second: 165180.046193}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003184407, iterations_per_second: 314.030210}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005247363, iterations_per_second: 190.571912}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.042800755, iterations_per_second: 23.364074}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.065228546, iterations_per_second: 15.330711}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001868, iterations_per_second: 535417.893261}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001548926, iterations_per_second: 645.608635}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.023509080, iterations_per_second: 42.536756}
  xpath:
  xslt:
