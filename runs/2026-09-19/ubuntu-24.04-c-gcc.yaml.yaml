platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007853, iterations_per_second: 127344.734933}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004657, iterations_per_second: 214744.346863}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001719747, iterations_per_second: 581.480993}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004416111, iterations_per_second: 226.443584}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024238846, iterations_per_second: 41.256090}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055903877, iterations_per_second: 17.887847}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001489, iterations_per_second: 671681.892301}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001435588, iterations_per_second: 696.578846}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021388932, iterations_per_second: 46.753153}
  xslt:
