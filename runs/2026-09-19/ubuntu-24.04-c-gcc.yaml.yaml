platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004762, iterations_per_second: 210004.619992}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004828, iterations_per_second: 207125.103495}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001763561, iterations_per_second: 567.034433}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004491192, iterations_per_second: 222.658038}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024719325, iterations_per_second: 40.454179}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055219026, iterations_per_second: 18.109700}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001470, iterations_per_second: 680410.967685}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001414550, iterations_per_second: 706.938602}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020494209, iterations_per_second: 48.794272}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006248, iterations_per_second: 160058.901675}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006724, iterations_per_second: 148732.059157}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003396419, iterations_per_second: 294.427778}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006215948, iterations_per_second: 160.876515}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.046339434, iterations_per_second: 21.579892}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078107614, iterations_per_second: 12.802849}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001833, iterations_per_second: 545702.591688}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001729738, iterations_per_second: 578.122236}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.024822507, iterations_per_second: 40.286019}
  xpath:
  xslt:
