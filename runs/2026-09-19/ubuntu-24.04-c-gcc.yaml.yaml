platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006572, iterations_per_second: 152151.421105}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004726, iterations_per_second: 211599.906838}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001745865, iterations_per_second: 572.782083}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004438649, iterations_per_second: 225.293794}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024949526, iterations_per_second: 40.080922}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055072035, iterations_per_second: 18.158036}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001450, iterations_per_second: 689797.889451}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001375790, iterations_per_second: 726.854940}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020716296, iterations_per_second: 48.271177}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006326, iterations_per_second: 158082.772111}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006732, iterations_per_second: 148550.886100}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003386255, iterations_per_second: 295.311516}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006193223, iterations_per_second: 161.466816}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045970424, iterations_per_second: 21.753117}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078142225, iterations_per_second: 12.797178}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001846, iterations_per_second: 541858.574828}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001685966, iterations_per_second: 593.131889}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.024598017, iterations_per_second: 40.653684}
  xpath:
  xslt:
