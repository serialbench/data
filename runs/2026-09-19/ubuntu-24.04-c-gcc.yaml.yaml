platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004559, iterations_per_second: 219370.406887}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004743, iterations_per_second: 210845.913734}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001736767, iterations_per_second: 575.782584}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004450472, iterations_per_second: 224.695251}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025793442, iterations_per_second: 38.769545}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055286323, iterations_per_second: 18.087656}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001452, iterations_per_second: 688847.557514}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001384464, iterations_per_second: 722.301020}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020653894, iterations_per_second: 48.417020}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006188, iterations_per_second: 161590.046106}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010104, iterations_per_second: 98972.663753}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003346741, iterations_per_second: 298.798114}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006190389, iterations_per_second: 161.540745}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045637137, iterations_per_second: 21.911979}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.077726652, iterations_per_second: 12.865600}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001775, iterations_per_second: 563285.078301}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001694478, iterations_per_second: 590.152131}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.024979447, iterations_per_second: 40.032912}
  xpath:
  xslt:
