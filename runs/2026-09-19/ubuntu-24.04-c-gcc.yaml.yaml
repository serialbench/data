platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004585, iterations_per_second: 218121.537427}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004663, iterations_per_second: 214463.412772}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001776460, iterations_per_second: 562.917262}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004433555, iterations_per_second: 225.552649}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025637478, iterations_per_second: 39.005397}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056780527, iterations_per_second: 17.611672}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001534, iterations_per_second: 651932.980650}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001445505, iterations_per_second: 691.799752}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021431226, iterations_per_second: 46.660886}
  xslt:
