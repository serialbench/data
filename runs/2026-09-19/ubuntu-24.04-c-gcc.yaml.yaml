platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005426, iterations_per_second: 184294.428771}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003976, iterations_per_second: 251509.054371}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001272487, iterations_per_second: 785.862439}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003454547, iterations_per_second: 289.473583}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.017643927, iterations_per_second: 56.676725}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.043838014, iterations_per_second: 22.811252}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001190, iterations_per_second: 840194.926429}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001042321, iterations_per_second: 959.397345}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018901993, iterations_per_second: 52.904474}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006878, iterations_per_second: 145382.647113}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005926, iterations_per_second: 168759.281720}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002783055, iterations_per_second: 359.317412}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004903293, iterations_per_second: 203.944574}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.034611081, iterations_per_second: 28.892481}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.062026520, iterations_per_second: 16.122136}
