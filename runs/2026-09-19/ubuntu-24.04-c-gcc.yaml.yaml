platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004542, iterations_per_second: 220143.093029}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004672, iterations_per_second: 214054.840834}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001682866, iterations_per_second: 594.224494}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004444799, iterations_per_second: 224.982069}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023580669, iterations_per_second: 42.407618}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056100157, iterations_per_second: 17.825262}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001467, iterations_per_second: 681756.203716}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001380307, iterations_per_second: 724.476686}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020413368, iterations_per_second: 48.987507}
  xslt:
