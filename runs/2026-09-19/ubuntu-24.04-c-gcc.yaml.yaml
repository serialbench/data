platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004663, iterations_per_second: 214468.012146}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004786, iterations_per_second: 208942.749584}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001791124, iterations_per_second: 558.308534}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004439658, iterations_per_second: 225.242575}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025253078, iterations_per_second: 39.599133}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055370886, iterations_per_second: 18.060032}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001482, iterations_per_second: 674854.905693}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001412904, iterations_per_second: 707.762169}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020910602, iterations_per_second: 47.822631}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006395, iterations_per_second: 156372.165760}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006816, iterations_per_second: 146720.072740}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003366228, iterations_per_second: 297.068381}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006171294, iterations_per_second: 162.040570}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.054490681, iterations_per_second: 18.351762}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078063108, iterations_per_second: 12.810148}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001825, iterations_per_second: 547825.134311}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001740389, iterations_per_second: 574.584078}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.024968646, iterations_per_second: 40.050229}
  xpath:
  xslt:
