platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005134, iterations_per_second: 194791.281134}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004866, iterations_per_second: 205503.380556}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001784608, iterations_per_second: 560.347251}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004441306, iterations_per_second: 225.158979}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023652603, iterations_per_second: 42.278645}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056549255, iterations_per_second: 17.683699}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001590, iterations_per_second: 628930.816725}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001439750, iterations_per_second: 694.565029}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021559113, iterations_per_second: 46.384098}
  xslt:
