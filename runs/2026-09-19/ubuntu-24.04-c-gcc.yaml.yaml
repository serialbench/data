platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004639, iterations_per_second: 215577.640298}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004708, iterations_per_second: 212408.929616}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001704435, iterations_per_second: 586.704685}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004467197, iterations_per_second: 223.854019}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024846579, iterations_per_second: 40.246989}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056179498, iterations_per_second: 17.800088}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001589, iterations_per_second: 629326.619944}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001386666, iterations_per_second: 721.154193}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020952265, iterations_per_second: 47.727537}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006271, iterations_per_second: 159471.829271}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006768, iterations_per_second: 147760.686845}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003348236, iterations_per_second: 298.664730}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006255900, iterations_per_second: 159.849102}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045627128, iterations_per_second: 21.916786}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078049423, iterations_per_second: 12.812395}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001904, iterations_per_second: 525320.445537}
