    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.000385000, iterations_per_second: 2597.402597}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003092333, iterations_per_second: 323.380403}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.004457000, iterations_per_second: 224.366166}
