    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.024404000, iterations_per_second: 40.976889}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000001858, iterations_per_second: 538126.246497}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.001499833, iterations_per_second: 666.740749}
