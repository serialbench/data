    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.000947000, iterations_per_second: 1055.966209}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.004654667, iterations_per_second: 214.838155}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.005008000, iterations_per_second: 199.680511}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.035678000, iterations_per_second: 28.028477}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000003300, iterations_per_second: 303030.304839}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.001867667, iterations_per_second: 535.427450}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.023701000, iterations_per_second: 42.192313}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002033, iterations_per_second: 491811.339576}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.001460347, iterations_per_second: 684.768601}
