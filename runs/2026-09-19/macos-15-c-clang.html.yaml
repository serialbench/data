platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000004800, iterations_per_second: 208333.332872}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000010300, iterations_per_second: 97087.378779}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009600, iterations_per_second: 104166.666683}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001714000, iterations_per_second: 583.430572}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003575667, iterations_per_second: 279.668127}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001031000, iterations_per_second: 969.932105}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018982000, iterations_per_second: 52.681488}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.036606000, iterations_per_second: 27.317926}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011255000, iterations_per_second: 88.849400}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.426338}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000011300, iterations_per_second: 88495.575178}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001722667, iterations_per_second: 580.495356}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001410667, iterations_per_second: 708.884688}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018128000, iterations_per_second: 55.163283}
