platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.611942}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.895401}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.895401}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001911000, iterations_per_second: 523.286238}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003368333, iterations_per_second: 296.882731}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002273667, iterations_per_second: 439.818208}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.031170000, iterations_per_second: 32.082130}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.043835000, iterations_per_second: 22.812821}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010722000, iterations_per_second: 93.266182}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000008200, iterations_per_second: 121951.219482}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005500, iterations_per_second: 181818.181901}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002683000, iterations_per_second: 372.717108}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.009796667, iterations_per_second: 102.075536}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.026223000, iterations_per_second: 38.134462}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015698000, iterations_per_second: 63.702382}
  xpath:
  xslt:
