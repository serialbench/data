    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010100, iterations_per_second: 99009.900989}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003079000, iterations_per_second: 324.780773}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004040000, iterations_per_second: 247.524752}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000971667, iterations_per_second: 1029.159520}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019124000, iterations_per_second: 52.290316}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.032983000, iterations_per_second: 30.318649}
