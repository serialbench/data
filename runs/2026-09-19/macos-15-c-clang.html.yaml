platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005000, iterations_per_second: 199999.999595}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000010000, iterations_per_second: 100000.000025}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009100, iterations_per_second: 109890.109893}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001722333, iterations_per_second: 580.607703}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003677333, iterations_per_second: 271.936186}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001068000, iterations_per_second: 936.329588}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020377000, iterations_per_second: 49.074937}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.039196000, iterations_per_second: 25.512807}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011961000, iterations_per_second: 83.605050}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005900, iterations_per_second: 169491.525525}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000011200, iterations_per_second: 89285.714330}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002343667, iterations_per_second: 426.681838}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001474667, iterations_per_second: 678.119349}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022393000, iterations_per_second: 44.656812}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.016775000, iterations_per_second: 59.612519}
  xpath:
  xslt:
