platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.666732}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.777602}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001600667, iterations_per_second: 624.739692}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003323000, iterations_per_second: 300.932892}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001042333, iterations_per_second: 959.385993}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022286000, iterations_per_second: 44.871220}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.039857000, iterations_per_second: 25.089696}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010952000, iterations_per_second: 91.307524}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.666732}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004600, iterations_per_second: 217391.304359}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001750667, iterations_per_second: 571.210967}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001548000, iterations_per_second: 645.994832}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018557000, iterations_per_second: 53.888021}
