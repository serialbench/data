platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.667719}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.777602}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001731000, iterations_per_second: 577.700751}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003245333, iterations_per_second: 308.134758}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001035000, iterations_per_second: 966.183575}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022476000, iterations_per_second: 44.491902}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.034723000, iterations_per_second: 28.799355}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010950000, iterations_per_second: 91.324201}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.607644}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001682667, iterations_per_second: 594.294770}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001455000, iterations_per_second: 687.285223}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021482000, iterations_per_second: 46.550601}
