platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.556958}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001603000, iterations_per_second: 623.830318}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003123667, iterations_per_second: 320.136592}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001016333, iterations_per_second: 983.929157}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018983000, iterations_per_second: 52.678713}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.035385000, iterations_per_second: 28.260562}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011321000, iterations_per_second: 88.331419}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.609793}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001679333, iterations_per_second: 595.474395}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001467000, iterations_per_second: 681.663258}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020540000, iterations_per_second: 48.685492}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014799000, iterations_per_second: 67.572133}
  xpath:
  xslt:
