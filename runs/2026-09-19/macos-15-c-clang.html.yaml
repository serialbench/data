platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005500, iterations_per_second: 181818.181713}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000011200, iterations_per_second: 89285.714285}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009200, iterations_per_second: 108695.652180}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001780667, iterations_per_second: 561.587420}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003279667, iterations_per_second: 304.909035}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001115667, iterations_per_second: 896.325067}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019645000, iterations_per_second: 50.903538}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.042356000, iterations_per_second: 23.609406}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011169000, iterations_per_second: 89.533530}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666614}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000011400, iterations_per_second: 87719.298248}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001717667, iterations_per_second: 582.185135}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001499000, iterations_per_second: 667.111408}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020809000, iterations_per_second: 48.056130}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017088000, iterations_per_second: 58.520599}
  xpath:
  xslt:
