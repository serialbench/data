platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002100, iterations_per_second: 476190.476104}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238052}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.727553}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001716000, iterations_per_second: 582.750583}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003679000, iterations_per_second: 271.812993}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001113667, iterations_per_second: 897.934750}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.023768000, iterations_per_second: 42.073376}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.049209000, iterations_per_second: 20.321486}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011788000, iterations_per_second: 84.832033}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.857320}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004600, iterations_per_second: 217391.304359}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002084000, iterations_per_second: 479.846449}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001679333, iterations_per_second: 595.474395}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.022248000, iterations_per_second: 44.947860}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.016252000, iterations_per_second: 61.530889}
  xpath:
  xslt:
