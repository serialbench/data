platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 499999.999841}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256497}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001763000, iterations_per_second: 567.214974}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003287333, iterations_per_second: 304.197931}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001038333, iterations_per_second: 963.081862}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.017406000, iterations_per_second: 57.451454}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.040612000, iterations_per_second: 24.623264}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009899000, iterations_per_second: 101.020305}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608719}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004600, iterations_per_second: 217391.304359}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001726000, iterations_per_second: 579.374276}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002858333, iterations_per_second: 349.854227}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018358000, iterations_per_second: 54.472165}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019604000, iterations_per_second: 51.009998}
  xpath:
  xslt:
