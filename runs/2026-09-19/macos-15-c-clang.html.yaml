platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 499999.999841}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.895008}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002216333, iterations_per_second: 451.195669}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.016590333, iterations_per_second: 60.276064}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002016667, iterations_per_second: 495.867769}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.038421000, iterations_per_second: 26.027433}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.051992000, iterations_per_second: 19.233728}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012509000, iterations_per_second: 79.942441}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.666732}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003211333, iterations_per_second: 311.397135}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002281333, iterations_per_second: 438.340152}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.030797000, iterations_per_second: 32.470695}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.020184000, iterations_per_second: 49.544193}
  xpath:
  xslt:
