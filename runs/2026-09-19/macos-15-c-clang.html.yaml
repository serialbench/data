platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.609793}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005000, iterations_per_second: 200000.000050}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285508}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001897333, iterations_per_second: 527.055517}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005436000, iterations_per_second: 183.958793}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001028000, iterations_per_second: 972.762646}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.047642000, iterations_per_second: 20.989883}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.126913000, iterations_per_second: 7.879413}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011113000, iterations_per_second: 89.984703}
  xslt:
