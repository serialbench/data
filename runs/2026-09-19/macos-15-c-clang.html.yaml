platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 399999.999191}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003800, iterations_per_second: 263157.894614}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.777602}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001693333, iterations_per_second: 590.551181}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003279667, iterations_per_second: 304.909035}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001182000, iterations_per_second: 846.023689}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021959000, iterations_per_second: 45.539414}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.043432000, iterations_per_second: 23.024498}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.022871000, iterations_per_second: 43.723493}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.609793}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004300, iterations_per_second: 232558.139507}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001945000, iterations_per_second: 514.138817}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001523333, iterations_per_second: 656.455142}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.028483000, iterations_per_second: 35.108661}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017400000, iterations_per_second: 57.471264}
  xpath:
  xslt:
