platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006500, iterations_per_second: 153846.153965}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000011700, iterations_per_second: 85470.085437}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009900, iterations_per_second: 101010.100917}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003251667, iterations_per_second: 307.534598}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005034000, iterations_per_second: 198.649186}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000994000, iterations_per_second: 1006.036217}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.035898000, iterations_per_second: 27.856705}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.060195000, iterations_per_second: 16.612675}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009523000, iterations_per_second: 105.008926}
  xslt:
