platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001126, iterations_per_second: 887941.752062}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001152, iterations_per_second: 867904.875929}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000694388, iterations_per_second: 1440.117053}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002027764, iterations_per_second: 493.154036}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013503980, iterations_per_second: 74.052242}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040164449, iterations_per_second: 24.897640}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000406, iterations_per_second: 2464268.111274}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000382016, iterations_per_second: 2617.691406}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004730116, iterations_per_second: 211.411306}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001982, iterations_per_second: 504617.248313}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001670, iterations_per_second: 598766.541186}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002535252, iterations_per_second: 394.438159}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002589226, iterations_per_second: 386.215754}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.024151768, iterations_per_second: 41.404836}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.047331572, iterations_per_second: 21.127547}
  xpath:
  xslt:
