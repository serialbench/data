platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000881, iterations_per_second: 1134558.655186}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000938, iterations_per_second: 1065530.101399}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000514571, iterations_per_second: 1943.365157}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001569135, iterations_per_second: 637.293796}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.009187630, iterations_per_second: 108.841997}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031518340, iterations_per_second: 31.727559}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000264, iterations_per_second: 3787878.800705}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000254769, iterations_per_second: 3925.124328}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003015842, iterations_per_second: 331.582357}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001543, iterations_per_second: 648214.169024}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001372, iterations_per_second: 729022.380900}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001802643, iterations_per_second: 554.741113}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001956438, iterations_per_second: 511.132901}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.017456753, iterations_per_second: 57.284422}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035584917, iterations_per_second: 28.101794}
  xpath:
  xslt:
