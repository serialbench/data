platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001002, iterations_per_second: 997506.234953}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000947, iterations_per_second: 1055520.368914}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000676753, iterations_per_second: 1477.643985}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001662250, iterations_per_second: 601.594345}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010762544, iterations_per_second: 92.914835}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034795363, iterations_per_second: 28.739462}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000318, iterations_per_second: 3149606.281790}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000285756, iterations_per_second: 3499.484992}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003548884, iterations_per_second: 281.778723}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001593, iterations_per_second: 627588.803663}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001374, iterations_per_second: 727802.037094}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002213719, iterations_per_second: 451.728585}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002082577, iterations_per_second: 480.174399}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.019680407, iterations_per_second: 50.811957}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040410219, iterations_per_second: 24.746216}
  xpath:
  xslt:
