platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000859, iterations_per_second: 1163873.370528}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000913, iterations_per_second: 1094930.469487}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000550801, iterations_per_second: 1815.536636}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001642072, iterations_per_second: 608.986695}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010307074, iterations_per_second: 97.020745}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032028470, iterations_per_second: 31.222222}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000303, iterations_per_second: 3305785.110571}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000286364, iterations_per_second: 3492.059058}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003534113, iterations_per_second: 282.956431}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001463, iterations_per_second: 683433.569465}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001322, iterations_per_second: 756486.874371}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002161236, iterations_per_second: 462.698125}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002061809, iterations_per_second: 485.010900}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.018620509, iterations_per_second: 53.704225}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.038458119, iterations_per_second: 26.002312}
  xpath:
  xslt:
