platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001196, iterations_per_second: 835980.605104}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001055, iterations_per_second: 947867.297396}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001771187, iterations_per_second: 564.593017}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001776524, iterations_per_second: 562.896983}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014320448, iterations_per_second: 69.830218}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035037172, iterations_per_second: 28.541116}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000407, iterations_per_second: 2458814.856144}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000384886, iterations_per_second: 2598.171926}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004739499, iterations_per_second: 210.992765}
  xslt:
