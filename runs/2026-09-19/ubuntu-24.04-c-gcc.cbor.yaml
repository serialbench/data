platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001165, iterations_per_second: 858221.765716}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001140, iterations_per_second: 877116.042856}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000695100, iterations_per_second: 1438.642612}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002020160, iterations_per_second: 495.010215}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012850252, iterations_per_second: 77.819486}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.037319492, iterations_per_second: 26.795649}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000411, iterations_per_second: 2434274.595283}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000383722, iterations_per_second: 2606.053341}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004748184, iterations_per_second: 210.606834}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001986, iterations_per_second: 503600.745738}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001668, iterations_per_second: 599484.443189}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002537248, iterations_per_second: 394.127811}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002579888, iterations_per_second: 387.613776}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022951820, iterations_per_second: 43.569530}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.045442710, iterations_per_second: 22.005730}
  xpath:
  xslt:
