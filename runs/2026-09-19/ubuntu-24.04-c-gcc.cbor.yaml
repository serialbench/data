platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001129, iterations_per_second: 885661.148843}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001128, iterations_per_second: 886446.235995}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000689058, iterations_per_second: 1451.256643}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002043898, iterations_per_second: 489.261126}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012407398, iterations_per_second: 80.597076}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.037555552, iterations_per_second: 26.627221}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000410, iterations_per_second: 2440214.752775}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000374587, iterations_per_second: 2669.609169}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004607810, iterations_per_second: 217.022837}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002042, iterations_per_second: 489763.933313}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001652, iterations_per_second: 605290.235918}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002546547, iterations_per_second: 392.688661}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002588962, iterations_per_second: 386.255186}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023193440, iterations_per_second: 43.115640}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.045667962, iterations_per_second: 21.897189}
  xpath:
  xslt:
