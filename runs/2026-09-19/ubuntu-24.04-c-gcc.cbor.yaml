platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000863, iterations_per_second: 1159420.287051}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001054, iterations_per_second: 948946.666822}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000603844, iterations_per_second: 1656.056862}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001727806, iterations_per_second: 578.768793}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011214210, iterations_per_second: 89.172577}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032374201, iterations_per_second: 30.888793}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000322, iterations_per_second: 3101736.962161}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000284711, iterations_per_second: 3512.333559}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003414607, iterations_per_second: 292.859471}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001703, iterations_per_second: 587164.581297}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001484, iterations_per_second: 673899.857740}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001977901, iterations_per_second: 505.586478}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002202970, iterations_per_second: 453.932577}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.020640229, iterations_per_second: 48.449075}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.039626631, iterations_per_second: 25.235554}
  xpath:
  xslt:
