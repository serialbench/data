platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001178, iterations_per_second: 848824.379421}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001165, iterations_per_second: 858221.765716}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000708947, iterations_per_second: 1410.543341}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002060299, iterations_per_second: 485.366366}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012901090, iterations_per_second: 77.512830}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.039982340, iterations_per_second: 25.011042}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000401, iterations_per_second: 2495009.985915}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000375379, iterations_per_second: 2663.976642}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004629018, iterations_per_second: 216.028540}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002080, iterations_per_second: 480792.345836}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001667, iterations_per_second: 599844.040644}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002556603, iterations_per_second: 391.143979}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002545526, iterations_per_second: 392.846115}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023603055, iterations_per_second: 42.367397}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.047235334, iterations_per_second: 21.170592}
  xpath:
  xslt:
