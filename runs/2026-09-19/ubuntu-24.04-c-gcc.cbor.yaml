platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001129, iterations_per_second: 885661.146614}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001160, iterations_per_second: 861920.358505}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000698030, iterations_per_second: 1432.603867}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002043701, iterations_per_second: 489.308447}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013508151, iterations_per_second: 74.029377}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.038300331, iterations_per_second: 26.109435}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000408, iterations_per_second: 2452783.909843}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000387577, iterations_per_second: 2580.130245}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004720796, iterations_per_second: 211.828683}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001960, iterations_per_second: 510282.185919}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001674, iterations_per_second: 597300.202586}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002556873, iterations_per_second: 391.102726}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002602783, iterations_per_second: 384.204138}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.024250803, iterations_per_second: 41.235748}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.045977122, iterations_per_second: 21.749948}
  xpath:
  xslt:
