platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001173, iterations_per_second: 852733.008232}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001238, iterations_per_second: 807884.956654}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000781722, iterations_per_second: 1279.226597}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002125879, iterations_per_second: 470.393658}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014165188, iterations_per_second: 70.595604}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.041765615, iterations_per_second: 23.943141}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000407, iterations_per_second: 2459419.592679}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000372090, iterations_per_second: 2687.524244}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004605908, iterations_per_second: 217.112456}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001945, iterations_per_second: 514165.252529}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001703, iterations_per_second: 587371.512298}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002887765, iterations_per_second: 346.288526}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002650515, iterations_per_second: 377.285217}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.025173560, iterations_per_second: 39.724219}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.049990943, iterations_per_second: 20.003623}
  xpath:
  xslt:
