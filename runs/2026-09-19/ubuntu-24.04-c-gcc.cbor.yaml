platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000596, iterations_per_second: 1678133.909302}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000614, iterations_per_second: 1628929.795036}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000339526, iterations_per_second: 2945.285432}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001060343, iterations_per_second: 943.091353}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007979988, iterations_per_second: 125.313472}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023923188, iterations_per_second: 41.800449}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000252, iterations_per_second: 3961965.141498}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000210928, iterations_per_second: 4740.954259}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.002709647, iterations_per_second: 369.051762}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001042, iterations_per_second: 960061.443087}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000922, iterations_per_second: 1084128.361290}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001535089, iterations_per_second: 651.428028}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001387256, iterations_per_second: 720.847659}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012929924, iterations_per_second: 77.339975}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.027781407, iterations_per_second: 35.995297}
  xpath:
  xslt:
