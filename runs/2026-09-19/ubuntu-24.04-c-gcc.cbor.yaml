platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001153, iterations_per_second: 867227.474956}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001139, iterations_per_second: 877886.049216}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000713146, iterations_per_second: 1402.236755}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002118396, iterations_per_second: 472.055272}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012818210, iterations_per_second: 78.014013}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040850679, iterations_per_second: 24.479397}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000404, iterations_per_second: 2476473.510357}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000375455, iterations_per_second: 2663.435032}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004652376, iterations_per_second: 214.943934}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002100, iterations_per_second: 476190.476748}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001654, iterations_per_second: 604558.369821}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002550270, iterations_per_second: 392.115293}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002594269, iterations_per_second: 385.464989}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023540933, iterations_per_second: 42.479200}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.053472282, iterations_per_second: 18.701278}
  xpath:
  xslt:
