platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001217, iterations_per_second: 821490.184031}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001192, iterations_per_second: 838785.438771}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000686311, iterations_per_second: 1457.066091}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002040585, iterations_per_second: 490.055548}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012460004, iterations_per_second: 80.256796}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.037951319, iterations_per_second: 26.349545}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000401, iterations_per_second: 2495009.985915}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000380133, iterations_per_second: 2630.660524}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004623499, iterations_per_second: 216.286410}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002003, iterations_per_second: 499325.909896}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001672, iterations_per_second: 598050.356549}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002522745, iterations_per_second: 396.393663}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002579771, iterations_per_second: 387.631255}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023445667, iterations_per_second: 42.651804}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.046814931, iterations_per_second: 21.360706}
  xpath:
  xslt:
