    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000007200, iterations_per_second: 138888.888801}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000996000, iterations_per_second: 1004.016064}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002715333, iterations_per_second: 368.278910}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006133000, iterations_per_second: 163.052340}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.015952000, iterations_per_second: 62.688064}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000289667, iterations_per_second: 3452.243958}
