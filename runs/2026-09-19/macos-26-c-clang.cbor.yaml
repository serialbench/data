    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370136}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000889333, iterations_per_second: 1124.437781}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001678333, iterations_per_second: 595.829196}
