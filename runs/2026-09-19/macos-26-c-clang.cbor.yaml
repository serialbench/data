    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003290000, iterations_per_second: 303.951368}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005546000, iterations_per_second: 180.310133}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.016967000, iterations_per_second: 58.937938}
