    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454545.454519}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000948333, iterations_per_second: 1054.481547}
