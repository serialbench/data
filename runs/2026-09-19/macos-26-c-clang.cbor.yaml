    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000474000, iterations_per_second: 2109.704641}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001526000, iterations_per_second: 655.307995}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005805000, iterations_per_second: 172.265289}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.019201000, iterations_per_second: 52.080621}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000334333, iterations_per_second: 2991.026919}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003701000, iterations_per_second: 270.197244}
  generation:
