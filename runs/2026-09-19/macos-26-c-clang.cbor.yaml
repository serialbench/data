    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000005400, iterations_per_second: 185185.185263}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000906000, iterations_per_second: 1103.752759}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001661000, iterations_per_second: 602.046960}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011635000, iterations_per_second: 85.947572}
