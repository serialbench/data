    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000417333, iterations_per_second: 2396.166134}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001327000, iterations_per_second: 753.579503}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005869000, iterations_per_second: 170.386778}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030997000, iterations_per_second: 32.261187}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.113916}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000327333, iterations_per_second: 3054.989817}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.006270000, iterations_per_second: 159.489633}
  generation:
