    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000448000, iterations_per_second: 2232.142857}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001384333, iterations_per_second: 722.369372}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005383000, iterations_per_second: 185.770017}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.017929000, iterations_per_second: 55.775559}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000359667, iterations_per_second: 2780.352178}
