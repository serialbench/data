    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000882667, iterations_per_second: 1132.930514}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001383333, iterations_per_second: 722.891566}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005238000, iterations_per_second: 190.912562}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.017169000, iterations_per_second: 58.244510}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.468068}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000341000, iterations_per_second: 2932.551320}
