platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 249999.999921}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000010400, iterations_per_second: 96153.846081}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000941667, iterations_per_second: 1061.946903}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002604333, iterations_per_second: 383.975426}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.004912000, iterations_per_second: 203.583062}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.015705000, iterations_per_second: 63.673989}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000294667, iterations_per_second: 3393.665158}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003638000, iterations_per_second: 274.876306}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000005000, iterations_per_second: 200000.000050}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000006500, iterations_per_second: 153846.153696}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001371000, iterations_per_second: 729.394602}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002039000, iterations_per_second: 490.436488}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010727000, iterations_per_second: 93.222709}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.019535000, iterations_per_second: 51.190171}
  xpath:
  xslt:
