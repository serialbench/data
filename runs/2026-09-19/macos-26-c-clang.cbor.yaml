    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000947000, iterations_per_second: 1055.966209}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002519333, iterations_per_second: 396.930405}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005953000, iterations_per_second: 167.982530}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.014411000, iterations_per_second: 69.391437}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.215430}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000297667, iterations_per_second: 3359.462486}
