    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.331649}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000447333, iterations_per_second: 2235.469449}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001396667, iterations_per_second: 715.990453}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005120000, iterations_per_second: 195.312500}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.017681000, iterations_per_second: 56.557887}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.720705}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000348667, iterations_per_second: 2868.068834}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004037000, iterations_per_second: 247.708695}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.563976}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.616241}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000917333, iterations_per_second: 1090.116279}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001672667, iterations_per_second: 597.847748}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011638000, iterations_per_second: 85.925417}
