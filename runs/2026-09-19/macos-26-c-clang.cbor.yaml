platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.001578}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000008200, iterations_per_second: 121951.219566}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000430000, iterations_per_second: 2325.581395}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001567000, iterations_per_second: 638.162093}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.008776000, iterations_per_second: 113.947129}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018088000, iterations_per_second: 55.285272}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000643333, iterations_per_second: 1554.404145}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.006870000, iterations_per_second: 145.560408}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000005800, iterations_per_second: 172413.793201}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001010667, iterations_per_second: 989.445910}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001813667, iterations_per_second: 551.369234}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021247000, iterations_per_second: 47.065468}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032940000, iterations_per_second: 30.358227}
  xpath:
  xslt:
