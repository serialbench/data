    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001136667, iterations_per_second: 879.765396}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001334333, iterations_per_second: 749.437922}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005171000, iterations_per_second: 193.386192}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.017323000, iterations_per_second: 57.726722}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2499999.935258}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000327000, iterations_per_second: 3058.103975}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003959000, iterations_per_second: 252.589038}
  generation:
