    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000435333, iterations_per_second: 2297.090352}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001345333, iterations_per_second: 743.310208}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005158000, iterations_per_second: 193.873594}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.016481000, iterations_per_second: 60.675930}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000297667, iterations_per_second: 3359.462486}
