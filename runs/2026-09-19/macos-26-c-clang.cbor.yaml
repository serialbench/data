    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000007100, iterations_per_second: 140845.070440}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001529000, iterations_per_second: 654.022237}
