    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384325}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000943000, iterations_per_second: 1060.445387}
