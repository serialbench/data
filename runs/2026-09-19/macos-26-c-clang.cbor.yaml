platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.556081}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.333228}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000478667, iterations_per_second: 2089.136490}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002937333, iterations_per_second: 340.444848}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007016000, iterations_per_second: 142.531357}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018138000, iterations_per_second: 55.132870}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.310170}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000319667, iterations_per_second: 3128.258603}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004611000, iterations_per_second: 216.872696}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.555204}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454545.454519}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000985333, iterations_per_second: 1014.884980}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001830333, iterations_per_second: 546.348570}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012715000, iterations_per_second: 78.647267}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.026447000, iterations_per_second: 37.811472}
  xpath:
  xslt:
