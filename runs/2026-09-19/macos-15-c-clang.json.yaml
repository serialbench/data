platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: json-c, format: json, version: '0.19', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.113916}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.371305}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.000574667, iterations_per_second: 1740.139211}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003319333, iterations_per_second: 301.265314}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.006804000, iterations_per_second: 146.972369}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.040955000, iterations_per_second: 24.417043}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.371305}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002120000, iterations_per_second: 471.698113}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.033665000, iterations_per_second: 29.704441}
