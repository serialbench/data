    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001379300, iterations_per_second: 725.005438}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003352633, iterations_per_second: 298.272999}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.010745800, iterations_per_second: 93.059614}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.048542600, iterations_per_second: 20.600462}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000360, iterations_per_second: 2777777.767247}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000358567, iterations_per_second: 2788.881658}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004475400, iterations_per_second: 223.443715}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002410, iterations_per_second: 414937.759014}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003120, iterations_per_second: 320512.820855}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002011200, iterations_per_second: 497.215593}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004024533, iterations_per_second: 248.476014}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.020120800, iterations_per_second: 49.699813}
