platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002107, iterations_per_second: 474676.032836}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004941, iterations_per_second: 202379.988626}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004683, iterations_per_second: 213515.533356}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001747777, iterations_per_second: 572.155372}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004181225, iterations_per_second: 239.164341}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001124119, iterations_per_second: 889.585269}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019243547, iterations_per_second: 51.965472}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.041930918, iterations_per_second: 23.848750}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012033845, iterations_per_second: 83.098960}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002651, iterations_per_second: 377258.836867}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005685, iterations_per_second: 175886.025953}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001968689, iterations_per_second: 507.952160}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001438914, iterations_per_second: 694.968728}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020274166, iterations_per_second: 49.323854}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015485611, iterations_per_second: 64.576076}
  xpath:
  xslt:
