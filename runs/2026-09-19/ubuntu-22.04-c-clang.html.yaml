platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000007451, iterations_per_second: 134211.974391}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006853, iterations_per_second: 145927.882327}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.007329167, iterations_per_second: 136.441154}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001401144, iterations_per_second: 713.702687}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.097664084, iterations_per_second: 10.239179}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014194622, iterations_per_second: 70.449217}
  xslt:
