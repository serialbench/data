platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002810, iterations_per_second: 355833.896670}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007076, iterations_per_second: 141316.789855}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005744, iterations_per_second: 174100.769529}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002383143, iterations_per_second: 419.613871}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005408253, iterations_per_second: 184.902604}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001441544, iterations_per_second: 693.700804}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025004884, iterations_per_second: 39.992187}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.054412776, iterations_per_second: 18.378037}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014677386, iterations_per_second: 68.132023}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003539, iterations_per_second: 282589.651591}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007172, iterations_per_second: 139423.345028}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002600082, iterations_per_second: 384.603255}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001863185, iterations_per_second: 536.715452}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.027189807, iterations_per_second: 36.778488}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019465493, iterations_per_second: 51.372960}
  xpath:
  xslt:
