platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001183, iterations_per_second: 845451.469190}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003348, iterations_per_second: 298685.782439}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003316, iterations_per_second: 301568.154006}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001203446, iterations_per_second: 830.947360}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003321642, iterations_per_second: 301.055954}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000676127, iterations_per_second: 1479.012808}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.058106107, iterations_per_second: 17.209895}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.073449045, iterations_per_second: 13.614881}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.007433616, iterations_per_second: 134.524032}
  xslt:
