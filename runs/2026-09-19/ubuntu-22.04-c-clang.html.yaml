platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002004, iterations_per_second: 499026.897754}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005298, iterations_per_second: 188743.346798}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004609, iterations_per_second: 216980.927304}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001698612, iterations_per_second: 588.716079}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005861285, iterations_per_second: 170.611062}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001112854, iterations_per_second: 898.590471}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.017911758, iterations_per_second: 55.829249}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.058812196, iterations_per_second: 17.003276}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011735058, iterations_per_second: 85.214747}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002566, iterations_per_second: 389726.801265}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005554, iterations_per_second: 180043.930678}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001856358, iterations_per_second: 538.689197}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001420023, iterations_per_second: 704.213946}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.019568939, iterations_per_second: 51.101391}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015149505, iterations_per_second: 66.008757}
  xpath:
  xslt:
