platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002774, iterations_per_second: 360464.277432}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006955, iterations_per_second: 143781.452356}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005846, iterations_per_second: 171057.132776}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002314148, iterations_per_second: 432.124542}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005304820, iterations_per_second: 188.507822}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001462414, iterations_per_second: 683.800894}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.024286921, iterations_per_second: 41.174425}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.054023919, iterations_per_second: 18.510319}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014654182, iterations_per_second: 68.239906}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003510, iterations_per_second: 284932.755600}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007273, iterations_per_second: 137502.406321}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002532471, iterations_per_second: 394.871202}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001872632, iterations_per_second: 534.007845}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.026653887, iterations_per_second: 37.517980}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019416129, iterations_per_second: 51.503572}
  xpath:
  xslt:
