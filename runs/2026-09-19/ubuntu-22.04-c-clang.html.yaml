platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002867, iterations_per_second: 348747.994448}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007272, iterations_per_second: 137519.424575}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005994, iterations_per_second: 166827.933649}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002398130, iterations_per_second: 416.991573}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005511189, iterations_per_second: 181.449059}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001481243, iterations_per_second: 675.108524}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025278726, iterations_per_second: 39.558956}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.056135967, iterations_per_second: 17.813891}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014893353, iterations_per_second: 67.144047}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003620, iterations_per_second: 276258.357004}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007423, iterations_per_second: 134716.421940}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002616752, iterations_per_second: 382.153094}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001899229, iterations_per_second: 526.529450}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.027677527, iterations_per_second: 36.130396}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019614782, iterations_per_second: 50.981958}
  xpath:
  xslt:
