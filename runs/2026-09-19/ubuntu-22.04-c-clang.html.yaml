platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002835, iterations_per_second: 352696.365763}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007031, iterations_per_second: 142225.256472}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005684, iterations_per_second: 175944.823355}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002378544, iterations_per_second: 420.425210}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005548581, iterations_per_second: 180.226260}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001433289, iterations_per_second: 697.695836}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025118472, iterations_per_second: 39.811339}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.054999442, iterations_per_second: 18.182003}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014666290, iterations_per_second: 68.183569}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003547, iterations_per_second: 281960.188239}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007122, iterations_per_second: 140406.054584}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002611291, iterations_per_second: 382.952389}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001851497, iterations_per_second: 540.103397}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.026935532, iterations_per_second: 37.125682}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019337609, iterations_per_second: 51.712701}
  xpath:
  xslt:
