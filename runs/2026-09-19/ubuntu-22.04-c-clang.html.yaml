platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002993, iterations_per_second: 334157.589078}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006910, iterations_per_second: 144719.894701}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005872, iterations_per_second: 170299.727443}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002386930, iterations_per_second: 418.948189}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005499042, iterations_per_second: 181.849868}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001476234, iterations_per_second: 677.399230}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.024640946, iterations_per_second: 40.582857}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.055171683, iterations_per_second: 18.125240}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015064993, iterations_per_second: 66.379055}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003483, iterations_per_second: 287150.035892}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007421, iterations_per_second: 134754.544615}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002578155, iterations_per_second: 387.874274}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001901010, iterations_per_second: 526.036160}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.027070726, iterations_per_second: 36.940273}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019799970, iterations_per_second: 50.505127}
  xpath:
  xslt:
