platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002840, iterations_per_second: 352075.485139}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000009368, iterations_per_second: 106752.068303}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005651, iterations_per_second: 176972.356940}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002417357, iterations_per_second: 413.674878}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005656858, iterations_per_second: 176.776578}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001442208, iterations_per_second: 693.381100}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025318975, iterations_per_second: 39.496070}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.055828721, iterations_per_second: 17.911927}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015008898, iterations_per_second: 66.627143}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003541, iterations_per_second: 282438.004898}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007189, iterations_per_second: 139093.665672}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002626886, iterations_per_second: 380.678872}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001908851, iterations_per_second: 523.875449}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.027183068, iterations_per_second: 36.787606}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019552719, iterations_per_second: 51.143782}
  xpath:
  xslt:
