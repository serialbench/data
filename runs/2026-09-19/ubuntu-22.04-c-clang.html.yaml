platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002770, iterations_per_second: 360997.797629}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007082, iterations_per_second: 141199.062442}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005774, iterations_per_second: 173199.161656}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002333111, iterations_per_second: 428.612208}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005670756, iterations_per_second: 176.343341}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001458474, iterations_per_second: 685.647993}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.024586315, iterations_per_second: 40.673033}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.056306616, iterations_per_second: 17.759902}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015159457, iterations_per_second: 65.965423}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003474, iterations_per_second: 287811.195909}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007227, iterations_per_second: 138360.428957}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002563385, iterations_per_second: 390.109223}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001884363, iterations_per_second: 530.683219}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.027048224, iterations_per_second: 36.971004}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.021043448, iterations_per_second: 47.520729}
  xpath:
  xslt:
