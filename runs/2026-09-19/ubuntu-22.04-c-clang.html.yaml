platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000007200, iterations_per_second: 138890.817929}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005713, iterations_per_second: 175051.640229}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.007033686, iterations_per_second: 142.172959}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001268041, iterations_per_second: 788.617826}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.110478419, iterations_per_second: 9.051542}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013017473, iterations_per_second: 76.819825}
  xslt:
