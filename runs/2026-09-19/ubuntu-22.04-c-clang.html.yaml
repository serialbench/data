platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002765, iterations_per_second: 361637.494576}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000010042, iterations_per_second: 99583.739950}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005729, iterations_per_second: 174556.626189}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002428709, iterations_per_second: 411.741325}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005686949, iterations_per_second: 175.841201}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001473894, iterations_per_second: 678.474689}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.024875756, iterations_per_second: 40.199783}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.056351255, iterations_per_second: 17.745834}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014833917, iterations_per_second: 67.413078}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003512, iterations_per_second: 284770.474829}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007177, iterations_per_second: 139326.218369}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002580981, iterations_per_second: 387.449528}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001879698, iterations_per_second: 532.000448}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.027255053, iterations_per_second: 36.690444}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019684311, iterations_per_second: 50.801880}
  xpath:
  xslt:
