platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002053, iterations_per_second: 487068.335253}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005049, iterations_per_second: 198070.790461}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004085, iterations_per_second: 244792.049018}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001790589, iterations_per_second: 558.475451}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.003960847, iterations_per_second: 252.471230}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001009370, iterations_per_second: 990.716982}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018891050, iterations_per_second: 52.935120}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.039303595, iterations_per_second: 25.442965}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010375778, iterations_per_second: 96.378315}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002571, iterations_per_second: 388983.973714}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006812, iterations_per_second: 146793.300342}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002008037, iterations_per_second: 497.998792}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001312551, iterations_per_second: 761.875158}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.020625235, iterations_per_second: 48.484296}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013849169, iterations_per_second: 72.206498}
  xpath:
  xslt:
