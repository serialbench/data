platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002807, iterations_per_second: 356214.155103}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000010767, iterations_per_second: 92874.656353}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005886, iterations_per_second: 169891.778733}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002364373, iterations_per_second: 422.945170}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005282248, iterations_per_second: 189.313350}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001447401, iterations_per_second: 690.893540}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.024908647, iterations_per_second: 40.146701}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.054129170, iterations_per_second: 18.474327}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014884266, iterations_per_second: 67.185040}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003544, iterations_per_second: 282198.894084}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007331, iterations_per_second: 136410.759927}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002593887, iterations_per_second: 385.521855}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001865129, iterations_per_second: 536.156040}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.027933988, iterations_per_second: 35.798684}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019523687, iterations_per_second: 51.219834}
  xpath:
  xslt:
