platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002908, iterations_per_second: 343831.659963}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007052, iterations_per_second: 141797.711375}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005712, iterations_per_second: 175079.223314}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002432068, iterations_per_second: 411.172770}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005541781, iterations_per_second: 180.447405}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001467266, iterations_per_second: 681.539525}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025265695, iterations_per_second: 39.579358}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.055086489, iterations_per_second: 18.153272}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014805350, iterations_per_second: 67.543152}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003698, iterations_per_second: 270416.441287}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007183, iterations_per_second: 139207.907009}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002685057, iterations_per_second: 372.431526}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001880918, iterations_per_second: 531.655287}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.027600346, iterations_per_second: 36.231430}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019535617, iterations_per_second: 51.188555}
  xpath:
  xslt:
