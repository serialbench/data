platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000975, iterations_per_second: 1025430.682710}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001166, iterations_per_second: 857927.245818}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000664319, iterations_per_second: 1505.300162}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001793011, iterations_per_second: 557.721063}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013447339, iterations_per_second: 74.364155}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.029094600, iterations_per_second: 34.370639}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000391, iterations_per_second: 2555583.950628}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000370613, iterations_per_second: 2698.234815}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004866723, iterations_per_second: 205.477074}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001679, iterations_per_second: 595486.214986}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001446, iterations_per_second: 691754.287403}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001839364, iterations_per_second: 543.666082}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002020353, iterations_per_second: 494.963009}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022306777, iterations_per_second: 44.829426}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032901967, iterations_per_second: 30.393320}
  xpath:
  xslt:
