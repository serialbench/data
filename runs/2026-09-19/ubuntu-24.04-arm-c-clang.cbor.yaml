platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000967, iterations_per_second: 1034019.234189}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001150, iterations_per_second: 869338.433748}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000678755, iterations_per_second: 1473.285648}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001771920, iterations_per_second: 564.359671}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014895428, iterations_per_second: 67.134694}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032015103, iterations_per_second: 31.235258}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000401, iterations_per_second: 2495009.968222}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000379826, iterations_per_second: 2632.786796}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005064983, iterations_per_second: 197.434029}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001711, iterations_per_second: 584419.378193}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001459, iterations_per_second: 685307.016903}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001870149, iterations_per_second: 534.716848}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002032486, iterations_per_second: 492.008309}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023884509, iterations_per_second: 41.868141}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035467916, iterations_per_second: 28.194496}
  xpath:
  xslt:
