platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000969, iterations_per_second: 1032311.334272}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001151, iterations_per_second: 868658.798304}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000655434, iterations_per_second: 1525.706631}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001750264, iterations_per_second: 571.342489}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014238406, iterations_per_second: 70.232581}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.029688508, iterations_per_second: 33.683067}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000391, iterations_per_second: 2556890.806629}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000370418, iterations_per_second: 2699.650395}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004908525, iterations_per_second: 203.727189}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001656, iterations_per_second: 603901.203234}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001474, iterations_per_second: 678287.998085}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001847769, iterations_per_second: 541.193190}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002010814, iterations_per_second: 497.311039}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023359717, iterations_per_second: 42.808738}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034428893, iterations_per_second: 29.045372}
  xpath:
  xslt:
