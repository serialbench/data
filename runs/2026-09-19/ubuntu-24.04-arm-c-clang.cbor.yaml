platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000970, iterations_per_second: 1031459.513403}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001145, iterations_per_second: 873515.023749}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000671633, iterations_per_second: 1488.908377}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001770391, iterations_per_second: 564.846868}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013788813, iterations_per_second: 72.522559}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.029884430, iterations_per_second: 33.462241}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000394, iterations_per_second: 2540650.416441}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000371901, iterations_per_second: 2688.887634}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004954154, iterations_per_second: 201.850810}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001645, iterations_per_second: 608013.619237}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001458, iterations_per_second: 686106.345406}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001838801, iterations_per_second: 543.832737}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002047077, iterations_per_second: 488.501489}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022207208, iterations_per_second: 45.030424}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034676577, iterations_per_second: 28.837910}
  xpath:
  xslt:
