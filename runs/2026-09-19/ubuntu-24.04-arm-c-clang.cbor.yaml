platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000958, iterations_per_second: 1044277.357348}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001135, iterations_per_second: 880979.652856}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000667347, iterations_per_second: 1498.471559}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001756995, iterations_per_second: 569.153691}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013303336, iterations_per_second: 75.169115}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.029251342, iterations_per_second: 34.186466}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000392, iterations_per_second: 2551020.382051}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000371555, iterations_per_second: 2691.391584}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004902888, iterations_per_second: 203.961420}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001674, iterations_per_second: 597550.043707}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001464, iterations_per_second: 683106.768273}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001840962, iterations_per_second: 543.194166}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002043531, iterations_per_second: 489.349073}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021826423, iterations_per_second: 45.816028}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032596360, iterations_per_second: 30.678272}
  xpath:
  xslt:
