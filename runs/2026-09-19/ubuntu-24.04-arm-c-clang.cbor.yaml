platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000992, iterations_per_second: 1008064.513591}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001171, iterations_per_second: 853898.043604}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000664058, iterations_per_second: 1505.891802}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001772954, iterations_per_second: 564.030532}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014464763, iterations_per_second: 69.133521}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030573562, iterations_per_second: 32.707998}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000395, iterations_per_second: 2531004.811148}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000379625, iterations_per_second: 2634.178466}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005067380, iterations_per_second: 197.340638}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001731, iterations_per_second: 577667.380289}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001495, iterations_per_second: 668851.583233}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001856082, iterations_per_second: 538.769203}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002033402, iterations_per_second: 491.786671}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022928234, iterations_per_second: 43.614349}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034447087, iterations_per_second: 29.030031}
  xpath:
  xslt:
