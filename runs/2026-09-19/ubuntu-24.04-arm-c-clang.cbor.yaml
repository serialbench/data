platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000923, iterations_per_second: 1083071.596020}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001142, iterations_per_second: 875963.559406}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000682298, iterations_per_second: 1465.634534}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001784767, iterations_per_second: 560.297226}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015931965, iterations_per_second: 62.766897}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033304911, iterations_per_second: 30.025602}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000407, iterations_per_second: 2455795.697438}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000379311, iterations_per_second: 2636.356766}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005014959, iterations_per_second: 199.403425}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001650, iterations_per_second: 606170.819302}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001438, iterations_per_second: 695603.785665}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001961539, iterations_per_second: 509.803868}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002040177, iterations_per_second: 490.153470}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.025447154, iterations_per_second: 39.297125}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.036524068, iterations_per_second: 27.379207}
  xpath:
  xslt:
