platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000954, iterations_per_second: 1048657.706366}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001155, iterations_per_second: 865725.898392}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000657545, iterations_per_second: 1520.807691}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001772309, iterations_per_second: 564.235589}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013877450, iterations_per_second: 72.059348}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.029311338, iterations_per_second: 34.116491}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000393, iterations_per_second: 2546473.230413}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000372656, iterations_per_second: 2683.442356}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004933119, iterations_per_second: 202.711510}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001649, iterations_per_second: 606538.458338}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001423, iterations_per_second: 702691.306580}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001846550, iterations_per_second: 541.550361}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002043997, iterations_per_second: 489.237429}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022467835, iterations_per_second: 44.508071}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033322382, iterations_per_second: 30.009859}
  xpath:
  xslt:
