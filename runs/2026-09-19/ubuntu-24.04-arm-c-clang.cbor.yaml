platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000993, iterations_per_second: 1007353.675319}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001132, iterations_per_second: 883392.235121}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000663039, iterations_per_second: 1508.206908}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001762774, iterations_per_second: 567.287588}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014230446, iterations_per_second: 70.271866}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030237094, iterations_per_second: 33.071961}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000392, iterations_per_second: 2551020.456035}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000372464, iterations_per_second: 2684.825634}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004889317, iterations_per_second: 204.527544}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001738, iterations_per_second: 575274.697448}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001457, iterations_per_second: 686483.141773}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001864621, iterations_per_second: 536.302015}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002028445, iterations_per_second: 492.988471}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023219949, iterations_per_second: 43.066417}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033993015, iterations_per_second: 29.417808}
  xpath:
  xslt:
