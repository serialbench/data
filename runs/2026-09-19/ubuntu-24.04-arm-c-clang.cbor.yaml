platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000917, iterations_per_second: 1090631.488074}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001218, iterations_per_second: 821287.784133}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000655109, iterations_per_second: 1526.462758}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001764873, iterations_per_second: 566.613115}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014359677, iterations_per_second: 69.639449}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031523233, iterations_per_second: 31.722635}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000388, iterations_per_second: 2577319.657571}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000374267, iterations_per_second: 2671.886940}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004964011, iterations_per_second: 201.449997}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001650, iterations_per_second: 606170.821390}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001492, iterations_per_second: 670241.286308}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001882947, iterations_per_second: 531.082300}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002028695, iterations_per_second: 492.927720}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023675788, iterations_per_second: 42.237243}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035425284, iterations_per_second: 28.228426}
  xpath:
  xslt:
