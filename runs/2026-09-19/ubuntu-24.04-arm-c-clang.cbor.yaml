platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000912, iterations_per_second: 1096371.004510}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001191, iterations_per_second: 839983.195759}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000671937, iterations_per_second: 1488.234760}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001810324, iterations_per_second: 552.387409}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013473303, iterations_per_second: 74.220850}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.028879182, iterations_per_second: 34.627020}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000428, iterations_per_second: 2336448.606512}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000386593, iterations_per_second: 2586.699707}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005075126, iterations_per_second: 197.039443}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001655, iterations_per_second: 604120.098232}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001451, iterations_per_second: 689084.894926}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001882259, iterations_per_second: 531.276420}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002109785, iterations_per_second: 473.981871}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021775405, iterations_per_second: 45.923371}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032307719, iterations_per_second: 30.952355}
  xpath:
  xslt:
