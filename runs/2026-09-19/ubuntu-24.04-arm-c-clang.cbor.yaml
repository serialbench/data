platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000974, iterations_per_second: 1027010.372892}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002189, iterations_per_second: 456850.472634}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000661353, iterations_per_second: 1512.051047}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001785443, iterations_per_second: 560.084984}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014162589, iterations_per_second: 70.608559}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.029415282, iterations_per_second: 33.995934}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000404, iterations_per_second: 2475247.528912}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000369816, iterations_per_second: 2704.044981}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004911092, iterations_per_second: 203.620702}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001671, iterations_per_second: 598336.623901}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001435, iterations_per_second: 696767.000037}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001865206, iterations_per_second: 536.133906}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002023872, iterations_per_second: 494.102394}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022856435, iterations_per_second: 43.751355}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034465651, iterations_per_second: 29.014395}
  xpath:
  xslt:
