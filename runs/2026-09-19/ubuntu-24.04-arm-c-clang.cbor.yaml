platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000968, iterations_per_second: 1033057.844627}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001150, iterations_per_second: 869867.774792}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000659720, iterations_per_second: 1515.793814}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001784523, iterations_per_second: 560.373732}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014605036, iterations_per_second: 68.469533}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031583604, iterations_per_second: 31.661998}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000386, iterations_per_second: 2593361.048886}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000370293, iterations_per_second: 2700.561717}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004897197, iterations_per_second: 204.198442}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001675, iterations_per_second: 596908.014049}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001469, iterations_per_second: 680827.883075}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001868022, iterations_per_second: 535.325697}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002029506, iterations_per_second: 492.730662}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023588566, iterations_per_second: 42.393421}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035901176, iterations_per_second: 27.854241}
  xpath:
