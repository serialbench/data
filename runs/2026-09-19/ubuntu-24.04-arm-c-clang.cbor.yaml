platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000965, iterations_per_second: 1036484.245174}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001167, iterations_per_second: 856751.199495}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001194634, iterations_per_second: 837.076460}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001767407, iterations_per_second: 565.800740}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013712641, iterations_per_second: 72.925412}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.029664850, iterations_per_second: 33.709929}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000408, iterations_per_second: 2450980.394247}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000375583, iterations_per_second: 2662.527324}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004845822, iterations_per_second: 206.363337}
  xslt:
