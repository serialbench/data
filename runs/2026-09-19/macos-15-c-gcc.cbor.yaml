platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312499.998569}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285508}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000563667, iterations_per_second: 1774.098167}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001319667, iterations_per_second: 757.767113}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007105000, iterations_per_second: 140.745954}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.019024000, iterations_per_second: 52.565181}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.215430}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000332333, iterations_per_second: 3009.027081}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004144000, iterations_per_second: 241.312741}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238696}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000004300, iterations_per_second: 232558.139507}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001109667, iterations_per_second: 901.171523}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003979333, iterations_per_second: 251.298375}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013276000, iterations_per_second: 75.323893}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023116000, iterations_per_second: 43.260080}
  xpath:
  xslt:
