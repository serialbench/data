platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.713189}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.906688}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000667667, iterations_per_second: 1497.753370}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001371000, iterations_per_second: 729.394602}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007780000, iterations_per_second: 128.534704}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.020418000, iterations_per_second: 48.976393}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000800, iterations_per_second: 1250000.003156}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000756000, iterations_per_second: 1322.751323}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.009034000, iterations_per_second: 110.692938}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.668350}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.665823}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001027000, iterations_per_second: 973.709834}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001653667, iterations_per_second: 604.716791}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013833000, iterations_per_second: 72.290899}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.045671000, iterations_per_second: 21.895733}
