platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.855144}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003300, iterations_per_second: 303030.304839}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001234333, iterations_per_second: 810.153929}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002442333, iterations_per_second: 409.444520}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006805000, iterations_per_second: 146.950771}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.016529000, iterations_per_second: 60.499728}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000200, iterations_per_second: 5000000.012624}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000297333, iterations_per_second: 3363.228699}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003663000, iterations_per_second: 273.000273}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 250000.000631}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000004300, iterations_per_second: 232558.139507}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001517667, iterations_per_second: 658.906216}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002077000, iterations_per_second: 481.463650}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011809000, iterations_per_second: 84.681175}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.020606000, iterations_per_second: 48.529554}
  xpath:
  xslt:
