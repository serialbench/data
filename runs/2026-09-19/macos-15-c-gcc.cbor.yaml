    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001109333, iterations_per_second: 901.442308}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001677667, iterations_per_second: 596.065965}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014448000, iterations_per_second: 69.213732}
