platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001000, iterations_per_second: 1000000.002525}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.335437}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001158667, iterations_per_second: 863.060990}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001484000, iterations_per_second: 673.854447}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006979000, iterations_per_second: 143.287004}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023393000, iterations_per_second: 42.747831}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.278590}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000343000, iterations_per_second: 2915.451895}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004231000, iterations_per_second: 236.350745}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.668350}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.668350}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001091333, iterations_per_second: 916.310324}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001713333, iterations_per_second: 583.657588}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.019875000, iterations_per_second: 50.314465}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.024560000, iterations_per_second: 40.716612}
  xpath:
  xslt:
