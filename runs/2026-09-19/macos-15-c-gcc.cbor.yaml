platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001000, iterations_per_second: 1000000.002525}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.327542}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000519000, iterations_per_second: 1926.782274}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001334000, iterations_per_second: 749.625187}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006541000, iterations_per_second: 152.881822}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018344000, iterations_per_second: 54.513737}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000328000, iterations_per_second: 3048.780488}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004037000, iterations_per_second: 247.708695}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.716089}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.663297}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001045333, iterations_per_second: 956.632653}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001620667, iterations_per_second: 617.030029}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013329000, iterations_per_second: 75.024383}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.022383000, iterations_per_second: 44.676764}
  xpath:
  xslt:
