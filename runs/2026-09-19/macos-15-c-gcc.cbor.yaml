    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000778000, iterations_per_second: 1285.347044}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001314333, iterations_per_second: 760.841998}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006708000, iterations_per_second: 149.075730}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.019263000, iterations_per_second: 51.912994}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.468068}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000356000, iterations_per_second: 2808.988764}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004102000, iterations_per_second: 243.783520}
  generation:
