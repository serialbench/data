platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.585726}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003300, iterations_per_second: 303030.302751}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001118333, iterations_per_second: 894.187779}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002414667, iterations_per_second: 414.135837}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005929000, iterations_per_second: 168.662506}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.017457000, iterations_per_second: 57.283611}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.468068}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000316667, iterations_per_second: 3157.894737}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004005000, iterations_per_second: 249.687890}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 250000.000631}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000004300, iterations_per_second: 232558.139507}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001504667, iterations_per_second: 664.599025}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002001667, iterations_per_second: 499.583680}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012191000, iterations_per_second: 82.027725}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.022722000, iterations_per_second: 44.010210}
