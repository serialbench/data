platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.906688}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.665823}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001606667, iterations_per_second: 622.406639}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002781333, iterations_per_second: 359.539789}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007346000, iterations_per_second: 136.128505}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023929000, iterations_per_second: 41.790296}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000400, iterations_per_second: 2500000.006312}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000387000, iterations_per_second: 2583.979328}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.006553000, iterations_per_second: 152.601862}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.668350}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.668350}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001033333, iterations_per_second: 967.741935}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001716667, iterations_per_second: 582.524272}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015976000, iterations_per_second: 62.593891}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030281000, iterations_per_second: 33.024008}
  xpath:
  xslt:
