platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.335437}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.335437}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000989000, iterations_per_second: 1011.122346}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001503000, iterations_per_second: 665.335995}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007132000, iterations_per_second: 140.213124}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.021103000, iterations_per_second: 47.386627}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000334000, iterations_per_second: 2994.011976}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004502000, iterations_per_second: 222.123501}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 624999.999358}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 624999.999358}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001177000, iterations_per_second: 849.617672}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001802000, iterations_per_second: 554.938957}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.017013000, iterations_per_second: 58.778581}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.028809000, iterations_per_second: 34.711375}
