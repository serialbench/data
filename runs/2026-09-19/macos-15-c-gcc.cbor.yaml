platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.710289}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312499.999679}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000682000, iterations_per_second: 1466.275660}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001461333, iterations_per_second: 684.306569}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014784000, iterations_per_second: 67.640693}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018449000, iterations_per_second: 54.203480}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000318333, iterations_per_second: 3141.361256}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004089000, iterations_per_second: 244.558572}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.291669}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001900, iterations_per_second: 526315.790803}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001128000, iterations_per_second: 886.524823}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002024333, iterations_per_second: 493.989791}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013910000, iterations_per_second: 71.890726}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023471000, iterations_per_second: 42.605769}
  xpath:
  xslt:
