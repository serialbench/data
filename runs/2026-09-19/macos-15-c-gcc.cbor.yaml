platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.855144}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.585726}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001337000, iterations_per_second: 747.943156}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002282333, iterations_per_second: 438.148094}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007111000, iterations_per_second: 140.627197}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.015368000, iterations_per_second: 65.070276}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.215430}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000296333, iterations_per_second: 3374.578177}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003694000, iterations_per_second: 270.709258}
  xslt:
