    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.369746}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001129667, iterations_per_second: 885.216878}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002223333, iterations_per_second: 449.775112}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006050000, iterations_per_second: 165.289256}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.017654000, iterations_per_second: 56.644387}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000303667, iterations_per_second: 3293.084523}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003666000, iterations_per_second: 272.776869}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.647310}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003500, iterations_per_second: 285714.285972}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001513333, iterations_per_second: 660.792952}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002034667, iterations_per_second: 491.480996}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012031000, iterations_per_second: 83.118610}
