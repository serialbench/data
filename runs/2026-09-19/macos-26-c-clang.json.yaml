platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: json-c, format: json, version: '0.19', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: json, data_size: small, time_per_iteration: 0.000001000, iterations_per_second: 1000000.002525}
    - {adapter: jansson, format: json, data_size: small, time_per_iteration: 0.000004100, iterations_per_second: 243902.438964}
    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.000414667, iterations_per_second: 2411.575563}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003636000, iterations_per_second: 275.027503}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.004814000, iterations_per_second: 207.727462}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.041423000, iterations_per_second: 24.141178}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000003300, iterations_per_second: 303030.302751}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002254333, iterations_per_second: 443.590123}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.040292000, iterations_per_second: 24.818823}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000001671, iterations_per_second: 598515.681987}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.001890819, iterations_per_second: 528.871258}
    - {adapter: nlohmann-json, format: json, data_size: large, time_per_iteration: 0.026134000, iterations_per_second: 38.264330}
