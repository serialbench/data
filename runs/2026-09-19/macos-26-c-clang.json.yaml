    - {adapter: yeptris, format: json, data_size: medium, time_per_iteration: 0.000465000, iterations_per_second: 2150.537634}
    - {adapter: jansson, format: json, data_size: medium, time_per_iteration: 0.003438333, iterations_per_second: 290.838585}
    - {adapter: yeptris, format: json, data_size: large, time_per_iteration: 0.005300000, iterations_per_second: 188.679245}
    - {adapter: jansson, format: json, data_size: large, time_per_iteration: 0.042283000, iterations_per_second: 23.650167}
    - {adapter: json-c, format: json, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270122}
    - {adapter: json-c, format: json, data_size: medium, time_per_iteration: 0.002381333, iterations_per_second: 419.932811}
    - {adapter: json-c, format: json, data_size: large, time_per_iteration: 0.040389000, iterations_per_second: 24.759217}
    - {adapter: nlohmann-json, format: json, data_size: small, time_per_iteration: 0.000002237, iterations_per_second: 446927.375146}
    - {adapter: nlohmann-json, format: json, data_size: medium, time_per_iteration: 0.001920875, iterations_per_second: 520.596083}
