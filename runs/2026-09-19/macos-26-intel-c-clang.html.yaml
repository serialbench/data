platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005900, iterations_per_second: 169491.525525}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000015500, iterations_per_second: 64516.128959}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000012900, iterations_per_second: 77519.379836}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.005611333, iterations_per_second: 178.210764}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.015068667, iterations_per_second: 66.362872}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002793000, iterations_per_second: 358.037952}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.108830000, iterations_per_second: 9.188643}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.207210000, iterations_per_second: 4.826022}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.027987000, iterations_per_second: 35.730875}
  xslt:
