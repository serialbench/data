platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000017800, iterations_per_second: 56179.775279}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008100, iterations_per_second: 123456.790089}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.018202667, iterations_per_second: 54.937006}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002590667, iterations_per_second: 386.001029}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.219956000, iterations_per_second: 4.546364}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.028655000, iterations_per_second: 34.897924}
  xslt:
