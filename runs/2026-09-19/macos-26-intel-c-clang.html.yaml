platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
benchmark_result:
  parsing:
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008900, iterations_per_second: 112359.550558}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002907667, iterations_per_second: 343.918377}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.029152000, iterations_per_second: 34.302964}
  xslt:
