platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005200, iterations_per_second: 192307.692793}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000011500, iterations_per_second: 86956.521529}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007700, iterations_per_second: 129870.129623}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.004482667, iterations_per_second: 223.081499}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.009510333, iterations_per_second: 105.148786}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002427333, iterations_per_second: 411.974732}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.055061000, iterations_per_second: 18.161675}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.098413000, iterations_per_second: 10.161259}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.024492000, iterations_per_second: 40.829659}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006500, iterations_per_second: 153846.153427}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009800, iterations_per_second: 102040.815874}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.004990000, iterations_per_second: 200.400802}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003618333, iterations_per_second: 276.370336}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.057229000, iterations_per_second: 17.473658}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.034828000, iterations_per_second: 28.712530}
