platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005600, iterations_per_second: 178571.427572}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000013100, iterations_per_second: 76335.877989}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008000, iterations_per_second: 124999.999605}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.005909000, iterations_per_second: 169.233373}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.015329000, iterations_per_second: 65.235828}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002522000, iterations_per_second: 396.510706}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.113193000, iterations_per_second: 8.834469}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.213594000, iterations_per_second: 4.681779}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.025299000, iterations_per_second: 39.527254}
  xslt:
