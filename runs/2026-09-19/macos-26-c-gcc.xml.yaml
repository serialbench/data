platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.607644}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.426185}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000564667, iterations_per_second: 1770.956316}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002128333, iterations_per_second: 469.851214}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.009924000, iterations_per_second: 100.765820}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.030531000, iterations_per_second: 32.753595}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000367, iterations_per_second: 2727024.825432}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000264570, iterations_per_second: 3779.722795}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.004494917, iterations_per_second: 222.473518}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000048400, iterations_per_second: 20661.157026}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000050900, iterations_per_second: 19646.365422}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002713667, iterations_per_second: 368.505098}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.003850667, iterations_per_second: 259.695291}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.035206000, iterations_per_second: 28.404249}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.071688000, iterations_per_second: 13.949336}
