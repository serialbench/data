platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000002100, iterations_per_second: 476190.474815}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666456}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000590333, iterations_per_second: 1693.958216}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002076000, iterations_per_second: 481.695568}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.007694000, iterations_per_second: 129.971406}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.027838000, iterations_per_second: 35.922121}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000354, iterations_per_second: 2824060.944558}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000226278, iterations_per_second: 4419.349089}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.003109458, iterations_per_second: 321.599456}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000044300, iterations_per_second: 22573.363424}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000048800, iterations_per_second: 20491.803273}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002402000, iterations_per_second: 416.319734}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.003627667, iterations_per_second: 275.659285}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.029863000, iterations_per_second: 33.486254}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.051692000, iterations_per_second: 19.345353}
