platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 500000.001262}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000005600, iterations_per_second: 178571.429022}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000550333, iterations_per_second: 1817.080557}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.001946333, iterations_per_second: 513.786607}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.007452000, iterations_per_second: 134.192163}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.026513000, iterations_per_second: 37.717346}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000329, iterations_per_second: 3038589.898546}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000213583, iterations_per_second: 4682.013266}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.002920958, iterations_per_second: 342.353433}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000041700, iterations_per_second: 23980.815363}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000046400, iterations_per_second: 21551.724150}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002311333, iterations_per_second: 432.650707}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.003522000, iterations_per_second: 283.929585}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.029749000, iterations_per_second: 33.614575}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.047554000, iterations_per_second: 21.028725}
