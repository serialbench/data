platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.7', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.334175}
    - {adapter: libxml2, format: xml, data_size: small, time_per_iteration: 0.000006800, iterations_per_second: 147058.823901}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000591000, iterations_per_second: 1692.047377}
    - {adapter: libxml2, format: xml, data_size: medium, time_per_iteration: 0.002151667, iterations_per_second: 464.756003}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.008107000, iterations_per_second: 123.350191}
    - {adapter: libxml2, format: xml, data_size: large, time_per_iteration: 0.029369000, iterations_per_second: 34.049508}
    - {adapter: pugixml, format: xml, data_size: small, time_per_iteration: 0.000000371, iterations_per_second: 2696144.432305}
    - {adapter: pugixml, format: xml, data_size: medium, time_per_iteration: 0.000224125, iterations_per_second: 4461.795873}
    - {adapter: pugixml, format: xml, data_size: large, time_per_iteration: 0.003182208, iterations_per_second: 314.247215}
  xslt:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000046400, iterations_per_second: 21551.724140}
    - {adapter: libxslt, format: xml, data_size: small, time_per_iteration: 0.000051800, iterations_per_second: 19305.019303}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002687667, iterations_per_second: 372.069949}
    - {adapter: libxslt, format: xml, data_size: medium, time_per_iteration: 0.003997333, iterations_per_second: 250.166778}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.031660000, iterations_per_second: 31.585597}
    - {adapter: libxslt, format: xml, data_size: large, time_per_iteration: 0.057621000, iterations_per_second: 17.354784}
