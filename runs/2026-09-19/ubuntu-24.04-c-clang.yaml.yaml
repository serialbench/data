platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: 'native', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: 'native', features: {}}
    - {name: yeptris, format: yaml, version: 'native', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: 'native', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004558, iterations_per_second: 219418.540860}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004629, iterations_per_second: 216043.381627}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001798534, iterations_per_second: 556.008497}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004460999, iterations_per_second: 224.165036}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024959598, iterations_per_second: 40.064748}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056095988, iterations_per_second: 17.826587}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 768994.156725}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001365834, iterations_per_second: 732.153216}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020652182, iterations_per_second: 48.421034}
  xslt:
