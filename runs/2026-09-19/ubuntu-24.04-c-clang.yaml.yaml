platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003571, iterations_per_second: 280010.080454}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000002992, iterations_per_second: 334179.922593}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001456226, iterations_per_second: 686.706754}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002810688, iterations_per_second: 355.784776}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019685698, iterations_per_second: 50.798300}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.035282800, iterations_per_second: 28.342422}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001023, iterations_per_second: 977039.570996}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000951393, iterations_per_second: 1051.090717}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.015737089, iterations_per_second: 63.544154}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004762, iterations_per_second: 209995.800068}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004716, iterations_per_second: 212048.601583}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002603907, iterations_per_second: 384.038293}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004011791, iterations_per_second: 249.265208}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.034973646, iterations_per_second: 28.592958}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.050369663, iterations_per_second: 19.853220}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001210, iterations_per_second: 826582.905354}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001207146, iterations_per_second: 828.400439}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018839803, iterations_per_second: 53.079111}
  xpath:
  xslt:
