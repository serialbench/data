platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004679, iterations_per_second: 213730.016217}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004498607, iterations_per_second: 222.291050}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055134418, iterations_per_second: 18.137491}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001254, iterations_per_second: 797193.877519}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001344868, iterations_per_second: 743.567398}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.025703331, iterations_per_second: 38.905463}
  xslt:
