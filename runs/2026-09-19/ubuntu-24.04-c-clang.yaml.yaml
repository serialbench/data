platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004575, iterations_per_second: 218598.347339}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004670, iterations_per_second: 214146.518974}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001702196, iterations_per_second: 587.476413}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004416880, iterations_per_second: 226.404159}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024318464, iterations_per_second: 41.121018}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055172777, iterations_per_second: 18.124881}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001256, iterations_per_second: 795988.218568}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001320881, iterations_per_second: 757.070661}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020090637, iterations_per_second: 49.774430}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006189, iterations_per_second: 161587.434968}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006729, iterations_per_second: 148599.450227}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003092753, iterations_per_second: 323.336488}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006184695, iterations_per_second: 161.689452}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043561198, iterations_per_second: 22.956210}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.077987443, iterations_per_second: 12.822577}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001584, iterations_per_second: 631352.988907}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001628849, iterations_per_second: 613.930325}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.024276046, iterations_per_second: 41.192870}
  xpath:
  xslt:
