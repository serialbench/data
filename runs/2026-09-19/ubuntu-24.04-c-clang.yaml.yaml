platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006624, iterations_per_second: 150968.462739}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005890, iterations_per_second: 169779.286930}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002119883, iterations_per_second: 471.724147}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004315734, iterations_per_second: 231.710313}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.027024393, iterations_per_second: 37.003606}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.053905940, iterations_per_second: 18.550831}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001131, iterations_per_second: 883782.589894}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001224834, iterations_per_second: 816.437166}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032185174, iterations_per_second: 31.070206}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009826, iterations_per_second: 101775.991032}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008853, iterations_per_second: 112956.060094}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003198217, iterations_per_second: 312.674186}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006169188, iterations_per_second: 162.095878}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.047115713, iterations_per_second: 21.224342}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078453689, iterations_per_second: 12.746373}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001463, iterations_per_second: 683480.281636}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001535081, iterations_per_second: 651.431281}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.037498002, iterations_per_second: 26.668088}
  xpath:
  xslt:
