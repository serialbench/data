platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004506, iterations_per_second: 221916.471070}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003230, iterations_per_second: 309578.354067}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001075375, iterations_per_second: 929.907883}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003061904, iterations_per_second: 326.594171}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.017834504, iterations_per_second: 56.071086}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.037018252, iterations_per_second: 27.013701}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000809, iterations_per_second: 1235330.451152}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000868814, iterations_per_second: 1150.994344}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.014756704, iterations_per_second: 67.765810}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005566, iterations_per_second: 179649.324514}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004783, iterations_per_second: 209082.545822}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002212363, iterations_per_second: 452.005322}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005125635, iterations_per_second: 195.097765}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.029715556, iterations_per_second: 33.652408}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.053382179, iterations_per_second: 18.732843}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000953, iterations_per_second: 1049428.054302}
