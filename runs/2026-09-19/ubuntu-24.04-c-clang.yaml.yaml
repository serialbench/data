platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005133, iterations_per_second: 194829.232200}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004865, iterations_per_second: 205541.396021}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001688199, iterations_per_second: 592.347112}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004485071, iterations_per_second: 222.961911}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023866249, iterations_per_second: 41.900175}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056584512, iterations_per_second: 17.672680}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001255, iterations_per_second: 796558.866067}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001327521, iterations_per_second: 753.283752}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.021372558, iterations_per_second: 46.788971}
  xslt:
