platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004679, iterations_per_second: 213734.584383}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004638, iterations_per_second: 215624.123943}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001766932, iterations_per_second: 565.952843}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004439592, iterations_per_second: 225.245907}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025207538, iterations_per_second: 39.670673}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.054930847, iterations_per_second: 18.204707}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001219, iterations_per_second: 820142.704600}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001322246, iterations_per_second: 756.289111}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020206031, iterations_per_second: 49.490174}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006347, iterations_per_second: 157559.715113}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006611, iterations_per_second: 151256.182591}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003286516, iterations_per_second: 304.273614}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006221853, iterations_per_second: 160.723832}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045840655, iterations_per_second: 21.814697}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.077609067, iterations_per_second: 12.885092}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001557, iterations_per_second: 642302.009293}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001625344, iterations_per_second: 615.254245}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.024428264, iterations_per_second: 40.936188}
  xpath:
  xslt:
