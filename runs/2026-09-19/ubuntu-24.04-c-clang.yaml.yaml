platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004561, iterations_per_second: 219269.394444}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004641, iterations_per_second: 215484.732844}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001821549, iterations_per_second: 548.983310}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004490110, iterations_per_second: 222.711676}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025433433, iterations_per_second: 39.318326}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055049157, iterations_per_second: 18.165582}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001245, iterations_per_second: 803019.353907}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001312670, iterations_per_second: 761.805896}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020337470, iterations_per_second: 49.170325}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006261, iterations_per_second: 159723.996914}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006655, iterations_per_second: 150251.671574}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003318184, iterations_per_second: 301.369665}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006185823, iterations_per_second: 161.659976}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045271065, iterations_per_second: 22.089164}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078316887, iterations_per_second: 12.768638}
