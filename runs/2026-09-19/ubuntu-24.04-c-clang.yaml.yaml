platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004561, iterations_per_second: 219259.779017}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003847, iterations_per_second: 259963.085269}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001790829, iterations_per_second: 558.400607}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003608128, iterations_per_second: 277.152030}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024338161, iterations_per_second: 41.087739}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.045357585, iterations_per_second: 22.047029}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001288, iterations_per_second: 776457.798031}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001231520, iterations_per_second: 812.004457}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.019341488, iterations_per_second: 51.702330}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006080, iterations_per_second: 164468.274050}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006013, iterations_per_second: 166306.336327}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003274561, iterations_per_second: 305.384478}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005212150, iterations_per_second: 191.859405}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.044359097, iterations_per_second: 22.543290}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.065024770, iterations_per_second: 15.378755}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001575, iterations_per_second: 634799.721278}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001566226, iterations_per_second: 638.477597}
