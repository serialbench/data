platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004520, iterations_per_second: 221263.414033}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004691, iterations_per_second: 213183.252316}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001786160, iterations_per_second: 559.860363}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004446655, iterations_per_second: 224.888163}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025280157, iterations_per_second: 39.556716}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055393667, iterations_per_second: 18.052605}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001222, iterations_per_second: 818129.755459}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001308187, iterations_per_second: 764.416903}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.019739477, iterations_per_second: 50.659904}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006285, iterations_per_second: 159114.052884}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006621, iterations_per_second: 151025.462925}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003279022, iterations_per_second: 304.968951}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006198831, iterations_per_second: 161.320739}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045493071, iterations_per_second: 21.981369}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.077655654, iterations_per_second: 12.877362}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001567, iterations_per_second: 638202.820000}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001624149, iterations_per_second: 615.707056}
