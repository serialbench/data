platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004574, iterations_per_second: 218603.126052}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004672, iterations_per_second: 214054.840834}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001795770, iterations_per_second: 556.864186}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004434614, iterations_per_second: 225.498753}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025664809, iterations_per_second: 38.963859}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.054973629, iterations_per_second: 18.190540}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001275, iterations_per_second: 784067.742791}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001298142, iterations_per_second: 770.331553}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.019864459, iterations_per_second: 50.341165}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006325, iterations_per_second: 158107.766245}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006655, iterations_per_second: 150251.671574}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003285046, iterations_per_second: 304.409771}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006185010, iterations_per_second: 161.681235}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045600772, iterations_per_second: 21.929453}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.077928638, iterations_per_second: 12.832253}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001578, iterations_per_second: 633753.723520}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001641118, iterations_per_second: 609.340582}
