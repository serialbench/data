platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004553, iterations_per_second: 219611.288029}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004609, iterations_per_second: 216980.927304}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001749762, iterations_per_second: 571.506296}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004572590, iterations_per_second: 218.694438}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024475633, iterations_per_second: 40.856962}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057296897, iterations_per_second: 17.452952}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001305, iterations_per_second: 765990.043163}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001326596, iterations_per_second: 753.808997}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020669090, iterations_per_second: 48.381424}
  xslt:
