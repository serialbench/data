platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.7', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.7', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004720, iterations_per_second: 211868.895556}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004617, iterations_per_second: 216609.626112}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001748124, iterations_per_second: 572.041691}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004469869, iterations_per_second: 223.720186}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024363795, iterations_per_second: 41.044509}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.056259880, iterations_per_second: 17.774656}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001391, iterations_per_second: 719114.051881}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001341802, iterations_per_second: 745.266625}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020497668, iterations_per_second: 48.786038}
  xslt:
