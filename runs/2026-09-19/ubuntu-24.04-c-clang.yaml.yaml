platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003561, iterations_per_second: 280796.338460}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003032, iterations_per_second: 329771.797984}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001334691, iterations_per_second: 749.237276}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002843481, iterations_per_second: 351.681577}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.018231977, iterations_per_second: 54.848687}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.035744192, iterations_per_second: 27.976573}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000990, iterations_per_second: 1009693.053798}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000978642, iterations_per_second: 1021.824468}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.015817653, iterations_per_second: 63.220504}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004645, iterations_per_second: 215289.887854}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004672, iterations_per_second: 214045.677298}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002434594, iterations_per_second: 410.746048}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004036416, iterations_per_second: 247.744534}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.033649409, iterations_per_second: 29.718204}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.052325372, iterations_per_second: 19.111188}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001262, iterations_per_second: 792455.819497}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001226387, iterations_per_second: 815.403073}
