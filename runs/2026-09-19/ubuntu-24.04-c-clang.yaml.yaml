platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004588, iterations_per_second: 217936.144750}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004634, iterations_per_second: 215814.917141}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001827903, iterations_per_second: 547.074882}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004520961, iterations_per_second: 221.191910}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025914334, iterations_per_second: 38.588682}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055098382, iterations_per_second: 18.149353}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001293, iterations_per_second: 773156.022201}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001346258, iterations_per_second: 742.799671}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020094117, iterations_per_second: 49.765810}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006315, iterations_per_second: 158358.142823}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006670, iterations_per_second: 149916.047002}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003332108, iterations_per_second: 300.110291}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006227959, iterations_per_second: 160.566238}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045984254, iterations_per_second: 21.746574}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078153970, iterations_per_second: 12.795255}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001578, iterations_per_second: 633753.723520}
