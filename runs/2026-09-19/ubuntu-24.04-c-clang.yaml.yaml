platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.205', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004565, iterations_per_second: 219077.246687}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004657, iterations_per_second: 214744.346994}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001764024, iterations_per_second: 566.885711}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004445271, iterations_per_second: 224.958147}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025305345, iterations_per_second: 39.517343}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055196924, iterations_per_second: 18.116952}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001264, iterations_per_second: 790888.960419}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001320212, iterations_per_second: 757.454106}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020483260, iterations_per_second: 48.820354}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006417, iterations_per_second: 155836.060391}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007183, iterations_per_second: 139209.844845}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003264673, iterations_per_second: 306.309391}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006197710, iterations_per_second: 161.349909}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045550952, iterations_per_second: 21.953438}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.077840269, iterations_per_second: 12.846821}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001613, iterations_per_second: 619962.802006}
