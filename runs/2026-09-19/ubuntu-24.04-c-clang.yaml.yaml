platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.203', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.8', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.8', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.8', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002481, iterations_per_second: 403112.025020}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000002217, iterations_per_second: 450978.624017}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000934194, iterations_per_second: 1070.441090}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.001990350, iterations_per_second: 502.424197}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.012857453, iterations_per_second: 77.775902}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.025961557, iterations_per_second: 38.518491}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000721, iterations_per_second: 1386770.212900}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000630566, iterations_per_second: 1585.876815}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.011610249, iterations_per_second: 86.130797}
  xslt:
