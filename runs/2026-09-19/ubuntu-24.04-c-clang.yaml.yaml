platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.204', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.9', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.9', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.1.24', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.9', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004902, iterations_per_second: 203990.045350}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004764, iterations_per_second: 209912.046845}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001838729, iterations_per_second: 543.853934}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004443293, iterations_per_second: 225.058324}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025763704, iterations_per_second: 38.814295}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055280995, iterations_per_second: 18.089399}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001279, iterations_per_second: 781616.383555}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001304182, iterations_per_second: 766.764148}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020299965, iterations_per_second: 49.261169}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006535, iterations_per_second: 153017.505252}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006727, iterations_per_second: 148663.515058}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003298694, iterations_per_second: 303.150308}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006209195, iterations_per_second: 161.051473}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045330712, iterations_per_second: 22.060099}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.077860659, iterations_per_second: 12.843457}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002798, iterations_per_second: 357372.596593}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001630017, iterations_per_second: 613.490409}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.024565564, iterations_per_second: 40.707390}
  xpath:
  xslt:
