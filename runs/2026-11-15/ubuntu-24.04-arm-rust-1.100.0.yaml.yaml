platform:
  platform_string: ubuntu-24.04-arm-rust-1.100.0
  kind: native
  os: linux
  arch: arm64
  runtime: rust
  runtime_version: 1.100.0
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003024, iterations_per_second: 330676.895605}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000007556, iterations_per_second: 132339.901804}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001864899, iterations_per_second: 536.221973}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.007899982, iterations_per_second: 126.582562}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024836935, iterations_per_second: 40.262617}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.100208440, iterations_per_second: 9.979199}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004666, iterations_per_second: 214325.517596}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000008637, iterations_per_second: 115779.601950}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002971988, iterations_per_second: 336.475114}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.009061419, iterations_per_second: 110.357987}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.044956200, iterations_per_second: 22.243873}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.118974982, iterations_per_second: 8.405128}
  xpath:
