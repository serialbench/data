platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000579, iterations_per_second: 1726817.481888}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004285, iterations_per_second: 233372.228706}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000077919, iterations_per_second: 12833.895173}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000466135, iterations_per_second: 2145.299720}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001589612, iterations_per_second: 629.084330}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005609520, iterations_per_second: 178.268372}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000792, iterations_per_second: 1261988.891926}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000125150, iterations_per_second: 7990.432788}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002043126, iterations_per_second: 489.446074}
  xpath:
  xslt:
