platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000756, iterations_per_second: 1322751.322709}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001145, iterations_per_second: 873515.023749}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000533556, iterations_per_second: 1874.218685}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001765374, iterations_per_second: 566.452208}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014353397, iterations_per_second: 69.669919}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032427393, iterations_per_second: 30.838125}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000416, iterations_per_second: 2403846.152032}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000390198, iterations_per_second: 2562.799260}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005103026, iterations_per_second: 195.962160}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001402, iterations_per_second: 713063.320274}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001446, iterations_per_second: 691754.288763}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001849009, iterations_per_second: 540.830250}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002024156, iterations_per_second: 494.032987}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021238088, iterations_per_second: 47.085218}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.036069846, iterations_per_second: 27.723989}
