platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003331, iterations_per_second: 300201.134927}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000002983, iterations_per_second: 335289.186780}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001348169, iterations_per_second: 741.746586}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002918962, iterations_per_second: 342.587575}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.018168457, iterations_per_second: 55.040447}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.036077774, iterations_per_second: 27.717896}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001273, iterations_per_second: 785607.668090}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001052159, iterations_per_second: 950.426694}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.035050863, iterations_per_second: 28.529968}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005077, iterations_per_second: 196978.352061}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004835, iterations_per_second: 206812.400667}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002310690, iterations_per_second: 432.771226}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004397848, iterations_per_second: 227.383939}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.055614919, iterations_per_second: 17.980787}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055555329, iterations_per_second: 18.000073}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001527, iterations_per_second: 654750.213906}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001320150, iterations_per_second: 757.489488}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.038394663, iterations_per_second: 26.045287}
  xpath:
  xslt:
