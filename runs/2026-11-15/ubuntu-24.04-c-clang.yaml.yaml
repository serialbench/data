platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005094, iterations_per_second: 196297.822983}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003792, iterations_per_second: 263692.218388}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001586207, iterations_per_second: 630.434741}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003481997, iterations_per_second: 287.191544}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021475975, iterations_per_second: 46.563660}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.042761116, iterations_per_second: 23.385732}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000962, iterations_per_second: 1039176.973713}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000997971, iterations_per_second: 1002.033460}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032332983, iterations_per_second: 30.928170}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006876, iterations_per_second: 145435.506592}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005649, iterations_per_second: 177022.481882}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002642438, iterations_per_second: 378.438444}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004948881, iterations_per_second: 202.065881}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.039222784, iterations_per_second: 25.495386}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.062271513, iterations_per_second: 16.058707}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001104, iterations_per_second: 905715.062584}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001233905, iterations_per_second: 810.434944}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.035589498, iterations_per_second: 28.098177}
  xpath:
  xslt:
