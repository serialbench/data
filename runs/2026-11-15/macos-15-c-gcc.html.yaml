platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006300, iterations_per_second: 158730.158701}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000006900, iterations_per_second: 144927.536240}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238052}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000698000, iterations_per_second: 1432.664756}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001673333, iterations_per_second: 597.609562}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001519000, iterations_per_second: 658.327847}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005564000, iterations_per_second: 179.726815}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.017121000, iterations_per_second: 58.407803}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014482000, iterations_per_second: 69.051236}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005700, iterations_per_second: 175438.596497}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000912000, iterations_per_second: 1096.491228}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002070000, iterations_per_second: 483.091787}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009647000, iterations_per_second: 103.659169}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.016450000, iterations_per_second: 60.790274}
