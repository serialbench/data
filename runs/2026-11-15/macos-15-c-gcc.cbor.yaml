platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 499999.999841}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312500.000234}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000538667, iterations_per_second: 1856.435644}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001499333, iterations_per_second: 666.963095}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.006980000, iterations_per_second: 143.266476}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.019038000, iterations_per_second: 52.526526}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000348333, iterations_per_second: 2870.813397}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.008277000, iterations_per_second: 120.816721}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000003300, iterations_per_second: 303030.303273}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000927333, iterations_per_second: 1078.360891}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001757667, iterations_per_second: 568.936090}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013535000, iterations_per_second: 73.882527}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.055392000, iterations_per_second: 18.053148}
  xpath:
  xslt:
