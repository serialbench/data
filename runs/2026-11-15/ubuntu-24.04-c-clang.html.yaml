platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001113, iterations_per_second: 898634.075296}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002865, iterations_per_second: 349015.775544}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004452, iterations_per_second: 224638.332272}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000372503, iterations_per_second: 2684.539736}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001597842, iterations_per_second: 625.844107}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001057544, iterations_per_second: 945.587134}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003738574, iterations_per_second: 267.481665}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015908434, iterations_per_second: 62.859738}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011231420, iterations_per_second: 89.035937}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002093, iterations_per_second: 477737.435871}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005495, iterations_per_second: 181970.375201}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000756147, iterations_per_second: 1322.494171}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001409100, iterations_per_second: 709.673009}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007789480, iterations_per_second: 128.378274}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014805134, iterations_per_second: 67.544137}
  xpath:
  xslt:
