platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000641, iterations_per_second: 1560062.403115}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003015, iterations_per_second: 331729.971683}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000427009, iterations_per_second: 2341.872843}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001566052, iterations_per_second: 638.548401}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.019335800, iterations_per_second: 51.717539}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034745235, iterations_per_second: 28.780925}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000370, iterations_per_second: 2705627.710628}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000353795, iterations_per_second: 2826.492906}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004460808, iterations_per_second: 224.174634}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001186, iterations_per_second: 843312.532088}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001392, iterations_per_second: 718339.199548}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002117324, iterations_per_second: 472.294199}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002015765, iterations_per_second: 496.089574}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.025926111, iterations_per_second: 38.571153}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.041099521, iterations_per_second: 24.331184}
