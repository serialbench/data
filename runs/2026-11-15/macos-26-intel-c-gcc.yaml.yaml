platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000009400, iterations_per_second: 106382.978735}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009900, iterations_per_second: 101010.100917}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002818000, iterations_per_second: 354.861604}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.009045000, iterations_per_second: 110.558320}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.043429000, iterations_per_second: 23.026089}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.114452000, iterations_per_second: 8.737287}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002560, iterations_per_second: 390701.308682}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002439783, iterations_per_second: 409.872461}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.055525128, iterations_per_second: 18.009864}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000013500, iterations_per_second: 74074.074074}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000015300, iterations_per_second: 65359.477095}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.004871667, iterations_per_second: 205.268560}
