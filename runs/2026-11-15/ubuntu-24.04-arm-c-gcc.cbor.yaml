platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000775, iterations_per_second: 1289989.677399}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001242, iterations_per_second: 804893.753714}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000540813, iterations_per_second: 1849.069117}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001936213, iterations_per_second: 516.472192}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014063673, iterations_per_second: 71.105180}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032245918, iterations_per_second: 31.011677}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000372, iterations_per_second: 2688172.046512}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000323727, iterations_per_second: 3089.025721}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004190728, iterations_per_second: 238.622025}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001410, iterations_per_second: 708968.451351}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001539, iterations_per_second: 649688.149918}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001774891, iterations_per_second: 563.414986}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002155544, iterations_per_second: 463.919941}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.020815441, iterations_per_second: 48.041259}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.036281505, iterations_per_second: 27.562252}
  xpath:
  xslt:
