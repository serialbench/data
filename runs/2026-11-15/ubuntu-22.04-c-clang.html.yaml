platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001119, iterations_per_second: 893894.699336}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003329, iterations_per_second: 300390.507618}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005977, iterations_per_second: 167310.813288}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000357374, iterations_per_second: 2798.189012}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001786013, iterations_per_second: 559.906443}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000996038, iterations_per_second: 1003.977760}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.003499293, iterations_per_second: 285.772012}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016765974, iterations_per_second: 59.644611}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010147130, iterations_per_second: 98.550033}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002202, iterations_per_second: 454070.744229}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005118, iterations_per_second: 195400.277456}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000776528, iterations_per_second: 1287.784123}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001308792, iterations_per_second: 764.063545}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007945981, iterations_per_second: 125.849785}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013327233, iterations_per_second: 75.034330}
  xpath:
  xslt:
