platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.714639}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004800, iterations_per_second: 208333.333243}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000100333, iterations_per_second: 9966.777408}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000467667, iterations_per_second: 2138.275125}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000617000, iterations_per_second: 1620.745543}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002340000, iterations_per_second: 427.350427}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454545.454519}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000194333, iterations_per_second: 5145.797599}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001045000, iterations_per_second: 956.937799}
  xpath:
  xslt:
