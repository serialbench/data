platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000643, iterations_per_second: 1555209.950121}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000889, iterations_per_second: 1124859.392107}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000483280, iterations_per_second: 2069.195269}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001541575, iterations_per_second: 648.687079}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012837504, iterations_per_second: 77.896762}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032219002, iterations_per_second: 31.037585}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000342, iterations_per_second: 2923976.621401}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000323510, iterations_per_second: 3091.094557}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003932943, iterations_per_second: 254.262520}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001285, iterations_per_second: 778331.258812}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001278, iterations_per_second: 782288.976525}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001691456, iterations_per_second: 591.206629}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001904392, iterations_per_second: 525.101975}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.020551972, iterations_per_second: 48.657131}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.036564762, iterations_per_second: 27.348735}
