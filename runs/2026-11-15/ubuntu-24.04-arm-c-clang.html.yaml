platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001355, iterations_per_second: 737898.464471}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003101, iterations_per_second: 322487.019928}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005063, iterations_per_second: 197495.753880}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000469310, iterations_per_second: 2130.786239}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001684472, iterations_per_second: 593.657717}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001353346, iterations_per_second: 738.909522}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004587256, iterations_per_second: 217.995246}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016051740, iterations_per_second: 62.298542}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013674652, iterations_per_second: 73.128004}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002365, iterations_per_second: 422850.860262}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006240, iterations_per_second: 160251.274004}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000837889, iterations_per_second: 1193.475033}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001774774, iterations_per_second: 563.451917}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008536761, iterations_per_second: 117.140447}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017977835, iterations_per_second: 55.624050}
  xpath:
  xslt:
