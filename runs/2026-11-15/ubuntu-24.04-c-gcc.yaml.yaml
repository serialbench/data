platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004506, iterations_per_second: 221906.621667}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004705, iterations_per_second: 212553.404000}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001973106, iterations_per_second: 506.815143}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004517089, iterations_per_second: 221.381514}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.027421767, iterations_per_second: 36.467380}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055552846, iterations_per_second: 18.000878}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001538, iterations_per_second: 650279.620215}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001356410, iterations_per_second: 737.240034}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.038267543, iterations_per_second: 26.131806}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006638, iterations_per_second: 150638.708106}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000013575, iterations_per_second: 73663.197133}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003205689, iterations_per_second: 311.945452}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006234632, iterations_per_second: 160.394399}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.051304802, iterations_per_second: 19.491353}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078774128, iterations_per_second: 12.694523}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001854, iterations_per_second: 539519.827078}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001691812, iterations_per_second: 591.082224}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.042949275, iterations_per_second: 23.283280}
  xpath:
  xslt:
