platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.4.7', features: {}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003356, iterations_per_second: 297973.778384}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003054, iterations_per_second: 327482.315987}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001376714, iterations_per_second: 726.367277}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002871169, iterations_per_second: 348.290191}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.018818869, iterations_per_second: 53.138156}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.035265778, iterations_per_second: 28.356102}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001020, iterations_per_second: 979911.808392}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000991368, iterations_per_second: 1008.707160}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.034424764, iterations_per_second: 29.048856}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004970, iterations_per_second: 201187.003397}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004938, iterations_per_second: 202494.735164}
