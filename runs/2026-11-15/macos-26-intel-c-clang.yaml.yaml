    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008600, iterations_per_second: 116279.069754}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002407333, iterations_per_second: 415.397397}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007730000, iterations_per_second: 129.366106}
