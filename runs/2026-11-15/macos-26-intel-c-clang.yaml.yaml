    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001403, iterations_per_second: 712859.993809}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001604764, iterations_per_second: 623.144716}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032381336, iterations_per_second: 30.881987}
  generation:
