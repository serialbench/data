platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003006, iterations_per_second: 332612.672810}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003962, iterations_per_second: 252410.520365}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001861162, iterations_per_second: 537.298838}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003929653, iterations_per_second: 254.475395}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024849174, iterations_per_second: 40.242786}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047942139, iterations_per_second: 20.858477}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001184, iterations_per_second: 844594.595673}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001226192, iterations_per_second: 815.533189}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031361490, iterations_per_second: 31.886240}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004563, iterations_per_second: 219139.657640}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006085, iterations_per_second: 164335.836714}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002926419, iterations_per_second: 341.714528}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005527218, iterations_per_second: 180.922833}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.045197631, iterations_per_second: 22.125053}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.069421238, iterations_per_second: 14.404814}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001433, iterations_per_second: 697934.115419}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001515802, iterations_per_second: 659.716770}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.034896644, iterations_per_second: 28.656051}
  xpath:
  xslt:
