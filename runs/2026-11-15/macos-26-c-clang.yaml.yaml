    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000975, iterations_per_second: 1025641.025241}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001026278, iterations_per_second: 974.395169}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.014932000, iterations_per_second: 66.970265}
  generation:
