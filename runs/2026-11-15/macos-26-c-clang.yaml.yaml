    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008700, iterations_per_second: 114942.528725}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001494333, iterations_per_second: 669.194736}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005287667, iterations_per_second: 189.119334}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.018304000, iterations_per_second: 54.632867}
