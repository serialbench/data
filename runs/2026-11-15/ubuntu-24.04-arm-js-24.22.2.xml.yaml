platform:
  platform_string: ubuntu-24.04-arm-js-24.22.2
  kind: wasm
  os: linux
  arch: arm64
  runtime: js
  runtime_version: 24.22.2
benchmark_config:
  name: js-full
  formats: [json, xml, html, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '0.1.23', features: {xpath: true, wasm: true}}
    - {name: teptris, format: toml, version: '0.3.13', features: {wasm: true}}
    - {name: native-json, format: json, version: '24.22.2', features: {native: true}}
    - {name: fast-xml-parser, format: xml, version: '5.11.2', features: {}}
    - {name: htmlparser2, format: html, version: '12.0.0', features: {}}
    - {name: yaml22, format: yaml, version: '2.9.1', features: {}}
    - {name: smol-toml, format: toml, version: '1.9.1', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000018405, iterations_per_second: 54332.176058}
    - {adapter: fast-xml-parser, format: xml, data_size: small, time_per_iteration: 0.000110926, iterations_per_second: 9015.019022}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.002396747, iterations_per_second: 417.232190}
    - {adapter: fast-xml-parser, format: xml, data_size: medium, time_per_iteration: 0.027261997, iterations_per_second: 36.681099}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.025355205, iterations_per_second: 39.439634}
    - {adapter: fast-xml-parser, format: xml, data_size: large, time_per_iteration: 0.380678913, iterations_per_second: 2.626886}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000019750, iterations_per_second: 50632.911392}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.004154096, iterations_per_second: 240.726281}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.046836693, iterations_per_second: 21.350782}
  xpath:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000025336, iterations_per_second: 39469.373739}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.003302089, iterations_per_second: 302.838597}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.044172711, iterations_per_second: 22.638411}
