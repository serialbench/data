    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000660889, iterations_per_second: 1513.113397}
    - {adapter: quick-xml, format: xml, data_size: medium, time_per_iteration: 0.000841236, iterations_per_second: 1188.726592}
    - {adapter: roxmltree, format: xml, data_size: medium, time_per_iteration: 0.001764208, iterations_per_second: 566.826480}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.009345208, iterations_per_second: 107.006714}
