platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001338, iterations_per_second: 747607.655598}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003044, iterations_per_second: 328504.319757}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004914, iterations_per_second: 203479.499476}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000459939, iterations_per_second: 2174.202937}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001598067, iterations_per_second: 625.756122}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001349710, iterations_per_second: 740.899714}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004563873, iterations_per_second: 219.112144}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015971127, iterations_per_second: 62.612989}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013383533, iterations_per_second: 74.718686}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002345, iterations_per_second: 426457.418284}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006233, iterations_per_second: 160436.386921}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000825557, iterations_per_second: 1211.303399}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001755023, iterations_per_second: 569.792994}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008442536, iterations_per_second: 118.447822}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017866572, iterations_per_second: 55.970446}
  xpath:
  xslt:
