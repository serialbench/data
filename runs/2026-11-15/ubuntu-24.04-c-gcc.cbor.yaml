platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000903, iterations_per_second: 1107787.750818}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001185, iterations_per_second: 843739.453250}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000607295, iterations_per_second: 1646.647097}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002052915, iterations_per_second: 487.112307}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.018438862, iterations_per_second: 54.233282}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.039357674, iterations_per_second: 25.408006}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000401, iterations_per_second: 2495632.642166}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000383217, iterations_per_second: 2609.487575}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004737266, iterations_per_second: 211.092221}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001685, iterations_per_second: 593401.376132}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001659, iterations_per_second: 602736.423698}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002459051, iterations_per_second: 406.660888}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002592974, iterations_per_second: 385.657550}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.027710204, iterations_per_second: 36.087789}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.047232184, iterations_per_second: 21.172004}
  xpath:
  xslt:
