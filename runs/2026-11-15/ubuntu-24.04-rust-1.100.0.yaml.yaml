platform:
  platform_string: ubuntu-24.04-rust-1.100.0
  kind: native
  os: linux
  arch: x86_64
  runtime: rust
  runtime_version: 1.100.0
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004610, iterations_per_second: 216933.856867}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000007142, iterations_per_second: 140010.920852}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001925191, iterations_per_second: 519.429071}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.007774236, iterations_per_second: 128.630003}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026184415, iterations_per_second: 38.190657}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.105548490, iterations_per_second: 9.474318}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006784, iterations_per_second: 147412.179194}
    - {adapter: yaml-rust2, format: yaml, data_size: small, time_per_iteration: 0.000008524, iterations_per_second: 117315.814172}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003165987, iterations_per_second: 315.857233}
    - {adapter: yaml-rust2, format: yaml, data_size: medium, time_per_iteration: 0.009209271, iterations_per_second: 108.586232}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.050079547, iterations_per_second: 19.968232}
    - {adapter: yaml-rust2, format: yaml, data_size: large, time_per_iteration: 0.125847798, iterations_per_second: 7.946106}
  xpath:
