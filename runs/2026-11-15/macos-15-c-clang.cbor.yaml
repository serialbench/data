    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.331490}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000559333, iterations_per_second: 1787.842670}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001359333, iterations_per_second: 735.654733}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007008000, iterations_per_second: 142.694064}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.019244000, iterations_per_second: 51.964249}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000326667, iterations_per_second: 3061.224490}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003947000, iterations_per_second: 253.356980}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.000468}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001080333, iterations_per_second: 925.640235}
