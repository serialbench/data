platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001576, iterations_per_second: 634558.030043}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004516, iterations_per_second: 221415.286514}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005775, iterations_per_second: 173169.168962}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000503315, iterations_per_second: 1986.828651}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002295062, iterations_per_second: 435.718013}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001421849, iterations_per_second: 703.309564}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004901893, iterations_per_second: 204.002821}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.022781122, iterations_per_second: 43.895994}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014234099, iterations_per_second: 70.253832}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002966, iterations_per_second: 337097.589757}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007406, iterations_per_second: 135029.301366}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001013001, iterations_per_second: 987.166182}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001866671, iterations_per_second: 535.712946}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010387513, iterations_per_second: 96.269434}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018635699, iterations_per_second: 53.660450}
  xpath:
  xslt:
