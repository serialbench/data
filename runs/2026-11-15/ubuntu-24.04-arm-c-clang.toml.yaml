platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000555, iterations_per_second: 1801152.736251}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002050, iterations_per_second: 487900.077613}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000064336, iterations_per_second: 15543.477697}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000194276, iterations_per_second: 5147.307358}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001236373, iterations_per_second: 808.817404}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002353438, iterations_per_second: 424.910280}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000720, iterations_per_second: 1388888.889106}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000095804, iterations_per_second: 10438.013855}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001585185, iterations_per_second: 630.841195}
  xpath:
  xslt:
