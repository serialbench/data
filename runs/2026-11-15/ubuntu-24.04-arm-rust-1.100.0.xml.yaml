platform:
  platform_string: ubuntu-24.04-arm-rust-1.100.0
  kind: native
  os: linux
  arch: arm64
  runtime: rust
  runtime_version: 1.100.0
benchmark_config:
  name: rust-full
  formats: [json, xml, yaml, toml]
  operations: [parsing, generation, xpath]
benchmark_result:
  serializers:
    - {name: leptris, format: xml, version: '1.4.1', features: {xpath: true}}
    - {name: yeptris, format: yaml, version: '0.6.3', features: {}}
    - {name: teptris, format: toml, version: '0.1.6', features: {}}
    - {name: serde-json, format: json, version: '1.0.154', features: {}}
    - {name: simd-json, format: json, version: '0.18.1', features: {}}
    - {name: quick-xml, format: xml, version: '0.42.0', features: {}}
    - {name: roxmltree, format: xml, version: '0.21.1', features: {}}
    - {name: yaml-rust2, format: yaml, version: '0.13.0', features: {}}
    - {name: toml, format: toml, version: '1.1.8', features: {}}
  parsing:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000001154, iterations_per_second: 866250.866251}
    - {adapter: quick-xml, format: xml, data_size: small, time_per_iteration: 0.000000935, iterations_per_second: 1069175.665562}
    - {adapter: roxmltree, format: xml, data_size: small, time_per_iteration: 0.000002436, iterations_per_second: 410492.180124}
    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.000832669, iterations_per_second: 1200.957403}
    - {adapter: quick-xml, format: xml, data_size: medium, time_per_iteration: 0.000827152, iterations_per_second: 1208.968126}
    - {adapter: roxmltree, format: xml, data_size: medium, time_per_iteration: 0.002332237, iterations_per_second: 428.772891}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.011874955, iterations_per_second: 84.210845}
    - {adapter: quick-xml, format: xml, data_size: large, time_per_iteration: 0.011359499, iterations_per_second: 88.032051}
    - {adapter: roxmltree, format: xml, data_size: large, time_per_iteration: 0.033514286, iterations_per_second: 29.838022}
  generation:
    - {adapter: leptris, format: xml, data_size: small, time_per_iteration: 0.000002068, iterations_per_second: 483558.994197}
