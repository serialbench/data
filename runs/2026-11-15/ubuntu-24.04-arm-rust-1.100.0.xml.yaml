    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001246338, iterations_per_second: 802.350352}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.016637723, iterations_per_second: 60.104378}
