platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.909037}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384746}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.777821}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000438000, iterations_per_second: 2283.105023}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001382000, iterations_per_second: 723.589001}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001058667, iterations_per_second: 944.584383}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004725000, iterations_per_second: 211.640212}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014852000, iterations_per_second: 67.330999}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011020000, iterations_per_second: 90.744102}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608719}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004300, iterations_per_second: 232558.139507}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000827000, iterations_per_second: 1209.189843}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001960667, iterations_per_second: 510.030602}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008364000, iterations_per_second: 119.560019}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014866000, iterations_per_second: 67.267590}
  xpath:
  xslt:
