    - {adapter: leptris, format: xml, data_size: medium, time_per_iteration: 0.001436554, iterations_per_second: 696.110275}
    - {adapter: leptris, format: xml, data_size: large, time_per_iteration: 0.019366429, iterations_per_second: 51.635746}
