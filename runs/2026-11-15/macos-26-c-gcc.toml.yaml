platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000003100, iterations_per_second: 322580.644793}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000011700, iterations_per_second: 85470.085478}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000129667, iterations_per_second: 7712.082263}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000199667, iterations_per_second: 5008.347245}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000543000, iterations_per_second: 1841.620626}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002364000, iterations_per_second: 423.011844}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000003100, iterations_per_second: 322580.644793}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000081667, iterations_per_second: 12244.897959}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001005000, iterations_per_second: 995.024876}
  xpath:
  xslt:
