platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.6.1', features: {}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000438, iterations_per_second: 2282062.992239}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001697, iterations_per_second: 589448.864804}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000049534, iterations_per_second: 20188.289445}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000155063, iterations_per_second: 6449.005563}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000960568, iterations_per_second: 1041.050712}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.001837145, iterations_per_second: 544.322849}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000609, iterations_per_second: 1641227.639324}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000080535, iterations_per_second: 12417.012964}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001298059, iterations_per_second: 770.381007}
  xpath:
  xslt:
