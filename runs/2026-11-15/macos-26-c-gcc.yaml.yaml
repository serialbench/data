    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.080075000, iterations_per_second: 12.488292}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001304, iterations_per_second: 766812.361701}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001272611, iterations_per_second: 785.785867}
