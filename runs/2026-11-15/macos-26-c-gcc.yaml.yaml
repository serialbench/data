platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.421', features: {xpath: true, html5: true, xslt: true}}
    - {name: yyjson, format: json, version: '0.13.0', features: {}}
    - {name: cjson, format: json, version: '1.7.19', features: {}}
    - {name: expat, format: xml, version: 'expat_2.7.4', features: {}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.67', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.67', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.31', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.67', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006700, iterations_per_second: 149253.731340}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010100, iterations_per_second: 99009.901017}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001434333, iterations_per_second: 697.188008}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004138000, iterations_per_second: 241.662639}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.018797000, iterations_per_second: 53.199979}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.051863000, iterations_per_second: 19.281569}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000975, iterations_per_second: 1025641.025241}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000899597, iterations_per_second: 1111.608453}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013649583, iterations_per_second: 73.262311}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007400, iterations_per_second: 135135.135165}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000011300, iterations_per_second: 88495.575222}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002469333, iterations_per_second: 404.967603}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006199333, iterations_per_second: 161.307667}
