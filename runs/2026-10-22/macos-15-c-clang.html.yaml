    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004600, iterations_per_second: 217391.304359}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000848667, iterations_per_second: 1178.318932}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001537333, iterations_per_second: 650.477016}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007983000, iterations_per_second: 125.266191}
