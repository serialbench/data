    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.777821}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000434667, iterations_per_second: 2300.613497}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002677333, iterations_per_second: 373.505976}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001118667, iterations_per_second: 893.921335}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004526000, iterations_per_second: 220.945647}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014994000, iterations_per_second: 66.693344}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013285000, iterations_per_second: 75.272864}
  generation:
