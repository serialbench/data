platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005107, iterations_per_second: 195798.171212}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004040, iterations_per_second: 247500.247131}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001540825, iterations_per_second: 649.003110}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003954177, iterations_per_second: 252.897105}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.019402983, iterations_per_second: 51.538467}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.044804665, iterations_per_second: 22.319104}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001434, iterations_per_second: 697544.645990}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001147052, iterations_per_second: 871.800311}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.034431381, iterations_per_second: 29.043273}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000007084, iterations_per_second: 141159.199318}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006263, iterations_per_second: 159680.638582}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002703370, iterations_per_second: 369.908624}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005319877, iterations_per_second: 187.974259}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.038666154, iterations_per_second: 25.862412}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.074228350, iterations_per_second: 13.471942}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001670, iterations_per_second: 598802.397129}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001502672, iterations_per_second: 665.481223}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.039821118, iterations_per_second: 25.112303}
  xpath:
  xslt:
