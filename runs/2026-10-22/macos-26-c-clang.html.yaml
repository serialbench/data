    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006400, iterations_per_second: 156250.000048}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001957667, iterations_per_second: 510.812191}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001611333, iterations_per_second: 620.604055}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.015392000, iterations_per_second: 64.968815}
