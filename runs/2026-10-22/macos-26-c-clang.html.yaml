    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006600, iterations_per_second: 151515.151506}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000446000, iterations_per_second: 2242.152466}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001468333, iterations_per_second: 681.044268}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002410667, iterations_per_second: 414.823009}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007886000, iterations_per_second: 126.807000}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015517000, iterations_per_second: 64.445447}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.016435000, iterations_per_second: 60.845756}
  generation:
