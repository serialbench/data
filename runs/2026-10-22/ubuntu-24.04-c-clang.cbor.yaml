platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000765, iterations_per_second: 1307018.694502}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000628, iterations_per_second: 1592356.678658}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000399993, iterations_per_second: 2500.043751}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001099113, iterations_per_second: 909.824559}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014952495, iterations_per_second: 66.878471}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.026483753, iterations_per_second: 37.758999}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000283, iterations_per_second: 3528581.527918}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000276180, iterations_per_second: 3620.831367}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003238171, iterations_per_second: 308.816304}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001223, iterations_per_second: 817728.351163}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000000933, iterations_per_second: 1071352.049796}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001834131, iterations_per_second: 545.217326}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001440000, iterations_per_second: 694.444284}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.021640924, iterations_per_second: 46.208748}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.030718215, iterations_per_second: 32.553975}
  xpath:
  xslt:
