platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.380', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.36', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.36', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.36', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001332, iterations_per_second: 750469.043286}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001157, iterations_per_second: 864154.856151}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000842956, iterations_per_second: 1186.302008}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001973977, iterations_per_second: 506.591516}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022906432, iterations_per_second: 43.655861}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.043658252, iterations_per_second: 22.905177}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000421, iterations_per_second: 2376425.867548}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000469809, iterations_per_second: 2128.523060}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005432843, iterations_per_second: 184.065691}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000007272, iterations_per_second: 137504.297018}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001650, iterations_per_second: 606060.605503}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002884204, iterations_per_second: 346.716073}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002480334, iterations_per_second: 403.171454}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.033776465, iterations_per_second: 29.606414}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.048061391, iterations_per_second: 20.806722}
  xpath:
  xslt:
