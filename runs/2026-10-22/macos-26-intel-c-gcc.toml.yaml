platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.295603}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000081667, iterations_per_second: 12244.897962}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000418667, iterations_per_second: 2388.535032}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001138000, iterations_per_second: 878.734622}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004908000, iterations_per_second: 203.748981}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.383905}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000173333, iterations_per_second: 5769.230770}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002321000, iterations_per_second: 430.848772}
  xpath:
  xslt:
