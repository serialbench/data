platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000748, iterations_per_second: 1336541.031650}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002241, iterations_per_second: 446209.451216}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000081790, iterations_per_second: 12226.433549}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000216417, iterations_per_second: 4620.709094}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001202568, iterations_per_second: 831.553808}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002216978, iterations_per_second: 451.064467}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000958, iterations_per_second: 1043405.676434}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000101968, iterations_per_second: 9806.966215}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001563226, iterations_per_second: 639.702769}
  xpath:
  xslt:
