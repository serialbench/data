platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001337, iterations_per_second: 748111.019216}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003022, iterations_per_second: 330884.786312}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004952, iterations_per_second: 201922.300453}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000465617, iterations_per_second: 2147.686369}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001629547, iterations_per_second: 613.667605}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001350149, iterations_per_second: 740.658994}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004639741, iterations_per_second: 215.529272}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.015959222, iterations_per_second: 62.659696}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013947446, iterations_per_second: 71.697714}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002344, iterations_per_second: 426657.565165}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006201, iterations_per_second: 161261.711602}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000840101, iterations_per_second: 1190.333539}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001775292, iterations_per_second: 563.287511}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008686332, iterations_per_second: 115.123392}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018206803, iterations_per_second: 54.924525}
  xpath:
  xslt:
