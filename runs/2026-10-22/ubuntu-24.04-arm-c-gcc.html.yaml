platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.380', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.36', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.36', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.36', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001332, iterations_per_second: 750638.042284}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002998, iterations_per_second: 333544.578263}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005002, iterations_per_second: 199936.020462}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000467230, iterations_per_second: 2140.275054}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001618056, iterations_per_second: 618.025454}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001339775, iterations_per_second: 746.394170}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004553473, iterations_per_second: 219.612590}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016052075, iterations_per_second: 62.297242}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013486792, iterations_per_second: 74.146617}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002297, iterations_per_second: 435312.554481}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007686, iterations_per_second: 130106.687496}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000836459, iterations_per_second: 1195.515383}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001756324, iterations_per_second: 569.371027}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008491088, iterations_per_second: 117.770538}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017858500, iterations_per_second: 55.995744}
  xpath:
  xslt:
