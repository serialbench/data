platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004292, iterations_per_second: 232991.612310}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004693, iterations_per_second: 213092.396913}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001771999, iterations_per_second: 564.334510}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004488588, iterations_per_second: 222.787227}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023801723, iterations_per_second: 42.013765}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055415333, iterations_per_second: 18.045547}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001549, iterations_per_second: 645619.472220}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001475102, iterations_per_second: 677.919222}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.040582733, iterations_per_second: 24.641022}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006429, iterations_per_second: 155547.605291}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006803, iterations_per_second: 147002.616629}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002900311, iterations_per_second: 344.790610}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006224185, iterations_per_second: 160.663605}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.047473203, iterations_per_second: 21.064515}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078534934, iterations_per_second: 12.733187}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001954, iterations_per_second: 511875.511970}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001797002, iterations_per_second: 556.482408}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.044506134, iterations_per_second: 22.468813}
  xpath:
  xslt:
