platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000600, iterations_per_second: 1666666.662980}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001900, iterations_per_second: 526315.790015}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000045667, iterations_per_second: 21897.810220}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000185333, iterations_per_second: 5395.683453}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000676000, iterations_per_second: 1479.289941}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002504000, iterations_per_second: 399.361022}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000700, iterations_per_second: 1428571.432178}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000085000, iterations_per_second: 11764.705882}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001167000, iterations_per_second: 856.898029}
  xpath:
  xslt:
