platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370526}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005100, iterations_per_second: 196078.431321}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000042000, iterations_per_second: 23809.523811}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000205667, iterations_per_second: 4862.236629}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000614000, iterations_per_second: 1628.664495}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003399000, iterations_per_second: 294.204178}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.665823}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000082000, iterations_per_second: 12195.121951}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001461000, iterations_per_second: 684.462697}
  xpath:
  xslt:
