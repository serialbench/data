platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.380', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.36', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.36', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.36', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001350, iterations_per_second: 740905.386512}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001226, iterations_per_second: 815860.325077}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000689720, iterations_per_second: 1449.863713}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001903952, iterations_per_second: 525.223325}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014723448, iterations_per_second: 67.918873}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031448597, iterations_per_second: 31.797921}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000368, iterations_per_second: 2717391.299875}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000321568, iterations_per_second: 3109.765389}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004174899, iterations_per_second: 239.526753}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001784, iterations_per_second: 560506.697999}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001542, iterations_per_second: 648634.624108}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001874625, iterations_per_second: 533.440116}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002142032, iterations_per_second: 466.846506}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023766836, iterations_per_second: 42.075437}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.034936834, iterations_per_second: 28.623086}
  xpath:
  xslt:
