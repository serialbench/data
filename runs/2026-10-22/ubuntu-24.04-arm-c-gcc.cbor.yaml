platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001346, iterations_per_second: 742776.500797}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001242, iterations_per_second: 805477.244314}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000741915, iterations_per_second: 1347.863905}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001892737, iterations_per_second: 528.335421}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015518605, iterations_per_second: 64.438782}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033480250, iterations_per_second: 29.868355}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000384, iterations_per_second: 2604845.020381}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000321298, iterations_per_second: 3112.372198}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004187804, iterations_per_second: 238.788635}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001771, iterations_per_second: 564620.857154}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001543, iterations_per_second: 648046.140530}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001906789, iterations_per_second: 524.441784}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002147857, iterations_per_second: 465.580416}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.024615951, iterations_per_second: 40.624065}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.038065103, iterations_per_second: 26.270781}
  xpath:
  xslt:
