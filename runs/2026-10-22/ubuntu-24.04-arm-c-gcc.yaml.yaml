platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.380', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.36', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.36', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.36', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002790, iterations_per_second: 358448.634323}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003967, iterations_per_second: 252047.889121}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001644652, iterations_per_second: 608.031488}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003966700, iterations_per_second: 252.098701}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021685470, iterations_per_second: 46.113826}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048077530, iterations_per_second: 20.799737}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001239, iterations_per_second: 806907.125539}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001172346, iterations_per_second: 852.990257}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027580241, iterations_per_second: 36.257841}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004338, iterations_per_second: 230526.291500}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006010, iterations_per_second: 166389.351085}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002651832, iterations_per_second: 377.097748}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005526035, iterations_per_second: 180.961586}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.039844005, iterations_per_second: 25.097879}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068692922, iterations_per_second: 14.557541}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001480, iterations_per_second: 675630.024722}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001445959, iterations_per_second: 691.582701}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.032570641, iterations_per_second: 30.702497}
  xpath:
  xslt:
