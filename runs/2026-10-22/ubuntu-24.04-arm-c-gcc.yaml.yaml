platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002734, iterations_per_second: 365737.692795}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004089, iterations_per_second: 244540.630397}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001624330, iterations_per_second: 615.638574}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004006516, iterations_per_second: 249.593392}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021597380, iterations_per_second: 46.301913}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048580330, iterations_per_second: 20.584463}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001193, iterations_per_second: 838433.805458}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001173492, iterations_per_second: 852.157492}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028353844, iterations_per_second: 35.268587}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004272, iterations_per_second: 234104.316906}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007782, iterations_per_second: 128504.973105}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002645941, iterations_per_second: 377.937377}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005499849, iterations_per_second: 181.823185}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040096744, iterations_per_second: 24.939681}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068856507, iterations_per_second: 14.522956}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001452, iterations_per_second: 688752.669399}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001450760, iterations_per_second: 689.294046}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031576441, iterations_per_second: 31.669180}
  xpath:
  xslt:
