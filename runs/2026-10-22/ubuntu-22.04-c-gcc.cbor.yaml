platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000905, iterations_per_second: 1105338.794282}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001021, iterations_per_second: 979144.228335}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000656113, iterations_per_second: 1524.127704}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001679829, iterations_per_second: 595.298570}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015184340, iterations_per_second: 65.857324}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.031624076, iterations_per_second: 31.621477}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000297, iterations_per_second: 3367003.402570}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000286885, iterations_per_second: 3485.721324}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003467732, iterations_per_second: 288.372919}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001646, iterations_per_second: 607459.605327}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001464, iterations_per_second: 682826.905024}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002117151, iterations_per_second: 472.332792}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002144711, iterations_per_second: 466.263287}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.024806309, iterations_per_second: 40.312325}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.038548610, iterations_per_second: 25.941273}
  xpath:
  xslt:
