platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.380', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.36', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.36', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.36', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000000983, iterations_per_second: 1017604.560390}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001089, iterations_per_second: 918526.690229}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000670009, iterations_per_second: 1492.516522}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001758156, iterations_per_second: 568.777742}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.016537608, iterations_per_second: 60.468237}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040900678, iterations_per_second: 24.449472}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000302, iterations_per_second: 3306878.344070}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000299573, iterations_per_second: 3338.084540}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003581186, iterations_per_second: 279.237102}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001866, iterations_per_second: 535905.679929}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001616, iterations_per_second: 619003.403533}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002106679, iterations_per_second: 474.680765}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002248035, iterations_per_second: 444.832998}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.026283920, iterations_per_second: 38.046075}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.041859188, iterations_per_second: 23.889618}
  xpath:
  xslt:
