platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000800, iterations_per_second: 1249999.998715}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 624999.999358}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000038333, iterations_per_second: 26086.956523}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000174333, iterations_per_second: 5736.137667}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000617000, iterations_per_second: 1620.745543}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002115000, iterations_per_second: 472.813239}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000800, iterations_per_second: 1249999.998715}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000072333, iterations_per_second: 13824.884791}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001051000, iterations_per_second: 951.474786}
  xpath:
  xslt:
