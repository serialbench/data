platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005200, iterations_per_second: 192307.692373}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384746}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000017500, iterations_per_second: 57142.857139}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000649333, iterations_per_second: 1540.041068}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001754667, iterations_per_second: 569.908815}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001077000, iterations_per_second: 928.505107}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.006084000, iterations_per_second: 164.365549}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.018102000, iterations_per_second: 55.242515}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.048407000, iterations_per_second: 20.658169}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000009300, iterations_per_second: 107526.881729}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009800, iterations_per_second: 102040.816347}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000843333, iterations_per_second: 1185.770751}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001472667, iterations_per_second: 679.040290}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009083000, iterations_per_second: 110.095783}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.023187000, iterations_per_second: 43.127615}
  xpath:
  xslt:
