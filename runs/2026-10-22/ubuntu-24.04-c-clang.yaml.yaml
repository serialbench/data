platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002352, iterations_per_second: 425242.388182}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000002614, iterations_per_second: 382570.105984}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000957133, iterations_per_second: 1044.787243}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002390112, iterations_per_second: 418.390435}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.012684717, iterations_per_second: 78.835026}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.033221497, iterations_per_second: 30.100992}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000725, iterations_per_second: 1379120.121450}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000642735, iterations_per_second: 1555.850360}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.025756416, iterations_per_second: 38.825278}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003481, iterations_per_second: 287257.267880}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003637, iterations_per_second: 274914.089504}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001548340, iterations_per_second: 645.852978}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002914873, iterations_per_second: 343.068159}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026942673, iterations_per_second: 37.115842}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.037065028, iterations_per_second: 26.979610}
