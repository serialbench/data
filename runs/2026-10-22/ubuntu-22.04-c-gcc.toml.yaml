platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.380', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.36', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.36', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.36', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000559, iterations_per_second: 1787629.616451}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002984, iterations_per_second: 335120.643154}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000057238, iterations_per_second: 17470.809193}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000320222, iterations_per_second: 3122.836785}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001152683, iterations_per_second: 867.541206}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003778351, iterations_per_second: 264.665723}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000743, iterations_per_second: 1346619.979365}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000096804, iterations_per_second: 10330.151650}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001543538, iterations_per_second: 647.862249}
  xpath:
  xslt:
