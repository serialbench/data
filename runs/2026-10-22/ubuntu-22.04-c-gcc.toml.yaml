platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000571, iterations_per_second: 1751313.490582}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002839, iterations_per_second: 352273.927672}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000050921, iterations_per_second: 19638.263183}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000303393, iterations_per_second: 3296.051330}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001133192, iterations_per_second: 882.462990}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003613730, iterations_per_second: 276.722389}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000784, iterations_per_second: 1274859.777735}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000100606, iterations_per_second: 9939.732091}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001387951, iterations_per_second: 720.486530}
  xpath:
  xslt:
