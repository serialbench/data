platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000000815, iterations_per_second: 1226692.832984}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002263, iterations_per_second: 441813.201300}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003452, iterations_per_second: 289670.355434}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000268969, iterations_per_second: 3717.905183}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001072647, iterations_per_second: 932.273442}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000738072, iterations_per_second: 1354.880755}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.002557915, iterations_per_second: 390.943405}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.010819265, iterations_per_second: 92.427720}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.007376897, iterations_per_second: 135.558352}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001589, iterations_per_second: 629168.239565}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004143, iterations_per_second: 241353.510612}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000526190, iterations_per_second: 1900.455412}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.000962671, iterations_per_second: 1038.776487}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005619429, iterations_per_second: 177.954023}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.009640369, iterations_per_second: 103.730469}
  xpath:
  xslt:
