platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.380', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.36', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.36', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.36', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001551, iterations_per_second: 644786.898788}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004462, iterations_per_second: 224099.679640}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005780, iterations_per_second: 173016.367348}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000496255, iterations_per_second: 2015.091693}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002294824, iterations_per_second: 435.763266}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001408901, iterations_per_second: 709.772911}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005043001, iterations_per_second: 198.294627}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.022462136, iterations_per_second: 44.519364}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014357968, iterations_per_second: 69.647738}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003037, iterations_per_second: 329304.837556}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007344, iterations_per_second: 136172.994157}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001036389, iterations_per_second: 964.888666}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001859999, iterations_per_second: 537.634698}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010767747, iterations_per_second: 92.869938}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018818175, iterations_per_second: 53.140116}
