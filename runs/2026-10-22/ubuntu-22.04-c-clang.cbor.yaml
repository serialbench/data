platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.380', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.36', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.36', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.36', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001362, iterations_per_second: 734484.024956}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001246, iterations_per_second: 802310.654164}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000901840, iterations_per_second: 1108.844141}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001957227, iterations_per_second: 510.926939}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.029658493, iterations_per_second: 33.717155}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040867978, iterations_per_second: 24.469035}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000442, iterations_per_second: 2262955.423570}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000457651, iterations_per_second: 2185.071157}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005565600, iterations_per_second: 179.675147}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002205, iterations_per_second: 453494.171975}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001722, iterations_per_second: 580652.653692}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003308810, iterations_per_second: 302.223458}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002477632, iterations_per_second: 403.611244}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.039225673, iterations_per_second: 25.493508}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.049204560, iterations_per_second: 20.323320}
  xpath:
  xslt:
