platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001212, iterations_per_second: 824742.271090}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003752, iterations_per_second: 266545.832487}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000700031, iterations_per_second: 1428.507486}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001796510, iterations_per_second: 556.634809}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.017929390, iterations_per_second: 55.774346}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040143633, iterations_per_second: 24.910551}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000377, iterations_per_second: 2649708.537315}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000374117, iterations_per_second: 2672.962979}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004747498, iterations_per_second: 210.637266}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002848, iterations_per_second: 351061.962769}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001866, iterations_per_second: 535848.247712}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002056824, iterations_per_second: 486.186549}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002261741, iterations_per_second: 442.137339}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.027784945, iterations_per_second: 35.990714}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.051237902, iterations_per_second: 19.516802}
  xpath:
  xslt:
