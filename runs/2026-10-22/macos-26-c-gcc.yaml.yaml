    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000008500, iterations_per_second: 117647.058845}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001903667, iterations_per_second: 525.302049}
