    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001065000, iterations_per_second: 938.967136}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003755667, iterations_per_second: 266.264312}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016548000, iterations_per_second: 60.430263}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.050133000, iterations_per_second: 19.946941}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001117, iterations_per_second: 895495.657110}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000942958, iterations_per_second: 1060.492245}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.013651791, iterations_per_second: 73.250462}
  generation:
