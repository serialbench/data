platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003200, iterations_per_second: 312499.999956}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270330}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001026000, iterations_per_second: 974.658869}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003746333, iterations_per_second: 266.927663}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.014909000, iterations_per_second: 67.073580}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.046390000, iterations_per_second: 21.556370}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000967, iterations_per_second: 1034554.105995}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001188708, iterations_per_second: 841.249255}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.019396750, iterations_per_second: 51.555029}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238052}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666614}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002024000, iterations_per_second: 494.071146}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005842000, iterations_per_second: 171.174255}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.029221000, iterations_per_second: 34.221964}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.075025000, iterations_per_second: 13.328890}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001267, iterations_per_second: 789515.237426}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001537583, iterations_per_second: 650.371254}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.023731750, iterations_per_second: 42.137643}
  xpath:
  xslt:
