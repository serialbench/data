    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666693}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001940000, iterations_per_second: 515.463918}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005757667, iterations_per_second: 173.681468}
