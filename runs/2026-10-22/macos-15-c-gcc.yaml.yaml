    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001185333, iterations_per_second: 843.644544}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003744667, iterations_per_second: 267.046466}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015716000, iterations_per_second: 63.629422}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.046782000, iterations_per_second: 21.375743}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000942, iterations_per_second: 1061909.312818}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001176333, iterations_per_second: 850.099178}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.018328000, iterations_per_second: 54.561327}
  generation:
