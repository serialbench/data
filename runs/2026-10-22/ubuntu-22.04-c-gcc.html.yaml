platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001421, iterations_per_second: 703927.914815}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003721, iterations_per_second: 268723.295323}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000015748, iterations_per_second: 63501.336742}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000479884, iterations_per_second: 2083.838375}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001881873, iterations_per_second: 531.385487}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001128673, iterations_per_second: 885.996210}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004440957, iterations_per_second: 225.176691}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.018484539, iterations_per_second: 54.099266}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.011962591, iterations_per_second: 83.593930}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002721, iterations_per_second: 367471.429731}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000021945, iterations_per_second: 45567.636044}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000765300, iterations_per_second: 1306.676551}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001509333, iterations_per_second: 662.544316}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.007758834, iterations_per_second: 128.885345}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015763448, iterations_per_second: 63.437898}
  xpath:
  xslt:
