platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000350, iterations_per_second: 2853067.051040}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001261, iterations_per_second: 793084.304268}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000045756, iterations_per_second: 21855.216474}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000117604, iterations_per_second: 8503.136241}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001107729, iterations_per_second: 902.747874}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.001274110, iterations_per_second: 784.861590}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000420, iterations_per_second: 2383222.104755}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000072512, iterations_per_second: 13790.757436}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001347741, iterations_per_second: 741.982324}
  xpath:
  xslt:
