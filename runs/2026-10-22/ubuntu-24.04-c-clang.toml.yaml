platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.380', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.36', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.36', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.36', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000582, iterations_per_second: 1718213.054702}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002039, iterations_per_second: 490484.598884}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000073536, iterations_per_second: 13598.719907}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000213330, iterations_per_second: 4687.580568}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001607787, iterations_per_second: 621.972935}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002446224, iterations_per_second: 408.793308}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000834, iterations_per_second: 1198322.349044}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000118894, iterations_per_second: 8410.853365}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002057712, iterations_per_second: 485.976658}
  xpath:
  xslt:
