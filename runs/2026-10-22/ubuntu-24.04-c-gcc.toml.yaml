platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000587, iterations_per_second: 1703287.340729}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004241, iterations_per_second: 235799.004915}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000081966, iterations_per_second: 12200.130948}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000480756, iterations_per_second: 2080.055801}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001588871, iterations_per_second: 629.377715}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.005602793, iterations_per_second: 178.482410}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000814, iterations_per_second: 1229256.299692}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000121410, iterations_per_second: 8236.576439}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002041735, iterations_per_second: 489.779526}
  xpath:
  xslt:
