platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005200, iterations_per_second: 192307.692373}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000014200, iterations_per_second: 70422.535164}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000014200, iterations_per_second: 70422.535220}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001910000, iterations_per_second: 523.560209}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.006850000, iterations_per_second: 145.985401}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.004849667, iterations_per_second: 206.199739}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.018894000, iterations_per_second: 52.926855}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.072847000, iterations_per_second: 13.727401}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.047158000, iterations_per_second: 21.205310}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000009200, iterations_per_second: 108695.652180}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000019500, iterations_per_second: 51282.051262}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.003804667, iterations_per_second: 262.835115}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.006576667, iterations_per_second: 152.052712}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.035690000, iterations_per_second: 28.019053}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.068352000, iterations_per_second: 14.630150}
  xpath:
