    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008900, iterations_per_second: 112359.550558}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001072667, iterations_per_second: 932.256060}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004342333, iterations_per_second: 230.290934}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002685667, iterations_per_second: 372.347027}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010832000, iterations_per_second: 92.319055}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.043175000, iterations_per_second: 23.161552}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.027533000, iterations_per_second: 36.320052}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000006500, iterations_per_second: 153846.153965}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000011300, iterations_per_second: 88495.575178}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002302000, iterations_per_second: 434.404865}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003819333, iterations_per_second: 261.825799}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.025286000, iterations_per_second: 39.547576}
