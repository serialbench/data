    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000012000, iterations_per_second: 83333.333307}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.004348000, iterations_per_second: 229.990800}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.015345333, iterations_per_second: 65.166392}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.060513000, iterations_per_second: 16.525375}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.208164000, iterations_per_second: 4.803905}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001717, iterations_per_second: 582445.104928}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.003113857, iterations_per_second: 321.145161}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.057854595, iterations_per_second: 17.284712}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000015600, iterations_per_second: 64102.564124}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000028000, iterations_per_second: 35714.285717}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.006278333, iterations_per_second: 159.277940}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.026393667, iterations_per_second: 37.887877}
