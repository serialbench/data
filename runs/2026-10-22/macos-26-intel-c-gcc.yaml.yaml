platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000013500, iterations_per_second: 74074.074074}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009900, iterations_per_second: 101010.101033}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002091667, iterations_per_second: 478.087649}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.008733000, iterations_per_second: 114.508187}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.029977000, iterations_per_second: 33.358908}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.118172000, iterations_per_second: 8.462241}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000003089, iterations_per_second: 323708.403044}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001929911, iterations_per_second: 518.158520}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.033096867, iterations_per_second: 30.214340}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000013300, iterations_per_second: 75187.969922}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000015500, iterations_per_second: 64516.129053}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003891667, iterations_per_second: 256.959315}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.012448000, iterations_per_second: 80.334190}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.062837000, iterations_per_second: 15.914191}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.154144000, iterations_per_second: 6.487440}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002206, iterations_per_second: 453268.060994}
