    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000729333, iterations_per_second: 1371.115174}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001454333, iterations_per_second: 687.600275}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007375000, iterations_per_second: 135.593220}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.020045000, iterations_per_second: 49.887753}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000334333, iterations_per_second: 2991.026919}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004070000, iterations_per_second: 245.700246}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001900, iterations_per_second: 526315.789228}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001900, iterations_per_second: 526315.789228}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001090333, iterations_per_second: 917.150718}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001723333, iterations_per_second: 580.270793}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015944000, iterations_per_second: 62.719518}
