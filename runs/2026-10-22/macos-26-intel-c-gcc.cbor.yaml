platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 249999.999921}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666772}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001517000, iterations_per_second: 659.195781}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.005273000, iterations_per_second: 189.645363}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014406000, iterations_per_second: 69.415521}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.081407000, iterations_per_second: 12.283956}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.335437}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000720000, iterations_per_second: 1388.888889}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.010849000, iterations_per_second: 92.174394}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666456}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000007700, iterations_per_second: 129870.129815}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002689000, iterations_per_second: 371.885459}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.006341333, iterations_per_second: 157.695542}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.040770000, iterations_per_second: 24.527839}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.091132000, iterations_per_second: 10.973094}
  xpath:
  xslt:
