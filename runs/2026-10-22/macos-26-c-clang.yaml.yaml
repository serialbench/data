platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009500, iterations_per_second: 105263.157909}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001129000, iterations_per_second: 885.739593}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004303333, iterations_per_second: 232.378002}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.020837000, iterations_per_second: 47.991553}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.070474000, iterations_per_second: 14.189630}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000000917, iterations_per_second: 1090988.434055}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001305167, iterations_per_second: 766.185672}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.014022958, iterations_per_second: 71.311631}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005700, iterations_per_second: 175438.596409}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009200, iterations_per_second: 108695.652180}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002227000, iterations_per_second: 449.034576}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007538000, iterations_per_second: 132.661183}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.036016000, iterations_per_second: 27.765438}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.099736000, iterations_per_second: 10.026470}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001325, iterations_per_second: 754716.981419}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001191014, iterations_per_second: 839.620928}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.025150959, iterations_per_second: 39.759915}
  xpath:
  xslt:
