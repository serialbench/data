platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001418, iterations_per_second: 705417.608258}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000004341, iterations_per_second: 230351.055026}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000865784, iterations_per_second: 1155.022945}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002073982, iterations_per_second: 482.164184}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023273389, iterations_per_second: 42.967528}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.042329909, iterations_per_second: 23.623958}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000390, iterations_per_second: 2565418.170685}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000383198, iterations_per_second: 2609.619230}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004705341, iterations_per_second: 212.524448}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002344, iterations_per_second: 426566.565650}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001699, iterations_per_second: 588512.241580}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002871402, iterations_per_second: 348.261970}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002614683, iterations_per_second: 382.455492}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.034646156, iterations_per_second: 28.863231}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.049740110, iterations_per_second: 20.104499}
  xpath:
  xslt:
