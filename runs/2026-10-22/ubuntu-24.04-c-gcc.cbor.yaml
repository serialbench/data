platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.380', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.36', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.36', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.36', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001297, iterations_per_second: 771069.472718}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001161, iterations_per_second: 861549.066981}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000761268, iterations_per_second: 1313.597839}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002105006, iterations_per_second: 475.058104}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015589555, iterations_per_second: 64.145513}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.043451285, iterations_per_second: 23.014279}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000401, iterations_per_second: 2496255.609276}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000379661, iterations_per_second: 2633.928689}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004673518, iterations_per_second: 213.971573}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002134, iterations_per_second: 468559.647718}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001705, iterations_per_second: 586647.893568}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002808828, iterations_per_second: 356.020418}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002678758, iterations_per_second: 373.307285}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.026005919, iterations_per_second: 38.452785}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.049729987, iterations_per_second: 20.108592}
  xpath:
  xslt:
