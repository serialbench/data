platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.380', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.36', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.36', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.36', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 499999.999841}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005800, iterations_per_second: 172413.793116}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000068000, iterations_per_second: 14705.882353}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000241667, iterations_per_second: 4137.931035}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000639000, iterations_per_second: 1564.945227}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003211000, iterations_per_second: 311.429461}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.714639}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000083667, iterations_per_second: 11952.191235}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001203000, iterations_per_second: 831.255195}
  xpath:
  xslt:
