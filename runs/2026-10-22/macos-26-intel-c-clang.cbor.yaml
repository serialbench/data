    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004245667, iterations_per_second: 235.534270}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013683000, iterations_per_second: 73.083388}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.047574000, iterations_per_second: 21.019885}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000500, iterations_per_second: 1999999.686726}
