platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.380', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.36', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.36', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.36', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001428, iterations_per_second: 700231.075977}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004085, iterations_per_second: 244792.049018}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005252, iterations_per_second: 190407.281147}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000471960, iterations_per_second: 2118.825126}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002047466, iterations_per_second: 488.408678}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001234547, iterations_per_second: 810.013932}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004538806, iterations_per_second: 220.322261}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.020105786, iterations_per_second: 49.736926}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012473449, iterations_per_second: 80.170288}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002804, iterations_per_second: 356607.945267}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006778, iterations_per_second: 147531.793097}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000971758, iterations_per_second: 1029.062791}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001657736, iterations_per_second: 603.232239}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010103094, iterations_per_second: 98.979580}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.016792283, iterations_per_second: 59.551164}
  xpath:
  xslt:
