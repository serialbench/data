platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001534, iterations_per_second: 651975.485841}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004544, iterations_per_second: 220094.640676}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005730, iterations_per_second: 174529.207426}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000518857, iterations_per_second: 1927.313306}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002346159, iterations_per_second: 426.228511}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001415114, iterations_per_second: 706.656849}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005056334, iterations_per_second: 197.771745}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.023195670, iterations_per_second: 43.111495}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014526203, iterations_per_second: 68.841114}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003023, iterations_per_second: 330840.997741}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000011323, iterations_per_second: 88315.037401}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001020282, iterations_per_second: 980.121502}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001862695, iterations_per_second: 536.856544}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.010485101, iterations_per_second: 95.373426}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018771555, iterations_per_second: 53.272092}
  xpath:
  xslt:
