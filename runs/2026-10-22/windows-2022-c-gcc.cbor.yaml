    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001017600, iterations_per_second: 982.704403}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002325467, iterations_per_second: 430.021214}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.008444400, iterations_per_second: 118.421676}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033765900, iterations_per_second: 29.615677}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000210, iterations_per_second: 4761904.722369}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000197700, iterations_per_second: 5058.168943}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.002466600, iterations_per_second: 405.416363}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 769230.771173}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001810, iterations_per_second: 552486.188546}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001434600, iterations_per_second: 697.058413}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002628367, iterations_per_second: 380.464420}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013857400, iterations_per_second: 72.163609}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.037156300, iterations_per_second: 26.913336}
