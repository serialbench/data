    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001433367, iterations_per_second: 697.658194}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003515067, iterations_per_second: 284.489626}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012849400, iterations_per_second: 77.824646}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.049308400, iterations_per_second: 20.280520}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000380, iterations_per_second: 2631578.946139}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000356100, iterations_per_second: 2808.199944}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004462700, iterations_per_second: 224.079593}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002450, iterations_per_second: 408163.264443}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003100, iterations_per_second: 322580.644793}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002229367, iterations_per_second: 448.557886}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004113633, iterations_per_second: 243.094102}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022844000, iterations_per_second: 43.775171}
