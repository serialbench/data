    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000985667, iterations_per_second: 1014.541765}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001724667, iterations_per_second: 579.822188}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.008083000, iterations_per_second: 123.716442}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.028273000, iterations_per_second: 35.369434}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.310170}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000513000, iterations_per_second: 1949.317739}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.009015000, iterations_per_second: 110.926234}
  generation:
