    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000006100, iterations_per_second: 163934.426261}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001222667, iterations_per_second: 817.884406}
