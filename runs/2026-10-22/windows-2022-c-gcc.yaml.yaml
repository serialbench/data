    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001850833, iterations_per_second: 540.297163}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.007294867, iterations_per_second: 137.082697}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.025781500, iterations_per_second: 38.787503}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.088496000, iterations_per_second: 11.299946}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001540, iterations_per_second: 649350.647155}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002139800, iterations_per_second: 467.333396}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027197500, iterations_per_second: 36.768085}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000082890, iterations_per_second: 12064.181445}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000019530, iterations_per_second: 51203.277002}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003539133, iterations_per_second: 282.555051}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.009306667, iterations_per_second: 107.449857}
