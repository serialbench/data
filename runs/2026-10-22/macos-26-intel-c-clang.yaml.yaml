    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000015900, iterations_per_second: 62893.081785}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.004674667, iterations_per_second: 213.918996}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.013959333, iterations_per_second: 71.636659}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.069189000, iterations_per_second: 14.453165}
