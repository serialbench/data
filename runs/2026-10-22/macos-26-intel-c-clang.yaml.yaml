    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002287667, iterations_per_second: 437.126621}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.010917000, iterations_per_second: 91.600256}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.033430000, iterations_per_second: 29.913252}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.115093000, iterations_per_second: 8.688626}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000003430, iterations_per_second: 291562.190675}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002680788, iterations_per_second: 373.024694}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.037927318, iterations_per_second: 26.366220}
  generation:
