platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.380', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.36', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.36', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.36', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001374, iterations_per_second: 727643.163216}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003096, iterations_per_second: 323018.282872}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005136, iterations_per_second: 194688.887155}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000463266, iterations_per_second: 2158.585522}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001636185, iterations_per_second: 611.177956}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001339512, iterations_per_second: 746.540531}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004597887, iterations_per_second: 217.491208}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016070256, iterations_per_second: 62.226762}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014481920, iterations_per_second: 69.051617}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002441, iterations_per_second: 409718.523170}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006308, iterations_per_second: 158518.800319}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000863233, iterations_per_second: 1158.435787}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001769677, iterations_per_second: 565.074976}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008661373, iterations_per_second: 115.455136}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018267687, iterations_per_second: 54.741468}
  xpath:
  xslt:
