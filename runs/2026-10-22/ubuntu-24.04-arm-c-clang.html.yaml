platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001322, iterations_per_second: 756200.847762}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003057, iterations_per_second: 327128.790417}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004983, iterations_per_second: 200702.458528}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000464502, iterations_per_second: 2152.841715}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001622576, iterations_per_second: 616.304078}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001340951, iterations_per_second: 745.739590}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004568213, iterations_per_second: 218.903978}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016327865, iterations_per_second: 61.244994}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013636222, iterations_per_second: 73.334095}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002380, iterations_per_second: 420150.413891}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008535, iterations_per_second: 117168.734721}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000859744, iterations_per_second: 1163.136934}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001761863, iterations_per_second: 567.581128}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008669700, iterations_per_second: 115.344245}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017776262, iterations_per_second: 56.254796}
  xpath:
  xslt:
