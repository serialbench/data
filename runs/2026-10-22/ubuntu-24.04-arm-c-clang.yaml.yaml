platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002792, iterations_per_second: 358153.361668}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004038, iterations_per_second: 247665.750274}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001630650, iterations_per_second: 613.252259}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003952714, iterations_per_second: 252.990730}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021542673, iterations_per_second: 46.419495}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048169766, iterations_per_second: 20.759910}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001150, iterations_per_second: 869867.779094}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001200509, iterations_per_second: 832.980011}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.031234780, iterations_per_second: 32.015593}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004289, iterations_per_second: 233160.017800}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006050, iterations_per_second: 165294.720536}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002639105, iterations_per_second: 378.916289}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005491353, iterations_per_second: 182.104472}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040681527, iterations_per_second: 24.581182}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.069018137, iterations_per_second: 14.488945}
