platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.380', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.36', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.36', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.36', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002757, iterations_per_second: 362660.477253}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003992, iterations_per_second: 250469.630673}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001640490, iterations_per_second: 609.574093}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003953525, iterations_per_second: 252.938812}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021677388, iterations_per_second: 46.131019}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048198290, iterations_per_second: 20.747624}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001186, iterations_per_second: 843525.936629}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001197438, iterations_per_second: 835.116539}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.028945000, iterations_per_second: 34.548281}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004312, iterations_per_second: 231927.082180}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007632, iterations_per_second: 131022.103426}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002656199, iterations_per_second: 376.477864}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005497968, iterations_per_second: 181.885369}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040430153, iterations_per_second: 24.734015}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.069195461, iterations_per_second: 14.451815}
