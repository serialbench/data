    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001422, iterations_per_second: 703086.548858}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001898752, iterations_per_second: 526.661631}
