    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000703600, iterations_per_second: 1421.262754}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001800733, iterations_per_second: 555.329413}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015633111, iterations_per_second: 63.966795}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032523337, iterations_per_second: 30.747152}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000392, iterations_per_second: 2551020.400547}
