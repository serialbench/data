platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001018, iterations_per_second: 982704.403548}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001131, iterations_per_second: 884016.975500}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000711451, iterations_per_second: 1405.578836}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001805548, iterations_per_second: 553.848471}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.017658790, iterations_per_second: 56.629022}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.035120318, iterations_per_second: 28.473546}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000406, iterations_per_second: 2460629.924168}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000380313, iterations_per_second: 2629.415446}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005004127, iterations_per_second: 199.835056}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001775, iterations_per_second: 563539.023919}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001439, iterations_per_second: 694830.460136}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002146982, iterations_per_second: 465.770018}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002046715, iterations_per_second: 488.587810}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.027195878, iterations_per_second: 36.770278}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.038421770, iterations_per_second: 26.026911}
  xpath:
  xslt:
