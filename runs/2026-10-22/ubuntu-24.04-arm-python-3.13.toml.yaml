platform:
  platform_string: ubuntu-24.04-arm-python-3.13
  kind: local
  os: linux
  arch: arm64
  runtime: python
  runtime_version: '3.13'
metadata:
  benchmark_config_path: serialbench-py/py-full-toml.yml
  environment_config_path: python-3.13
  tags:
  - local
  - linux
  - arm64
  - python-3.13
benchmark_config:
  name: py-full-toml
  formats:
  - toml
  operations:
  - parsing
  - generation
  - xpath
  - xquery
  - xslt
  - xslt30
  - validation
  - streaming
  - memory
