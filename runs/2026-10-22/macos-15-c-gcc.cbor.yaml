platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.713189}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000570333, iterations_per_second: 1753.360608}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001315333, iterations_per_second: 760.263558}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007179000, iterations_per_second: 139.295166}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018720000, iterations_per_second: 53.418803}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000318333, iterations_per_second: 3141.361257}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003959000, iterations_per_second: 252.589038}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.294619}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.000468}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001089000, iterations_per_second: 918.273646}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001701333, iterations_per_second: 587.774295}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013896000, iterations_per_second: 71.963155}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.023568000, iterations_per_second: 42.430414}
  xpath:
  xslt:
