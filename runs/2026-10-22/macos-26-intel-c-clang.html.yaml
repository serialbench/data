    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010100, iterations_per_second: 99009.900906}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001246333, iterations_per_second: 802.353570}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005424000, iterations_per_second: 184.365782}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.004521667, iterations_per_second: 221.157390}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.012866000, iterations_per_second: 77.724234}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.049023000, iterations_per_second: 20.398588}
