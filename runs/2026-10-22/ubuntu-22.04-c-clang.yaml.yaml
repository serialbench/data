platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006198, iterations_per_second: 161352.781765}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000005840, iterations_per_second: 171232.876711}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001841419, iterations_per_second: 543.059357}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004291635, iterations_per_second: 233.011410}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.026108626, iterations_per_second: 38.301518}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.053842027, iterations_per_second: 18.572852}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001140, iterations_per_second: 876885.306246}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001250188, iterations_per_second: 799.879698}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.039034440, iterations_per_second: 25.618403}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000008879, iterations_per_second: 112627.832627}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000009126, iterations_per_second: 109583.036511}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003007750, iterations_per_second: 332.474404}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006494682, iterations_per_second: 153.972135}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.048385730, iterations_per_second: 20.667250}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.083195382, iterations_per_second: 12.019898}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001511, iterations_per_second: 661988.612269}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001572913, iterations_per_second: 635.762937}
