platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001605, iterations_per_second: 623130.609590}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004223, iterations_per_second: 236781.663696}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006665, iterations_per_second: 150042.011826}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000476840, iterations_per_second: 2097.139502}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002046973, iterations_per_second: 488.526229}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001372361, iterations_per_second: 728.671246}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004508601, iterations_per_second: 221.798292}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.020329753, iterations_per_second: 49.188989}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014464908, iterations_per_second: 69.132828}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000004883, iterations_per_second: 204775.361260}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008518, iterations_per_second: 117401.206876}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000842542, iterations_per_second: 1186.884922}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001849187, iterations_per_second: 540.778093}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008705632, iterations_per_second: 114.868168}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019325185, iterations_per_second: 51.745947}
  xpath:
  xslt:
