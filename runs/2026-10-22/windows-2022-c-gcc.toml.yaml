platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000004920, iterations_per_second: 203252.032611}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005610, iterations_per_second: 178253.119446}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000114300, iterations_per_second: 8748.906388}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000635600, iterations_per_second: 1573.316551}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001312000, iterations_per_second: 762.195122}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.007428300, iterations_per_second: 134.620303}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000005330, iterations_per_second: 187617.260821}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000137000, iterations_per_second: 7299.270072}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001971800, iterations_per_second: 507.150827}
  xpath:
  xslt:
