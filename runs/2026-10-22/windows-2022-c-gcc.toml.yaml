platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.380', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.36', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.36', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.36', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000480, iterations_per_second: 2083333.333659}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003160, iterations_per_second: 316455.696205}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000052400, iterations_per_second: 19083.969467}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000418933, iterations_per_second: 2387.014640}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000960700, iterations_per_second: 1040.907672}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004797800, iterations_per_second: 208.428863}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000005720, iterations_per_second: 174825.174867}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000098933, iterations_per_second: 10107.816712}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001485500, iterations_per_second: 673.174015}
  xpath:
  xslt:
