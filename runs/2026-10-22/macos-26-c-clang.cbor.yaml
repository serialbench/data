platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.000468}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.586402}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000445000, iterations_per_second: 2247.191011}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001427333, iterations_per_second: 700.607193}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005406000, iterations_per_second: 184.979652}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.021940000, iterations_per_second: 45.578851}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000339000, iterations_per_second: 2949.852507}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004025000, iterations_per_second: 248.447205}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001900, iterations_per_second: 526315.790015}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.333228}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000956000, iterations_per_second: 1046.025105}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001711667, iterations_per_second: 584.225901}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022295000, iterations_per_second: 44.853106}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.021678000, iterations_per_second: 46.129717}
  xpath:
  xslt:
