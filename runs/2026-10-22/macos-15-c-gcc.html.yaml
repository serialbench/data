platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370526}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006200, iterations_per_second: 161290.322618}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000435667, iterations_per_second: 2295.332823}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001421000, iterations_per_second: 703.729768}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001062333, iterations_per_second: 941.324129}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004302000, iterations_per_second: 232.450023}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014280000, iterations_per_second: 70.028011}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010797000, iterations_per_second: 92.618320}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.666732}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000835000, iterations_per_second: 1197.604790}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001421000, iterations_per_second: 703.729768}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008009000, iterations_per_second: 124.859533}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014747000, iterations_per_second: 67.810402}
  xpath:
  xslt:
