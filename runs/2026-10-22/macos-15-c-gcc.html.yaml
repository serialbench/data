platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.381', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.37', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.37', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.37', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.331490}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370526}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003600, iterations_per_second: 277777.777821}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000430333, iterations_per_second: 2323.780015}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001374000, iterations_per_second: 727.802038}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001018000, iterations_per_second: 982.318271}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004192000, iterations_per_second: 238.549618}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014104000, iterations_per_second: 70.901872}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.010684000, iterations_per_second: 93.597903}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002300, iterations_per_second: 434782.608719}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004400, iterations_per_second: 227272.727259}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000799667, iterations_per_second: 1250.521050}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001394333, iterations_per_second: 717.188621}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008268000, iterations_per_second: 120.948234}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015963000, iterations_per_second: 62.644866}
  xpath:
  xslt:
