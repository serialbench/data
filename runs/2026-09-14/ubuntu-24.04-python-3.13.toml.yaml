    comments: false
    arrays_of_tables: true
    inline_tables: true
- name: tomlkit
  format: toml
  version: 0.15.1
  features:
    comments: true
    arrays_of_tables: true
    inline_tables: true
- name: teptris
  format: toml
  version: unknown
  features:
    comments: false
    arrays_of_tables: true
    inline_tables: true
