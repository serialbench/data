    version: '3.5'
    features:
      xpath: true
      namespaces: true
      validation: false
      streaming: true
      stax: false
  - format: xml
    name: leptris
    version: 1.9.156.2
    features:
      xpath: true
      namespaces: true
      validation: true
      streaming: true
      stax: true
