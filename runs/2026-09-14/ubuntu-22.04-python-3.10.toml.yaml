  kind: local
  os: linux
  arch: x86_64
  runtime: python
  runtime_version: '3.10'
metadata:
  benchmark_config_path: serialbench-py/py-full-toml.yml
  environment_config_path: python-3.10
  tags:
  - local
  - linux
  - x86_64
  - python-3.10
benchmark_config:
  name: py-full-toml
  formats:
  - toml
  operations:
  - parsing
  - generation
  - xpath
  - streaming
  - memory
serializers:
