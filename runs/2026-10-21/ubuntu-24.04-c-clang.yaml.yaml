    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004625, iterations_per_second: 216230.241961}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001833601, iterations_per_second: 545.375020}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004490173, iterations_per_second: 222.708585}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024643954, iterations_per_second: 40.577904}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055119536, iterations_per_second: 18.142388}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001288, iterations_per_second: 776156.473132}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001331429, iterations_per_second: 751.072908}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.037850539, iterations_per_second: 26.419703}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006356, iterations_per_second: 157334.130464}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006616, iterations_per_second: 151139.592585}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002958931, iterations_per_second: 337.959930}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006183478, iterations_per_second: 161.721292}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.048282307, iterations_per_second: 20.711521}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078032144, iterations_per_second: 12.815232}
