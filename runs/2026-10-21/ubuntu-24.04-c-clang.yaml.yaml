platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004288, iterations_per_second: 233203.516638}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004699, iterations_per_second: 212820.294506}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001750565, iterations_per_second: 571.244141}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004527676, iterations_per_second: 220.863877}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.023927899, iterations_per_second: 41.792219}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055697319, iterations_per_second: 17.954186}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001276, iterations_per_second: 783453.463461}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001338219, iterations_per_second: 747.262032}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.038539092, iterations_per_second: 25.947679}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006361, iterations_per_second: 157207.986206}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006821, iterations_per_second: 146608.218906}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002887158, iterations_per_second: 346.361370}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006196975, iterations_per_second: 161.369064}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.047221615, iterations_per_second: 21.176743}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.078451469, iterations_per_second: 12.746734}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001622, iterations_per_second: 616522.811647}
