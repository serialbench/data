    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000040200, iterations_per_second: 24875.621897}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.006015000, iterations_per_second: 166.251039}
