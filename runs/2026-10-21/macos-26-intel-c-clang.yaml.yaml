    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.005441333, iterations_per_second: 183.778486}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.020447333, iterations_per_second: 48.906133}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.042225000, iterations_per_second: 23.682652}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.136076000, iterations_per_second: 7.348834}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001407, iterations_per_second: 710782.570057}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002546146, iterations_per_second: 392.750506}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.046596672, iterations_per_second: 21.460760}
  generation:
