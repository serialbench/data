    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010200, iterations_per_second: 98039.215661}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002247667, iterations_per_second: 444.905828}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.009458667, iterations_per_second: 105.723146}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.037731000, iterations_per_second: 26.503406}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.153887000, iterations_per_second: 6.498275}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001795, iterations_per_second: 557040.999751}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002328045, iterations_per_second: 429.545023}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.039609155, iterations_per_second: 25.246689}
  generation:
