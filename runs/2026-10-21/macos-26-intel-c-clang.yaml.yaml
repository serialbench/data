    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000015400, iterations_per_second: 64935.064931}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.005380000, iterations_per_second: 185.873606}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.016112333, iterations_per_second: 62.064257}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.075141000, iterations_per_second: 13.308314}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.198342000, iterations_per_second: 5.041796}
