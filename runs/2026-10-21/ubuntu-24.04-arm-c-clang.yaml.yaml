platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000002756, iterations_per_second: 362871.035643}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003986, iterations_per_second: 250865.485963}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001618189, iterations_per_second: 617.974785}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003958928, iterations_per_second: 252.593631}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021682792, iterations_per_second: 46.119522}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048006729, iterations_per_second: 20.830413}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001150, iterations_per_second: 869338.433748}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001211874, iterations_per_second: 825.168293}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.027660405, iterations_per_second: 36.152761}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004319, iterations_per_second: 231540.438560}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006113, iterations_per_second: 163580.448905}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002651798, iterations_per_second: 377.102583}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005534205, iterations_per_second: 180.694438}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040145289, iterations_per_second: 24.909523}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.069652642, iterations_per_second: 14.356957}
