platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001368, iterations_per_second: 731207.956586}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001176, iterations_per_second: 850195.546021}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000876711, iterations_per_second: 1140.626729}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002002862, iterations_per_second: 499.285439}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023272981, iterations_per_second: 42.968282}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.040124518, iterations_per_second: 24.922418}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000440, iterations_per_second: 2273760.792233}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000429491, iterations_per_second: 2328.337497}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.005413699, iterations_per_second: 184.716587}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002304, iterations_per_second: 433952.439035}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001624, iterations_per_second: 615725.632760}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002954140, iterations_per_second: 338.507954}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002488370, iterations_per_second: 401.869497}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.034517197, iterations_per_second: 28.971066}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.049161325, iterations_per_second: 20.341193}
  xpath:
  xslt:
