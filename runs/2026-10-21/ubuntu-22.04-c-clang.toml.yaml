platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000541, iterations_per_second: 1849454.409824}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001773, iterations_per_second: 564111.242754}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000063310, iterations_per_second: 15795.209837}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000186690, iterations_per_second: 5356.473298}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001160375, iterations_per_second: 861.790370}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002122841, iterations_per_second: 471.066839}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000739, iterations_per_second: 1352630.871471}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000103517, iterations_per_second: 9660.249042}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001582667, iterations_per_second: 631.844854}
  xpath:
  xslt:
