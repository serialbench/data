platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004384, iterations_per_second: 228112.596323}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004022, iterations_per_second: 248626.339437}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001680280, iterations_per_second: 595.139023}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003966523, iterations_per_second: 252.109950}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.021619648, iterations_per_second: 46.254222}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.047967074, iterations_per_second: 20.847634}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001193, iterations_per_second: 837871.807370}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001168640, iterations_per_second: 855.695509}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.029401128, iterations_per_second: 34.012300}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004351, iterations_per_second: 229837.505066}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006112, iterations_per_second: 163601.858483}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002664164, iterations_per_second: 375.352315}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005516251, iterations_per_second: 181.282530}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.040255653, iterations_per_second: 24.841232}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.068579776, iterations_per_second: 14.581558}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001434, iterations_per_second: 697204.209552}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001436295, iterations_per_second: 696.235640}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.033153217, iterations_per_second: 30.162985}
  xpath:
  xslt:
