platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001900, iterations_per_second: 526315.790015}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 399999.999646}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000065667, iterations_per_second: 15228.426395}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000310333, iterations_per_second: 3222.341568}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000721000, iterations_per_second: 1386.962552}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.003045000, iterations_per_second: 328.407225}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.909037}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000137667, iterations_per_second: 7263.922519}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001524000, iterations_per_second: 656.167979}
  xpath:
  xslt:
