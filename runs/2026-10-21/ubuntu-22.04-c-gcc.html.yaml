platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001544, iterations_per_second: 647710.343552}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004477, iterations_per_second: 223343.904931}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005581, iterations_per_second: 179195.412544}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000522749, iterations_per_second: 1912.962746}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002280969, iterations_per_second: 438.410167}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001417714, iterations_per_second: 705.360884}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005042757, iterations_per_second: 198.304221}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.022757345, iterations_per_second: 43.941857}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014315682, iterations_per_second: 69.853466}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002932, iterations_per_second: 341005.967771}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000013456, iterations_per_second: 74315.737838}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000958269, iterations_per_second: 1043.547952}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001821895, iterations_per_second: 548.878951}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009944609, iterations_per_second: 100.556995}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018432228, iterations_per_second: 54.252801}
  xpath:
  xslt:
