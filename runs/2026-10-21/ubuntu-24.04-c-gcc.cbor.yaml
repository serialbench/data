platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001009, iterations_per_second: 990687.570247}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001078, iterations_per_second: 927299.734072}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000728505, iterations_per_second: 1372.673547}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001932552, iterations_per_second: 517.450501}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014337127, iterations_per_second: 69.748981}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.049572691, iterations_per_second: 20.172397}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000299, iterations_per_second: 3341129.100611}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000286720, iterations_per_second: 3487.723213}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003515821, iterations_per_second: 284.428587}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001836, iterations_per_second: 544662.308990}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001529, iterations_per_second: 654022.247987}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002137350, iterations_per_second: 467.869090}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002399923, iterations_per_second: 416.680093}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.024424591, iterations_per_second: 40.942344}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.057417757, iterations_per_second: 17.416215}
  xpath:
  xslt:
