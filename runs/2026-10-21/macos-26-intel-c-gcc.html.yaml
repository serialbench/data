    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009300, iterations_per_second: 107526.881729}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001298333, iterations_per_second: 770.218228}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.006413000, iterations_per_second: 155.933261}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.004218000, iterations_per_second: 237.079184}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.014524000, iterations_per_second: 68.851556}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.047174000, iterations_per_second: 21.198118}
