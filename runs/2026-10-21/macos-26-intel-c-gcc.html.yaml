    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009900, iterations_per_second: 101010.101033}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001183000, iterations_per_second: 845.308538}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.005870000, iterations_per_second: 170.357751}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.003683667, iterations_per_second: 271.468645}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.014419000, iterations_per_second: 69.352937}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.059606000, iterations_per_second: 16.776835}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.044382000, iterations_per_second: 22.531657}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000007000, iterations_per_second: 142857.142754}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000012500, iterations_per_second: 79999.999984}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002664333, iterations_per_second: 375.328412}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.004290667, iterations_per_second: 233.064015}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.032267000, iterations_per_second: 30.991415}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.064328000, iterations_per_second: 15.545330}
