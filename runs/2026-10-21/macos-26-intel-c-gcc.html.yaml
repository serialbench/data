    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.002336667, iterations_per_second: 427.960057}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.004269000, iterations_per_second: 234.246896}
