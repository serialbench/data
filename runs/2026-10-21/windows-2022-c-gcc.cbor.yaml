    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001598767, iterations_per_second: 625.482142}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003385533, iterations_per_second: 295.374436}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013044300, iterations_per_second: 76.661837}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.051787900, iterations_per_second: 19.309530}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000370, iterations_per_second: 2702702.717831}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000355967, iterations_per_second: 2809.251803}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004462100, iterations_per_second: 224.109724}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002520, iterations_per_second: 396825.397111}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003120, iterations_per_second: 320512.820271}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002244500, iterations_per_second: 445.533526}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004124967, iterations_per_second: 242.426201}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023784000, iterations_per_second: 42.045072}
