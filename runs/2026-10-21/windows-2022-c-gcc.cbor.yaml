platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001760, iterations_per_second: 568181.817047}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002520, iterations_per_second: 396825.396216}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001434367, iterations_per_second: 697.171806}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.003349933, iterations_per_second: 298.513403}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.012594000, iterations_per_second: 79.402890}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.048478700, iterations_per_second: 20.627616}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000360, iterations_per_second: 2777777.767247}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000354967, iterations_per_second: 2817.165931}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004463400, iterations_per_second: 224.044450}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 400000.000100}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000003090, iterations_per_second: 323624.595334}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002298900, iterations_per_second: 434.990648}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.004000333, iterations_per_second: 249.979168}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.022797100, iterations_per_second: 43.865228}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.056137700, iterations_per_second: 17.813341}
