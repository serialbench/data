    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000973000, iterations_per_second: 1027.749229}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.004323333, iterations_per_second: 231.303007}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002831000, iterations_per_second: 353.232073}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.012728000, iterations_per_second: 78.566939}
