    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000029500, iterations_per_second: 33898.305092}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.007261000, iterations_per_second: 137.722077}
