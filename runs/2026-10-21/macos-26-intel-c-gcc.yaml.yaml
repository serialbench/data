    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.004610333, iterations_per_second: 216.904056}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.015678000, iterations_per_second: 63.783646}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.057203000, iterations_per_second: 17.481601}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.175812000, iterations_per_second: 5.687894}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000003172, iterations_per_second: 315218.761862}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.003573955, iterations_per_second: 279.802042}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.039842101, iterations_per_second: 25.099078}
  generation:
