platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001366, iterations_per_second: 732332.478752}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000005090, iterations_per_second: 196459.794469}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000004971, iterations_per_second: 201170.814157}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000461861, iterations_per_second: 2165.152023}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001604528, iterations_per_second: 623.236112}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001341344, iterations_per_second: 745.521096}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004584063, iterations_per_second: 218.147089}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016081181, iterations_per_second: 62.184488}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013486995, iterations_per_second: 74.145501}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002388, iterations_per_second: 418795.543884}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006279, iterations_per_second: 159263.565280}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000857238, iterations_per_second: 1166.536727}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001768116, iterations_per_second: 565.573645}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008499188, iterations_per_second: 117.658299}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017705870, iterations_per_second: 56.478445}
  xpath:
  xslt:
