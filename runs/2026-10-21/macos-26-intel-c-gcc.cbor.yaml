    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000007400, iterations_per_second: 135135.135165}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001864000, iterations_per_second: 536.480687}
