    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000006700, iterations_per_second: 149253.731467}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001721000, iterations_per_second: 581.057525}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.006574000, iterations_per_second: 152.114390}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023443000, iterations_per_second: 42.656657}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.176237000, iterations_per_second: 5.674177}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000001100, iterations_per_second: 909090.911386}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.001202667, iterations_per_second: 831.485588}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.015747000, iterations_per_second: 63.504160}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000006700, iterations_per_second: 149253.731214}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000007500, iterations_per_second: 133333.333266}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003123000, iterations_per_second: 320.204931}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.008636000, iterations_per_second: 115.794349}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.183756000, iterations_per_second: 5.441999}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.121712000, iterations_per_second: 8.216117}
