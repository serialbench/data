    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001173000, iterations_per_second: 852.514919}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.005855667, iterations_per_second: 170.774748}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013604000, iterations_per_second: 73.507792}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.057815000, iterations_per_second: 17.296549}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000700, iterations_per_second: 1428571.432178}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000635333, iterations_per_second: 1573.976915}
