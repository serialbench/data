platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001335, iterations_per_second: 749344.322959}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001225, iterations_per_second: 816193.272357}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001059629, iterations_per_second: 943.726828}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002075055, iterations_per_second: 481.915015}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.030434387, iterations_per_second: 32.857570}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.043011020, iterations_per_second: 23.249856}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000398, iterations_per_second: 2514458.130629}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000381035, iterations_per_second: 2624.433122}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004746122, iterations_per_second: 210.698334}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002198, iterations_per_second: 454938.355197}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001781, iterations_per_second: 561387.750536}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.003435612, iterations_per_second: 291.068985}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002585377, iterations_per_second: 386.790735}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.041051851, iterations_per_second: 24.359438}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.050736495, iterations_per_second: 19.709678}
  xpath:
  xslt:
