platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 624999.997137}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270122}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000074667, iterations_per_second: 13392.857143}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000518667, iterations_per_second: 1928.020565}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001385000, iterations_per_second: 722.021661}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.007131000, iterations_per_second: 140.232786}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002400, iterations_per_second: 416666.665745}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000204333, iterations_per_second: 4893.964111}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.003680000, iterations_per_second: 271.739130}
  xpath:
  xslt:
