platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003400, iterations_per_second: 294117.647064}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270122}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001072000, iterations_per_second: 932.835821}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003732333, iterations_per_second: 267.928910}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.020721000, iterations_per_second: 48.260219}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.048911000, iterations_per_second: 20.445299}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002783, iterations_per_second: 359272.831686}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001510194, iterations_per_second: 662.166436}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.024207250, iterations_per_second: 41.309938}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238213}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006300, iterations_per_second: 158730.158773}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002109000, iterations_per_second: 474.158369}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006029667, iterations_per_second: 165.846647}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.029882000, iterations_per_second: 33.464962}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.130029000, iterations_per_second: 7.690592}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000003696, iterations_per_second: 270577.412335}
