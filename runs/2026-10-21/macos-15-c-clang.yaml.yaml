    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001137333, iterations_per_second: 879.249707}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004650667, iterations_per_second: 215.022936}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.020256000, iterations_per_second: 49.368088}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057699000, iterations_per_second: 17.331323}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002212, iterations_per_second: 451977.401400}
