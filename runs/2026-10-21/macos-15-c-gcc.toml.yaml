platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.113916}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.000468}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000038333, iterations_per_second: 26086.956523}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000182000, iterations_per_second: 5494.505494}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000545000, iterations_per_second: 1834.862385}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002103000, iterations_per_second: 475.511175}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000800, iterations_per_second: 1250000.003156}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000085000, iterations_per_second: 11764.705882}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000972000, iterations_per_second: 1028.806584}
  xpath:
  xslt:
