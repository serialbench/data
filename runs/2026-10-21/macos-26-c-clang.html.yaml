    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001482333, iterations_per_second: 674.612098}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001139333, iterations_per_second: 877.706261}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004428000, iterations_per_second: 225.835592}
