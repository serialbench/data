platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004200, iterations_per_second: 238095.238052}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004500, iterations_per_second: 222222.222222}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.000997667, iterations_per_second: 1002.338791}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003693667, iterations_per_second: 270.733688}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.015248000, iterations_per_second: 65.582371}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.065920000, iterations_per_second: 15.169903}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001233, iterations_per_second: 810832.725156}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001163903, iterations_per_second: 859.178127}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.020848375, iterations_per_second: 47.965369}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000005100, iterations_per_second: 196078.431321}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000006000, iterations_per_second: 166666.666693}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001891000, iterations_per_second: 528.820730}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006526333, iterations_per_second: 153.225395}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.028733000, iterations_per_second: 34.803188}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.075000000, iterations_per_second: 13.333333}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001325, iterations_per_second: 754716.979800}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001368917, iterations_per_second: 730.504657}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.025307625, iterations_per_second: 39.513783}
  xpath:
  xslt:
