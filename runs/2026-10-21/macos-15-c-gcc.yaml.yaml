    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002097333, iterations_per_second: 476.795931}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.005139667, iterations_per_second: 194.565147}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.017876000, iterations_per_second: 55.940926}
