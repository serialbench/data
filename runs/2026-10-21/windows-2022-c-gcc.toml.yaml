platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000003550, iterations_per_second: 281690.140654}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000005410, iterations_per_second: 184842.883550}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000108267, iterations_per_second: 9236.453201}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000625900, iterations_per_second: 1597.699313}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001261900, iterations_per_second: 792.455821}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.007318200, iterations_per_second: 136.645623}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000004040, iterations_per_second: 247524.752543}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000083100, iterations_per_second: 12033.694344}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001777600, iterations_per_second: 562.556256}
  xpath:
  xslt:
