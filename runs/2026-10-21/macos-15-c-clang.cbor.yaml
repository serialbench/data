platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 769230.769491}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.665823}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000651667, iterations_per_second: 1534.526854}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001329667, iterations_per_second: 752.068188}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007552000, iterations_per_second: 132.415254}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.020299000, iterations_per_second: 49.263511}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.310170}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000331000, iterations_per_second: 3021.148036}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004135000, iterations_per_second: 241.837969}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001700, iterations_per_second: 588235.293636}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001500, iterations_per_second: 666666.665823}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001140000, iterations_per_second: 877.192982}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001678667, iterations_per_second: 595.710882}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014913000, iterations_per_second: 67.055589}
