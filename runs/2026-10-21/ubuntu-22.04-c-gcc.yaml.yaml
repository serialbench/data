platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000003177, iterations_per_second: 314782.170884}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000003083, iterations_per_second: 324390.956095}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001228063, iterations_per_second: 814.290251}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.002948066, iterations_per_second: 339.205470}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.016724697, iterations_per_second: 59.791816}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.036134249, iterations_per_second: 27.674575}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001321, iterations_per_second: 757002.271485}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001044163, iterations_per_second: 957.704879}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.035953127, iterations_per_second: 27.813992}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004762, iterations_per_second: 209986.980759}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004908, iterations_per_second: 203732.377221}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002148444, iterations_per_second: 465.453209}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004435843, iterations_per_second: 225.436292}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.036359688, iterations_per_second: 27.502986}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.057459713, iterations_per_second: 17.403498}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001569, iterations_per_second: 637226.789234}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001298976, iterations_per_second: 769.836966}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.038584834, iterations_per_second: 25.916919}
  xpath:
  xslt:
