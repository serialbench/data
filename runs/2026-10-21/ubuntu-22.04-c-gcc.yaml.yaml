platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000004282, iterations_per_second: 233535.730943}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000004743, iterations_per_second: 210845.913860}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.001744771, iterations_per_second: 573.141008}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004581745, iterations_per_second: 218.257438}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.024005034, iterations_per_second: 41.657929}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.055983246, iterations_per_second: 17.862487}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001652, iterations_per_second: 605326.876417}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.001968983, iterations_per_second: 507.876315}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.048200073, iterations_per_second: 20.746857}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006250, iterations_per_second: 160007.680328}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000007138, iterations_per_second: 140089.377012}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.003001414, iterations_per_second: 333.176259}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.006785019, iterations_per_second: 147.383515}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.049337908, iterations_per_second: 20.268391}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.085360872, iterations_per_second: 11.714969}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000002002, iterations_per_second: 499550.404263}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.002418029, iterations_per_second: 413.560027}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.052459076, iterations_per_second: 19.062478}
  xpath:
  xslt:
