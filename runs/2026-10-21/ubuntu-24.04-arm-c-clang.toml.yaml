platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000538, iterations_per_second: 1857700.166744}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002288, iterations_per_second: 437082.040310}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000065727, iterations_per_second: 15214.524801}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000194989, iterations_per_second: 5128.503195}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001059906, iterations_per_second: 943.479894}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002337863, iterations_per_second: 427.741061}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000732, iterations_per_second: 1366120.216936}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000088845, iterations_per_second: 11255.515203}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001423717, iterations_per_second: 702.386781}
  xpath:
  xslt:
