    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.004209333, iterations_per_second: 237.567311}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.017208000, iterations_per_second: 58.112506}
