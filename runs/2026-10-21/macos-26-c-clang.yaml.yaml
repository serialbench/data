    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.011256000, iterations_per_second: 88.841507}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.014997000, iterations_per_second: 66.680003}
