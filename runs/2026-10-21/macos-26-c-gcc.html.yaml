platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370136}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002600, iterations_per_second: 384615.384746}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006900, iterations_per_second: 144927.536240}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000571667, iterations_per_second: 1749.271137}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001692333, iterations_per_second: 590.900138}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001424667, iterations_per_second: 701.918577}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005478000, iterations_per_second: 182.548375}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.028241000, iterations_per_second: 35.409511}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017307000, iterations_per_second: 57.780089}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002900, iterations_per_second: 344827.586402}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007900, iterations_per_second: 126582.278482}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001087000, iterations_per_second: 919.963201}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002259667, iterations_per_second: 442.543148}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.016462000, iterations_per_second: 60.745960}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.023946000, iterations_per_second: 41.760628}
