platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.555204}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 400000.000100}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000010000, iterations_per_second: 99999.999997}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000510667, iterations_per_second: 1958.224543}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001818667, iterations_per_second: 549.853372}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001651667, iterations_per_second: 605.449041}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004593000, iterations_per_second: 217.722621}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.014984000, iterations_per_second: 66.737854}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012799000, iterations_per_second: 78.131104}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000004100, iterations_per_second: 243902.438964}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000036800, iterations_per_second: 27173.913045}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001208333, iterations_per_second: 827.586207}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002784000, iterations_per_second: 359.195402}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.014591000, iterations_per_second: 68.535399}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.020203000, iterations_per_second: 49.497599}
  xpath:
  xslt:
