platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001038, iterations_per_second: 963020.030212}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001139, iterations_per_second: 877731.938931}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000700356, iterations_per_second: 1427.845267}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001785646, iterations_per_second: 560.021311}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.017769993, iterations_per_second: 56.274642}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033947627, iterations_per_second: 29.457140}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000390, iterations_per_second: 2566735.106534}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000370501, iterations_per_second: 2699.045617}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004926062, iterations_per_second: 203.001911}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001730, iterations_per_second: 578168.362293}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001470, iterations_per_second: 680087.050083}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002179692, iterations_per_second: 458.780345}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002054160, iterations_per_second: 486.816917}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.026665265, iterations_per_second: 37.501971}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.038656755, iterations_per_second: 25.868700}
  xpath:
  xslt:
