platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001049, iterations_per_second: 953561.550061}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001164, iterations_per_second: 859180.341412}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000716516, iterations_per_second: 1395.641597}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001771060, iterations_per_second: 564.633716}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014405752, iterations_per_second: 69.416716}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.029768127, iterations_per_second: 33.592977}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000391, iterations_per_second: 2556890.825211}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000372242, iterations_per_second: 2686.422017}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004876774, iterations_per_second: 205.053587}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001798, iterations_per_second: 556328.233039}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001478, iterations_per_second: 676452.681601}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001863118, iterations_per_second: 536.734561}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002038030, iterations_per_second: 490.669831}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.023171786, iterations_per_second: 43.155931}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033094943, iterations_per_second: 30.216097}
  xpath:
  xslt:
