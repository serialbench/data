    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.006293333, iterations_per_second: 158.898305}
    - {adapter: libyaml, format: yaml, data_size: medium, time_per_iteration: 0.003977000, iterations_per_second: 251.445813}
    - {adapter: yeptris, format: yaml, data_size: large, time_per_iteration: 0.029889000, iterations_per_second: 33.457125}
    - {adapter: libyaml, format: yaml, data_size: large, time_per_iteration: 0.051644000, iterations_per_second: 19.363334}
    - {adapter: rapidyaml, format: yaml, data_size: small, time_per_iteration: 0.000001142, iterations_per_second: 875886.835722}
    - {adapter: rapidyaml, format: yaml, data_size: medium, time_per_iteration: 0.000899695, iterations_per_second: 1111.488194}
    - {adapter: rapidyaml, format: yaml, data_size: large, time_per_iteration: 0.041007583, iterations_per_second: 24.385734}
  generation:
    - {adapter: yeptris, format: yaml, data_size: small, time_per_iteration: 0.000006400, iterations_per_second: 156250.000048}
    - {adapter: libyaml, format: yaml, data_size: small, time_per_iteration: 0.000010000, iterations_per_second: 99999.999997}
    - {adapter: yeptris, format: yaml, data_size: medium, time_per_iteration: 0.002342000, iterations_per_second: 426.985482}
