platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001383, iterations_per_second: 723013.520889}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003081, iterations_per_second: 324612.088125}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005013, iterations_per_second: 199501.246764}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000457883, iterations_per_second: 2183.964026}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001609292, iterations_per_second: 621.391141}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001348090, iterations_per_second: 741.790053}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004595331, iterations_per_second: 217.612181}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.016021043, iterations_per_second: 62.417909}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.013674209, iterations_per_second: 73.130373}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002394, iterations_per_second: 417658.606313}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006284, iterations_per_second: 159124.180622}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000846181, iterations_per_second: 1181.780723}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001771586, iterations_per_second: 564.465964}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.008552128, iterations_per_second: 116.929962}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.018047994, iterations_per_second: 55.407820}
  xpath:
  xslt:
