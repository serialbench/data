platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001300, iterations_per_second: 769230.769491}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001400, iterations_per_second: 714285.713189}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000608667, iterations_per_second: 1642.935378}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001215000, iterations_per_second: 823.045267}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.007695000, iterations_per_second: 129.954516}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.016881000, iterations_per_second: 59.238197}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000298000, iterations_per_second: 3355.704698}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003783000, iterations_per_second: 264.340471}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.556081}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.556081}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001122000, iterations_per_second: 891.265597}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001687667, iterations_per_second: 592.534071}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.014699000, iterations_per_second: 68.031839}
