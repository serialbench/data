    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001200, iterations_per_second: 833333.333464}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000890667, iterations_per_second: 1122.754491}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001437333, iterations_per_second: 695.732839}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.009135000, iterations_per_second: 109.469075}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.026098000, iterations_per_second: 38.317112}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.310170}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000326333, iterations_per_second: 3064.351379}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004155000, iterations_per_second: 240.673887}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.000468}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.000468}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001287667, iterations_per_second: 776.598499}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001883667, iterations_per_second: 530.879490}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.025313000, iterations_per_second: 39.505392}
