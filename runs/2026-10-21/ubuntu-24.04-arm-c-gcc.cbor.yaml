platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001356, iterations_per_second: 737517.511639}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001230, iterations_per_second: 812743.819732}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000730327, iterations_per_second: 1369.250290}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001910667, iterations_per_second: 523.377347}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.015636163, iterations_per_second: 63.954309}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.032529870, iterations_per_second: 30.740977}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000374, iterations_per_second: 2676659.572156}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000324105, iterations_per_second: 3085.423022}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004211563, iterations_per_second: 237.441539}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001785, iterations_per_second: 560318.261369}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001531, iterations_per_second: 653125.205377}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.001983215, iterations_per_second: 504.231765}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002158911, iterations_per_second: 463.196563}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.024216632, iterations_per_second: 41.293934}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.036747969, iterations_per_second: 27.212388}
  xpath:
  xslt:
