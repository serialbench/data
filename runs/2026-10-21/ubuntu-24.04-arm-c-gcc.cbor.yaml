platform:
  platform_string: ubuntu-24.04-arm-c-native
  kind: native
  os: linux
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001389, iterations_per_second: 720097.932136}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001238, iterations_per_second: 807558.749113}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000706391, iterations_per_second: 1415.646575}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001893915, iterations_per_second: 528.006801}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.016485941, iterations_per_second: 60.657745}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.033800888, iterations_per_second: 29.585022}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000428, iterations_per_second: 2336994.627522}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000327129, iterations_per_second: 3056.901158}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.004162440, iterations_per_second: 240.243703}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001697, iterations_per_second: 589379.384725}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000001546, iterations_per_second: 646997.928423}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002069935, iterations_per_second: 483.106880}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.002161109, iterations_per_second: 462.725388}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.025530619, iterations_per_second: 39.168655}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.037529049, iterations_per_second: 26.646026}
  xpath:
  xslt:
