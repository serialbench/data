platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000577, iterations_per_second: 1732801.943509}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000002035, iterations_per_second: 491448.791217}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000074089, iterations_per_second: 13497.219574}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000205964, iterations_per_second: 4855.209559}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001625921, iterations_per_second: 615.036032}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002417540, iterations_per_second: 413.643621}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000818, iterations_per_second: 1223241.589475}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000116533, iterations_per_second: 8581.284790}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002047344, iterations_per_second: 488.437703}
  xpath:
  xslt:
