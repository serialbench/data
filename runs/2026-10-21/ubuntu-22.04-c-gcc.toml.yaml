platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000579, iterations_per_second: 1726817.481888}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000003441, iterations_per_second: 290579.415610}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000079899, iterations_per_second: 12515.801200}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000399666, iterations_per_second: 2502.087158}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001715894, iterations_per_second: 582.786582}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004826822, iterations_per_second: 207.175653}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000000800, iterations_per_second: 1249219.240509}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000134528, iterations_per_second: 7433.415183}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002137130, iterations_per_second: 467.917254}
  xpath:
  xslt:
