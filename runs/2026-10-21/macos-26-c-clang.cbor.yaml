platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
    - {name: tinycbor, format: cbor, version: '0.6', features: {}}
benchmark_result:
  parsing:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 624999.999358}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370526}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000411667, iterations_per_second: 2429.149798}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001333333, iterations_per_second: 750.000000}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005191000, iterations_per_second: 192.641110}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.016246000, iterations_per_second: 61.553613}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
    - {adapter: tinycbor, format: cbor, data_size: medium, time_per_iteration: 0.000298667, iterations_per_second: 3348.214286}
    - {adapter: tinycbor, format: cbor, data_size: large, time_per_iteration: 0.003827000, iterations_per_second: 261.301280}
  generation:
    - {adapter: yeptris, format: cbor, data_size: small, time_per_iteration: 0.000002000, iterations_per_second: 500000.000552}
    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 400000.000100}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000860667, iterations_per_second: 1161.890008}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001541333, iterations_per_second: 648.788927}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.011007000, iterations_per_second: 90.851276}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.019706000, iterations_per_second: 50.745966}
  xpath:
  xslt:
