platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001437, iterations_per_second: 695845.802344}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003584, iterations_per_second: 279041.214066}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005382, iterations_per_second: 185790.725455}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000486973, iterations_per_second: 2053.501940}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002235362, iterations_per_second: 447.354769}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001333809, iterations_per_second: 749.732533}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004761112, iterations_per_second: 210.034967}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.022064106, iterations_per_second: 45.322480}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014380950, iterations_per_second: 69.536435}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002682, iterations_per_second: 372897.788837}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006671, iterations_per_second: 149895.822350}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000960288, iterations_per_second: 1041.354260}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001795923, iterations_per_second: 556.816642}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009336992, iterations_per_second: 107.100874}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019151838, iterations_per_second: 52.214310}
  xpath:
  xslt:
