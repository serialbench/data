platform:
  platform_string: ubuntu-22.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.13', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.34', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.13.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.2', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001399, iterations_per_second: 714745.193186}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003950, iterations_per_second: 253170.966561}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005181, iterations_per_second: 193024.108585}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000453882, iterations_per_second: 2203.215814}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002172492, iterations_per_second: 460.300960}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001282498, iterations_per_second: 779.728514}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004430391, iterations_per_second: 225.713712}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.020522189, iterations_per_second: 48.727745}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.012972568, iterations_per_second: 77.085740}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002726, iterations_per_second: 366824.400973}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006566, iterations_per_second: 152304.364951}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000951492, iterations_per_second: 1050.980986}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001677779, iterations_per_second: 596.025937}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009718217, iterations_per_second: 102.899534}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017070384, iterations_per_second: 58.580990}
