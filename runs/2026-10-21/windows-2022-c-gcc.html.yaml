platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001580, iterations_per_second: 632911.393548}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004510, iterations_per_second: 221729.489911}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007130, iterations_per_second: 140252.454414}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000471433, iterations_per_second: 2121.190695}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002078433, iterations_per_second: 481.131622}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002053867, iterations_per_second: 486.886523}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004879900, iterations_per_second: 204.922232}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.020795300, iterations_per_second: 48.087789}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.020154800, iterations_per_second: 49.615972}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003560, iterations_per_second: 280898.876037}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008900, iterations_per_second: 112359.550558}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000912567, iterations_per_second: 1095.810352}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002913200, iterations_per_second: 343.265138}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009467300, iterations_per_second: 105.626736}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.029541300, iterations_per_second: 33.850914}
  xpath:
