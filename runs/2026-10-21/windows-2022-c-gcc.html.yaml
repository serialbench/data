platform:
  platform_string: windows-2022-c-native
  kind: native
  os: windows
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.45', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001570, iterations_per_second: 636942.674922}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000004430, iterations_per_second: 225733.634244}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000007070, iterations_per_second: 141442.715625}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000474600, iterations_per_second: 2107.037505}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002183767, iterations_per_second: 457.924381}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001874867, iterations_per_second: 533.371262}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004802400, iterations_per_second: 208.229219}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.021666500, iterations_per_second: 46.154201}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019581000, iterations_per_second: 51.069915}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003550, iterations_per_second: 281690.140654}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000008820, iterations_per_second: 113378.684816}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000925367, iterations_per_second: 1080.652714}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002603833, iterations_per_second: 384.049158}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009283600, iterations_per_second: 107.716834}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.026625100, iterations_per_second: 37.558544}
  xpath:
  xslt:
