platform:
  platform_string: ubuntu-24.04-c-native
  kind: native
  os: linux
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.9.14', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.39', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.14', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001369, iterations_per_second: 730513.559405}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000003571, iterations_per_second: 280057.133032}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005280, iterations_per_second: 189390.353950}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000506086, iterations_per_second: 1975.948752}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.002058679, iterations_per_second: 485.748464}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001327672, iterations_per_second: 753.198079}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.005088982, iterations_per_second: 196.502955}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.020306799, iterations_per_second: 49.244590}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.014859475, iterations_per_second: 67.297129}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002584, iterations_per_second: 387011.887396}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000006768, iterations_per_second: 147756.320190}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000933401, iterations_per_second: 1071.350899}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001761973, iterations_per_second: 567.545587}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.009747345, iterations_per_second: 102.592039}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.019052800, iterations_per_second: 52.485724}
  xpath:
  xslt:
