platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000003000, iterations_per_second: 333333.333228}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000007000, iterations_per_second: 142857.142870}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000009100, iterations_per_second: 109890.109893}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000474333, iterations_per_second: 2108.222066}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001768333, iterations_per_second: 565.504241}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001091333, iterations_per_second: 916.310324}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.004487000, iterations_per_second: 222.866058}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.109697000, iterations_per_second: 9.116020}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.080429000, iterations_per_second: 12.433326}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000005700, iterations_per_second: 175438.596409}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000011400, iterations_per_second: 87719.298248}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001030000, iterations_per_second: 970.873786}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.001685667, iterations_per_second: 593.237097}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.021971000, iterations_per_second: 45.514542}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.045373000, iterations_per_second: 22.039539}
  xpath:
  xslt:
