platform:
  platform_string: macos-15-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: clang
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000001600, iterations_per_second: 625000.000468}
    - {adapter: leptris-whatwg, format: html, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.370136}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000003700, iterations_per_second: 270270.270330}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.000457667, iterations_per_second: 2184.996358}
    - {adapter: leptris-whatwg, format: html, data_size: medium, time_per_iteration: 0.001617333, iterations_per_second: 618.301731}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002132333, iterations_per_second: 468.969830}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.006776000, iterations_per_second: 147.579693}
    - {adapter: leptris-whatwg, format: html, data_size: large, time_per_iteration: 0.026608000, iterations_per_second: 37.582682}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.015680000, iterations_per_second: 63.775510}
  generation:
    - {adapter: leptris, format: html, data_size: small, time_per_iteration: 0.000002800, iterations_per_second: 357142.857320}
    - {adapter: libxml2, format: html, data_size: small, time_per_iteration: 0.000005300, iterations_per_second: 188679.245253}
    - {adapter: leptris, format: html, data_size: medium, time_per_iteration: 0.001169000, iterations_per_second: 855.431993}
    - {adapter: libxml2, format: html, data_size: medium, time_per_iteration: 0.002189000, iterations_per_second: 456.829603}
    - {adapter: leptris, format: html, data_size: large, time_per_iteration: 0.016049000, iterations_per_second: 62.309178}
    - {adapter: libxml2, format: html, data_size: large, time_per_iteration: 0.017902000, iterations_per_second: 55.859680}
  xpath:
  xslt:
