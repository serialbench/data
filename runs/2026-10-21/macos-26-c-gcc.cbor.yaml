    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.000438333, iterations_per_second: 2281.368821}
    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.001399667, iterations_per_second: 714.455823}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.005545000, iterations_per_second: 180.342651}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.018290000, iterations_per_second: 54.674686}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000300, iterations_per_second: 3333333.341749}
