platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000031400, iterations_per_second: 31847.133758}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000015100, iterations_per_second: 66225.165556}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000038667, iterations_per_second: 25862.068967}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000530000, iterations_per_second: 1886.792453}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000811000, iterations_per_second: 1233.045623}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.004324000, iterations_per_second: 231.267345}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000012400, iterations_per_second: 80645.161291}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000076000, iterations_per_second: 13157.894737}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000956000, iterations_per_second: 1046.025105}
  xpath:
  xslt:
