platform:
  platform_string: macos-26-c-native
  kind: native
  os: macos
  arch: arm64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.4', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002100, iterations_per_second: 476190.476104}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000006800, iterations_per_second: 147058.823532}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000043667, iterations_per_second: 22900.763357}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000211333, iterations_per_second: 4731.861199}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000555000, iterations_per_second: 1801.801802}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.002254000, iterations_per_second: 443.655723}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002200, iterations_per_second: 454545.454519}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000086667, iterations_per_second: 11538.461539}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.000968000, iterations_per_second: 1033.057851}
  xpath:
  xslt:
