    - {adapter: libcbor, format: cbor, data_size: medium, time_per_iteration: 0.005174667, iterations_per_second: 193.249163}
    - {adapter: yeptris, format: cbor, data_size: large, time_per_iteration: 0.013891000, iterations_per_second: 71.989058}
    - {adapter: libcbor, format: cbor, data_size: large, time_per_iteration: 0.075738000, iterations_per_second: 13.203412}
    - {adapter: tinycbor, format: cbor, data_size: small, time_per_iteration: 0.000000900, iterations_per_second: 1111111.113916}
