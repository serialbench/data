    - {adapter: libcbor, format: cbor, data_size: small, time_per_iteration: 0.000005700, iterations_per_second: 175438.596584}
    - {adapter: yeptris, format: cbor, data_size: medium, time_per_iteration: 0.002709333, iterations_per_second: 369.094488}
