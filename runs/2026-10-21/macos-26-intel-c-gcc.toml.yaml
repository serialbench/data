platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000001800, iterations_per_second: 555555.555204}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000004000, iterations_per_second: 249999.999921}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000083000, iterations_per_second: 12048.192771}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000430333, iterations_per_second: 2323.780015}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001187000, iterations_per_second: 842.459983}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.006445000, iterations_per_second: 155.159038}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002700, iterations_per_second: 370370.369746}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000180333, iterations_per_second: 5545.286506}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.002487000, iterations_per_second: 402.090873}
  xpath:
  xslt:
