platform:
  platform_string: macos-26-intel-c-native
  kind: native
  os: macos
  arch: x86_64
  runtime: c
  runtime_version: gcc
benchmark_config:
  name: c-full
  formats: [xml, html, json, yaml, toml]
  operations: [parsing, xslt]
serializers:
    - {name: leptris, format: xml, version: '1.9.379', features: {xpath: true, html5: true, xslt: true}}
    - {name: libxml2, format: xml, version: '2.15.3', features: {xpath: true}}
    - {name: libxslt, format: xml, version: '1.1.35', features: {xslt: true}}
    - {name: yeptris, format: json, version: '0.6.35', features: {}}
    - {name: yeptris, format: yaml, version: '0.6.35', features: {}}
    - {name: jansson, format: json, version: '2.15.1', features: {}}
    - {name: nlohmann-json, format: json, version: '3.x', features: {}}
    - {name: rapidyaml, format: yaml, version: '0.7', features: {}}
    - {name: tomlc17, format: toml, version: '0.x', features: {}}
    - {name: libyaml, format: yaml, version: '0.2.5', features: {}}
    - {name: teptris, format: toml, version: '0.3.7', features: {}}
    - {name: libcbor, format: cbor, version: '0.14', features: {}}
    - {name: yeptris, format: cbor, version: '0.6.35', features: {}}
    - {name: simdjson, format: json, version: '3.13.0', features: {}}
    - {name: pugixml, format: xml, version: '1.16', features: {}}
benchmark_result:
  parsing:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000002500, iterations_per_second: 400000.001010}
    - {adapter: tomlc17, format: toml, data_size: small, time_per_iteration: 0.000007400, iterations_per_second: 135135.135061}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000160333, iterations_per_second: 6237.006238}
    - {adapter: tomlc17, format: toml, data_size: medium, time_per_iteration: 0.000901667, iterations_per_second: 1109.057301}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.001909000, iterations_per_second: 523.834468}
    - {adapter: tomlc17, format: toml, data_size: large, time_per_iteration: 0.009058000, iterations_per_second: 110.399647}
  generation:
    - {adapter: teptris, format: toml, data_size: small, time_per_iteration: 0.000003900, iterations_per_second: 256410.256310}
    - {adapter: teptris, format: toml, data_size: medium, time_per_iteration: 0.000313667, iterations_per_second: 3188.097768}
    - {adapter: teptris, format: toml, data_size: large, time_per_iteration: 0.004005000, iterations_per_second: 249.687890}
  xpath:
  xslt:
